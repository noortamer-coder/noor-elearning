{l:1,q:"Ozonolysis of an alkene followed by Zn/H₂O gives:",o:["Alcohols","Aldehydes and/or ketones","Acids only","Alkanes"],a:1,e:"Reductive work-up stops at carbonyls."},
{l:1,q:"Hydration of a terminal alkyne (HgSO₄/H₂SO₄) gives:",o:["An aldehyde","A methyl ketone","A carboxylic acid","An alcohol"],a:1,e:"Markovnikov; via enol tautomerization."},
{l:1,q:"Hydroboration–oxidation of a terminal alkyne gives:",o:["A methyl ketone","An aldehyde","An alkene","An ester"],a:1,e:"Anti-Markovnikov enol → aldehyde."},
{l:1,q:"Friedel–Crafts acylation of benzene with CH₃COCl/AlCl₃ gives:",o:["Toluene","Acetophenone","Benzaldehyde","Phenol"],a:1,e:"An aryl ketone."},
{l:1,q:"Rosenmund reduction converts acid chlorides to:",o:["Alcohols","Aldehydes","Ketones","Alkanes"],a:1,e:"H₂/Pd–BaSO₄ (poisoned)."},
{l:1,q:"Gattermann–Koch reaction (CO + HCl, AlCl₃/CuCl) on benzene gives:",o:["Benzaldehyde","Acetophenone","Benzoic acid","Chlorobenzene"],a:0,e:"Formylation of arenes."},
{l:1,q:"Etard reaction (CrO₂Cl₂) converts toluene to:",o:["Benzoic acid","Benzaldehyde","Benzyl alcohol","Phenol"],a:1,e:"Stops at the aldehyde."},
{l:1,q:"Reaction of a nitrile with a Grignard reagent then hydrolysis gives:",o:["Aldehyde","Ketone","Primary amine","Alcohol"],a:1,e:"Via an imine salt."},
{l:2,q:"The characteristic reaction of aldehydes and ketones is:",o:["Electrophilic addition","Nucleophilic addition","Free-radical substitution","Electrophilic substitution"],a:1,e:"Nucleophile attacks the electrophilic carbonyl carbon."},
{l:2,q:"Aldehydes are generally more reactive than ketones because of:",o:["Larger size","Less steric hindrance and fewer electron-donating alkyl groups","Higher molecular weight","Aromaticity"],a:1,e:"Both steric and electronic reasons."},
{l:2,q:"Nucleophilic addition to a carbonyl changes carbon hybridization from:",o:["sp³ to sp²","sp² to sp³","sp to sp²","Unchanged"],a:1,e:"A tetrahedral intermediate forms."},
{l:2,q:"Attack of a nucleophile on an unsymmetrical ketone (e.g. butanone) creates:",o:["A meso compound","A racemic mixture (attack from both faces)","A single enantiomer","No stereocentre"],a:1,e:"The planar carbonyl is attacked equally from both faces."},
{l:2,q:"HCN adds to carbonyls to give:",o:["Imines","Cyanohydrins","Acetals","Hydrates"],a:1,e:"Catalysed by base (CN⁻)."},
{l:2,q:"Aldehydes react with excess alcohol in acid to form:",o:["Hemiacetals only","Acetals","Ketals only from aldehydes","Esters"],a:1,e:"Hemiacetal is the intermediate."},
{l:2,q:"Acetals are useful as:",o:["Oxidants","Protecting groups for carbonyls (stable in base)","Acids","Catalysts"],a:1,e:"Removed by aqueous acid."},
{l:2,q:"Primary amines react with aldehydes/ketones to give:",o:["Enamines","Imines (Schiff bases)","Amides","Nitriles"],a:1,e:"Secondary amines give enamines."},

{l:2,q:"2,4-Dinitrophenylhydrazine gives with carbonyls:",o:["A colourless solution","Yellow/orange-red precipitate (2,4-DNP derivative)","A silver mirror","Blue colour"],a:1,e:"A general test for C=O."},
{l:2,q:"Grignard reagent with formaldehyde, then H₃O⁺, gives:",o:["Primary alcohol","Secondary alcohol","Tertiary alcohol","Ketone"],a:0,e:"Other aldehydes → 2°; ketones → 3°."},
{l:2,q:"Grignard reagent with a ketone, then H₃O⁺, gives:",o:["Primary alcohol","Secondary alcohol","Tertiary alcohol","Aldehyde"],a:2,e:"Two R groups already on carbonyl carbon."},
{l:2,q:"NaBH₄ reduces aldehydes to:",o:["Primary alcohols","Secondary alcohols","Alkanes","Acids"],a:0,e:"Ketones → secondary alcohols."},
{l:2,q:"Clemmensen reduction (Zn(Hg)/HCl) converts C=O to:",o:["CH–OH","CH₂","C=C","COOH"],a:1,e:"For acid-stable compounds."},
{l:2,q:"Wolff–Kishner reduction uses:",o:["Zn(Hg)/HCl","NH₂NH₂/KOH, heat","LiAlH₄","H₂/Pd"],a:1,e:"For base-stable compounds; C=O → CH₂."},
{l:2,q:"The Wittig reaction converts a carbonyl into:",o:["An alcohol","An alkene","An ester","An amine"],a:1,e:"Using a phosphorus ylide."},
{l:2,q:"Tollens' reagent gives a silver mirror with:",o:["Ketones","Aldehydes","Ethers","Alkanes"],a:1,e:"Aldehydes are oxidized to carboxylates."},
{l:2,q:"Fehling's solution gives a red precipitate of:",o:["Ag","Cu₂O","CuO","Fe₂O₃"],a:1,e:"Aliphatic aldehydes reduce Cu²⁺."},
{l:3,q:"An α-hydrogen is a hydrogen on the carbon:",o:["Of the carbonyl itself","Adjacent to the carbonyl","Two carbons away","On oxygen"],a:1,e:"It is acidic (pKa ~19–20 for ketones)."},
{l:3,q:"α-Hydrogens are acidic because the conjugate base (enolate) is:",o:["Unstable","Resonance-stabilized with charge on oxygen","Aromatic","A radical"],a:1,e:"Delocalization onto O."},

{l:3,q:"The aldol product of acetaldehyde is:",o:["3-Hydroxybutanal","Butanone","Crotonic acid","Ethanol"],a:0,e:"Dehydration gives crotonaldehyde (but-2-enal)."},
{l:3,q:"Heating an aldol product gives:",o:["An alcohol","An α,β-unsaturated carbonyl","An acid","An ether"],a:1,e:"Loss of water."},
{l:3,q:"The Cannizzaro reaction occurs with aldehydes that:",o:["Have α-H","Lack α-H, in concentrated base","Are ketones","Are acidic"],a:1,e:"E.g. HCHO, benzaldehyde."},

{l:3,q:"The carboxyl group combines:",o:["C=O and –OH","C=O and –NH₂","C–O–C","C≡N"],a:0,e:"–COOH."},

{l:4,q:"p-Nitrobenzoic acid is ___ than benzoic acid.",o:["Less acidic","More acidic","Equally acidic","Not acidic"],a:1,e:"NO₂ withdraws by −I and −M."},
{l:4,q:"p-Methoxybenzoic acid is ___ than benzoic acid.",o:["More acidic","Less acidic","Equal","Basic"],a:1,e:"OCH₃ donates by +M."},
{l:4,q:"Ortho-substituted benzoic acids are usually stronger acids due to the:",o:["Ortho effect (steric + electronic)","Para effect","Meta effect","No effect"],a:0,e:"Almost any ortho group increases acidity."},
{l:4,q:"Carboxylic acids react with NaHCO₃ to release:",o:["H₂","CO₂","O₂","Cl₂"],a:1,e:"Phenols generally do not — a distinguishing test."},
{l:4,q:"Oxidation of toluene with hot KMnO₄ gives:",o:["Benzaldehyde","Benzoic acid","Benzyl alcohol","Phenol"],a:1,e:"Side-chain oxidation to –COOH."},
{l:4,q:"Hydrolysis of a nitrile (R–C≡N) in acid gives:",o:["Amine","Carboxylic acid","Aldehyde","Ketone"],a:1,e:"Via the amide."},
{l:4,q:"Grignard reagent + CO₂ then H₃O⁺ gives:",o:["Alcohol","Carboxylic acid with one extra carbon","Ketone","Aldehyde"],a:1,e:"Carboxylation."},
{l:4,q:"Fischer esterification is reaction of a carboxylic acid with:",o:["An amine","An alcohol in acid catalysis","SOCl₂","NaOH"],a:1,e:"Reversible; water removed to drive it."},
{l:4,q:"SOCl₂ converts carboxylic acids to:",o:["Esters","Acid chlorides","Amides","Anhydrides"],a:1,e:"By-products SO₂ and HCl are gases."},
{l:4,q:"LiAlH₄ reduces carboxylic acids to:",o:["Aldehydes","Primary alcohols","Alkanes","Ketones"],a:1,e:"NaBH₄ cannot reduce acids."},
{l:4,q:"Heating a β-keto acid or malonic acid causes:",o:["Esterification","Decarboxylation (loss of CO₂)","Hydration","Polymerization"],a:1,e:"Via a cyclic transition state."},
{l:4,q:"Hell–Volhard–Zelinsky reaction introduces:",o:["α-Halogen into carboxylic acids (Br₂/P)","OH at para position","A nitro group","An ester group"],a:0,e:"α-Bromination."},
{l:5,q:"Conformations are:",o:["Isomers requiring bond breaking","Different spatial arrangements from rotation about single bonds","Structural isomers","Enantiomers only"],a:1,e:"Interconvert readily at room temperature."},
{l:5,q:"In ethane, the more stable conformation is:",o:["Eclipsed","Staggered","Both equal","Boat"],a:1,e:"Less torsional strain."},
{l:5,q:"The energy barrier for ethane rotation is about:",o:["0.3 kcal/mol","3 kcal/mol (12 kJ/mol)","30 kcal/mol","300 kcal/mol"],a:1,e:"Small, so rotation is fast."},
{l:5,q:"In butane, the most stable conformation is:",o:["Gauche","Anti","Fully eclipsed","Partially eclipsed"],a:1,e:"Methyls 180° apart."},
{l:5,q:"Gauche butane is less stable than anti because of:",o:["Torsional strain only","Steric strain between methyl groups at 60°","Angle strain","Ring strain"],a:1,e:"~0.9 kcal/mol."},
{l:5,q:"The most stable conformation of cyclohexane is:",o:["Boat","Chair","Twist-boat","Planar"],a:1,e:"Free of angle and torsional strain."},
{l:5,q:"Bond angles in chair cyclohexane are about:",o:["90°","109.5°","120°","180°"],a:1,e:"Tetrahedral, no angle strain."},
{l:5,q:"The boat conformation is destabilized by:",o:["Flagpole interactions and eclipsing","Angle strain","Aromaticity","Hydrogen bonds"],a:0,e:"Twist-boat relieves some strain."},
{l:5,q:"Each carbon in chair cyclohexane has:",o:["Two axial H","One axial and one equatorial H","Two equatorial H","No H"],a:1,e:"6 axial + 6 equatorial positions."},
{l:5,q:"Axial bonds are:",o:["Roughly in the ring plane","Parallel to the ring's axis (up/down)","At 45°","Absent"],a:1,e:"Equatorial bonds point outward around the ring."},
{l:5,q:"Ring flipping converts axial substituents to:",o:["Axial","Equatorial","Planar","Eclipsed"],a:1,e:"And equatorial to axial."},
{l:5,q:"A bulky substituent prefers the equatorial position to avoid:",o:["Torsional strain","1,3-Diaxial interactions","Angle strain","Resonance"],a:1,e:"Steric clash with axial H on C3 and C5."},
{l:5,q:"tert-Butylcyclohexane exists almost entirely with t-Bu:",o:["Axial","Equatorial","Both equally","In boat form"],a:1,e:"It 'locks' the conformation."},
{l:5,q:"In cis-1,2-disubstituted cyclohexane, substituents are:",o:["Both equatorial","One axial, one equatorial","Both axial","Planar"],a:1,e:"Trans-1,2 can be diequatorial."},
{l:5,q:"The more stable isomer of 1,4-dimethylcyclohexane is:",o:["cis","trans (diequatorial)","Both equal","Neither"],a:1,e:"Trans can be e,e."},
{l:5,q:"In cis-1,3-dimethylcyclohexane the most stable conformer is:",o:["Diaxial","Diequatorial","Axial–equatorial","Boat"],a:1,e:"Cis-1,3 can be e,e."},
{l:5,q:"Cyclopropane is highly strained because its bond angle is:",o:["60° vs 109.5° ideal","109.5°","120°","90°"],a:0,e:"Baeyer angle strain."},
{l:5,q:"Newman projection views a molecule:",o:["From above the ring","Along a C–C bond","As a 2D skeletal formula","As a wedge-dash drawing only"],a:1,e:"Front carbon a point, back carbon a circle."},
{l:6,q:"A heterocycle contains in its ring:",o:["Only carbon","At least one atom other than carbon","Only nitrogen","Metals only"],a:1,e:"Common heteroatoms: O, S, N."},
{l:6,q:"In Hantzsch–Widman nomenclature the prefix for oxygen is:",o:["Thia","Aza","Oxa","Phospha"],a:2,e:"S = thia, N = aza."},
{l:6,q:"When several heteroatoms are present, priority order is:",o:["N > O > S","O > S > N","S > O > N","N > S > O"],a:1,e:"O takes precedence and gets the lowest number."},
{l:6,q:"The final 'a' of a prefix is dropped before:",o:["A consonant","A vowel","A number","Nothing"],a:1,e:"E.g. oxa + irane → oxirane."},
{l:6,q:"The Hantzsch–Widman stem for a saturated 3-membered ring without N is:",o:["-irene","-irane","-ole","-ine"],a:1,e:"With N: -iridine."},
{l:6,q:"The stem for an unsaturated 5-membered ring is:",o:["-olane","-ole","-ine","-epine"],a:1,e:"Saturated 5-ring: -olane (with N: -olidine)."},
{l:6,q:"A saturated 5-membered ring with one oxygen is named:",o:["Oxole","Oxolane","Oxirane","Oxane"],a:1,e:"Common name tetrahydrofuran."},
{l:6,q:"Furan in Hantzsch–Widman terms is:",o:["Oxolane","Oxole","Oxane","Oxirene"],a:1,e:"Unsaturated 5-ring with O."},
{l:6,q:"Thiophene contains:",o:["O","S","N","P"],a:1,e:"Thiole in H–W naming."},
{l:6,q:"Pyrrole is a 5-membered ring with:",o:["One O","One S","One NH","Two N"],a:2,e:"Aromatic, lone pair in the π system."},
{l:6,q:"Pyridine is:",o:["5-membered with N","6-membered aromatic with one N","6-membered with O","Saturated"],a:1,e:"Azine in H–W terms."},
{l:6,q:"Saturated 6-membered ring with one N is:",o:["Pyridine","Piperidine","Pyrrolidine","Morpholine"],a:1,e:"Saturated pyrrole = pyrrolidine."},
{l:6,q:"Imidazole has nitrogens at positions:",o:["1,2","1,3","1,4","2,3"],a:1,e:"Pyrazole is 1,2-diazole."},
{l:6,q:"Pyrazole is:",o:["1,3-Diazole","1,2-Diazole","1,3-Oxazole","Thiazole"],a:1,e:"Adjacent nitrogens."},
{l:6,q:"Thiazole contains:",o:["S and N at 1,3","O and N at 1,2","Two S","S and O"],a:0,e:"Present in vitamin B1 and penicillin."},
{l:6,q:"Oxazole versus isoxazole: isoxazole has O and N at:",o:["1,3","1,2","1,4","2,5"],a:1,e:"Oxazole is 1,3."},
{l:6,q:"Pyrimidine has nitrogens at positions:",o:["1,2","1,3","1,4","2,4"],a:1,e:"Pyrazine is 1,4; pyridazine 1,2."},
{l:6,q:"Pyrazine is:",o:["1,2-Diazine","1,3-Diazine","1,4-Diazine","Triazine"],a:2,e:"Nitrogens para to each other."},
{l:6,q:"Indole is benzene fused to:",o:["Pyridine","Pyrrole","Furan","Thiophene"],a:1,e:"Benzopyrrole; in tryptophan."},
{l:6,q:"Quinoline is benzene fused to pyridine with N at position:",o:["1","2","3","4"],a:0,e:"Isoquinoline has N at 2."},
{l:6,q:"Purine is a fusion of:",o:["Pyrimidine and imidazole","Pyridine and pyrrole","Benzene and furan","Two pyridines"],a:0,e:"Adenine and guanine are purines."},
{l:6,q:"The 7-membered unsaturated ring stem is:",o:["-ine","-epine","-ocine","-ole"],a:1,e:"E.g. azepine; 8-membered -ocine."},
{l:6,q:"Numbering in a heterocycle starts at:",o:["Any carbon","The heteroatom of highest priority","The substituent","The largest ring"],a:1,e:"Then continues to give other heteroatoms lowest numbers."},
{l:6,q:"The aromaticity of furan, pyrrole and thiophene requires:",o:["4 π electrons","6 π electrons including a heteroatom lone pair","8 π electrons","No lone pair"],a:1,e:"Hückel 4n+2."}
];

QX.physio=[
{l:1,q:"Total body water in an adult male is about what percentage of body weight?",o:["20%","40%","60%","80%"],a:2,e:"Lower in females and the obese (more fat)."},
{l:1,q:"Intracellular fluid makes up about what fraction of total body water?",o:["1/3","2/3","1/2","1/4"],a:1,e:"ECF is about 1/3."},
{l:1,q:"Extracellular fluid is divided mainly into:",o:["Plasma and interstitial fluid","ICF and plasma","Lymph only","CSF only"],a:0,e:"Plasma ≈ 1/4 of ECF, interstitial ≈ 3/4."},
{l:1,q:"The main cation of ICF is:",o:["Na⁺","K⁺","Ca²⁺","Cl⁻"],a:1,e:"Na⁺ dominates ECF."},
{l:1,q:"The main anion of ECF is:",o:["Phosphate","Proteins","Cl⁻","K⁺"],a:2,e:"Plus HCO₃⁻."},
{l:1,q:"Infants have a ___ percentage of body water than adults.",o:["Lower","Higher","Equal","Variable only"],a:1,e:"About 75%."},
{l:1,q:"Simple diffusion through the lipid bilayer is fastest for:",o:["Large polar molecules","Small lipid-soluble molecules (O₂, CO₂)","Ions","Proteins"],a:1,e:"No carrier or energy needed."},
{l:1,q:"Facilitated diffusion differs from simple diffusion in that it:",o:["Uses ATP","Uses a carrier and shows saturation","Moves against a gradient","Is non-specific"],a:1,e:"E.g. glucose via GLUT."},
{l:1,q:"Primary active transport uses:",o:["Ion gradients","ATP directly","Osmosis","Vesicles only"],a:1,e:"E.g. Na⁺/K⁺-ATPase."},
{l:1,q:"The Na⁺/K⁺ pump moves:",o:["2 Na⁺ out, 3 K⁺ in","3 Na⁺ out, 2 K⁺ in","3 Na⁺ in, 2 K⁺ out","1 Na⁺ out, 1 K⁺ in"],a:1,e:"Electrogenic, creates negative interior."},
{l:1,q:"SGLT (Na⁺–glucose co-transport) is an example of:",o:["Primary active transport","Secondary active transport","Simple diffusion","Endocytosis"],a:1,e:"Uses the Na⁺ gradient made by the pump."},
{l:1,q:"Na⁺/Ca²⁺ exchanger is an example of:",o:["Symport","Antiport (counter-transport)","Uniport","Pinocytosis"],a:1,e:"Ions move in opposite directions."},
{l:1,q:"Osmosis is the movement of:",o:["Solute to lower concentration","Water toward higher solute concentration across a semipermeable membrane","Ions in an electric field","Proteins"],a:1,e:"Driven by osmotic pressure."},
{l:1,q:"A cell placed in a hypotonic solution will:",o:["Shrink","Swell and may lyse","Stay unchanged","Crenate"],a:1,e:"Water enters."},
{l:1,q:"0.9% NaCl is:",o:["Hypotonic","Isotonic","Hypertonic","Toxic"],a:1,e:"Normal saline."},
{l:1,q:"Phagocytosis is:",o:["Cell drinking","Cell eating of particles","Exocytosis","Diffusion"],a:1,e:"Pinocytosis is cell drinking."},
{l:1,q:"ADH conserves water by:",o:["Increasing water reabsorption in collecting ducts","Increasing urine volume","Raising Na⁺ excretion","Dilating vessels only"],a:0,e:"Inserts aquaporins."},
{l:1,q:"The thirst centre is in the:",o:["Medulla","Hypothalamus","Cerebellum","Cortex"],a:1,e:"Responds to rising plasma osmolality."},
{l:1,q:"Oedema can result from:",o:["Raised plasma proteins","Decreased plasma proteins (low oncotic pressure)","Low capillary pressure","High lymph flow"],a:1,e:"Also raised capillary pressure or lymph obstruction."},
{l:2,q:"Normal blood volume in an adult is about:",o:["1–2 L","5–6 L","10 L","15 L"],a:1,e:"About 8% of body weight."},
{l:2,q:"Plasma makes up about what percentage of blood?",o:["45%","55%","75%","90%"],a:1,e:"Cells (mainly RBCs) ~45% = haematocrit."},
{l:2,q:"The most abundant plasma protein is:",o:["Globulin","Albumin","Fibrinogen","Prothrombin"],a:1,e:"Main contributor to oncotic pressure."},
{l:2,q:"Serum differs from plasma by lacking:",o:["Albumin","Clotting factors (fibrinogen)","Water","Glucose"],a:1,e:"Serum is obtained after clotting."},
{l:2,q:"Normal haemoglobin in adult males is about:",o:["8–10 g/dL","14–18 g/dL","20–25 g/dL","5 g/dL"],a:1,e:"Females ~12–16 g/dL."},
{l:2,q:"RBC lifespan is about:",o:["10 days","40 days","120 days","1 year"],a:2,e:"Destroyed mainly in the spleen."},
{l:2,q:"Erythropoietin is produced mainly by the:",o:["Liver","Kidney","Spleen","Bone marrow"],a:1,e:"Stimulated by hypoxia."},
{l:2,q:"Vitamin B12 or folate deficiency causes:",o:["Microcytic anaemia","Megaloblastic (macrocytic) anaemia","Haemolytic anaemia","Aplastic anaemia"],a:1,e:"Impaired DNA synthesis."},
{l:2,q:"Iron deficiency anaemia is:",o:["Macrocytic hyperchromic","Microcytic hypochromic","Normocytic","Megaloblastic"],a:1,e:"Small pale RBCs."},
{l:2,q:"Pernicious anaemia is due to lack of:",o:["Iron","Intrinsic factor","Folate","Erythropoietin"],a:1,e:"Needed for B12 absorption."},
{l:2,q:"Sickle cell anaemia results from:",o:["Iron loss","An abnormal haemoglobin (HbS)","Bone marrow failure","Blood loss"],a:1,e:"A haemolytic anaemia."},
{l:2,q:"Aplastic anaemia is due to:",o:["Haemolysis","Bone marrow failure","B12 deficiency","Bleeding"],a:1,e:"All cell lines may fall (pancytopenia)."},
{l:2,q:"Polycythaemia means:",o:["Decreased RBCs","Increased RBC count","Increased WBCs","Low platelets"],a:1,e:"Raises viscosity."},
{l:2,q:"The most abundant WBC is the:",o:["Lymphocyte","Neutrophil","Eosinophil","Basophil"],a:1,e:"~60–70%, first line against bacteria."},
{l:2,q:"Eosinophils increase in:",o:["Bacterial infection","Allergy and parasitic infections","Viral infection only","Anaemia"],a:1,e:"Eosinophilia."},
{l:2,q:"Platelets are fragments of:",o:["Lymphocytes","Megakaryocytes","RBCs","Monocytes"],a:1,e:"Count 150,000–400,000/µL."},
{l:2,q:"Fibrinogen is converted to fibrin by:",o:["Plasmin","Thrombin","Heparin","Vitamin K"],a:1,e:"Final step of coagulation."},
{l:2,q:"Vitamin K is required for synthesis of factors:",o:["I, V, VIII","II, VII, IX, X","XI, XII","III only"],a:1,e:"Warfarin antagonizes vitamin K."},
{l:2,q:"Haemophilia A is deficiency of factor:",o:["VII","VIII","IX","X"],a:1,e:"Haemophilia B = factor IX."},
{l:2,q:"A person with blood group AB has:",o:["Anti-A and anti-B","No anti-A or anti-B antibodies","Anti-A only","Anti-B only"],a:1,e:"Universal recipient."},
{l:2,q:"The universal donor is group:",o:["AB+","O−","A+","B−"],a:1,e:"No A, B or Rh antigens."},
{l:2,q:"Haemolytic disease of the newborn occurs when:",o:["Rh+ mother carries Rh− fetus","Rh− mother sensitized carries Rh+ fetus","Both are Rh−","Mother is group AB"],a:1,e:"Prevented with anti-D."},
{l:3,q:"The functional unit of the nervous system is the:",o:["Glial cell","Neuron","Synapse","Myelin"],a:1,e:"Dendrites receive, axon transmits."},
{l:3,q:"Myelin in the CNS is formed by:",o:["Schwann cells","Oligodendrocytes","Astrocytes","Microglia"],a:1,e:"Schwann cells in the PNS."},
{l:3,q:"The resting membrane potential of a neuron is about:",o:["+30 mV","−70 mV","−90 mV only in neurons","0 mV"],a:1,e:"Inside negative."},
{l:3,q:"The resting membrane potential is mainly due to:",o:["Na⁺ influx","K⁺ efflux through leak channels","Ca²⁺ influx","Cl⁻ efflux"],a:1,e:"Plus the Na⁺/K⁺ pump contribution."},
{l:3,q:"Depolarization during the action potential is caused by:",o:["K⁺ efflux","Rapid Na⁺ influx through voltage-gated channels","Cl⁻ influx","Pump activity"],a:1,e:"Reaching threshold opens Na⁺ channels."},
{l:3,q:"Repolarization is caused by:",o:["Na⁺ influx","K⁺ efflux","Ca²⁺ influx","Water movement"],a:1,e:"Voltage-gated K⁺ channels open."},
{l:3,q:"Hyperpolarization after an action potential is due to:",o:["Slow closure of K⁺ channels","Na⁺ channel reopening","Pump failure","Ca²⁺ entry"],a:0,e:"Excess K⁺ leaves."},
{l:3,q:"The threshold potential of a neuron is about:",o:["−90 mV","−55 mV","0 mV","+30 mV"],a:1,e:"Must be reached to fire."},
{l:3,q:"The all-or-none law means:",o:["Larger stimuli give larger action potentials","A suprathreshold stimulus always produces a full-sized action potential","Every stimulus fires","AP size depends on axon length"],a:1,e:"Subthreshold stimuli produce no AP."},
{l:3,q:"During the absolute refractory period:",o:["A stronger stimulus can fire the neuron","No stimulus can produce another AP","The neuron is hyperexcitable","K⁺ channels are closed"],a:1,e:"Na⁺ channels are inactivated."},
{l:3,q:"During the relative refractory period:",o:["No stimulus works","A stronger than normal stimulus can produce an AP","Normal stimuli work","The membrane is at rest"],a:1,e:"Coincides with hyperpolarization."},
{l:3,q:"Saltatory conduction occurs in:",o:["Unmyelinated fibres","Myelinated fibres, jumping between nodes of Ranvier","Muscle only","Dendrites"],a:1,e:"Faster and more energy-efficient."},
{l:3,q:"Conduction velocity increases with:",o:["Smaller diameter","Larger diameter and myelination","Lower temperature","Demyelination"],a:1,e:"Type A fibres are fastest."},
{l:3,q:"Local anaesthetics block nerve conduction by blocking:",o:["K⁺ channels","Voltage-gated Na⁺ channels","Ca²⁺ pumps","ACh receptors"],a:1,e:"No depolarization."},
{l:3,q:"At a chemical synapse, neurotransmitter release is triggered by:",o:["Na⁺ influx","Ca²⁺ influx into the presynaptic terminal","K⁺ efflux","Cl⁻ influx"],a:1,e:"Vesicle exocytosis."},
{l:3,q:"An EPSP is caused by:",o:["Cl⁻ influx","Na⁺ influx (depolarization)","K⁺ efflux only","Hyperpolarization"],a:1,e:"IPSP: Cl⁻ influx or K⁺ efflux."},
{l:3,q:"Multiple sclerosis affects:",o:["Peripheral myelin","CNS myelin","Muscle fibres","Synaptic vesicles"],a:1,e:"Slows or blocks conduction."},
{l:4,q:"The sympathetic nervous system has a ___ outflow.",o:["Craniosacral","Thoracolumbar (T1–L2)","Cervical","Sacral only"],a:1,e:"Parasympathetic is craniosacral."},
{l:4,q:"Preganglionic fibres of both ANS divisions release:",o:["Noradrenaline","Acetylcholine","Dopamine","Adrenaline"],a:1,e:"Acting on nicotinic receptors."},
{l:4,q:"Most sympathetic postganglionic fibres release:",o:["Acetylcholine","Noradrenaline","Serotonin","GABA"],a:1,e:"Exception: sweat glands (ACh)."},
{l:4,q:"Parasympathetic postganglionic fibres act on:",o:["Nicotinic receptors","Muscarinic receptors","Alpha receptors","Beta receptors"],a:1,e:"Released ACh."},
{l:4,q:"Sympathetic stimulation causes:",o:["Miosis","Mydriasis (pupil dilation)","Bradycardia","Increased gut motility"],a:1,e:"Fight-or-flight."},
{l:4,q:"Parasympathetic stimulation of the heart causes:",o:["Tachycardia","Bradycardia","Increased contractility","Vasoconstriction"],a:1,e:"Via vagus nerve, M2 receptors."},
{l:4,q:"Bronchodilation is produced by:",o:["Parasympathetic, M3","Sympathetic, β2","α1","Nicotinic"],a:1,e:"Basis of salbutamol in asthma."},
{l:4,q:"The adrenal medulla acts like a modified:",o:["Parasympathetic ganglion","Sympathetic ganglion releasing adrenaline into blood","Motor neuron","Sensory receptor"],a:1,e:"~80% adrenaline."},
{l:4,q:"Which organ receives only sympathetic innervation?",o:["Heart","Most blood vessels","Iris","Salivary gland"],a:1,e:"Also sweat glands, adrenal medulla."},
{l:4,q:"Skeletal muscle fibres are:",o:["Unstriated and involuntary","Striated, multinucleated and voluntary","Branched with intercalated discs","Single-nucleated smooth"],a:1,e:"Cardiac muscle has intercalated discs."},
{l:4,q:"The neurotransmitter at the neuromuscular junction is:",o:["Noradrenaline","Acetylcholine","Dopamine","Glutamate"],a:1,e:"On nicotinic (Nm) receptors."},
{l:4,q:"The functional unit of skeletal muscle is the:",o:["Myofibril","Sarcomere","Sarcoplasmic reticulum","T-tubule"],a:1,e:"Z line to Z line."},
{l:4,q:"During contraction, which band stays constant?",o:["I band","A band","H zone","Sarcomere"],a:1,e:"I band and H zone shorten."},
{l:4,q:"Calcium triggers skeletal muscle contraction by binding to:",o:["Myosin","Troponin C","Actin","Tropomyosin directly"],a:1,e:"Tropomyosin moves to expose myosin-binding sites."},
{l:4,q:"Calcium for skeletal muscle contraction comes mainly from:",o:["ECF","Sarcoplasmic reticulum","Mitochondria","Nucleus"],a:1,e:"Released after T-tubule depolarization."},
{l:4,q:"ATP is needed in the cross-bridge cycle for:",o:["Actin polymerization","Detachment of myosin from actin and Ca²⁺ re-uptake","Ca²⁺ release only","Nerve conduction"],a:1,e:"Lack of ATP → rigor mortis."},
{l:4,q:"Myasthenia gravis is due to:",o:["Excess ACh","Antibodies against nicotinic ACh receptors","Myelin loss","Calcium excess"],a:1,e:"Treated with anticholinesterases."},
{l:4,q:"Smooth muscle contraction is initiated by Ca²⁺ binding to:",o:["Troponin","Calmodulin","Tropomyosin","Myosin heads directly"],a:1,e:"Activates myosin light-chain kinase."},
{l:4,q:"Tetanus (summation) in skeletal muscle results from:",o:["Single stimulus","High-frequency repeated stimuli","Low Ca²⁺","Fatigue"],a:1,e:"Twitches fuse."},
{l:5,q:"Cardiac muscle cells are connected electrically through:",o:["Desmosomes only","Gap junctions in intercalated discs","Tight junctions","Synapses"],a:1,e:"Acts as a functional syncytium."},
{l:5,q:"The resting membrane potential of ventricular muscle is about:",o:["−55 mV","−70 mV","−90 mV","0 mV"],a:2,e:"More negative than SA node."},
{l:5,q:"Phase 0 of the ventricular action potential is due to:",o:["Ca²⁺ influx","Rapid Na⁺ influx","K⁺ efflux","Cl⁻ influx"],a:1,e:"Fast depolarization."},
{l:5,q:"The plateau (phase 2) of the ventricular action potential is due to:",o:["Na⁺ influx","Slow Ca²⁺ influx balanced by K⁺ efflux","Cl⁻ influx","Pump only"],a:1,e:"L-type Ca²⁺ channels."},
{l:5,q:"The long refractory period of cardiac muscle prevents:",o:["Contraction","Tetanus","Conduction","Relaxation"],a:1,e:"Allows ventricular filling."},
{l:5,q:"Phase 3 of the ventricular action potential is:",o:["Depolarization","Repolarization by K⁺ efflux","Plateau","Resting"],a:1,e:"Ca²⁺ channels close."},
{l:5,q:"The SA node is the normal pacemaker because it:",o:["Has the most negative RMP","Has the fastest rate of spontaneous depolarization","Is in the ventricle","Has no ion channels"],a:1,e:"~70–80 beats/min."},
{l:5,q:"The pacemaker (prepotential) in SA node is mainly due to:",o:["Fast Na⁺ channels","Funny current (If, Na⁺ influx) and decreasing K⁺ efflux","Cl⁻ efflux","Pump activity"],a:1,e:"Then T-type Ca²⁺ channels."},
{l:5,q:"Depolarization (phase 0) in SA node cells is due to:",o:["Fast Na⁺ influx","Ca²⁺ influx through L-type channels","K⁺ efflux","Cl⁻ influx"],a:1,e:"Slow upstroke."},

DEEP.analytical[1]={en:`
<p>This course is about <b>redox (oxidation–reduction) titrations</b>: analysing drugs by reacting them with an oxidising or reducing agent of known concentration. Lecture 1 builds the vocabulary and the three core skills you'll use all term: identifying what is oxidised and reduced, calculating <b>oxidation numbers</b> and <b>equivalent weights</b>, and <b>balancing</b> redox equations by half-equations.</p>

<h4>1. What "redox" means</h4>
<p>REDOX = <b>RED</b>uction + <b>OX</b>idation. The old definitions were: oxidation = reacting with <b>oxygen</b>; reduction = reacting with <b>hydrogen</b>. These fail for reactions with no oxygen or hydrogen at all. For example, chlorine oxidises ferrous ion with no oxygen involved:</p>
<div class="formula">2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻</div>
<p>The modern definition is about <b>electrons</b>:</p>
<ul>
<li>Fe²⁺ <b>loses</b> an electron to become Fe³⁺: <b>oxidation</b> (2Fe²⁺ − 2e → 2Fe³⁺).</li>
<li>Cl₂ <b>gains</b> electrons to become Cl⁻: <b>reduction</b> (Cl₂ + 2e → 2Cl⁻).</li>
</ul>
<p>Free electrons can't exist in solution. An electron lost by one substance must be taken up by another, so <b>oxidation is always accompanied by reduction</b>. That's why the two together are called a <b>redox</b> reaction.</p>
<div class="tblwrap"><table><tr><th></th><th>Oxidation</th><th>Reduction</th></tr>
<tr><td>Electrons</td><td><b>Lost</b></td><td><b>Gained</b></td></tr>
<tr><td>Oxidation number</td><td><b>Increases</b></td><td><b>Decreases</b></td></tr>
<tr><td>Example</td><td>Fe²⁺ → Fe³⁺</td><td>Cl₂ → 2Cl⁻</td></tr></table></div>

<h4>2. Oxidising and reducing agents</h4>
<ul>
<li>An <b>oxidising agent</b> (oxidant) <b>gains electrons</b> (it is an electron <b>acceptor</b>), so it is itself <b>reduced</b> and changes to a lower valency. Examples: <b>KMnO₄, K₂Cr₂O₇, I₂, KIO₃, KBrO₃</b> (and Ce⁴⁺).</li>
<li>A <b>reducing agent</b> (reductant) <b>loses electrons</b> (electron <b>donor</b>), so it is itself <b>oxidised</b> and changes to a higher valency. Examples: <b>Na₂S₂O₃</b> (thiosulfate), <b>metallic iron</b>, <b>oxalic acid</b>, <b>sodium oxalate</b>.</li>
</ul>
<div class="pearl"><strong>Avoid the classic confusion:</strong> the oxidising agent is the one that gets <b>reduced</b>. It "causes" oxidation in the other substance by taking its electrons.</div>
<div class="ex"><b>Lecture example:</b> Cl₂ + 2NaBr → Br₂ + 2NaCl.<br>Br⁻ (−1) → Br₂ (0): oxidation number rises, so <b>bromide is oxidised</b> and NaBr is the <b>reducing agent</b>.<br>Cl₂ (0) → Cl⁻ (−1): oxidation number falls, so <b>chlorine is reduced</b> and Cl₂ is the <b>oxidising agent</b>.</div>

<h4>3. Oxidation numbers</h4>
<p>The <b>oxidation number (O.N.)</b> is the charge an atom appears to have if the compound were split into ions. It changes when electrons are gained or lost. Rules:</p>
<ol>
<li>A <b>free element</b> (S⁰, Zn⁰, Cl₂) has O.N. <b>0</b>.</li>
<li><b>H = +1</b>, except in metal hydrides (where it is −1).</li>
<li><b>O = −2</b>, except in peroxides (where it is −1).</li>
<li>A simple <b>ion</b>'s O.N. equals its <b>charge</b> (Fe²⁺ = +2).</li>
<li>The O.N.s in a <b>neutral compound</b> add up to <b>0</b>; in a polyatomic ion they add up to the ion's charge.</li>
</ol>
<div class="ex"><b>Method:</b> write the known numbers, then solve for the unknown so the total is zero.<br>
S in H₂SO₄: 2(+1) + S + 4(−2) = 0 → S = <b>+6</b>.<br>
Mn in KMnO₄: (+1) + Mn + 4(−2) = 0 → Mn = <b>+7</b>.</div>
<div class="ex"><b>Practice answers:</b> N in KNO₃: 1 + N − 6 = 0 → <b>+5</b>. Mn in K₂MnO₄: 2 + Mn − 8 = 0 → <b>+6</b>. As in H₃AsO₃: 3 + As − 6 = 0 → <b>+3</b>. C in Na₂CO₃: 2 + C − 6 = 0 → <b>+4</b>. S in Na₂SO₃: 2 + S − 6 = 0 → <b>+4</b>. Cl in KClO₃: 1 + Cl − 6 = 0 → <b>+5</b>.</div>

<h4>4. Equivalent weight of oxidants and reductants</h4>
<p>In redox analysis, the <b>equivalent weight</b> is the <b>molecular weight divided by the change in oxidation number</b> of the element that is oxidised or reduced (equivalently, the number of electrons transferred per molecule).</p>
<div class="formula">Equivalent weight = Molecular weight ÷ change in oxidation number</div>
<p>The same compound can have <b>different equivalent weights in different media</b>, because it is reduced to different products. KMnO₄ (M = 158) is the classic example:</p>
<ul>
<li><b>Acid medium</b>: KMnO₄ → MnSO₄. Mn goes from +7 to <b>+2</b>, a change of 5. Equivalent weight = 158/5 = <b>31.6</b>.</li>
<li><b>Alkaline medium</b>: KMnO₄ → MnO₂. Mn goes from +7 to <b>+4</b>, a change of 3. Equivalent weight = 158/3 = <b>52.67</b>.</li>
</ul>

<h4>5. Balancing redox equations by half-equations</h4>
<p>Three steps:</p>
<ol>
<li><b>Split</b> the equation into two half-equations: one for the oxidant, one for the reductant.</li>
<li>Balance each half-equation <b>ionically</b> (atoms: O with H₂O, H with H⁺ in acid) and then <b>electronically</b> (add electrons to the more positive side so the charges match).</li>
<li><b>Multiply</b> so that electrons gained = electrons lost, then <b>add</b> and cancel.</li>
</ol>
<h5>Worked example 1: permanganate and iron(II)</h5>
<p>MnO₄⁻ + H⁺ + Fe²⁺ → Mn²⁺ + Fe³⁺ + H₂O</p>
<p><b>Oxidant half:</b> MnO₄⁻ → Mn²⁺. Four O on the left, so add 4H₂O on the right; that needs 8H⁺ on the left: MnO₄⁻ + 8H⁺ → Mn²⁺ + 4H₂O. Charges: left is −1 + 8 = +7; right is +2. Add <b>5e</b> to the left: <b>MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O</b>. (Check: Mn +7 → +2, a gain of 5 electrons.)</p>
<p><b>Reductant half:</b> Fe²⁺ → Fe³⁺ + e.</p>
<p><b>Match electrons:</b> multiply the iron half by 5 and add:</p>
<div class="formula">MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>
<h5>Worked example 2: dichromate and iron(II)</h5>
<p><b>Oxidant half:</b> Cr₂O₇²⁻ → 2Cr³⁺. Seven O, so 7H₂O on the right and 14H⁺ on the left. Charges: −2 + 14 = +12 on the left, 2 × 3 = +6 on the right, so add <b>6e</b>: Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O.</p>
<p><b>Reductant half:</b> Fe²⁺ → Fe³⁺ + e, multiplied by 6.</p>
<div class="formula">Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 7H₂O + 6Fe³⁺</div>

<h4>6. Practice equations (worked)</h4>
<div class="ex"><b>1. MnO₄⁻ + Cl⁻ + H⁺ → Mn²⁺ + Cl₂ + H₂O.</b> Oxidant: MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O (×2). Reductant: 2Cl⁻ → Cl₂ + 2e (×5).<br>Result: <b>2MnO₄⁻ + 10Cl⁻ + 16H⁺ → 2Mn²⁺ + 5Cl₂ + 8H₂O</b>.</div>
<div class="ex"><b>2. I₂ + S₂O₃²⁻ → I⁻ + S₄O₆²⁻.</b> I₂ + 2e → 2I⁻; 2S₂O₃²⁻ → S₄O₆²⁻ + 2e.<br>Result: <b>I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻</b> (the key reaction of iodometry, Lecture 6).</div>
<div class="ex"><b>3. H₃AsO₃ + MnO₄⁻ + H⁺ → H₃AsO₄ + Mn²⁺ + H₂O.</b> As +3 → +5, losing 2e: H₃AsO₃ + H₂O → H₃AsO₄ + 2H⁺ + 2e (×5). Permanganate gains 5e (×2).<br>Result: <b>5H₃AsO₃ + 2MnO₄⁻ + 6H⁺ → 5H₃AsO₄ + 2Mn²⁺ + 3H₂O</b>.</div>
<div class="ex"><b>4. [Fe(CN)₆]⁴⁻ + Ce⁴⁺ → [Fe(CN)₆]³⁻ + Ce³⁺.</b> One electron each way: <b>[Fe(CN)₆]⁴⁻ + Ce⁴⁺ → [Fe(CN)₆]³⁻ + Ce³⁺</b> (already balanced 1:1).</div>
<div class="ex"><b>5. C₂O₄²⁻ + Ce⁴⁺ → CO₂ + Ce³⁺.</b> C goes +3 → +4 for each of two carbons, so oxalate loses 2e: C₂O₄²⁻ → 2CO₂ + 2e. Ce⁴⁺ + e → Ce³⁺ (×2).<br>Result: <b>C₂O₄²⁻ + 2Ce⁴⁺ → 2CO₂ + 2Ce³⁺</b>.</div>
<div class="pearl"><strong>Check every answer twice:</strong> atoms balance on both sides, and total charge balances on both sides.</div>
`,ar:`
<p>الكورس ده عن <b>معايرات الأكسدة والاختزال (redox titrations)</b>: تحليل الأدوية بإننا نفاعلها مع عامل مؤكسد أو مختزل تركيزه معروف. المحاضرة الأولى بتبني المصطلحات و3 مهارات أساسية هتستخدميها طول الترم: تحديد مين اتأكسد ومين اتختزل، وحساب <b>أرقام الأكسدة</b> و<b>الوزن المكافئ</b>، و<b>موازنة</b> معادلات الأكسدة والاختزال بأنصاف المعادلات.</p>

<h4>1. يعني إيه Redox؟</h4>
<p>REDOX = <b>RED</b>uction (اختزال) + <b>OX</b>idation (أكسدة). التعريفات القديمة كانت: الأكسدة = التفاعل مع <b>الأكسجين</b>، والاختزال = التفاعل مع <b>الهيدروجين</b>. التعريفات دي بتفشل في تفاعلات مفيهاش أكسجين ولا هيدروجين خالص. مثلًا الكلور بيأكسد الحديدوز من غير أي أكسجين:</p>
<div class="formula">2Fe²⁺ + Cl₂ → 2Fe³⁺ + 2Cl⁻</div>
<p>التعريف الحديث معتمد على <b>الإلكترونات</b>:</p>
<ul>
<li>الـ Fe²⁺ <b>بيفقد</b> إلكترون ويبقى Fe³⁺: ده <b>أكسدة</b>.</li>
<li>الـ Cl₂ <b>بياخد</b> إلكترونات ويبقى Cl⁻: ده <b>اختزال</b>.</li>
</ul>
<p>الإلكترونات الحرة ما ينفعش تفضل لوحدها في المحلول. الإلكترون اللي مادة فقدته لازم مادة تانية تاخده، فـ<b>الأكسدة دايمًا معاها اختزال</b>. وعشان كده الاتنين مع بعض اسمهم تفاعل <b>redox</b>.</p>
<div class="tblwrap"><table><tr><th></th><th>Oxidation</th><th>Reduction</th></tr>
<tr><td>Electrons</td><td>Lost</td><td>Gained</td></tr>
<tr><td>Oxidation number</td><td>Increases</td><td>Decreases</td></tr>
<tr><td>Example</td><td>Fe²⁺ → Fe³⁺</td><td>Cl₂ → 2Cl⁻</td></tr></table></div>

<h4>2. العوامل المؤكسدة والمختزلة</h4>
<ul>
<li>الـ <b>عامل المؤكسد</b> <b>بياخد إلكترونات</b> (مستقبل)، فهو نفسه <b>بيتختزل</b> وتكافؤه يقل. أمثلة: <b>KMnO₄ و K₂Cr₂O₇ و I₂ و KIO₃ و KBrO₃</b> (و Ce⁴⁺).</li>
<li>الـ <b>عامل المختزل</b> <b>بيدي إلكترونات</b> (مانح)، فهو نفسه <b>بيتأكسد</b> وتكافؤه يزيد. أمثلة: <b>Na₂S₂O₃</b> (الثيوسلفات)، <b>الحديد المعدني</b>، <b>حمض الأوكساليك</b>، <b>أوكسالات الصوديوم</b>.</li>
</ul>
<div class="pearl"><strong>خدي بالك من اللخبطة المشهورة:</strong> العامل المؤكسد هو اللي بيـ<b>تختزل</b>. هو "بيعمل" أكسدة للمادة التانية لما ياخد إلكتروناتها.</div>
<div class="ex"><b>مثال المحاضرة:</b> <bdi>Cl₂ + 2NaBr → Br₂ + 2NaCl</bdi>.<br>الـ Br⁻ (−1) بقى Br₂ (0): رقم الأكسدة زاد، يبقى <b>البروميد اتأكسد</b> والـ NaBr هو <b>العامل المختزل</b>.<br>الـ Cl₂ (0) بقى Cl⁻ (−1): رقم الأكسدة قلّ، يبقى <b>الكلور اتختزل</b> والـ Cl₂ هو <b>العامل المؤكسد</b>.</div>

<h4>3. أرقام الأكسدة</h4>
<p><b>رقم الأكسدة</b> هو الشحنة اللي الذرة شكلها عندها لو المركّب اتقسم لأيونات، وبيتغير لما إلكترونات تتاخد أو تتفقد. القواعد:</p>
<ol>
<li><b>العنصر الحر</b> (S⁰ و Zn⁰ و Cl₂) رقمه <b>صفر</b>.</li>
<li><b>H = +1</b>، ما عدا في هيدريدات الفلزات (بيبقى −1).</li>
<li><b>O = −2</b>، ما عدا في البيروكسيدات (بيبقى −1).</li>
<li>رقم <b>الأيون</b> البسيط = <b>شحنته</b> (Fe²⁺ = +2).</li>
<li>مجموع الأرقام في <b>المركّب المتعادل</b> = <b>صفر</b>، وفي الأيون المتعدد الذرات = شحنة الأيون.</li>
</ol>
<div class="ex"><b>الطريقة:</b> اكتبي الأرقام المعروفة، وحلّي للمجهول بحيث المجموع يبقى صفر.<br>
S في H₂SO₄: <bdi>2(+1) + S + 4(−2) = 0</bdi> ← S = <b>+6</b>.<br>
Mn في KMnO₄: <bdi>(+1) + Mn + 4(−2) = 0</bdi> ← Mn = <b>+7</b>.</div>
<div class="ex"><b>إجابات التدريب:</b> N في KNO₃ = <b>+5</b>. Mn في K₂MnO₄ = <b>+6</b>. As في H₃AsO₃ = <b>+3</b>. C في Na₂CO₃ = <b>+4</b>. S في Na₂SO₃ = <b>+4</b>. Cl في KClO₃ = <b>+5</b>.</div>

<h4>4. الوزن المكافئ للعوامل المؤكسدة والمختزلة</h4>
<p>في تحليل الأكسدة والاختزال، <b>الوزن المكافئ</b> = <b>الوزن الجزيئي ÷ التغير في رقم الأكسدة</b> للعنصر اللي اتأكسد أو اتختزل (يعني عدد الإلكترونات اللي اتنقلت لكل جزيء).</p>
<div class="formula">Equivalent weight = Molecular weight ÷ change in oxidation number</div>
<p>نفس المركّب ممكن يبقى ليه <b>وزن مكافئ مختلف حسب الوسط</b>، لأنه بيتختزل لنواتج مختلفة. المثال الكلاسيكي KMnO₄ (الوزن الجزيئي = 158):</p>
<ul>
<li><b>وسط حمضي</b>: KMnO₄ ← MnSO₄. المنجنيز من +7 لـ <b>+2</b>، يعني التغير 5. الوزن المكافئ = <bdi>158/5 = 31.6</bdi>.</li>
<li><b>وسط قلوي</b>: KMnO₄ ← MnO₂. المنجنيز من +7 لـ <b>+4</b>، يعني التغير 3. الوزن المكافئ = <bdi>158/3 = 52.67</bdi>.</li>
</ul>

<h4>5. موازنة المعادلات بأنصاف المعادلات</h4>
<p>3 خطوات:</p>
<ol>
<li><b>قسّمي</b> المعادلة لنصين: واحد للمؤكسد وواحد للمختزل.</li>
<li>وازني كل نص <b>أيونيًا</b> (الذرات: الأكسجين بالماء، والهيدروجين بـ H⁺ في الحمضي) وبعدين <b>إلكترونيًا</b> (ضيفي إلكترونات للناحية الأكثر موجبية لحد ما الشحنات تتساوى).</li>
<li><b>اضربي</b> بحيث الإلكترونات المكتسبة = المفقودة، وبعدين <b>اجمعي</b> واشطبي المتشابه.</li>
</ol>
<h5>مثال 1: البرمنجنات والحديد الثنائي</h5>
<p><b>نص المؤكسد:</b> MnO₄⁻ ← Mn²⁺. فيه 4 أكسجين شمال، فنحط 4H₂O يمين، وده محتاج 8H⁺ شمال: <bdi>MnO₄⁻ + 8H⁺ → Mn²⁺ + 4H₂O</bdi>. الشحنات: الشمال <bdi>−1 + 8 = +7</bdi>، واليمين +2. نضيف <b>5 إلكترونات</b> للشمال: <bdi>MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O</bdi>. (تأكيد: المنجنيز من +7 لـ +2، يعني اكتسب 5.)</p>
<p><b>نص المختزل:</b> <bdi>Fe²⁺ → Fe³⁺ + e</bdi>.</p>
<p><b>نساوي الإلكترونات:</b> نضرب نص الحديد في 5 ونجمع:</p>
<div class="formula">MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>
<h5>مثال 2: الداي كرومات والحديد الثنائي</h5>
<p><b>نص المؤكسد:</b> Cr₂O₇²⁻ ← 2Cr³⁺. 7 أكسجين، يبقى 7H₂O يمين و14H⁺ شمال. الشحنات: <bdi>−2 + 14 = +12</bdi> شمال و <bdi>2 × 3 = +6</bdi> يمين، فنضيف <b>6 إلكترونات</b>: <bdi>Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O</bdi>.</p>
<p><b>نص المختزل:</b> Fe²⁺ ← Fe³⁺ + e، مضروب في 6.</p>
<div class="formula">Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 7H₂O + 6Fe³⁺</div>

<h4>6. معادلات التدريب (محلولة)</h4>
<div class="ex"><b>1. البرمنجنات مع الكلوريد:</b> المؤكسد يكسب 5 (×2)، والكلوريد <bdi>2Cl⁻ → Cl₂ + 2e</bdi> (×5).<br>الناتج: <bdi>2MnO₄⁻ + 10Cl⁻ + 16H⁺ → 2Mn²⁺ + 5Cl₂ + 8H₂O</bdi>.</div>
<div class="ex"><b>2. اليود مع الثيوسلفات:</b> <bdi>I₂ + 2e → 2I⁻</bdi> و <bdi>2S₂O₃²⁻ → S₄O₆²⁻ + 2e</bdi>.<br>الناتج: <bdi>I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻</bdi> (التفاعل الأساسي في الـ iodometry، محاضرة 6).</div>
<div class="ex"><b>3. الأرسينيت مع البرمنجنات:</b> الزرنيخ من +3 لـ +5 فبيفقد 2: <bdi>H₃AsO₃ + H₂O → H₃AsO₄ + 2H⁺ + 2e</bdi> (×5). والبرمنجنات تكسب 5 (×2).<br>الناتج: <bdi>5H₃AsO₃ + 2MnO₄⁻ + 6H⁺ → 5H₃AsO₄ + 2Mn²⁺ + 3H₂O</bdi>.</div>
<div class="ex"><b>4. الفيروسيانيد مع السيريوم:</b> إلكترون واحد في كل ناحية، فالمعادلة موزونة 1:1 زي ما هي.</div>
<div class="ex"><b>5. الأوكسالات مع السيريوم:</b> كل كربون من +3 لـ +4، فالأوكسالات بتفقد 2: <bdi>C₂O₄²⁻ → 2CO₂ + 2e</bdi>. والسيريوم يكسب 1 (×2).<br>الناتج: <bdi>C₂O₄²⁻ + 2Ce⁴⁺ → 2CO₂ + 2Ce³⁺</bdi>.</div>
<div class="pearl"><strong>راجعي كل إجابة مرتين:</strong> الذرات متوازنة في الناحيتين، والشحنة الكلية متوازنة في الناحيتين.</div>

DEEP.analytical[2]={en:`
<p>Redox reactions transfer electrons, and moving electrons is an electric current. Lecture 2 uses this link to measure "how strongly" a metal wants to lose electrons: its <b>electrode potential</b>. It explains where the potential comes from, how it is measured against the <b>standard hydrogen electrode</b>, what the <b>electrochemical series</b> tells us, and how <b>electrochemical cells</b> (galvanic and electrolytic) and the <b>salt bridge</b> work.</p>

<h4>1. Where an electrode potential comes from</h4>
<p>Dip a metal rod into a solution of its own salt. Two opposite tendencies compete:</p>
<ul>
<li><b>Solution pressure</b>: the tendency of the <b>metal to dissolve</b> into solution as ions.</li>
<li><b>Ionic pressure</b>: the tendency of the <b>metal ions to deposit</b> on the rod as metal.</li>
</ul>
<div class="tblwrap"><table><tr><th>Zinc rod in ZnSO₄</th><th>Copper rod in CuSO₄</th></tr>
<tr><td>Solution pressure &gt; ionic pressure</td><td>Ionic pressure &gt; solution pressure</td></tr>
<tr><td>Zn⁰ → Zn²⁺ + 2e: zinc atoms leave as ions (<b>oxidation</b>)</td><td>Cu²⁺ + 2e → Cu⁰: ions deposit on the rod (<b>reduction</b>)</td></tr>
<tr><td>Electrons stay behind, so the <b>rod becomes negative</b> and the <b>solution positive</b></td><td>Rod loses electrons to the ions, so the <b>rod becomes positive</b> and the <b>solution negative</b></td></tr>
<tr><td>The electrode <b>loses weight</b></td><td>The electrode <b>gains weight</b></td></tr></table></div>
<p>Either way an <b>electric double layer</b> forms at the surface, and a potential difference develops between the rod and the solution. This is the <b>electrode potential (E)</b>: the potential difference between a metal and its ions. It measures the tendency of the metal to be oxidised (dissolve) or of its ions to be reduced (deposit).</p>

<h4>2. The Nernst equation for electrode potential</h4>
<p>The tendency depends on (1) the <b>chemical nature</b> of the system and (2) the <b>concentration</b> of the ions. Both are combined in the Nernst equation:</p>
<div class="formula">E = E⁰ + (RT / nF) ln [Mⁿ⁺]<small>E⁰ = standard electrode potential · R = 8.314 J/(K·mol) · T = absolute temperature (°C + 273) · n = valency of the ion · F = 96,500 coulombs · [Mⁿ⁺] = molar concentration of metal ions</small></div>
<p>At 25 °C it simplifies to:</p>
<div class="formula">E = E⁰ + (0.059 / n) log [Mⁿ⁺]</div>
<p>When [Mⁿ⁺] = <b>1 M</b>, log 1 = 0, so <b>E = E⁰</b>. That is the definition of standard conditions.</p>
<div class="ex"><b>Example:</b> a Cu rod (E⁰ = +0.34 V, n = 2) in 0.01 M Cu²⁺: E = 0.34 + (0.059/2) × log 0.01 = 0.34 + 0.0295 × (−2) = <b>0.28 V</b>. Diluting the ions lowers the potential.</div>

<h4>3. Measuring E⁰: the standard hydrogen electrode</h4>
<p>You <b>can't measure a single electrode's potential</b> on its own; you can only measure the <b>difference</b> between two electrodes. So every electrode is measured against a <b>reference electrode</b> with a known, constant potential: the <b>normal (standard) hydrogen electrode (NHE)</b>.</p>
<ul>
<li>It consists of <b>H₂ gas</b> bubbled over platinum in an <b>HCl (H⁺) solution</b>.</li>
<li>Its potential is defined as <b>E⁰ = 0</b>.</li>
</ul>
<p>Connect the two half-cells and a current flows. The <b>e.m.f.</b> (electromotive force) is the algebraic difference between the two electrode potentials. Since the NHE is zero, the e.m.f. measured equals the E⁰ of the other electrode.</p>
<p><b>Standard electrode potential (E⁰):</b> the e.m.f. produced when a half-cell made of an element in a <b>1 M solution of its ions</b> is coupled with the NHE.</p>

<h4>4. The electrochemical series</h4>
<p>Arranging all elements by E⁰, from negative through hydrogen (0) to positive:</p>
<div class="tblwrap"><table><tr><th>System</th><th>E⁰ (V)</th></tr>
<tr><td>Mg/Mg²⁺</td><td>−2.36</td></tr><tr><td>Zn/Zn²⁺</td><td>−0.76</td></tr><tr><td>Fe/Fe²⁺</td><td>−0.44</td></tr><tr><td>Sn/Sn²⁺</td><td>−0.13</td></tr><tr><td>H₂(Pt)/H⁺</td><td>0</td></tr><tr><td>Cu/Cu²⁺</td><td>+0.34</td></tr><tr><td>Ag/Ag⁺</td><td>+0.80</td></tr></table></div>
<p>Four conclusions:</p>
<ol>
<li>The <b>sign of E⁰ matches the charge on the metal electrode</b> (zinc negative, copper positive).</li>
<li>The <b>more negative</b> E⁰ is, the greater the metal's tendency to <b>lose electrons</b> and pass into ions (be oxidised). These metals are <b>reducing agents</b>.</li>
<li>The <b>more positive</b> E⁰ is, the greater the tendency of the <b>ions to be reduced</b> and deposit as metal.</li>
<li>A metal with a more negative potential <b>displaces</b> any metal below it from solution. Zinc dropped in CuSO₄ becomes coated with copper, while zinc dissolves.</li>
</ol>
<p>When two half-cells are connected, electrons flow <b>from the more negative electrode to the more positive one</b> (e.g. Zn → Cu, or Mg −2.36 → Ag +0.80).</p>

<h4>5. Electrochemical cells</h4>
<p>Every electrochemical cell has:</p>
<ol>
<li>two metallic conductors (<b>electrodes</b>), each in a suitable electrolyte;</li>
<li>an <b>external circuit</b> (wire) connecting the electrodes;</li>
<li>a <b>salt bridge</b> connecting the two electrolyte solutions.</li>
</ol>
<p>The electrode where <b>oxidation</b> happens is the <b>anode</b>; where <b>reduction</b> happens is the <b>cathode</b>. (Memory hook: "<b>An Ox</b>, <b>Red Cat</b>".)</p>
<h5>Galvanic (voltaic) cell: chemical energy → electrical energy</h5>
<p>The Daniell-type cell: zinc in ZnSO₄, copper in CuSO₄, joined by a wire and a salt bridge. The reaction runs <b>spontaneously</b>:</p>
<ul>
<li>At the <b>zinc anode</b>: Zn⁰ → Zn²⁺ + 2e (oxidation).</li>
<li>Electrons travel through the wire to the copper.</li>
<li>At the <b>copper cathode</b>: Cu²⁺ + 2e → Cu⁰ (reduction). Copper is deposited on the electrode.</li>
<li>The movement of electrons is the current produced.</li>
</ul>
<h5>Electrolytic cell: electrical energy → chemical energy</h5>
<p>This is what happens when you <b>recharge</b> a galvanic cell. A larger potential is applied from an external source, opposing the cell's own output, so the reactions run <b>in reverse</b>:</p>
<ul><li>Zn²⁺ + 2e → Zn⁰ (zinc is now the <b>cathode</b>);</li><li>Cu⁰ → Cu²⁺ + 2e (copper is now the <b>anode</b>).</li></ul>
<div class="tblwrap"><table><tr><th>Galvanic cell</th><th>Electrolytic cell</th></tr>
<tr><td>Chemical → electrical energy</td><td>Electrical → chemical energy</td></tr>
<tr><td>Spontaneous reaction</td><td>Non-spontaneous; driven by an external source</td></tr>
<tr><td>Produces current</td><td>Consumes current</td></tr>
<tr><td>Zn is anode, Cu is cathode</td><td>Roles reversed: Cu is anode, Zn is cathode</td></tr></table></div>

<h4>6. The salt bridge</h4>
<h5>Construction</h5>
<ul>
<li>A bent, <b>inverted-U glass tube</b>.</li>
<li>Filled with <b>agar gel</b> made in a saturated solution of <b>KCl or KNO₃</b>.</li>
<li>Ends plugged with <b>cotton wool</b>, so the bridge contents don't mix too much with the beakers.</li>
</ul>
<h5>Functions</h5>
<ul>
<li>A <b>liquid connection</b> between the two half-cells that <b>completes the circuit</b> without mixing the two solutions.</li>
<li>Allows <b>transfer of charge</b> (ions migrate through it).</li>
<li><b>Keeps each solution electrically neutral</b>. Without it, the zinc side would build up positive charge and the copper side negative charge, and the current would stop.</li>
</ul>
<h5>Liquid junction potential</h5>
<p>At each boundary between the bridge and a solution, a small extra potential develops, the <b>liquid junction potential</b>, because ions cross at different rates. To minimise it, the bridge salt's <b>cation and anion should have very similar mobilities</b>. That's why KCl and KNO₃ are used: K⁺ = 74, Cl⁻ = 73, NO₃⁻ = 76 (similar migration rates).</p>
<div class="ex"><b>Practice (from Lecture 3's training question):</b> an electrode in its salt solution develops −2.27 V. (1) The electrode is <b>negative</b> and the solution <b>positive</b>. (2) <b>Solution pressure</b> is higher than ionic pressure (the metal dissolves). (3) To measure it, connect it to a reference electrode of known potential, the <b>NHE</b>, and measure the e.m.f.</div>

<p>تفاعلات الأكسدة والاختزال بتنقل إلكترونات، وحركة الإلكترونات دي هي التيار الكهربي. المحاضرة التانية بتستخدم العلاقة دي عشان تقيس الفلز "عايز يفقد إلكترونات قد إيه": وده اسمه <b>جهد القطب (electrode potential)</b>. بتشرح الجهد ده جاي منين، وبيتقاس إزاي بالنسبة لـ<b>قطب الهيدروجين القياسي</b>، و<b>السلسلة الكهروكيميائية</b> بتقولنا إيه، وإزاي <b>الخلايا الكهروكيميائية</b> (الجلفانية والإلكتروليتية) والـ <b>salt bridge</b> بيشتغلوا.</p>

<h4>1. جهد القطب جاي منين؟</h4>
<p>لو غطّستي ساق فلز في محلول ملحه، فيه ميلين عكس بعض بيتنافسوا:</p>
<ul>
<li><b>Solution pressure</b>: ميل <b>الفلز إنه يدوب</b> في المحلول كأيونات.</li>
<li><b>Ionic pressure</b>: ميل <b>أيونات الفلز إنها تترسب</b> على الساق كفلز.</li>
</ul>
<div class="tblwrap"><table><tr><th>Zinc rod in ZnSO₄</th><th>Copper rod in CuSO₄</th></tr>
<tr><td>Solution pressure &gt; ionic pressure</td><td>Ionic pressure &gt; solution pressure</td></tr>
<tr><td>Zn⁰ → Zn²⁺ + 2e (oxidation)</td><td>Cu²⁺ + 2e → Cu⁰ (reduction)</td></tr>
<tr><td>Rod negative, solution positive</td><td>Rod positive, solution negative</td></tr>
<tr><td>Electrode loses weight</td><td>Electrode gains weight</td></tr></table></div>
<p>يعني في <b>الزنك</b>: الـ solution pressure أكبر، ذرات الزنك بتسيب الساق كأيونات (<b>أكسدة</b>)، والإلكترونات بتفضل فيها فالساق تبقى <b>سالبة</b> والمحلول <b>موجب</b>، ووزن القطب <b>يقل</b>. وفي <b>النحاس</b>: الـ ionic pressure أكبر، الأيونات بتترسب على الساق (<b>اختزال</b>)، فالساق تبقى <b>موجبة</b> والمحلول <b>سالب</b>، ووزن القطب <b>يزيد</b>.</p>
<p>في الحالتين بتتكون <b>electric double layer</b> عند السطح، وبيحصل فرق جهد بين الساق والمحلول. ده هو <b>جهد القطب (E)</b>: فرق الجهد بين الفلز وأيوناته، وهو مقياس لميل الفلز يتأكسد (يدوب) أو ميل أيوناته تتختزل (تترسب).</p>

<h4>2. معادلة Nernst لجهد القطب</h4>
<p>الميل ده بيعتمد على (1) <b>طبيعة النظام الكيميائية</b> و(2) <b>تركيز الأيونات</b>. والاتنين مجموعين في معادلة Nernst:</p>
<div class="formula">E = E⁰ + (RT / nF) ln [Mⁿ⁺]<small>R = 8.314 J/(K·mol) · T = °C + 273 · n = valency · F = 96,500 C</small></div>
<p>وعند 25 درجة بتتبسط لـ:</p>
<div class="formula">E = E⁰ + (0.059 / n) log [Mⁿ⁺]</div>
<p>لما التركيز = <b>1 مولار</b>، log 1 = صفر، فـ <b>E = E⁰</b>. ودي تعريف الظروف القياسية.</p>
<div class="ex"><b>مثال:</b> ساق نحاس (E⁰ = +0.34 V، n = 2) في Cu²⁺ تركيزه 0.01 M: <bdi>E = 0.34 + (0.059/2) × log 0.01 = 0.34 − 0.059 = 0.28 V</bdi>. تخفيف الأيونات بيقلل الجهد.</div>

<h4>3. قياس E⁰: قطب الهيدروجين القياسي</h4>
<p><b>ما ينفعش نقيس جهد قطب لوحده</b>؛ بنقيس بس <b>الفرق</b> بين قطبين. فكل قطب بيتقاس بالنسبة لـ<b>قطب مرجعي</b> جهده معروف وثابت: <b>قطب الهيدروجين القياسي (NHE)</b>.</p>
<ul>
<li>مكوّن من <b>غاز H₂</b> بيعدّي على بلاتين في <b>محلول HCl (H⁺)</b>.</li>
<li>جهده متعرّف إنه <b>E⁰ = صفر</b>.</li>
</ul>
<p>لما نوصّل نصفي الخلية بيمشي تيار. الـ <b>e.m.f.</b> هو الفرق الجبري بين جهدي القطبين. وبما إن الـ NHE صفر، الـ e.m.f. اللي بنقيسه = E⁰ بتاع القطب التاني.</p>
<p><b>جهد القطب القياسي (E⁰):</b> الـ e.m.f. اللي بيطلع لما نصف خلية من عنصر في <b>محلول 1 مولار من أيوناته</b> يتوصل بالـ NHE.</p>

<h4>4. السلسلة الكهروكيميائية</h4>
<p>لما نرتب كل العناصر حسب E⁰، من السالب مرورًا بالهيدروجين (صفر) للموجب:</p>
<div class="tblwrap"><table><tr><th>System</th><th>E⁰ (V)</th></tr>
<tr><td>Mg/Mg²⁺</td><td>−2.36</td></tr><tr><td>Zn/Zn²⁺</td><td>−0.76</td></tr><tr><td>Fe/Fe²⁺</td><td>−0.44</td></tr><tr><td>Sn/Sn²⁺</td><td>−0.13</td></tr><tr><td>H₂(Pt)/H⁺</td><td>0</td></tr><tr><td>Cu/Cu²⁺</td><td>+0.34</td></tr><tr><td>Ag/Ag⁺</td><td>+0.80</td></tr></table></div>
<p>4 استنتاجات:</p>
<ol>
<li><b>إشارة E⁰ زي شحنة القطب</b> (الزنك سالب والنحاس موجب).</li>
<li>كل ما E⁰ يبقى <b>سالب أكتر</b>، ميل الفلز إنه <b>يفقد إلكترونات</b> ويبقى أيونات (يتأكسد) يزيد. الفلزات دي <b>عوامل مختزلة</b>.</li>
<li>كل ما E⁰ يبقى <b>موجب أكتر</b>، ميل <b>الأيونات إنها تتختزل</b> وتترسب كفلز يزيد.</li>
<li>الفلز اللي جهده سالب أكتر بـ<b>يطرد</b> أي فلز تحته من محلوله. لو حطيتي زنك في CuSO₄ هيتغطى بنحاس والزنك يدوب.</li>
</ol>
<p>لما نوصّل نصفي خلية، الإلكترونات بتمشي <b>من القطب السالب أكتر للموجب أكتر</b> (من Zn لـ Cu، أو من Mg −2.36 لـ Ag +0.80).</p>

<h4>5. الخلايا الكهروكيميائية</h4>
<p>كل خلية فيها:</p>
<ol>
<li>موصّلين فلزيين (<b>أقطاب</b>)، كل واحد في إلكتروليت مناسب؛</li>
<li><b>دايرة خارجية</b> (سلك) بتوصّل الأقطاب؛</li>
<li><b>salt bridge</b> بيوصّل المحلولين.</li>
</ol>
<p>القطب اللي بيحصل عنده <b>أكسدة</b> اسمه <b>anode</b>، واللي عنده <b>اختزال</b> اسمه <b>cathode</b>. (للحفظ: "<b>An Ox</b> و <b>Red Cat</b>".)</p>
<h5>الخلية الجلفانية: طاقة كيميائية ← طاقة كهربية</h5>
<p>زنك في ZnSO₄ ونحاس في CuSO₄ متوصلين بسلك و salt bridge. التفاعل بيحصل <b>تلقائيًا</b>:</p>
<ul>
<li>عند <b>anode الزنك</b>: <bdi>Zn⁰ → Zn²⁺ + 2e</bdi> (أكسدة).</li>
<li>الإلكترونات بتمشي في السلك للنحاس.</li>
<li>عند <b>cathode النحاس</b>: <bdi>Cu²⁺ + 2e → Cu⁰</bdi> (اختزال)، والنحاس بيترسب على القطب.</li>
<li>حركة الإلكترونات دي هي التيار الناتج.</li>
</ul>
<h5>الخلية الإلكتروليتية: طاقة كهربية ← طاقة كيميائية</h5>
<p>ده اللي بيحصل لما <b>نشحن</b> خلية جلفانية. بنطبّق جهد أكبر من مصدر خارجي عكس جهد الخلية، فالتفاعلات بتمشي <b>بالعكس</b>:</p>
<ul><li><bdi>Zn²⁺ + 2e → Zn⁰</bdi> (الزنك بقى <b>cathode</b>)؛</li><li><bdi>Cu⁰ → Cu²⁺ + 2e</bdi> (النحاس بقى <b>anode</b>).</li></ul>
<div class="tblwrap"><table><tr><th>Galvanic</th><th>Electrolytic</th></tr>
<tr><td>Chemical → electrical</td><td>Electrical → chemical</td></tr>
<tr><td>Spontaneous</td><td>Non-spontaneous, external source</td></tr>
<tr><td>Produces current</td><td>Consumes current</td></tr>
<tr><td>Zn anode, Cu cathode</td><td>Reversed</td></tr></table></div>

<h4>6. الـ Salt bridge</h4>
<h5>التركيب</h5>
<ul>
<li>أنبوبة زجاج مقلوبة <b>على شكل حرف U</b>.</li>
<li>مليانة <b>جل آجار</b> متحضّر في محلول مشبع من <b>KCl أو KNO₃</b>.</li>
<li>أطرافها مسدودة بـ<b>قطن</b> عشان محتوياتها ما تتخلطش كتير بالكاسات.</li>
</ul>
<h5>الوظايف</h5>
<ul>
<li><b>توصيلة سائلة</b> بين نصفي الخلية بتـ<b>قفل الدايرة</b> من غير ما المحلولين يتخلطوا.</li>
<li>بتسمح بـ<b>انتقال الشحنة</b> (الأيونات بتتحرك فيها).</li>
<li><b>بتحافظ على تعادل كل محلول كهربيًا</b>. من غيرها ناحية الزنك هتتراكم فيها شحنة موجبة وناحية النحاس سالبة، والتيار هيقف.</li>
</ul>
<h5>الـ Liquid junction potential</h5>
<p>عند كل حد بين الـ bridge والمحلول بيطلع جهد صغير زيادة اسمه <b>liquid junction potential</b>، لأن الأيونات بتعدّي بسرعات مختلفة. عشان نقلله، لازم <b>الكاتيون والأنيون في ملح الـ bridge سرعتهم قريبة جدًا</b>. وعشان كده بنستخدم KCl و KNO₃: <bdi>K⁺ = 74، Cl⁻ = 73، NO₃⁻ = 76</bdi>.</p>
<div class="ex"><b>تدريب (سؤال محاضرة 3):</b> قطب في محلول ملحه طلع جهده −2.27 V. (1) القطب <b>سالب</b> والمحلول <b>موجب</b>. (2) الـ <b>solution pressure</b> أكبر من الـ ionic pressure (الفلز بيدوب). (3) عشان نقيسه نوصّله بقطب مرجعي جهده معروف، الـ <b>NHE</b>، ونقيس الـ e.m.f.</div>
`};
DEEP.analytical[3]={en:`
<p>Lecture 3 moves from metals in their own ions to <b>redox systems in solution</b>, such as Fe³⁺/Fe²⁺. It introduces the <b>oxidation potential</b>, the <b>standard oxidation potential (SOP) series</b> that predicts which oxidant can oxidise which reductant, and how to <b>calculate a redox titration curve</b> point by point.</p>

<h4>1. Redox couples</h4>
<p>Any system containing an oxidant and its reduced product (its <b>conjugate reductant</b>) sits in equilibrium:</p>
<div class="formula">Oxidant + ne ⇌ Conjugate reductant &nbsp;&nbsp; e.g. Fe³⁺ + e ⇌ Fe²⁺</div>
<p>The <b>more powerful the oxidant, the weaker its conjugate reductant</b>, and vice versa. So every system has a predominantly oxidising or reducing character.</p>

<h4>2. Oxidation potential</h4>
<p>Place an <b>inert electrode</b> (platinum, which doesn't react itself) in a solution containing both forms of a couple, e.g. Fe³⁺ and Fe²⁺. It takes up a definite potential that reflects the position of the equilibrium. This is the <b>oxidation potential</b>: the potential difference around an inert electrode in a solution of the oxidised and reduced forms.</p>
<ul>
<li>If the system is <b>oxidising</b>, it pulls electrons from the platinum, so the Pt becomes <b>positive</b>.</li>
<li>If the system is <b>reducing</b>, it pushes electrons onto the platinum, so the Pt becomes <b>negative</b>.</li>
<li>The size of the potential measures how oxidising (+) or reducing (−) the system is.</li>
</ul>
<h5>Nernst equation for oxidation potential</h5>
<div class="formula">E = E⁰ + (0.059 / n) log [Ox] / [Red]&nbsp;&nbsp;&nbsp;(at 25 °C)</div>
<p>At constant acidity and temperature, E depends on the <b>ratio [Ox]/[Red]</b>. When <b>[Ox] = [Red]</b>, the log term is zero and <b>E = E⁰</b>.</p>
<p><b>Standard oxidation potential (SOP):</b> the e.m.f. produced when a half-cell of an inert electrode (Pt) in <b>equal concentrations</b> of the oxidised and reduced forms is connected to the NHE.</p>

<h4>3. The SOP series and predicting reactions</h4>
<p>Arranging systems by SOP:</p>
<ol>
<li>The <b>higher (more positive)</b> the SOP, the <b>stronger the oxidising power</b> of the oxidised form and the weaker the reducing power of the reduced form.</li>
<li>The most powerful <b>oxidising agents are at the top</b> (high positive E⁰); the most powerful <b>reducing agents are at the bottom</b> (high negative E⁰).</li>
<li>For oxidation to go to completion there should be a <b>difference of about 0.4 V</b> between the two systems.</li>
</ol>
<div class="ex"><b>Lecture questions, using MnO₄⁻/Mn²⁺ 1.51, Cl₂/Cl⁻ 1.36, Br₂/Br⁻ ≈ 1.07, Fe³⁺/Fe²⁺ 0.77, I₂/I⁻ 0.54 V.</b><br>
Can MnO₄⁻ oxidise Cl⁻, Br⁻, I⁻ and Fe²⁺? It is above all of them, so yes in principle (the lecture's answer emphasises Br⁻, I⁻ and Fe²⁺, which are well below it; Cl⁻ is only 0.15 V below, which is the problem solved in Lecture 4).<br>
Can Fe³⁺ (0.77) oxidise I⁻, Cl⁻, Br⁻? Only <b>I⁻</b> (0.54) lies below it, so Fe³⁺ oxidises <b>iodide only</b>.</div>

<h4>4. Electrode potential vs oxidation potential</h4>
<div class="tblwrap"><table><tr><th></th><th>Electrode potential</th><th>Oxidation potential</th></tr>
<tr><td>Set-up</td><td>Metal dipped in a solution of its ions</td><td>Inert electrode (Pt) in a redox system Ox/Red</td></tr>
<tr><td>Equation</td><td>E = E⁰ + 0.059/n log [Mⁿ⁺]</td><td>E = E⁰ + 0.059/n log [Ox]/[Red]</td></tr>
<tr><td>E = E⁰ when</td><td>[Mⁿ⁺] = 1 M</td><td>[Ox] = [Red]</td></tr>
<tr><td>Series</td><td>Electrochemical series</td><td>SOP series</td></tr>
<tr><td>Example</td><td>Zn in ZnSO₄</td><td>Pt in Fe³⁺/Fe²⁺</td></tr></table></div>
<div class="tblwrap"><table><tr><th>Electrochemical series</th><th>SOP series</th></tr>
<tr><td>Starts with negative values, through 0 (H), to positive</td><td>Starts with positive values at the top, through 0, to negative</td></tr>
<tr><td>Negative = metal is oxidised (reducing agent); positive = metal is reduced</td><td>Positive (top) = strong oxidising agents; negative (bottom) = strong reducing agents</td></tr>
<tr><td>A more negative metal displaces metals below it</td><td>About 0.4 V difference needed for complete oxidation</td></tr></table></div>

<h4>5. Redox titrations and titration curves</h4>
<p>A <b>redox titration</b> reacts the sample with a standard solution, one acting as oxidant and the other as reductant. A <b>titration curve</b> plots <b>potential (V)</b> against <b>mL of titrant</b>, showing how E changes as the titration progresses.</p>
<h5>Worked example: 100 mL of 0.1 N Fe²⁺ titrated with 0.1 N Ce⁴⁺</h5>
<p>Reaction: Fe²⁺ + Ce⁴⁺ → Fe³⁺ + Ce³⁺ (1:1). E⁰(Fe³⁺/Fe²⁺) = 0.77 V; E⁰(Ce⁴⁺/Ce³⁺) = 1.44 V.</p>
<p><b>Before the equivalence point</b>, all added Ce⁴⁺ has reacted, so calculate E from the <b>iron couple</b>:</p>
<ul>
<li>After <b>10 mL</b>: 10 mL Fe³⁺ formed, 90 mL Fe²⁺ left. E = 0.77 + 0.059 log (10/90) = <b>0.71 V</b>. (The slide prints 0.69; recalculating gives 0.71.)</li>
<li>After <b>50 mL</b>: Fe³⁺ = Fe²⁺, so E = E⁰ = <b>0.77 V</b> (half-way point).</li>
<li>After <b>99.9 mL</b>: E = 0.77 + 0.059 log (99.9/0.1) = <b>0.95 V</b> (slide: 0.93).</li>
</ul>
<p><b>At the equivalence point</b> (100 mL), use the formula combining both couples:</p>
<div class="formula">E(e.p.) = (n₁E₁⁰ + n₂E₂⁰) / (n₁ + n₂) = (1 × 0.77 + 1 × 1.44) / 2 = 1.10 V<small>n₁, n₂ = electrons lost or gained by each system</small></div>
<p><b>After the equivalence point</b>, all iron is oxidised and excess Ce⁴⁺ is present, so use the <b>cerium couple</b>:</p>
<ul><li>After <b>100.1 mL</b>: 0.1 mL Ce⁴⁺ excess, 100 mL Ce³⁺. E = 1.44 + 0.059 log (0.1/100) = <b>1.26 V</b> (slide: 1.27).</li></ul>
<p>The curve rises slowly, then shows a <b>sudden jump in potential at the equivalence point</b>. That jump is what an indicator (Lecture 5) detects.</p>
<div class="pearl"><strong>Method:</strong> before e.p. → use the <b>sample</b> couple; at e.p. → (n₁E₁⁰ + n₂E₂⁰)/(n₁ + n₂); after e.p. → use the <b>titrant</b> couple.</div>
<h5>Practice question solved: 100 mL 0.1 N FeCl₂ with 0.1 N K₂Cr₂O₇</h5>
<p>E⁰(Cr₂O₇²⁻/Cr³⁺) = 1.33 V (n = 6); E⁰(Fe³⁺/Fe²⁺) = 0.77 V (n = 1). Using normalities, the equivalence point is at 100 mL.</p>
<ul>
<li><b>60 mL</b>: Fe³⁺/Fe²⁺ = 60/40. E = 0.77 + 0.059 log 1.5 = <b>0.78 V</b>.</li>
<li><b>Equivalence point</b>: E = (1 × 0.77 + 6 × 1.33) / (1 + 6) = 8.75 / 7 = <b>1.25 V</b>.</li>
<li><b>120 mL</b>: 20 mL excess dichromate, 100 mL Cr³⁺ formed. E = 1.33 + (0.059/6) log (20/100) = 1.33 − 0.007 = <b>1.32 V</b>.</li>
</ul>
<p>Notice the dichromate n = 6 makes the e.p. lie much closer to the dichromate E⁰: the e.p. is not halfway when the n values differ.</p>

<p>محاضرة 3 بتنقل من الفلزات في أيوناتها لـ<b>أنظمة الأكسدة والاختزال في المحلول</b>، زي Fe³⁺/Fe²⁺. بتقدّم <b>جهد الأكسدة (oxidation potential)</b>، و<b>سلسلة جهود الأكسدة القياسية (SOP)</b> اللي بتتوقع أنهي مؤكسد يقدر يأكسد أنهي مختزل، وإزاي <b>نحسب منحنى المعايرة</b> نقطة بنقطة.</p>

<h4>1. أزواج الأكسدة والاختزال</h4>
<p>أي نظام فيه مؤكسد والناتج المختزل بتاعه (<b>conjugate reductant</b>) بيكون في حالة توازن:</p>
<div class="formula">Oxidant + ne ⇌ Conjugate reductant &nbsp;&nbsp; e.g. Fe³⁺ + e ⇌ Fe²⁺</div>
<p><b>كل ما المؤكسد يبقى أقوى، المختزل المرافق ليه يبقى أضعف</b>، والعكس. فكل نظام ليه صفة غالبة: مؤكسد أو مختزل.</p>

<h4>2. جهد الأكسدة</h4>
<p>لو حطينا <b>قطب خامل</b> (بلاتين، ما بيتفاعلش) في محلول فيه الصورتين، زي Fe³⁺ و Fe²⁺، هياخد جهد معين بيعكس مكان التوازن. ده اسمه <b>جهد الأكسدة</b>: فرق الجهد حوالين قطب خامل في محلول فيه الصورة المؤكسدة والمختزلة.</p>
<ul>
<li>لو النظام <b>مؤكسد</b>، هيسحب إلكترونات من البلاتين فيبقى البلاتين <b>موجب</b>.</li>
<li>لو النظام <b>مختزل</b>، هيدفع إلكترونات على البلاتين فيبقى <b>سالب</b>.</li>
<li>قيمة الجهد بتقيس النظام مؤكسد (+) أو مختزل (−) قد إيه.</li>
</ul>
<h5>معادلة Nernst لجهد الأكسدة</h5>
<div class="formula">E = E⁰ + (0.059 / n) log [Ox] / [Red]</div>
<p>عند حموضة وحرارة ثابتين، E بيعتمد على <b>نسبة [Ox]/[Red]</b>. ولما <b>[Ox] = [Red]</b>، اللوغاريتم = صفر فـ <b>E = E⁰</b>.</p>
<p><b>جهد الأكسدة القياسي (SOP):</b> الـ e.m.f. اللي بيطلع لما نصف خلية من قطب خامل (Pt) في <b>تركيزات متساوية</b> من الصورتين يتوصل بالـ NHE.</p>

<h4>3. سلسلة الـ SOP وتوقع التفاعلات</h4>
<ol>
<li>كل ما الـ SOP يبقى <b>أعلى (موجب أكتر)</b>، <b>القوة المؤكسدة</b> للصورة المؤكسدة تزيد، والقوة المختزلة للصورة المختزلة تقل.</li>
<li>أقوى <b>العوامل المؤكسدة فوق</b> (E⁰ موجب عالي)، وأقوى <b>العوامل المختزلة تحت</b> (E⁰ سالب عالي).</li>
<li>عشان الأكسدة تكمل لازم يكون فيه <b>فرق حوالي 0.4 فولت</b> بين النظامين.</li>
</ol>
<div class="ex"><b>أسئلة المحاضرة، بالجهود دي: MnO₄⁻ 1.51، Cl₂ 1.36، Br₂ حوالي 1.07، Fe³⁺ 0.77، I₂ 0.54 فولت.</b><br>
هل البرمنجنات تقدر تأكسد Cl⁻ و Br⁻ و I⁻ و Fe²⁺؟ هي فوقهم كلهم فنظريًا آه (إجابة المحاضرة بتركز على Br⁻ و I⁻ و Fe²⁺ لأنهم أقل منها بكتير؛ أما Cl⁻ فأقل بـ 0.15 بس، ودي المشكلة اللي بتتحل في محاضرة 4).<br>
هل Fe³⁺ (0.77) يقدر يأكسد I⁻ و Cl⁻ و Br⁻؟ اللي تحته بس <b>I⁻</b> (0.54)، فالحديديك بيأكسد <b>اليوديد بس</b>.</div>

<h4>4. جهد القطب مقابل جهد الأكسدة</h4>
<div class="tblwrap"><table><tr><th></th><th>Electrode potential</th><th>Oxidation potential</th></tr>
<tr><td>Set-up</td><td>Metal in its ions</td><td>Pt in Ox/Red</td></tr>
<tr><td>Equation</td><td>E = E⁰ + 0.059/n log [Mⁿ⁺]</td><td>E = E⁰ + 0.059/n log [Ox]/[Red]</td></tr>
<tr><td>E = E⁰ when</td><td>[Mⁿ⁺] = 1 M</td><td>[Ox] = [Red]</td></tr>
<tr><td>Series</td><td>Electrochemical</td><td>SOP</td></tr>
<tr><td>Example</td><td>Zn in ZnSO₄</td><td>Pt in Fe³⁺/Fe²⁺</td></tr></table></div>
<p>والفرق بين السلسلتين: الـ <b>electrochemical series</b> بتبدأ بالسالب، وبعدين الهيدروجين صفر، وبعدين الموجب؛ السالب معناه الفلز بيتأكسد (عامل مختزل)، والفلز السالب أكتر بيطرد اللي تحته. أما الـ <b>SOP series</b> فبتبدأ بالموجب فوق؛ الموجب = عوامل مؤكسدة قوية، والسالب تحت = عوامل مختزلة قوية، ومحتاجين فرق 0.4 فولت عشان الأكسدة تكمل.</p>

<h4>5. معايرات الأكسدة والاختزال ومنحنياتها</h4>
<p>الـ <b>redox titration</b> بتفاعل العينة مع محلول قياسي، واحد بيشتغل مؤكسد والتاني مختزل. والـ <b>منحنى المعايرة</b> بيرسم <b>الجهد (فولت)</b> مقابل <b>مل المعاير</b>، فيوضح E بيتغير إزاي مع تقدم المعايرة.</p>
<h5>مثال محلول: 100 مل Fe²⁺ تركيزه 0.1 N مع Ce⁴⁺ تركيزه 0.1 N</h5>
<p>التفاعل: <bdi>Fe²⁺ + Ce⁴⁺ → Fe³⁺ + Ce³⁺</bdi> (1:1). E⁰ للحديد = 0.77، وللسيريوم = 1.44 فولت.</p>
<p><b>قبل نقطة التكافؤ</b>: كل السيريوم المضاف اتفاعل، فبنحسب E من <b>زوج الحديد</b>:</p>
<ul>
<li>بعد <b>10 مل</b>: 10 Fe³⁺ و 90 Fe²⁺. <bdi>E = 0.77 + 0.059 log (10/90) = 0.71 V</bdi>. (السلايد مكتوب 0.69، والحساب بيطلّع 0.71.)</li>
<li>بعد <b>50 مل</b>: الصورتين متساويين فـ <b>E = E⁰ = 0.77</b> (نقطة النص).</li>
<li>بعد <b>99.9 مل</b>: <bdi>E = 0.77 + 0.059 log (99.9/0.1) = 0.95 V</bdi> (السلايد: 0.93).</li>
</ul>
<p><b>عند نقطة التكافؤ</b> (100 مل) بنستخدم المعادلة اللي بتجمع الزوجين:</p>
<div class="formula">E(e.p.) = (n₁E₁⁰ + n₂E₂⁰) / (n₁ + n₂) = (0.77 + 1.44) / 2 = 1.10 V</div>
<p><b>بعد نقطة التكافؤ</b>: كل الحديد اتأكسد وفيه Ce⁴⁺ زيادة، فبنستخدم <b>زوج السيريوم</b>:</p>
<ul><li>بعد <b>100.1 مل</b>: 0.1 Ce⁴⁺ زيادة و100 Ce³⁺. <bdi>E = 1.44 + 0.059 log (0.1/100) = 1.26 V</bdi> (السلايد: 1.27).</li></ul>
<p>المنحنى بيطلع ببطء، وبعدين فيه <b>قفزة مفاجئة في الجهد عند نقطة التكافؤ</b>. القفزة دي هي اللي الكاشف بيحسها (محاضرة 5).</p>
<div class="pearl"><strong>الطريقة:</strong> قبل نقطة التكافؤ ← زوج <b>العينة</b>؛ عندها ← (n₁E₁⁰ + n₂E₂⁰)/(n₁ + n₂)؛ بعدها ← زوج <b>المعاير</b>.</div>
<h5>حل سؤال التدريب: 100 مل FeCl₂ تركيزه 0.1 N مع K₂Cr₂O₇ تركيزه 0.1 N</h5>
<p>E⁰ للداي كرومات = 1.33 (n = 6)، وللحديد = 0.77 (n = 1). بالنورمالية، نقطة التكافؤ عند 100 مل.</p>
<ul>
<li><b>60 مل</b>: النسبة 60/40. <bdi>E = 0.77 + 0.059 log 1.5 = 0.78 V</bdi>.</li>
<li><b>نقطة التكافؤ</b>: <bdi>E = (1 × 0.77 + 6 × 1.33) / 7 = 1.25 V</bdi>.</li>
<li><b>120 مل</b>: 20 مل داي كرومات زيادة و100 Cr³⁺. <bdi>E = 1.33 + (0.059/6) log (20/100) = 1.32 V</bdi>.</li>
</ul>
<p>لاحظي إن n = 6 للداي كرومات بيخلي نقطة التكافؤ قريبة جدًا من E⁰ بتاعه: النقطة مش في النص لما قيم n تختلف.</p>
`};
DEEP.analytical[4]={en:`
<p>The Nernst equation says the oxidation potential depends on the <b>ratio [Ox]/[Red]</b>. Lecture 4 turns this into a practical tool: by changing that ratio deliberately (adding a common ion, changing acidity, or complexing or precipitating one form), the analyst can <b>raise or lower a potential</b> to make a titration work, or to stop an interfering reaction. Two classic problems are solved this way: determining <b>FeCl₂ by permanganate</b> and <b>FeCl₂ by iodine</b>.</p>

<h4>1. The principle</h4>
<div class="formula">E = E⁰ + (0.059 / n) log [Ox] / [Red]</div>
<ul>
<li><b>Increase [Ox]</b> or <b>decrease [Red]</b> → the ratio rises → <b>E rises</b>.</li>
<li><b>Decrease [Ox]</b> or <b>increase [Red]</b> → the ratio falls → <b>E falls</b>.</li>
</ul>
<p>You can <b>remove</b> a form from the medium by converting it to an un-ionised form (with a <b>precipitating</b> or <b>complexing</b> agent), or <b>add</b> more of a form (the <b>common ion</b> effect).</p>
<p>Remember the rule from Lecture 3: a reaction goes to <b>completion only when ΔE is about 0.4 V or more</b>.</p>

<h4>2. Factor 1: the common ion effect</h4>
<h5>The problem: determining FeCl₂ with KMnO₄</h5>
<p>A ferrous chloride sample contains both Fe²⁺ and Cl⁻. Three systems are present:</p>
<div class="tblwrap"><table><tr><th>System</th><th>E⁰ (V)</th></tr><tr><td>MnO₄⁻/Mn²⁺</td><td>+1.51</td></tr><tr><td>Cl₂/Cl⁻</td><td>+1.36</td></tr><tr><td>Fe³⁺/Fe²⁺</td><td>+0.77</td></tr></table></div>
<p>Permanganate lies above both, so it oxidises <b>Fe²⁺ and Cl⁻</b>: 2MnO₄⁻ + 10Cl⁻ + 16H⁺ → 2Mn²⁺ + 5Cl₂ + 8H₂O. Extra KMnO₄ is consumed by chloride, so the result for iron comes out <b>too high</b>.</p>
<h5>The solution: Zimmermann–Reinhardt reagent (MnSO₄ + H₃PO₄ + H₂SO₄)</h5>
<p>We need to lower the MnO₄⁻/Mn²⁺ potential <b>below</b> Cl₂/Cl⁻ (1.36) but keep it <b>above</b> Fe³⁺/Fe²⁺ (0.77). Each component has a job:</p>
<ul>
<li><b>MnSO₄</b>: adds Mn²⁺, the <b>reduced form</b> of the permanganate couple (a common ion). In E = E⁰ + 0.059/5 log [MnO₄⁻]/[Mn²⁺], raising [Mn²⁺] lowers E below 1.36 V, so chloride is no longer oxidised, while E stays well above iron.</li>
<li><b>H₃PO₄</b>: forms a <b>colourless complex with the yellow Fe³⁺</b>. This (a) removes the yellow colour, so the pink permanganate end point is easy to see, and (b) lowers [Fe³⁺], which <b>lowers the Fe³⁺/Fe²⁺ potential</b> and increases the reducing power of Fe²⁺, widening the gap with permanganate.</li>
<li><b>H₂SO₄</b>: supplies the <b>acidity</b> so permanganate is reduced fully to Mn²⁺ (5 electrons) and reacts completely with Fe²⁺.</li>
</ul>

<h4>3. Factor 2: hydrogen-ion concentration (pH)</h4>
<p>For oxidising agents that <b>contain oxygen</b>, H⁺ appears in the half-equation, so [H⁺] must be included in the Nernst equation and has a deciding effect:</p>
<div class="formula">MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O &nbsp;(E⁰ = 1.51)<br>E = E⁰ + (0.059/5) log [MnO₄⁻][H⁺]⁸ / [Mn²⁺]</div>
<p>Because [H⁺] is raised to the 8th power, <b>more acid → higher E</b>; less acid → lower E. Selective oxidation of halides by permanganate shows this (I₂/I⁻ 0.54, Br₂/Br⁻ 1.07, Cl₂/Cl⁻ 1.36):</p>
<ul>
<li><b>pH 5</b>: oxidises <b>I⁻ only</b>.</li>
<li><b>pH 3</b>: oxidises <b>I⁻ and Br⁻</b>, not Cl⁻.</li>
<li><b>Lower pH</b> (strongly acid): oxidises <b>I⁻, Br⁻ and Cl⁻</b>.</li>
</ul>
<h5>Arsenate and iodide: pH reverses the reaction</h5>
<div class="formula">AsO₄³⁻ + 2H⁺ + 2e ⇌ AsO₃³⁻ + H₂O &nbsp;(E⁰ ≈ 0.56)<br>E = E⁰ + (0.059/2) log [AsO₄³⁻][H⁺]² / [AsO₃³⁻]</div>
<p>E⁰ for arsenate (0.56) is almost the same as for I₂/I⁻ (0.54), so pH decides the direction:</p>
<ul>
<li><b>Acid medium</b>: high [H⁺] raises the arsenate potential, so <b>arsenate oxidises iodide to iodine</b>: AsO₄³⁻ + 2I⁻ + 2H⁺ → AsO₃³⁻ + I₂ + H₂O.</li>
<li><b>Alkaline medium</b> (with NaHCO₃): low [H⁺] lowers the arsenate potential and increases the reducing power of arsenite, so <b>iodine oxidises arsenite</b>: the reverse reaction.</li>
</ul>

<h4>4. Factor 3: complexing agents</h4>
<h5>Lowering Fe³⁺/Fe²⁺ with F⁻ or PO₄³⁻</h5>
<p>F⁻ and PO₄³⁻ form stable complexes with Fe³⁺ ([FeF₆]³⁻, iron–phosphate complexes). This removes Fe³⁺ from the reaction, lowers its free concentration, lowers the ratio [Fe³⁺]/[Fe²⁺], and so <b>lowers the Fe³⁺/Fe²⁺ potential</b>. (Used again in Lecture 5 with diphenylamine.)</p>
<h5>Raising I₂/I⁻ with HgCl₂</h5>
<div class="formula">I₂ + 2e ⇌ 2I⁻ &nbsp;&nbsp; E = E⁰ + (0.059/2) log [I₂] / [I⁻]²</div>
<p>HgCl₂ binds iodide as the soluble complex <b>[HgI₄]²⁻</b> (HgCl₂ + 4I⁻ → [HgI₄]²⁻). This removes I⁻, so [I⁻] (the reduced form) drops, the ratio rises, and the <b>I₂/I⁻ potential increases</b>.</p>

<h4>5. Factor 4: precipitating agents</h4>
<p><b>Ferricyanide/ferrocyanide</b>: [Fe(CN)₆]⁴⁻ ⇌ [Fe(CN)₆]³⁻ + e. Adding <b>Zn²⁺</b> precipitates ferrocyanide as Zn₂[Fe(CN)₆]. Removing the reduced form raises the ratio [Fe(CN)₆³⁻]/[Fe(CN)₆⁴⁻], so the <b>potential increases</b>.</p>

<h4>6. Applied problem: determining FeCl₂ by iodine</h4>
<p><b>Problem:</b> I₂/I⁻ is only 0.54 V, below Fe³⁺/Fe²⁺ (0.77). Iodine is too weak to oxidise Fe²⁺ at all. (Cl⁻ at 1.36 V certainly won't be touched.)</p>
<p><b>Solution: add HgCl₂ + H₃PO₄.</b></p>
<ul>
<li><b>HgCl₂</b> complexes I⁻ as [HgI₄]²⁻, <b>raising</b> the I₂/I⁻ potential above Fe³⁺/Fe²⁺ (but still below Cl₂/Cl⁻), so iodine can now oxidise Fe²⁺.</li>
<li><b>H₃PO₄</b> complexes the yellow Fe³⁺ (colourless) and <b>lowers</b> the Fe³⁺/Fe²⁺ potential, increasing the reducing power of Fe²⁺.</li>
</ul>
<p>Both changes push the two potentials apart in the right direction until the reaction I₂ + 2Fe²⁺ → 2Fe³⁺ + 2I⁻ can proceed.</p>
<div class="pearl"><strong>Compare the two FeCl₂ problems:</strong> with KMnO₄ the oxidant is <b>too strong</b> (it attacks Cl⁻), so we <b>lower</b> it with Mn²⁺. With I₂ the oxidant is <b>too weak</b>, so we <b>raise</b> it with HgCl₂. In both, H₃PO₄ lowers the iron potential.</div>
<div class="ex"><b>Exam-style question (Fall 25 midterm):</b> arsenate is mixed with Sn²⁺ and Br⁻. Only <b>Sn²⁺</b> is oxidised, because its potential is <b>below</b> arsenate's; Br⁻ has a <b>higher</b> potential than arsenate, so it isn't oxidised. Always compare positions in the SOP series.</div>
`,ar:`
<p>معادلة Nernst بتقول إن جهد الأكسدة بيعتمد على <b>نسبة [Ox]/[Red]</b>. المحاضرة الرابعة بتحوّل ده لأداة عملية: لو غيّرنا النسبة دي بقصد (نضيف أيون مشترك، أو نغيّر الحموضة، أو نعمل معقد أو راسب لصورة منهم)، المحلّل يقدر <b>يرفع أو يقلل جهد</b> عشان المعايرة تنجح، أو عشان يوقف تفاعل متداخل. مشكلتين مشهورتين بيتحلوا بالطريقة دي: تقدير <b>FeCl₂ بالبرمنجنات</b> و<b>FeCl₂ باليود</b>.</p>

<h4>1. الفكرة الأساسية</h4>
<div class="formula">E = E⁰ + (0.059 / n) log [Ox] / [Red]</div>
<ul>
<li><b>نزوّد [Ox]</b> أو <b>نقلل [Red]</b> ← النسبة تزيد ← <b>E يزيد</b>.</li>
<li><b>نقلل [Ox]</b> أو <b>نزوّد [Red]</b> ← النسبة تقل ← <b>E يقل</b>.</li>
</ul>
<p>نقدر <b>نشيل</b> صورة من الوسط بإننا نحوّلها لصورة مش متأينة (بمادة <b>بترسّب</b> أو <b>بتعمل معقد</b>)، أو <b>نضيف</b> منها أكتر (تأثير <b>الأيون المشترك</b>).</p>
<p>وافتكري قاعدة محاضرة 3: التفاعل بـ<b>يكمل بس لما فرق الجهد حوالي 0.4 فولت أو أكتر</b>.</p>

<h4>2. العامل 1: تأثير الأيون المشترك</h4>
<h5>المشكلة: تقدير FeCl₂ بالـ KMnO₄</h5>
<p>عينة كلوريد الحديدوز فيها Fe²⁺ و Cl⁻ مع بعض. يبقى عندنا 3 أنظمة:</p>
<div class="tblwrap"><table><tr><th>System</th><th>E⁰ (V)</th></tr><tr><td>MnO₄⁻/Mn²⁺</td><td>+1.51</td></tr><tr><td>Cl₂/Cl⁻</td><td>+1.36</td></tr><tr><td>Fe³⁺/Fe²⁺</td><td>+0.77</td></tr></table></div>
<p>البرمنجنات فوق الاتنين، فهتأكسد <b>Fe²⁺ و Cl⁻</b> مع بعض. يعني KMnO₄ زيادة هيروح على الكلوريد، فنتيجة الحديد هتطلع <b>أعلى من الحقيقة</b>.</p>
<h5>الحل: كاشف Zimmermann–Reinhardt (MnSO₄ + H₃PO₄ + H₂SO₄)</h5>
<p>محتاجين نقلل جهد MnO₄⁻/Mn²⁺ لـ<b>تحت</b> الكلور (1.36) بس يفضل <b>فوق</b> الحديد (0.77). وكل مكوّن ليه شغلانة:</p>
<ul>
<li><b>MnSO₄</b>: بيضيف Mn²⁺، وهو <b>الصورة المختزلة</b> لزوج البرمنجنات (أيون مشترك). في المعادلة، زيادة [Mn²⁺] بتقلل E لتحت 1.36، فالكلوريد ما يتأكسدش، والجهد يفضل فوق الحديد بكتير.</li>
<li><b>H₃PO₄</b>: بيعمل <b>معقد عديم اللون مع الـ Fe³⁺ الأصفر</b>. ده (أ) بيشيل اللون الأصفر فنقطة النهاية الوردي بتاعة البرمنجنات تبان بسهولة، و(ب) بيقلل [Fe³⁺] فـ<b>جهد الحديد يقل</b> وقوة Fe²⁺ المختزلة تزيد، فالفرق مع البرمنجنات يكبر.</li>
<li><b>H₂SO₄</b>: بيدي <b>الحموضة</b> عشان البرمنجنات تتختزل بالكامل لـ Mn²⁺ (5 إلكترونات) وتتفاعل تمامًا مع Fe²⁺.</li>
</ul>

<h4>3. العامل 2: تركيز أيون الهيدروجين (الـ pH)</h4>
<p>العوامل المؤكسدة اللي <b>فيها أكسجين</b>، الـ H⁺ بيظهر في نص المعادلة بتاعها، فلازم [H⁺] يدخل في معادلة Nernst وبيبقى ليه تأثير حاسم:</p>
<div class="formula">MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O &nbsp;(E⁰ = 1.51)<br>E = E⁰ + (0.059/5) log [MnO₄⁻][H⁺]⁸ / [Mn²⁺]</div>
<p>عشان [H⁺] مرفوع للأس 8، <b>حمض أكتر ← E أعلى</b>، وحمض أقل ← E أقل. الأكسدة الانتقائية للهالوجينات بالبرمنجنات بتوضح ده (اليود 0.54، البروم 1.07، الكلور 1.36):</p>
<ul>
<li><b>pH 5</b>: بتأكسد <b>اليوديد بس</b>.</li>
<li><b>pH 3</b>: بتأكسد <b>اليوديد والبروميد</b>، مش الكلوريد.</li>
<li><b>pH أقل</b> (حمضي جدًا): بتأكسد <b>التلاتة</b>.</li>
</ul>
<h5>الأرسينات واليوديد: الـ pH بيعكس التفاعل</h5>
<div class="formula">AsO₄³⁻ + 2H⁺ + 2e ⇌ AsO₃³⁻ + H₂O &nbsp;(E⁰ ≈ 0.56)<br>E = E⁰ + (0.059/2) log [AsO₄³⁻][H⁺]² / [AsO₃³⁻]</div>
<p>E⁰ للأرسينات (0.56) تقريبًا زي اليود (0.54)، فالـ pH هو اللي بيحدد الاتجاه:</p>
<ul>
<li><b>في وسط حمضي</b>: [H⁺] العالي بيرفع جهد الأرسينات، فـ<b>الأرسينات بتأكسد اليوديد ليود</b>.</li>
<li><b>في وسط قلوي</b> (مع NaHCO₃): [H⁺] القليل بيقلل جهد الأرسينات ويزوّد قوة الأرسينيت المختزلة، فـ<b>اليود بيأكسد الأرسينيت</b>: التفاعل العكسي.</li>
</ul>

<h4>4. العامل 3: المواد اللي بتعمل معقدات</h4>
<h5>تقليل جهد الحديد بالـ F⁻ أو PO₄³⁻</h5>
<p>الـ F⁻ والـ PO₄³⁻ بيعملوا معقدات ثابتة مع Fe³⁺. ده بيشيل Fe³⁺ من التفاعل، فتركيزه الحر يقل، ونسبة [Fe³⁺]/[Fe²⁺] تقل، فـ<b>جهد Fe³⁺/Fe²⁺ يقل</b>. (هنستخدمه تاني في محاضرة 5 مع الـ diphenylamine.)</p>
<h5>رفع جهد اليود بالـ HgCl₂</h5>
<div class="formula">I₂ + 2e ⇌ 2I⁻ &nbsp;&nbsp; E = E⁰ + (0.059/2) log [I₂] / [I⁻]²</div>
<p>الـ HgCl₂ بيمسك اليوديد في معقد ذايب <b>[HgI₄]²⁻</b>. ده بيشيل I⁻ (الصورة المختزلة)، فالنسبة تزيد و<b>جهد I₂/I⁻ يزيد</b>.</p>

<h4>5. العامل 4: المواد اللي بترسّب</h4>
<p><b>الفيريسيانيد/الفيروسيانيد</b>: لما نضيف <b>Zn²⁺</b> بيرسّب الفيروسيانيد على شكل Zn₂[Fe(CN)₆]. شيل الصورة المختزلة بيرفع النسبة، فـ<b>الجهد يزيد</b>.</p>

<h4>6. مسألة تطبيقية: تقدير FeCl₂ باليود</h4>
<p><b>المشكلة:</b> جهد اليود 0.54 بس، أقل من الحديد (0.77). يعني اليود أضعف من إنه يأكسد Fe²⁺ أصلًا. (والكلوريد عند 1.36 أكيد مش هيتلمس.)</p>
<p><b>الحل: نضيف HgCl₂ + H₃PO₄.</b></p>
<ul>
<li><b>HgCl₂</b> بيعمل معقد مع I⁻ فـ<b>يرفع</b> جهد اليود لفوق الحديد (بس لسه تحت الكلور)، فاليود يقدر يأكسد Fe²⁺.</li>
<li><b>H₃PO₄</b> بيعمل معقد مع Fe³⁺ الأصفر (عديم اللون) و<b>يقلل</b> جهد الحديد، فقوة Fe²⁺ المختزلة تزيد.</li>
</ul>
<p>التغييرين مع بعض بيبعدوا الجهدين في الاتجاه الصح لحد ما التفاعل <bdi>I₂ + 2Fe²⁺ → 2Fe³⁺ + 2I⁻</bdi> يمشي.</p>
<div class="pearl"><strong>قارني المشكلتين:</strong> مع KMnO₄ المؤكسد <b>قوي زيادة</b> (بيهاجم الكلوريد)، فبنـ<b>قلله</b> بـ Mn²⁺. ومع اليود المؤكسد <b>ضعيف</b>، فبنـ<b>رفعه</b> بـ HgCl₂. وفي الاتنين الـ H₃PO₄ بيقلل جهد الحديد.</div>
<div class="ex"><b>سؤال امتحان (ميدترم Fall 25):</b> أرسينات متخلطة مع Sn²⁺ و Br⁻. اللي هيتأكسد <b>Sn²⁺ بس</b>، لأن جهده <b>أقل</b> من الأرسينات؛ أما Br⁻ فجهده <b>أعلى</b> من الأرسينات فمش هيتأكسد. دايمًا قارني الأماكن في سلسلة الـ SOP.</div>
