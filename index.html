DEEP.analytical[5]={en:`
<p>A titration is only as good as its <b>end point detection</b>. Lecture 5 covers the six ways of detecting the end point in redox titrations, how to <b>choose an internal indicator</b> from potentials, the properties of the three main oxidising titrants (<b>KMnO₄, K₂Cr₂O₇, Ce⁴⁺</b>), and how to analyse real samples: peroxides, iron(II), ferrocyanide, iron(III), ferricyanide, oxalates, and cations that form insoluble oxalates.</p>

<h4>1. Warm-up exam question</h4>
<div class="ex">In acid, yellow dichromate reacts with colourless iodide to give a deep amber solution (green Cr³⁺ plus brown I₂). Balanced equation: <b>Cr₂O₇²⁻ + 6I⁻ + 14H⁺ → 2Cr³⁺ + 3I₂ + 7H₂O</b>. (Dichromate gains 6e; each 2I⁻ → I₂ loses 2e, so 3 iodine molecules.)</div>

<h4>2. Six ways to detect the end point</h4>
<h5>1. Self indicator (no indicator added)</h5>
<p>The titrant itself has a strong colour that changes sharply at the end point.</p>
<ul>
<li><b>KMnO₄</b>: while reducing agent remains, purple MnO₄⁻ is reduced to colourless Mn²⁺ and disappears. Once all the sample is oxidised, the first slight excess colours the solution <b>pink</b>.</li>
<li><b>I₂</b>: at the end point the brown colour of excess iodine appears. Because that colour is faint and unstable, <b>starch</b> is usually added; it forms an intense <b>blue</b> adsorption compound with excess free I₂.</li>
</ul>
<h5>2. Internal redox indicators</h5>
<p>Substances whose <b>oxidised and reduced forms have different colours</b>, so they change colour when the solution's potential reaches a definite value. Requirements:</p>
<ol>
<li>An <b>intense</b> colour change, so a tiny amount of titrant triggers it.</li>
<li>The two colours (reduced and oxidised) must be <b>clearly different</b>, for a sharp change.</li>
<li>Its <b>transition potential must lie between</b> the E⁰ values of the two systems: <b>above the sample and below the titrant</b>. Why? Before the end point the potential is set by the sample couple; just after, by the titrant couple. The potential jumps across this gap at the equivalence point (Lecture 3), so the indicator must change within it. Too close to the sample and it changes too early; too close to the titrant and it changes too late.</li>
</ol>
<div class="tblwrap"><table><tr><th>Indicator</th><th>E⁰ (V)</th><th>Colour change (reduced → oxidised)</th><th>Notes</th></tr>
<tr><td>Diphenylamine</td><td>0.76 (n = 2)</td><td>Colourless → blue-violet</td><td>Water-insoluble; used as 1% solution in conc. H₂SO₄. Transition range 0.73–0.79 V</td></tr>
<tr><td>Ferroin (Fe²⁺–1,10-phenanthroline)</td><td>1.06</td><td>Red (ferroin) → pale blue (ferrin)</td><td>Excellent for <b>Ce⁴⁺</b></td></tr>
<tr><td>N-Phenylanthranilic acid</td><td>1.08</td><td>Colourless → pinkish violet</td><td>Used for <b>Cr₂O₇²⁻</b></td></tr></table></div>
<p>Diphenylamine's transition range means: below 0.73 V the colourless reduced form dominates; above 0.79 V the blue-violet oxidised form dominates; between them the colour changes gradually.</p>
<h5>Choosing an indicator: Fe²⁺ titrated with dichromate</h5>
<ul>
<li><b>Diphenylamine (0.76) is unsuitable on its own</b>, because its E⁰ is almost equal to Fe³⁺/Fe²⁺ (0.77). It would change colour before all the iron is oxidised. <b>Fix:</b> add <b>PO₄³⁻ (H₃PO₄)</b> or F⁻, which complexes Fe³⁺ and lowers the iron potential (Lecture 4), opening a gap below the indicator.</li>
<li><b>N-Phenylanthranilic acid (1.08) is suitable directly</b>, because it lies between 0.77 (sample) and 1.36 (dichromate).</li>
</ul>
<h5>3. External indicators (spot test)</h5>
<p>For Fe²⁺ with K₂Cr₂O₇: drops of the titrated solution are taken out and tested on a tile with <b>potassium ferricyanide</b>. While Fe²⁺ remains, each spot turns <b>blue</b>. At the end point no Fe²⁺ is left, and the blue colour no longer appears.</p>
<h5>4. Irreversible indicators</h5>
<p>Highly coloured organic dyes, such as <b>methyl orange and methyl red</b>, that are <b>destroyed</b> (irreversibly oxidised) by the first excess of a strong oxidant such as <b>BrO₃⁻</b>. They are red in acid and become decolourised at the end point.</p>
<h5>5. Specific indicators</h5>
<p>React specifically with one reagent to give a colour: <b>starch</b> gives blue with <b>iodine</b>; <b>SCN⁻</b> gives red with <b>Fe³⁺</b>.</p>
<h5>6. Potentiometric method</h5>
<p>The potential of a cell containing the titrated solution is followed with an instrument, and the end point is the <b>inflection point</b> (steepest part) of the titration curve.</p>

<h4>3. The main oxidising titrants</h4>
<h5>A. Potassium permanganate (KMnO₄)</h5>
<ul>
<li>A <b>very strong</b> oxidising agent (E⁰ 1.51, gains 5e in acid).</li>
<li>A <b>self indicator</b>.</li>
<li>Its solution <b>deteriorates</b> on standing, and it is <b>not a primary standard</b>: the solid always contains some MnO₂, and the solution reacts with traces of organic matter in water.</li>
<li><b>Preparation:</b> dissolve the crystals in water; <b>boil gently 15–30 minutes</b> to destroy reducing impurities in the water; <b>filter through a non-reducing medium</b> (glass wool or sintered glass, not filter paper, whose cellulose reduces MnO₄⁻); <b>standardise</b> against a reducing primary standard (<b>arsenious trioxide</b> or <b>sodium oxalate</b>); store in a <b>dark bottle</b>.</li>
</ul>
<h5>B. Potassium dichromate (K₂Cr₂O₇)</h5>
<ul>
<li>A <b>primary standard</b>: highly pure and stable.</li>
<li><b>Not a self indicator</b>: orange Cr₂O₇²⁻ turns to green Cr³⁺, a change that is hard to see.</li>
<li>Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O.</li>
<li>It <b>cannot oxidise chloride</b>, oxalate or ferrocyanide. So it is ideal for <b>Fe²⁺ in the presence of Cl⁻</b> (no Zimmermann's reagent needed). Indicator: ferroin, diphenylamine + H₃PO₄, phenylanthranilic acid, or the external ferricyanide spot test.</li>
</ul>
<h5>C. Ceric sulfate (Ce(SO₄)₂)</h5>
<ul>
<li>Ce⁴⁺ + e → Ce³⁺: yellowish-orange → colourless.</li>
<li>It can act as a (weak) self indicator, but an internal indicator such as <b>ferroin</b> is better.</li>
<li>A <b>secondary standard</b>, standardised against sodium oxalate or arsenite.</li>
<li>Its solution is <b>very stable</b>, and it works in any acid medium.</li>
</ul>
<div class="tblwrap"><table><tr><th></th><th>KMnO₄</th><th>Ce⁴⁺</th><th>K₂Cr₂O₇</th></tr>
<tr><td>Strength</td><td>Strongest</td><td>Second</td><td>Third</td></tr>
<tr><td>Self indicator</td><td>Yes (purple → first pink)</td><td>Weak (yellow → colourless)</td><td>No (orange → green)</td></tr>
<tr><td>Primary standard</td><td>No</td><td>No</td><td><b>Yes</b></td></tr>
<tr><td>Stability of solution</td><td>Deteriorates</td><td>Very stable</td><td>Stable</td></tr>
<tr><td>Oxidises Cl⁻?</td><td>Yes (problem)</td><td>—</td><td>No</td></tr>
<tr><td>Usual indicator</td><td>Self</td><td>Ferroin</td><td>Ferroin / diphenylamine / phenylanthranilic acid</td></tr></table></div>

<h4>4. Reducing agents that KMnO₄ can determine</h4>
<div class="tblwrap"><table><tr><th>Sample</th><th>Oxidised to</th></tr>
<tr><td>Oxalate C₂O₄²⁻</td><td>CO₂</td></tr><tr><td>Fe²⁺</td><td>Fe³⁺</td></tr><tr><td>Ferrocyanide [Fe(CN)₆]⁴⁻</td><td>Ferricyanide [Fe(CN)₆]³⁻</td></tr><tr><td>As³⁺, Sb³⁺</td><td>As⁵⁺, Sb⁵⁺</td></tr><tr><td>H₂O₂</td><td>O₂</td></tr><tr><td>SO₂ / SO₃²⁻</td><td>SO₄²⁻</td></tr><tr><td>NO₂⁻</td><td>NO₃⁻</td></tr></table></div>

<h4>5. Analysing real samples</h4>
<h5>i. Hydrogen peroxide</h5>
<ul>
<li><b>Permanganometry</b>: dilute, acidify with dilute H₂SO₄, titrate with KMnO₄ (self indicator): 2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂ + 8H₂O.</li>
<li><b>Cerimetry</b> with ferroin: 2Ce⁴⁺ + H₂O₂ → 2Ce³⁺ + O₂ + 2H⁺.</li>
</ul>
<h5>ii. Iron(II)</h5>
<ol>
<li><b>KMnO₄</b> in dilute H₂SO₄. If Cl⁻ is present, add <b>Zimmermann–Reinhardt reagent</b> (Lecture 4).</li>
<li><b>K₂Cr₂O₇</b> with diphenylamine + H₃PO₄, ferroin, or the external ferricyanide spot test: Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O.</li>
<li><b>Ce⁴⁺</b> until the solution turns pale yellow (self), or with ferroin, or with methyl red until its red colour is bleached (irreversible).</li>
</ol>
<h5>iii. Ferrocyanide</h5>
<p>With <b>MnO₄⁻</b> (self indicator): 5[Fe(CN)₆]⁴⁻ + MnO₄⁻ + 8H⁺ → 5[Fe(CN)₆]³⁻ + Mn²⁺ + 4H₂O. Or with <b>Ce⁴⁺</b> (ferroin): [Fe(CN)₆]⁴⁻ + Ce⁴⁺ → [Fe(CN)₆]³⁻ + Ce³⁺.</p>
<h5>Oxidising samples: reduce first, then titrate</h5>
<ul>
<li><b>iv. Iron(III)</b>: reduce to Fe²⁺ with <b>SnCl₂</b> or <b>amalgamated zinc</b> (Zn + HgCl₂), then titrate as Fe²⁺.</li>
<li><b>v. Ferricyanide</b>: reduce to ferrocyanide with SnCl₂, then titrate as ferrocyanide.</li>
</ul>
<h5>vi. Soluble oxalates</h5>
<ul>
<li>Titrate with Ce⁴⁺ or KMnO₄ in dilute H₂SO₄ at about <b>70 °C</b>. Both act as self indicators.</li>
<li>The reaction is <b>slow at the start</b> but speeds up once some Mn²⁺ (or Ce³⁺) has formed, because the product <b>catalyses</b> the reaction (autocatalysis).</li>
<li>5C₂O₄²⁻ + 2MnO₄⁻ + 16H⁺ → 10CO₂ + 2Mn²⁺ + 8H₂O; C₂O₄²⁻ + 2Ce⁴⁺ → 2CO₂ + 2Ce³⁺.</li>
</ul>
<h5>vii. Cations that form insoluble oxalates (Ca²⁺, Pb²⁺, Ba²⁺): back-titration</h5>
<ol>
<li>Add a <b>known excess</b> of standard oxalate to precipitate the cation (CaC₂O₄↓).</li>
<li>Filter and wash the precipitate.</li>
<li>Collect the filtrate and washings, which contain the <b>excess</b> oxalate.</li>
<li>Acidify with H₂SO₄.</li>
<li><b>Back-titrate</b> the remaining oxalate with KMnO₄ at about 60 °C. Oxalate used by the cation = oxalate added − oxalate titrated.</li>
</ol>
<h5>Practice questions (answered)</h5>
<div class="ex"><b>Mixture of Fe³⁺/Fe²⁺:</b> titrate one portion directly with KMnO₄ (or dichromate) to get <b>Fe²⁺</b>. Reduce a second portion with SnCl₂ or amalgamated zinc, then titrate to get <b>total iron</b>. Fe³⁺ = total − Fe²⁺.<br>
<b>Ferrocyanide/ferricyanide mixture:</b> titrate one portion directly with KMnO₄ or Ce⁴⁺ for ferrocyanide. Reduce another with SnCl₂ and titrate for the total. Ferricyanide = total − ferrocyanide.<br>
<b>Calcium in CaCO₃:</b> dissolve in acid, precipitate with a known excess of oxalate, filter, and back-titrate the excess with KMnO₄ (method vii). Alternatively, dissolve the washed CaC₂O₄ precipitate in H₂SO₄ and titrate the released oxalate directly.</div>

<p>المعايرة نجاحها بيعتمد على <b>كشف نقطة النهاية</b>. محاضرة 5 بتغطي 6 طرق لكشف نقطة النهاية في معايرات الأكسدة والاختزال، وإزاي <b>نختار كاشف داخلي</b> من الجهود، وخواص المعايرات المؤكسدة التلاتة الأساسية (<b>KMnO₄ و K₂Cr₂O₇ و Ce⁴⁺</b>)، وإزاي نحلل عينات حقيقية: البيروكسيد، والحديد الثنائي، والفيروسيانيد، والحديد الثلاثي، والفيريسيانيد، والأوكسالات، والكاتيونات اللي بتعمل أوكسالات مش بتدوب.</p>

<h4>1. سؤال امتحان للتسخين</h4>
<div class="ex">في وسط حمضي، الداي كرومات الأصفر بيتفاعل مع اليوديد عديم اللون ويدي محلول كهرماني غامق (Cr³⁺ أخضر + I₂ بني). المعادلة الموزونة: <bdi>Cr₂O₇²⁻ + 6I⁻ + 14H⁺ → 2Cr³⁺ + 3I₂ + 7H₂O</bdi>. (الداي كرومات بيكسب 6، وكل 2I⁻ ← I₂ بيفقدوا 2، فيبقى 3 جزيئات يود.)</div>

<h4>2. ست طرق لكشف نقطة النهاية</h4>
<h5>1. كاشف ذاتي (من غير كاشف)</h5>
<p>المعاير نفسه لونه قوي وبيتغير بوضوح عند نقطة النهاية.</p>
<ul>
<li><b>KMnO₄</b>: طول ما فيه عامل مختزل، البنفسجي بتاع MnO₄⁻ بيتختزل لـ Mn²⁺ عديم اللون ويختفي. ولما العينة كلها تتأكسد، أول نقطة زيادة بتلوّن المحلول <b>وردي</b>.</li>
<li><b>I₂</b>: عند نقطة النهاية بيظهر اللون البني لليود الزيادة. وعشان اللون ده باهت ومش ثابت، غالبًا بنضيف <b>نشا</b> بيعمل مع اليود الحر لون <b>أزرق</b> قوي.</li>
</ul>
<h5>2. كواشف داخلية (Internal)</h5>
<p>مواد <b>صورتها المؤكسدة والمختزلة لونهم مختلف</b>، فبتغيّر لونها لما جهد المحلول يوصل لقيمة معينة. شروطها:</p>
<ol>
<li>تغيّر اللون يكون <b>قوي</b>، فكمية صغيرة جدًا من المعاير تشغّله.</li>
<li>اللونين (المختزل والمؤكسد) <b>مختلفين بوضوح</b>، عشان التغيير يبقى حاد.</li>
<li><b>جهد التحول بتاعه لازم يكون بين</b> E⁰ بتاع النظامين: <b>فوق العينة وتحت المعاير</b>. ليه؟ قبل نقطة النهاية الجهد بيحدده زوج العينة، وبعدها على طول بيحدده زوج المعاير. الجهد بيقفز في المسافة دي عند نقطة التكافؤ (محاضرة 3)، فالكاشف لازم يتغير جواها. لو قريب من العينة هيتغير بدري، ولو قريب من المعاير هيتأخر.</li>
</ol>
<div class="tblwrap"><table><tr><th>Indicator</th><th>E⁰ (V)</th><th>Colour change</th><th>Notes</th></tr>
<tr><td>Diphenylamine</td><td>0.76 (n = 2)</td><td>Colourless → blue-violet</td><td>1% in conc. H₂SO₄; range 0.73–0.79</td></tr>
<tr><td>Ferroin</td><td>1.06</td><td>Red → pale blue (ferrin)</td><td>Excellent for Ce⁴⁺</td></tr>
<tr><td>N-Phenylanthranilic acid</td><td>1.08</td><td>Colourless → pinkish violet</td><td>Used for Cr₂O₇²⁻</td></tr></table></div>
<p>مدى الـ diphenylamine معناه: تحت 0.73 الصورة المختزلة عديمة اللون هي الغالبة، وفوق 0.79 الصورة المؤكسدة البنفسجي الأزرق هي الغالبة، وما بينهم اللون بيتغير تدريجيًا. والـ <b>ferroin</b> هو معقد الحديدوز مع 1,10-phenanthroline، لونه أحمر قوي وبيتأكسد لـ ferrin أزرق باهت.</p>
<h5>اختيار الكاشف: معايرة Fe²⁺ بالداي كرومات</h5>
<ul>
<li><b>الـ Diphenylamine (0.76) مش مناسب لوحده</b>، لأن E⁰ بتاعه تقريبًا زي الحديد (0.77)، فهيغيّر لونه قبل ما الحديد كله يتأكسد. <b>الحل:</b> نضيف <b>PO₄³⁻ (H₃PO₄)</b> أو F⁻، بيعملوا معقد مع Fe³⁺ ويقللوا جهد الحديد (محاضرة 4)، فتتفتح مسافة تحت الكاشف.</li>
<li><b>الـ N-Phenylanthranilic acid (1.08) مناسب مباشرة</b>، لأنه بين 0.77 (العينة) و1.36 (الداي كرومات).</li>
</ul>
<h5>3. كواشف خارجية (Spot test)</h5>
<p>في معايرة Fe²⁺ بالـ K₂Cr₂O₇: بناخد نقط من المحلول ونختبرها على بلاطة فيها <b>potassium ferricyanide</b>. طول ما فيه Fe²⁺ كل نقطة بتبقى <b>زرقا</b>. وعند نقطة النهاية مفيش Fe²⁺، فاللون الأزرق ما بيظهرش.</p>
<h5>4. كواشف غير عكسية</h5>
<p>صبغات عضوية لونها قوي، زي <b>methyl orange و methyl red</b>، <b>بتتدمر</b> (بتتأكسد بشكل غير عكسي) بأول زيادة من مؤكسد قوي زي <b>BrO₃⁻</b>. لونها أحمر في الحمض وبيختفي عند نقطة النهاية.</p>
<h5>5. كواشف نوعية (Specific)</h5>
<p>بتتفاعل بالتحديد مع مادة واحدة وتدي لون: <b>النشا</b> بيدي أزرق مع <b>اليود</b>؛ و<b>SCN⁻</b> بيدي أحمر مع <b>Fe³⁺</b>.</p>
<h5>6. الطريقة الـ Potentiometric</h5>
<p>بنتابع جهد خلية فيها المحلول بجهاز، ونقطة النهاية هي <b>نقطة الانقلاب</b> (أشد جزء) في منحنى المعايرة.</p>

<h4>3. المعايرات المؤكسدة الأساسية</h4>
<h5>أ. برمنجنات البوتاسيوم (KMnO₄)</h5>
<ul>
<li>عامل مؤكسد <b>قوي جدًا</b> (E⁰ 1.51، بيكسب 5 إلكترونات في الحمض).</li>
<li><b>كاشف ذاتي</b>.</li>
<li>محلوله <b>بيبوظ</b> مع الوقت، و<b>مش primary standard</b>: الصلب دايمًا فيه شوية MnO₂، والمحلول بيتفاعل مع آثار المواد العضوية في الماء.</li>
<li><b>التحضير:</b> ندوّب البلورات في ماء؛ <b>نغلي بهدوء 15–30 دقيقة</b> عشان نكسّر الشوائب المختزلة في الماء؛ <b>نفلتر في وسط مش مختزل</b> (صوف زجاج أو sintered glass، مش ورق ترشيح لأن السليلوز بيختزل البرمنجنات)؛ <b>نعاير</b> ضد مادة مختزلة قياسية (<b>arsenious trioxide</b> أو <b>sodium oxalate</b>)؛ ونخزّن في <b>زجاجة غامقة</b>.</li>
</ul>
<h5>ب. داي كرومات البوتاسيوم (K₂Cr₂O₇)</h5>
<ul>
<li><b>Primary standard</b>: نقي جدًا وثابت.</li>
<li><b>مش كاشف ذاتي</b>: البرتقالي بيتحول لأخضر (Cr³⁺)، وده تغيير صعب نشوفه.</li>
<li><bdi>Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O</bdi>.</li>
<li><b>ما بيأكسدش الكلوريد</b> ولا الأوكسالات ولا الفيروسيانيد. فهو مثالي لـ<b>Fe²⁺ في وجود Cl⁻</b> (من غير كاشف Zimmermann). الكاشف: ferroin، أو diphenylamine + H₃PO₄، أو phenylanthranilic acid، أو spot test بالفيريسيانيد.</li>
</ul>
<h5>ج. كبريتات السيريك (Ce(SO₄)₂)</h5>
<ul>
<li><bdi>Ce⁴⁺ + e → Ce³⁺</bdi>: من أصفر برتقالي لعديم اللون.</li>
<li>ممكن يبقى كاشف ذاتي (ضعيف)، بس الأفضل كاشف داخلي زي <b>ferroin</b>.</li>
<li><b>Secondary standard</b>، بيتعاير ضد sodium oxalate أو arsenite.</li>
<li>محلوله <b>ثابت جدًا</b>، وبيشتغل في أي وسط حمضي.</li>
</ul>
<div class="tblwrap"><table><tr><th></th><th>KMnO₄</th><th>Ce⁴⁺</th><th>K₂Cr₂O₇</th></tr>
<tr><td>Strength</td><td>Strongest</td><td>Second</td><td>Third</td></tr>
<tr><td>Self indicator</td><td>Yes</td><td>Weak</td><td>No</td></tr>
<tr><td>Primary standard</td><td>No</td><td>No</td><td>Yes</td></tr>
<tr><td>Solution stability</td><td>Deteriorates</td><td>Very stable</td><td>Stable</td></tr>
<tr><td>Oxidises Cl⁻?</td><td>Yes</td><td>—</td><td>No</td></tr>
<tr><td>Indicator</td><td>Self</td><td>Ferroin</td><td>Ferroin / diphenylamine / PAA</td></tr></table></div>

<h4>4. العوامل المختزلة اللي البرمنجنات تقدر تقدّرها</h4>
<div class="tblwrap"><table><tr><th>Sample</th><th>Oxidised to</th></tr>
<tr><td>Oxalate</td><td>CO₂</td></tr><tr><td>Fe²⁺</td><td>Fe³⁺</td></tr><tr><td>Ferrocyanide</td><td>Ferricyanide</td></tr><tr><td>As³⁺, Sb³⁺</td><td>As⁵⁺, Sb⁵⁺</td></tr><tr><td>H₂O₂</td><td>O₂</td></tr><tr><td>SO₂ / SO₃²⁻</td><td>SO₄²⁻</td></tr><tr><td>NO₂⁻</td><td>NO₃⁻</td></tr></table></div>

<h4>5. تحليل عينات حقيقية</h4>
<h5>1. فوق أكسيد الهيدروجين (H₂O₂)</h5>
<ul>
<li><b>Permanganometry</b>: نخفف، ونحمّض بـ H₂SO₄ مخفف، ونعاير بالبرمنجنات (كاشف ذاتي): <bdi>2MnO₄⁻ + 5H₂O₂ + 6H⁺ → 2Mn²⁺ + 5O₂ + 8H₂O</bdi>.</li>
<li><b>Cerimetry</b> بالـ ferroin: <bdi>2Ce⁴⁺ + H₂O₂ → 2Ce³⁺ + O₂ + 2H⁺</bdi>.</li>
</ul>
<h5>2. الحديد الثنائي (Fe²⁺)</h5>
<ol>
<li>بالـ <b>KMnO₄</b> في H₂SO₄ مخفف. لو فيه Cl⁻ نضيف <b>كاشف Zimmermann</b> (محاضرة 4).</li>
<li>بالـ <b>K₂Cr₂O₇</b> مع diphenylamine + H₃PO₄، أو ferroin، أو spot test بالفيريسيانيد.</li>
<li>بالـ <b>Ce⁴⁺</b> لحد ما المحلول يبقى أصفر باهت (ذاتي)، أو مع ferroin، أو مع methyl red لحد ما لونه الأحمر يختفي (غير عكسي).</li>
</ol>
<h5>3. الفيروسيانيد</h5>
<p>بالـ <b>MnO₄⁻</b> (كاشف ذاتي) أو بالـ <b>Ce⁴⁺</b> (ferroin).</p>
<h5>العينات المؤكسدة: نختزل الأول وبعدين نعاير</h5>
<ul>
<li><b>4. الحديد الثلاثي</b>: نختزله لـ Fe²⁺ بـ <b>SnCl₂</b> أو <b>الزنك الملغّم</b> (Zn + HgCl₂)، وبعدين نعاير زي Fe²⁺.</li>
<li><b>5. الفيريسيانيد</b>: نختزله لفيروسيانيد بـ SnCl₂، وبعدين نعاير زي الفيروسيانيد.</li>
</ul>
<h5>6. الأوكسالات الذايبة</h5>
<ul>
<li>نعاير بـ Ce⁴⁺ أو KMnO₄ في H₂SO₄ مخفف على حوالي <b>70 درجة</b>. الاتنين كواشف ذاتية.</li>
<li>التفاعل <b>بطيء في الأول</b> وبيسرع لما شوية Mn²⁺ (أو Ce³⁺) يتكونوا، لأن الناتج نفسه <b>بيحفّز</b> التفاعل (autocatalysis).</li>
</ul>
<h5>7. كاتيونات بتعمل أوكسالات مش بتدوب (Ca²⁺ و Pb²⁺ و Ba²⁺): معايرة رجعية</h5>
<ol>
<li>نضيف <b>زيادة معروفة</b> من أوكسالات قياسية فتترسب الكاتيون (CaC₂O₄↓).</li>
<li>نفلتر ونغسل الراسب.</li>
<li>نجمع الفلترات ومية الغسيل، وفيهم الأوكسالات <b>الزيادة</b>.</li>
<li>نحمّض بـ H₂SO₄.</li>
<li><b>نعاير الأوكسالات الباقية</b> بالبرمنجنات على حوالي 60 درجة. الأوكسالات اللي استهلكها الكاتيون = المضاف − اللي اتعاير.</li>
</ol>
<h5>أسئلة التدريب (محلولة)</h5>
<div class="ex"><b>خليط Fe³⁺/Fe²⁺:</b> نعاير جزء مباشرة بالبرمنجنات (أو الداي كرومات) فنعرف <b>Fe²⁺</b>. ونختزل جزء تاني بـ SnCl₂ أو الزنك الملغّم وبعدين نعاير فنعرف <b>الحديد الكلي</b>. يبقى Fe³⁺ = الكلي − Fe²⁺.<br>
<b>خليط فيروسيانيد/فيريسيانيد:</b> نعاير جزء مباشرة بالبرمنجنات أو Ce⁴⁺ للفيروسيانيد. ونختزل جزء تاني بـ SnCl₂ ونعاير للكلي. الفيريسيانيد = الكلي − الفيروسيانيد.<br>
<b>الكالسيوم في CaCO₃:</b> ندوّب في حمض، ونرسّب بزيادة معروفة من الأوكسالات، ونفلتر، ونعاير الزيادة رجعيًا بالبرمنجنات (طريقة 7). أو ندوّب راسب CaC₂O₄ المغسول في H₂SO₄ ونعاير الأوكسالات اللي طلعت مباشرة.</div>

<p>Lecture 6 covers three more oxidising titrants: <b>iodine</b> (in two opposite ways, iodimetry and iodometry), <b>potassium iodate</b> (Andrew's and Lang's methods) and <b>potassium bromate</b> (as a stable source of bromine, e.g. for phenol). It also reuses the Lecture 4 tricks for shifting potentials, applied to iodine titrations.</p>

<h4>1. Iodine as a titrant</h4>
<div class="formula">I₂ + 2e ⇌ 2I⁻ &nbsp;&nbsp;E⁰ = +0.535 V &nbsp;(brown → colourless)</div>
<ul>
<li>Iodine can act as a self indicator, but <b>starch</b> is preferred because it gives a much sharper end point.</li>
<li>I₂ is <b>highly volatile</b>, so its solutions lose strength. They are standardised against <b>As₂O₃</b> or standard <b>Na₂S₂O₃</b>.</li>
<li>Because E⁰ is in the middle of the series, iodine works both ways: <b>I₂ can oxidise systems with a lower potential</b>, and <b>I⁻ can be oxidised by systems with a higher potential</b>. That gives two methods.</li>
</ul>

<h4>2. Iodimetry vs iodometry</h4>
<div class="tblwrap"><table><tr><th></th><th>Iodimetry (direct)</th><th>Iodometry (indirect)</th></tr>
<tr><td>Principle</td><td>Sample is titrated directly with standard I₂</td><td>Excess KI is added to the sample; the liberated I₂ is titrated with standard Na₂S₂O₃</td></tr>
<tr><td>Titrant</td><td>Iodine</td><td>Sodium thiosulfate</td></tr>
<tr><td>Samples</td><td><b>Reducing agents</b></td><td><b>Oxidising agents</b></td></tr>
<tr><td>Indicator</td><td>Starch</td><td>Starch</td></tr>
<tr><td>When starch is added</td><td>At the <b>beginning</b></td><td>Near the end, when the brown I₂ colour becomes <b>pale</b></td></tr>
<tr><td>End point</td><td><b>Permanent blue</b> appears</td><td>Blue <b>disappears</b></td></tr></table></div>
<div class="pearl"><strong>Why add starch late in iodometry?</strong> At the start there's a lot of iodine. With excess iodine, starch forms an <b>irreversible</b> blue complex that doesn't release the iodine properly, so the end point would be blurred and late.</div>

<h4>3. Detecting the end point in iodine titrations</h4>
<h5>Starch</h5>
<ul>
<li>Used as a <b>colloidal solution</b> that gives a deep-blue adsorption complex with even traces of I₂.</li>
<li>With excess I₂ an irreversible blue complex forms (see above).</li>
<li><b>Can't be used</b> in <b>strongly acid</b> medium (starch hydrolyses) or in <b>alcoholic</b> solution (alcohol hinders adsorption of I₂ on starch).</li>
</ul>
<h5>Organic solvent (CHCl₃ or CCl₄)</h5>
<p>In alcohol or concentrated acid, use an immiscible organic solvent instead. I₂ is about <b>90 times more soluble</b> in CHCl₃ or CCl₄ than in water, so it collects in the organic layer as a <b>violet</b> colour; its disappearance or appearance marks the end point.</p>

<h4>4. Applications of iodimetry (titrating with I₂)</h4>
<ul>
<li><b>Thiosulfate</b>: titrated directly with I₂ and starch: I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻ (tetrathionate).</li>
<li><b>Ascorbic acid (vitamin C)</b>: oxidised by I₂ to dehydroascorbic acid.</li>
</ul>
<h5>Arsenite: lower the arsenate potential</h5>
<p>AsO₄³⁻/AsO₃³⁻ (+0.57) is slightly above I₂/I⁻ (+0.54), so iodine can't oxidise arsenite unless we lower the arsenate potential. Its Nernst equation contains [H⁺]²: AsO₄³⁻ + 2H⁺ + 2e → AsO₃³⁻ + H₂O. Making the solution <b>alkaline with NaHCO₃</b> reduces [H⁺], lowering the potential below iodine's, so I₂ oxidises arsenite.</p>
<p><b>Why not NaOH?</b> Iodine reacts with OH⁻ to form <b>hypoiodite (IO⁻)</b>, which has different oxidising properties from I₂ and ruins the stoichiometry. NaHCO₃ is only mildly alkaline.</p>
<h5>Ferrous salts: lower the iron potential</h5>
<p>Fe³⁺/Fe²⁺ (0.77) is above I₂/I⁻ (0.54), so iodine can't oxidise Fe²⁺. Add <b>pyrophosphate, EDTA or F⁻</b>: they complex Fe³⁺, removing it and lowering the Fe³⁺/Fe²⁺ potential <b>below</b> iodine's. (Alternatively, as in Lecture 4, <b>HgCl₂</b> raises the iodine potential by complexing I⁻ as [HgI₄]²⁻.)</p>

<h4>5. Applications of iodometry (add KI, titrate the I₂ with thiosulfate)</h4>
<ul>
<li><b>H₂O₂</b>: add excess KI in acid: H₂O₂ + 2H⁺ + 2I⁻ → I₂ + 2H₂O; titrate the I₂ with Na₂S₂O₃.</li>
<li><b>Bromine or chlorine</b>: Br₂ + 2I⁻ → I₂ + 2Br⁻; Cl₂ + 2I⁻ → I₂ + 2Cl⁻; titrate the I₂.</li>
<li>Also Cu²⁺ and other oxidants that sit above I₂/I⁻.</li>
</ul>
<h5>Ferricyanide: raise its potential</h5>
<p>Fe(CN)₆³⁻/Fe(CN)₆⁴⁻ is only <b>+0.36 V</b>, below iodine (0.54), so ferricyanide can't oxidise I⁻. Add <b>Zn²⁺</b>: it precipitates ferrocyanide as Zn₂[Fe(CN)₆], removing the reduced form, raising the ratio and therefore the ferricyanide potential above iodine's. Now ferricyanide liberates I₂ from KI, which is titrated with thiosulfate.</p>

<h4>6. Potassium iodate (KIO₃)</h4>
<ul>
<li><b>Highly pure</b>: its solution is prepared by <b>direct weighing</b> (a primary standard).</li>
<li>A <b>powerful oxidant</b> whose product depends on the medium:</li>
</ul>
<div class="tblwrap"><table><tr><th>Medium</th><th>Half-reaction</th><th>Electrons</th></tr>
<tr><td>Neutral</td><td>IO₃⁻ + 3H₂O + 6e → I⁻ + 6OH⁻</td><td>6</td></tr>
<tr><td>Slightly acidic</td><td>IO₃⁻ + 6H⁺ + 5e → ½I₂ + 3H₂O</td><td>5</td></tr>
<tr><td>Strongly acidic</td><td>IO₃⁻ + 6H⁺ + 4e → I⁺ + 3H₂O</td><td>4</td></tr></table></div>
<h5>Andrew's method</h5>
<ul>
<li>IO₃⁻ is the titrant in <b>strong HCl (4–6 N)</b>. It is reduced to the unstable <b>iodonium ion I⁺</b>, which is stabilised as <b>ICl</b> or <b>[ICl₂]⁻</b>. Indicator: <b>chloroform</b>.</li>
<li>Examples: IO₃⁻ + 6H⁺ + 2As³⁺ → 2As⁵⁺ + I⁺ + 3H₂O (similarly with Sb³⁺, Cu⁺, I₂ and I⁻).</li>
<li>ICl is stable <b>only above 4 N HCl</b>. H₂SO₄ and HNO₃ can't stabilise I⁺. Concentrated HCl supplies both the chloride ions and the acid.</li>
<li><b>What happens during the titration:</b> the first portions of iodate are reduced only to I₂, which colours the chloroform layer <b>violet</b>. When all the reducing agent is used up, further iodate oxidises that I₂ to I⁺: IO₃⁻ + 2I₂ + 10Cl⁻ + 6H⁺ → 5[ICl₂]⁻ + 3H₂O. The end point is when the <b>last violet trace disappears from the organic layer</b>, leaving the <b>yellow</b> ICl colour in the aqueous layer.</li>
<li><b>Why not starch?</b> The medium is strongly acidic, and starch hydrolyses in strong acid.</li>
</ul>
<h5>Lang's modification</h5>
<ul>
<li>Iodate titrant in <b>1–2 N H₂SO₄</b> with <b>HCN</b> present; indicator <b>starch</b> (the acid is mild enough).</li>
<li>The I⁺ is stabilised by CN⁻ as <b>ICN</b>.</li>
<li><b>Disadvantage:</b> HCN is an extremely dangerous poison.</li>
</ul>
<div class="tblwrap"><table><tr><th></th><th>Andrew's method</th><th>Lang's modification</th></tr>
<tr><td>Titrant</td><td>KIO₃</td><td>KIO₃</td></tr>
<tr><td>Medium</td><td>4–6 N HCl</td><td>1–2 N H₂SO₄ + HCN</td></tr>
<tr><td>Indicator</td><td>Chloroform</td><td>Starch</td></tr>
<tr><td>I⁺ stabilised as</td><td>ICl / [ICl₂]⁻</td><td>ICN</td></tr>
<tr><td>Drawback</td><td>Needs very strong acid</td><td>HCN is very toxic</td></tr></table></div>

<h4>7. Potassium bromate (KBrO₃): bromometric titrations</h4>
<ul>
<li>A <b>primary standard</b> and a strong oxidant in acid: BrO₃⁻ + 6H⁺ + 6e → Br⁻ + 3H₂O.</li>
<li>Its main use is as a <b>stable source of bromine</b>. Standard Br₂ solutions can't be used directly because Br₂ is volatile and unstable. Instead we use a <b>BrO₃⁻/Br⁻ mixture</b>: in neutral solution it contains no Br₂, but on acidification it is converted <b>quantitatively</b> to the equivalent amount of Br₂:</li>
</ul>
<div class="formula">BrO₃⁻ + 5Br⁻ + 6H⁺ → 3Br₂ + 3H₂O</div>
<h5>Determination of phenol (back-titration, finished iodometrically)</h5>
<ol>
<li>Add a <b>known excess</b> of standard KBrO₃/KBr and acidify, generating a known amount of Br₂ (KBrO₃ + 5KBr + 6HCl → 3Br₂ + 6KCl + 3H₂O).</li>
<li>In the dark, Br₂ substitutes the phenol ring: phenol + 3Br₂ → <b>2,4,6-tribromophenol</b>↓ (yellow precipitate) + 3HBr. Chloroform is added to dissolve the precipitate so it doesn't trap (occlude) bromine.</li>
<li>Add <b>KI</b>: the unreacted Br₂ liberates an equivalent amount of I₂ (Br₂ + 2I⁻ → I₂ + 2Br⁻).</li>
<li>Titrate the I₂ with standard <b>Na₂S₂O₃</b> (I₂ + 2S₂O₃²⁻ → S₄O₆²⁻ + 2I⁻).</li>
<li>Phenol ≡ Br₂ added − Br₂ left over (the end point value).</li>
</ol>

<h4>8. Practice questions (answered)</h4>
<div class="ex"><b>How to analyse, given E⁰: AsO₄³⁻/AsO₃³⁻ 0.57, I₂/I⁻ 0.54, Fe(CN)₆³⁻/⁴⁻ 0.36, Fe³⁺/Fe²⁺ 0.77.</b><br>
<b>Arsenate (AsO₄³⁻)</b>, an oxidant: <b>iodometry</b>. In <b>acid</b> its potential rises above iodine's, so it liberates I₂ from excess KI; titrate the I₂ with thiosulfate.<br>
<b>Ferrocyanide (Fe(CN)₆⁴⁻)</b>, a reductant at 0.36 V (below iodine): <b>iodimetry</b>. I₂ can oxidise it directly, since iodine's potential is higher; titrate with standard I₂ and starch.<br>
<b>Fe³⁺</b>, an oxidant at 0.77 V (above iodine): <b>iodometry</b>. Fe³⁺ oxidises I⁻ to I₂; titrate the liberated I₂ with thiosulfate.</div>
<div class="ex"><b>Compare Andrew's and Lang's methods:</b> see the table above. Both use KIO₃ and produce I⁺; Andrew's uses strong HCl, chloroform indicator and ICl; Lang's uses dilute H₂SO₄ + HCN, starch, and ICN.</div>
`,ar:`
<p>محاضرة 6 بتغطي 3 معايرات مؤكسدة كمان: <b>اليود</b> (بطريقتين عكس بعض: iodimetry و iodometry)، و<b>يودات البوتاسيوم</b> (طريقة Andrew وتعديل Lang)، و<b>برومات البوتاسيوم</b> (كمصدر ثابت للبروم، زي في تقدير الفينول). وكمان بتستخدم تاني حيل محاضرة 4 لتغيير الجهود، بس على معايرات اليود.</p>

<h4>1. اليود كمعاير</h4>
<div class="formula">I₂ + 2e ⇌ 2I⁻ &nbsp;&nbsp;E⁰ = +0.535 V &nbsp;(brown → colourless)</div>
<ul>
<li>اليود ممكن يبقى كاشف ذاتي، بس الأفضل <b>النشا</b> لأنه بيدي نقطة نهاية أوضح بكتير.</li>
<li>الـ I₂ <b>متطاير جدًا</b>، فمحاليله بتضعف. بتتعاير ضد <b>As₂O₃</b> أو <b>Na₂S₂O₃</b> قياسي.</li>
<li>عشان E⁰ بتاعه في نص السلسلة، اليود بيشتغل في الاتجاهين: <b>الـ I₂ يقدر يأكسد الأنظمة اللي جهدها أقل</b>، و<b>الـ I⁻ ممكن يتأكسد بأنظمة جهدها أعلى</b>. ومن هنا طلعت طريقتين.</li>
</ul>

<h4>2. Iodimetry مقابل Iodometry</h4>
<div class="tblwrap"><table><tr><th></th><th>Iodimetry (direct)</th><th>Iodometry (indirect)</th></tr>
<tr><td>Principle</td><td>Titrate sample with I₂</td><td>Add excess KI; titrate liberated I₂ with thiosulfate</td></tr>
<tr><td>Titrant</td><td>Iodine</td><td>Na₂S₂O₃</td></tr>
<tr><td>Samples</td><td>Reducing agents</td><td>Oxidising agents</td></tr>
<tr><td>Starch added</td><td>At the beginning</td><td>Near the end (pale brown)</td></tr>
<tr><td>End point</td><td>Permanent blue</td><td>Blue disappears</td></tr></table></div>
<p>يعني: الـ <b>iodimetry مباشرة</b>، بنعاير <b>العوامل المختزلة</b> باليود القياسي، والنشا بيتحط <b>من الأول</b>، ونقطة النهاية <b>أزرق ثابت</b> بيظهر. والـ <b>iodometry غير مباشرة</b>، بنضيف KI زيادة للـ<b>عوامل المؤكسدة</b> فيتحرر يود نعايره بالثيوسلفات، والنشا بيتحط <b>قرب الآخر</b> لما البني يبهت، ونقطة النهاية <b>الأزرق يختفي</b>.</p>
<div class="pearl"><strong>ليه النشا بيتحط متأخر في الـ iodometry؟</strong> في الأول فيه يود كتير. ومع اليود الزيادة، النشا بيعمل معقد أزرق <b>غير عكسي</b> ما بيسيبش اليود كويس، فنقطة النهاية هتبقى مش واضحة ومتأخرة.</div>

<h4>3. كشف نقطة النهاية في معايرات اليود</h4>
<h5>النشا</h5>
<ul>
<li>بيتستخدم <b>محلول غروي</b> بيدي معقد أزرق غامق حتى مع آثار بسيطة من اليود.</li>
<li>مع اليود الزيادة بيتكوّن معقد أزرق غير عكسي.</li>
<li><b>ما ينفعش</b> في وسط <b>حمضي قوي</b> (النشا بيتحلل) ولا في محلول <b>كحولي</b> (الكحول بيمنع امتصاص اليود على النشا).</li>
</ul>
<h5>مذيب عضوي (CHCl₃ أو CCl₄)</h5>
<p>في وجود كحول أو حمض مركّز بنستخدم مذيب عضوي ما بيمتزجش بالماء. اليود بيدوب فيه <b>90 مرة أكتر</b> من الماء، فبيتجمع في الطبقة العضوية بلون <b>بنفسجي</b>، وظهوره أو اختفاؤه هو نقطة النهاية.</p>

<h4>4. تطبيقات الـ Iodimetry (المعايرة باليود)</h4>
<ul>
<li><b>الثيوسلفات</b>: بيتعاير مباشرة باليود والنشا: <bdi>I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻</bdi> (tetrathionate).</li>
<li><b>فيتامين C (ascorbic acid)</b>: اليود بيأكسده لـ dehydroascorbic acid.</li>
</ul>
<h5>الأرسينيت: نقلل جهد الأرسينات</h5>
<p>جهد الأرسينات (0.57) أعلى شوية من اليود (0.54)، فاليود ما يقدرش يأكسد الأرسينيت إلا لو قللنا جهد الأرسينات. ومعادلة Nernst بتاعته فيها [H⁺]². لما نخلي المحلول <b>قلوي بـ NaHCO₃</b>، [H⁺] يقل، والجهد ينزل تحت اليود، فاليود يأكسد الأرسينيت.</p>
<p><b>ليه مش NaOH؟</b> اليود بيتفاعل مع OH⁻ ويعمل <b>hypoiodite (IO⁻)</b> وده خواصه المؤكسدة مختلفة عن I₂ فيبوّظ الحسابات. والـ NaHCO₃ قلوي خفيف بس.</p>
<h5>أملاح الحديدوز: نقلل جهد الحديد</h5>
<p>جهد الحديد (0.77) أعلى من اليود (0.54)، فاليود ما يقدرش يأكسد Fe²⁺. نضيف <b>pyrophosphate أو EDTA أو F⁻</b>: بيعملوا معقد مع Fe³⁺ ويشيلوه، فجهد الحديد ينزل <b>تحت</b> اليود. (أو زي محاضرة 4، <b>HgCl₂</b> بيرفع جهد اليود بإنه يمسك I⁻ في [HgI₄]²⁻.)</p>

<h4>5. تطبيقات الـ Iodometry (نضيف KI ونعاير اليود بالثيوسلفات)</h4>
<ul>
<li><b>H₂O₂</b>: نضيف KI زيادة في حمض: <bdi>H₂O₂ + 2H⁺ + 2I⁻ → I₂ + 2H₂O</bdi>، ونعاير اليود بالثيوسلفات.</li>
<li><b>البروم أو الكلور</b>: <bdi>Br₂ + 2I⁻ → I₂ + 2Br⁻</bdi> و <bdi>Cl₂ + 2I⁻ → I₂ + 2Cl⁻</bdi>، ونعاير اليود.</li>
<li>وكمان Cu²⁺ ومؤكسدات تانية فوق اليود.</li>
</ul>
<h5>الفيريسيانيد: نرفع جهده</h5>
<p>جهد الفيريسيانيد/الفيروسيانيد <b>0.36</b> بس، تحت اليود، فالفيريسيانيد ما يقدرش يأكسد I⁻. نضيف <b>Zn²⁺</b>: بيرسّب الفيروسيانيد على شكل Zn₂[Fe(CN)₆]، فالصورة المختزلة تتشال والنسبة تزيد وجهد الفيريسيانيد يطلع فوق اليود. دلوقتي الفيريسيانيد يحرر يود من KI، ونعايره بالثيوسلفات.</p>

<h4>6. يودات البوتاسيوم (KIO₃)</h4>
<ul>
<li><b>نقي جدًا</b>: محلوله بيتحضّر <b>بالوزن المباشر</b> (primary standard).</li>
<li><b>مؤكسد قوي</b> والناتج بيعتمد على الوسط:</li>
</ul>
<div class="tblwrap"><table><tr><th>Medium</th><th>Half-reaction</th><th>e⁻</th></tr>
<tr><td>Neutral</td><td>IO₃⁻ + 3H₂O + 6e → I⁻ + 6OH⁻</td><td>6</td></tr>
<tr><td>Slightly acidic</td><td>IO₃⁻ + 6H⁺ + 5e → ½I₂ + 3H₂O</td><td>5</td></tr>
<tr><td>Strongly acidic</td><td>IO₃⁻ + 6H⁺ + 4e → I⁺ + 3H₂O</td><td>4</td></tr></table></div>
<p>يعني في الوسط المتعادل بيتحول لـ I⁻ (6 إلكترونات)، وفي الحمضي الخفيف لـ ½I₂ (5)، وفي الحمضي القوي لـ I⁺ (4).</p>
<h5>طريقة Andrew</h5>
<ul>
<li>الـ IO₃⁻ هو المعاير في <b>HCl قوي (4–6 N)</b>. بيتختزل لأيون <b>iodonium (I⁺)</b> مش ثابت، وبيتثبّت على شكل <b>ICl</b> أو <b>[ICl₂]⁻</b>. الكاشف: <b>الكلوروفورم</b>.</li>
<li>أمثلة: مع As³⁺، وبنفس الشكل مع Sb³⁺ و Cu⁺ و I₂ و I⁻.</li>
<li>الـ ICl ثابت <b>بس فوق 4 N HCl</b>. والـ H₂SO₄ والـ HNO₃ ما يقدروش يثبّتوا I⁺. والـ HCl المركّز بيدي الكلوريد والحمض مع بعض.</li>
<li><b>اللي بيحصل أثناء المعايرة:</b> أول كميات من اليودات بتتختزل لـ I₂ بس، فبتلوّن طبقة الكلوروفورم <b>بنفسجي</b>. ولما العامل المختزل يخلص، اليودات الزيادة بتأكسد اليود ده لـ I⁺. نقطة النهاية لما <b>آخر أثر بنفسجي يختفي من الطبقة العضوية</b>، ويفضل لون ICl <b>الأصفر</b> في الطبقة المائية.</li>
<li><b>ليه مش النشا؟</b> الوسط حمضي قوي، والنشا بيتحلل في الحمض القوي.</li>
</ul>
<h5>تعديل Lang</h5>
<ul>
<li>معاير اليودات في <b>H₂SO₄ من 1–2 N</b> في وجود <b>HCN</b>، والكاشف <b>النشا</b> (لأن الحمض خفيف كفاية).</li>
<li>الـ I⁺ بيتثبّت بالـ CN⁻ على شكل <b>ICN</b>.</li>
<li><b>العيب:</b> الـ HCN سم خطير جدًا.</li>
</ul>
<div class="tblwrap"><table><tr><th></th><th>Andrew</th><th>Lang</th></tr>
<tr><td>Titrant</td><td>KIO₃</td><td>KIO₃</td></tr>
<tr><td>Medium</td><td>4–6 N HCl</td><td>1–2 N H₂SO₄ + HCN</td></tr>
<tr><td>Indicator</td><td>Chloroform</td><td>Starch</td></tr>
<tr><td>I⁺ as</td><td>ICl / [ICl₂]⁻</td><td>ICN</td></tr>
<tr><td>Drawback</td><td>Very strong acid</td><td>HCN very toxic</td></tr></table></div>

<h4>7. برومات البوتاسيوم (KBrO₃): المعايرات البرومومترية</h4>
<ul>
<li><b>Primary standard</b> ومؤكسد قوي في الحمض: <bdi>BrO₃⁻ + 6H⁺ + 6e → Br⁻ + 3H₂O</bdi>.</li>
<li>استخدامه الأساسي <b>مصدر ثابت للبروم</b>. محاليل البروم القياسية ما ينفعش نستخدمها مباشرة لأن البروم متطاير ومش ثابت. بدل كده بنستخدم <b>خليط BrO₃⁻/Br⁻</b>: في المحلول المتعادل ما فيهوش بروم، بس لما نحمّضه بيتحول <b>بالكامل</b> لكمية البروم المكافئة:</li>
</ul>
<div class="formula">BrO₃⁻ + 5Br⁻ + 6H⁺ → 3Br₂ + 3H₂O</div>
<h5>تقدير الفينول (معايرة رجعية بتخلص بالـ iodometry)</h5>
<ol>
<li>نضيف <b>زيادة معروفة</b> من KBrO₃/KBr القياسي ونحمّض، فيتكون بروم بكمية معروفة.</li>
<li>في الضلمة، البروم بيستبدل على حلقة الفينول: فينول + 3Br₂ ← <b>2,4,6-tribromophenol</b>↓ (راسب أصفر) + 3HBr. وبنضيف كلوروفورم يدوّب الراسب عشان ما يحبسش بروم جواه.</li>
<li>نضيف <b>KI</b>: البروم اللي ما اتفاعلش بيحرر كمية مكافئة من اليود.</li>
<li>نعاير اليود بالـ <b>Na₂S₂O₃</b> القياسي.</li>
<li>الفينول ≡ البروم المضاف − البروم الباقي (قيمة نقطة النهاية).</li>
</ol>

<h4>8. أسئلة التدريب (محلولة)</h4>
<div class="ex"><b>نحلل إزاي؟ (الأرسينات 0.57، اليود 0.54، الفيريسيانيد 0.36، الحديد 0.77)</b><br>
<b>الأرسينات</b>، مؤكسد: <b>iodometry</b>. في <b>الحمض</b> جهده بيطلع فوق اليود فيحرر يود من KI الزيادة؛ ونعاير اليود بالثيوسلفات.<br>
<b>الفيروسيانيد</b>، مختزل جهده 0.36 (تحت اليود): <b>iodimetry</b>. اليود يقدر يأكسده مباشرة لأن جهد اليود أعلى؛ نعاير باليود القياسي والنشا.<br>
<b>الـ Fe³⁺</b>، مؤكسد جهده 0.77 (فوق اليود): <b>iodometry</b>. الحديديك بيأكسد I⁻ ليود؛ ونعاير اليود اللي اتحرر بالثيوسلفات.</div>
<div class="ex"><b>قارني Andrew و Lang:</b> شوفي الجدول فوق. الاتنين بيستخدموا KIO₃ وبيطلّعوا I⁺؛ Andrew في HCl قوي بكاشف كلوروفورم و ICl؛ و Lang في H₂SO₄ مخفف + HCN بالنشا و ICN.</div>
`};
DEEP.analytical[7]={en:`
<p>Lecture 7 is the <b>midterm revision</b> of Lectures 1–6. Below, every revision topic is pulled together with the reasoning you'll need to answer exam questions, plus the new worked titration curve (iodide with cerium) and the "experimental layout" table for iron(II).</p>

<h4>1. Definitions at a glance</h4>
<div class="tblwrap"><table><tr><th>Oxidising agent</th><th>Reducing agent</th></tr>
<tr><td>Undergoes <b>reduction</b></td><td>Undergoes <b>oxidation</b></td></tr>
<tr><td><b>Gains</b> electrons (acceptor)</td><td><b>Loses</b> electrons (donor)</td></tr>
<tr><td>Has a <b>high</b> oxidation number, moves to lower valency</td><td>Has a <b>low</b> oxidation number, moves to higher valency</td></tr>
<tr><td>KMnO₄, I₂, ceric sulfate…</td><td>Thiosulfate, oxalate…</td></tr></table></div>

<h4>2. Balancing rules (the checklist)</h4>
<ol>
<li>Balance <b>ionically</b> first, then <b>electronically</b>, then <b>add</b> the half-equations.</li>
<li>Each extra <b>O</b> → add <b>H₂O</b> on the other side; the H in that water → add <b>H⁺</b> on the first side.</li>
<li>Count charges carefully: <b>2M²⁺ = net +4</b>.</li>
<li>The final net equation contains <b>no electrons</b>.</li>
<li>Electrons on opposite sides cancel (<b>subtract</b>); H⁺ or H₂O on <b>opposite</b> sides → subtract; on the <b>same</b> side → add.</li>
</ol>
<div class="ex"><b>Model answer:</b> Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O; Fe²⁺ → Fe³⁺ + e (×6). Net: <b>Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 7H₂O + 6Fe³⁺</b>.</div>

<h4>3. Electrode potential: solution vs ionic pressure</h4>
<div class="tblwrap"><table><tr><th>Solution pressure &gt; ionic pressure</th><th>Ionic pressure &gt; solution pressure</th></tr>
<tr><td>Metal dissolves (oxidised): Zn⁰ → Zn²⁺ + 2e</td><td>Ions deposit (reduced): Cu²⁺ + 2e → Cu⁰</td></tr>
<tr><td>Electrode <b>negative</b>; weight <b>decreases</b></td><td>Electrode <b>positive</b>; weight <b>increases</b></td></tr>
<tr><td>Like Zn, Mg (E⁰ −2.36)</td><td>Like Cu, Ag (E⁰ +0.80)</td></tr></table></div>
<p>The electrode has the <b>same sign as its E⁰</b>, and current passes from the more negative to the more positive (Mg → Ag).</p>

<h4>4. The two potentials and the two series</h4>
<p>Electrode potential: metal in its ions, E = E⁰ + 0.059/n log [Mⁿ⁺], equals E⁰ at 1 M, arranged in the <b>electrochemical series</b> (negative = reducing metals; a more negative metal displaces those below it). Oxidation potential: Pt in Ox/Red, E = E⁰ + 0.059/n log [Ox]/[Red], equals E⁰ when [Ox] = [Red], arranged in the <b>SOP series</b> (top = strong oxidants; about 0.4 V difference needed). MnO₄⁻ can oxidise Cl⁻, Br⁻, I⁻ and Fe²⁺; Fe³⁺ can oxidise <b>I⁻ only</b>.</p>

<h4>5. Changing potentials (the two FeCl₂ problems)</h4>
<ul>
<li>Raise [Ox] or remove Red → E up. Lower [Ox] or add Red → E down. Remove a form by precipitating or complexing; add one as a common ion.</li>
<li><b>FeCl₂ by KMnO₄</b> (oxidant too strong, attacks Cl⁻): <b>Zimmermann–Reinhardt reagent</b>. MnSO₄ adds Mn²⁺, lowering MnO₄⁻/Mn²⁺ below Cl₂/Cl⁻ (1.36) but above Fe (0.77); H₃PO₄ decolourises Fe³⁺ and lowers the iron potential; H₂SO₄ gives the acidity for complete reaction.</li>
<li><b>FeCl₂ by I₂</b> (oxidant too weak): <b>HgCl₂ + H₃PO₄</b>. HgCl₂ complexes I⁻ as [HgI₄]²⁻, raising I₂/I⁻ above iron (still below chlorine); H₃PO₄ lowers the iron potential.</li>
</ul>

<h4>6. Indicators</h4>
<p>Six types: self (KMnO₄, I₂), external (ferricyanide spot test), internal (ferroin, diphenylamine), irreversible (methyl orange, methyl red), specific (starch, SCN⁻) and potentiometric. An internal indicator's E⁰ must lie <b>between the sample and the titrant</b>.</p>
<div class="tblwrap"><table><tr><th>Indicator</th><th>E⁰ (memorise)</th><th>Colour change</th></tr>
<tr><td>Diphenylamine</td><td>+0.76</td><td>Colourless → violet</td></tr>
<tr><td>Ferroin</td><td>+1.06</td><td>Red → blue</td></tr>
<tr><td>Phenylanthranilic acid</td><td>+1.08</td><td>Colourless → pinkish violet</td></tr></table></div>
<p>Diphenylamine is unsuitable for Fe²⁺/dichromate because it is too close to Fe³⁺/Fe²⁺ (0.77); add PO₄³⁻ (or F⁻) to lower the iron potential. Phenylanthranilic acid works directly because it lies between 0.77 and 1.36.</p>

<h4>7. The three oxidising titrants</h4>
<div class="tblwrap"><table><tr><th></th><th>MnO₄⁻</th><th>Ce⁴⁺</th><th>Cr₂O₇²⁻</th></tr>
<tr><td>Self indicator</td><td>✓ first pink</td><td>✓ first yellowish orange</td><td>✗ (orange → green)</td></tr>
<tr><td>Half-reaction</td><td>MnO₄⁻ + 8H⁺ + 5e → Mn²⁺ + 4H₂O</td><td>Ce⁴⁺ + e → Ce³⁺</td><td>Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O</td></tr>
<tr><td>Primary standard</td><td>✗ (standardise vs sodium oxalate or As₂O₃)</td><td>✗</td><td>✓</td></tr>
<tr><td>Strength rank</td><td>1</td><td>2</td><td>3; can't oxidise Cl⁻, C₂O₄²⁻, ferrocyanide</td></tr>
<tr><td>Medium</td><td>Acidic</td><td>None special</td><td>Acidic</td></tr>
<tr><td>Indicator</td><td>Self</td><td>Ferroin (red → blue)</td><td>Ferroin (red → blue)</td></tr></table></div>

<h4>8. Reducing samples and what titrates them</h4>
<div class="tblwrap"><table><tr><th>Sample</th><th>Oxidised to</th><th>Titrated by</th></tr>
<tr><td>Oxalate</td><td>CO₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>Fe²⁺</td><td>Fe³⁺</td><td>MnO₄⁻, Ce⁴⁺, Cr₂O₇²⁻</td></tr>
<tr><td>Ferrocyanide</td><td>Ferricyanide</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>H₂O₂</td><td>O₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>As³⁺, Sb³⁺, SO₃²⁻, NO₂⁻</td><td>As⁵⁺, Sb⁵⁺, SO₄²⁻, NO₃⁻</td><td>MnO₄⁻</td></tr></table></div>

<h4>9. Experimental layout: analysis of Fe²⁺ (a likely exam question)</h4>
<div class="tblwrap"><table><tr><th>Titrant</th><th>Indicator</th><th>Colour change at e.p.</th><th>Conditions</th></tr>
<tr><td>KMnO₄</td><td>Self</td><td>First pink</td><td>Acidic</td></tr>
<tr><td>K₂Cr₂O₇</td><td>Ferroin</td><td>Red → blue</td><td>Acidic</td></tr>
<tr><td>K₂Cr₂O₇</td><td>Diphenylamine</td><td>Colourless → violet</td><td>Acidic + F⁻ or PO₄³⁻ to lower Fe³⁺/Fe²⁺</td></tr>
<tr><td>K₂Cr₂O₇</td><td>K-ferricyanide (external)</td><td>No blue colour observed</td><td>Acidic</td></tr>
<tr><td>Ce(SO₄)₂</td><td>Ferroin</td><td>Red → blue</td><td>None</td></tr>
<tr><td>Ce(SO₄)₂</td><td>Methyl red (irreversible)</td><td>Red → colourless</td><td>None</td></tr></table></div>
<p>Equations: MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O; Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O; Ce⁴⁺ + Fe²⁺ → Ce³⁺ + Fe³⁺.</p>

<h4>10. Mixtures and oxidising samples</h4>
<p>To titrate an <b>oxidising</b> sample with an oxidising titrant, <b>reduce it first</b>: Fe³⁺ → Fe²⁺ with SnCl₂ or amalgamated zinc; ferricyanide → ferrocyanide with SnCl₂. For mixtures (Fe³⁺/Fe²⁺, ferricyanide/ferrocyanide), titrate one portion directly (gives the reduced form), reduce and titrate another (gives the total), and subtract.</p>

<h4>11. New worked curve: 100 mL 0.1 N KI titrated with 0.1 N Ce⁴⁺</h4>
<p>Reaction: 2I⁻ + 2Ce⁴⁺ → I₂ + 2Ce³⁺. E⁰(I₂/I⁻) = 0.54 V with <b>n = 2</b>; E⁰(Ce⁴⁺/Ce³⁺) = 1.44 V with n = 1.</p>
<ul>
<li><b>10 mL</b>: I₂/I⁻ ratio 10/90. E = 0.54 + (0.059/2) log (10/90) = <b>0.51 V</b>.</li>
<li><b>50 mL</b>: ratio 1, E = <b>0.54 V</b>.</li>
<li><b>99.9 mL</b>: E = 0.54 + (0.059/2) log (99.9/0.1) = <b>0.63 V</b>. (The slide prints 0.55; the calculation gives 0.63.)</li>
<li><b>Equivalence point</b>: E = (2 × 0.54 + 1 × 1.44) / (2 + 1) = 2.52 / 3 = <b>0.84 V</b>. Because iodine has n = 2, the e.p. sits closer to the iodine E⁰.</li>
<li><b>100.1 mL</b>: excess Ce⁴⁺, so use cerium: E = 1.44 + 0.059 log (0.1/100) = <b>1.26 V</b> (slide: 1.27).</li>
</ul>
<p>As always, there's a sudden jump in potential at the equivalence point.</p>
<div class="pearl"><strong>Last-minute list:</strong> 0.4 V rule; indicator between sample and titrant; KMnO₄ eq. wt 31.6 (acid) / 52.67 (alkaline); Zimmermann's reagent = MnSO₄ + H₃PO₄ + H₂SO₄; HgCl₂ raises I₂/I⁻; Zn²⁺ raises ferricyanide; NaHCO₃ (not NaOH) for arsenite; starch late in iodometry; dichromate is the only primary standard of the three.</div>
`,ar:`
<p>محاضرة 7 هي <b>مراجعة الميدترم</b> لمحاضرات 1–6. تحت هتلاقي كل موضوع في المراجعة متجمع مع طريقة التفكير اللي محتاجاها عشان تحلي أسئلة الامتحان، ومعاهم منحنى المعايرة الجديد المحلول (اليوديد مع السيريوم)، وجدول "التصميم التجريبي" لتحليل الحديد الثنائي.</p>

<h4>1. التعريفات بسرعة</h4>
<div class="tblwrap"><table><tr><th>Oxidising agent</th><th>Reducing agent</th></tr>
<tr><td>Undergoes reduction</td><td>Undergoes oxidation</td></tr>
<tr><td>Gains electrons (acceptor)</td><td>Loses electrons (donor)</td></tr>
<tr><td>High oxidation number → lower valency</td><td>Low oxidation number → higher valency</td></tr>
<tr><td>KMnO₄, I₂, ceric sulfate</td><td>Thiosulfate, oxalate</td></tr></table></div>
<p>يعني العامل المؤكسد بيتختزل وبياخد إلكترونات ورقم أكسدته عالي فبيقل، والعامل المختزل بيتأكسد وبيدي إلكترونات ورقم أكسدته واطي فبيزيد.</p>

<h4>2. قواعد الموازنة (الـ checklist)</h4>
<ol>
<li>وازني <b>أيونيًا</b> الأول، وبعدين <b>إلكترونيًا</b>، وبعدين <b>اجمعي</b> أنصاف المعادلات.</li>
<li>كل <b>O</b> زيادة ← ضيفي <b>H₂O</b> في الناحية التانية؛ والهيدروجين اللي في الماء ده ← ضيفي <b>H⁺</b> في الناحية الأولى.</li>
<li>عدّي الشحنات كويس: <b>2M²⁺ = +4</b>.</li>
<li>المعادلة النهائية <b>مفيهاش إلكترونات</b>.</li>
<li>الإلكترونات في ناحيتين مختلفتين بتتشطب (<b>طرح</b>)؛ والـ H⁺ أو H₂O في ناحيتين <b>مختلفتين</b> ← طرح، وفي <b>نفس</b> الناحية ← جمع.</li>
</ol>
<div class="ex"><b>إجابة نموذجية:</b> <bdi>Cr₂O₇²⁻ + 14H⁺ + 6e → 2Cr³⁺ + 7H₂O</bdi>؛ و <bdi>Fe²⁺ → Fe³⁺ + e</bdi> (×6). الناتج: <bdi>Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 7H₂O + 6Fe³⁺</bdi>.</div>

<h4>3. جهد القطب: solution pressure مقابل ionic pressure</h4>
<p>لو الـ <b>solution pressure أكبر</b>: الفلز بيدوب (يتأكسد)، القطب <b>سالب</b> ووزنه <b>يقل</b>، زي الزنك والماغنسيوم (−2.36). ولو الـ <b>ionic pressure أكبر</b>: الأيونات بتترسب (تتختزل)، القطب <b>موجب</b> ووزنه <b>يزيد</b>، زي النحاس والفضة (+0.80). القطب بياخد <b>نفس إشارة E⁰</b>، والتيار بيمشي من السالب أكتر للموجب أكتر (من Mg لـ Ag).</p>

<h4>4. الجهدين والسلسلتين</h4>
<p><b>جهد القطب</b>: فلز في أيوناته، <bdi>E = E⁰ + 0.059/n log [Mⁿ⁺]</bdi>، ويساوي E⁰ عند 1 مولار، ومترتب في <b>السلسلة الكهروكيميائية</b> (السالب = فلزات مختزلة، والسالب أكتر بيطرد اللي تحته). <b>جهد الأكسدة</b>: بلاتين في Ox/Red، <bdi>E = E⁰ + 0.059/n log [Ox]/[Red]</bdi>، ويساوي E⁰ لما الصورتين يتساووا، ومترتب في <b>سلسلة الـ SOP</b> (فوق = مؤكسدات قوية، ومحتاجين فرق 0.4 فولت). البرمنجنات تقدر تأكسد Cl⁻ و Br⁻ و I⁻ و Fe²⁺، والحديديك بيأكسد <b>I⁻ بس</b>.</p>

<h4>5. تغيير الجهود (مشكلتين FeCl₂)</h4>
<ul>
<li>نزوّد Ox أو نشيل Red ← E يطلع. نقلل Ox أو نضيف Red ← E ينزل. نشيل صورة بالترسيب أو المعقدات، ونضيف صورة كأيون مشترك.</li>
<li><b>FeCl₂ بالبرمنجنات</b> (المؤكسد قوي زيادة وبيهاجم الكلوريد): <b>كاشف Zimmermann–Reinhardt</b>. الـ MnSO₄ بيضيف Mn²⁺ فينزّل جهد البرمنجنات تحت الكلور (1.36) وفوق الحديد (0.77)؛ والـ H₃PO₄ بيشيل لون Fe³⁺ وينزّل جهد الحديد؛ والـ H₂SO₄ بيدي الحموضة للتفاعل الكامل.</li>
<li><b>FeCl₂ باليود</b> (المؤكسد ضعيف): <b>HgCl₂ + H₃PO₄</b>. الـ HgCl₂ بيمسك I⁻ في [HgI₄]²⁻ فيرفع جهد اليود فوق الحديد (ولسه تحت الكلور)؛ والـ H₃PO₄ بينزّل جهد الحديد.</li>
</ul>

<h4>6. الكواشف</h4>
<p>6 أنواع: ذاتي (KMnO₄ و I₂)، خارجي (spot test بالفيريسيانيد)، داخلي (ferroin و diphenylamine)، غير عكسي (methyl orange و methyl red)، نوعي (النشا و SCN⁻)، و potentiometric. والكاشف الداخلي لازم E⁰ بتاعه يكون <b>بين العينة والمعاير</b>.</p>
<div class="tblwrap"><table><tr><th>Indicator</th><th>E⁰ (memorise)</th><th>Colour change</th></tr>
<tr><td>Diphenylamine</td><td>+0.76</td><td>Colourless → violet</td></tr>
<tr><td>Ferroin</td><td>+1.06</td><td>Red → blue</td></tr>
<tr><td>Phenylanthranilic acid</td><td>+1.08</td><td>Colourless → pinkish violet</td></tr></table></div>
<p>الـ diphenylamine مش مناسب لمعايرة Fe²⁺ بالداي كرومات لأنه قريب جدًا من جهد الحديد (0.77)؛ نضيف PO₄³⁻ (أو F⁻) ينزّل جهد الحديد. والـ phenylanthranilic acid شغال مباشرة لأنه بين 0.77 و 1.36.</p>

<h4>7. المعايرات المؤكسدة التلاتة</h4>
<div class="tblwrap"><table><tr><th></th><th>MnO₄⁻</th><th>Ce⁴⁺</th><th>Cr₂O₇²⁻</th></tr>
<tr><td>Self indicator</td><td>✓ first pink</td><td>✓ yellowish orange</td><td>✗</td></tr>
<tr><td>Primary standard</td><td>✗ (vs sodium oxalate / As₂O₃)</td><td>✗</td><td>✓</td></tr>
<tr><td>Strength</td><td>1</td><td>2</td><td>3; can't oxidise Cl⁻, oxalate, ferrocyanide</td></tr>
<tr><td>Medium</td><td>Acidic</td><td>None</td><td>Acidic</td></tr>
<tr><td>Indicator</td><td>Self</td><td>Ferroin</td><td>Ferroin</td></tr></table></div>

<h4>8. العينات المختزلة وبيتعايروا بإيه</h4>
<div class="tblwrap"><table><tr><th>Sample</th><th>Oxidised to</th><th>Titrated by</th></tr>
<tr><td>Oxalate</td><td>CO₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>Fe²⁺</td><td>Fe³⁺</td><td>MnO₄⁻, Ce⁴⁺, Cr₂O₇²⁻</td></tr>
<tr><td>Ferrocyanide</td><td>Ferricyanide</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>H₂O₂</td><td>O₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr>
<tr><td>As³⁺, Sb³⁺, SO₃²⁻, NO₂⁻</td><td>As⁵⁺, Sb⁵⁺, SO₄²⁻, NO₃⁻</td><td>MnO₄⁻</td></tr></table></div>

<h4>9. التصميم التجريبي لتحليل Fe²⁺ (سؤال متوقع)</h4>
<div class="tblwrap"><table><tr><th>Titrant</th><th>Indicator</th><th>Colour at e.p.</th><th>Conditions</th></tr>
<tr><td>KMnO₄</td><td>Self</td><td>First pink</td><td>Acidic</td></tr>
<tr><td>K₂Cr₂O₇</td><td>Ferroin</td><td>Red → blue</td><td>Acidic</td></tr>
<tr><td>K₂Cr₂O₇</td><td>Diphenylamine</td><td>Colourless → violet</td><td>Acidic + F⁻ or PO₄³⁻</td></tr>
<tr><td>K₂Cr₂O₇</td><td>K-ferricyanide (external)</td><td>No blue colour</td><td>Acidic</td></tr>
<tr><td>Ce(SO₄)₂</td><td>Ferroin</td><td>Red → blue</td><td>None</td></tr>
<tr><td>Ce(SO₄)₂</td><td>Methyl red</td><td>Red → colourless</td><td>None</td></tr></table></div>

<h4>10. الخلائط والعينات المؤكسدة</h4>
<p>عشان نعاير عينة <b>مؤكسدة</b> بمعاير مؤكسد، <b>نختزلها الأول</b>: Fe³⁺ ← Fe²⁺ بـ SnCl₂ أو الزنك الملغّم؛ والفيريسيانيد ← فيروسيانيد بـ SnCl₂. وفي الخلائط (Fe³⁺/Fe²⁺ أو فيريسيانيد/فيروسيانيد): نعاير جزء مباشرة (يدينا الصورة المختزلة)، ونختزل جزء تاني ونعايره (يدينا الكلي)، ونطرح.</p>

<h4>11. منحنى جديد محلول: 100 مل KI تركيزه 0.1 N مع Ce⁴⁺ تركيزه 0.1 N</h4>
<p>التفاعل: <bdi>2I⁻ + 2Ce⁴⁺ → I₂ + 2Ce³⁺</bdi>. جهد اليود 0.54 و <b>n = 2</b>؛ والسيريوم 1.44 و n = 1.</p>
<ul>
<li><b>10 مل</b>: النسبة 10/90. <bdi>E = 0.54 + (0.059/2) log (10/90) = 0.51 V</bdi>.</li>
<li><b>50 مل</b>: النسبة 1، فـ <b>E = 0.54</b>.</li>
<li><b>99.9 مل</b>: <bdi>E = 0.54 + (0.059/2) log (99.9/0.1) = 0.63 V</bdi>. (السلايد مكتوب 0.55، والحساب بيدي 0.63.)</li>
<li><b>نقطة التكافؤ</b>: <bdi>E = (2 × 0.54 + 1 × 1.44) / 3 = 0.84 V</bdi>. وعشان اليود n = 2، النقطة قريبة من جهد اليود.</li>
<li><b>100.1 مل</b>: فيه Ce⁴⁺ زيادة فنستخدم السيريوم: <bdi>E = 1.44 + 0.059 log (0.1/100) = 1.26 V</bdi> (السلايد: 1.27).</li>
</ul>
<p>وزي العادة فيه قفزة مفاجئة في الجهد عند نقطة التكافؤ.</p>
<div class="pearl"><strong>قايمة آخر دقيقة:</strong> قاعدة الـ 0.4 فولت؛ الكاشف بين العينة والمعاير؛ الوزن المكافئ للبرمنجنات 31.6 (حمضي) و52.67 (قلوي)؛ كاشف Zimmermann = MnSO₄ + H₃PO₄ + H₂SO₄؛ الـ HgCl₂ بيرفع جهد اليود؛ الـ Zn²⁺ بيرفع جهد الفيريسيانيد؛ NaHCO₃ (مش NaOH) للأرسينيت؛ النشا متأخر في الـ iodometry؛ والداي كرومات هو الـ primary standard الوحيد من التلاتة.</div>

DEEP.dosage[1]={en:`
<p>This course is about <b>liquid dosage forms</b>: how to design, make, package and store solutions, suspensions, emulsions and colloids, and the calculations and incompatibilities involved in dispensing them. Lecture 1 introduces <b>pharmaceutical solutions</b> and the central problem behind many of them: most drugs don't dissolve well in water. The second half is a toolkit of <b>solubilization</b> methods.</p>

<h4>1. What is a dosage form?</h4>
<p>A <b>dosage form</b> is the <b>physical form in which the drug molecule is delivered to its site of action</b> in the body: a tablet, a syrup, an injection, an ointment. The drug is the active molecule; the dosage form is the vehicle that gets it there in a usable, stable and acceptable way.</p>

<h4>2. Pharmaceutical solutions: why use them?</h4>
<h5>Advantages</h5>
<ul>
<li><b>Easier to swallow</b> than solids, so more acceptable for <b>children and the elderly</b>.</li>
<li><b>Fast absorption and response</b>: the drug is already dissolved, so the dissolution step that tablets need is skipped.</li>
<li><b>Less GIT irritation</b>: an irritant drug given as a solution is quickly diluted by stomach contents, so no concentrated spot sits on the mucosa. Classic examples: <b>aspirin</b> and <b>potassium chloride</b>.</li>
<li><b>Homogeneous</b>: the drug is evenly distributed, so every dose is uniform and there's no phase separation on storage (unlike suspensions, which must be shaken).</li>
<li><b>Many routes</b>: oral, body cavities (nose, ear, rectum), or external application.</li>
</ul>
<h5>Disadvantages</h5>
<ul>
<li><b>Bulky</b>: inconvenient to carry and store.</li>
<li><b>Less stable</b> than solid forms, mainly because of <b>hydrolysis</b> in water.</li>
<li>A good medium for <b>microbial growth</b>, so a <b>preservative</b> is usually needed.</li>
<li>The drug's (usually unpleasant) <b>taste is more obvious</b> in solution, so sweeteners and flavours are needed.</li>
<li><b>Dose accuracy depends on the patient</b> measuring with a 5 mL spoon or a dropper.</li>
</ul>

<h4>3. Solution vocabulary</h4>
<p>A <b>solution</b> is a <b>homogeneous mixture</b> made by dissolving a solid, liquid or gas in a liquid.</p>
<ul>
<li>The <b>solute</b> is the substance dispersed as molecules or ions (e.g. NaCl). It is usually present in the smaller amount.</li>
<li>The <b>solvent</b> is the phase in which dispersion happens (e.g. water). It is usually present in the larger amount.</li>
</ul>
<div class="pearl"><strong>The classic exception:</strong> <b>Syrup BP</b> contains <b>66.7% w/w sucrose</b> (the solute) in only <b>33.3% w/w water</b> (the solvent). Here the solute is the larger part.</div>

<h4>4. Solubilization: the problem</h4>
<p><b>Solubilization</b> means <b>increasing the solubility of a poorly water-soluble substance</b>. We need it to get enough drug into the systemic circulation to produce the desired effect.</p>
<p>Why it matters: about <b>40% of lipophilic drug candidates fail to reach the market</b> because of low <b>bioavailability</b>, even though they have good pharmacological activity. (Bioavailability is the fraction of an administered dose that reaches the systemic circulation unchanged.) A drug that dissolves poorly is absorbed poorly, so it would need a very high dose.</p>
<p>The lecture lists eight approaches: <b>pH adjustment, chemical modification, co-solvency, micellar solubilization, hydrotropy, complexation, particle size reduction and solid dispersion</b>.</p>

<h4>5. The Biopharmaceutics Classification System (BCS)</h4>
<p>To absorb a drug orally it must first <b>dissolve</b> (solubility) and then <b>cross the gut membrane</b> (permeability). BCS sorts drugs by these two properties:</p>
<div class="tblwrap"><table><tr><th></th><th>High solubility</th><th>Low solubility</th></tr>
<tr><td><b>High permeability</b></td><td><b>Class I</b>: rapid dissolution, well absorbed</td><td><b>Class II</b>: dissolution is the limiting step</td></tr>
<tr><td><b>Low permeability</b></td><td><b>Class III</b>: permeation is the limiting step</td><td><b>Class IV</b>: both are problems</td></tr></table></div>
<p>Solubilization helps most for <b>Class II</b>, where dissolution is the only barrier.</p>

<h4>6. The solubilization methods in detail</h4>
<h5>Method 1: pH change (salt formation)</h5>
<p>Most drugs are weak acids or weak bases with poor water solubility. Their <b>ionised form is much more water-soluble</b> than the unionised form. So for any <b>ionizable</b> drug, adjusting the pH (or making a salt) is the <b>simplest and most effective</b> way to raise solubility: a weak base dissolves better at low pH; a weak acid dissolves better at high pH.</p>
<p><b>The drawback:</b> salt forms are more <b>polar and ionised</b>, and ionised molecules cross lipophilic membranes poorly by passive diffusion. If <b>permeability</b>, not solubility, is the limiting step, making the drug more polar can <b>reduce</b> absorption. Example: highly soluble but poorly permeable <b>quaternary ammonium salts</b> are poorly absorbed orally.</p>
<ul>
<li><b>BCS Class II</b> (poor solubility, good permeability): salt formation <b>usually improves</b> absorption.</li>
<li><b>BCS Class III</b> (good solubility, poor permeability): salt formation helps little and may <b>hinder</b> absorption.</li>
</ul>
<div class="pearl"><strong>Takeaway:</strong> absorption depends on a balance between solubility and permeability. Fix whichever one is limiting.</div>
<h5>Method 2: chemical modification</h5>
<p>Make a <b>water-soluble derivative</b> of the drug.</p>
<ul>
<li>Sodium phosphate esters of corticosteroids: <b>hydrocortisone sodium phosphate</b>, prednisolone and betamethasone sodium phosphate, which can be given as injections.</li>
<li><b>Chloramphenicol sodium succinate</b> is water-soluble but has <b>no antibacterial activity itself</b>. It is suitable for parenteral solution and is <b>converted to the active base</b> in the body. (This is the idea of a prodrug.)</li>
</ul>
<h5>Method 3: co-solvency</h5>
<p>Mix water with a <b>water-miscible solvent in which the drug dissolves readily</b>. The extra solvent is a <b>co-solvent</b>: <b>glycerol, ethanol, propylene glycol</b>. It makes the solvent mixture less polar, closer to the drug's polarity.</p>
<p>Example: <b>paracetamol elixir</b>, made with alcohol and propylene glycol.</p>
<h5>Method 4: micellar solubilization</h5>
<p><b>Surfactants</b> (surface-active agents) have a hydrophilic head and a hydrophobic tail. They reduce surface tension and help lipophilic drugs dissolve in water. Above a certain concentration, the <b>critical micelle concentration (CMC)</b>, about <b>0.05–0.1%</b> for most surfactants, surfactant molecules cluster into <b>micelles</b>: tails inside, heads outside. The lipophilic drug hides in the hydrophobic core. This is <b>micellization</b>.</p>
<ul>
<li>Fat-soluble <b>vitamins A, D, E, K</b> solubilised with <b>polysorbates (Tweens)</b>.</li>
<li>Phenolic disinfectants <b>cresol</b> and <b>chloroxylenol</b> solubilised with <b>soaps</b>: <b>Lysol</b> and <b>Dettol</b>.</li>
</ul>
<p><b>Polymeric micelles</b>: surfactants aren't the only micelle-formers. <b>Amphiphilic polymers</b> (macromolecules with hydrophilic and hydrophobic parts) self-assemble in water into micelles or vesicles above their own CMC. The hydrophobic core traps the drug; the hydrophilic shell keeps it stable in water. Example: <b>PEG–PLA</b> (polyethylene glycol–polylactic acid).</p>
<h5>Method 5: hydrotropy</h5>
<p>Adding a <b>large amount of a second solute</b> (the <b>hydrotrope</b>) increases the water solubility of the drug. Examples: concentrated solutions of <b>sodium benzoate</b>, <b>sodium salicylate</b> and <b>urea</b>.</p>
<p>Hydrotropes look like surfactants (hydrophilic + hydrophobic part), but their <b>hydrophobic part is too small to self-aggregate</b>. So they form <b>no micelles</b> and have <b>no critical concentration</b> (no CMC). That is the key difference from micellar solubilization.</p>
<h5>Method 6: complexation with cyclodextrins</h5>
<p><b>Cyclodextrins (CDs)</b> are cyclic oligosaccharides of α-1,4-linked glucose units, made from <b>starch</b> by enzymes. <b>α-CD has 6</b> glucose units, <b>β-CD has 7</b>, <b>γ-CD has 8</b>. Shaped like a hollow truncated cone, they have a <b>hydrophilic outside</b> and a <b>hydrophobic cavity</b>. A hydrophobic drug sits inside the cavity, forming a water-soluble <b>inclusion complex</b>.</p>
<h5>Method 7: particle size reduction</h5>
<p>Smaller particles have a larger surface area and dissolve faster. This is covered in detail in Lecture 2.</p>
<h5>Method 8: solid dispersion</h5>
<p>The poorly soluble drug is dispersed <b>at the molecular level</b> in an inert <b>hydrophilic polymer matrix</b>, such as <b>PVP</b> (polyvinylpyrrolidone), <b>HPMC</b> or <b>PEG 6000</b>. When the polymer dissolves, the drug is released as extremely fine particles that dissolve rapidly. Prepared by <b>melting</b> or <b>kneading</b>, among other methods.</p>

<h4>7. Lecture case study</h4>
<div class="ex"><b>Case:</b> a junior pharmacist tried to dissolve a sparingly soluble <b>weakly basic</b> drug using Tween 80, but it stayed insoluble.<br>
<b>(a) Likely cause:</b> the Tween 80 concentration was probably <b>below its CMC</b>, so no micelles formed to take up the drug (or too little surfactant was used for the amount of drug).<br>
<b>(b) Better approach:</b> because the drug is a <b>weak base</b>, use <b>pH adjustment</b>: lower the pH (add acid) or prepare a salt. The ionised form is far more soluble, and this is the simplest, most effective method for ionizable drugs. Co-solvency is another option.</div>

<p>الكورس ده عن <b>الأشكال الصيدلانية السائلة</b>: إزاي نصمم ونصنّع ونعبّي ونخزّن المحاليل والمعلقات والمستحلبات والغرويات، والحسابات وعدم التوافق اللي بيحصل وقت الصرف. المحاضرة الأولى بتقدّم <b>المحاليل الصيدلانية</b> والمشكلة الأساسية ورا كتير منها: معظم الأدوية ما بتدوبش كويس في الماء. والنص التاني عبارة عن صندوق أدوات لطرق <b>زيادة الذوبانية (solubilization)</b>.</p>

<h4>1. يعني إيه dosage form؟</h4>
<p>الـ <b>dosage form</b> هو <b>الشكل الفيزيائي اللي الدوا بيوصل بيه لمكان تأثيره</b> في الجسم: قرص، شراب، حقنة، مرهم. الدوا هو الجزيء الفعّال، والـ dosage form هو الوسيلة اللي بتوصّله بشكل مناسب وثابت ومقبول.</p>

<h4>2. المحاليل الصيدلانية: ليه بنستخدمها؟</h4>
<h5>المميزات</h5>
<ul>
<li><b>أسهل في البلع</b> من الصلب، فمقبولة أكتر <b>للأطفال وكبار السن</b>.</li>
<li><b>امتصاص واستجابة سريعة</b>: الدوا داب خلاص، فبنوفّر خطوة الذوبان اللي القرص محتاجها.</li>
<li><b>تهييج أقل للجهاز الهضمي</b>: الدوا المهيّج لو اتاخد محلول بيتخفف بسرعة بمحتوى المعدة، فمفيش نقطة مركّزة قاعدة على الغشاء. أمثلة مشهورة: <b>الأسبرين</b> و<b>كلوريد البوتاسيوم</b>.</li>
<li><b>متجانسة</b>: الدوا موزع بالتساوي، فكل جرعة زي التانية ومفيش انفصال أثناء التخزين (عكس المعلقات اللي لازم تترج).</li>
<li><b>طرق كتير</b>: بالفم، في تجاويف الجسم (أنف، ودن، شرج)، أو استخدام خارجي.</li>
</ul>
<h5>العيوب</h5>
<ul>
<li><b>حجمها كبير</b>: صعب شيلها وتخزينها.</li>
<li><b>أقل ثباتًا</b> من الأشكال الصلبة، أساسًا بسبب <b>التحلل المائي (hydrolysis)</b>.</li>
<li>وسط مناسب لـ<b>نمو الميكروبات</b>، فغالبًا محتاجة <b>مادة حافظة</b>.</li>
<li><b>طعم الدوا</b> (اللي غالبًا وحش) <b>بيبان أكتر</b> في المحلول، فمحتاجين محليات ونكهات.</li>
<li><b>دقة الجرعة بتعتمد على المريض</b> وهو بيقيس بمعلقة 5 مل أو قطّارة.</li>
</ul>

<h4>3. مصطلحات المحلول</h4>
<p>الـ <b>solution</b> هو <b>خليط متجانس</b> بيتعمل بإذابة صلب أو سائل أو غاز في سائل.</p>
<ul>
<li>الـ <b>solute (المذاب)</b>: المادة اللي بتنتشر على شكل جزيئات أو أيونات (زي NaCl)، وغالبًا كميتها أقل.</li>
<li>الـ <b>solvent (المذيب)</b>: الوسط اللي بيحصل فيه الانتشار (زي الماء)، وغالبًا كميته أكبر.</li>
</ul>
<div class="pearl"><strong>الاستثناء المشهور:</strong> <b>Syrup BP</b> فيه <b>66.7% سكروز</b> (المذاب) في <b>33.3% ماء</b> بس (المذيب). يعني هنا المذاب هو الأكتر.</div>

<h4>4. زيادة الذوبانية: المشكلة</h4>
<p>الـ <b>Solubilization</b> معناها <b>زيادة ذوبانية مادة ضعيفة الذوبان في الماء</b>. محتاجينها عشان نوصّل كمية كفاية من الدوا للدورة الدموية فيدي التأثير المطلوب.</p>
<p>ليه مهمة؟ حوالي <b>40% من الأدوية المحبة للدهون بتفشل توصل السوق</b> بسبب ضعف الـ <b>bioavailability</b>، مع إن تأثيرها الدوائي كويس. (الـ bioavailability هي نسبة الجرعة اللي بتوصل للدورة الدموية من غير ما تتغير.) الدوا اللي ما بيدوبش كويس ما بيتمتصش كويس، فهيحتاج جرعة عالية جدًا.</p>
<p>المحاضرة بتذكر 8 طرق: <b>تغيير الـ pH، التعديل الكيميائي، co-solvency، micellar solubilization، hydrotropy، complexation، تصغير حجم الجزيئات، و solid dispersion</b>.</p>

<h4>5. نظام تصنيف BCS</h4>
<p>عشان الدوا يتمتص بالفم لازم الأول <b>يدوب</b> (solubility) وبعدين <b>يعدّي غشاء الأمعاء</b> (permeability). نظام BCS بيقسم الأدوية حسب الخاصيتين دول:</p>
<div class="tblwrap"><table><tr><th></th><th>High solubility</th><th>Low solubility</th></tr>
<tr><td>High permeability</td><td>Class I: rapid dissolution, well absorbed</td><td>Class II: dissolution is limiting</td></tr>
<tr><td>Low permeability</td><td>Class III: permeation is limiting</td><td>Class IV: both are problems</td></tr></table></div>
<p>طرق زيادة الذوبانية بتفيد أكتر حاجة <b>Class II</b>، لأن الذوبان هو العائق الوحيد.</p>

<h4>6. طرق زيادة الذوبانية بالتفصيل</h4>
<h5>الطريقة 1: تغيير الـ pH (تكوين ملح)</h5>
<p>معظم الأدوية أحماض ضعيفة أو قواعد ضعيفة وذوبانها في الماء ضعيف. <b>الصورة المتأينة بتدوب في الماء أكتر بكتير</b> من غير المتأينة. فلأي دوا <b>قابل للتأين</b>، تغيير الـ pH (أو عمل ملح) هو <b>أبسط وأنجح</b> طريقة: القاعدة الضعيفة تدوب أحسن في pH واطي، والحمض الضعيف يدوب أحسن في pH عالي.</p>
<p><b>العيب:</b> الأملاح <b>قطبية ومتأينة</b> أكتر، والجزيئات المتأينة ما بتعدّيش الأغشية الدهنية كويس بالانتشار. فلو <b>النفاذية</b> هي المشكلة مش الذوبان، زيادة القطبية ممكن <b>تقلل</b> الامتصاص. مثال: أملاح <b>quaternary ammonium</b> ذوبانها عالي بس نفاذيتها ضعيفة فامتصاصها بالفم ضعيف.</p>
<ul>
<li><b>BCS Class II</b> (ذوبان ضعيف ونفاذية كويسة): تكوين الملح <b>غالبًا بيحسّن</b> الامتصاص.</li>
<li><b>BCS Class III</b> (ذوبان كويس ونفاذية ضعيفة): تكوين الملح مش هيفيد كتير وممكن <b>يضر</b> الامتصاص.</li>
</ul>
<div class="pearl"><strong>الخلاصة:</strong> الامتصاص بيعتمد على توازن بين الذوبان والنفاذية، فاصلحي اللي فيهم هو المشكلة.</div>
<h5>الطريقة 2: التعديل الكيميائي</h5>
<p>نعمل <b>مشتق من الدوا بيدوب في الماء</b>.</p>
<ul>
<li>إسترات sodium phosphate للكورتيزونات: <b>hydrocortisone sodium phosphate</b> وكمان prednisolone و betamethasone، وبتتاخد حقن.</li>
<li><b>Chloramphenicol sodium succinate</b> بيدوب في الماء بس <b>ما لوش تأثير مضاد للبكتيريا لوحده</b>. مناسب للحقن كمحلول، وفي الجسم <b>بيتحول للصورة الفعالة</b>. (ودي فكرة الـ prodrug.)</li>
</ul>
<h5>الطريقة 3: Co-solvency</h5>
<p>نخلط الماء بـ <b>مذيب بيمتزج بالماء والدوا بيدوب فيه بسهولة</b>، والمذيب ده اسمه <b>co-solvent</b>: <b>الجلسرين، الإيثانول، البروبيلين جليكول</b>. بيقلل قطبية الخليط فيقرّبها من قطبية الدوا.</p>
<p>مثال: <b>paracetamol elixir</b> معمول بكحول وبروبيلين جليكول.</p>
<h5>الطريقة 4: Micellar solubilization</h5>
<p>الـ <b>surfactants</b> ليها راس محبة للماء وديل كاره للماء. بتقلل التوتر السطحي وبتساعد الأدوية المحبة للدهون تدوب في الماء. فوق تركيز معين اسمه <b>critical micelle concentration (CMC)</b>، حوالي <b>0.05–0.1%</b> لمعظم الـ surfactants، الجزيئات بتتجمع وتعمل <b>micelles</b>: الديول جوّه والروس برّه. والدوا المحب للدهون بيستخبى في القلب الكاره للماء. ده اسمه <b>micellization</b>.</p>
<ul>
<li>فيتامينات <b>A و D و E و K</b> بتتذاب بالـ <b>polysorbates (Tweens)</b>.</li>
<li>المطهرات الفينولية <b>cresol</b> و<b>chloroxylenol</b> بتتذاب بالـ<b>صابون</b>: <b>Lysol</b> و<b>Dettol</b>.</li>
</ul>
<p><b>Polymeric micelles</b>: الـ surfactants مش الوحيدة اللي بتعمل micelles. الـ <b>amphiphilic polymers</b> (جزيئات كبيرة فيها جزء محب للماء وجزء كاره) بتتجمع لوحدها في الماء فوق الـ CMC بتاعها وتعمل micelles أو vesicles. القلب الكاره بيمسك الدوا، والغلاف المحب بيخليه ثابت في الماء. مثال: <b>PEG–PLA</b>.</p>
<h5>الطريقة 5: Hydrotropy</h5>
<p>إضافة <b>كمية كبيرة من مذاب تاني</b> (اسمه <b>hydrotrope</b>) بتزوّد ذوبان الدوا في الماء. أمثلة: محاليل مركّزة من <b>sodium benzoate</b> و<b>sodium salicylate</b> و<b>urea</b>.</p>
<p>الـ hydrotropes شبه الـ surfactants (جزء محب وجزء كاره)، بس <b>الجزء الكاره صغير جدًا ومش بيتجمع</b>. فـ<b>مفيش micelles</b> و<b>مفيش CMC</b>. ده الفرق الأساسي عن الـ micellar solubilization.</p>
<h5>الطريقة 6: Complexation بالـ cyclodextrins</h5>
<p>الـ <b>cyclodextrins (CDs)</b> سكريات حلقية من وحدات جلوكوز مربوطة α-1,4، بتتعمل من <b>النشا</b> بإنزيمات. <b>α-CD فيها 6</b> وحدات، <b>β-CD فيها 7</b>، و<b>γ-CD فيها 8</b>. شكلها زي كوباية مجوفة من غير قاع: <b>برّه محب للماء</b> و<b>التجويف جوّه كاره للماء</b>. الدوا الكاره للماء بيقعد جوه التجويف ويعمل <b>inclusion complex</b> بيدوب في الماء.</p>
<h5>الطريقة 7: تصغير حجم الجزيئات</h5>
<p>الجزيئات الأصغر مساحتها السطحية أكبر فبتدوب أسرع. هتتشرح بالتفصيل في محاضرة 2.</p>
<h5>الطريقة 8: Solid dispersion</h5>
<p>الدوا الضعيف الذوبان بيتوزع <b>على مستوى الجزيئات</b> جوه <b>بوليمر محب للماء</b> خامل زي <b>PVP</b> أو <b>HPMC</b> أو <b>PEG 6000</b>. لما البوليمر يدوب، الدوا بيطلع على شكل جزيئات دقيقة جدًا فتدوب بسرعة. بيتحضّر بطرق منها <b>الصهر (melting)</b> و<b>العجن (kneading)</b>.</p>

<h4>7. الحالة الدراسية في المحاضرة</h4>
<div class="ex"><b>الحالة:</b> صيدلي جديد حاول يذوّب دوا <b>قاعدي ضعيف</b> قليل الذوبان باستخدام Tween 80، والدوا فضل مش داب.<br>
<b>(أ) السبب المحتمل:</b> غالبًا تركيز الـ Tween 80 كان <b>أقل من الـ CMC</b>، فمفيش micelles اتكونت تاخد الدوا (أو كمية الـ surfactant كانت قليلة على كمية الدوا).<br>
<b>(ب) الحل الأفضل:</b> بما إن الدوا <b>قاعدة ضعيفة</b>، نستخدم <b>تغيير الـ pH</b>: نقلل الـ pH (نضيف حمض) أو نعمل ملح. الصورة المتأينة بتدوب أكتر بكتير، ودي أبسط وأنجح طريقة للأدوية القابلة للتأين. والـ co-solvency اختيار تاني.</div>

DEEP.dosage[2]={en:`
<p>Lecture 2 continues the solubilization toolkit with one big idea: <b>make the drug particles smaller, or change their crystal</b>. It covers three techniques, from simplest to most advanced: <b>micronization</b>, <b>nanocrystals</b> and <b>cocrystals</b>. You should be able to compare them, explain how each is made, and give marketed examples.</p>

<h4>1. Why particle size matters</h4>
<p>A drug dissolves from its surface. Break a particle into smaller pieces and the same mass exposes far more surface to the fluid, so it dissolves faster. This is captured by the <b>Noyes–Whitney equation</b>:</p>
<div class="formula">dm/dt = D · A · (Cs − C) / h<small>dm/dt = dissolution rate · D = diffusion coefficient · A = surface area · Cs = saturation solubility · C = concentration in bulk · h = diffusion layer thickness</small></div>
<p>Dissolution rate is <b>directly proportional to surface area (A)</b>. Halve the particle size and you roughly double the surface area per gram.</p>

<h4>2. Micronization</h4>
<p><b>Definition:</b> reducing drug particle size to the <b>micrometre range (1–10 µm)</b> <b>mechanically</b>, by milling or grinding.</p>
<h5>How it helps</h5>
<ul>
<li>Increases surface area exposed to the dissolution medium.</li>
<li>Increases dissolution rate (Noyes–Whitney).</li>
<li>Most useful for <b>BCS Class II</b> drugs (low solubility, high permeability), where dissolution is the limiting step.</li>
</ul>
<h5>Methods</h5>
<ul>
<li><b>Jet milling</b>: high-speed streams of compressed gas (air or nitrogen) make particles <b>collide with each other</b> in a chamber and shatter.</li>
<li><b>Ball milling</b>: a rotating cylinder filled with grinding balls impacts and grinds the material into fine powder.</li>
</ul>
<h5>Marketed examples</h5>
<p><b>Griseofulvin</b> and <b>spironolactone</b>.</p>
<h5>Challenges</h5>
<ul>
<li>May not be enough for very lipophilic drugs (<b>log P &gt; 4</b>).</li>
<li><b>Regulatory</b>: the FDA often requires evidence that micronization really improves dissolution and <b>does not change the polymorphic form</b> (milling energy can convert one crystal form into another).</li>
</ul>

<h4>3. Nanocrystals</h4>
<p><b>Definition:</b> drug particles reduced to <b>100–1000 nm</b> (below one micrometre).</p>
<p><b>Advantages:</b> much larger surface area than micronized particles, so better dissolution and bioavailability for BCS Class II drugs. Dissolution may even reach <b>supersaturation</b>.</p>
<h5>Two ways to make them</h5>
<p><b>1. Top-down</b>: start with large crystals and break them down.</p>
<ul>
<li>Method: <b>high-pressure homogenization (HPH)</b>, where mechanical energy breaks coarse crystals into nanocrystals.</li>
<li>Advantages: <b>scalable</b>, widely used in industry, reproducible particle size, already used in marketed products such as <b>Tricor® (fenofibrate)</b> and <b>Rapamune® (sirolimus)</b>.</li>
<li>Limitations: <b>high energy</b> use, and the <b>heat</b> generated can degrade thermolabile drugs.</li>
</ul>
<p><b>2. Bottom-up</b>: build nanocrystals up from dissolved molecules by controlled precipitation.</p>
<ul>
<li>Method: <b>solvent–antisolvent precipitation</b>. Dissolve the drug in a solvent, then mix it rapidly with a non-solvent so it precipitates as nano-sized particles.</li>
<li>Advantages: <b>uniform</b> particles with controlled shape, <b>less energy</b> than top-down, possible continuous processing.</li>
<li>Limitations: <b>scale-up problems</b> (mixing, solvent removal), risk of <b>residual solvent</b>, more complex process control.</li>
</ul>
<h5>The big problem: aggregation, and stabilizers</h5>
<p>Nanocrystals have very high <b>surface energy</b>, so they tend to clump together (aggregate) and lose their advantage. A <b>stabilizer</b> must be added. Its roles:</p>
<ol>
<li><b>Prevent aggregation</b> by forming a protective layer that keeps particles apart.</li>
<li><b>Maintain physical stability</b> (nanosize) during storage.</li>
<li><b>Improve wettability and dispersibility</b> in water.</li>
</ol>
<p>How stabilizers work:</p>
<ul>
<li><b>Steric</b>: polymers coat the surface and physically stop particles touching: <b>PVP, HPMC, PEG</b>.</li>
<li><b>Electrostatic</b>: charged stabilizers give particles a surface charge (<b>zeta potential</b>), so like charges repel: <b>sodium dodecyl sulfate (SDS)</b>.</li>
<li><b>Both</b>: e.g. ionic surfactants.</li>
</ul>
<p>Surfactant stabilizers include <b>Tween 80</b> (polysorbate 80) and <b>Spans 20, 40, 80</b>.</p>
<p><b>Marketed nanocrystal products:</b> <b>Rapamune®</b> (sirolimus), <b>Emend®</b> (aprepitant), <b>Tricor®</b> (fenofibrate).</p>

<h4>4. Micronization vs nanocrystals</h4>
<div class="tblwrap"><table><tr><th>Feature</th><th>Micronization</th><th>Nanocrystals</th></tr>
<tr><td>Particle size</td><td>1–10 µm</td><td>100–1000 nm</td></tr>
<tr><td>Surface area increase</td><td>Moderate</td><td>Very high</td></tr>
<tr><td>Dissolution gain</td><td>Limited</td><td>Greater, sometimes supersaturation</td></tr>
<tr><td>Methods</td><td>Jet milling, ball milling</td><td>Homogenization, precipitation</td></tr>
<tr><td>Stability</td><td>More stable</td><td>Needs stabilizers to avoid aggregation</td></tr></table></div>

<h4>5. Cocrystals</h4>
<p><b>Definition:</b> multicomponent crystals made of the <b>drug + a coformer</b> in one crystal lattice, held together by <b>non-covalent</b> interactions (hydrogen bonds, van der Waals forces, π–π stacking).</p>
<p><b>Purpose:</b> change <b>physical</b> properties (solubility, stability, mechanical strength) <b>without changing the pharmacological activity</b>. No covalent bond to the drug is made, so the drug molecule itself is unchanged. Example: <b>carbamazepine–saccharin 1:1</b>.</p>
<h5>Why cocrystals dissolve better: three mechanisms</h5>
<ol>
<li><b>Crystal lattice modification</b>: a pure drug crystal often has a strong, stable lattice that resists breaking up. In a cocrystal the drug is held by weaker non-covalent bonds to the coformer, so solvent penetrates more easily. Carbamazepine–saccharin dissolves faster than pure carbamazepine.</li>
<li><b>Improved wetting</b>: many poorly soluble drugs are hydrophobic and wet poorly. Coformers are often <b>hydrophilic</b> (nicotinamide, caffeine, saccharin), so the cocrystal surface contacts water better.</li>
<li><b>Thermodynamic driving force</b>: cocrystal formation changes the free energy. Some cocrystals are less thermodynamically stable than the pure drug, which favours dissolution.</li>
</ol>
<h5>Choosing a coformer: four criteria</h5>
<ol>
<li><b>Complementary interactions</b>: functional groups able to hydrogen-bond, π-stack or form van der Waals contacts with the drug (carboxylic acid, amide, hydroxyl).</li>
<li><b>Safety and GRAS status</b> (Generally Recognized As Safe, FDA): e.g. nicotinamide, saccharin, caffeine, succinic acid.</li>
<li><b>Property enhancement</b>: must improve solubility, dissolution, stability or bioavailability (e.g. carbamazepine–nicotinamide improves solubility).</li>
<li><b>Compatibility</b>: must not react chemically with the drug or degrade during processing and storage.</li>
</ol>
<h5>Types</h5>
<ul>
<li><b>Single-drug cocrystals</b>: one API + an inactive coformer (e.g. saccharin).</li>
<li><b>Multidrug cocrystals</b>: two or more APIs in the <b>same crystal lattice</b>, molecularly integrated, not just physically blended. Marketed example: <b>Entresto®</b> (<b>sacubitril + valsartan</b>), used for symptomatic <b>heart failure</b>.</li>
</ul>
<h5>Applications</h5>
<ol>
<li><b>Solubility and dissolution rate</b> → faster onset: <b>naproxen–L-alanine</b> dissolves faster than pure naproxen.</li>
<li><b>Bioavailability</b>, especially for BCS Class II: <b>baicalein–caffeine</b> cocrystal gave higher plasma levels in rats than the pure drug or a physical mixture.</li>
<li><b>Stability</b>: protection from light, heat and humidity; <b>less hygroscopic</b> forms (<b>caffeine–oxalic acid</b> is more stable in humid conditions than pure caffeine); can turn <b>liquid APIs</b> with low melting points into stable solids.</li>
<li><b>Taste masking</b>: sweet coformers hide bitter drugs (paracetamol–trimethylglycine, carbamazepine–saccharin).</li>
<li><b>Multidrug cocrystals</b> for synergy and simpler regimens: <b>meloxicam–aspirin</b> raised bioavailability from <b>16% to 69%</b>.</li>
</ol>
<h5>Preparation methods</h5>
<ul>
<li><b>Solid-state</b>: <b>neat (dry) grinding</b> (solvent-free, but products may be impure); <b>liquid-assisted (wet) grinding</b> (a little liquid acts as a catalyst, improving efficiency and purity).</li>
<li><b>Solvent-based</b>: <b>solvent evaporation</b>, where both components are dissolved and the solvent is evaporated.</li>
<li><b>Green techniques</b>: <b>ultrasound-assisted</b> (waves trigger rapid nucleation) and <b>microwave-assisted</b>.</li>
</ul>
<div class="pearl"><strong>Exam contrast:</strong> a <b>salt</b> involves proton transfer (ionic bond); a <b>cocrystal</b> has only non-covalent bonds and no change to the drug; a <b>solid dispersion</b> (Lecture 1) is the drug spread through a polymer, not a new crystal.</div>
