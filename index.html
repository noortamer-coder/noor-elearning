<p>Lecture 2 explains the characteristic reaction of aldehydes and ketones, <b>nucleophilic addition</b>, with its four main examples. It then covers the <b>stereochemistry</b> of these additions (racemic mixtures, and Cram and Abdel-Hafez's rule), how to assign <b>R/S</b> and <b>erythro/threo</b>, and finally the <b>reduction</b> of carbonyls to alkanes or alcohols.</p>

<h4>1. The general mechanism</h4>
<p>The carbonyl carbon is δ+ (Lecture 1). A <b>nucleophile</b> (an electron-rich species, Nu⁻) attacks it, the π electrons move onto oxygen to form an <b>alkoxide</b>, and the alkoxide is then <b>protonated</b> to give the product. The carbon changes from flat sp² to tetrahedral sp³.</p>
<div class="formula">R₂C=O + Nu⁻ → R₂C(Nu)–O⁻ → (+H⁺) → R₂C(Nu)–OH</div>

<h4>2. Which carbonyls react fastest?</h4>
<h5>Aldehydes vs ketones: aldehydes win, for two reasons</h5>
<ul>
<li><b>Steric</b>: an aldehyde has only one R group, so the carbon is less crowded and the nucleophile approaches more easily. A ketone's two R groups block the approach.</li>
<li><b>Electronic</b>: alkyl groups donate electrons (+I). Two R groups stabilise (reduce) the δ+ charge on a ketone's carbon more than one R group does in an aldehyde. A less positive carbon is less attractive to nucleophiles.</li>
</ul>
<h5>Aliphatic vs aromatic: aliphatic wins</h5>
<p>In aromatic aldehydes and ketones, the ring is conjugated with the C=O. The carbonyl's <b>−M (resonance)</b> effect spreads the positive charge into the ring, so the carbonyl carbon is <b>less electrophilic</b>. Order: aliphatic aldehydes &gt; aromatic aldehydes; aliphatic ketones &gt; aromatic ketones.</p>

<h4>3. The four nucleophilic additions</h4>
<h5>A. Alcohols → hemiacetals → acetals (hemiketals → ketals)</h5>
<ul>
<li>In the presence of <b>dry HCl</b> (acid catalyst), an aldehyde or ketone reacts with <b>two equivalents of alcohol</b>.</li>
<li>Step 1: one alcohol adds, giving a <b>hemiacetal</b> (from an aldehyde) or <b>hemiketal</b> (from a ketone): a carbon carrying both –OH and –OR.</li>
<li>Step 2: a second alcohol replaces the –OH (losing water), giving the <b>acetal</b> or <b>ketal</b>: a carbon with two –OR groups.</li>
<li>The reaction is <b>reversible</b>: excess <b>water</b> converts the acetal/ketal back to the carbonyl compound.</li>
</ul>
<div class="formula">RCHO + R'OH ⇌ RCH(OH)OR' (hemiacetal) + R'OH ⇌ RCH(OR')₂ (acetal) + H₂O</div>
<p><b>Protecting groups:</b> reacting the carbonyl with a <b>diol</b> such as ethylene glycol gives a <b>cyclic acetal/ketal</b>. Synthetic chemists use this to protect a carbonyl: (1) form the cyclic acetal; (2) carry out reactions elsewhere in the molecule that would otherwise attack the carbonyl; (3) <b>deprotect</b> by adding excess water (with acid) to regenerate the carbonyl.</p>
<div class="ex"><b>Question 2.1:</b> a ketone + one alcohol gives product 1, which with a second alcohol gives product 2. Mechanism of step 1: <b>nucleophilic addition</b>. Product 1 is a <b>hemiketal</b>; product 2 is a <b>ketal</b>.</div>
<h5>B. HCN → cyanohydrins</h5>
<ol>
<li>The <b>cyanide ion</b> (the nucleophile) adds to the carbonyl carbon, forming an alkoxide.</li>
<li>The alkoxide takes a proton from HCN, giving a <b>cyanohydrin</b>: a carbon carrying –OH and –CN.</li>
</ol>
<p>Hydrolysing the –CN to –COOH gives an <b>α-hydroxy acid (AHA)</b>. Application: <b>mandelic acid</b> (from benzaldehyde cyanohydrin), a chemical skin exfoliant that removes dead cells and speeds cell turnover, used for acne and blackheads.</p>
<h5>C. Grignard reagents → alcohols</h5>
<p>A Grignard reagent (R'MgX) behaves as a carbanion R'⁻, a strong carbon nucleophile. It adds to the carbonyl, forming a new C–C bond; acid work-up then gives an alcohol. The class of alcohol depends on the starting carbonyl: <b>formaldehyde → 1° alcohol</b>, <b>other aldehydes → 2° alcohol</b>, <b>ketones → 3° alcohol</b>.</p>
<h5>D. Ammonia derivatives → condensation products</h5>
<p>Compounds of the type H₂N–G add to the C=O, then <b>lose water</b>, forming C=N–G. Because water is lost, these are called <b>condensation</b> reactions.</p>
<div class="tblwrap"><table><tr><th>Reagent H₂N–G</th><th>Product (C=N–G)</th></tr>
<tr><td>Primary amine, R–NH₂</td><td><b>Imine</b> (Schiff base)</td></tr>
<tr><td>Hydroxylamine, NH₂OH</td><td><b>Oxime</b></td></tr>
<tr><td>Hydrazine, NH₂NH₂ (or phenylhydrazine)</td><td><b>Hydrazone</b> (phenylhydrazone)</td></tr>
<tr><td>Semicarbazide, NH₂NHCONH₂</td><td><b>Semicarbazone</b></td></tr></table></div>
<p><b>Oximes</b> are used to treat <b>organophosphate poisoning</b> (e.g. pralidoxime reactivates inhibited acetylcholinesterase).</p>
<div class="ex"><b>Question 2.2:</b> a carbonyl + hydrazine gives product 1; + semicarbazide gives product 2. Mechanism: <b>nucleophilic addition</b> (followed by loss of water). Product 1 is a <b>hydrazone</b>; product 2 is a <b>semicarbazone</b>.</div>

<h4>4. Stereochemistry of nucleophilic addition</h4>
<p><b>Dynamic stereochemistry</b> studies how stereochemistry affects the rate and outcome of reactions. A <b>prochiral</b> molecule is achiral but can become chiral by a single change. An unsymmetrical ketone (R–CO–R', R ≠ R') is prochiral: adding a nucleophile creates a carbon with four different groups.</p>
<h5>1. Racemic synthesis (no existing chiral centre)</h5>
<p>The carbonyl is flat, and both faces are equally accessible. The nucleophile attacks the top and bottom faces equally often, giving a <b>50:50 mixture of two enantiomers</b>: a <b>racemic mixture</b>. It is <b>optically inactive</b>, because the two rotations cancel. The two products are <b>enantiomers</b>.</p>
<h5>2. Stereoselective reaction (an existing chiral α-carbon)</h5>
<p>If the molecule already has a chiral centre next to the carbonyl, addition creates a <b>second</b> stereocentre, so the products are <b>diastereomers</b>, and they form in <b>unequal</b> amounts. A reaction that gives mainly one stereoisomer is <b>stereoselective</b>.</p>
<p><b>Cram and Abdel-Hafez's rule</b> predicts which diastereomer dominates:</p>
<ul>
<li>Label the three groups on the chiral α-carbon <b>Small (S), Medium (M) and Large (L)</b>.</li>
<li>In the preferred conformation, the large group points away from the carbonyl oxygen, leaving S and M flanking the two faces.</li>
<li>The nucleophile prefers to attack from the side of the <b>small group</b> (least steric hindrance), giving the <b>major</b> diastereomer, the <b>threo</b> isomer.</li>
<li>Attack from the side of the <b>medium group</b> gives the <b>minor</b> diastereomer, the <b>erythro</b> isomer.</li>
</ul>
<p>Major and minor products are <b>diastereomers</b> of each other.</p>

<h4>5. Chirality, R/S and erythro/threo</h4>
<h5>Chiral carbon</h5>
<p>A <b>chiral carbon</b> (stereogenic centre, asymmetric carbon) is a tetrahedral sp³ carbon (bond angles 109.5°) bonded to <b>four different groups</b>. If any two groups are identical, the carbon is <b>achiral</b>. A chiral molecule is not superimposable on its mirror image.</p>
<h5>Assigning R/S from a Fischer projection</h5>
<ol>
<li>Rank the four groups by <b>atomic number</b> of the attached atom: I &gt; Br &gt; Cl &gt; S &gt; F &gt; O &gt; N &gt; C &gt; H (priority 1 = highest, 4 = lowest).</li>
<li>Trace 1 → 2 → 3.</li>
<li>If the <b>lowest-priority group (4) is vertical</b>: clockwise = <b>R</b>; anticlockwise = <b>S</b>.</li>
<li>If group 4 is <b>horizontal</b>, <b>reverse</b> the answer: clockwise = <b>S</b>; anticlockwise = <b>R</b>.</li>
</ol>
<p>Why the reversal? In a Fischer projection, horizontal bonds point <b>toward</b> you. The R/S rule assumes the lowest group points <b>away</b>, which is true only when it is vertical. With two chiral carbons, assign each centre separately.</p>
<h5>Relative configuration: erythro and threo</h5>
<p>With the carbon chain drawn vertically in a Fischer projection:</p>
<ul>
<li><b>Erythro</b>: like (similar) substituents on the <b>same side</b>.</li>
<li><b>Threo</b>: like substituents on <b>opposite sides</b>.</li>
</ul>
<h5>Enantiomers vs diastereomers</h5>
<div class="tblwrap"><table><tr><th>Enantiomers</th><th>Diastereomers</th></tr>
<tr><td>Same formula and connectivity, not superimposable</td><td>Same formula and connectivity, not superimposable</td></tr>
<tr><td><b>Mirror images</b></td><td><b>Not</b> mirror images</td></tr>
<tr><td>One or more chiral carbons</td><td><b>Two or more</b> chiral carbons</td></tr>
<tr><td>Identical physical and chemical properties <b>except optical rotation</b> (equal and opposite)</td><td>Same chemical character but <b>different physical properties</b> (melting point, solubility…)</td></tr></table></div>

<h4>6. Reduction of carbonyls</h4>
<h5>A. To hydrocarbons (alkanes): C=O → CH₂</h5>
<ul>
<li><b>Clemmensen reduction</b>: <b>Zn(Hg)/conc. HCl</b>, acidic conditions.</li>
<li><b>Wolff–Kishner reduction</b>: <b>hydrazine (N₂H₄) and KOH</b> (base), with heating. It goes through a hydrazone, which loses N₂.</li>
</ul>
<p>Choose by stability: use Wolff–Kishner if the molecule is acid-sensitive, Clemmensen if it is base-sensitive.</p>
<h5>B. To alcohols with metal hydrides</h5>
<ul>
<li><b>NaBH₄</b> or <b>LiAlH₄</b>, followed by a proton source, reduce: <b>aldehyde → 1° alcohol</b>; <b>ketone → 2° alcohol</b>.</li>
<li>Mechanistically this is a <b>nucleophilic addition</b>: the hydride ion (H⁻) adds across the C=O π bond.</li>
<li><b>Stereochemistry:</b> the flat sp² carbonyl becomes a tetrahedral sp³ carbon. If the ketone is prochiral, a <b>new stereocentre</b> forms. Hydride can attack either face, so from a simple unsymmetrical ketone you get a <b>racemic</b> pair of enantiomers.</li>
</ul>
<div class="ex"><b>Question 2.3:</b> reducing an unsymmetrical ketone (e.g. butan-2-one) with NaBH₄ gives (R)- and (S)-butan-2-ol in equal amounts. Their relationship: <b>enantiomers</b> (a racemic mixture).</div>

<p>محاضرة 2 بتشرح التفاعل المميز للألدهيدات والكيتونات، <b>الإضافة النيوكليوفيلية</b>، بأربع أمثلة أساسية. وبعدين <b>الكيمياء الفراغية</b> للإضافات دي (الخليط الراسيمي، وقاعدة Cram و عبد الحافظ)، وإزاي نحدد <b>R/S</b> و<b>erythro/threo</b>، وفي الآخر <b>اختزال</b> الكربونيل لألكانات أو كحولات.</p>

<h4>1. الميكانيزم العام</h4>
<p>كربون الكربونيل δ+ (محاضرة 1). <b>النيوكليوفيل</b> (مادة غنية بالإلكترونات، Nu⁻) بيهاجمه، وإلكترونات π بتروح للأكسجين فيتكوّن <b>alkoxide</b>، وبعدين الـ alkoxide بياخد <b>بروتون</b> فيطلع الناتج. والكربون بيتحول من sp² مسطح لـ sp³ رباعي.</p>
<div class="formula">R₂C=O + Nu⁻ → R₂C(Nu)–O⁻ → (+H⁺) → R₂C(Nu)–OH</div>

<h4>2. مين بيتفاعل أسرع؟</h4>
<h5>الألدهيد ولا الكيتون؟ الألدهيد، لسببين</h5>
<ul>
<li><b>فراغي (steric)</b>: الألدهيد فيه R واحدة بس، فالكربون أقل زحمة والنيوكليوفيل يوصل أسهل. الكيتون فيه R اتنين بيسدوا الطريق.</li>
<li><b>إلكتروني</b>: مجموعات الألكيل بتدي إلكترونات (+I). مجموعتين R في الكيتون بيقللوا الشحنة δ+ على الكربون أكتر من R واحدة في الألدهيد. والكربون الأقل موجبية أقل جاذبية للنيوكليوفيلات.</li>
</ul>
<h5>الأليفاتي ولا الأروماتي؟ الأليفاتي</h5>
<p>في الألدهيدات والكيتونات الأروماتية، الحلقة متقارنة (conjugated) مع الـ C=O. تأثير <b>−M (الرنين)</b> بتاع الكربونيل بيوزّع الشحنة الموجبة على الحلقة، فكربون الكربونيل يبقى <b>أقل إلكتروفيلية</b>. الترتيب: الألدهيدات الأليفاتية &gt; الأروماتية؛ والكيتونات الأليفاتية &gt; الأروماتية.</p>

<h4>3. الإضافات النيوكليوفيلية الأربعة</h4>
<h5>أ. الكحولات ← hemiacetals ← acetals (hemiketals ← ketals)</h5>
<ul>
<li>في وجود <b>HCl جاف</b> (عامل حفاز حمضي)، الألدهيد أو الكيتون بيتفاعل مع <b>مكافئين من الكحول</b>.</li>
<li>الخطوة 1: كحول واحد بيضاف فيطلع <b>hemiacetal</b> (من ألدهيد) أو <b>hemiketal</b> (من كيتون): كربون عليه OH و OR.</li>
<li>الخطوة 2: كحول تاني بيحل محل الـ OH (ويطلع ماء)، فيطلع <b>acetal</b> أو <b>ketal</b>: كربون عليه OR اتنين.</li>
<li>التفاعل <b>عكسي</b>: الماء الزيادة بيرجّع الـ acetal/ketal للكربونيل تاني.</li>
</ul>
<div class="formula">RCHO + R'OH ⇌ RCH(OH)OR' (hemiacetal) + R'OH ⇌ RCH(OR')₂ (acetal) + H₂O</div>
<p><b>مجموعات الحماية:</b> لو فاعلنا الكربونيل مع <b>diol</b> زي ethylene glycol بيطلع <b>acetal/ketal حلقي</b>. الكيميائيين بيستخدموا ده عشان يحموا الكربونيل: (1) نعمل الـ acetal الحلقي؛ (2) نعمل التفاعلات اللي عايزينها في حتة تانية من الجزيء واللي كانت هتهاجم الكربونيل؛ (3) <b>نشيل الحماية</b> بماء زيادة (مع حمض) فيرجع الكربونيل.</p>
<div class="ex"><b>سؤال 2.1:</b> كيتون + كحول واحد ← ناتج 1، ومع كحول تاني ← ناتج 2. ميكانيزم الخطوة الأولى: <b>إضافة نيوكليوفيلية</b>. ناتج 1 <b>hemiketal</b>، وناتج 2 <b>ketal</b>.</div>
<h5>ب. HCN ← cyanohydrins</h5>
<ol>
<li><b>أيون السيانيد</b> (النيوكليوفيل) بيضاف لكربون الكربونيل فيتكون alkoxide.</li>
<li>الـ alkoxide بياخد بروتون من HCN، فيطلع <b>cyanohydrin</b>: كربون عليه OH و CN.</li>
</ol>
<p>لو حلّلنا الـ CN لـ COOH بيطلع <b>α-hydroxy acid (AHA)</b>. التطبيق: <b>حمض المانديليك</b> (من cyanohydrin البنزالدهيد)، مقشّر كيميائي للبشرة بيشيل الخلايا الميتة ويسرّع تجدد الخلايا، وبيتستخدم لحب الشباب والرؤوس السودا.</p>
<h5>ج. كواشف جرينيارد ← كحولات</h5>
<p>الـ Grignard (R'MgX) بيتصرف كـ carbanion (R'⁻)، نيوكليوفيل كربوني قوي. بيضاف للكربونيل ويعمل رابطة C–C جديدة، وبعد المعالجة بالحمض بيطلع كحول. نوع الكحول بيعتمد على الكربونيل: <b>الفورمالدهيد ← كحول أولي</b>، <b>باقي الألدهيدات ← ثانوي</b>، <b>الكيتونات ← ثالثي</b>.</p>
<h5>د. مشتقات الأمونيا ← نواتج التكثيف</h5>
<p>مركّبات من نوع H₂N–G بتضاف للـ C=O وبعدين <b>بتفقد ماء</b> فيتكون C=N–G. وعشان بيطلع ماء اسمها تفاعلات <b>تكثيف (condensation)</b>.</p>
<div class="tblwrap"><table><tr><th>Reagent</th><th>Product</th></tr>
<tr><td>Primary amine</td><td>Imine (Schiff base)</td></tr>
<tr><td>Hydroxylamine</td><td>Oxime</td></tr>
<tr><td>Hydrazine / phenylhydrazine</td><td>Hydrazone / phenylhydrazone</td></tr>
<tr><td>Semicarbazide</td><td>Semicarbazone</td></tr></table></div>
<p>الـ <b>oximes</b> بتتستخدم لعلاج <b>التسمم بالمبيدات الفوسفورية العضوية</b> (زي pralidoxime اللي بيرجّع نشاط إنزيم acetylcholinesterase).</p>
<div class="ex"><b>سؤال 2.2:</b> كربونيل + هيدرازين ← ناتج 1؛ + semicarbazide ← ناتج 2. الميكانيزم: <b>إضافة نيوكليوفيلية</b> (وبعدها فقد ماء). ناتج 1 <b>hydrazone</b>، وناتج 2 <b>semicarbazone</b>.</div>

<h4>4. الكيمياء الفراغية للإضافة النيوكليوفيلية</h4>
<p>الـ <b>Dynamic stereochemistry</b> بتدرس الكيمياء الفراغية بتأثر إزاي على سرعة ونتيجة التفاعلات. والجزيء <b>prochiral</b> هو جزيء مش chiral بس ممكن يبقى chiral بتغيير واحد. الكيتون غير المتماثل (R–CO–R' و R ≠ R') ده prochiral: إضافة نيوكليوفيل بتعمل كربون عليه 4 مجموعات مختلفة.</p>
<h5>1. Racemic synthesis (مفيش مركز chiral موجود)</h5>
<p>الكربونيل مسطح والوشين متاحين بنفس الدرجة. النيوكليوفيل بيهاجم من فوق ومن تحت بنفس النسبة، فيطلع <b>خليط 50:50 من اتنين enantiomers</b>: <b>racemic mixture</b>. وهو <b>غير نشط ضوئيًا</b> لأن الدورانين بيلغوا بعض. والناتجين <b>enantiomers</b>.</p>
<h5>2. تفاعل stereoselective (فيه α-carbon كيرالي موجود)</h5>
<p>لو الجزيء فيه أصلًا مركز chiral جنب الكربونيل، الإضافة بتعمل مركز <b>تاني</b>، فالنواتج بتبقى <b>diastereomers</b>، وبيتكونوا <b>بكميات مش متساوية</b>. والتفاعل اللي بيدي أساسًا أيزومر فراغي واحد اسمه <b>stereoselective</b>.</p>
<p><b>قاعدة Cram و عبد الحافظ</b> بتتوقع أنهي diastereomer هيغلب:</p>
<ul>
<li>سمّي المجموعات التلاتة على الـ α-carbon الكيرالي: <b>صغيرة (S)، ومتوسطة (M)، وكبيرة (L)</b>.</li>
<li>في الشكل المفضّل، المجموعة الكبيرة بتبعد عن أكسجين الكربونيل، والـ S والـ M بيبقوا على الوشين.</li>
<li>النيوكليوفيل بيفضّل يهاجم من ناحية <b>المجموعة الصغيرة</b> (أقل عائق فراغي)، فيطلع الـ diastereomer <b>الأساسي (major)</b>، وهو <b>threo</b>.</li>
<li>الهجوم من ناحية <b>المتوسطة</b> بيدي الـ diastereomer <b>الأقل (minor)</b>، وهو <b>erythro</b>.</li>
</ul>
<p>والناتج الأساسي والأقل <b>diastereomers</b> لبعض.</p>

<h4>5. الكيرالية و R/S و erythro/threo</h4>
<h5>الكربون الكيرالي</h5>
<p>الـ <b>chiral carbon</b> (stereogenic centre) هو كربون sp³ رباعي (زوايا 109.5°) مربوط بـ<b>4 مجموعات مختلفة</b>. لو أي مجموعتين متشابهين يبقى الكربون <b>achiral</b>. والجزيء الكيرالي ما بينطبقش على صورته في المراية.</p>
<h5>تحديد R/S من إسقاط فيشر</h5>
<ol>
<li>رتّبي المجموعات الأربعة حسب <b>العدد الذري</b> للذرة المربوطة: I &gt; Br &gt; Cl &gt; S &gt; F &gt; O &gt; N &gt; C &gt; H (1 = الأعلى، 4 = الأقل).</li>
<li>امشي من 1 ← 2 ← 3.</li>
<li>لو <b>المجموعة الأقل (4) رأسية</b>: مع عقارب الساعة = <b>R</b>، وعكسها = <b>S</b>.</li>
<li>لو المجموعة 4 <b>أفقية</b>، <b>اعكسي</b> الإجابة: مع عقارب الساعة = <b>S</b>، وعكسها = <b>R</b>.</li>
</ol>
<p>ليه بنعكس؟ في إسقاط فيشر الروابط الأفقية جاية <b>ناحيتك</b>. وقاعدة R/S بتفترض إن المجموعة الأقل بعيدة <b>عنك</b>، ودي صح بس لما تكون رأسية. ولو فيه كربونين كيراليين، حددي كل مركز لوحده.</p>
<h5>الترتيب النسبي: erythro و threo</h5>
<p>لما سلسلة الكربون مرسومة رأسي في إسقاط فيشر:</p>
<ul>
<li><b>Erythro</b>: المجموعات المتشابهة في <b>نفس الناحية</b>.</li>
<li><b>Threo</b>: المجموعات المتشابهة في <b>ناحيتين مختلفتين</b>.</li>
</ul>
<h5>Enantiomers مقابل Diastereomers</h5>
<div class="tblwrap"><table><tr><th>Enantiomers</th><th>Diastereomers</th></tr>
<tr><td>Mirror images</td><td>Not mirror images</td></tr>
<tr><td>One or more chiral carbons</td><td>Two or more chiral carbons</td></tr>
<tr><td>Same properties except optical rotation</td><td>Different physical properties</td></tr></table></div>
<p>الاتنين ليهم نفس الصيغة ونفس ترتيب الروابط ومش بينطبقوا على بعض. الـ <b>enantiomers</b> صورة مراية لبعض، وخواصهم الفيزيائية والكيميائية واحدة <b>ما عدا الدوران الضوئي</b> (متساوي وعكس بعض). والـ <b>diastereomers</b> مش صورة مراية، وفيهم <b>مركزين كيراليين أو أكتر</b>، وخواصهم الكيميائية شبه بعض بس <b>خواصهم الفيزيائية مختلفة</b> (درجة الانصهار، الذوبان…).</p>

<h4>6. اختزال الكربونيل</h4>
<h5>أ. لهيدروكربونات (ألكانات): C=O ← CH₂</h5>
<ul>
<li><b>Clemmensen</b>: <b>Zn(Hg) مع HCl مركّز</b>، وسط حمضي.</li>
<li><b>Wolff–Kishner</b>: <b>هيدرازين (N₂H₄) و KOH</b> (قلوي) مع التسخين، وبيعدّي على hydrazone بيفقد N₂.</li>
</ul>
<p>بنختار حسب الثبات: Wolff–Kishner لو الجزيء حساس للحمض، و Clemmensen لو حساس للقلوي.</p>
<h5>ب. لكحولات بالـ metal hydrides</h5>
<ul>
<li><b>NaBH₄</b> أو <b>LiAlH₄</b>، وبعدهم مصدر بروتون، بيختزلوا: <b>الألدهيد ← كحول أولي</b>، و<b>الكيتون ← كحول ثانوي</b>.</li>
<li>ميكانيزميًا ده <b>إضافة نيوكليوفيلية</b>: أيون الهيدريد (H⁻) بيضاف على رابطة π.</li>
<li><b>الكيمياء الفراغية:</b> الكربونيل المسطح sp² بيبقى كربون sp³ رباعي. لو الكيتون prochiral بيتكون <b>مركز فراغي جديد</b>. والهيدريد ممكن يهاجم من أي وش، فمن كيتون بسيط غير متماثل بيطلع زوج enantiomers <b>راسيمي</b>.</li>
</ul>
<div class="ex"><b>سؤال 2.3:</b> اختزال كيتون غير متماثل (زي butan-2-one) بـ NaBH₄ بيدي (R)- و (S)-butan-2-ol بكميات متساوية. العلاقة بينهم: <b>enantiomers</b> (خليط راسيمي).</div>

DEEP.organic[3]={en:`
<p>Lecture 3 completes the reactions of aldehydes and ketones with two more families: reactions of the <b>acidic α-hydrogen</b> (aldol condensation, Cannizzaro, haloform) and <b>electrophilic aromatic substitution</b> on aromatic carbonyls. It then begins <b>carboxylic acids</b>: their naming, ester naming, and physical properties.</p>

<h4>1. Map of carbonyl reactions so far</h4>
<ol>
<li><b>Nucleophilic addition</b>: alcohols (acetals/ketals), HCN (cyanohydrins), Grignard (alcohols), ammonia derivatives (condensation products).</li>
<li><b>Reduction</b>: Clemmensen, Wolff–Kishner, metal hydrides.</li>
<li><b>Reactions of the acidic α-hydrogen</b>: aldol, Cannizzaro, haloform (this lecture).</li>
<li><b>Electrophilic substitution (SEAr)</b> for aromatic aldehydes and ketones (this lecture).</li>
</ol>
<div class="tblwrap"><table><tr><th></th><th>Racemic synthesis</th><th>Stereoselective reaction</th></tr>
<tr><td>Substrate</td><td>Achiral (prochiral), no existing stereocentre</td><td>Chiral, with an asymmetric carbon α to the carbonyl</td></tr>
<tr><td>Attack</td><td>Equal (50:50) from top and bottom faces</td><td>Unequal, because of steric differences (Cram and Abdel-Hafez)</td></tr>
<tr><td>Products</td><td>Enantiomeric pair: 50% R + 50% S</td><td>Unequal mixture of diastereomers: threo (major), erythro (minor)</td></tr>
<tr><td>Optical activity</td><td>Inactive, [α] = 0 (racemic)</td><td>Optically active mixture</td></tr></table></div>

<h4>2. Why the α-hydrogen is acidic</h4>
<p>The <b>α-carbon</b> is the carbon directly next to the C=O; hydrogens on it are <b>α-hydrogens</b>. A base can remove an α-H because the resulting negative charge (carbanion) is <b>stabilised</b> by the carbonyl in two ways:</p>
<ul>
<li><b>Inductive (−I)</b>: the electron-withdrawing C=O pulls electron density away from the α-carbon.</li>
<li><b>Resonance</b>: the negative charge is delocalised onto the oxygen. This resonance-stabilised anion is the <b>enolate ion</b>.</li>
</ul>

<h4>3. Aldol condensation</h4>
<p>Carbonyl compounds <b>with α-hydrogens</b>, in a <b>strong base</b> (NaOH or NaOEt), condense to form <b>α,β-unsaturated aldehydes or ketones</b>.</p>
<ol>
<li>The base removes an α-proton, forming a resonance-stabilised <b>enolate ion</b>.</li>
<li>The enolate (acting as a <b>nucleophile</b>) attacks the carbonyl carbon of a <b>second molecule</b>.</li>
<li>The resulting alkoxide is <b>protonated</b>, giving a β-hydroxy carbonyl (the "aldol" = ald-ehyde + alcoh-ol), which then <b>loses water</b> (condensation) to form the C=C conjugated with C=O.</li>
</ol>
<div class="formula">2CH₃CHO → (NaOH) → CH₃CH(OH)CH₂CHO → (−H₂O) → CH₃CH=CHCHO (crotonaldehyde)</div>
<p>The reaction can keep going, joining many molecules: acetaldehyde with 30% NaOH gives a <b>yellow resin</b>.</p>

<h4>4. Cannizzaro reaction (self oxidation–reduction)</h4>
<ul>
<li>For aldehydes with <b>no α-hydrogen</b> (they can't form an enolate, so they can't do aldol): <b>formaldehyde</b>, <b>benzaldehyde</b>.</li>
<li>Conditions: <b>hot, strong alkali</b> (concentrated NaOH).</li>
<li>Two molecules react: <b>one is reduced to an alcohol</b>, the <b>other oxidised to a carboxylic acid</b> (as its salt). One aldehyde molecule transfers a hydride to another.</li>
</ul>
<div class="formula">2C₆H₅CHO + NaOH → C₆H₅CH₂OH (benzyl alcohol) + C₆H₅COONa (sodium benzoate)</div>
<div class="pearl"><strong>Decision rule:</strong> aldehyde + base. Has α-H? → <b>aldol</b>. No α-H? → <b>Cannizzaro</b>.</div>

<h4>5. Haloform (iodoform) reaction</h4>
<ul>
<li>Any compound containing a <b>CH₃CO–</b> (methyl ketone) group, treated with <b>I₂/NaOH</b> (or Br₂/NaOH), gives a <b>haloform</b>: <b>CHI₃ (iodoform)</b>, a yellow precipitate, or CHBr₃.</li>
<li>Mechanism: the three α-hydrogens of the CH₃ are replaced by halogen one by one (each substitution makes the next easier), giving CX₃CO–R; hydroxide then cleaves the C–C bond, releasing CHX₃ and the carboxylate.</li>
<li>The organic product, the <b>acid salt</b>, has <b>one carbon fewer</b> than the starting compound.</li>
</ul>
<div class="formula">CH₃COCH₃ + 3I₂ + 4NaOH → CHI₃↓ + CH₃COONa + 3NaI + 3H₂O</div>
<p>The yellow iodoform precipitate is a classic test for methyl ketones (and for alcohols that oxidise to them).</p>
<div class="ex"><b>Question 3.1 (three reactions):</b> identify by the conditions. Carbonyl with α-H + dilute base → <b>aldol condensation</b> (α,β-unsaturated product). Aldehyde with no α-H + hot conc. NaOH → <b>Cannizzaro</b> (alcohol + acid salt). Methyl ketone + I₂/NaOH → <b>haloform/iodoform</b> (CHI₃ + acid salt with one carbon fewer).</div>

<h4>6. Electrophilic substitution on aromatic aldehydes and ketones</h4>
<p>The –CHO and –COR groups have <b>−I and −M</b> effects: they withdraw electron density from the ring, making it <b>less reactive</b> (deactivating) and directing incoming electrophiles to the <b>meta</b> position.</p>
<h5>a. Preparing o-, m- and p-nitrobenzaldehyde from toluene</h5>
<ul>
<li><b>m-Nitrobenzaldehyde</b>: oxidise toluene to benzaldehyde first, then nitrate. The meta-directing CHO sends NO₂ to the meta position.</li>
<li><b>o- and p-Nitrobenzaldehyde</b>: nitrate toluene first. CH₃ is <b>ortho/para-directing</b> (activating), giving o- and p-nitrotoluene; then oxidise CH₃ to CHO.</li>
<li><b>Pure p-isomer</b>: separate o- and p-nitrotoluene (e.g. by fractional distillation or crystallisation) before the oxidation step.</li>
</ul>
<div class="pearl"><strong>Strategy:</strong> the order of steps decides the position. Put the group you want to direct with on first.</div>
<h5>b. Nitroacetophenones</h5>
<ul>
<li><b>Direct nitration</b> of acetophenone gives <b>m-nitroacetophenone</b> (COCH₃ is meta-directing).</li>
<li><b>Indirect method</b> for o- and p-: start from a compound with an o/p-director (e.g. ethylbenzene), nitrate, separate the isomers, then convert the side chain to COCH₃.</li>
</ul>

<h4>7. Carboxylic acids</h4>
<p>Carboxylic acids contain the <b>carboxyl group</b>, –COOH (–CO₂H): <b>R–COOH</b> or <b>Ar–COOH</b>. The name comes from <b>carb</b>onyl (C=O) + hydr<b>oxy</b> (OH). The carboxyl group is the parent of a large family of <b>carboxylic acid derivatives</b> (esters, acid chlorides, amides, anhydrides), all containing an acyl group.</p>
<h5>Common names</h5>
<ul>
<li>Acids with up to six carbons are often called by common names: <b>formic</b> (HCOOH), <b>acetic</b> (CH₃COOH), propionic, butyric…</li>
<li>Substituent positions are given by Greek letters: <b>α</b> = the carbon next to COOH, then <b>β, γ, δ</b>.</li>
</ul>
<h5>IUPAC names</h5>
<ul>
<li>The parent is the <b>longest chain containing COOH</b>.</li>
<li>Replace "-e" with <b>"-oic acid"</b>: methanoic acid, ethanoic acid…</li>
<li>The COOH carbon is <b>always C1</b>; substituents are numbered (note: IUPAC C2 = common α).</li>
<li>COOH attached directly to a ring: add <b>"carboxylic acid"</b> to the ring name (cyclohexanecarboxylic acid).</li>
<li>A phenyl ring <b>not</b> directly bearing the COOH is named as a <b>phenyl</b> substituent on the aliphatic acid (2-phenylpropanoic acid).</li>
</ul>
<div class="ex"><b>Question 3.2 answers explained:</b><br>
CH₃CH₂CH₂C(CH₃)₂CH₂COOH: 6-carbon chain, COOH = C1, two methyls on C3 → <b>3,3-dimethylhexanoic acid</b>.<br>
CH₃CH(Cl)CH₂CH₂COOH: 5 carbons, Cl on C4 → <b>4-chloropentanoic acid</b>.<br>
HOOC–CH₂–COOH: two COOH groups on a 3-carbon chain → <b>propanedioic acid</b> (malonic acid).<br>
Others on the slide: 4-isopropyl-6-methyloctanoic acid; <b>2-phenylpropanoic acid</b> (the ibuprofen skeleton); 2-(3-bromophenyl)acetic acid.</div>
<div class="ex"><b>Question 3.3 (drawing from names), method:</b> write the parent chain (e.g. "butanoic" = 4 carbons ending in COOH = C1), number from the COOH, then place substituents. 2-Bromobutanoic acid = CH₃CH₂CH(Br)COOH. 2,3-Dimethylpentanoic acid = CH₃CH₂CH(CH₃)CH(CH₃)COOH. 1-Isopropylcyclopentanecarboxylic acid = a cyclopentane carbon carrying both COOH and an isopropyl group.</div>

<h4>8. Naming esters</h4>
<p>An <b>ester</b> is a carboxylic acid in which the H of –COOH is replaced by an alkyl group (R–COO–R'). Name it from the acid and the alcohol it is made from:</p>
<ol>
<li>Find the –COO– group.</li>
<li>Identify the acid part and name it as an alkanoic acid; change <b>"-ic acid" to "-ate"</b>.</li>
<li>Name the alkyl group that replaced the H.</li>
<li>Write the <b>alkyl name first</b>, then the "-ate" name.</li>
</ol>
<div class="ex">Hexanoic acid + propanol → hexanoate + propyl → <b>propyl hexanoate</b>. CH₃COOCH₂CH₃ = ethyl ethanoate (ethyl acetate).</div>

<h4>9. Physical properties of carboxylic acids</h4>
<ul>
<li><b>High boiling points</b>: each molecule has two groups that can hydrogen-bond (C=O and O–H). Two molecules pair up as a <b>dimer</b>, held by <b>two hydrogen bonds</b> (the C=O oxygen of one to the O–H hydrogen of the other). This doubles the effective molecular size, so they boil higher than alcohols of similar mass.</li>
<li><b>Solubility</b>: polar, and able to hydrogen-bond with water. The <b>first four acids</b> (formic to butyric) are <b>completely miscible</b> with water; solubility <b>falls as the carbon chain grows</b>.</li>
</ul>

<p>محاضرة 3 بتكمّل تفاعلات الألدهيدات والكيتونات بعيلتين كمان: تفاعلات <b>الـ α-هيدروجين الحمضي</b> (aldol و Cannizzaro و haloform)، و<b>الاستبدال الإلكتروفيلي الأروماتي</b> على الكربونيلات الأروماتية. وبعدين بتبدأ <b>الأحماض الكربوكسيلية</b>: تسميتها، وتسمية الإسترات، وخواصها الفيزيائية.</p>

<h4>1. خريطة تفاعلات الكربونيل لحد دلوقتي</h4>
<ol>
<li><b>الإضافة النيوكليوفيلية</b>: الكحولات (acetals/ketals)، الـ HCN (cyanohydrins)، الجرينيارد (كحولات)، مشتقات الأمونيا (نواتج تكثيف).</li>
<li><b>الاختزال</b>: Clemmensen و Wolff–Kishner و metal hydrides.</li>
<li><b>تفاعلات الـ α-هيدروجين الحمضي</b>: aldol و Cannizzaro و haloform (المحاضرة دي).</li>
<li><b>الاستبدال الإلكتروفيلي (SEAr)</b> للألدهيدات والكيتونات الأروماتية (المحاضرة دي).</li>
</ol>
<div class="tblwrap"><table><tr><th></th><th>Racemic synthesis</th><th>Stereoselective</th></tr>
<tr><td>Substrate</td><td>Achiral (prochiral)</td><td>Chiral α-carbon</td></tr>
<tr><td>Attack</td><td>Equal 50:50</td><td>Unequal (Cram and Abdel-Hafez)</td></tr>
<tr><td>Products</td><td>Enantiomers, 50% R + 50% S</td><td>Diastereomers: threo major, erythro minor</td></tr>
<tr><td>Optical activity</td><td>Inactive, [α] = 0</td><td>Active</td></tr></table></div>
<p>يعني: في الـ <b>racemic</b> الجزيء مش كيرالي أصلًا، والهجوم من الوشين متساوي، فيطلع زوج enantiomers نص ونص وغير نشط ضوئيًا. وفي الـ <b>stereoselective</b> فيه α-carbon كيرالي، فالهجوم مش متساوي بسبب العوائق، ويطلع خليط diastereomers مش متساوي (threo أكتر و erythro أقل) ونشط ضوئيًا.</p>

<h4>2. ليه الـ α-هيدروجين حمضي؟</h4>
<p>الـ <b>α-carbon</b> هو الكربون اللي جنب الـ C=O على طول، والهيدروجينات اللي عليه اسمها <b>α-hydrogens</b>. القاعدة تقدر تشيل α-H لأن الشحنة السالبة اللي بتطلع (carbanion) <b>بتتثبّت</b> بالكربونيل بطريقتين:</p>
<ul>
<li><b>حثّي (−I)</b>: الـ C=O الساحب للإلكترونات بيسحب الكثافة من الـ α-carbon.</li>
<li><b>رنين</b>: الشحنة السالبة بتتوزع على الأكسجين. والأنيون المتثبّت بالرنين ده اسمه <b>enolate ion</b>.</li>
</ul>

<h4>3. Aldol condensation</h4>
<p>مركّبات الكربونيل <b>اللي فيها α-هيدروجين</b>، في <b>قاعدة قوية</b> (NaOH أو NaOEt)، بتتكثف وتعمل <b>ألدهيدات أو كيتونات α,β غير مشبعة</b>.</p>
<ol>
<li>القاعدة بتشيل α-proton فيتكون <b>enolate</b> متثبّت بالرنين.</li>
<li>الـ enolate (بيشتغل <b>نيوكليوفيل</b>) بيهاجم كربون الكربونيل في <b>جزيء تاني</b>.</li>
<li>الـ alkoxide الناتج بياخد <b>بروتون</b> فيطلع β-hydroxy carbonyl (الـ "aldol" = ألدهيد + كحول)، وبعدين <b>بيفقد ماء</b> (تكثيف) فتتكون C=C متقارنة مع C=O.</li>
</ol>
<div class="formula">2CH₃CHO → (NaOH) → CH₃CH(OH)CH₂CHO → (−H₂O) → CH₃CH=CHCHO</div>
<p>التفاعل ممكن يكمّل ويربط جزيئات كتير: الأسيتالدهيد مع 30% NaOH بيدي <b>راتنج أصفر</b>.</p>

<h4>4. تفاعل Cannizzaro (أكسدة واختزال ذاتي)</h4>
<ul>
<li>للألدهيدات <b>اللي مفيهاش α-هيدروجين</b> (ما تقدرش تعمل enolate، فما تعملش aldol): <b>الفورمالدهيد</b> و<b>البنزالدهيد</b>.</li>
<li>الظروف: <b>قلوي قوي سخن</b> (NaOH مركّز).</li>
<li>جزيئين بيتفاعلوا: <b>واحد بيتختزل لكحول</b>، و<b>التاني بيتأكسد لحمض كربوكسيلي</b> (في صورة ملح). جزيء ألدهيد بينقل hydride للتاني.</li>
</ul>
<div class="formula">2C₆H₅CHO + NaOH → C₆H₅CH₂OH + C₆H₅COONa</div>
<div class="pearl"><strong>قاعدة القرار:</strong> ألدهيد + قاعدة. فيه α-H؟ ← <b>aldol</b>. مفيش α-H؟ ← <b>Cannizzaro</b>.</div>

<h4>5. تفاعل Haloform (Iodoform)</h4>
<ul>
<li>أي مركّب فيه مجموعة <b>CH₃CO–</b> (methyl ketone)، لما يتعامل مع <b>I₂/NaOH</b> (أو Br₂/NaOH)، بيدي <b>haloform</b>: <b>CHI₃ (iodoform)</b> راسب أصفر، أو CHBr₃.</li>
<li>الميكانيزم: التلات α-هيدروجينات بتوع الـ CH₃ بيتبدّلوا بهالوجين واحد ورا التاني (كل استبدال بيسهّل اللي بعده)، فيطلع CX₃CO–R؛ وبعدين الهيدروكسيد بيقطع رابطة C–C فيطلع CHX₃ والـ carboxylate.</li>
<li>الناتج العضوي (<b>ملح الحمض</b>) فيه <b>كربون أقل بواحد</b> من المركّب الأصلي.</li>
</ul>
<div class="formula">CH₃COCH₃ + 3I₂ + 4NaOH → CHI₃↓ + CH₃COONa + 3NaI + 3H₂O</div>
<p>الراسب الأصفر للـ iodoform اختبار مشهور للـ methyl ketones (وللكحولات اللي بتتأكسد ليها).</p>
<div class="ex"><b>سؤال 3.1 (3 تفاعلات):</b> اعرفيهم من الظروف. كربونيل فيه α-H + قاعدة مخففة ← <b>aldol condensation</b> (ناتج α,β غير مشبع). ألدهيد مفيهوش α-H + NaOH مركّز سخن ← <b>Cannizzaro</b> (كحول + ملح حمض). methyl ketone + I₂/NaOH ← <b>haloform/iodoform</b> (CHI₃ + ملح حمض فيه كربون أقل).</div>

<h4>6. الاستبدال الإلكتروفيلي على الألدهيدات والكيتونات الأروماتية</h4>
<p>مجموعتين الـ CHO والـ COR ليهم تأثير <b>−I و −M</b>: بيسحبوا الإلكترونات من الحلقة فتبقى <b>أقل نشاطًا</b> (deactivating)، وبيوجّهوا الإلكتروفيل الداخل لمكان <b>meta</b>.</p>
<h5>أ. تحضير o و m و p-nitrobenzaldehyde من التولوين</h5>
<ul>
<li><b>m-Nitrobenzaldehyde</b>: نأكسد التولوين لبنزالدهيد الأول وبعدين نعمل نترة. الـ CHO بيوجّه meta فالـ NO₂ يروح meta.</li>
<li><b>o و p-Nitrobenzaldehyde</b>: نعمل نترة للتولوين الأول. الـ CH₃ <b>بيوجّه ortho/para</b> (منشّط)، فيطلع o و p-nitrotoluene؛ وبعدين نأكسد الـ CH₃ لـ CHO.</li>
<li><b>الـ p النقي</b>: نفصل o و p-nitrotoluene (بالتقطير التجزيئي أو البلورة) قبل خطوة الأكسدة.</li>
</ul>
<div class="pearl"><strong>الاستراتيجية:</strong> ترتيب الخطوات هو اللي بيحدد المكان. حطي المجموعة اللي عايزاها توجّه الأول.</div>
<h5>ب. النيترو أسيتوفينون</h5>
<ul>
<li><b>النترة المباشرة</b> للأسيتوفينون بتدي <b>m-nitroacetophenone</b> (الـ COCH₃ بيوجّه meta).</li>
<li><b>طريقة غير مباشرة</b> للـ o و p: نبدأ بمركّب فيه موجّه o/p (زي ethylbenzene)، ونعمل نترة، ونفصل الأيزومرات، وبعدين نحوّل السلسلة الجانبية لـ COCH₃.</li>
</ul>

<h4>7. الأحماض الكربوكسيلية</h4>
<p>الأحماض الكربوكسيلية فيها مجموعة <b>الكربوكسيل</b> COOH: <b>R–COOH</b> أو <b>Ar–COOH</b>. الاسم جاي من <b>كربونيل</b> (C=O) + <b>هيدروكسي</b> (OH). ومجموعة الكربوكسيل هي الأصل لعيلة كبيرة من <b>مشتقات الأحماض الكربوكسيلية</b> (إسترات، acid chlorides، أميدات، anhydrides)، كلها فيها مجموعة acyl.</p>
<h5>الأسماء الشائعة</h5>
<ul>
<li>الأحماض اللي فيها لحد 6 كربون غالبًا بتتسمى بأسماء شائعة: <b>formic</b> و<b>acetic</b> و propionic و butyric…</li>
<li>أماكن المجموعات بالحروف اليونانية: <b>α</b> = الكربون اللي جنب الـ COOH، وبعدين <b>β و γ و δ</b>.</li>
</ul>
<h5>أسماء IUPAC</h5>
<ul>
<li>الأساس هو <b>أطول سلسلة فيها COOH</b>.</li>
<li>نشيل "e" ونحط <b>"-oic acid"</b>: methanoic acid و ethanoic acid…</li>
<li>كربون الـ COOH <b>دايمًا رقم 1</b>، والمجموعات بتترقم (خلي بالك: C2 في IUPAC = α في الشائع).</li>
<li>لو COOH مربوطة مباشرة بحلقة: نضيف <b>"carboxylic acid"</b> لاسم الحلقة (cyclohexanecarboxylic acid).</li>
<li>لو حلقة فينيل <b>مش</b> شايلة الـ COOH مباشرة: بتتسمى مجموعة <b>phenyl</b> على الحمض الأليفاتي (2-phenylpropanoic acid).</li>
</ul>
<div class="ex"><b>شرح إجابات سؤال 3.2:</b><br>
CH₃CH₂CH₂C(CH₃)₂CH₂COOH: سلسلة 6 كربون، الـ COOH رقم 1، واتنين ميثيل على 3 ← <b>3,3-dimethylhexanoic acid</b>.<br>
CH₃CH(Cl)CH₂CH₂COOH: 5 كربون، والكلور على 4 ← <b>4-chloropentanoic acid</b>.<br>
HOOC–CH₂–COOH: مجموعتين COOH على سلسلة 3 كربون ← <b>propanedioic acid</b> (malonic acid).<br>
وباقي السلايد: 4-isopropyl-6-methyloctanoic acid؛ و<b>2-phenylpropanoic acid</b> (هيكل الإيبوبروفين)؛ و 2-(3-bromophenyl)acetic acid.</div>
<div class="ex"><b>سؤال 3.3 (الرسم من الاسم)، الطريقة:</b> اكتبي السلسلة الأساسية (زي "butanoic" = 4 كربون آخرهم COOH = رقم 1)، ورقّمي من عند الـ COOH، وحطي المجموعات. 2-Bromobutanoic acid = CH₃CH₂CH(Br)COOH. و 2,3-Dimethylpentanoic acid = CH₃CH₂CH(CH₃)CH(CH₃)COOH. و 1-Isopropylcyclopentanecarboxylic acid = كربون في حلقة سيكلوبنتان شايل COOH ومجموعة isopropyl مع بعض.</div>

<h4>8. تسمية الإسترات</h4>
<p>الـ <b>ester</b> هو حمض كربوكسيلي الـ H بتاع الـ COOH فيه اتبدّل بمجموعة ألكيل (R–COO–R'). بنسميه من الحمض والكحول اللي اتعمل منهم:</p>
<ol>
<li>دوّري على مجموعة –COO–.</li>
<li>حددي جزء الحمض وسمّيه alkanoic acid، وغيّري <b>"-ic acid" لـ "-ate"</b>.</li>
<li>سمّي مجموعة الألكيل اللي خدت مكان الـ H.</li>
<li>اكتبي <b>اسم الألكيل الأول</b>، وبعدين الاسم المنتهي بـ "-ate".</li>
</ol>
<div class="ex">hexanoic acid + propanol ← hexanoate + propyl ← <b>propyl hexanoate</b>. و CH₃COOCH₂CH₃ = ethyl ethanoate (ethyl acetate).</div>

<h4>9. الخواص الفيزيائية للأحماض الكربوكسيلية</h4>
<ul>
<li><b>درجات غليان عالية</b>: كل جزيء فيه مجموعتين يقدروا يعملوا روابط هيدروجينية (C=O و O–H). جزيئين بيتجمعوا على شكل <b>dimer</b> ماسكين في بعض بـ<b>رابطتين هيدروجين</b> (أكسجين الـ C=O في واحد مع هيدروجين الـ O–H في التاني). ده بيضاعف الحجم الفعلي، فبيغلوا أعلى من الكحولات اللي في نفس الوزن.</li>
<li><b>الذوبان</b>: قطبية وبتعمل روابط هيدروجينية مع الماء. <b>أول 4 أحماض</b> (من formic لـ butyric) <b>بتمتزج تمامًا</b> مع الماء، والذوبان <b>بيقل كل ما السلسلة تطول</b>.</li>
</ul>

DEEP.organic[4]={en:`
<p>Lecture 4 explains <b>why carboxylic acids are acidic</b> and how substituents make them stronger or weaker (a favourite exam topic), how to <b>prepare</b> them, and their five kinds of <b>reaction</b>, including converting them into acid chlorides, esters and amides. Several pharmaceutical examples show why this matters (diclofenac salts, salol, mandelic and salicylic acid).</p>

<h4>1. Why carboxylic acids are acidic</h4>
<p>Carboxylic acids are the most acidic compounds made only of C, H and O. Acidity depends on the stability of the <b>conjugate base</b>, the <b>carboxylate ion</b> RCOO⁻. The more stable the anion, the more readily the acid gives up H⁺, and the stronger the acid. The carboxylate is stabilised in two ways:</p>
<ol>
<li><b>Inductive (−I)</b>: the C=O pulls electron density away from the negatively charged oxygen.</li>
<li><b>Resonance (−M)</b>: the negative charge is <b>delocalised equally over two oxygen atoms</b>. Spreading a charge always stabilises it.</li>
</ol>
<p>Remember: <b>lower pKa = stronger acid</b>.</p>

<h4>2. Factors affecting the acidity of aliphatic acids</h4>
<h5>a. Hybridisation of the carbon next to COOH</h5>
<p>More <b>s-character</b> means the carbon holds electrons closer and is more electronegative, so it withdraws more from the carboxylate. Acidity: <b>sp (50% s) &gt; sp² (33%) &gt; sp³ (25%)</b>. So propynoic acid &gt; propenoic (acrylic) acid &gt; propanoic acid.</p>
<h5>b. Inductive effects of substituents</h5>
<ul>
<li><b>Electron-donating (+I) groups</b> (alkyl groups) push electrons onto the carboxylate, <b>destabilising</b> it, so the acid is <b>weaker</b>. The more and larger the alkyl groups, the weaker: HCOOH &gt; CH₃COOH &gt; CH₃CH₂COOH.</li>
<li><b>Electron-withdrawing (−I) groups</b> pull electron density away, <b>stabilising</b> the anion (and weakening the O–H bond), so the acid is <b>stronger</b>. Three rules:
<ol><li><b>More</b> EWGs → stronger: Cl₃CCOOH &gt; Cl₂CHCOOH &gt; ClCH₂COOH &gt; CH₃COOH.</li>
<li>A <b>more electronegative</b> EWG → stronger: F &gt; Cl &gt; Br &gt; I (FCH₂COOH is the strongest of the haloacetic acids).</li>
<li>The <b>closer</b> the EWG to COOH → stronger (the inductive effect fades quickly with distance): 2-chlorobutanoic &gt; 3-chloro &gt; 4-chloro.</li></ol></li>
</ul>
<div class="ex"><b>Question 4.1 reasoning:</b> F-substituted vs I-substituted acid → the <b>F</b> acid is stronger (F more electronegative). CH₃-substituted vs CN-substituted → the <b>CN</b> acid is stronger (CN is −I; CH₃ is +I and lowers acidity).</div>

<h4>3. Aromatic vs aliphatic acids</h4>
<p><b>Benzoic acid (pKa 4.2) is stronger than acetic acid (pKa 4.76).</b> Why?</p>
<ul>
<li>In acetic acid, the COOH is attached to an sp³ CH₃, which is <b>+I</b> (donating) and destabilises acetate.</li>
<li>In benzoic acid, the COOH is attached to an <b>sp²</b> ring carbon. The phenyl group has two effects: a <b>−I</b> effect (sp² carbon is more electronegative, stabilising the anion, increasing acidity) and a weak <b>+M</b> resonance donation into the COOH (decreasing acidity). The <b>−I effect dominates</b>, so the net result is a stronger acid.</li>
</ul>

<h4>4. Substituted benzoic acids</h4>
<h5>a. Electron-withdrawing groups (NO₂, CN, halogens)</h5>
<ul>
<li>They stabilise the carboxylate, so they <b>increase acidity</b>.</li>
<li>At the <b>para</b> position, a group like NO₂ acts by both −I and a strong <b>−M</b> (resonance) effect, so p-nitrobenzoic acid is <b>stronger</b> than the meta isomer.</li>
<li>At the <b>meta</b> position, resonance can't reach the carboxyl carbon, so only <b>−I</b> operates: weaker effect than para.</li>
</ul>
<h5>b. Electron-donating groups (OH, OCH₃)</h5>
<ul>
<li>They donate electron density to the carboxylate, so they <b>decrease acidity</b> (pKa rises above 4.2).</li>
<li>At <b>para</b>, the <b>+M</b> donation outweighs their −I, so p-methoxybenzoic acid is <b>weaker</b> than benzoic acid.</li>
<li>At <b>meta</b>, only the <b>−I</b> (oxygen is electronegative) acts, so the meta isomer is <b>more acidic</b> than the para isomer.</li>
</ul>
<div class="ex"><b>Question 4.2 reasoning:</b> m-NO₂ (−I only) vs p-NO₂ (−M &gt; −I) → <b>para is more acidic</b>. m-OCH₃ (−I, increases acidity) vs p-OCH₃ (+M, decreases acidity) → <b>meta is more acidic</b>.</div>
<h5>c. The ortho effect (steric inhibition of resonance)</h5>
<ul>
<li>In plain benzoic acid, the COOH lies in the plane of the ring, and the ring's weak +M donation slightly destabilises the carboxylate.</li>
<li>A group in the <b>ortho</b> position is bulky enough to <b>twist the COOH out of the ring's plane</b>. Its π bond is then perpendicular to the ring's π system, so there's <b>no resonance</b> between them.</li>
<li>Removing the ring's destabilising donation leaves the stabilising −I effect, so the acid becomes <b>stronger</b>.</li>
<li>Example: <b>o-toluic acid</b> (pKa 3.9) is stronger than benzoic acid (4.2), even though CH₃ is an electron-donating group.</li>
</ul>
<div class="pearl"><strong>Conclusion:</strong> an ortho substituent increases acidity, whether it is electron-donating or electron-withdrawing.</div>

<h4>5. Preparing carboxylic acids</h4>
<ol>
<li><b>Oxidation</b> of 1° alcohols or aldehydes with KMnO₄ (strong oxidant: goes all the way to COOH).</li>
<li><b>Grignard + CO₂</b> (carboxylation), then acid: R–MgX + CO₂ → R–COOH. The chain gains <b>one carbon</b>.</li>
<li><b>Acid-catalysed hydrolysis of nitriles</b>: R–C≡N + H₂O/H⁺ → R–COOH.</li>
</ol>
<p><b>Acetic acid in pharmacy:</b> antiseptic for superficial skin infections; <b>cervical cancer screening</b> (areas that turn white after application are positive); dilute 2–5% solutions as <b>ear drops</b> for external ear canal infections.</p>
<h5>Pharmaceutically important aromatic acids</h5>
<div class="tblwrap"><table><tr><th>Acid</th><th>Made from</th><th>Pharmaceutical use</th></tr>
<tr><td>Benzoic acid</td><td>Benzenesulfonic acid, benzene, or oxidation of toluene</td><td>Preservative (sodium benzoate in soft drinks); <b>antifungal</b> in ointments (ringworm, athlete's foot)</td></tr>
<tr><td>p-Toluic acid</td><td>From toluene (e.g. introduce a group para, then convert to COOH)</td><td>Precursor for anti-inflammatory and analgesic drugs; monomer for plastics and resins</td></tr>
<tr><td>Phenylacetic acid</td><td>Benzyl cyanide hydrolysis (or benzyl Grignard + CO₂)</td><td>Precursor of <b>diclofenac</b></td></tr>
<tr><td>Salicylic acid</td><td>Phenol (Kolbe-type carboxylation)</td><td>A <b>β-hydroxy acid (BHA)</b> used in skin products</td></tr></table></div>
<h5>Preparing esters</h5>
<ul>
<li><b>Acid chloride + alcohol</b> → ester (the best route).</li>
<li><b>Salol</b> (phenyl salicylate) is an ester used as an analgesic, antiseptic and antipyretic.</li>
</ul>

<h4>6. Reactions of carboxylic acids</h4>
<h5>1. Reduction</h5>
<p>Reduction (e.g. LiAlH₄) gives <b>primary alcohols</b> (or, under controlled conditions via derivatives, aldehydes).</p>
<h5>2. Reactions of the α-hydrogen: Hell–Volhard–Zelinsky (HVZ)</h5>
<ul>
<li>Acids with an α-hydrogen react with <b>Br₂ (or Cl₂) and phosphorus</b>, giving the <b>α-halo acid</b>.</li>
<li>Its value: the α-halogen can then be <b>replaced by nucleophiles</b>:
<ul><li>with OH⁻ → <b>α-hydroxy acids (AHAs)</b> (another route besides cyanohydrins from Lecture 2);</li>
<li>with NH₃ → <b>α-amino acids</b>.</li></ul></li>
</ul>
<h5>3. Reaction with bases (salt formation)</h5>
<p>RCOOH + NaOH → RCOO⁻Na⁺ + H₂O. Adding a strong acid (HCl) regenerates the acid. Salts are more water-soluble, which affects how quickly a drug dissolves and is absorbed.</p>
<div class="tblwrap"><table><tr><th>Diclofenac potassium</th><th>Diclofenac sodium</th></tr>
<tr><td>Higher water solubility</td><td>Lower water solubility</td></tr>
<tr><td>Faster absorption, quicker onset</td><td>Slower absorption, slower onset</td></tr>
<tr><td>Immediate-release tablets or powder for oral solution</td><td>Often delayed-release</td></tr>
<tr><td>Acute pain needing fast relief: migraine, dental pain, menstrual cramps, short-term post-operative pain</td><td>Chronic conditions needing steady blood levels: osteoarthritis, rheumatoid arthritis</td></tr></table></div>
<h5>4. Conversion into acid derivatives: nucleophilic acyl substitution</h5>
<p>A key contrast:</p>
<ul>
<li><b>Aldehydes and ketones</b> carry H or R on the carbonyl, which <b>can't leave</b>, so they undergo nucleophilic <b>addition</b>.</li>
<li><b>Acid chlorides, esters, amides</b> (and acids) carry a group that <b>can leave</b> (Cl, OR, NH₂, OH), so they undergo nucleophilic <b>substitution</b>.</li>
</ul>
<p><b>Mechanism (two steps):</b> (1) <b>addition</b>: the nucleophile adds to the carbonyl carbon, which becomes a tetrahedral sp³ intermediate; (2) <b>elimination</b>: the C=O π bond re-forms and the leaving group is expelled, returning to sp². Carboxylic acids do this only in their <b>acidic (un-ionised)</b> form.</p>
<p><b>Reactivity order:</b> acid chloride &gt; anhydride &gt; ester ≈ acid &gt; amide. It follows the leaving group: <b>weak bases are good leaving groups</b>. Cl⁻ is the weakest base, so acid chlorides are the most reactive; NH₂⁻ is a strong base, so amides are the least reactive.</p>
<ul>
<li><b>I. Acid chlorides</b>: made from the acid (with SOCl₂, PCl₃ or PCl₅) to <b>activate</b> it, because Cl⁻ is an excellent leaving group. They react with <b>alcohols → esters</b>, <b>ammonia/amines → amides</b>, <b>water → acid</b>, reduction (Rosenmund) → <b>aldehyde</b>, Grignard → <b>ketone</b> (and with more Grignard → 3° alcohol).</li>
<li><b>II. Esters (Fischer esterification)</b>: acid + alcohol with an acid catalyst. It is <b>reversible</b>, so use an excess of alcohol or acid (or remove water) to shift the equilibrium.</li>
<li><b>III. Amides</b>: acids don't react directly with amines by substitution. The amine, being a base, simply removes the acidic proton, forming an <b>ammonium carboxylate salt</b>. Heating that salt strongly can drive off water to give an amide, but this is a <b>poor method</b>. The good method is <b>acid chloride + amine</b>.</li>
</ul>
<h5>5. Electrophilic substitution (aromatic acids)</h5>
<p>COOH is <b>deactivating and meta-directing</b>, so nitrating benzoic acid gives m-nitrobenzoic acid. To make <b>o-nitrobenzoic acid</b>, nitrate <b>toluene</b> first (CH₃ directs o/p), separate the ortho isomer, then oxidise CH₃ to COOH.</p>

<p>محاضرة 4 بتشرح <b>ليه الأحماض الكربوكسيلية حمضية</b>، وإزاي المجموعات بتخليها أقوى أو أضعف (موضوع بيتسأل كتير)، وإزاي <b>نحضّرها</b>، وأنواع <b>تفاعلاتها</b> الخمسة، ومنها تحويلها لـ acid chlorides وإسترات وأميدات. وفيه أمثلة صيدلانية كتير بتوضح ليه ده مهم (أملاح الديكلوفيناك، والـ salol، وحمض المانديليك والساليسيليك).</p>

<h4>1. ليه الأحماض الكربوكسيلية حمضية؟</h4>
<p>الأحماض الكربوكسيلية هي أكتر مركّبات حمضية مكوّنة من C و H و O بس. الحمضية بتعتمد على ثبات <b>القاعدة المرافقة</b>، أيون <b>الكربوكسيلات</b> RCOO⁻. كل ما الأنيون يبقى أثبت، الحمض يسيب H⁺ أسهل ويبقى أقوى. والكربوكسيلات بيتثبّت بطريقتين:</p>
<ol>
<li><b>حثّي (−I)</b>: الـ C=O بيسحب الكثافة الإلكترونية من الأكسجين السالب.</li>
<li><b>رنين (−M)</b>: الشحنة السالبة <b>بتتوزع بالتساوي على ذرتين أكسجين</b>. وتوزيع الشحنة دايمًا بيثبّتها.</li>
</ol>
<p>افتكري: <b>pKa أقل = حمض أقوى</b>.</p>

<h4>2. العوامل اللي بتأثر على حمضية الأحماض الأليفاتية</h4>
<h5>أ. تهجين الكربون اللي جنب الـ COOH</h5>
<p>كل ما <b>صفة الـ s</b> تزيد، الكربون بيمسك الإلكترونات أقرب ويبقى سالبيته أعلى، فيسحب أكتر من الكربوكسيلات. الحمضية: <b>sp (50%) &gt; sp² (33%) &gt; sp³ (25%)</b>. يعني propynoic &gt; propenoic (acrylic) &gt; propanoic.</p>
<h5>ب. التأثير الحثّي للمجموعات</h5>
<ul>
<li><b>المجموعات المانحة (+I)</b> (الألكيل) بتزق إلكترونات على الكربوكسيلات فـ<b>تقلل ثباته</b>، فالحمض <b>يضعف</b>. كل ما الألكيل يكتر ويكبر يضعف أكتر: HCOOH &gt; CH₃COOH &gt; CH₃CH₂COOH.</li>
<li><b>المجموعات الساحبة (−I)</b> بتسحب الإلكترونات فـ<b>تثبّت</b> الأنيون (وتضعّف رابطة O–H)، فالحمض <b>يقوى</b>. 3 قواعد:
<ol><li><b>أكتر</b> مجموعات ساحبة ← أقوى: Cl₃CCOOH &gt; Cl₂CHCOOH &gt; ClCH₂COOH &gt; CH₃COOH.</li>
<li>مجموعة <b>سالبيتها أعلى</b> ← أقوى: F &gt; Cl &gt; Br &gt; I (الـ FCH₂COOH أقوى واحد).</li>
<li>المجموعة <b>أقرب</b> للـ COOH ← أقوى (التأثير الحثّي بيضعف بسرعة مع المسافة): 2-chlorobutanoic &gt; 3-chloro &gt; 4-chloro.</li></ol></li>
</ul>
<div class="ex"><b>منطق سؤال 4.1:</b> حمض عليه F مقابل حمض عليه I ← <b>الـ F أقوى</b> (سالبيته أعلى). حمض عليه CH₃ مقابل حمض عليه CN ← <b>الـ CN أقوى</b> (CN ساحب −I، والـ CH₃ مانح +I فبيقلل الحمضية).</div>

<h4>3. الأحماض الأروماتية مقابل الأليفاتية</h4>
<p><b>حمض البنزويك (pKa 4.2) أقوى من الأسيتيك (pKa 4.76).</b> ليه؟</p>
<ul>
<li>في الأسيتيك، الـ COOH مربوطة بـ CH₃ (sp³) وده <b>+I</b> (مانح) بيقلل ثبات الأسيتات.</li>
<li>في البنزويك، الـ COOH مربوطة بكربون حلقة <b>sp²</b>. الفينيل ليه تأثيرين: <b>−I</b> (كربون sp² سالبيته أعلى، بيثبّت الأنيون ويزوّد الحمضية)، و<b>+M</b> ضعيف بالرنين ناحية الـ COOH (بيقلل الحمضية). <b>الـ −I هو الغالب</b>، فالنتيجة حمض أقوى.</li>
</ul>

<h4>4. أحماض البنزويك المستبدلة</h4>
<h5>أ. المجموعات الساحبة (NO₂ و CN والهالوجينات)</h5>
<ul>
<li>بتثبّت الكربوكسيلات، فـ<b>بتزوّد الحمضية</b>.</li>
<li>في مكان <b>para</b>، مجموعة زي NO₂ بتأثر بـ −I ومعاه <b>−M</b> قوي (رنين)، فالـ p-nitrobenzoic <b>أقوى</b> من الـ meta.</li>
<li>في <b>meta</b>، الرنين ما بيوصلش لكربون الكربوكسيل، فبيشتغل <b>−I بس</b>: تأثير أضعف من para.</li>
</ul>
<h5>ب. المجموعات المانحة (OH و OCH₃)</h5>
<ul>
<li>بتدي إلكترونات للكربوكسيلات، فـ<b>بتقلل الحمضية</b> (الـ pKa يطلع فوق 4.2).</li>
<li>في <b>para</b>، الـ <b>+M</b> أقوى من الـ −I بتاعها، فالـ p-methoxybenzoic <b>أضعف</b> من البنزويك.</li>
<li>في <b>meta</b>، بيشتغل <b>−I بس</b> (الأكسجين سالبيته عالية)، فالـ meta <b>أكتر حمضية</b> من الـ para.</li>
</ul>
<div class="ex"><b>منطق سؤال 4.2:</b> m-NO₂ (−I بس) مقابل p-NO₂ (−M &gt; −I) ← <b>الـ para أكتر حمضية</b>. m-OCH₃ (−I بيزوّد الحمضية) مقابل p-OCH₃ (+M بيقللها) ← <b>الـ meta أكتر حمضية</b>.</div>
<h5>ج. تأثير الـ ortho (منع الرنين فراغيًا)</h5>
<ul>
<li>في البنزويك العادي، الـ COOH في نفس مستوى الحلقة، والـ +M الضعيف من الحلقة بيقلل ثبات الكربوكسيلات شوية.</li>
<li>مجموعة في مكان <b>ortho</b> حجمها كفاية إنها <b>تلف الـ COOH برّه مستوى الحلقة</b>. رابطة π بتاعتها تبقى عمودية على نظام π في الحلقة، فـ<b>مفيش رنين</b> بينهم.</li>
<li>لما التأثير المقلل للثبات يتشال، يفضل الـ −I المثبّت، فالحمض يبقى <b>أقوى</b>.</li>
<li>مثال: <b>o-toluic acid</b> (pKa 3.9) أقوى من البنزويك (4.2)، مع إن CH₃ مجموعة مانحة.</li>
</ul>
<div class="pearl"><strong>الخلاصة:</strong> أي مجموعة في مكان ortho بتزوّد الحمضية، سواء كانت مانحة أو ساحبة.</div>

<h4>5. تحضير الأحماض الكربوكسيلية</h4>
<ol>
<li><b>أكسدة</b> الكحولات الأولية أو الألدهيدات بـ KMnO₄ (مؤكسد قوي: بيكمّل لحد COOH).</li>
<li><b>Grignard + CO₂</b> (carboxylation)، وبعدين حمض: R–MgX + CO₂ ← R–COOH. السلسلة بتزيد <b>كربون واحد</b>.</li>
<li><b>تحلل النيتريلات بالحمض</b>: R–C≡N + H₂O/H⁺ ← R–COOH.</li>
</ol>
<p><b>حمض الأسيتيك في الصيدلة:</b> مطهر لعدوى الجلد السطحية؛ <b>فحص سرطان عنق الرحم</b> (الأماكن اللي بتبيضّ بعد ما يتحط بتبقى إيجابية)؛ ومحاليل مخففة 2–5% كـ<b>نقط ودن</b> لعدوى القناة الخارجية.</p>
<h5>أحماض أروماتية مهمة صيدلانيًا</h5>
<div class="tblwrap"><table><tr><th>Acid</th><th>Made from</th><th>Use</th></tr>
<tr><td>Benzoic acid</td><td>Benzenesulfonic acid, benzene, or toluene oxidation</td><td>Preservative (sodium benzoate); antifungal ointments</td></tr>
<tr><td>p-Toluic acid</td><td>From toluene</td><td>Precursor for anti-inflammatories and analgesics; plastics</td></tr>
<tr><td>Phenylacetic acid</td><td>Benzyl cyanide hydrolysis</td><td>Precursor of diclofenac</td></tr>
<tr><td>Salicylic acid</td><td>Phenol carboxylation</td><td>β-hydroxy acid (BHA) in skin products</td></tr></table></div>
<p>يعني: <b>البنزويك</b> مادة حافظة (بنزوات الصوديوم في المشروبات الغازية) ومضاد فطريات في المراهم (القوباء وقدم الرياضي). <b>الـ p-toluic</b> بيستخدم لتحضير مضادات الالتهاب والمسكنات. <b>الـ phenylacetic</b> لتحضير <b>الديكلوفيناك</b>. و<b>الساليسيليك</b> β-hydroxy acid في منتجات البشرة.</p>
<h5>تحضير الإسترات</h5>
<ul>
<li><b>acid chloride + كحول</b> ← إستر (أحسن طريقة).</li>
<li>الـ <b>Salol</b> (phenyl salicylate) إستر بيتستخدم مسكّن ومطهر وخافض للحرارة.</li>
</ul>

<h4>6. تفاعلات الأحماض الكربوكسيلية</h4>
<h5>1. الاختزال</h5>
<p>الاختزال (زي LiAlH₄) بيدي <b>كحولات أولية</b> (أو ألدهيدات في ظروف متحكَّم فيها عن طريق المشتقات).</p>
<h5>2. تفاعلات الـ α-هيدروجين: Hell–Volhard–Zelinsky (HVZ)</h5>
<ul>
<li>الأحماض اللي فيها α-هيدروجين بتتفاعل مع <b>Br₂ (أو Cl₂) وفوسفور</b>، فيطلع <b>α-halo acid</b>.</li>
<li>أهميته: الهالوجين اللي على α ممكن بعد كده <b>يتبدّل بنيوكليوفيلات</b>:
<ul><li>مع OH⁻ ← <b>α-hydroxy acids (AHAs)</b> (طريقة تانية غير الـ cyanohydrin في محاضرة 2)؛</li>
<li>مع NH₃ ← <b>أحماض أمينية α</b>.</li></ul></li>
</ul>
<h5>3. التفاعل مع القواعد (تكوين أملاح)</h5>
<p>RCOOH + NaOH ← RCOO⁻Na⁺ + H₂O. ولو ضفنا حمض قوي (HCl) الحمض يرجع. الأملاح بتدوب في الماء أكتر، وده بيأثر على سرعة ذوبان الدوا وامتصاصه.</p>
<div class="tblwrap"><table><tr><th>Diclofenac potassium</th><th>Diclofenac sodium</th></tr>
<tr><td>Higher water solubility</td><td>Lower water solubility</td></tr>
<tr><td>Faster absorption and onset</td><td>Slower absorption and onset</td></tr>
<tr><td>Immediate-release or oral powder</td><td>Often delayed-release</td></tr>
<tr><td>Acute pain: migraine, dental, menstrual, post-operative</td><td>Chronic: osteoarthritis, rheumatoid arthritis</td></tr></table></div>
<p>يعني <b>ديكلوفيناك البوتاسيوم</b> بيدوب أكتر ويتمتص أسرع، فمناسب للألم الحاد اللي محتاج راحة سريعة (الصداع النصفي، ألم الأسنان، تقلصات الدورة، الألم بعد العمليات). و<b>ديكلوفيناك الصوديوم</b> أبطأ، فمناسب للحالات المزمنة اللي محتاجة مستوى ثابت في الدم (خشونة المفاصل والروماتويد).</p>
<h5>4. التحويل لمشتقات الأحماض: Nucleophilic acyl substitution</h5>
<p>مقارنة مهمة:</p>
<ul>
<li><b>الألدهيدات والكيتونات</b> شايلة H أو R على الكربونيل، ودول <b>ما بيسيبوش المكان</b>، فبيعملوا <b>إضافة</b> نيوكليوفيلية.</li>
<li><b>الـ acid chlorides والإسترات والأميدات</b> (والأحماض) شايلة مجموعة <b>تقدر تمشي</b> (Cl و OR و NH₂ و OH)، فبيعملوا <b>استبدال</b> نيوكليوفيلي.</li>
</ul>
<p><b>الميكانيزم (خطوتين):</b> (1) <b>إضافة</b>: النيوكليوفيل بيضاف لكربون الكربونيل فيبقى وسيط رباعي sp³؛ (2) <b>حذف</b>: رابطة π بتاعة C=O بترجع والمجموعة المغادرة بتطلع، فيرجع sp². والأحماض الكربوكسيلية بتعمل ده بس وهي في صورتها <b>الحمضية (مش متأينة)</b>.</p>
<p><b>ترتيب النشاط:</b> acid chloride &gt; anhydride &gt; ester ≈ acid &gt; amide. وده ماشي حسب المجموعة المغادرة: <b>القواعد الضعيفة مجموعات مغادرة كويسة</b>. الـ Cl⁻ أضعف قاعدة فالـ acid chlorides الأنشط، والـ NH₂⁻ قاعدة قوية فالأميدات الأقل نشاطًا.</p>
<ul>
<li><b>I. الـ Acid chlorides</b>: بنعملها من الحمض (بـ SOCl₂ أو PCl₃ أو PCl₅) عشان <b>ننشّطه</b>، لأن Cl⁻ مجموعة مغادرة ممتازة. وبتتفاعل مع <b>الكحولات ← إسترات</b>، و<b>الأمونيا/الأمينات ← أميدات</b>، و<b>الماء ← حمض</b>، والاختزال (Rosenmund) ← <b>ألدهيد</b>، والجرينيارد ← <b>كيتون</b> (ومع جرينيارد زيادة ← كحول ثالثي).</li>
<li><b>II. الإسترات (Fischer esterification)</b>: حمض + كحول مع عامل حفاز حمضي. التفاعل <b>عكسي</b>، فنستخدم زيادة من الكحول أو الحمض (أو نشيل الماء) عشان نزق التوازن.</li>
<li><b>III. الأميدات</b>: الأحماض ما بتتفاعلش مباشرة مع الأمينات بالاستبدال. الأمين، عشان هو قاعدة، بيشيل البروتون الحمضي بس ويعمل <b>ملح ammonium carboxylate</b>. التسخين الشديد للملح ده ممكن يطلّع ماء ويدي أميد، بس دي <b>طريقة ضعيفة</b>. الطريقة الكويسة <b>acid chloride + أمين</b>.</li>
</ul>
<h5>5. الاستبدال الإلكتروفيلي (الأحماض الأروماتية)</h5>
<p>الـ COOH <b>بيقلل النشاط وبيوجّه meta</b>، فنترة البنزويك بتدي m-nitrobenzoic acid. عشان نعمل <b>o-nitrobenzoic acid</b>، نعمل نترة لـ<b>التولوين</b> الأول (الـ CH₃ بيوجّه o/p)، ونفصل الـ ortho، وبعدين نأكسد الـ CH₃ لـ COOH.</p>

DEEP.organic[5]={en:`
<p>Lecture 5 switches from reactions to <b>3D shape</b>. A molecule with single bonds is constantly twisting into different shapes, called <b>conformations</b>. This lecture explains which shapes are most stable and why, applies the ideas to open chains (butane, ethylene glycol), and then to the most important ring in drug molecules: <b>cyclohexane</b>, with its chair and boat forms, axial and equatorial positions, ring flips and substituted rings.</p>

<h4>1. Where conformations fit in</h4>
<p>Organic compounds are <b>acyclic</b> (open-chain, aliphatic) or <b>cyclic</b>. Cyclic compounds are <b>homocyclic</b> (ring of only carbon) or <b>heterocyclic</b> (Lecture 6); each can be <b>alicyclic</b> (like cycloalkanes) or <b>aromatic</b>.</p>
<p>Isomers have the same molecular formula. They divide into:</p>
<ul>
<li><b>Constitutional isomers</b>: different connectivity (different bonding order).</li>
<li><b>Stereoisomers</b>: same connectivity, different spatial arrangement. By energy barrier these are:
<ul><li><b>Configurational</b> isomers (high barrier: you must break bonds to interconvert, e.g. R/S, cis/trans);</li>
<li><b>Conformational</b> isomers (low barrier: interconvert simply by rotation).</li></ul></li>
</ul>

<h4>2. Conformational isomers</h4>
<ul>
<li>Separated by a <b>low energy barrier</b>, so they interconvert at room temperature by <b>rotation about single bonds</b> or by <b>ring flipping</b>, without changing constitution or configuration.</li>
<li>They are all the <b>same molecule</b>; the forms are called conformations, rotamers or <b>conformers</b>.</li>
<li>Two basic types: <b>eclipsed</b> (total or partial: bonds on neighbouring carbons line up) and <b>staggered</b> (anti or gauche: bonds offset).</li>
</ul>
<h5>What raises or lowers a conformer's energy</h5>
<ul>
<li><b>Torsional (eclipsing) strain</b>: repulsion between electron clouds of bonds that are eclipsed on adjacent carbons.</li>
<li><b>Steric strain</b>: atoms or groups forced too close together, even if not directly bonded.</li>
<li><b>Dipole–dipole interactions</b>.</li>
<li><b>Hydrogen bonding</b> (can stabilise a conformer).</li>
</ul>
<h5>Butane (and 1,2-dichloroethane)</h5>
<p>Looking along the central C2–C3 bond, stability order:</p>
<div class="formula">anti (staggered, CH₃ groups 180°) &gt; gauche (staggered, 60°) &gt; partially eclipsed &gt; fully eclipsed (CH₃ on CH₃)</div>
<p>Anti is best because the two big methyl groups are as far apart as possible. Fully eclipsed is worst because it has both torsional strain and the methyls bumping (steric strain).</p>
<h5>The exception: intramolecular hydrogen bonding</h5>
<p>In <b>ethylene glycol</b> (HOCH₂CH₂OH), <b>ethanolamine</b> (HOCH₂CH₂NH₂) and <b>ethylenediamine</b>, the most stable conformer is <b>gauche</b> (60°), not anti. In the gauche form the two groups are close enough to form an <b>intramolecular hydrogen bond</b>, which outweighs the small steric cost.</p>

<h4>3. Why cyclohexane isn't flat</h4>
<p>If cyclohexane were a flat hexagon, every C–C–C angle would be <b>120°</b>, but sp³ carbon prefers <b>109.5°</b>. That mismatch (angle strain), plus every C–H eclipsed, would make a planar ring unstable. So the ring <b>puckers</b> into non-planar shapes: the <b>chair</b> and the <b>boat</b>.</p>

<h4>4. Chair vs boat</h4>
<h5>Boat conformation: less stable</h5>
<ul>
<li><b>Torsional strain</b>: four pairs of <b>eclipsed hydrogens</b> along the C2–C3 and C5–C6 bonds.</li>
<li><b>Steric strain</b>: the two "flagpole" hydrogens on C1 and C4 point toward each other across the ring (<b>flagpole</b> or trans-annular interaction).</li>
</ul>
<h5>Chair conformation: the most stable</h5>
<ul>
<li>All C–C–C angles are <b>109.5°</b> (no angle strain).</li>
<li>All C–H bonds on adjacent carbons are <b>staggered</b> (no torsional strain); a Newman projection shows anti/gauche arrangements.</li>
<li>No flagpole clash (no steric strain).</li>
</ul>
<p>Cyclohexane and its derivatives almost always exist in the chair form.</p>
<div class="tblwrap"><table><tr><th>Strain</th><th>Chair</th><th>Boat</th></tr>
<tr><td>Angle strain</td><td>None (109.5°)</td><td>None (109.5°)</td></tr>
<tr><td>Torsional strain</td><td>None (staggered)</td><td>Present (eclipsed H at C2–C3, C5–C6)</td></tr>
<tr><td>Steric strain</td><td>None</td><td>Flagpole interactions at C1, C4</td></tr>
<tr><td>Result</td><td><b>Most stable</b></td><td>Less stable</td></tr></table></div>

<h4>5. Axial and equatorial positions</h4>
<p>Each carbon in a chair has two hydrogens in different positions:</p>
<ul>
<li><b>Axial</b>: six bonds, one per carbon, <b>parallel to the ring's axis</b>, alternating <b>up, down, up, down</b> around the ring.</li>
<li><b>Equatorial</b>: six bonds pointing <b>outward around the "equator"</b>, roughly in the ring's plane, in three sets of two parallel lines.</li>
</ul>
<div class="ex"><b>Drawing tip:</b> draw the chair as two parallel lines offset like a lounge chair. Axial bonds are straight up or down (up on the "up" carbons, down on the "down" carbons). Each equatorial bond is parallel to the ring bonds one carbon away.</div>

<h4>6. The ring flip</h4>
<ul>
<li>One chair can flip into the other chair (passing through boat-like shapes).</li>
<li>After a ring flip, <b>every axial bond becomes equatorial and every equatorial bond becomes axial</b>.</li>
<li>For unsubstituted cyclohexane, the two chairs are <b>identical in energy</b>.</li>
<li><b>Up stays up and down stays down</b>: a group on a wedge (above the ring) stays above the ring, even though it switches between axial and equatorial. A flip changes conformation, not configuration.</li>
</ul>

<h4>7. Monosubstituted cyclohexanes</h4>
<p>A substituent prefers the <b>equatorial</b> position. Why? The three axial positions on the <b>same side</b> of the ring are parallel and close together. An axial substituent bumps into the two other axial hydrogens on that face (on carbons 3 and 5 relative to it). These clashes are <b>1,3-diaxial interactions</b>. In the equatorial position the group points away from the ring and avoids them.</p>
<div class="tblwrap"><table><tr><th>Compound</th><th>Equatorial conformer</th><th>Axial conformer</th></tr>
<tr><td>Fluorocyclohexane (small F)</td><td>60%</td><td>40%</td></tr>
<tr><td>Methylcyclohexane</td><td>95%</td><td>5%</td></tr>
<tr><td>t-Butylcyclohexane (very bulky)</td><td>99.99%</td><td>0.01%</td></tr></table></div>
<p><b>The larger the substituent, the more strongly the equatorial conformer is favoured.</b> A t-butyl group effectively "locks" the ring.</p>

<h4>8. Disubstituted cyclohexanes</h4>
<h5>Two groups on the same carbon: 1-fluoro-1-methylcyclohexane</h5>
<p>One group must be axial and the other equatorial. CH₃ is much bulkier than F, so the favoured chair has <b>CH₃ equatorial and F axial</b>, minimising 1,3-diaxial strain. (Likewise, in 1-t-butyl-1-methylcyclohexane, t-butyl goes equatorial.)</p>
<h5>Groups on different carbons: cis/trans</h5>
<p><b>Cis</b> = both groups on the same face (both up or both down); <b>trans</b> = opposite faces. Then ask which chair puts more (or the bigger) groups equatorial.</p>
<ul>
<li><b>trans-1,4-Dimethylcyclohexane</b>: one chair has <b>both CH₃ equatorial</b> (very stable); the flipped chair has both axial, with four 1,3-diaxial interactions. The diequatorial chair dominates.</li>
<li><b>trans-1,2-Dimethylcyclohexane</b>: the diequatorial chair has only <b>one gauche interaction</b> between the methyls (≈ 3.8 kJ/mol), so it is <b>more stable</b>. The diaxial chair has four CH₃–H 1,3-diaxial interactions (≈ 15.2 kJ/mol).</li>
<li><b>cis-1,2-Dimethylcyclohexane</b>: one CH₃ is always axial and one equatorial; the two chairs are equal in energy.</li>
</ul>
<div class="pearl"><strong>Rule for the most stable chair:</strong> put as many substituents as possible equatorial; if you can't have them all, put the <b>largest</b> one equatorial.</div>
`,ar:`
<p>محاضرة 5 بتنقل من التفاعلات لـ<b>الشكل التلاتي الأبعاد</b>. الجزيء اللي فيه روابط أحادية بيلف باستمرار في أشكال مختلفة اسمها <b>conformations</b>. المحاضرة بتشرح أنهي شكل أثبت وليه، وبتطبّق ده على السلاسل المفتوحة (البيوتان والإيثيلين جليكول)، وبعدين على أهم حلقة في جزيئات الأدوية: <b>السيكلوهكسان</b> بشكل الـ chair والـ boat، والأماكن axial و equatorial، وقلب الحلقة، والحلقات المستبدلة.</p>

<h4>1. الـ conformations مكانها فين؟</h4>
<p>المركّبات العضوية يا <b>غير حلقية</b> (سلسلة مفتوحة، أليفاتية) يا <b>حلقية</b>. والحلقية يا <b>homocyclic</b> (الحلقة كلها كربون) يا <b>heterocyclic</b> (محاضرة 6)، وكل واحدة ممكن تكون <b>alicyclic</b> (زي السيكلوألكانات) أو <b>أروماتية</b>.</p>
<p>الأيزومرات ليها نفس الصيغة الجزيئية، وبتتقسم:</p>
<ul>
<li><b>Constitutional isomers</b>: ترتيب الروابط مختلف.</li>
<li><b>Stereoisomers</b>: نفس ترتيب الروابط بس الترتيب في الفراغ مختلف. وحسب حاجز الطاقة:
<ul><li><b>Configurational</b> (حاجز عالي: لازم نكسر روابط عشان يتحولوا، زي R/S و cis/trans)؛</li>
<li><b>Conformational</b> (حاجز واطي: بيتحولوا بالدوران بس).</li></ul></li>
</ul>

<h4>2. الـ Conformational isomers</h4>
<ul>
<li>بينهم <b>حاجز طاقة واطي</b>، فبيتحولوا لبعض في درجة حرارة الغرفة بـ<b>الدوران حوالين الروابط الأحادية</b> أو بـ<b>قلب الحلقة</b>، من غير ما ترتيب الروابط أو الـ configuration يتغير.</li>
<li>كلهم <b>نفس الجزيء</b>، والأشكال اسمها conformations أو rotamers أو <b>conformers</b>.</li>
<li>نوعين أساسيين: <b>eclipsed</b> (كلي أو جزئي: الروابط على الكربونات الجنب بعض فوق بعض) و<b>staggered</b> (anti أو gauche: الروابط مزاحة).</li>
</ul>
<h5>إيه اللي بيرفع أو يقلل طاقة الـ conformer؟</h5>
<ul>
<li><b>Torsional (eclipsing) strain</b>: تنافر بين سحب الإلكترونات بتاعة الروابط اللي فوق بعض على كربونات جنب بعض.</li>
<li><b>Steric strain</b>: ذرات أو مجموعات متزنقة قريب من بعض، حتى لو مش مربوطين ببعض مباشرة.</li>
<li><b>تفاعلات dipole–dipole</b>.</li>
<li><b>الرابطة الهيدروجينية</b> (ممكن تثبّت conformer).</li>
</ul>
<h5>البيوتان (و 1,2-dichloroethane)</h5>
<p>لو بصينا على الرابطة النص C2–C3، ترتيب الثبات:</p>
<div class="formula">anti (180°) &gt; gauche (60°) &gt; partially eclipsed &gt; fully eclipsed</div>
<p>الـ anti الأحسن لأن مجموعتين الميثيل الكبار أبعد ما يمكن عن بعض. والـ fully eclipsed الأوحش لأن فيه torsional strain ومعاه الميثيلين بيخبطوا في بعض (steric strain).</p>
<h5>الاستثناء: الرابطة الهيدروجينية الداخلية</h5>
<p>في <b>الإيثيلين جليكول</b> (HOCH₂CH₂OH) و<b>الإيثانولامين</b> (HOCH₂CH₂NH₂) و<b>الإيثيلين داي أمين</b>، الـ conformer الأثبت هو <b>gauche</b> (60°) مش anti. في الـ gauche المجموعتين قريبين كفاية يعملوا <b>رابطة هيدروجينية داخلية</b>، وده بيغلب التكلفة الفراغية الصغيرة.</p>

<h4>3. ليه السيكلوهكسان مش مسطح؟</h4>
<p>لو السيكلوهكسان كان سداسي مسطح، كل زاوية C–C–C هتبقى <b>120°</b>، والكربون sp³ بيحب <b>109.5°</b>. الفرق ده (angle strain)، ومعاه كل C–H يبقى eclipsed، هيخلي الحلقة المسطحة مش ثابتة. فالحلقة <b>بتتكرمش</b> في أشكال مش مسطحة: الـ <b>chair</b> والـ <b>boat</b>.</p>

<h4>4. Chair مقابل Boat</h4>
<h5>الـ Boat: أقل ثباتًا</h5>
<ul>
<li><b>Torsional strain</b>: 4 أزواج من <b>الهيدروجينات eclipsed</b> على الروابط C2–C3 و C5–C6.</li>
<li><b>Steric strain</b>: الهيدروجينين "flagpole" على C1 و C4 بيبصوا لبعض عبر الحلقة (تفاعل <b>flagpole</b>).</li>
</ul>
<h5>الـ Chair: الأثبت</h5>
<ul>
<li>كل زوايا C–C–C <b>109.5°</b> (مفيش angle strain).</li>
<li>كل روابط C–H على الكربونات الجنب بعض <b>staggered</b> (مفيش torsional strain)، وإسقاط Newman بيوضح ترتيبات anti/gauche.</li>
<li>مفيش flagpole (مفيش steric strain).</li>
</ul>
<p>السيكلوهكسان ومشتقاته تقريبًا دايمًا في شكل الـ chair.</p>
<div class="tblwrap"><table><tr><th>Strain</th><th>Chair</th><th>Boat</th></tr>
<tr><td>Angle</td><td>None</td><td>None</td></tr>
<tr><td>Torsional</td><td>None</td><td>Present</td></tr>
<tr><td>Steric</td><td>None</td><td>Flagpole at C1, C4</td></tr>
<tr><td>Result</td><td>Most stable</td><td>Less stable</td></tr></table></div>

<h4>5. أماكن Axial و Equatorial</h4>
<p>كل كربون في الـ chair عليه هيدروجينين في مكانين مختلفين:</p>
<ul>
<li><b>Axial</b>: 6 روابط، واحدة على كل كربون، <b>موازية لمحور الحلقة</b>، وبتتبادل <b>فوق، تحت، فوق، تحت</b> حوالين الحلقة.</li>
<li><b>Equatorial</b>: 6 روابط <b>بتبص لبرّه حوالين "خط الاستوا"</b>، تقريبًا في مستوى الحلقة، في 3 مجموعات كل واحدة خطين متوازيين.</li>
</ul>
<div class="ex"><b>نصيحة للرسم:</b> ارسمي الـ chair خطين متوازيين مزاحين زي كرسي الشاطئ. الروابط الـ axial رأسية لفوق أو لتحت (لفوق على الكربونات "الطالعة" ولتحت على "النازلة"). وكل رابطة equatorial موازية لروابط الحلقة اللي بعدها بكربون.</div>

<h4>6. قلب الحلقة (Ring flip)</h4>
<ul>
<li>الـ chair ممكن تنقلب للـ chair التانية (وبتعدّي على أشكال شبه الـ boat).</li>
<li>بعد القلب <b>كل رابطة axial بتبقى equatorial وكل equatorial بتبقى axial</b>.</li>
<li>في السيكلوهكسان من غير مجموعات، الـ chairs الاتنين <b>نفس الطاقة</b>.</li>
<li><b>اللي فوق يفضل فوق واللي تحت يفضل تحت</b>: المجموعة اللي على wedge (فوق الحلقة) تفضل فوق الحلقة حتى لو اتنقلت بين axial و equatorial. القلب بيغيّر الـ conformation مش الـ configuration.</li>
</ul>

<h4>7. السيكلوهكسان أحادي الاستبدال</h4>
<p>المجموعة بتفضّل مكان <b>equatorial</b>. ليه؟ أماكن الـ axial التلاتة على <b>نفس الناحية</b> من الحلقة موازية لبعض وقريبة من بعض. المجموعة لو axial بتخبط في الهيدروجينين الـ axial التانيين على نفس الوش (على الكربون 3 و 5 بالنسبة ليها). الاحتكاكات دي اسمها <b>1,3-diaxial interactions</b>. وفي الـ equatorial المجموعة بتبص بعيد عن الحلقة وبتتجنبها.</p>
<div class="tblwrap"><table><tr><th>Compound</th><th>Equatorial</th><th>Axial</th></tr>
<tr><td>Fluorocyclohexane</td><td>60%</td><td>40%</td></tr>
<tr><td>Methylcyclohexane</td><td>95%</td><td>5%</td></tr>
<tr><td>t-Butylcyclohexane</td><td>99.99%</td><td>0.01%</td></tr></table></div>
<p><b>كل ما المجموعة تكبر، الـ equatorial بيتفضّل أكتر.</b> ومجموعة t-butyl عمليًا بـ"تقفل" الحلقة.</p>

<h4>8. السيكلوهكسان ثنائي الاستبدال</h4>
<h5>مجموعتين على نفس الكربون: 1-fluoro-1-methylcyclohexane</h5>
<p>لازم واحدة axial والتانية equatorial. الـ CH₃ أكبر بكتير من الـ F، فالـ chair المفضّلة فيها <b>CH₃ equatorial و F axial</b>، عشان نقلل الـ 1,3-diaxial. (وبنفس الشكل في 1-t-butyl-1-methylcyclohexane، الـ t-butyl بتروح equatorial.)</p>
<h5>مجموعات على كربونات مختلفة: cis/trans</h5>
<p><b>Cis</b> = المجموعتين على نفس الوش (الاتنين فوق أو الاتنين تحت)؛ و<b>trans</b> = على وشين مختلفين. وبعدين نسأل: أنهي chair بتحط مجموعات أكتر (أو الأكبر) equatorial؟</p>
<ul>
<li><b>trans-1,4-Dimethylcyclohexane</b>: chair فيها <b>الميثيلين equatorial</b> (ثابتة جدًا)، والمقلوبة فيها الاتنين axial ومعاها 4 تفاعلات 1,3-diaxial. فالـ diequatorial هي الغالبة.</li>
<li><b>trans-1,2-Dimethylcyclohexane</b>: الـ diequatorial فيها <b>تفاعل gauche واحد</b> بس بين الميثيلين (حوالي 3.8 kJ/mol)، فهي <b>الأثبت</b>. والـ diaxial فيها 4 تفاعلات CH₃–H من نوع 1,3-diaxial (حوالي 15.2 kJ/mol).</li>
<li><b>cis-1,2-Dimethylcyclohexane</b>: ميثيل واحد دايمًا axial والتاني equatorial، فالـ chairs الاتنين نفس الطاقة.</li>
</ul>
<div class="pearl"><strong>قاعدة الـ chair الأثبت:</strong> حطي أكبر عدد ممكن من المجموعات equatorial؛ ولو مش هينفع كلهم، حطي <b>الأكبر</b> فيهم equatorial.</div>

DEEP.organic[6]={en:`
<p>Lecture 6 opens the second half of the course: <b>heterocyclic compounds</b>. Most drugs contain at least one heterocyclic ring, so you must be able to recognise and <b>name</b> them, by both <b>trivial (common) names</b> and the <b>systematic Hantzsch–Widman (IUPAC)</b> method, including numbering and partially saturated rings.</p>

<h4>1. What a heterocycle is and why it matters</h4>
<p>A <b>heterocyclic compound</b> has a ring made of carbon atoms <b>plus at least one other element</b> (a <b>heteroatom</b>): N, O, S, and also Si, B, P and others.</p>
<ul>
<li>All <b>nucleic acids</b> contain heterocycles (the purine and pyrimidine bases).</li>
<li>Many <b>natural flavours</b> and alkaloids (morphine, nicotine).</li>
<li>Most <b>drugs</b>: about <b>59% of US FDA-approved drugs contain nitrogen heterocycles</b>, because they improve the drug's <b>solubility</b> and <b>selectivity</b> (N can hydrogen-bond and be protonated).</li>
</ul>
<p>In the classification from Lecture 5, cyclic compounds are homocyclic or <b>heterocyclic</b>, and heterocycles can be <b>alicyclic</b> (saturated, like piperidine) or <b>aromatic</b> (like pyridine).</p>

<h4>2. Two naming systems</h4>
<ol>
<li><b>Trivial (common) names</b>: give little or no structural information, but are still very widely used (pyridine, furan, imidazole).</li>
<li><b>IUPAC systematic (Hantzsch–Widman) names</b>: built from rules, so you can work out the structure from the name.</li>
</ol>

<h4>3. Trivial names to know</h4>
<h5>Five-membered rings with one or two heteroatoms</h5>
<div class="tblwrap"><table><tr><th>Name</th><th>Heteroatom(s)</th></tr>
<tr><td>Pyrrole</td><td>1 N</td></tr><tr><td>Furan</td><td>1 O</td></tr><tr><td>Thiophene</td><td>1 S</td></tr>
<tr><td>Imidazole</td><td>2 N (1,3 positions)</td></tr><tr><td>Pyrazole</td><td>2 N (1,2 positions)</td></tr>
<tr><td>Oxazole</td><td>O and N (1,3)</td></tr><tr><td>Thiazole</td><td>S and N (1,3)</td></tr></table></div>
<p>The nitrogen-containing five-membered aromatics are called <b>azoles</b>.</p>
<h5>Six-membered rings with one or two heteroatoms (azines)</h5>
<div class="tblwrap"><table><tr><th>Name</th><th>Nitrogens</th></tr>
<tr><td>Pyridine</td><td>1 N</td></tr><tr><td>Pyridazine</td><td>2 N at 1,2</td></tr>
<tr><td>Pyrimidine</td><td>2 N at 1,3</td></tr><tr><td>Pyrazine</td><td>2 N at 1,4</td></tr></table></div>
<h5>Saturated heterocycles</h5>
<p>Fully saturated rings also have trivial names, e.g. <b>pyrrolidine</b> (saturated pyrrole), <b>piperidine</b> (saturated pyridine), <b>tetrahydrofuran</b>, <b>piperazine</b>, <b>morpholine</b>.</p>

<h4>4. The Hantzsch–Widman system: Prefix + Stem + Suffix</h4>
<div class="formula">IUPAC name = PREFIX (heteroatom: type, number, position) + STEM (ring size) + SUFFIX (saturated or unsaturated; N present or not)</div>
<h5>The prefix: which heteroatom</h5>
<div class="tblwrap"><table><tr><th>Atom</th><th>Prefix</th><th>Priority</th></tr>
<tr><td>O</td><td><b>oxa</b></td><td>Highest</td></tr><tr><td>S</td><td><b>thia</b></td><td>↓</td></tr><tr><td>N</td><td><b>aza</b></td><td>↓</td></tr><tr><td>P</td><td>phospha</td><td>Lowest of these</td></tr></table></div>
<ul>
<li>If there are <b>different</b> heteroatoms, list them in <b>priority order</b> (O before S before N), each with its position number.</li>
<li>If there are <b>several of the same</b> heteroatom, use <b>di-, tri-, tetra-</b> (e.g. 1,3-diaza).</li>
<li>When a prefix ending in "a" meets a stem starting with a vowel, the "a" is dropped (oxa + irane → oxirane).</li>
</ul>
<h5>Stem and suffix: ring size and saturation</h5>
<div class="tblwrap"><table><tr><th>Ring size</th><th>Stem</th><th>N present: unsaturated</th><th>N present: saturated</th><th>No N: unsaturated</th><th>No N: saturated</th></tr>
<tr><td>3</td><td>ir</td><td>-irine</td><td>-iridine</td><td>-irene</td><td>-irane</td></tr>
<tr><td>4</td><td>et</td><td>-ete</td><td>-etidine</td><td>-ete</td><td>-etane</td></tr>
<tr><td>5</td><td>ol</td><td>-ole</td><td>-olidine</td><td>-ole</td><td>-olane</td></tr>
<tr><td>6</td><td>in</td><td>-ine</td><td>-inane</td><td>-ine</td><td>-inane</td></tr>
<tr><td>7</td><td>ep</td><td>-epine</td><td>-epane</td><td>-epine</td><td>-epane</td></tr>
<tr><td>8</td><td>oc</td><td>-ocine</td><td>-ocane</td><td>-ocine</td><td>-ocane</td></tr></table></div>
<p>Patterns to notice: "-idine" appears only for <b>saturated rings containing N</b> (3-, 4- and 5-membered); saturated rings without N end in "-ane". "Unsaturated" here means the maximum number of non-cumulative double bonds.</p>
<div class="ex"><b>Worked examples:</b><br>
3-membered, N, saturated → aza + iridine → <b>aziridine</b>.<br>
3-membered, O, saturated → oxa + irane → <b>oxirane</b> (ethylene oxide, an epoxide).<br>
3-membered, S, saturated → thia + irane → <b>thiirane</b>.<br>
3-membered, N, unsaturated → <b>azirine</b>. 3-membered, O, unsaturated → <b>oxirene</b>.<br>
4-membered, N, saturated → <b>azetidine</b> (the ring in β-lactam antibiotics is an azetidinone).<br>
5-membered, O, saturated → <b>oxolane</b> (= tetrahydrofuran). 5-membered, N, saturated → <b>azolidine</b> (= pyrrolidine).<br>
5-membered, O and N (1,3), unsaturated → <b>1,3-oxazole</b>. 6-membered, one O, unsaturated → oxine (pyran).<br>
7-membered, one N, unsaturated → <b>azepine</b> (as in the benzodiazepines).</div>

<h4>5. Numbering a single heterocyclic ring</h4>
<ol>
<li>The heteroatom gets position <b>1</b>.</li>
<li>With <b>more than one heteroatom of the same type</b>, start at the <b>saturated</b> one (the one bearing H, e.g. the NH in imidazole), then number to give the other the lowest number.</li>
<li>With <b>different heteroatoms</b>, start at the one of <b>highest priority (O &gt; S &gt; N)</b>, and continue in the direction that gives the other heteroatoms the <b>lowest possible numbers</b>. Thiazole: S = 1, N = 3.</li>
</ol>

<h4>6. Partially unsaturated rings: indicated hydrogen and "hydro"</h4>
<h5>A. Indicated hydrogen (italic H)</h5>
<p>Some rings have the <b>maximum number of non-cumulative double bonds</b> (a <b>mancude</b> ring) but still have one atom that is <b>only singly bonded</b> to its neighbours, because the double bonds can be arranged in more than one way. That "obligatory saturated" position is shown by an <b>italic capital H</b> with its locant, choosing the <b>lowest number</b>.</p>
<p>Examples: <b>1H-phosphole</b>, <b>2H-1,3-dioxole</b>, <b>5H-1,2,3-oxathiazole</b>, <b>4H-oxine</b> (4H-pyran), <b>1H-azepine</b>. (Pyrrole is properly 1H-pyrrole: the NH nitrogen is the singly bonded atom.)</p>
<h5>B. Added hydrogen ("hydro" prefixes)</h5>
<p>If the ring has <b>fewer</b> double bonds than the maximum, name it from the fully unsaturated parent and add <b>dihydro-, tetrahydro-</b> etc., with the locants of the saturated positions, as low as possible.</p>
<p>Examples: <b>1,2-dihydroazine</b>, <b>1,4-dihydroazine</b> (1,4-dihydropyridines are a class of calcium-channel blockers, e.g. nifedipine), <b>2,3,4,5-tetrahydroazine</b>, <b>2,3-dihydrooxole</b>.</p>
<h5>C. Both together</h5>
<p>If a ring has fewer than the maximum double bonds <b>and</b> an obligatory saturated atom, use <b>both</b>: "hydro" prefixes for the extra saturated positions and an indicated <b>H</b> for the obligatory one. <b>Assign the lowest locant to the indicated hydrogen first.</b></p>
<p>Examples: <b>2,3-dihydro-1H-azepine</b>; <b>3,4-dihydro-2H-pyran</b>.</p>
<div class="pearl"><strong>Step-by-step for any name:</strong> (1) identify heteroatoms → prefixes in O &gt; S &gt; N order; (2) count ring atoms → stem; (3) saturated or not, N or not → suffix; (4) number from the highest-priority heteroatom, giving others the lowest numbers; (5) add indicated H or hydro prefixes if partly saturated.</div>
