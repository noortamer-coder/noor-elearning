<p>المحاضرة التانية بتكمّل أدوات زيادة الذوبانية بفكرة واحدة كبيرة: <b>صغّري جزيئات الدوا، أو غيّري البلورة بتاعتها</b>. فيها 3 تقنيات من الأبسط للأحدث: <b>micronization</b> و<b>nanocrystals</b> و<b>cocrystals</b>. لازم تعرفي تقارني بينهم، وتشرحي كل واحدة بتتعمل إزاي، وتدي أمثلة من السوق.</p>

<h4>1. ليه حجم الجزيئات مهم؟</h4>
<p>الدوا بيدوب من سطحه. لو كسرتي الجزيء لحتت أصغر، نفس الكتلة هتكشف سطح أكبر بكتير للسائل، فتدوب أسرع. ده اللي بتقوله <b>معادلة Noyes–Whitney</b>:</p>
<div class="formula">dm/dt = D · A · (Cs − C) / h<small>dm/dt = dissolution rate · D = diffusion coefficient · A = surface area · Cs = saturation solubility · C = bulk concentration · h = diffusion layer thickness</small></div>
<p>معدل الذوبان <b>بيتناسب طرديًا مع المساحة السطحية (A)</b>. لو صغّرتي الحجم للنص، المساحة لكل جرام تقريبًا بتتضاعف.</p>

<h4>2. الـ Micronization</h4>
<p><b>التعريف:</b> تصغير حجم جزيئات الدوا لمدى <b>الميكرومتر (1–10 µm)</b> <b>ميكانيكيًا</b> بالطحن.</p>
<h5>بيفيد إزاي؟</h5>
<ul>
<li>بيزوّد المساحة المعرّضة لوسط الذوبان.</li>
<li>بيزوّد معدل الذوبان (Noyes–Whitney).</li>
<li>مفيد أكتر لأدوية <b>BCS Class II</b> (ذوبان قليل ونفاذية عالية)، لأن الذوبان هو الخطوة المحددة.</li>
</ul>
<h5>الطرق</h5>
<ul>
<li><b>Jet milling</b>: تيارات غاز مضغوط سريعة جدًا (هوا أو نيتروجين) بتخلي الجزيئات <b>تخبط في بعض</b> جوه غرفة وتتكسر.</li>
<li><b>Ball milling</b>: أسطوانة بتلف ومليانة كور طحن، بتخبط المادة وتطحنها لبودرة ناعمة.</li>
</ul>
<h5>أمثلة في السوق</h5>
<p><b>Griseofulvin</b> و<b>Spironolactone</b>.</p>
<h5>التحديات</h5>
<ul>
<li>ممكن ما يكفيش للأدوية المحبة للدهون جدًا (<b>log P أكبر من 4</b>).</li>
<li><b>تنظيميًا</b>: الـ FDA غالبًا بتطلب دليل إن الـ micronization فعلًا حسّن الذوبان و<b>ما غيّرش الشكل البلوري (polymorph)</b>، لأن طاقة الطحن ممكن تحوّل بلورة لشكل تاني.</li>
</ul>

<h4>3. الـ Nanocrystals</h4>
<p><b>التعريف:</b> جزيئات دوا متصغّرة لـ <b>100–1000 nm</b> (أقل من ميكرومتر).</p>
<p><b>المميزات:</b> مساحة سطحية أكبر بكتير من الـ micronized، فذوبان و bioavailability أحسن لأدوية Class II، وأحيانًا الذوبان بيوصل لـ <b>supersaturation</b>.</p>
<h5>طريقتين للتحضير</h5>
<p><b>1. Top-down</b>: نبدأ ببلورات كبيرة ونكسّرها.</p>
<ul>
<li>الطريقة: <b>high-pressure homogenization (HPH)</b>، طاقة ميكانيكية بتكسّر البلورات الخشنة لنانو.</li>
<li>المميزات: <b>سهلة التكبير للإنتاج</b> ومستخدمة كتير في الصناعة، والحجم بيطلع ثابت، ومستخدمة في منتجات زي <b>Tricor® (fenofibrate)</b> و<b>Rapamune® (sirolimus)</b>.</li>
<li>العيوب: <b>طاقة عالية</b>، و<b>الحرارة</b> اللي بتطلع ممكن تبوّظ الأدوية الحساسة للحرارة.</li>
</ul>
<p><b>2. Bottom-up</b>: نبني البلورات من الجزيئات الذايبة بترسيب متحكَّم فيه.</p>
<ul>
<li>الطريقة: <b>solvent–antisolvent precipitation</b>. ندوّب الدوا في مذيب، وبعدين نخلطه بسرعة بسائل ما بيدوبش فيه فيترسب كجزيئات نانو.</li>
<li>المميزات: جزيئات <b>متساوية</b> وشكلها متحكَّم فيه، <b>طاقة أقل</b> من الـ top-down، وممكن إنتاج مستمر.</li>
<li>العيوب: <b>صعوبة في التكبير</b> (الخلط وشيل المذيب)، وخطر <b>بقايا المذيب</b>، والتحكم في العملية أصعب.</li>
</ul>
<h5>المشكلة الكبيرة: التكتل، والحل الـ stabilizers</h5>
<p>الـ nanocrystals عندها <b>طاقة سطحية</b> عالية جدًا، فبتميل تلزق في بعض (aggregation) وتخسر ميزتها. لازم نضيف <b>stabilizer</b>. وظايفه:</p>
<ol>
<li><b>يمنع التكتل</b> بطبقة حماية بتبعد الجزيئات عن بعض.</li>
<li><b>يحافظ على الثبات الفيزيائي</b> (حجم النانو) أثناء التخزين.</li>
<li><b>يحسّن البلل والانتشار</b> في الماء.</li>
</ol>
<p>بيشتغل إزاي:</p>
<ul>
<li><b>Steric</b>: بوليمرات بتغطي السطح وتمنع الجزيئات تلمس بعض فعليًا: <b>PVP و HPMC و PEG</b>.</li>
<li><b>Electrostatic</b>: مواد مشحونة بتدي الجزيئات شحنة سطحية (<b>zeta potential</b>) فالشحنات المتشابهة تتنافر: <b>SDS</b>.</li>
<li><b>الاتنين مع بعض</b>: زي الـ ionic surfactants.</li>
</ul>
<p>من الـ surfactants المستخدمة: <b>Tween 80</b> و<b>Span 20 و 40 و 80</b>.</p>
<p><b>منتجات نانو في السوق:</b> <b>Rapamune®</b> (sirolimus)، <b>Emend®</b> (aprepitant)، <b>Tricor®</b> (fenofibrate).</p>

<h4>4. مقارنة Micronization و Nanocrystals</h4>
<div class="tblwrap"><table><tr><th>Feature</th><th>Micronization</th><th>Nanocrystals</th></tr>
<tr><td>Particle size</td><td>1–10 µm</td><td>100–1000 nm</td></tr>
<tr><td>Surface area increase</td><td>Moderate</td><td>Very high</td></tr>
<tr><td>Dissolution gain</td><td>Limited</td><td>Greater, sometimes supersaturation</td></tr>
<tr><td>Methods</td><td>Jet milling, ball milling</td><td>Homogenization, precipitation</td></tr>
<tr><td>Stability</td><td>More stable</td><td>Needs stabilizers</td></tr></table></div>

<h4>5. الـ Cocrystals</h4>
<p><b>التعريف:</b> بلورات فيها أكتر من مكوّن: <b>الدوا + coformer</b> في نفس الشبكة البلورية، ماسكين في بعض بروابط <b>غير تساهمية</b> (روابط هيدروجينية، van der Waals، π–π).</p>
<p><b>الهدف:</b> تغيير الخواص <b>الفيزيائية</b> (الذوبان، الثبات، القوة الميكانيكية) <b>من غير ما التأثير الدوائي يتغير</b>. مفيش رابطة تساهمية مع الدوا، فجزيء الدوا نفسه زي ما هو. مثال: <b>carbamazepine–saccharin بنسبة 1:1</b>.</p>
<h5>ليه الـ cocrystals بتدوب أحسن؟ 3 آليات</h5>
<ol>
<li><b>تعديل الشبكة البلورية</b>: بلورة الدوا النقي غالبًا شبكتها قوية وثابتة وصعب تتفكك. في الـ cocrystal الدوا ماسك في الـ coformer بروابط أضعف، فالمذيب يدخل أسهل. الـ carbamazepine–saccharin بيدوب أسرع من الكاربامازيبين النقي.</li>
<li><b>بلل أحسن</b>: أدوية كتير ضعيفة الذوبان كارهة للماء وما بتتبلش كويس. والـ coformers غالبًا <b>محبة للماء</b> (nicotinamide و caffeine و saccharin)، فسطح الـ cocrystal يلمس الماء أحسن.</li>
<li><b>قوة دافعة ديناميكية حرارية</b>: تكوين الـ cocrystal بيغيّر الطاقة الحرة. بعض الـ cocrystals أقل ثباتًا من الدوا النقي، وده بيشجّع الذوبان.</li>
</ol>
<h5>اختيار الـ coformer: 4 شروط</h5>
<ol>
<li><b>تفاعلات مكمّلة</b>: مجموعات وظيفية تقدر تعمل روابط هيدروجينية أو π–π أو van der Waals مع الدوا (carboxylic acid، amide، hydroxyl).</li>
<li><b>الأمان وحالة GRAS</b> (معترف بأمانه من الـ FDA): زي nicotinamide و saccharin و caffeine و succinic acid.</li>
<li><b>تحسين الخواص</b>: لازم يحسّن الذوبان أو سرعته أو الثبات أو الـ bioavailability (carbamazepine–nicotinamide بيحسّن الذوبان).</li>
<li><b>التوافق</b>: ما يتفاعلش كيميائيًا مع الدوا وما يتكسرش أثناء التصنيع والتخزين.</li>
</ol>
<h5>الأنواع</h5>
<ul>
<li><b>Single-drug cocrystals</b>: دوا واحد + coformer مش فعّال (زي saccharin).</li>
<li><b>Multidrug cocrystals</b>: دوائين أو أكتر في <b>نفس الشبكة البلورية</b>، مندمجين على مستوى الجزيئات مش مجرد خليط. مثال في السوق: <b>Entresto®</b> (<b>sacubitril + valsartan</b>) لعلاج <b>فشل القلب</b>.</li>
</ul>
<h5>الاستخدامات</h5>
<ol>
<li><b>الذوبان وسرعته</b> ← تأثير أسرع: <b>naproxen–L-alanine</b> بيدوب أسرع من النابروكسين النقي.</li>
<li><b>الـ Bioavailability</b> خصوصًا لـ Class II: الـ <b>baicalein–caffeine</b> cocrystal ادّى مستويات في البلازما أعلى في الفيران من الدوا النقي أو الخليط العادي.</li>
<li><b>الثبات</b>: حماية من الضوء والحرارة والرطوبة؛ أشكال <b>أقل امتصاصًا للرطوبة</b> (<b>caffeine–oxalic acid</b> أثبت في الرطوبة من الكافيين النقي)؛ وممكن تحوّل <b>الأدوية السائلة</b> اللي درجة انصهارها واطية لصلب ثابت.</li>
<li><b>إخفاء الطعم</b>: coformers حلوة بتخفي الطعم المر (paracetamol–trimethylglycine و carbamazepine–saccharin).</li>
<li><b>Multidrug</b> للتآزر وتبسيط الجرعات: <b>meloxicam–aspirin</b> رفع الـ bioavailability من <b>16% لـ 69%</b>.</li>
</ol>
<h5>طرق التحضير</h5>
<ul>
<li><b>Solid-state</b>: <b>neat (dry) grinding</b> (من غير مذيب، بس الناتج ممكن يبقى مش نقي)؛ و<b>liquid-assisted (wet) grinding</b> (شوية سائل بيشتغلوا كعامل مساعد فالكفاءة والنقاوة تزيد).</li>
<li><b>Solvent-based</b>: <b>solvent evaporation</b>، ندوّب المكونين ونبخّر المذيب.</li>
<li><b>طرق خضرا (green)</b>: <b>بالموجات فوق الصوتية</b> (بتسرّع تكوين النوى) و<b>بالميكروويف</b>.</li>
</ul>
<div class="pearl"><strong>مقارنة للامتحان:</strong> الـ <b>salt</b> فيه انتقال بروتون (رابطة أيونية)؛ الـ <b>cocrystal</b> روابط غير تساهمية بس ومن غير تغيير في الدوا؛ والـ <b>solid dispersion</b> (محاضرة 1) هو دوا منتشر في بوليمر، مش بلورة جديدة.</div>

DEEP.dosage[3]={en:`
<p>Water is the most common ingredient in liquid medicines, so a pharmacist must know which <b>grade of water</b> to use for which product, and how each grade is made. The second half covers <b>aromatic waters</b>: pleasant-tasting waters used as vehicles.</p>

<h4>1. Water as a vehicle</h4>
<p>Water is used both as the <b>vehicle</b> and as the <b>solvent</b> for flavours and drugs. Its advantages: <b>tasteless, odourless, no pharmacological activity, neutral and very cheap</b>.</p>

<h4>2. The grades of pharmaceutical water</h4>
<h5>1. Drinking (potable, tap) water</h5>
<p><b>Not permitted</b> for dispensing pharmaceutical dosage forms. Why?</p>
<ul>
<li>Possible <b>bacterial contamination</b>.</li>
<li><b>Dissolved salts</b> can destroy active ingredients or speed their decomposition. Hard water contains <b>calcium and magnesium</b>; bicarbonates are the main impurity in alkaline waters.</li>
<li>Signs of these incompatibilities: <b>precipitation, discoloration, effervescence</b>.</li>
</ul>
<h5>2. Freshly boiled and cooled water</h5>
<p>Boiling kills <b>vegetative bacteria</b>. But <b>spores survive</b>, so on long storage they can germinate into vegetative organisms again. And boiling does nothing about the <b>dissolved salts</b>.</p>
<h5>3. Purified Water USP ("distilled water")</h5>
<ul>
<li><b>Free from anions, cations (salts) and microorganisms</b>, and must meet strict chemical-purity specifications.</li>
<li>About <b>100 times freer of dissolved solids</b> than ordinary water.</li>
<li>Used as vehicle or solvent, and must be used for <b>all pharmaceutical operations, dosage forms, and USP tests and assays</b>.</li>
<li><b>Exceptions:</b> it is <b>not</b> intended for (1) <b>parenteral</b> (injection) or (2) <b>ophthalmic</b> preparations.</li>
</ul>
<div class="pearl"><strong>Why not for injections and eye drops?</strong> Purified water isn't required to be <b>sterile</b> or <b>pyrogen-free</b>. Injections bypass the body's defences, and pyrogens (fever-causing bacterial products) cause reactions. Those products need Water for Injection.</div>

<h4>3. How purified water is made</h4>
<h5>Method 1: distillation</h5>
<p>Water is boiled, the vapour is cooled, and purified water condenses. Two portions are thrown away:</p>
<ul>
<li>The <b>first 10–20%</b> of distillate: contains the <b>volatile impurities</b>, which boil off first.</li>
<li>The <b>last 10–20%</b>: risks contamination with <b>decomposition products</b> of the solid impurities left in the still (including off-flavours).</li>
</ul>
<h5>Method 2: ion exchange (deionization, demineralization)</h5>
<p>Ion exchange is a <b>reversible</b> chemical reaction that removes dissolved ions and replaces them with other ions of the same charge. Drinking water is passed over water-insoluble resins: small plastic beads of organic polymer carrying fixed charged groups.</p>
<ul>
<li>The <b>cation-exchange resin</b> swaps cations in the water (<b>Ca²⁺, Mg²⁺</b>) for <b>H⁺</b>.</li>
<li>The <b>anion-exchange resin</b> swaps anions (<b>Cl⁻, SO₄²⁻</b>) for <b>OH⁻</b>.</li>
<li>The released ions combine: <b>H⁺ + OH⁻ → H₂O</b>. The salts are gone and only water is left.</li>
</ul>
<p>Systems are either <b>two-column</b> (cation resin in one, anion resin in the other) or <b>one-column</b> (both resins mixed in the same column).</p>
<p><b>Advantages over distillation:</b> (1) no heat; (2) low cost and little maintenance compared with complex stills; (3) simple equipment; (4) easy to operate; (5) a more mobile facility. It also removes most impurities efficiently and economically.</p>
<h5>Method 3: reverse osmosis (cross-flow membrane filtration)</h5>
<p>In normal osmosis, water flows through a semipermeable membrane from the dilute side to the concentrated side. In <b>reverse osmosis</b>, <b>pressure</b> is applied to the impure side, forcing water molecules through the membrane <b>against</b> the osmotic direction, while large molecules, ions and impurities stay behind. RO removes <b>all pyrogens and organic molecules</b> and <b>90–99% of all ions</b>.</p>

<h4>4. Water for Injection (WFI) and bacteriostatic WFI</h4>
<h5>Water for Injection</h5>
<ul>
<li><b>Pyrogen-free</b> and <b>sterilized immediately after collection</b>; used for parenteral preparations.</li>
<li>Packaged in <b>single-dose containers no larger than 1 L</b>.</li>
<li>Contains <b>no antimicrobial agent</b>.</li>
<li>Used as a solvent, vehicle or diluent for injectable medicines that are already sterilized and packaged.</li>
</ul>
<h5>Bacteriostatic Water for Injection</h5>
<ul>
<li>Contains <b>one or more antimicrobial agents</b>; the label must state their name and proportion.</li>
<li>Used as a sterile vehicle for <b>small-volume</b> injections. The preservative allows <b>multiple-dose vials</b> (e.g. vaccine vials), because it kills organisms introduced each time a needle enters.</li>
<li><b>Not for large volumes</b>: injecting a large volume would also inject a toxic amount of preservative. Rule: if <b>more than 5 mL</b> of solvent is needed, use <b>sterile water for injection</b>, not bacteriostatic.</li>
</ul>
<div class="tblwrap"><table><tr><th>Water</th><th>Microbes</th><th>Salts</th><th>Pyrogens</th><th>Use</th></tr>
<tr><td>Tap</td><td>May contain</td><td>Yes</td><td>—</td><td>Not for dispensing</td></tr>
<tr><td>Boiled &amp; cooled</td><td>Spores survive</td><td>Yes</td><td>—</td><td>Limited</td></tr>
<tr><td>Purified USP</td><td>Free</td><td>Free</td><td>Not required</td><td>All forms except injections and eye</td></tr>
<tr><td>WFI</td><td>Sterile</td><td>Free</td><td>Free</td><td>Injections, single dose ≤ 1 L</td></tr>
<tr><td>Bacteriostatic WFI</td><td>Sterile + preservative</td><td>Free</td><td>Free</td><td>Multi-dose, ≤ 5 mL</td></tr></table></div>

<h4>5. Aromatic waters</h4>
<p><b>Definition:</b> more or less <b>saturated, clear aqueous solutions of volatile oils</b> or other volatile substances. The concentration is always very low, because these oils are poorly water-soluble.</p>
<p><b>Use:</b> pleasant-flavoured <b>vehicles</b> for water-soluble drugs.</p>
<p><b>Volatile substances used:</b> orange flower oil, peppermint oil, rose oil, anise oil, spearmint oil, camphor and chloroform.</p>
<h5>Requirements of a good aromatic water</h5>
<ol>
<li>Odour and taste <b>similar to the source</b> substance.</li>
<li><b>Clear</b>, free from fibres, particles and sediment.</li>
<li><b>Freshly prepared</b> (within a few weeks).</li>
<li><b>Free from foreign odours</b>.</li>
</ol>
<h5>Disadvantages</h5>
<ol>
<li><b>Incompatible with soluble salts</b>: high salt concentrations reduce the oil's solubility, so it separates out (<b>salting out</b>).</li>
<li><b>Deteriorate</b> (become cloudy) with time because of volatilization, decomposition or <b>mould growth</b>, so they must be freshly prepared.</li>
<li><b>Sensitive to light and excessive heat</b>.</li>
</ol>
<p><b>Preventing deterioration:</b> make <b>small quantities</b>; protect from intense light and heat; store in <b>airtight, light-resistant containers</b> in a <b>cool, dark place</b>.</p>
<h5>Three methods of preparation</h5>
<ol>
<li><b>Distillation</b>: the <b>most satisfactory</b> method, but <b>slower and more expensive</b>. The coarsely ground plant material is mixed with purified water in the still and distilled; excess oil is then filtered off. If the plant contains only a little oil, the distillate is put back and redistilled with fresh material several times until saturated. This repeated redistillation is called <b>cohobation</b>. Example: <b>rose water</b>.</li>
<li><b>Simple solution</b> (done in the lab): shake <b>2 g or 2 mL</b> of the volatile substance with <b>1000 mL purified water</b>; set aside <b>12 hours</b>; filter through <b>wetted</b> filter paper (so the paper doesn't absorb the oil); make up to 1000 mL with purified water through the filter. Examples: <b>chloroform water</b>, <b>peppermint water</b>.</li>
<li><b>Incorporating a solubilizing agent</b>, such as <b>Span 60</b> or <b>Tween 20</b>. Disadvantages: the product is <b>prone to mould growth</b>, and above <b>2%</b> the agent gives an objectionable taste.</li>
</ol>
<h5>Official aromatic waters and their uses</h5>
<ul>
<li><b>Camphor water</b>: internally as a <b>carminative</b>; antiseptic and anaesthetic in <b>eye lotions</b>.</li>
<li><b>Chloroform water</b>: <b>expectorant, carminative, antiseptic, stomachic</b> (stimulates digestion and appetite) and <b>preservative</b>.</li>
<li><b>Peppermint water</b>: carminative and mildly sedative to the stomach.</li>
<li><b>Anise water</b>: carminative.</li>
</ul>
<div class="pearl"><strong>Remember:</strong> carminative = relieves gas/flatulence. Almost every aromatic water is carminative; chloroform water is the "do-everything" one, including preservative.</div>

<p>الماء هو أكتر مكوّن موجود في الأدوية السائلة، فالصيدلي لازم يعرف <b>أنهي نوع ماء</b> يستخدمه لأنهي منتج، وكل نوع بيتحضّر إزاي. والنص التاني عن <b>المياه العطرية</b>: مياه طعمها حلو بنستخدمها كـ vehicle.</p>

<h4>1. الماء كـ vehicle</h4>
<p>الماء بيُستخدم كـ <b>vehicle</b> وكـ <b>مذيب</b> للنكهات والأدوية. مميزاته: <b>من غير طعم ولا ريحة، ما لوش تأثير دوائي، متعادل، ورخيص جدًا</b>.</p>

<h4>2. أنواع المياه الصيدلانية</h4>
<h5>1. مياه الشرب (الحنفية)</h5>
<p><b>ممنوع</b> نستخدمها في صرف الأشكال الصيدلانية. ليه؟</p>
<ul>
<li>ممكن يكون فيها <b>تلوث بكتيري</b>.</li>
<li>الـ<b>أملاح الذايبة</b> ممكن تبوّظ المادة الفعالة أو تسرّع تكسيرها. الماء العسر فيه <b>كالسيوم وماغنسيوم</b>، والبيكربونات هي الشوائب الأساسية في المياه القلوية.</li>
<li>علامات عدم التوافق ده: <b>ترسيب، تغيّر لون، فوران</b>.</li>
</ul>
<h5>2. مياه مغلية ومبردة</h5>
<p>الغلي بيقتل <b>البكتيريا النشطة (vegetative)</b>. بس <b>الجراثيم (spores) بتعيش</b>، فمع التخزين الطويل ممكن تنشط تاني. والغلي ما بيعملش حاجة للـ<b>أملاح الذايبة</b>.</p>
<h5>3. Purified Water USP (الماء المقطّر)</h5>
<ul>
<li><b>خالي من الأيونات (الأملاح) والميكروبات</b>، ولازم يطابق مواصفات نقاوة كيميائية صارمة.</li>
<li>تقريبًا <b>أنقى 100 مرة</b> من الماء العادي في المواد الصلبة الذايبة.</li>
<li>بيُستخدم كـ vehicle أو مذيب، ولازم يُستخدم في <b>كل العمليات والأشكال الصيدلانية واختبارات الـ USP</b>.</li>
<li><b>الاستثناءات:</b> <b>مش</b> للـ (1) <b>الحقن</b> ولا (2) <b>مستحضرات العين</b>.</li>
</ul>
<div class="pearl"><strong>ليه مش للحقن وقطرات العين؟</strong> الـ purified water مش مطلوب يكون <b>معقّم</b> ولا <b>خالي من الـ pyrogens</b>. الحقن بتعدّي دفاعات الجسم، والـ pyrogens (منتجات بكتيرية بتعمل حرارة) بتعمل تفاعلات. المنتجات دي محتاجة Water for Injection.</div>

<h4>3. تحضير الماء النقي</h4>
<h5>الطريقة 1: التقطير</h5>
<p>الماء بيغلي، والبخار بيبرد، والماء النقي بيتكثّف. وبنرمي جزئين:</p>
<ul>
<li>أول <b>10–20%</b>: فيهم <b>الشوائب الطيارة</b> اللي بتغلي الأول.</li>
<li>آخر <b>10–20%</b>: ممكن يتلوثوا بـ<b>نواتج تكسير</b> الشوائب الصلبة اللي فضلت في الجهاز (ومنها الروايح الوحشة).</li>
</ul>
<h5>الطريقة 2: التبادل الأيوني (deionization)</h5>
<p>تفاعل كيميائي <b>عكسي</b> بيشيل الأيونات الذايبة ويحط مكانها أيونات تانية بنفس الشحنة. ماء الشرب بيعدّي على resins مش بتدوب في الماء: حبوب بلاستيك صغيرة من بوليمر عضوي فيها مجموعات مشحونة ثابتة.</p>
<ul>
<li>الـ <b>cation-exchange resin</b> بيبدّل الأيونات الموجبة (<b>Ca²⁺ و Mg²⁺</b>) بـ <b>H⁺</b>.</li>
<li>الـ <b>anion-exchange resin</b> بيبدّل الأيونات السالبة (<b>Cl⁻ و SO₄²⁻</b>) بـ <b>OH⁻</b>.</li>
<li>الأيونات اللي طلعت بتتحد: <bdi>H⁺ + OH⁻ → H₂O</bdi>. الأملاح راحت وفضل ماء بس.</li>
</ul>
<p>الأنظمة يا <b>عمودين</b> (resin موجب في واحد وسالب في التاني) يا <b>عمود واحد</b> (الاتنين متخلطين).</p>
<p><b>مميزاته عن التقطير:</b> (1) مفيش حرارة؛ (2) تكلفة وصيانة أقل من أجهزة التقطير المعقدة؛ (3) أجهزة بسيطة؛ (4) تشغيل سهل؛ (5) سهل النقل. وكمان بيشيل معظم الشوائب بكفاءة وبشكل اقتصادي.</p>
<h5>الطريقة 3: التناضح العكسي (Reverse osmosis)</h5>
<p>في الأسموزية العادية، الماء بيعدّي من غشاء شبه منفذ من الناحية المخففة للناحية المركّزة. في الـ <b>reverse osmosis</b> بنضغط على الناحية اللي فيها شوائب، فجزيئات الماء تتجبر تعدّي من الغشاء <b>عكس</b> اتجاه الأسموزية، والجزيئات الكبيرة والأيونات والشوائب تفضل ورا. الـ RO بيشيل <b>كل الـ pyrogens والجزيئات العضوية</b> و<b>90–99% من الأيونات</b>.</p>

<h4>4. Water for Injection و Bacteriostatic WFI</h4>
<h5>Water for Injection</h5>
<ul>
<li><b>خالي من الـ pyrogens</b> و<b>بيتعقم فورًا بعد ما يتجمع</b>، ومستخدم في الحقن.</li>
<li>متعبّي في <b>عبوات جرعة واحدة مش أكبر من 1 لتر</b>.</li>
<li><b>ما فيهوش مادة حافظة</b>.</li>
<li>بيُستخدم كمذيب أو vehicle أو مخفف لأدوية حقن متعقمة ومتعبية خلاص.</li>
</ul>
<h5>Bacteriostatic Water for Injection</h5>
<ul>
<li>فيه <b>مادة مضادة للميكروبات أو أكتر</b>، ولازم الليبل يكتب اسمها ونسبتها.</li>
<li>بيُستخدم كـ vehicle معقّم للحقن <b>صغيرة الحجم</b>. المادة الحافظة بتسمح بـ<b>عبوات متعددة الجرعات</b> (زي فيالات اللقاحات)، لأنها بتقتل الميكروبات اللي بتدخل كل مرة الإبرة تدخل.</li>
<li><b>مش للأحجام الكبيرة</b>: حقن حجم كبير معناه حقن كمية سامة من المادة الحافظة. القاعدة: لو محتاجين <b>أكتر من 5 مل</b> مذيب، نستخدم <b>sterile water for injection</b> مش الـ bacteriostatic.</li>
</ul>
<div class="tblwrap"><table><tr><th>Water</th><th>Microbes</th><th>Salts</th><th>Pyrogens</th><th>Use</th></tr>
<tr><td>Tap</td><td>May contain</td><td>Yes</td><td>—</td><td>Not for dispensing</td></tr>
<tr><td>Boiled &amp; cooled</td><td>Spores survive</td><td>Yes</td><td>—</td><td>Limited</td></tr>
<tr><td>Purified USP</td><td>Free</td><td>Free</td><td>Not required</td><td>All except injections and eye</td></tr>
<tr><td>WFI</td><td>Sterile</td><td>Free</td><td>Free</td><td>Injections, single dose ≤ 1 L</td></tr>
<tr><td>Bacteriostatic WFI</td><td>Sterile + preservative</td><td>Free</td><td>Free</td><td>Multi-dose, ≤ 5 mL</td></tr></table></div>

<h4>5. المياه العطرية (Aromatic waters)</h4>
<p><b>التعريف:</b> محاليل مائية <b>رايقة وشبه مشبعة بزيوت طيارة</b> أو مواد طيارة تانية. التركيز دايمًا قليل جدًا لأن الزيوت دي ما بتدوبش كويس في الماء.</p>
<p><b>الاستخدام:</b> <b>vehicles</b> بطعم حلو للأدوية اللي بتدوب في الماء.</p>
<p><b>المواد الطيارة المستخدمة:</b> زيت زهر البرتقال، النعناع، الورد، اليانسون، النعناع البلدي (spearmint)، الكافور، والكلوروفورم.</p>
<h5>مواصفات الماء العطري الكويس</h5>
<ol>
<li>ريحته وطعمه <b>زي المادة الأصلية</b>.</li>
<li><b>رايق</b>، ومفيهوش ألياف ولا جزيئات ولا رواسب.</li>
<li><b>متحضّر جديد</b> (خلال كام أسبوع).</li>
<li><b>مفيهوش روايح غريبة</b>.</li>
</ol>
<h5>العيوب</h5>
<ol>
<li><b>مش متوافق مع الأملاح الذايبة</b>: تركيز الملح العالي بيقلل ذوبان الزيت فينفصل (<b>salting out</b>).</li>
<li><b>بيبوظ</b> (يعكّر) مع الوقت بسبب التطاير أو التكسير أو <b>نمو العفن</b>، فلازم يتحضّر جديد.</li>
<li><b>حساس للضوء والحرارة الزيادة</b>.</li>
</ol>
<p><b>منع البوظان:</b> نحضّر <b>كميات صغيرة</b>؛ نحميه من الضوء الشديد والحرارة؛ نخزّنه في <b>عبوات محكمة ومانعة للضوء</b> في <b>مكان بارد ومضلم</b>.</p>
<h5>3 طرق للتحضير</h5>
<ol>
<li><b>التقطير</b>: <b>الأفضل</b>، بس <b>أبطأ وأغلى</b>. النبات المطحون خشن بيتخلط بماء نقي في جهاز التقطير ويتقطّر، وبعدين الزيت الزيادة يتفلتر. لو النبات فيه زيت قليل، الناتج يرجع يتقطّر تاني مع نبات جديد كذا مرة لحد ما يتشبع. إعادة التقطير دي اسمها <b>cohobation</b>. مثال: <b>ماء الورد</b>.</li>
<li><b>محلول بسيط</b> (بيتعمل في المعمل): نرج <b>2 جم أو 2 مل</b> من المادة الطيارة مع <b>1000 مل ماء نقي</b>؛ نسيبه <b>12 ساعة</b>؛ نفلتر في ورقة ترشيح <b>مبلولة</b> (عشان الورقة ما تمتصش الزيت)؛ ونكمّل لـ 1000 مل بماء نقي من خلال الفلتر. أمثلة: <b>ماء الكلوروفورم</b> و<b>ماء النعناع</b>.</li>
<li><b>إضافة مادة مساعدة على الذوبان</b> زي <b>Span 60</b> أو <b>Tween 20</b>. العيوب: المنتج <b>بيعفّن بسهولة</b>، وفوق <b>2%</b> المادة دي بتدي طعم وحش.</li>
</ol>
<h5>مياه عطرية رسمية واستخداماتها</h5>
<ul>
<li><b>ماء الكافور</b>: داخليًا <b>طارد للغازات</b>؛ مطهر ومخدر في <b>غسولات العين</b>.</li>
<li><b>ماء الكلوروفورم</b>: <b>مقشّع، طارد للغازات، مطهر، منبّه للمعدة</b> (بيحسّن الهضم والشهية)، و<b>مادة حافظة</b>.</li>
<li><b>ماء النعناع</b>: طارد للغازات ومهدّي خفيف للمعدة.</li>
<li><b>ماء اليانسون</b>: طارد للغازات.</li>
</ul>
<div class="pearl"><strong>افتكري:</strong> carminative = طارد للغازات. تقريبًا كل المياه العطرية طاردة للغازات، وماء الكلوروفورم هو "اللي بيعمل كل حاجة"، ومنها إنه مادة حافظة.</div>

DEEP.dosage[4]={en:`
<p>A liquid medicine has three parts: the <b>drug</b>, the <b>vehicle</b> (usually water) and the <b>additives</b> (excipients). This lecture goes through the eight additives used in liquid preparations, explaining why each is added, with examples and numbers. It then introduces the main <b>oral solutions</b>, <b>syrups</b> and <b>linctuses</b>.</p>

<h4>1. Buffers</h4>
<p>A <b>buffer</b> is a substance that <b>resists a change in pH</b> when small amounts of acid or alkali are added. Buffers must be <b>compatible</b> with the other excipients and <b>non-toxic</b>.</p>
<ul>
<li>Pharmaceutical buffer systems: <b>carbonates, citrates, gluconates, lactates, phosphates, tartrates</b>.</li>
<li><b>Borate</b>: only for <b>external</b> use (medicated powders, skin lotions, mouthwash, toothpaste, topical astringents, eyewashes), <b>never oral or parenteral</b>.</li>
<li>Many drugs are weak electrolytes and buffer a little themselves, but usually not enough, so a buffer system is added.</li>
</ul>
<p><b>Why buffer?</b> To control <b>solubility</b>, improve <b>stability</b> and <b>reduce irritation</b>.</p>
<ul>
<li>Blood and tears are around <b>pH 7.4</b>, so <b>injections and eye drops</b> are buffered near 7.4.</li>
<li><b>Nasal drops</b>: pH <b>5.3–7.0</b> (mean 6.3), matching the nasal cavity to avoid irritation.</li>
</ul>
<div class="ex"><b>Example, benzylpenicillin injection:</b> in water, penicillin hydrolyses to inactive <b>benzylpenicilloic acid</b>. That acid lowers the pH, and lower pH speeds up hydrolysis even more, so the breakdown accelerates until all the antibiotic is destroyed. Buffering to <b>pH 6–7 with sodium citrate</b> slows this vicious cycle.</div>

<h4>2. Isotonicity modifiers</h4>
<p><b>Tonicity</b> measures the effective osmotic pressure difference between two solutions separated by a semipermeable membrane. Solutions are <b>hypertonic</b>, <b>hypotonic</b> or <b>isotonic</b> (same as blood). An isotonic solution is equivalent to <b>0.9% NaCl</b>.</p>
<p>Red cells in a <b>hypertonic</b> solution lose water and <b>shrink</b>; in a <b>hypotonic</b> solution they gain water, <b>swell and may burst</b>.</p>
<ul>
<li>Most used modifiers: <b>dextrose</b> and <b>NaCl</b>.</li>
<li><b>Injections, eye preparations and mucosal products (nasal drops)</b> must be isotonic with tissue fluids, to avoid pain and irritation.</li>
<li>Hypertonic oral liquids, such as <b>Potassium Citrate Mixture BP</b>, must be well diluted before swallowing.</li>
</ul>

<h4>3. Viscosity enhancers</h4>
<p>They thicken the preparation so it <b>stays in contact longer</b>: on the skin for topical solutions, or in the eye for ophthalmic drops. Examples: <b>povidone</b>, <b>hydroxyethylcellulose</b>, <b>carbomer (Carbopol)</b>.</p>

<h4>4. Preservatives (antimicrobial agents)</h4>
<p>Two strategies work together: <b>minimise contamination</b> getting in, and <b>include a preservative</b> in the final product.</p>
<h5>Sources of contamination</h5>
<ol>
<li><b>Equipment</b>: keep it simple, with minimal junctions, valves and pumps, so it can be cleaned in place.</li>
<li><b>Raw materials</b>: natural-origin materials and water carry microbes. Microbial load can be reduced by ionising radiation, microwaves, gassing or heat.</li>
<li><b>Personnel</b>: hygiene training, plus protective clothing (hood, mask, overall, gloves, boots) to shield the product from skin and breath.</li>
</ol>
<h5>An ideal preservative is</h5>
<ol><li>effective against a <b>broad spectrum</b> of microorganisms;</li><li><b>stable</b> for the shelf life;</li><li><b>non-toxic</b>;</li><li><b>non-sensitising and non-irritant</b>;</li><li><b>compatible</b> with the other ingredients;</li><li><b>free of taste and odour</b>.</li></ol>
<p>When choosing one, check that it doesn't <b>adsorb onto the container</b>, isn't weakened by the product's <b>pH</b>, and doesn't <b>interact</b> with other ingredients.</p>
<div class="pearl"><strong>Classic incompatibility:</strong> <b>parabens</b> (para-hydroxybenzoic acid esters) get trapped inside the micelles of some <b>non-ionic surfactants</b> (e.g. Tweens). Locked in micelles, they can't reach microbes and lose their activity.</div>
<p>Preservatives can be used alone or combined. Examples:</p>
<ul>
<li><b>Organic acids and esters</b>: <b>benzoic acid 0.1–0.2%</b>.</li>
<li><b>Parabens 0.1%</b>: <b>methyl paraben</b> (water-soluble) and <b>propyl paraben</b> (water-insoluble).</li>
<li><b>Alcohol above 20%</b>.</li>
</ul>

<h4>5. Antioxidants</h4>
<p>Needed for <b>vitamins, essential oils, and almost all fats and oils</b>, which oxidise. Oxidation is triggered by <b>heat, light and heavy metals</b>. Five ways to slow it:</p>
<ol>
<li><b>Chelating (sequestering) agents</b> bind trace metals: <b>EDTA</b>.</li>
<li><b>Antioxidants (reducing agents)</b>, which get oxidised in place of the drug:
<ul><li>in <b>non-aqueous</b> (oily) products: <b>tocopherols (vitamin E), BHA, BHT</b>;</li>
<li>in <b>aqueous</b> products: <b>ascorbic acid (vitamin C)</b>.</li></ul></li>
<li>Replace the air in the container <b>headspace</b> (e.g. injection ampoules) with <b>nitrogen</b> or another inert gas.</li>
<li>Store oxidisable drugs in a <b>cool place</b>.</li>
<li>Use <b>light-resistant containers</b>.</li>
</ol>

<h4>6. Sweetening agents</h4>
<ul>
<li><b>Sucrose</b> (low-molecular-weight carbohydrate), the traditional choice: <b>colourless</b>, <b>very water-soluble</b>, <b>stable from about pH 4 to 8</b>.</li>
<li><b>Polyhydric alcohols</b>: <b>sorbitol, mannitol</b>, and to a lesser extent <b>glycerol</b>.</li>
<li><b>Artificial (intense) sweeteners</b>: sodium or calcium <b>saccharin</b>. Used with sugars to boost sweetness, or alone for patients who must restrict sugar (<b>diabetics</b>). Used at <b>below 0.2%</b>. Highly soluble and stable over a wide pH range. Less used: <b>aspartame</b>, <b>sodium cyclamate</b>.</li>
<li><b>Drawback of artificial sweeteners</b>: a <b>bitter or metallic aftertaste</b>, which is why they're often combined with sugars.</li>
</ul>

<h4>7. Flavours and perfumes</h4>
<p>With sweeteners they make products <b>palatable</b>, which is vital for children's medicines. Flavours also help <b>identify</b> liquid products.</p>
<ul>
<li><b>Natural</b> (fruit juices, aromatic oils). Disadvantages: <b>variable availability</b>, <b>variable chemical composition</b>, <b>susceptible to microbial contamination</b>.</li>
<li><b>Artificial</b>: <b>cheaper, more readily available, less variable, more stable</b>. Supplied as alcoholic or aqueous solutions or powders.</li>
</ul>
<p><b>Flavours with a double action:</b> indigestion remedies are often <b>mint</b>-flavoured because mint is itself <b>carminative</b>. <b>Menthol</b> and <b>peppermint oil</b> mask bad tastes by a mild <b>anaesthetic</b> effect on taste receptors.</p>
<div class="tblwrap"><table><tr><th>Taste to mask</th><th>Suitable flavour</th></tr>
<tr><td>Salty</td><td>Apricot, liquorice, peach, vanilla</td></tr>
<tr><td>Bitter</td><td>Anise, chocolate, mint, wild cherry</td></tr>
<tr><td>Sweet</td><td>Vanilla, fruits, berries</td></tr>
<tr><td>Sour</td><td>Citrus fruits, liquorice, raspberry</td></tr></table></div>
<p><b>Flavour enhancers</b>: citric acid (for citrus flavours), glycine.</p>

<h4>8. Colours</h4>
<p>Reasons to colour a product:</p>
<ol>
<li>Match the colour to the flavour (red for cherry), making it <b>more attractive</b>.</li>
<li><b>Identification</b>, especially of <b>poisonous</b> materials.</li>
<li>To tell apart the many <b>antiseptic solutions</b> used in hospitals for skin, instruments and syringes.</li>
<li>To <b>mask a coloured degradation product</b> that doesn't affect the product's use.</li>
</ol>
<p><b>Natural colours</b> are more widely accepted, but they vary and are less stable. <b>Synthetic dyes</b> give <b>brighter</b> and generally <b>more stable</b> colours.</p>

<h4>9. What a stable solution must keep</h4>
<p>Over its shelf life a solution must retain its initial <b>clarity, odour, colour, taste, viscosity and pH</b>.</p>

<h4>10. Classifying solutions</h4>
<ul>
<li><b>Aqueous</b> (water or aromatic water). <b>Internal</b>: oral rehydration solution, sodium citrate–citric acid solution, syrups, linctuses, draughts. <b>External</b>: lotions, douches, enemas, gargles, mouthwashes, nasal and otic solutions, mucilages.</li>
<li><b>Non-aqueous</b> (alcohol, glycerin, oils, ether). <b>Internal</b>: elixirs, spirits, tinctures, oleovitamins, glycerites. <b>External</b>: liniments, collodions.</li>
</ul>

<h4>11. Oral solutions</h4>
<p>Attractive, palatable solutions for oral use, usually flavoured and coloured; they may also contain buffers, preservatives, antioxidants and sweeteners.</p>
<p><b>Usual doses:</b> <b>5 mL</b> (teaspoon), <b>10 mL</b> (dessertspoon), <b>15 mL</b> (tablespoon), or drops from a <b>calibrated dropper</b>.</p>
<h5>Products with unusually large doses</h5>
<ul>
<li><b>Oral rehydration solution (ORS)</b>: replaces and maintains water and electrolytes in <b>mild to moderate dehydration</b>. Per litre: <b>45 mEq Na⁺, 20 mEq K⁺, 35 mEq Cl⁻, 30 mEq citrate, 25 g dextrose</b>.</li>
<li><b>Magnesium citrate oral solution</b> ("citrate of magnesia"): a <b>saline cathartic</b> (laxative); usual adult dose <b>200 mL</b>.</li>
<li><b>Sodium citrate and citric acid oral solution</b>: <b>systemic alkaliniser</b> that keeps urine alkaline in patients with <b>kidney stones</b> and in <b>gout</b>, because urates crystallise out of acid urine.</li>
</ul>

<h4>12. Syrups</h4>
<p><b>Syrups</b> are concentrated or nearly saturated aqueous solutions of sugar or a sugar substitute, with or without flavours and drugs. Sucrose can be partly or fully replaced by:</p>
<ul>
<li><b>Dextrose</b>.</li>
<li><b>Glycogenic</b> substances (converted to glucose in the body): sorbitol, glycerin, propylene glycol. <b>Not suitable for diabetics.</b></li>
<li><b>Non-glycogenic</b> substances (cellulose derivatives): not hydrolysed or absorbed, so excellent syrup-like vehicles for <b>diabetics</b>.</li>
</ul>
<h5>Artificial (non-nutritive) syrup for diabetics</h5>
<div class="formula">Artificial simple syrup = sodium CMC 1.5% + saccharin sodium 0.6%</div>
<p><b>Sodium CMC</b> gives the syrupy viscosity. <b>Saccharin sodium</b> is <b>300–550 times sweeter</b> than sucrose, but bitter.</p>
<h5>Do syrups need preservatives?</h5>
<p><b>Nearly saturated sucrose syrups don't</b>, if stored properly. Almost all the water is bound to sugar, leaving no <b>free water</b> for microbes to grow in. The amount of preservative needed depends on how much free water there is. When needed: <b>benzoic acid derivatives 0.1–0.2%</b> or <b>parabens 0.1%</b>.</p>
<div class="pearl"><strong>Alcohol trap:</strong> alcohol in a syrup can be a solvent and a preservative, but at <b>concentrations below 15–20% it does NOT preserve</b>.</div>

<h4>13. Linctuses</h4>
<ul>
<li>Viscous preparations, usually for <b>cough</b>.</li>
<li>A simple solution of the drug in a <b>high concentration of sucrose</b>, given in multiples of 5 mL.</li>
<li>Should be <b>sipped slowly</b> and <b>not diluted</b>: the thick syrup coats the throat and has a soothing <b>demulcent</b> action on the mucous membranes. Dilution would destroy that.</li>
<li>For diabetics, sucrose is replaced by synthetic sweeteners.</li>
</ul>

<p>الدوا السائل فيه 3 أجزاء: <b>الدوا</b>، و<b>الـ vehicle</b> (غالبًا ماء)، و<b>الإضافات</b> (excipients). المحاضرة دي بتعدّي على 8 إضافات بنحطها في المستحضرات السائلة، وبتشرح ليه بنضيف كل واحدة مع أمثلة وأرقام. وبعدين بتقدّم أهم <b>المحاليل الفموية</b> و<b>الشراب</b> و<b>اللينكتس</b>.</p>

<h4>1. الـ Buffers</h4>
<p>الـ <b>buffer</b> مادة <b>بتقاوم تغيّر الـ pH</b> لما نضيف كمية صغيرة من حمض أو قلوي. لازم تكون <b>متوافقة</b> مع باقي المكونات و<b>مش سامة</b>.</p>
<ul>
<li>أنظمة الـ buffer الصيدلانية: <b>كربونات، سترات، جلوكونات، لاكتات، فوسفات، طرطرات</b>.</li>
<li><b>البورات</b>: للاستخدام <b>الخارجي</b> بس (بودرة طبية، لوشن جلد، غسول فم، معجون أسنان، قابضات موضعية، غسول عين)، و<b>أبدًا مش بالفم ولا حقن</b>.</li>
<li>أدوية كتير هي نفسها electrolytes ضعيفة وبتعمل buffer بسيط، بس غالبًا مش كفاية، فبنضيف نظام buffer.</li>
</ul>
<p><b>ليه بنضيف buffer؟</b> عشان نتحكم في <b>الذوبان</b>، ونحسّن <b>الثبات</b>، ونقلل <b>التهييج</b>.</p>
<ul>
<li>الدم والدموع حوالي <b>pH 7.4</b>، فـ<b>الحقن وقطرات العين</b> بتتظبط قريب من 7.4.</li>
<li><b>قطرات الأنف</b>: pH من <b>5.3 لـ 7.0</b> (المتوسط 6.3)، زي تجويف الأنف عشان ما يحصلش تهييج.</li>
</ul>
<div class="ex"><b>مثال، حقن البنزيل بنسلين:</b> في الماء البنسلين بيتحلل لـ <b>benzylpenicilloic acid</b> غير الفعّال. الحمض ده بيقلل الـ pH، والـ pH الواطي بيسرّع التحلل أكتر، فالتكسير بيتسارع لحد ما المضاد الحيوي يخلص. لما نظبط الـ <b>pH عند 6–7 بـ sodium citrate</b> بنبطّأ الدايرة دي.</div>

<h4>2. منظّمات التوتر (Isotonicity modifiers)</h4>
<p>الـ <b>Tonicity</b> بتقيس فرق الضغط الأسموزي الفعّال بين محلولين بينهم غشاء شبه منفذ. المحاليل يا <b>hypertonic</b> يا <b>hypotonic</b> يا <b>isotonic</b> (زي الدم). الـ isotonic يساوي <b>0.9% NaCl</b>.</p>
<p>كرات الدم الحمرا في محلول <b>hypertonic</b> بتفقد ماء و<b>تنكمش</b>، وفي <b>hypotonic</b> بتاخد ماء و<b>تنتفخ وممكن تنفجر</b>.</p>
<ul>
<li>الأكتر استخدامًا: <b>الدكستروز</b> و<b>NaCl</b>.</li>
<li><b>الحقن ومستحضرات العين ومستحضرات الأغشية (قطرات الأنف)</b> لازم تكون isotonic مع سوائل الأنسجة عشان ما يحصلش ألم وتهييج.</li>
<li>المحاليل الفموية الـ hypertonic زي <b>Potassium Citrate Mixture BP</b> لازم تتخفف كويس قبل البلع.</li>
</ul>

<h4>3. مزوّدات اللزوجة</h4>
<p>بتتقّل المستحضر عشان <b>يفضل ملامس فترة أطول</b>: على الجلد في المحاليل الموضعية، أو في العين في القطرات. أمثلة: <b>povidone</b> و<b>hydroxyethylcellulose</b> و<b>carbomer (Carbopol)</b>.</p>

<h4>4. المواد الحافظة (مضادات الميكروبات)</h4>
<p>فيه استراتيجيتين مع بعض: <b>نقلل دخول التلوث</b>، و<b>نضيف مادة حافظة</b> للمنتج النهائي.</p>
<h5>مصادر التلوث</h5>
<ol>
<li><b>الأجهزة</b>: تكون بسيطة، بأقل وصلات وصمامات ومضخات عشان تتنضف في مكانها.</li>
<li><b>المواد الخام</b>: المواد من أصل طبيعي والماء بيبقى فيهم ميكروبات. ممكن نقلل الحمل الميكروبي بالإشعاع المؤين، أو الميكروويف، أو الغازات، أو الحرارة.</li>
<li><b>العاملين</b>: تدريب على النظافة، ولبس واقي (غطا راس، ماسك، أوفرول، جوانتي، بوت) يحمي المنتج من الجلد والنفس.</li>
</ol>
<h5>المادة الحافظة المثالية</h5>
<ol><li>فعّالة ضد <b>ميكروبات كتير</b>؛</li><li><b>ثابتة</b> طول مدة الصلاحية؛</li><li><b>مش سامة</b>؛</li><li><b>ما بتعملش حساسية ولا تهييج</b>؛</li><li><b>متوافقة</b> مع باقي المكونات؛</li><li><b>من غير طعم ولا ريحة</b>.</li></ol>
<p>ولما نختار، نتأكد إنها ما بتـ<b>لزقش في العبوة</b>، وإن <b>الـ pH</b> بتاع المنتج ما بيضعفهاش، وإنها ما بتـ<b>تفاعلش</b> مع مكونات تانية.</p>
<div class="pearl"><strong>عدم توافق مشهور:</strong> الـ <b>parabens</b> بتتحبس جوه الـ micelles بتاعة بعض الـ <b>non-ionic surfactants</b> (زي Tweens). وهي محبوسة ما بتوصلش للميكروبات فبتفقد نشاطها.</div>
<p>ممكن تتستخدم لوحدها أو مع بعض. أمثلة:</p>
<ul>
<li><b>أحماض عضوية وإسترات</b>: <b>benzoic acid من 0.1 لـ 0.2%</b>.</li>
<li><b>Parabens 0.1%</b>: <b>methyl paraben</b> (بيدوب في الماء) و<b>propyl paraben</b> (ما بيدوبش في الماء).</li>
<li><b>كحول أكتر من 20%</b>.</li>
</ul>

<h4>5. مضادات الأكسدة</h4>
<p>مهمة لـ<b>الفيتامينات والزيوت العطرية وتقريبًا كل الدهون والزيوت</b> لأنها بتتأكسد. الأكسدة بتبدأ بـ<b>الحرارة والضوء والمعادن الثقيلة</b>. فيه 5 طرق نبطّأها:</p>
<ol>
<li><b>Chelating agents</b> بتمسك آثار المعادن: <b>EDTA</b>.</li>
<li><b>مضادات أكسدة (عوامل مختزلة)</b> بتتأكسد بدل الدوا:
<ul><li>في المستحضرات <b>غير المائية</b> (الزيتية): <b>tocopherols (فيتامين E) و BHA و BHT</b>؛</li>
<li>في المستحضرات <b>المائية</b>: <b>ascorbic acid (فيتامين C)</b>.</li></ul></li>
<li>نبدّل الهوا في <b>الفراغ اللي فوق</b> المستحضر (زي أمبولات الحقن) بـ<b>النيتروجين</b> أو غاز خامل.</li>
<li>نخزّن الأدوية اللي بتتأكسد في <b>مكان بارد</b>.</li>
<li>نستخدم <b>عبوات مانعة للضوء</b>.</li>
</ol>

<h4>6. المحليات</h4>
<ul>
<li><b>السكروز</b>، الاختيار التقليدي: <b>من غير لون</b>، <b>بيدوب جدًا في الماء</b>، <b>ثابت من pH 4 لـ 8 تقريبًا</b>.</li>
<li><b>Polyhydric alcohols</b>: <b>sorbitol و mannitol</b>، وبدرجة أقل <b>الجلسرين</b>.</li>
<li><b>المحليات الصناعية</b>: أملاح الصوديوم أو الكالسيوم للـ <b>saccharin</b>. بتتستخدم مع السكر عشان تزوّد الحلاوة، أو لوحدها للي لازم يقللوا السكر (<b>مرضى السكر</b>). تركيزها <b>أقل من 0.2%</b>. بتدوب كويس وثابتة على مدى pH واسع. وأقل استخدامًا: <b>aspartame</b> و<b>sodium cyclamate</b>.</li>
<li><b>عيب المحليات الصناعية</b>: <b>طعم مر أو معدني بعدها</b>، وعشان كده غالبًا بتتخلط بالسكر.</li>
</ul>

<h4>7. النكهات والعطور</h4>
<p>مع المحليات بتخلي المنتج <b>مستساغ</b>، وده مهم جدًا لأدوية الأطفال. والنكهات كمان بتساعد <b>نميّز</b> المنتجات السائلة.</p>
<ul>
<li><b>طبيعية</b> (عصاير فواكه، زيوت عطرية). عيوبها: <b>توفرها مش ثابت</b>، و<b>تركيبها الكيميائي بيختلف</b>، و<b>بتتلوث بالميكروبات بسهولة</b>.</li>
<li><b>صناعية</b>: <b>أرخص، متوفرة أكتر، تركيبها ثابت أكتر، وأثبت</b>. بتيجي محاليل كحولية أو مائية أو بودرة.</li>
</ul>
<p><b>نكهات ليها تأثير مزدوج:</b> أدوية سوء الهضم غالبًا بنكهة <b>النعناع</b> لأن النعناع نفسه <b>طارد للغازات</b>. والـ <b>menthol</b> وزيت النعناع بيخفوا الطعم الوحش بتأثير <b>مخدّر</b> خفيف على مستقبلات التذوق.</p>
<div class="tblwrap"><table><tr><th>Taste to mask</th><th>Suitable flavour</th></tr>
<tr><td>Salty</td><td>Apricot, liquorice, peach, vanilla</td></tr>
<tr><td>Bitter</td><td>Anise, chocolate, mint, wild cherry</td></tr>
<tr><td>Sweet</td><td>Vanilla, fruits, berries</td></tr>
<tr><td>Sour</td><td>Citrus fruits, liquorice, raspberry</td></tr></table></div>
<p>يعني: <b>المالح</b> نخفيه بالمشمش والعرقسوس والخوخ والفانيليا؛ <b>المر</b> باليانسون والشوكولاتة والنعناع والكريز البري؛ <b>الحامض</b> بالموالح والعرقسوس والتوت. و<b>مقوّيات النكهة</b>: حمض الستريك (لنكهات الموالح) والجلايسين.</p>

<h4>8. الألوان</h4>
<p>بنلوّن المنتج عشان:</p>
<ol>
<li>اللون يناسب النكهة (أحمر للكريز)، فيبقى <b>شكله أحلى</b>.</li>
<li><b>التمييز</b>، خصوصًا للمواد <b>السامة</b>.</li>
<li>نفرّق بين <b>المحاليل المطهرة</b> الكتير في المستشفيات (للجلد والأدوات والسرنجات).</li>
<li>نـ<b>خفي لون ناتج تكسير</b> ما بيأثرش على استخدام المنتج.</li>
</ol>
<p><b>الألوان الطبيعية</b> مقبولة أكتر، بس بتختلف وأقل ثباتًا. و<b>الصبغات الصناعية</b> بتدي ألوان <b>أزهى</b> و<b>أثبت</b> غالبًا.</p>

<h4>9. المحلول الثابت لازم يحافظ على إيه؟</h4>
<p>طول مدة صلاحيته لازم يفضل محافظ على <b>الرواق، والريحة، واللون، والطعم، واللزوجة، والـ pH</b>.</p>

<h4>10. تقسيم المحاليل</h4>
<ul>
<li><b>مائية</b> (ماء أو ماء عطري). <b>داخلي</b>: ORS، محلول sodium citrate–citric acid، شراب، لينكتس، draughts. <b>خارجي</b>: لوشن، douches، حقن شرجية، غرغرة، غسول فم، محاليل أنف وودن، mucilages.</li>
<li><b>غير مائية</b> (كحول، جلسرين، زيوت، إيثر). <b>داخلي</b>: elixirs، spirits، tinctures، oleovitamins، glycerites. <b>خارجي</b>: liniments، collodions.</li>
</ul>

<h4>11. المحاليل الفموية</h4>
<p>محاليل شكلها وطعمها حلو للاستخدام بالفم، غالبًا فيها نكهة ولون، وممكن فيها buffers ومواد حافظة ومضادات أكسدة ومحليات.</p>
<p><b>الجرعات المعتادة:</b> <b>5 مل</b> (معلقة صغيرة)، <b>10 مل</b> (معلقة حلو)، <b>15 مل</b> (معلقة كبيرة)، أو نقط بـ<b>قطّارة معايرة</b>.</p>
<h5>منتجات جرعتها كبيرة بشكل غير معتاد</h5>
<ul>
<li><b>محلول معالجة الجفاف (ORS)</b>: بيعوّض الماء والأملاح ويحافظ عليهم في <b>الجفاف البسيط والمتوسط</b>. في اللتر: <b>45 mEq صوديوم، 20 بوتاسيوم، 35 كلوريد، 30 سترات، و 25 جم دكستروز</b>.</li>
<li><b>محلول Magnesium citrate</b> ("citrate of magnesia"): <b>ملين ملحي</b>، والجرعة المعتادة للكبار <b>200 مل</b>.</li>
<li><b>محلول Sodium citrate و citric acid</b>: <b>بيقلوِن الجسم</b> وبيخلي البول قلوي في مرضى <b>حصوات الكلى</b> و<b>النقرس</b>، لأن الـ urates بتتبلور في البول الحمضي.</li>
</ul>

<h4>12. الشراب (Syrups)</h4>
<p>الـ <b>syrups</b> محاليل مائية مركّزة أو شبه مشبعة بالسكر أو بديله، فيها أو مفيهاش نكهات وأدوية. السكروز ممكن يتبدّل كله أو جزء منه بـ:</p>
<ul>
<li><b>الدكستروز</b>.</li>
<li>مواد <b>glycogenic</b> (بتتحول لجلوكوز في الجسم): sorbitol و glycerin و propylene glycol. <b>مش مناسبة لمرضى السكر.</b></li>
<li>مواد <b>non-glycogenic</b> (مشتقات السليلوز): ما بتتحللش ولا بتتمتص، فممتازة كـ vehicle شبه الشراب لـ<b>مرضى السكر</b>.</li>
</ul>
<h5>الشراب الصناعي لمرضى السكر</h5>
<div class="formula">Artificial simple syrup = sodium CMC 1.5% + saccharin sodium 0.6%</div>
<p>الـ <b>sodium CMC</b> بيدي اللزوجة بتاعة الشراب. والـ <b>saccharin sodium</b> أحلى من السكروز <b>300–550 مرة</b> بس طعمه مر.</p>
<h5>الشراب محتاج مادة حافظة؟</h5>
<p><b>الشراب المشبع تقريبًا بالسكروز مش محتاج</b> لو اتخزّن صح. تقريبًا كل الماء مربوط بالسكر، فمفيش <b>ماء حر</b> الميكروبات تعيش فيه. وكمية المادة الحافظة بتعتمد على كمية الماء الحر. ولو محتاجين: <b>مشتقات benzoic acid من 0.1 لـ 0.2%</b> أو <b>parabens 0.1%</b>.</p>
<div class="pearl"><strong>فخ الكحول:</strong> الكحول في الشراب ممكن يبقى مذيب ومادة حافظة، بس <b>تحت 15–20% ما بيحفظش</b>.</div>

<h4>13. اللينكتس (Linctuses)</h4>
<ul>
<li>مستحضرات لزجة، غالبًا لـ<b>الكحة</b>.</li>
<li>محلول بسيط للدوا في <b>تركيز عالي من السكروز</b>، بيتاخد بمضاعفات الـ 5 مل.</li>
<li>لازم <b>يتشرب ببطء</b> و<b>ما يتخففش</b>: الشراب التقيل بيغطي الزور ويدي تأثير مهدّئ (<b>demulcent</b>) على الأغشية. التخفيف هيبوّظ ده.</li>
<li>لمرضى السكر السكروز بيتبدّل بمحليات صناعية.</li>
</ul>

<p>Lecture 4 covered aqueous solutions taken by mouth. Lecture 5 completes the map of solutions: first <b>aqueous solutions for external use</b> (lotions, douches, enemas, nasal and ear preparations), then <b>non-aqueous solutions</b>, the solvents they use, and the non-aqueous products for external use (liniments and collodions).</p>

<h4>Part A: aqueous preparations for external use</h4>
<h5>1. Lotions</h5>
<ul>
<li><b>Low-viscosity</b> topical preparations for the <b>skin</b>, applied <b>without friction</b> (unlike liniments, which are rubbed in).</li>
<li>Can be solutions, suspensions or emulsions. Example: <b>calamine lotion</b> (Calamine Topical Suspension USP).</li>
<li>May contain a <b>humectant</b> such as <b>glycerin</b>, to keep moisture on the skin, or <b>alcohol</b>, which evaporates quickly, giving a <b>cooling effect</b> and leaving the skin dry.</li>
</ul>
<h5>2. Douches</h5>
<p>Aqueous solutions <b>directed against a part, or into a cavity, of the body</b> as a stream, for <b>cleansing or antiseptic</b> purposes. The word also names the device that delivers the stream.</p>
<ul>
<li><b>Eye douches</b>: remove foreign particles and discharges from the eyes.</li>
<li><b>Pharyngeal douches</b>: prepare the inside of the throat for operations and cleanse it.</li>
<li><b>Vaginal douches</b>: the most common type, for irrigation and hygiene. Supplied as <b>liquid concentrates or powders</b> to be diluted or dissolved in warm water before use.</li>
</ul>
<p>Vaginal douche components:</p>
<ul>
<li><b>Astringents</b>: potassium alum, ammonium alum.</li>
<li><b>Antimicrobials</b>: povidone-iodine.</li>
<li><b>Anaesthetics or antipruritics</b>: phenol derivatives, menthol.</li>
<li><b>Aromatics</b>: methyl salicylate, thymol, menthol.</li>
<li><b>Detergents</b>: sodium lauryl sulfate.</li>
<li><b>pH-adjusting salts (buffers)</b>: sodium citrate, sodium chloride, bicarbonate.</li>
</ul>
<h5>3. Enemas</h5>
<p>Rectal injections, used for three purposes:</p>
<ol>
<li><b>Evacuation enemas</b> clean the bowel in constipation, or before surgery or childbirth.
<ul><li><b>Plain water 0.5–1 L</b> stimulates peristalsis.</li>
<li>Small-volume <b>~130 mL</b> enemas (<b>magnesium sulfate</b> or <b>phosphate</b> buffer) draw water into the bowel.</li>
<li>Enemas with <b>glycerol, sodium citrate and sodium lauryl sulphoacetate</b> lubricate and soften impacted faeces.</li></ul></li>
<li><b>Retention enemas</b> are kept in the rectum for a drug effect:
<ul><li><b>Local</b>: <b>hydrocortisone</b> or <b>sulfasalazine</b> for <b>ulcerative colitis</b>.</li>
<li><b>Systemic</b>: <b>aminophylline</b> (asthma) and <b>chloral hydrate</b> (sedative). Blood levels are reached within about <b>30 minutes</b>.</li>
<li>They may also be anthelmintic, nutritive, sedative or stimulating.</li></ul></li>
<li><b>Diagnostic enemas</b> contain a <b>radiopaque</b> substance, <b>barium sulfate</b>, for X-ray examination of the large intestine.</li>
</ol>
<div class="pearl"><strong>Why no more than 150 mL for a retention enema in adults?</strong> A larger volume distends the rectum and triggers the defecation reflex, so the enema is expelled before the drug acts. The purpose is to <b>retain</b> it.</div>
<h5>4. Nasal solutions</h5>
<p>Aqueous solutions given into the nose as <b>drops or sprays</b>, for:</p>
<ul>
<li><b>Local</b> sympathomimetic (decongestant, astringent) effect: <b>ephedrine</b>.</li>
<li><b>Systemic</b> action: <b>calcitonin</b> for osteoporosis.</li>
</ul>
<p><b>Nasal decongestant solutions</b> are made to resemble nasal secretions:</p>
<ul>
<li><b>Isotonic</b> with nasal fluid (0.9% NaCl).</li>
<li><b>Buffered at pH 5.5–6.5</b>, for drug stability and to protect the <b>nasal cilia</b> so normal ciliary action continues.</li>
<li>Stabilised and preserved as needed.</li>
<li>Used for the common cold, allergic rhinitis (hay fever) and sinusitis.</li>
</ul>
<p><b>Disadvantage:</b> prolonged use causes chronic swelling of the nasal mucosa, <b>rhinitis medicamentosa</b> (rebound congestion), which makes the very symptom they treat worse. They should be used for <b>no more than 3–5 days</b>, without exceeding the recommended dose and frequency.</p>
<h5>5. Otic (ear, aural) solutions</h5>
<p>Placed in the ear canal as drops or small amounts. Uses: (1) removing excess <b>cerumen</b> (ear wax); (2) treating ear <b>infection, inflammation or pain</b>.</p>
<ul>
<li><b>Anti-infectives</b>: chloramphenicol, neomycin, nystatin.</li>
<li><b>Anti-inflammatories</b>: hydrocortisone, dexamethasone.</li>
<li><b>Analgesics</b>: antipyrine with the local anaesthetic benzocaine.</li>
</ul>
<p><b>Why use anhydrous glycerin or propylene glycol as the vehicle?</b></p>
<ul>
<li>They are <b>viscous</b>, so the drug stays in contact with ear tissue for longer.</li>
<li>They are <b>hygroscopic</b>: (1) they take up moisture, leaving less for microbes, so less microbial growth; (2) they draw fluid out of swollen tissue, which <b>reduces inflammation</b>.</li>
</ul>

<h4>Part B: non-aqueous solutions</h4>
<h5>Why use a non-aqueous solvent?</h5>
<ol>
<li>A good solvent for <b>water-insoluble drugs</b> under all storage conditions.</li>
<li>Better <b>stability</b>: no water, so <b>no hydrolysis</b>.</li>
<li><b>Depot therapy</b>: an oily solution injected <b>intramuscularly</b> stays as a separate pool in the muscle and releases the drug slowly by partitioning into surrounding tissue. Example: <b>testosterone and estradiol esters</b> in oil.</li>
</ol>
<p>Three groups: <b>(1) alcoholic or hydroalcoholic</b>, <b>(2) oleaginous (oily)</b>, <b>(3) ethereal</b> (e.g. collodion).</p>
<h5>Ethanol (a monohydric alcohol)</h5>
<p><b>Advantages:</b></p>
<ul>
<li>It <b>dissolves</b> the active constituents of plants (resins, volatile oils, alkaloids, glycosides) but <b>not</b> the inert ones (gums, albumin, starch). This selectivity makes it ideal for <b>extracting crude drugs</b>.</li>
<li>A <b>co-solvent</b> with water for non-electrolytes. Water–alcohol mixtures are <b>hydroalcoholic</b> solutions: <b>elixirs, spirits, tinctures</b>.</li>
<li><b>Above 15–20%</b> it is antimicrobial (a <b>preservative</b>), alone or with parabens, benzoates or sorbates.</li>
<li>On the skin it <b>evaporates rapidly</b> with a <b>cooling</b> effect (e.g. salicylic acid lotion).</li>
</ul>
<p><b>Main disadvantage: toxicity</b> orally and parenterally, so only low concentrations are used. The FDA proposed that OTC oral products limit alcohol and carry warnings:</p>
<div class="tblwrap"><table><tr><th>Patient</th><th>Max alcohol in OTC oral products</th></tr>
<tr><td>Children under 6</td><td><b>0.5%</b></td></tr>
<tr><td>Children 6–12</td><td><b>5%</b></td></tr>
<tr><td>Over 12 and adults</td><td><b>10%</b></td></tr></table></div>
<p><b>Incompatibilities in hydroalcoholic solutions (elixirs, tinctures):</b></p>
<ul>
<li>Alcohol <b>precipitates</b> tragacanth, acacia, agar and inorganic salts from aqueous solution.</li>
<li><b>Adding water</b> to an alcoholic solution dilutes the alcohol, so the drug may partly <b>precipitate</b>.</li>
</ul>
<h5>Glycerin and propylene glycol (polyhydric alcohols)</h5>
<ul>
<li><b>Glycerin</b> has <b>three</b> OH groups: a clear, syrupy, sweet liquid. <b>Propylene glycol</b> has <b>two</b>.</li>
<li>Uses: <b>preservative, stabiliser, auxiliary solvent</b> (with water or alcohol), <b>viscosity enhancer</b>, and in many internal preparations.</li>
<li>Glycerin dissolves fixed oils, vegetable oils, pepsin and tannin.</li>
<li><b>Disadvantages</b>: <b>not selective</b> (it also dissolves gums, starch and soluble carbohydrates), and its <b>high viscosity</b> makes solutes dissolve slowly unless it is warmed.</li>
</ul>
<h5>Oleaginous solvents: fixed vegetable oils</h5>
<p>Used for <b>hydrophobic</b> drugs and drugs that <b>hydrolyse</b> in water.</p>
<ul>
<li><b>Almond oil</b>: solvent for <b>oily phenol injections</b>, used to block nerves in severe pain and for haemorrhoids. Water is unsuitable because <b>aqueous phenol is caustic</b>.</li>
<li><b>Olive, sesame, maize, cottonseed, soya, arachis and castor oils</b>: suitable for <b>parenteral depot</b> injections.</li>
<li><b>Coconut oil</b>: for <b>oral antibiotics</b>.</li>
<li>Fixed oils are good oral solvents because they are <b>tasteless and odourless</b>, e.g. for <b>vitamins A and D</b>.</li>
<li>Oils feel unpleasant on the skin unless presented as an <b>emulsion</b>.</li>
</ul>
<p>Internal non-aqueous preparations (<b>elixirs, spirits, tinctures, glycerites</b>) are studied in the practical sessions.</p>

<h4>Part C: non-aqueous preparations for external use</h4>
<h5>1. Liniments</h5>
<p>Solutions or mixtures of substances in <b>oil</b>, in <b>alcoholic soap solutions</b>, or as emulsions, applied <b>with rubbing</b>.</p>
<ul>
<li><b>Alcoholic liniments</b>: <b>rubefacient</b> (redden the skin by increasing blood flow), <b>counter-irritant</b>, mildly astringent, and penetrating.</li>
<li><b>Oily liniments</b>: milder; they penetrate poorly, so they're mainly used for <b>massage</b>.</li>
<li><b>Never apply to injured or broken skin.</b></li>
</ul>
<h5>2. Collodions</h5>
<ul>
<li>Clear or slightly opalescent viscous liquids of <b>pyroxylin (nitrocellulose) 4% w/v</b> in <b>alcohol/ether</b> or <b>alcohol/acetone</b> (1:3), with or without drugs.</li>
<li>For <b>external use only</b>, applied with a fine brush.</li>
<li>The solvent evaporates quickly, leaving a <b>pyroxylin film</b> that forms an <b>occlusive protective coating</b>. It can hold the edges of a small incised wound together.</li>
<li>Drawback: the plain film is <b>inflexible</b> and uncomfortable.</li>
</ul>
<p><b>Special types:</b></p>
<ul>
<li><b>Flexible collodion</b> = collodion + <b>2% camphor</b> + <b>3% castor oil</b>. The <b>castor oil adds flexibility</b> (comfortable on moving areas such as fingers and toes); the <b>camphor makes it waterproof</b>.</li>
<li><b>Salicylic acid collodion</b> = <b>10% salicylic acid in flexible collodion</b>. It is <b>keratolytic</b>, for removing <b>corns and warts</b>. Apply <b>one drop at a time</b> to the corn, letting each dry before the next.</li>
</ul>
<div class="pearl"><strong>Exam pairs:</strong> lotion = no friction; liniment = rubbed in, not on broken skin. Castor oil = flexible; camphor = waterproof. Glycerin in ear drops = viscous + hygroscopic.</div>

<p>محاضرة 4 غطّت المحاليل المائية اللي بتتاخد بالفم. محاضرة 5 بتكمّل خريطة المحاليل: الأول <b>المحاليل المائية للاستخدام الخارجي</b> (لوشن، douches، حقن شرجية، مستحضرات الأنف والودن)، وبعدين <b>المحاليل غير المائية</b> والمذيبات اللي بتستخدمها، والمنتجات غير المائية للاستخدام الخارجي (liniments و collodions).</p>

<h4>الجزء أ: مستحضرات مائية للاستخدام الخارجي</h4>
<h5>1. اللوشن (Lotions)</h5>
<ul>
<li>مستحضرات موضعية <b>قليلة اللزوجة</b> لـ<b>الجلد</b>، بتتحط <b>من غير دعك</b> (عكس الـ liniments اللي بتتدعك).</li>
<li>ممكن تكون محلول أو معلق أو مستحلب. مثال: <b>لوشن الكالامين</b>.</li>
<li>ممكن يكون فيها <b>humectant</b> زي <b>الجلسرين</b> يحافظ على الرطوبة على الجلد، أو <b>كحول</b> بيتبخر بسرعة فيدي <b>إحساس بالبرودة</b> ويسيب الجلد ناشف.</li>
</ul>
<h5>2. الـ Douches</h5>
<p>محاليل مائية <b>بتتوجّه على جزء من الجسم أو جوه تجويف</b> على شكل تيار، لـ<b>التنظيف أو التطهير</b>. والكلمة كمان اسم الجهاز اللي بيطلّع التيار.</p>
<ul>
<li><b>Douche العين</b>: بيشيل الأجسام الغريبة والإفرازات من العين.</li>
<li><b>Douche البلعوم</b>: بيجهّز الزور من جوه للعمليات وبينضفه.</li>
<li><b>Douche المهبل</b>: الأشهر، للغسيل والنظافة. بيجي <b>سائل مركّز أو بودرة</b> بتتخفف أو تدوب في ماء دافي قبل الاستخدام.</li>
</ul>
<p>مكونات الـ douche المهبلي:</p>
<ul>
<li><b>قابضات</b>: potassium alum و ammonium alum.</li>
<li><b>مضادات ميكروبات</b>: povidone-iodine.</li>
<li><b>مخدر أو مضاد حكة</b>: مشتقات الفينول، المنثول.</li>
<li><b>مواد عطرية</b>: methyl salicylate و thymol و menthol.</li>
<li><b>منظفات</b>: sodium lauryl sulfate.</li>
<li><b>أملاح لظبط الـ pH (buffer)</b>: sodium citrate و sodium chloride و bicarbonate.</li>
</ul>
<h5>3. الحقن الشرجية (Enemas)</h5>
<p>حقن في المستقيم، ليها 3 أغراض:</p>
<ol>
<li><b>Evacuation enema</b>: لتنضيف الأمعاء في الإمساك، أو قبل عملية أو ولادة.
<ul><li><b>ماء عادي من نص لتر لـ لتر</b> بيحرّك الـ peristalsis.</li>
<li>حقن صغيرة <b>حوالي 130 مل</b> (<b>magnesium sulfate</b> أو <b>phosphate</b> buffer) بتسحب ماء للأمعاء.</li>
<li>حقن فيها <b>glycerol و sodium citrate و sodium lauryl sulphoacetate</b> بتزيّت وتليّن البراز المتحجر.</li></ul></li>
<li><b>Retention enema</b>: بتفضل في المستقيم عشان الدوا يشتغل:
<ul><li><b>موضعي</b>: <b>hydrocortisone</b> أو <b>sulfasalazine</b> للـ<b>قولون التقرحي</b>.</li>
<li><b>جهازي</b>: <b>aminophylline</b> (للربو) و<b>chloral hydrate</b> (مهدّئ). مستوى الدم بيوصل خلال حوالي <b>30 دقيقة</b>.</li>
<li>وممكن تكون طاردة للديدان، أو مغذية، أو مهدّئة، أو منشّطة.</li></ul></li>
<li><b>Diagnostic enema</b>: فيها مادة <b>معتمة للأشعة</b>، <b>barium sulfate</b>، لفحص الأمعاء الغليظة بالأشعة.</li>
</ol>
<div class="pearl"><strong>ليه الـ retention enema ما تزيدش عن 150 مل للكبار؟</strong> الحجم الأكبر بيمدد المستقيم ويشغّل انعكاس التبرز، فالحقنة تطلع قبل ما الدوا يشتغل. والهدف إنها <b>تفضل جوه</b>.</div>
<h5>4. محاليل الأنف</h5>
<p>محاليل مائية بتتحط في الأنف <b>نقط أو بخاخ</b>، لـ:</p>
<ul>
<li>تأثير <b>موضعي</b> sympathomimetic (مزيل احتقان، قابض): <b>ephedrine</b>.</li>
<li>تأثير <b>جهازي</b>: <b>calcitonin</b> لهشاشة العظام.</li>
</ul>
<p><b>محاليل إزالة احتقان الأنف</b> بتتعمل شبه إفرازات الأنف:</p>
<ul>
<li><b>Isotonic</b> مع سوائل الأنف (0.9% NaCl).</li>
<li><b>Buffered عند pH من 5.5 لـ 6.5</b> عشان ثبات الدوا وحماية <b>الأهداب</b> في الأنف فتفضل شغالة طبيعي.</li>
<li>متثبّتة ومحفوظة حسب الحاجة.</li>
<li>بتتستخدم للبرد، والحساسية (hay fever)، والجيوب الأنفية.</li>
</ul>
<p><b>العيب:</b> الاستخدام الطويل بيعمل تورّم مزمن في غشاء الأنف، اسمه <b>rhinitis medicamentosa</b> (احتقان ارتدادي)، فبيزوّد العَرَض اللي بتعالجه. لازم تتستخدم <b>3–5 أيام بالكتير</b>، ومن غير ما نزوّد الجرعة أو عدد المرات.</p>
<h5>5. محاليل الودن (Otic)</h5>
<p>بتتحط في قناة الودن نقط أو كميات صغيرة. استخداماتها: (1) شيل <b>الشمع (cerumen)</b> الزيادة؛ (2) علاج <b>العدوى أو الالتهاب أو الألم</b> في الودن.</p>
<ul>
<li><b>مضادات عدوى</b>: chloramphenicol و neomycin و nystatin.</li>
<li><b>مضادات التهاب</b>: hydrocortisone و dexamethasone.</li>
<li><b>مسكنات</b>: antipyrine مع المخدر الموضعي benzocaine.</li>
</ul>
<p><b>ليه بنستخدم جلسرين أو بروبيلين جليكول لا مائي كـ vehicle؟</b></p>
<ul>
<li><b>لزجين</b>، فالدوا يفضل ملامس لأنسجة الودن مدة أطول.</li>
<li><b>بيمتصوا الرطوبة (hygroscopic)</b>: (1) بياخدوا الرطوبة فالميكروبات ما تلاقيش ماء فتقل؛ (2) بيسحبوا السوائل من النسيج المتورم فـ<b>الالتهاب يقل</b>.</li>
</ul>

<h4>الجزء ب: المحاليل غير المائية</h4>
<h5>ليه نستخدم مذيب غير مائي؟</h5>
<ol>
<li>مذيب كويس للأدوية <b>اللي ما بتدوبش في الماء</b> في كل ظروف التخزين.</li>
<li><b>ثبات</b> أحسن: مفيش ماء يعني <b>مفيش hydrolysis</b>.</li>
<li><b>Depot therapy</b>: المحلول الزيتي لما يتحقن <b>في العضل</b> بيفضل بركة منفصلة ويطلّع الدوا ببطء للأنسجة اللي حواليه. مثال: <b>إسترات التستوستيرون والإستراديول</b> في زيت.</li>
</ol>
<p>3 مجموعات: <b>(1) كحولية أو مائية كحولية</b>، <b>(2) زيتية</b>، <b>(3) إيثرية</b> (زي collodion).</p>
<h5>الإيثانول (كحول أحادي الهيدروكسيل)</h5>
<p><b>المميزات:</b></p>
<ul>
<li><b>بيدوّب</b> المواد الفعالة في النبات (resins، زيوت طيارة، alkaloids، glycosides) و<b>ما بيدوّبش</b> المواد الخاملة (صموغ، ألبومين، نشا). الانتقائية دي بتخليه مثالي لـ<b>استخلاص الأدوية الخام</b>.</li>
<li><b>Co-solvent</b> مع الماء للمواد اللي مش electrolytes. وخليط الماء والكحول اسمه <b>hydroalcoholic</b>: <b>elixirs و spirits و tinctures</b>.</li>
<li><b>فوق 15–20%</b> بيقتل الميكروبات (<b>مادة حافظة</b>)، لوحده أو مع parabens أو benzoates أو sorbates.</li>
<li>على الجلد <b>بيتبخر بسرعة</b> ويدي <b>برودة</b> (زي salicylic acid lotion).</li>
</ul>
<p><b>العيب الأساسي: السُمّية</b> بالفم والحقن، فبيتستخدم بتركيزات قليلة. والـ FDA اقترحت إن منتجات الفم اللي بتتباع من غير روشتة تحدد الكحول وتكتب تحذيرات:</p>
<div class="tblwrap"><table><tr><th>Patient</th><th>Max alcohol, OTC oral</th></tr>
<tr><td>Under 6</td><td>0.5%</td></tr>
<tr><td>6–12</td><td>5%</td></tr>
<tr><td>Over 12 and adults</td><td>10%</td></tr></table></div>
<p><b>عدم التوافق في المحاليل المائية الكحولية (elixirs و tinctures):</b></p>
<ul>
<li>الكحول بيـ<b>رسّب</b> الـ tragacanth والـ acacia والـ agar والأملاح غير العضوية من المحلول المائي.</li>
<li><b>إضافة ماء</b> لمحلول كحولي بتخفف الكحول، فالدوا ممكن جزء منه <b>يترسب</b>.</li>
</ul>
<h5>الجلسرين والبروبيلين جليكول (كحولات متعددة الهيدروكسيل)</h5>
<ul>
<li><b>الجلسرين</b> فيه <b>3</b> مجموعات OH: سائل رايق تقيل وطعمه حلو. و<b>البروبيلين جليكول</b> فيه <b>2</b>.</li>
<li>الاستخدامات: <b>مادة حافظة، مثبّت، مذيب مساعد</b> (مع الماء أو الكحول)، <b>مزوّد لزوجة</b>، وفي مستحضرات داخلية كتير.</li>
<li>الجلسرين بيدوّب الزيوت الثابتة والنباتية والـ pepsin والـ tannin.</li>
<li><b>العيوب</b>: <b>مش انتقائي</b> (بيدوّب كمان الصموغ والنشا والكربوهيدرات الذايبة)، و<b>لزوجته العالية</b> بتخلي المواد تدوب ببطء إلا لو سخّناه.</li>
</ul>
<h5>المذيبات الزيتية: الزيوت النباتية الثابتة</h5>
<p>للأدوية <b>الكارهة للماء</b> والأدوية اللي <b>بتتحلل</b> في الماء.</p>
<ul>
<li><b>زيت اللوز</b>: مذيب لـ<b>حقن الفينول الزيتية</b> اللي بتعمل block للأعصاب في الألم الشديد وللبواسير. الماء مش مناسب لأن <b>الفينول المائي كاوي</b>.</li>
<li><b>زيت الزيتون والسمسم والدرة وبذرة القطن والصويا والفول السوداني والخروع</b>: مناسبة لـ<b>حقن الـ depot</b>.</li>
<li><b>زيت جوز الهند</b>: لـ<b>المضادات الحيوية بالفم</b>.</li>
<li>الزيوت الثابتة مذيبات كويسة بالفم لأنها <b>من غير طعم ولا ريحة</b>، زي لـ<b>فيتامين A و D</b>.</li>
<li>الزيوت إحساسها وحش على الجلد إلا لو في شكل <b>مستحلب</b>.</li>
</ul>
<p>المستحضرات غير المائية الداخلية (<b>elixirs و spirits و tinctures و glycerites</b>) بتتدرس في العملي.</p>

<h4>الجزء ج: مستحضرات غير مائية للاستخدام الخارجي</h4>
<h5>1. الـ Liniments</h5>
<p>محاليل أو خلطات مواد في <b>زيت</b>، أو في <b>محلول صابون كحولي</b>، أو مستحلبات، وبتتحط <b>بالدعك</b>.</p>
<ul>
<li><b>Liniments كحولية</b>: <b>rubefacient</b> (بتحمّر الجلد بزيادة الدم)، و<b>counter-irritant</b>، وقابضة خفيفة، وبتخترق.</li>
<li><b>Liniments زيتية</b>: أخف؛ ما بتخترقش كويس، فأساسًا للـ<b>مساج</b>.</li>
<li><b>أبدًا ما تتحطش على جلد مجروح أو مفتوح.</b></li>
</ul>
<h5>2. الـ Collodions</h5>
<ul>
<li>سوائل لزجة رايقة أو معتمة شوية من <b>pyroxylin (nitrocellulose) 4%</b> في <b>كحول/إيثر</b> أو <b>كحول/أسيتون</b> (1:3)، فيها أو مفيهاش دوا.</li>
<li><b>للاستخدام الخارجي بس</b>، بتتحط بفرشة رفيعة.</li>
<li>المذيب بيتبخر بسرعة ويسيب <b>طبقة pyroxylin</b> بتعمل <b>غطا حماية محكم</b>، وممكن تمسك أطراف جرح صغير مقفولة.</li>
<li>العيب: الطبقة العادية <b>مش مرنة</b> ومش مريحة.</li>
</ul>
<p><b>أنواع خاصة:</b></p>
<ul>
<li><b>Flexible collodion</b> = collodion + <b>2% كافور</b> + <b>3% زيت خروع</b>. <b>زيت الخروع بيدي مرونة</b> (مريح على الأماكن اللي بتتحرك زي الصوابع)، و<b>الكافور بيخليه ضد الماء</b>.</li>
<li><b>Salicylic acid collodion</b> = <b>10% salicylic acid في flexible collodion</b>. <b>Keratolytic</b> لإزالة <b>الكالو والسنط</b>. بنحط <b>نقطة نقطة</b> على الكالو ونسيب كل واحدة تنشف قبل اللي بعدها.</li>
</ul>
<div class="pearl"><strong>أزواج للامتحان:</strong> لوشن = من غير دعك؛ liniment = بالدعك ومش على جلد مجروح. زيت الخروع = مرونة؛ الكافور = ضد الماء. الجلسرين في نقط الودن = لزج + بيمتص الرطوبة.</div>
`};
DEEP.dosage[6]={en:`
<p>Lecture 6 moves from true solutions to <b>colloids</b>: systems where the dissolved-looking particles are actually much larger than molecules. You need to classify disperse systems by particle size, know the three types of colloid and how they differ, explain why colloids are or aren't stable, and describe how lyophobic colloids are made and purified, including the artificial kidney.</p>

<h4>1. Disperse systems</h4>
<p>Every disperse system has two parts: the <b>dispersed phase</b> (the particles) and the <b>dispersion medium</b>, also called the <b>continuous phase</b> (what the particles are spread through). They are classified by <b>particle size</b>:</p>
<div class="tblwrap"><table><tr><th></th><th>Molecular dispersion</th><th>Colloidal dispersion</th><th>Coarse dispersion</th></tr>
<tr><td>Size</td><td>&lt; 1 nm</td><td>1–500 nm (0.5 µm)</td><td>&gt; 500 nm</td></tr>
<tr><td>Visibility</td><td>Invisible even in the electron microscope</td><td>Not resolved by ordinary microscope; detected by <b>ultramicroscope</b> (seen by EM)</td><td>Visible under the <b>light microscope</b></td></tr>
<tr><td>Filter paper</td><td>Passes</td><td><b>Passes</b></td><td>Retained</td></tr>
<tr><td>Semipermeable membrane / ultrafilter</td><td>Passes</td><td><b>Retained</b></td><td>Retained</td></tr>
<tr><td>Diffusion</td><td>Rapid</td><td>Very slow</td><td>None</td></tr>
<tr><td>Examples</td><td>O₂ molecules, glucose (true solutions)</td><td>Colloidal silver, natural and synthetic polymers</td><td>Sand grains, emulsions, suspensions, RBCs</td></tr></table></div>
<p>Magnifying power: light microscope &lt; ultramicroscope &lt; electron microscope.</p>
<div class="pearl"><strong>Filter logic:</strong> filter paper stops only coarse particles. A semipermeable membrane lets only molecular-size particles through. Colloids sit in between: through paper, stopped by membranes. This is the basis of dialysis.</div>

<h4>2. Huge specific surface area</h4>
<p><b>Specific surface area</b> is the surface area per unit weight or volume. Colloidal particles are so small that their specific surface area is enormous, which gives them special properties:</p>
<ul>
<li><b>Platinum black</b> (colloidal platinum) is an effective <b>catalyst</b>, because catalysts work by adsorbing reactants on their surface.</li>
<li><b>Colour depends on particle size</b>: a red gold sol turns <b>blue</b> as its particles grow.</li>
</ul>
<h5>Pharmaceutical applications</h5>
<ol>
<li><b>Colloidal silver</b> (silver iodide, silver chloride, silver protein): effective <b>germicides</b> without the irritation caused by ionic silver salts.</li>
<li><b>Colloidal gold</b>: diagnostic agent and in cancer treatment.</li>
<li><b>Colloidal mercury</b>: used for syphilis.</li>
<li><b>Colloidal copper</b>: used in cancer.</li>
<li><b>Association colloids</b> (surfactants) increase the solubility and stability of compounds in aqueous and oily preparations.</li>
<li>Some substances work better in colloidal form because of their large surface area: <b>kaolin adsorbing toxins</b> in the gut; <b>aluminium hydroxide</b> as an antacid.</li>
<li><b>Plasma substitutes</b>: <b>dextran, PVP and gelatin</b> are hydrophilic colloids that restore or maintain blood volume.</li>
<li><b>Iron–dextran</b> forms non-ionic hydrophilic sols for treating <b>anaemia</b>.</li>
</ol>

<h4>3. The three types of colloid</h4>
<p>Classified by how the dispersed phase <b>interacts with the dispersion medium</b>.</p>
<h5>Lyophilic colloids ("solvent-loving")</h5>
<ul>
<li>Strong attraction between particles and medium, so they form sols <b>spontaneously</b>, just by dissolving the material.</li>
<li>The attraction causes <b>solvation</b>: a <b>solvent sheath</b> forms around each particle. When the medium is water this is <b>hydration</b> (hydrophilic colloids, e.g. <b>gelatin and acacia in water</b>). In organic solvents they're lipophilic (e.g. <b>rubber or polystyrene</b> in organic solvent).</li>
<li>Mostly <b>organic</b> macromolecules: proteins, plant gums, <b>HPMC</b>.</li>
<li>Stable because of <b>the solvent sheath plus electrical charge</b>.</li>
<li>Particles are often <b>asymmetric</b> (long chains).</li>
</ul>
<h5>Lyophobic colloids ("solvent-hating")</h5>
<ul>
<li>Very little attraction for the medium, so <b>no solvent sheath</b>.</li>
<li>Usually <b>inorganic</b> particles in water: <b>gold, silver, sulfur, arsenous sulfide, silver iodide</b>.</li>
<li>Do <b>not form spontaneously</b>: special methods are needed.</li>
<li>Particles tend to be <b>symmetric</b>.</li>
</ul>
<div class="ex"><b>The hedgehog analogy:</b> in a friendly solvent a colloidal particle "unrolls", exposing maximum surface, and its long chain makes lots of attractive contacts (lyophilic). In a hostile solvent it "rolls up" to minimise contact (lyophobic).</div>
<h5>Association (amphiphilic) colloids</h5>
<p>Made of <b>surfactant (amphiphile)</b> molecules that are individually below colloidal size. As concentration increases, above the <b>critical micelle concentration (CMC)</b>, they assemble into <b>micelles</b> of colloidal size.</p>

<h4>4. Comparing the three types</h4>
<div class="tblwrap"><table><tr><th></th><th>Lyophilic</th><th>Lyophobic</th><th>Association</th></tr>
<tr><td>Dispersed phase</td><td>Organic molecules (proteins, acacia, gelatin, cellulose derivatives)</td><td>Inorganic particles in water</td><td>Micelles of organic molecules or ions</td></tr>
<tr><td>Solvation</td><td>Solvated</td><td>Not solvated</td><td>Solvated</td></tr>
<tr><td>Formation</td><td>Spontaneous</td><td>Needs special methods</td><td>Spontaneous above the CMC</td></tr>
<tr><td>Viscosity</td><td><b>Greatly increased</b> (solvation + asymmetric shape)</td><td><b>Hardly changed</b> (unsolvated, symmetric)</td><td>Increases with concentration as micelles multiply and become asymmetric</td></tr>
<tr><td>Electrolytes</td><td>Stable; <b>salted out</b> by high concentrations (desolvation)</td><td><b>Unstable even with small amounts</b> (charge neutralised)</td><td>Electrolytes <b>lower the CMC</b>; salting out at high concentration</td></tr></table></div>

<h4>5. Why colloids are (or aren't) stable</h4>
<p>Making small particles from large ones takes work (electrical, mechanical, ultrasonic). The result is a huge surface area with <b>high surface free energy</b>. That is <b>thermodynamically unstable</b>: the particles "want" to regroup, reducing total surface area and surface energy. That clumping is <b>aggregation</b>.</p>
<p>What prevents it:</p>
<ul>
<li><b>Lyophilic</b>: the <b>solvent sheath</b>, with or without <b>surface charge</b>. Two layers of protection, which is why small amounts of electrolyte don't upset them; only large amounts strip the sheath (salting out).</li>
<li><b>Lyophobic</b>: <b>surface charge only</b>. Like-charged particles repel. Add a little electrolyte and its opposite ions <b>neutralise the charge</b>; with nothing left to keep particles apart, they <b>flocculate</b>.</li>
</ul>

<h4>6. Preparing lyophobic colloids</h4>
<h5>a) Dispersion methods (large → small)</h5>
<ol>
<li><b>Ultrasonic generator</b>: high-intensity ultrasound above <b>20,000 cycles/second</b> breaks particles apart.</li>
<li><b>Electric arc</b>: an arc struck between metal electrodes under the liquid. The intense heat vaporises some electrode metal, which then condenses into colloidal particles.</li>
<li><b>Colloid mill</b>: material is sheared between two rapidly rotating, closely spaced plates. <b>Low efficiency</b>: it reduces only a small proportion of particles.</li>
</ol>
<h5>b) Condensation methods (small → large)</h5>
<p>Sub-colloidal particles are made to grow to colloidal size.</p>
<ol>
<li><b>Supersaturation</b>, then nucleation and growth: dissolve <b>sulfur</b> in an organic solvent and pour the concentrated solution into excess water. Many small nuclei form in the supersaturated mixture and grow quickly into a <b>colloidal sulfur sol</b>.</li>
<li><b>Chemical reactions</b>:
<ul><li><b>Oxidation</b>: H₂S + oxidising agent → colloidal sulfur.</li>
<li><b>Hydrolysis</b>: boiling ferric chloride with water → red ferric oxide sol.</li>
<li>Also reduction and double decomposition.</li></ul></li>
</ol>

<h4>7. Purifying colloids</h4>
<p><b>Why?</b> Lyophobic sols often contain dissolved material, especially <b>electrolyte impurities</b>, which neutralise the particle charge and cause <b>flocculation</b>.</p>
<ol>
<li><b>Dialysis</b>: relies on the size difference between colloidal particles (the product) and molecular impurities. A <b>semipermeable membrane</b> lets small molecules and ions (glucose, urea, NaCl) pass out until equilibrium, but keeps the colloid in.</li>
<li><b>Electrodialysis</b>: an electric potential speeds up the movement of ionic impurities through the membrane. Uses a <b>three-compartment vessel</b>: water and electrodes in the two outer compartments, the sol in the middle. <b>Cations</b> move toward the <b>negative</b> electrode and <b>anions</b> toward the <b>positive</b> electrode, leaving the sol.</li>
<li><b>Ultrafiltration</b>: filtration under <b>negative pressure (suction)</b> through a membrane of very small pores (nitrocellulose or collodion), supported in a Büchner funnel on a fine wire screen. Colloids pass ordinary filter paper but are held back here, while small molecules pass through.</li>
</ol>

<h4>8. Dialysis in medicine: the artificial kidney (haemodialysis)</h4>
<ul>
<li>The patient's arterial blood flows through <b>cellophane</b> tubing, an ideal semipermeable membrane. It passes <b>urea, glucose and electrolytes</b>, but <b>not plasma proteins or blood cells</b>.</li>
<li>The cleaned blood returns to the body through a vein.</li>
<li>Success is judged by how well it <b>reduces blood urea</b>.</li>
</ul>
<p><b>The rinsing fluid (dialysate) is designed so that:</b></p>
<ul>
<li>substances in <b>excess</b> in blood (<b>urea</b>) diffuse <b>out</b> into the dialysate (dialysate has none);</li>
<li>substances <b>deficient</b> in blood (<b>bicarbonate</b>) diffuse <b>into</b> the blood (dialysate has more);</li>
<li>substances at <b>normal</b> levels (<b>glucose</b> and other useful solutes) are kept at the <b>same concentration</b> on both sides, so there's no net movement.</li>
</ul>
