const AR = {
genetics:{
1:{t:"تركيب الـ DNA وتضاعفه",h:`
<p>الـ <b>DNA</b> عبارة عن <b>حلزون مزدوج (double helix)</b> مكوَّن من شريطين <b>متعاكسين في الاتجاه (antiparallel)</b>: واحد من <bdi>5'→3'</bdi> والتاني من <bdi>3'→5'</bdi>. الهيكل (sugar–phosphate backbone) بيكون برّه، والقواعد النيتروجينية جوّه.</p>
<ul>
<li><b>Franklin</b> بالـ X-ray أثبتت إن الهيكل برّه والقواعد جوّه وإن الشكل حلزوني من شريطين.</li>
<li><b>قواعد Chargaff</b>: <bdi>A = T</bdi> و <bdi>G = C</bdi>، يعني الـ purines تساوي الـ pyrimidines. الزوج A=T بينهم <b>رابطتين هيدروجين</b>، والزوج G≡C بينهم <b>3 روابط</b> فهو أقوى بحوالي 50%.</li>
<li><b>Watson & Crick (1953)</b>: الحلزون المزدوج والشريطين المتعاكسين، والقراءة من <bdi>5'→3'</bdi>.</li>
<li>النيوكليوتيدات بتترابط بـ <b>phosphodiester bonds</b>، والقاعدة بترتبط بالسكر بـ <b>N-glycosidic bond</b>.</li>
</ul>
<p><b>الفرق في المصطلحات:</b> Nucleobase = قاعدة بس · Nucleoside = قاعدة + سكر خماسي · Nucleotide = قاعدة + سكر + فوسفات.</p>
<p><b>أشكال الـ DNA:</b> شكل B (يميني، الأشهر في الخلية)، شكل A (يميني، في حالة الجفاف)، شكل Z (يساري ونادر).</p>
<p><b>التعبئة:</b> حوالي <b>146 bp</b> بتلف حوالين 8 هستونات (histone octamer) وده اسمه <b>nucleosome</b>، وبعدين chromatin ثم chromosome.</p>
<h4>التضاعف (Replication) نصف محافظ – semiconservative</h4>
<ol>
<li><b>Origin</b>: منطقة غنية بـ AT (واحدة في البكتيريا وكتير في الـ eukaryotes)، وبيرتبط بيها DnaA ومحتاج ATP.</li>
<li><b>Helicase</b> بيفك الشريطين، و<b>SSB proteins</b> بتمنعهم يرجعوا يلزقوا، و<b>Topoisomerase</b> بيشيل الالتواء (supercoils) قدام الـ fork.</li>
<li><b>Primase</b> بيعمل <b>RNA primer</b> قصير (حوالي 10 نيوكليوتيدات).</li>
<li><b>DNA pol III</b> بيبني الشريط الجديد من <bdi>5'→3'</bdi>. الـ <b>Leading strand</b> مستمر بـ primer واحد، والـ <b>Lagging strand</b> متقطع على شكل <b>Okazaki fragments</b>.</li>
<li><b>DNA pol I</b> بيشيل الـ primers ويملا الفراغات.</li>
<li><b>Ligase</b> بيقفل الفتحات (nicks) برابطة phosphodiester.</li>
</ol>
<div class="pearl"><strong>ترتيب الامتحان:</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase</div>`},
2:{t:"مشكلة نهاية التضاعف والنسخ (Transcription)",h:`
<p>الـ DNA polymerase بيشتغل في اتجاه <bdi>5'→3'</bdi> بس ومحتاج primer، فالطرف الأخير من الـ lagging strand مش بيتنسخ. ده اسمه <b>end replication problem</b>.</p>
<ul>
<li><b>Telomeres</b> بتحمي أطراف الكروموسومات: تكرارات <bdi>TTAGGG</bdi> مع طرف بارز <bdi>3'</bdi> طوله 12–16 نيوكليوتيد. الإنسان عنده 46 كروموسوم يعني 92 تيلومير.</li>
<li><b>Telomerase</b> = بروتين + قالب RNA خاص بيه، وبيشتغل كـ <b>reverse transcriptase</b>.</li>
<li>في الخلايا العادية التيلوميراز قليل فالتيلوميرات بتقصر مع السن. في السرطان بيكون عالي، عشان كده هو هدف للأدوية. (نوبل 2009).</li>
</ul>
<h4>النسخ: من DNA إلى RNA</h4>
<p>الإنزيم بيقرا الـ <b>template (antisense) strand</b>، والـ <b>coding (sense) strand</b> نفس تسلسل الـ mRNA بس فيه T بدل U.</p>
<ul>
<li><b>RNA pol I</b>: بيعمل rRNA (ما عدا 5S).</li>
<li><b>RNA pol II</b>: بيعمل كل الـ mRNA.</li>
<li><b>RNA pol III</b>: بيعمل tRNA و 5S rRNA.</li>
</ul>
<p><b>أجزاء الجين:</b> exons (بتتترجم)، introns (مش بتتترجم، بتبدأ بـ GT وتنتهي بـ AG)، promoter فيه <b>TATA box</b> (قبل الجين بحوالي 25 bp) و <b>CAAT box</b>، و enhancers بتزوّد معدل النسخ و silencers بتقلله.</p>
<p><b>Cis-acting</b> = تسلسلات في الـ DNA نفسه. <b>Trans-acting</b> = بروتينات بترتبط بيها.</p>
<h4>المراحل</h4>
<ul>
<li><b>Initiation</b>: TFIID بيتعرف على الـ promoter، TFIIB بيوصّل لـ RNA pol II، TFIIH بيفك الشريطين ويعمل phosphorylation للـ CTD.</li>
<li><b>Elongation</b>: الإنزيم بيفك 10–20 قاعدة كل مرة.</li>
<li><b>Termination</b>: إشارة <bdi>AAUAAA</bdi> والقطع بعدها بـ 10–35 نيوكليوتيد.</li>
</ul>`},
3:{t:"معالجة الـ RNA والترجمة (Translation)",h:`
<p><b>Chromatin remodeling:</b> لما الهستونات تكون لازقة في الـ DNA الإنزيم مش بيوصل. الـ activators بتجيب <b>HAT</b> اللي بيعمل acetylation فالـ DNA يرتخي، و<b>HDAC</b> بيعكس ده.</p>
<h4>التعديلات بعد النسخ</h4>
<ul>
<li><b>Splicing</b> بالـ spliceosome (snRNPs): بيشيل الـ introns ويوصل الـ exons.</li>
<li><b>Alternative splicing</b>: جين واحد يدي أكتر من بروتين.</li>
<li><b>5' cap</b> (7-methylguanosine): بيحمي من الـ nucleases ويساعد في الخروج من النواة وارتباط الريبوسوم.</li>
<li><b>Poly-A tail</b> عند الطرف <bdi>3'</bdi>: مش موجود في الجين، بيتضاف بعد النسخ، ومسؤول عن الثبات والترجمة.</li>
</ul>
<h4>الترجمة: من mRNA إلى بروتين</h4>
<ul>
<li><b>tRNA</b> شكله L وحوالي 80 نيوكليوتيد، شايل حمض أميني و anticodon. إنزيم <b>aminoacyl-tRNA synthetase</b> بيركّب الحمض الأميني الصح.</li>
<li><b>Wobble</b>: مرونة في التزاوج في القاعدة التالتة من الكودون بس.</li>
<li><b>الريبوسوم</b>: 40% rRNA و 60% بروتين. أماكنه: A (الـ tRNA الجديد)، P (السلسلة اللي بتكبر)، E (الخروج).</li>
<li><b>البداية</b>: الوحدة الصغيرة 40S بترتبط بالـ cap وتدور على <b>AUG</b> (Met)، وبعدين 60S تنضم.</li>
<li><b>الاستطالة</b>: التعرف على الكودون ← رابطة ببتيدية ← انتقال، وبتستهلك GTP. السلسلة بتكبر من N إلى C.</li>
<li><b>النهاية</b>: stop codon في الـ A site، مفيش tRNA بيرتبط، فالببتيد بيتحرر.</li>
<li><b>Polysome</b>: ريبوسومات كتير على نفس الـ mRNA.</li>
</ul>`},
4:{t:"التعديلات بعد الترجمة والشفرة الوراثية",h:`
<p>الـ <b>PTMs</b> هي تغييرات كيميائية بتحصل للبروتين بعد ما يتصنع. عندنا حوالي 20–25 ألف جين بس بيدّوا أكتر من مليون بروتين، بسبب الـ alternative splicing والـ PTMs.</p>
<ul>
<li><b>Phosphorylation</b>: على Ser و Thr و Tyr. الـ kinases بتضيف والـ phosphatases بتشيل. بتنشّط p53 وبتثبّط acetyl-CoA carboxylase.</li>
<li><b>Hydroxylation</b>: على Pro و Lys في الكولاجين.</li>
<li><b>Acetylation</b>: على الهستونات بتقلل الشحنة الموجبة فالـ DNA يرتخي والنسخ يزيد.</li>
<li><b>Methylation</b>: على Lys (لحد 3 مرات) أو Arg (لحد مرتين)، ممكن تنشّط أو تثبّط.</li>
<li><b>Ubiquitination</b>: بتعلّم البروتين عشان يتكسر في الـ proteasome.</li>
<li><b>Proteolysis</b>: قطع، زي شيل الـ Met الأولاني أو تنشيط الـ precursors.</li>
<li><b>Carboxylation</b>: محتاجة <b>فيتامين K</b> (عوامل التجلط).</li>
</ul>
<div class="pearl"><strong>نوبل 2019 (HIF-1α):</strong> في الأكسجين الطبيعي بيحصل له hydroxylation ← VHL يتعرف عليه ← ubiquitination ← يتكسر. في نقص الأكسجين بيتراكم ويشغّل جينات زي EPO.</div>
<h4>الشفرة الوراثية</h4>
<ul>
<li>الكودون = 3 قواعد، يعني <bdi>4×4×4 = 64</bdi> كودون: 61 بيدّوا أحماض أمينية و 3 stop codons.</li>
<li><b>AUG</b> = Met وهو كودون البداية. أكتر من كودون ممكن يدّوا نفس الحمض الأميني (redundancy).</li>
<li>مثال: <bdi>AUG-GUG-CCA-CGA-AGG-UGA = Met-Val-Pro-Arg-Arg-Stop</bdi>.</li>
</ul>`},
5:{t:"تنظيم التعبير الجيني – الجزء الأول",h:`
<p><b>Constitutive genes</b>: شغالة دايمًا بمستوى ثابت. <b>Facultative genes</b>: بتشتغل في ظروف معينة بس.</p>
<p><b>Epigenetics</b>: تغيير في التعبير الجيني من غير ما تسلسل الـ DNA يتغير، وأدواته: العناصر الـ cis/trans، الـ ncRNAs، وتعديلات الهستونات.</p>
<h4>البروتينات وعناصر الـ DNA</h4>
<ul>
<li><b>C/EBPs</b>: عيلة من 6 transcription factors.</li>
<li><b>Sp1</b> بيرتبط بالـ GC box وبيجيب TFIID و RNA pol II.</li>
<li>الـ activator ليه جزء بيرتبط بالـ DNA وجزء تنظيمي، وبيجيب HAT عند الـ enhancers.</li>
</ul>
<h4>DNA methylation</h4>
<p>إضافة مجموعة ميثيل عند <b>CpG islands</b> جنب الـ promoter بتوقف النسخ بطريقتين: (1) بتمنع Sp1 يرتبط بالـ GC box، (2) بتجيب methyl-CpG binding protein + HDAC فالكروماتين يقفل. الـ CpG غير الممثيلة = جينات شغالة.</p>
<h4>Non-coding RNAs</h4>
<ul>
<li>بتتنسخ بس مش بتتترجم: miRNA و lncRNA و circRNA.</li>
<li><b>miRNA</b>: حوالي 22 نيوكليوتيد، بيتعمل كـ hairpin ويقطعه <b>Dicer</b> ويشتغل جوه <b>RISC</b>، وبيرتبط بالـ <bdi>3'UTR</bdi> فيكسّر الـ mRNA أو يوقف ترجمته.</li>
<li>نوبل 2024: Ambros و Ruvkun لاكتشاف الـ microRNA.</li>
</ul>
<div class="pearl"><strong>منطق الحالات:</strong> زيادة miRNA-181 ← نقص التيلوميراز (لأن الـ mRNA بتاعه بيتقفل).</div>`},
6:{t:"تنظيم التعبير الجيني – الجزء الثاني",h:`
<ul>
<li><b>circRNA</b>: بيتعمل بالـ back-splicing، عمره حوالي 48 ساعة (أثبت 5 مرات من الـ mRNA العادي)، وبيشتغل كـ <b>miRNA sponge</b>.</li>
<li><b>lncRNA</b>: أطول من 200 نيوكليوتيد، بيشتغل كـ guide أو scaffold أو decoy.</li>
</ul>
<div class="pearl"><strong>منطق الحالات:</strong> لو circRNA اللي بيمسك miRNA-181 قلّ ← miRNA-181 الحر يزيد ← التيلوميراز يقل.</div>
<h4>الهستونات والكروماتين</h4>
<ul>
<li>الـ octamer = 2 من كل واحد (H2A, H2B, H3, H4). الـ <b>H1</b> هو الـ linker ويدي ألياف 30 nm.</li>
<li><b>CENP-A</b> بيحل محل H3 عند الـ centromere.</li>
<li>الـ remodeling complexes بتستخدم ATP لتحريك الـ nucleosomes.</li>
<li>Acetylation للـ Lys = كروماتين نشط، deacetylation = مقفول، methylation = حسب المكان، phosphorylation للـ Ser = نشط.</li>
<li><b>Bromodomains</b> بتقرا الـ acetylation، و<b>chromodomains</b> بتقرا الـ methylation.</li>
</ul>
<h4>أمثلة وموتيفات</h4>
<ul>
<li>تمايز الخلايا: نفس الجينوم بس بروتيوم مختلف.</li>
<li>تغيير الجلوبين من الجنين للبالغ بيغيّر الألفة للأكسجين (الأعلى في الـ embryo).</li>
<li>البروتينات بتقرا الـ <b>major groove</b>. الموتيفات: helix-turn-helix (الأشهر)، zinc finger (كل ما الصوابع زادت الارتباط أقوى)، leucine zipper.</li>
</ul>`},
7:{t:"التنوع الوراثي ومشروع الجينوم البشري",h:`
<ul>
<li><b>HGP</b> بدأ أكتوبر 1990 وخلص أبريل 2003، بـ 20 مركز في 6 دول، واستخدم Sanger sequencing.</li>
<li>مسودة يونيو 2000 غطّت حوالي 90%، ونسخة 2003 حوالي 92%. أصعب الأماكن: الـ telomeres والـ centromeres لأنها متكررة جدًا.</li>
<li><b>T2T</b> في مارس 2022: أول جينوم بشري كامل فعلًا.</li>
<li>الأثر: الفحوصات الجينية، معرفة الأصول، والـ precision medicine.</li>
<li><b>مشروع الجينوم المصري (مارس 2021)</b>: جينوم مرجعي مصري، جينات الأمراض الشائعة، جينومات المصريين القدماء، والطب الشخصي.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> البشر متطابقين بنسبة 99.9%، والـ 0.1% (زي الـ SNPs) هي اللي بتحدد الصفات وخطر الأمراض.</div>`}
},
physio:{
1:{t:"سوائل الجسم والنقل عبر الغشاء وتوازن الماء",h:`
<p><b>Physiology</b> = الوظيفة الطبيعية، و<b>Pathophysiology</b> = الخلل اللي بيحصل في المرض. التنظيم: خلية ← نسيج ← عضو ← جهاز ← كائن.</p>
<h4>أنواع النقل</h4>
<ul>
<li><b>Simple diffusion</b>: من غير طاقة ومع التدرج ومن غير بروتين (O₂ و CO₂).</li>
<li><b>Facilitated diffusion</b>: من غير طاقة بس عن طريق carrier أو channel (الجلوكوز بالـ GLUT).</li>
<li><b>Primary active</b>: بيستخدم ATP مباشرة ضد التدرج، زي <b>Na⁺/K⁺-ATPase</b> (3 صوديوم برّه و 2 بوتاسيوم جوّه).</li>
<li><b>Secondary active</b>: بيستغل تدرج الصوديوم الموجود، زي نقل Na⁺ مع الجلوكوز في الأمعاء.</li>
</ul>
<h4>توازن الماء</h4>
<p>الجفاف يرفع تركيز الدم ← الـ osmoreceptors في الـ hypothalamus ← <b>ADH</b> من الـ posterior pituitary ← الكلى ترجّع ماء.</p>
<ul>
<li><b>علامات الجفاف</b>: ضغط واطي، نبض سريع، جلد وأغشية ناشفة؛ والشديد (فقد 10–15%) خمول وهذيان. كبار السن أكتر عرضة.</li>
<li><b>Hyponatremia</b>: الماء يدخل خلايا المخ ← وذمة دماغية ← تشوش وتشنجات.</li>
<li><b>Hyperkalemia</b>: بتغيّر جهد الراحة ← اضطراب نظم خطير.</li>
<li>محلول <b>hypotonic</b>: كرات الدم تنتفخ وتنفجر؛ <b>hypertonic</b>: تنكمش.</li>
</ul>`},
2:{t:"الدم وأمراض الدم",h:`
<p>الدم = بلازما + خلايا (RBCs و WBCs و platelets). الـ pH من 7.35 لـ 7.45. بروتينات البلازما: albumin و globulins و fibrinogen.</p>
<div class="pearl"><strong>الألبومين والوذمة:</strong> الألبومين كبير ومش بيخرج من الشعيرات، وبيعمل حوالي 80% من الـ colloid osmotic pressure. لو قلّ (زي فشل الكبد) السوائل تفضل في الأنسجة فتحصل <b>وذمة (oedema)</b>.</div>
<h4>كرات الدم الحمراء</h4>
<ul>
<li>مقعرة الوجهين ومن غير نواة، والـ spectrin بيخلي الغشاء مرن. عمرها 100–120 يوم.</li>
<li>الهيموجلوبين = 2α + 2β + 4 heme (Fe²⁺) فيشيل 4 جزيئات O₂. مع CO يدي carboxyhemoglobin، والأدوية المؤكسدة تحوّل Fe²⁺ لـ Fe³⁺ فيبقى methemoglobin.</li>
<li>تكوين الدم بيزيد مع نقص الأكسجين (erythropoietin)، ومحتاج نخاع سليم وكبد وحديد و B12 وفولات.</li>
</ul>
<h4>الأنيميا</h4>
<ul>
<li><b>Microcytic</b>: مشكلة في تصنيع الهيموجلوبين، أشهرها نقص الحديد.</li>
<li><b>Macrocytic (megaloblastic)</b>: مشكلة في تصنيع الـ DNA، نقص B12 أو الفولات.</li>
<li><b>Pernicious</b>: مفيش intrinsic factor فالـ B12 مش بيتمتص.</li>
<li><b>Hemolytic</b>: الكرات بتتكسر أسرع ما بتتعمل. <b>Aplastic</b>: فشل النخاع.</li>
</ul>
<p><b>Ferritin</b> = تخزين الحديد (بيقل في نقص الحديد)، <b>Transferrin</b> = نقل (بيزيد في نقص الحديد). الحديد بيتمتص كـ Fe²⁺ في الـ duodenum، والـ B12 بيتمتص في الـ terminal ileum.</p>
<h4>أمراض وراثية</h4>
<ul>
<li><b>Sickle cell</b>: HbS، وراثة autosomal recessive.</li>
<li><b>G6PD deficiency (أنيميا الفول)</b>: مفيش NADPH، والمحفزات: الفول، السلفا، أدوية الملاريا. وراثة X-linked.</li>
<li><b>Thalassemia</b>: نقص تصنيع سلاسل الجلوبين، autosomal recessive.</li>
</ul>`},
3:{t:"الجهاز العصبي ١: الخلايا العصبية وجهد الفعل",h:`
<ul>
<li><b>Hippocampus</b>: الذاكرة والتعلم. <b>Hypothalamus</b>: الاتزان (الحرارة، الجوع، النوم، الهرمونات). <b>Medulla</b>: القلب والتنفس. <b>Cerebellum</b>: التوازن والحركة.</li>
<li>الفصوص: occipital = النظر، temporal = السمع، frontal = التفكير، parietal = الإحساس بوضع الجسم.</li>
<li>12 عصب قحفي، والـ <b>vagus (X)</b> هو العصب الباراسمبثاوي الرئيسي.</li>
</ul>
<h4>الخلية العصبية</h4>
<p>الـ dendrites بتستقبل، والـ axon بينقل، والـ axon hillock بيولّد الإشارة. الـ <b>myelin</b> بيخلي التوصيل أسرع (saltatory من node لـ node).</p>
<p><b>الخلايا الدبقية:</b> astrocytes (حاجز الدم والمخ)، ependymal (الـ CSF)، oligodendrocytes (ميالين الجهاز المركزي)، microglia (مناعة المخ)، Schwann (ميالين الطرفي والتجدد).</p>
<h4>جهود الغشاء</h4>
<ul>
<li><b>جهد الراحة</b> حوالي <bdi>−70 mV</bdi>: بسبب تسريب K⁺ لبرّه أكتر من Na⁺ لجوّه، ومضخة Na⁺/K⁺، والبروتينات السالبة جوّه.</li>
<li><b>Depolarization</b>: قنوات Na⁺ تفتح والصوديوم يدخل.</li>
<li><b>Repolarization</b>: قنوات K⁺ تفتح والبوتاسيوم يخرج.</li>
<li><b>Hyperpolarization</b>: قنوات K⁺ بتقفل ببطء.</li>
<li><b>Absolute refractory</b>: مستحيل جهد جديد. <b>Relative refractory</b>: محتاج منبّه أقوى.</li>
</ul>
<p><b>القوس الانعكاسي:</b> مستقبل ← عصب حسي ← خلية وسيطة في النخاع الشوكي ← عصب حركي ← العضو المستجيب، وبيحصل قبل ما الإشارة توصل المخ.</p>`},
4:{t:"الجهاز العصبي الذاتي والعضلات",h:`
<h4>السمبثاوي مقابل الباراسمبثاوي</h4>
<ul>
<li><b>Sympathetic</b>: الخوف والهروب (fight or flight)، أصله thoracolumbar، والناقل الأخير <b>noradrenaline</b> على α/β (ما عدا الغدد العرقية ACh).</li>
<li><b>Parasympathetic</b>: الراحة والهضم (rest and digest)، أصله craniosacral، والناقل <b>ACh</b> على مستقبلات muscarinic.</li>
<li>العين: السمبثاوي يوسّع الحدقة (mydriasis)، والباراسمبثاوي يضيّقها (miosis) ويساعد على الرؤية القريبة.</li>
<li>القلب والشعب الهوائية: السمبثاوي يسرّع القلب ويوسّع الشعب، والباراسمبثاوي يبطّأ القلب ويزوّد اللعاب.</li>
<li>كل الألياف قبل العقدة بتفرز ACh على مستقبلات nicotinic (Nn).</li>
</ul>
<h4>انقباض العضلات</h4>
<p><b>العضلات الملساء:</b> زيادة Ca²⁺ ← Ca²⁺–calmodulin ← تنشيط MLCK ← فسفرة الميوسين ← انقباض.</p>
<p><b>العضلات الهيكلية:</b> إشارة عصبية ← ACh عند الـ NMJ ← دخول Na⁺ ← الإشارة في الـ T-tubules ← الـ SR يطلق Ca²⁺ ← انزلاق actin و myosin.</p>
<h4>أمراض</h4>
<ul>
<li><b>Myasthenia gravis</b>: أجسام مضادة ضد مستقبلات nicotinic ← ضعف. العلاج: anticholinesterases ومثبطات مناعة.</li>
<li><b>Alzheimer's</b>: نقص الـ cholinergic مع excitotoxicity بالجلوتامات.</li>
<li><b>Parkinson's</b>: موت خلايا الدوبامين ← رعشة وبطء حركة.</li>
<li><b>Epilepsy</b>: نشاط عصبي زايد. <b>Stroke</b>: انقطاع الدم. <b>MS</b>: التهاب يدمّر الميالين.</li>
</ul>`},
5:{t:"القلب ١: عضلة القلب والجهود الكهربية",h:`
<ul>
<li>الصمامات بتفتح وتقفل بفرق الضغط فالدم يمشي في اتجاه واحد.</li>
<li>الشرايين التاجية: left main ← LAD و circumflex، وكمان الـ right coronary.</li>
<li>خلايا التوصيل (SAN و AVN و Purkinje) بتبدأ وتنشر الإشارة، والخلايا الانقباضية بتضخ.</li>
<li>الخواص: automaticity، excitability، conductivity، contractility.</li>
</ul>
<p><b>المعدل الذاتي:</b> SAN من 90 لـ 105 في الدقيقة (العصب الحائر يخليه حوالي 75)، AVN من 40 لـ 60، Purkinje من 15 لـ 40.</p>
<p>الأدرينالين <b>chronotropic موجب</b>، والديجيتاليس <b>سالب</b>.</p>
<h4>جهد خلايا الـ pacemaker (مفيش جهد راحة حقيقي)</h4>
<ul>
<li><b>Phase 4</b>: دخول Na⁺ البطيء (funny current) من حوالي <bdi>−60 mV</bdi>، ثم قنوات Ca²⁺ من نوع T.</li>
<li><b>Phase 0</b>: دخول Ca²⁺ من نوع L، والعتبة من <bdi>−40</bdi> لـ <bdi>−30 mV</bdi>.</li>
<li><b>Phase 3</b>: خروج K⁺.</li>
</ul>
<h4>جهد عضلة البطين (الراحة حوالي <bdi>−90 mV</bdi>)</h4>
<p>0: دخول Na⁺ السريع · 1: خروج K⁺ قصير · 2: <b>plateau</b> بدخول Ca²⁺ · 3: خروج K⁺ · 4: راحة.</p>
<div class="pearl"><strong>ليه القلب مش بيعمل tetanus؟</strong> لأن الـ absolute refractory period طويل (المراحل 0–2 ونص 3)، فلازم القلب يرتاح ويتملي قبل ما ينقبض تاني.</div>`},
6:{t:"القلب ٢: التوصيل والدورة القلبية وضغط الدم",h:`
<p><b>مسار التوصيل:</b> SAN ← الأذينين ← AVN ← bundle of His ← الفرعين ← ألياف Purkinje.</p>
<ul>
<li>الأبطأ في الـ <b>AVN</b> (0.05 m/s) عشان البطينين يتملوا.</li>
<li>الأسرع في الـ <b>Purkinje</b> (4 m/s) عشان البطينين ينقبضوا مع بعض.</li>
</ul>
<h4>الربط بين الإثارة والانقباض</h4>
<ol>
<li>الإشارة تمشي على الغشاء والـ T-tubules.</li>
<li>قنوات Ca²⁺ من نوع L (DHP) تدخّل كالسيوم قليل.</li>
<li>الكالسيوم ده يفتح الـ ryanodine receptors فيطلع كالسيوم أكتر (calcium-induced calcium release).</li>
<li>Ca²⁺ يرتبط بالـ troponin C ← انقباض.</li>
<li><b>SERCA</b> ترجّع الكالسيوم للـ SR ← ارتخاء.</li>
</ol>
<h4>المعادلات</h4>
<div class="formula">SV = EDV − ESV · CO = SV × HR · EF = SV / EDV<br>Pulse pressure = SBP − DBP = 40 mmHg · Mean ABP = DBP + ⅓ PP ≈ 93 mmHg</div>
<ul>
<li><b>Vasoconstrictors</b>: angiotensin II، adrenaline، noradrenaline. <b>Vasodilators</b>: NO، prostacyclin، histamine، bradykinin.</li>
<li>المقاومة الطرفية بتعتمد على قطر الأوعية.</li>
<li>السمبثاوي chronotropic و inotropic موجب، والباراسمبثاوي chronotropic سالب.</li>
<li>الـ <b>baroreceptors</b> بتتحكم في الضغط لحظة بلحظة، والـ chemoreceptors بتتنشط مع نقص O₂، والـ medulla بتجمع الإشارات.</li>
</ul>`}
},
analytical:{
1:{t:"مقدمة في تفاعلات الأكسدة والاختزال",h:`
<ul>
<li><b>العامل المؤكسد (oxidizing agent)</b>: نفسه بيتختزل، بياخد إلكترونات، ورقم أكسدته بيقل. أمثلة: KMnO₄، K₂Cr₂O₇، I₂، KIO₃، KBrO₃، Ce⁴⁺.</li>
<li><b>العامل المختزل (reducing agent)</b>: نفسه بيتأكسد، بيدي إلكترونات، ورقم أكسدته بيزيد. أمثلة: Na₂S₂O₃، الأوكسالات، Fe²⁺.</li>
</ul>
<h4>قواعد رقم الأكسدة</h4>
<p>العنصر الحر = صفر، H = +1 (ما عدا الهيدريدات)، O = −2 (ما عدا البيروكسيدات)، الأيون = شحنته، والمركب المتعادل مجموعه صفر. مثال: Mn في KMnO₄ = +7.</p>
<h4>الوزن المكافئ</h4>
<div class="formula">Eq. wt = Molecular weight ÷ التغير في رقم الأكسدة<br>KMnO₄ في وسط حمضي: +7 → +2 (5 e) → 158/5 = 31.6<br>KMnO₄ في وسط قلوي: +7 → +4 (3 e) → 158/3 = 52.67</div>
<h4>الموازنة بأنصاف المعادلات</h4>
<ol>
<li>قسّمي التفاعل لنص معادلة للمؤكسد ونص للمختزل.</li>
<li>وازني الذرات (O بالماء و H بـ H⁺)، وبعدين الشحنات بالإلكترونات.</li>
<li>اضربي بحيث الإلكترونات المفقودة = المكتسبة، واجمعي.</li>
</ol>
<div class="formula">MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>`},
2:{t:"جهد القطب (Electrode potential)",h:`
<ul>
<li>لو <b>solution pressure</b> أكبر: الفلز يدوب (يتأكسد)، القطب يبقى سالب ووزنه يقل. مثال: Zn⁰ → Zn²⁺.</li>
<li>لو <b>ionic pressure</b> أكبر: الأيونات تترسب (تتختزل)، القطب يبقى موجب ووزنه يزيد. مثال: Cu²⁺ → Cu⁰.</li>
</ul>
<p>الجهود القياسية بتتقاس بالنسبة لـ <b>قطب الهيدروجين القياسي</b> (E⁰ = صفر).</p>
<p>القطب بياخد نفس إشارة الـ E⁰ بتاعه، والتيار بيمشي من الأكثر سالبية للأكثر موجبية (مثلًا Mg −2.36 إلى Ag +0.80).</p>
<div class="formula">E = E⁰ + (0.059/n) log [Mⁿ⁺] → E = E⁰ لما التركيز = 1 M</div>
<div class="pearl"><strong>السلسلة الكهروكيميائية:</strong> الفلزات اللي جهدها أكثر سالبية عوامل مختزلة، وبتحل محل الفلزات اللي تحتها في المحلول.</div>`},
3:{t:"الخلايا الكهروكيميائية",h:`
<ul>
<li><b>الخلية الجلفانية (Galvanic)</b>: تفاعل تلقائي بيولّد تيار. الأكسدة عند الـ <b>anode</b> والاختزال عند الـ <b>cathode</b>.</li>
<li><b>الخلية الإلكتروليتية</b>: تيار خارجي بيجبر تفاعل غير تلقائي يحصل.</li>
<li><b>Salt bridge</b>: بيوصل نصفي الخلية، يقفل الدائرة، ويحافظ على تعادل الشحنات بحركة الأيونات.</li>
</ul>
<div class="formula">EMF = E⁰(cathode) − E⁰(anode)</div>
<div class="pearl"><strong>نصيحة:</strong> لو الـ EMF موجب يبقى التفاعل تلقائي.</div>`},
4:{t:"جهد الأكسدة والعوامل المؤثرة عليه",h:`
<div class="formula">E = E⁰ + (0.059/n) log [Ox]/[Red] → E = E⁰ لما [Ox] = [Red]</div>
<ul>
<li>كل ما الـ E⁰ يكون موجب أكتر يبقى <b>عامل مؤكسد أقوى</b>، والسالب = عامل مختزل قوي.</li>
<li>عشان التفاعل يكمل لازم الفرق بين النظامين حوالي <b>0.4 V</b>.</li>
<li>شيل الصورة المؤكسدة (ترسيب أو تكوين معقد) ← الجهد يقل. شيل الصورة المختزلة ← الجهد يزيد.</li>
</ul>
<p><b>جهود مهمة:</b> MnO₄⁻/Mn²⁺ = 1.51 · Ce⁴⁺ = 1.44 · Cl₂ = 1.36 · Cr₂O₇²⁻ = 1.36 · Fe³⁺/Fe²⁺ = 0.77 · I₂/I⁻ = 0.54. يعني البرمنجنات تقدر تأكسد Cl⁻ و Fe²⁺، بس Fe³⁺ يأكسد I⁻ بس.</p>
<h4>مسائل تطبيقية</h4>
<ul>
<li><b>معايرة FeCl₂ بالبرمنجنات</b>: الكلوريد كمان هيتأكسد، فنضيف <b>Zimmermann–Reinhardt reagent</b>: MnSO₄ (يقلل جهد البرمنجنات تحت الكلور وفوق الحديد)، H₃PO₄ (يعمل معقد عديم اللون مع Fe³⁺ ويقلل جهده)، H₂SO₄ (للحموضة).</li>
<li><b>معايرة FeCl₂ باليود</b>: اليود (0.54) أضعف من الحديد (0.77)، فنضيف HgCl₂ (يشيل I⁻ فيرفع جهد اليود) و H₃PO₄ (يقلل جهد الحديد).</li>
</ul>`},
5:{t:"الكواشف والمعايرات ومنحنى المعايرة",h:`
<h4>أنواع الكواشف</h4>
<ul>
<li><b>Self</b>: KMnO₄ (أول لون وردي ثابت) و I₂.</li>
<li><b>External</b>: K-ferricyanide كاختبار نقطة للـ Fe²⁺.</li>
<li><b>Internal</b>: diphenylamine (0.76، من عديم اللون لبنفسجي)، ferroin (1.06، من أحمر لأزرق)، N-phenylanthranilic acid (1.08).</li>
<li><b>Irreversible</b>: methyl orange و methyl red. <b>Specific</b>: النشا مع اليود و SCN⁻ مع Fe³⁺.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> الـ diphenylamine (0.76) قريب جدًا من جهد الحديد (0.77)، فلازم نضيف فوسفات أو فلوريد يقلل جهد الحديد. أما phenylanthranilic acid (1.08) فبيشتغل مباشرة لأنه بين 0.77 و 1.36.</div>
<h4>المعايرات الثلاثة</h4>
<ul>
<li><b>KMnO₄</b>: الأقوى، كاشف ذاتي، مش primary standard (يتعاير ضد sodium oxalate)، وسط حمضي.</li>
<li><b>Ce⁴⁺</b>: التاني في القوة، كاشف ذاتي ضعيف، الكاشف ferroin، يشتغل في أي وسط.</li>
<li><b>K₂Cr₂O₇</b>: التالت، <b>primary standard</b>، مش كاشف ذاتي، الكاشف ferroin أو diphenylamine.</li>
</ul>
<p>عينات الحديديك لازم تتختزل الأول لـ Fe²⁺ (بـ SnCl₂ أو الزنك).</p>
<h4>منحنى المعايرة</h4>
<div class="formula">E عند نقطة التكافؤ = (n₁E₁⁰ + n₂E₂⁰) / (n₁ + n₂)<br>مثال I⁻ مع Ce⁴⁺: (2×0.54 + 1×1.44)/3 = 0.84 V</div>
<p>الجهد بيتغير ببطء قبل نقطة النهاية وبيقفز فجأة عند نقطة التكافؤ.</p>`},
6:{t:"Iodimetry و Iodometry و KIO₃ و KBrO₃",h:`
<ul>
<li><b>Iodimetry (مباشرة)</b>: المعاير هو I₂ القياسي، وبتقدّر <b>العوامل المختزلة</b> زي الثيوسلفات وفيتامين C.</li>
<li><b>Iodometry (غير مباشرة)</b>: نضيف KI زيادة، واليود اللي يتحرر نعايره بالثيوسلفات، وبتقدّر <b>العوامل المؤكسدة</b> زي H₂O₂ و Cu²⁺.</li>
</ul>
<div class="formula">I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻ (tetrathionate)<br>H₂O₂ + 2H⁺ + 2I⁻ → I₂ + 2H₂O</div>
<p><b>الكاشف:</b> النشا (خاص باليود). اليود بيدوب في الكلوروفورم أو CCl₄ أكتر من الماء بحوالي 90 مرة.</p>
<h4>KIO₃ – الناتج بيعتمد على الحموضة</h4>
<ul>
<li>وسط متعادل: يتحول لـ I⁻ (6 إلكترونات).</li>
<li>وسط حمضي خفيف: يتحول لـ ½I₂ (5 إلكترونات).</li>
<li>وسط حمضي قوي: يتحول لـ I⁺ (4 إلكترونات).</li>
</ul>`},
7:{t:"مراجعة الميدترم",h:`
<p>المحاضرة السابعة مراجعة للمحاضرات من 1 لـ 6. ذاكري معاها الكويز: موازنة المعادلات، الفرق بين جهد القطب وجهد الأكسدة، العوامل المؤثرة على الجهد، كاشف Zimmermann، اختيار الكاشف، المعايرات الثلاثة، ومنحنى المعايرة.</p>
<h4>عينات مختزلة وإزاي تتعاير</h4>
<ul>
<li><b>الأوكسالات</b> ← CO₂: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>Fe²⁺</b> ← Fe³⁺: بالبرمنجنات أو Ce⁴⁺ أو الداي كرومات.</li>
<li><b>Ferrocyanide</b> ← ferricyanide: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>H₂O₂</b> ← O₂: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>As³⁺ و Sb³⁺ و SO₃²⁻ و NO₂⁻</b>: بالبرمنجنات.</li>
</ul>`}
},
dosage:{
1:{t:"الأشكال الصيدلانية السائلة وزيادة الذوبانية",h:`
<p>الـ <b>dosage form</b> هو الشكل اللي الدوا بيوصل بيه لمكان تأثيره. المحلول خليط متجانس من مذاب ومذيب. استثناء: <b>Syrup BP</b> فيه 66.7% سكروز و 33.3% ماء بس.</p>
<ul>
<li><b>مميزات المحاليل</b>: سهلة البلع للأطفال وكبار السن، امتصاص سريع، تهييج أقل للمعدة، جرعة متجانسة، وطرق إعطاء كتير.</li>
<li><b>عيوبها</b>: حجمها كبير، أقل ثباتًا (hydrolysis)، الميكروبات بتنمو فيها، الطعم واضح، والجرعة بتعتمد على قياس المريض.</li>
</ul>
<p><b>Solubilization</b> = زيادة ذوبان دوا ضعيف الذوبان في الماء. حوالي 40% من الأدوية المرشحة بتفشل بسبب ضعف الـ bioavailability.</p>
<p><b>BCS:</b> Class I ذوبان ونفاذية عالية · II ذوبان قليل ونفاذية عالية · III ذوبان عالي ونفاذية قليلة · IV الاتنين قليل.</p>
<h4>الطرق</h4>
<ul>
<li><b>تغيير الـ pH / تكوين ملح</b>: الأبسط للأدوية القابلة للتأين. بيفيد Class II وممكن يضر Class III.</li>
<li><b>تعديل كيميائي</b>: مشتق ذواب، زي hydrocortisone sodium phosphate.</li>
<li><b>Co-solvency</b>: مذيبات بتمتزج بالماء (glycerol و ethanol و propylene glycol)، زي paracetamol elixir.</li>
<li><b>Micellar solubilization</b>: surfactant فوق الـ CMC بيحبس الدوا في micelles، زي Tweens لفيتامينات A و D و E و K، والصابون في Dettol.</li>
<li><b>Hydrotropy</b>: كمية كبيرة من مذاب تاني (sodium benzoate، urea)، ومفيش CMC.</li>
<li><b>Complexation</b>: الـ cyclodextrins (α = 6، β = 7، γ = 8 وحدات جلوكوز) برّه محب للماء وجوّه كاره له.</li>
<li><b>Solid dispersion</b>: الدوا منتشر في بوليمر محب للماء (PVP، HPMC، PEG 6000).</li>
</ul>`},
2:{t:"تصغير حجم الجزيئات: Micronization و Nanocrystals و Cocrystals",h:`
<div class="formula">Noyes–Whitney: dm/dt = D·A·(Cs − C)/h<br>معدل الذوبان بيتناسب طرديًا مع المساحة السطحية A</div>
<ul>
<li><b>Micronization</b>: من 1 لـ 10 µm بالـ jet milling أو ball milling، أكثر ثباتًا. أمثلة: griseofulvin و spironolactone. ممكن ما يكفيش لو log P أكبر من 4.</li>
<li><b>Nanocrystals</b>: من 100 لـ 1000 nm. Top-down بالـ high-pressure homogenization، أو bottom-up بالترسيب. بتتكتل فمحتاجة stabilizers. أمثلة: Tricor و Rapamune و Emend.</li>
<li><b>Stabilizers</b>: steric (بوليمرات زي PVP و HPMC)، electrostatic (مشحونة زي SDS)، أو الاتنين.</li>
</ul>
<h4>Cocrystals</h4>
<p>دوا + <b>coformer</b> في بلورة واحدة مربوطين بروابط غير تساهمية. بتغيّر الخواص الفيزيائية مش الفارماكولوجي. مثال: carbamazepine–saccharin.</p>
<ul>
<li><b>ليه الذوبان بيزيد؟</b> الشبكة البلورية أضعف، والترطيب أحسن، وفيه قوة دافعة ديناميكية حرارية.</li>
<li><b>شروط الـ coformer</b>: يعمل روابط هيدروجينية، آمن (GRAS)، يحسّن الخواص، وما يتفاعلش مع الدوا.</li>
<li><b>Multidrug cocrystals</b>: زي <b>Entresto</b> (sacubitril + valsartan) لفشل القلب.</li>
<li><b>طرق التحضير</b>: الطحن الجاف، الطحن بسائل، تبخير المذيب، الموجات فوق الصوتية أو الميكروويف.</li>
</ul>`},
3:{t:"المياه الصيدلانية والمياه العطرية",h:`
<ul>
<li><b>مياه الحنفية</b>: ما تنفعش للصرف، فيها ميكروبات وأملاح.</li>
<li><b>مياه مغلية ومبردة</b>: بتقتل البكتيريا النشطة بس الجراثيم والأملاح بتفضل.</li>
<li><b>Purified Water USP</b>: خالية من الأيونات والميكروبات، لكل الأشكال ما عدا الحقن وقطرات العين.</li>
<li><b>Water for Injection</b>: خالية من الـ pyrogens ومعقمة، عبوات جرعة واحدة لحد 1 لتر، من غير مادة حافظة.</li>
<li><b>Bacteriostatic WFI</b>: فيها مادة مضادة للميكروبات، للعبوات متعددة الجرعات. لو محتاجين أكتر من 5 مل نستخدم sterile WFI.</li>
</ul>
<h4>تحضير المياه النقية</h4>
<ul>
<li><b>التقطير</b>: نرمي أول 10–20% وآخر 10–20%.</li>
<li><b>Ion exchange</b>: الـ cation resin يبدّل Ca²⁺ و Mg²⁺ بـ H⁺، والـ anion resin يبدّل Cl⁻ بـ OH⁻. رخيصة ومن غير حرارة.</li>
<li><b>Reverse osmosis</b>: ضغط بيدفع الماء عكس الأسموزية، وبيشيل الـ pyrogens و 90–99% من الأيونات.</li>
</ul>
<h4>المياه العطرية</h4>
<p>محاليل مائية شبه مشبعة بزيوت طيارة (نعناع، ورد، يانسون، كافور، كلوروفورم)، وبتستخدم كـ vehicle بطعم حلو.</p>
<ul>
<li><b>مشاكلها</b>: salting out مع الأملاح، بتعكّر مع الوقت، وحساسة للضوء والحرارة.</li>
<li><b>التحضير</b>: بالتقطير (الأفضل، والتقطير المتكرر اسمه cohobation زي ماء الورد)، أو محلول بسيط (2 جم زيت + 1000 مل ماء ونسيبه 12 ساعة ونفلتر)، أو بمادة مساعدة على الذوبان.</li>
<li><b>الاستخدامات</b>: الكافور طارد للغازات، الكلوروفورم مقشع وحافظ، النعناع واليانسون طاردين للغازات.</li>
</ul>`},
4:{t:"الإضافات في السوائل والمحاليل الفموية والشراب",h:`
<ul>
<li><b>Buffers</b>: كربونات، سترات، فوسفات. البورات للاستخدام الخارجي بس. الحقن وقطرات العين حوالي 7.4.</li>
<li><b>Isotonicity</b>: NaCl والدكستروز، والـ isotonic = 0.9% NaCl.</li>
<li><b>Viscosity enhancers</b>: povidone و carbomer لتلامس أطول.</li>
<li><b>Preservatives</b>: benzoic acid من 0.1 لـ 0.2%، parabens 0.1%، كحول أكتر من 20%. الـ parabens بتتحبس في الـ micelles وتفقد فاعليتها.</li>
<li><b>Antioxidants</b>: EDTA، وللزيوت tocopherol و BHA و BHT، وللمحاليل المائية ascorbic acid.</li>
<li><b>Sweeteners</b>: السكروز (ثابت من pH 4 لـ 8)، sorbitol، saccharin أقل من 0.2%، aspartame.</li>
<li><b>Flavours</b>: للمر: يانسون وشوكولاتة ونعناع. للمالح: مشمش وعرقسوس. للحامض: موالح وتوت.</li>
</ul>
<h4>المحاليل الفموية</h4>
<ul>
<li>الجرعات: 5 مل (معلقة صغيرة)، 10 مل، 15 مل (معلقة كبيرة).</li>
<li><b>ORS</b> لكل لتر: 45 mEq صوديوم، 20 بوتاسيوم، 35 كلوريد، 30 سترات، 25 جم دكستروز.</li>
<li>Magnesium citrate ملين ملحي، و sodium citrate–citric acid بيقلّوِن البول (حصوات، نقرس).</li>
</ul>
<h4>الشراب واللينكتس</h4>
<p>الشراب محلول سكر مركز. لمرضى السكر: <b>artificial syrup</b> = sodium CMC 1.5% + saccharin 0.6%. الشراب المشبع تقريبًا مش محتاج مادة حافظة (مفيش ماء حر). الـ <b>linctus</b> للكحة، يتشرب ببطء ومن غير تخفيف.</p>`},
5:{t:"المحاليل الخارجية المائية وغير المائية",h:`
<h4>مائية – للاستخدام الخارجي</h4>
<ul>
<li><b>Lotions</b>: قليلة اللزوجة وبتتحط من غير دعك (زي calamine).</li>
<li><b>Douches</b>: تيار للتنظيف (عين، حلق، مهبل).</li>
<li><b>Enemas</b>: للإخراج (نص لتر لـ لتر ماء)، أو للاحتفاظ لتأثير موضعي أو جهازي (hydrocortisone للقولون التقرحي) بحد أقصى 150 مل، أو تشخيصية (barium sulfate).</li>
<li><b>Nasal</b>: isotonic و pH من 5.5 لـ 6.5 لحماية الأهداب. مزيلات الاحتقان أقصى حاجة 3–5 أيام عشان rhinitis medicamentosa.</li>
<li><b>Otic</b>: الجلسرين والبروبيلين جليكول لزجين وبيمتصوا الرطوبة.</li>
</ul>
<h4>غير مائية</h4>
<ul>
<li>مناسبة للأدوية اللي ما بتدوبش في الماء أو بتتحلل فيه، وللحقن الزيتية طويلة المفعول.</li>
<li><b>الإيثانول</b>: مذيب ومادة حافظة فوق 15–20% ومبرّد للجلد. الحد الأقصى في الأدوية الفموية: 0.5% تحت 6 سنين، 5% من 6 لـ 12، و 10% فوق 12.</li>
<li>الكحول بيرسّب الـ tragacanth والـ acacia والأملاح.</li>
<li><b>Glycerin</b> (3 OH) و <b>propylene glycol</b> (2 OH): مذيبات وحافظة ولزوجة.</li>
<li><b>الزيوت الثابتة</b>: زيت اللوز، السمسم، الزيتون، الخروع، وجوز الهند.</li>
</ul>
<h4>خارجية غير مائية</h4>
<ul>
<li><b>Liniments</b>: بتتحط بالدعك، وما تتحطش على جلد مجروح.</li>
<li><b>Collodion</b>: 4% pyroxylin في كحول وإيثر، بيعمل طبقة حماية. الـ flexible collodion فيه 2% كافور و 3% زيت خروع. salicylic acid collodion 10% لإزالة الكالو.</li>
</ul>`},
6:{t:"الغرويات: الأنواع والتحضير والتنقية",h:`
<ul>
<li><b>Molecular</b>: أقل من 1 nm، بيعدّي من الغشاء شبه المنفذ، انتشاره سريع.</li>
<li><b>Colloidal</b>: من 1 لـ 500 nm، بيتشاف بالـ ultramicroscope، بيعدّي من ورق الترشيح بس مش من الغشاء، انتشاره بطيء جدًا.</li>
<li><b>Coarse</b>: أكبر من 500 nm، بيتشاف بالميكروسكوب العادي وبيتحجز في ورق الترشيح.</li>
</ul>
<p>الغرويات مساحتها السطحية ضخمة: platinum black كعامل حفاز، الكاولين بيمتص السموم، و Al(OH)₃ مضاد حموضة، و dextran بديل للبلازما.</p>
<h4>الأنواع</h4>
<ul>
<li><b>Lyophilic</b>: بوليمرات عضوية (جيلاتين، أكاسيا)، بتتكون تلقائيًا، اللزوجة بتزيد جدًا، وثابتة مع الإلكتروليتات.</li>
<li><b>Lyophobic</b>: غير عضوية (ذهب، فضة، كبريت)، محتاجة طرق خاصة، ومش ثابتة مع كمية قليلة من الإلكتروليت.</li>
<li><b>Association</b>: micelles من surfactant فوق الـ CMC.</li>
</ul>
<p><b>تحضير الـ lyophobic:</b> dispersion (من كبير لصغير: ultrasonic، electric arc، colloid mill) أو condensation (من صغير لكبير: التشبع الزائد أو تفاعلات كيميائية زي تحلل FeCl₃).</p>
<h4>التنقية</h4>
<ul>
<li><b>Dialysis</b>: غشاء بيخرّج الأيونات الصغيرة ويحجز الغرويات.</li>
<li><b>Electrodialysis</b>: مجال كهربي بيسرّع خروج الأيونات.</li>
<li><b>Ultrafiltration</b>: شفط من خلال غشاء دقيق.</li>
<li><b>الكلية الصناعية</b>: السيلوفان بيعدّي اليوريا والجلوكوز والأملاح، مش البروتينات أو الخلايا.</li>
</ul>`},
7:{t:"خواص الغرويات",h:`
<h4>الخواص الضوئية</h4>
<ul>
<li><b>Faraday–Tyndall effect</b>: الغرويات بتشتت الضوء (مخروط واضح)، والمحاليل الحقيقية لأ.</li>
<li>الـ <b>ultramicroscope</b>: الجزيئات بتبان نقط لامعة للعد. الـ <b>electron microscope</b>: الحجم والشكل الحقيقي بس العينة لازم تنشف.</li>
</ul>
<h4>الخواص الحركية</h4>
<ul>
<li><b>Brownian motion</b>: حركة عشوائية من خبط جزيئات المذيب، أسرع مع الجزيئات الأصغر واللزوجة الأقل.</li>
<li><b>Diffusion</b> (قانون Fick الأول): <bdi>dm/dt = −D·A·dC/dx</bdi>.</li>
<li><b>Sedimentation</b> (Stokes): <bdi>v = 2r²(ρ − ρ₀)g / 9η</bdi>. تحت 0.5 µm الحركة البراونية بتقاوم الترسيب، فبنستخدم ultracentrifuge.</li>
<li><b>Viscosity</b>: الجزيئات الكروية lyophobic لزوجتها قليلة، والخطية lyophilic لزوجتها عالية.</li>
</ul>`}
},
organic:{
1:{t:"الألدهيدات والكيتونات: التسمية والخواص والتحضير",h:`
<ul>
<li><b>الألدهيدات</b>: النهاية <b>-al</b> وكربون الكربونيل رقم 1 (methanal). لو CHO على حلقة: carbaldehyde.</li>
<li><b>الكيتونات</b>: النهاية <b>-one</b> وأقل رقم للـ C=O (propanone). الاسم الشائع: المجموعات أبجديًا + ketone. على حلقة بنزين: -phenone (acetophenone).</li>
</ul>
<div class="formula">الأولوية: −COOH > −COOR > −COCl > −CONH₂ > −CN > −CHO > C=O > −OH > −NH₂</div>
<p><b>الاستخدامات:</b> الفورمالدهيد (حافظ ومطهر ولقاحات)، البنزالدهيد (نكهة)، الأسيتون (مذيب)، الأسيتوفينون (لتحضير الإيبوبروفين).</p>
<p><b>الخواص:</b> قطبية، درجة غليانها أعلى من الألكانات وأقل من الكحولات، أقل من 6 كربون بيدوب في الماء، وبتعمل رابطة هيدروجين مع الماء بس مش مع بعض.</p>
<h4>طرق التحضير</h4>
<ul>
<li>أكسدة الكحولات بـ <b>PCC</b>: الأولي يدي ألدهيد ويقف، والثانوي يدي كيتون.</li>
<li>Nitrile + Grignard: كيتونات بس.</li>
<li><b>Friedel–Crafts acylation</b>: كيتونات أروماتية بس.</li>
<li>Acyl chloride + R₂Cd: كيتونات بس.</li>
<li><b>Rosenmund</b>: RCOCl + H₂/Pd–BaSO₄ يدي ألدهيدات بس (الـ BaSO₄ بيوقف الاختزال للكحول).</li>
<li><b>Reimer–Tiemann</b>: ألدهيدات فينولية (salicylaldehyde).</li>
</ul>
<div class="pearl"><strong>Keto–enol:</strong> التوازن ناحية الـ keto لأن الـ C=O أقوى بكتير من الـ C=C.</div>`},
2:{t:"الإضافة النيوكليوفيلية والفراغية والاختزال",h:`
<p><b>النشاط:</b> الألدهيدات أنشط من الكيتونات (عوائق فراغية أقل)، والأليفاتية أنشط من الأروماتية (الرنين بيقلل الإلكتروفيلية).</p>
<h4>النيوكليوفيلات</h4>
<ul>
<li><b>2 ROH مع HCl جاف</b>: hemiacetal ثم acetal (بيرجع بالماء). الـ diols بتدي acetals حلقية كمجموعات حماية.</li>
<li><b>HCN</b>: cyanohydrin ثم α-hydroxy acids (زي mandelic acid للبشرة).</li>
<li><b>Grignard</b>: كحولات.</li>
<li><b>مشتقات الأمونيا</b>: imines و oximes (ترياق للتسمم بالمبيدات الفوسفورية) و hydrazones.</li>
</ul>
<h4>الكيمياء الفراغية</h4>
<ul>
<li><b>Prochiral</b>: مش chiral بس يبقى chiral بعد تغيير واحد. الهجوم عليه من غير مركز تاني يدي <b>racemic mixture</b> 50:50 غير نشط ضوئيًا.</li>
<li>لو فيه α-carbon كيرالي بالفعل: التفاعل stereoselective. <b>قاعدة Cram و عبد الحافظ</b>: النيوكليوفيل يهاجم من ناحية المجموعة الصغيرة ← threo (الأساسي).</li>
<li><b>R/S في فيشر</b>: لو الأقل أولوية رأسي والاتجاه مع عقارب الساعة = R. لو أفقي اعكسي.</li>
<li><b>Erythro</b>: المجموعات المتشابهة في نفس الجهة، <b>threo</b>: في جهتين.</li>
<li><b>Enantiomers</b>: صورة مرآة، نفس الخواص ما عدا الدوران الضوئي. <b>Diastereomers</b>: مش صورة مرآة وخواصهم مختلفة.</li>
</ul>
<h4>الاختزال</h4>
<ul>
<li>لألكانات: <b>Clemmensen</b> (Zn(Hg)/HCl) أو <b>Wolff–Kishner</b> (N₂H₄/KOH).</li>
<li>لكحولات: NaBH₄ أو LiAlH₄: الألدهيد يدي كحول أولي والكيتون يدي ثانوي.</li>
</ul>`},
3:{t:"تفاعلات الـ α-هيدروجين والأحماض الكربوكسيلية",h:`
<p>الـ <b>α-H</b> حمضي لأن الكربونيل بيثبّت الـ carbanion بالـ −I والرنين.</p>
<ul>
<li><b>Aldol condensation</b>: محتاج α-H وقاعدة قوية. الـ enolate يهاجم كربونيل تاني ثم نزع ماء ← α,β-unsaturated carbonyl.</li>
<li><b>Cannizzaro</b>: ألدهيدات من غير α-H (HCHO والبنزالدهيد) مع قلوي ساخن: جزيء يتختزل لكحول وجزيء يتأكسد لحمض.</li>
<li><b>Haloform (iodoform)</b>: أي مجموعة CH₃CO− مع I₂/NaOH تدي CHI₃ أصفر + ملح حمض فيه كربون أقل بواحد.</li>
<li>الـ −CHO والـ −COR بيقللوا نشاط الحلقة وبيوجّهوا لـ <b>meta</b>.</li>
</ul>
<h4>الأحماض الكربوكسيلية</h4>
<ul>
<li>التسمية: النهاية <b>-oic acid</b> والكربون رقم 1 هو كربون COOH. مثال: 4-chloropentanoic acid.</li>
<li>الإسترات: اسم الألكيل + اسم الحمض بـ <b>-ate</b> (propyl hexanoate).</li>
<li>درجة الغليان عالية لأن جزيئين بيعملوا <b>dimer</b> بروابط هيدروجينية. أول 4 أحماض بتمتزج بالماء تمامًا.</li>
</ul>`},
4:{t:"الحمضية وتحضير وتفاعلات الأحماض الكربوكسيلية",h:`
<p>الحمضية بتعتمد على ثبات أيون الكربوكسيلات (الشحنة موزعة على أكسجينين).</p>
<ul>
<li>كل ما الـ s-character يزيد الحمضية تزيد: sp > sp² > sp³.</li>
<li>مجموعات الألكيل (+I) بتقلل الحمضية. مجموعات −I بتزوّدها: كل ما تكتر، وتبقى أكتر سالبية كهربية (F > Cl > Br > I)، وأقرب للـ COOH.</li>
<li>حمض البنزويك (pKa 4.2) أقوى من الأسيتيك.</li>
<li>NO₂ في para بيأثر بـ −M فأقوى من meta. OH في para بـ +M بيضعّف الحمض.</li>
<li><b>Ortho effect</b>: أي مجموعة ortho بتلف الـ COOH برّه مستوى الحلقة فيبقى الحمض أقوى، حتى لو المجموعة مانحة.</li>
</ul>
<h4>التحضير</h4>
<ul>
<li>أكسدة الكحولات الأولية أو الألدهيدات بـ KMnO₄.</li>
<li>Grignard + CO₂ يدي حمض فيه كربون زيادة.</li>
<li>تحلل الـ nitriles بالحمض.</li>
</ul>
<h4>التفاعلات</h4>
<ul>
<li><b>HVZ</b> (X₂/P): هلجنة الـ α ثم استبدال بـ OH أو NH₂.</li>
<li>مع NaOH: أملاح. <b>Diclofenac potassium</b> أذوب فمفعوله أسرع (ألم حاد)، و <b>diclofenac sodium</b> أبطأ (التهاب مفاصل مزمن).</li>
<li><b>Nucleophilic acyl substitution</b>: الـ acid chlorides هي الأنشط. مع كحول يدي إستر، ومع أمين يدي أميد.</li>
<li><b>Fischer esterification</b> عكسية، فنستخدم زيادة من الكحول أو الحمض.</li>
</ul>`},
5:{t:"الأشكال الفراغية (Conformations) والهكسان الحلقي",h:`
<p>الـ <b>Conformers</b>: نفس الجزيء بيتحول بالدوران حوالين الروابط الأحادية أو قلب الحلقة، وحاجز الطاقة صغير.</p>
<ul>
<li>عوامل الطاقة: torsional strain، steric strain، dipole–dipole، والرابطة الهيدروجينية.</li>
<li><b>ثبات البيوتان</b>: anti > gauche > partially eclipsed > fully eclipsed.</li>
<li>الإيثيلين جليكول والإيثانولامين: الـ <b>gauche</b> هو الأثبت بسبب رابطة هيدروجين داخلية.</li>
</ul>
<h4>Chair مقابل Boat</h4>
<ul>
<li><b>Chair</b>: مفيش angle strain (109.5°) ولا torsional ولا steric، فهو <b>الأثبت</b>.</li>
<li><b>Boat</b>: فيه هيدروجينات eclipsed وهيدروجينات flagpole عند C1 و C4، فهو أقل ثباتًا.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> كل كربون ليه رابطة axial ورابطة equatorial، وقلب الحلقة بيبدّلهم. المجموعات بتفضّل <b>equatorial</b> عشان تبعد عن الـ 1,3-diaxial، والمجموعة الأكبر تاخد equatorial.</div>`},
6:{t:"تسمية المركبات الحلقية غير المتجانسة",h:`
<p>الـ <b>heterocycle</b> فيه ذرة واحدة على الأقل في الحلقة مش كربون (N أو O أو S). حوالي 59% من الأدوية المعتمدة من FDA فيها حلقات نيتروجينية، والأحماض النووية كمان heterocycles.</p>
<ul>
<li><b>أسماء شائعة خماسية</b>: pyrrole، furan، thiophene، imidazole، pyrazole، oxazole، thiazole.</li>
<li><b>سداسية</b>: pyridine، pyrimidine، pyrazine، pyridazine.</li>
</ul>
<h4>نظام Hantzsch–Widman</h4>
<p>الاسم = <b>بادئة</b> (نوع الذرة: oxa > thia > aza مع الأرقام) + <b>جذر</b> (حجم الحلقة) + <b>لاحقة</b> (مشبعة ولا لأ، وفيها نيتروجين ولا لأ).</p>
<ul>
<li>ثلاثية فيها N: غير مشبعة <b>-irine</b>، مشبعة <b>-iridine</b>.</li>
<li>ثلاثية من غير N: غير مشبعة <b>-irene</b>، مشبعة <b>-irane</b>.</li>
<li>أمثلة: aziridine (مشبعة فيها N)، oxirane (فيها O)، thiirane (فيها S).</li>
</ul>`}
}

{l:4,q:"Propyl paraben differs from methyl paraben in being:",o:["Water soluble","Water insoluble","Not a preservative","An antioxidant"],a:1,e:"Methyl paraben is water soluble."},

{l:4,q:"EDTA protects against oxidation by:",o:["Absorbing light","Chelating trace heavy metals","Replacing oxygen","Lowering temperature"],a:1,e:"Metals catalyse oxidation."},
{l:4,q:"Replacing container headspace with nitrogen is done to:",o:["Sterilize","Prevent oxidation","Add pressure","Improve taste"],a:1,e:"Removes oxygen."},
{l:4,q:"Sucrose is stable over a pH range of about:",o:["1–3","4–8","9–12","Any pH"],a:1,e:"Also colourless and very soluble."},
{l:4,q:"Saccharin is used at concentrations below:",o:["0.2%","2%","20%","50%"],a:0,e:"Higher amounts give bitter/metallic aftertaste."},
{l:4,q:"A bitter taste is best masked with:",o:["Apricot","Anise, chocolate, mint or wild cherry","Citrus","Vanilla only"],a:1,e:"Salty → apricot, liquorice, peach, vanilla."},
{l:4,q:"A salty taste is best masked with:",o:["Apricot, liquorice, peach, vanilla","Mint","Wild cherry","Raspberry only"],a:0,e:"Sour → citrus, liquorice, raspberry."},
{l:4,q:"Menthol masks unpleasant tastes by:",o:["Sweetening","A mild anaesthetic effect on taste receptors","Colouring","Precipitation"],a:1,e:"It desensitizes taste buds."},
{l:4,q:"Which is a disadvantage of natural flavours?",o:["Cheaper","Variable composition and microbial contamination","More stable","Always available"],a:1,e:"Artificial flavours are cheaper and more stable."},
{l:4,q:"Colours are used in hospitals to:",o:["Preserve","Differentiate antiseptic solutions","Buffer","Thicken"],a:1,e:"Also identify poisons and match flavours."},
{l:4,q:"ORS contains per litre:",o:["45 mEq Na⁺, 20 K⁺, 35 Cl⁻, 30 citrate, 25 g dextrose","90 mEq Na⁺ only","10 g sucrose","100 mEq K⁺"],a:0,e:"For mild to moderate dehydration."},
{l:4,q:"Magnesium citrate oral solution is used as:",o:["An antacid","A saline cathartic","A sedative","A diuretic"],a:1,e:"Usual adult dose 200 mL."},
{l:4,q:"Sodium citrate–citric acid solution is used in gout because:",o:["It dissolves uric acid crystals directly","It alkalinizes urine, preventing urate crystallization","It lowers blood pressure","It is a laxative"],a:1,e:"Urates crystallize in acid urine."},
{l:4,q:"Sorbitol and glycerin syrups are NOT suitable for diabetics because they are:",o:["Non-glycogenic","Glycogenic","Toxic","Insoluble"],a:1,e:"They are converted to glucose."},
{l:4,q:"Artificial simple syrup contains:",o:["Sucrose 66.7%","Sodium CMC 1.5% + saccharin sodium 0.6%","Sorbitol 70%","Glycerin 50%"],a:1,e:"For diabetic patients."},
{l:4,q:"Saccharin sodium is about how much sweeter than sucrose?",o:["3–5×","30–55×","300–550×","3,000×"],a:2,e:"300–550 times, with a bitter taste."},
{l:4,q:"Nearly saturated sucrose syrups need no preservative because:",o:["Sucrose is antibacterial","There is no free water for microbial growth","They are sterile","They are acidic"],a:1,e:"Water is bound to sugar."},
{l:4,q:"Alcohol does NOT act as a preservative below:",o:["1%","5%","15–20%","50%"],a:2,e:"Concentrations under 15–20% don't preserve."},
{l:4,q:"A linctus should be:",o:["Diluted with water","Sipped slowly and not diluted","Injected","Applied externally"],a:1,e:"Demulcent action on the throat."},
{l:5,q:"Lotions differ from liniments in that lotions are applied:",o:["With rubbing","Without friction","Only to broken skin","Rectally"],a:1,e:"Liniments are rubbed in."},
{l:5,q:"Glycerin in a lotion acts as a:",o:["Preservative","Humectant","Colour","Propellant"],a:1,e:"Retains moisture on the skin."},
{l:5,q:"Alcohol in a lotion gives:",o:["A cooling effect and dry skin","Greasiness","Colour","Thickness"],a:0,e:"It evaporates quickly."},
{l:5,q:"Which is an astringent in vaginal douches?",o:["Povidone-iodine","Potassium alum","Menthol","Sodium lauryl sulfate"],a:1,e:"Also ammonium alum."},
{l:5,q:"Sodium lauryl sulfate in douches acts as a:",o:["Detergent","Buffer","Anaesthetic","Astringent"],a:0,e:"Detergent component."},
{l:5,q:"Plain water evacuation enemas use about:",o:["5–10 mL","50 mL","0.5–1 L","5 L"],a:2,e:"Small-volume ones (~130 mL) use MgSO₄ or phosphate."},
{l:5,q:"Hydrocortisone retention enemas treat:",o:["Constipation","Ulcerative colitis","Asthma","Insomnia"],a:1,e:"Local anti-inflammatory effect."},
{l:5,q:"Aminophylline rectal enema is used for:",o:["Sedation","Asthma (systemic effect)","Diagnosis","Evacuation"],a:1,e:"Chloral hydrate enema is sedative."},
{l:5,q:"Diagnostic enemas contain:",o:["Barium sulfate","Glycerol","Hydrocortisone","Phosphate"],a:0,e:"A radiopaque agent for X-ray of the colon."},
{l:5,q:"Retention enemas should not exceed about ___ in adults.",o:["15 mL","150 mL","500 mL","1 L"],a:1,e:"Larger volumes trigger expulsion."},
{l:5,q:"Calcitonin nasal spray acts:",o:["Locally as a decongestant","Systemically for osteoporosis","As an antiseptic","As a buffer"],a:1,e:"Ephedrine is the local decongestant example."},
{l:5,q:"Nasal decongestant solutions are buffered at pH:",o:["2–3","5.5–6.5","8–9","10–11"],a:1,e:"To protect cilia and drug stability."},
{l:5,q:"Rhinitis medicamentosa is caused by:",o:["Too-short use of decongestants","Prolonged decongestant use","Isotonic drops","Antibiotics"],a:1,e:"Limit use to 3–5 days."},
{l:5,q:"Glycerin is used as an ear-drop vehicle because it is:",o:["Volatile","Viscous and hygroscopic","Acidic","Antibacterial by itself only"],a:1,e:"Longer contact, less microbial growth, less swelling."},
{l:5,q:"Benzocaine in ear drops acts as:",o:["Anti-infective","Local anaesthetic/analgesic","Anti-inflammatory","Wax remover"],a:1,e:"Often with antipyrine."},
{l:5,q:"Oily IM depot injections of testosterone esters work by:",o:["Rapid absorption","Slow partitioning of drug from the oil pool","Dissolving in blood immediately","Hydrolysis in the oil"],a:1,e:"The oil remains as a discrete entity in muscle."},
{l:5,q:"Ethanol is useful for extracting crude drugs because it dissolves:",o:["Gums and starch","Resins, volatile oils, alkaloids and glycosides, but not gums or starch","Only water-soluble materials","Proteins only"],a:1,e:"It is selective for actives."},
{l:5,q:"The OTC oral alcohol limit for children under 6 is:",o:["0.5%","5%","10%","15%"],a:0,e:"6–12 years: 5%; over 12: 10%."},
{l:5,q:"Adding water to a tincture may cause:",o:["Precipitation of drug","Colour change only","Sterilization","Gas"],a:0,e:"Diluting the alcohol reduces solubility."},
{l:5,q:"Alcohol in elixirs precipitates:",o:["Glucose","Tragacanth, acacia, agar and inorganic salts","Water","Volatile oils"],a:1,e:"A classic incompatibility."},
{l:5,q:"A disadvantage of glycerin as a solvent is that it:",o:["Is toxic","Is not selective and very viscous","Is volatile","Is insoluble in water"],a:1,e:"It dissolves gums and starch too."},
{l:5,q:"Almond oil is used for phenol injections because:",o:["Aqueous phenol is caustic","Phenol is insoluble in oil","It is cheaper","It is a preservative"],a:0,e:"Used to block nerves and for haemorrhoids."},
{l:5,q:"Which oil is used as a solvent for oral antibiotics?",o:["Castor oil","Coconut oil","Almond oil","Sesame oil"],a:1,e:"Castor, sesame, olive oils are for parenteral depots."},
{l:5,q:"Alcoholic liniments are used for their:",o:["Massage only","Rubefacient and counter-irritant effects","Sterility","Nutrition"],a:1,e:"Oily liniments are milder, for massage."},
{l:5,q:"Liniments should never be applied to:",o:["Intact skin","Broken or injured skin","Muscles","Joints"],a:1,e:"Safety rule."},
{l:5,q:"Collodion contains pyroxylin at:",o:["0.4%","4%","40%","10%"],a:1,e:"In alcohol/ether or alcohol/acetone 1:3."},
{l:5,q:"In flexible collodion, camphor's role is to:",o:["Add flexibility","Make it waterproof","Act as solvent","Kill bacteria"],a:1,e:"Castor oil 3% adds flexibility."},
{l:5,q:"Salicylic acid collodion contains salicylic acid at:",o:["1%","10%","25%","50%"],a:1,e:"Keratolytic for corns and warts."},
{l:6,q:"Colloidal particles range in size from:",o:["<1 nm","1–500 nm","0.5–5 mm",">1 mm"],a:1,e:"Molecular <1 nm; coarse >500 nm."},
{l:6,q:"Colloidal particles pass through:",o:["Semipermeable membranes","Filter paper but not semipermeable membranes","Nothing","Ultrafilters"],a:1,e:"The basis of dialysis."},
{l:6,q:"Colloidal particles are detected by the:",o:["Naked eye","Light microscope","Ultramicroscope","None"],a:2,e:"Electron microscope shows them too."},
{l:6,q:"Which is a molecular dispersion?",o:["Glucose solution","Suspension","Emulsion","Colloidal silver"],a:0,e:"True solution < 1 nm."},
{l:6,q:"Platinum black is an effective catalyst because of its:",o:["Colour","Huge specific surface area","Charge","Weight"],a:1,e:"Catalysts adsorb reactants on their surface."},
{l:6,q:"When a red gold sol's particles grow larger, its colour becomes:",o:["Green","Blue","Yellow","Colourless"],a:1,e:"Colour relates to particle size."},
{l:6,q:"Colloidal silver salts are preferred as germicides because they:",o:["Are cheaper","Don't irritate like ionic silver salts","Are coloured","Dissolve fast"],a:1,e:"Silver iodide, chloride, protein."},
{l:6,q:"Dextran, PVP and gelatin are used as:",o:["Antacids","Plasma substitutes","Catalysts","Germicides"],a:1,e:"Hydrophilic colloids restoring blood volume."},
{l:6,q:"Iron–dextran is used to treat:",o:["Syphilis","Anaemia","Cancer","Infections"],a:1,e:"Non-ionic hydrophilic sol."},
{l:6,q:"Lyophilic colloids form:",o:["Only by special methods","Spontaneously","Only with electrolytes","Only by ultrasound"],a:1,e:"Strong attraction to the medium."},
{l:6,q:"Hydration refers to:",o:["Solvation when water is the medium","Loss of charge","Precipitation","Micelle formation"],a:0,e:"The solvent sheath in water."},
{l:6,q:"Rubber in an organic solvent is an example of a:",o:["Hydrophilic colloid","Lipophilic (lyophilic) colloid","Lyophobic colloid","Association colloid"],a:1,e:"Lyophilic in an organic medium."},
{l:6,q:"Lyophobic colloids are stabilized by:",o:["Solvent sheath","Surface charge only","Both sheath and charge","Nothing"],a:1,e:"Small electrolyte amounts neutralize the charge."},
{l:6,q:"Lyophobic colloids affect the medium's viscosity:",o:["Greatly","Hardly at all","Only when heated","By solidifying it"],a:1,e:"Unsolvated, symmetric particles."},
{l:6,q:"Lyophilic colloids are salted out by:",o:["Small amounts of electrolyte","High concentrations of very soluble electrolytes (desolvation)","Heat","Light"],a:1,e:"They resist small amounts."},
{l:6,q:"In association colloids, electrolytes:",o:["Raise the CMC","Lower the CMC","Have no effect","Destroy micelles always"],a:1,e:"Salting out at higher concentration."},
{l:6,q:"The 'hedgehog' analogy says a particle in an unsuitable solvent:",o:["Unrolls","Rolls up to reduce exposed area","Dissolves","Gains charge"],a:1,e:"Lyophobic behaviour."},
{l:6,q:"An ultrasonic generator for dispersion operates above:",o:["200 cycles/s","2,000 cycles/s","20,000 cycles/s","2 million cycles/s"],a:2,e:"High-intensity ultrasound."},
{l:6,q:"A disadvantage of the colloid mill is:",o:["Very high efficiency","Low efficiency, reducing only a small proportion of particles","It uses electricity","It forms nuclei"],a:1,e:"Material is sheared between rotating plates."},
{l:6,q:"Pouring sulfur dissolved in an organic solvent into excess water makes a sol by:",o:["Dispersion","Condensation (supersaturation and nucleation)","Dialysis","Hydrolysis"],a:1,e:"Small nuclei grow to colloidal size."},
{l:6,q:"Boiling ferric chloride with water forms a red ferric oxide sol by:",o:["Oxidation","Hydrolysis","Reduction","Milling"],a:1,e:"A chemical condensation method."},
{l:6,q:"Why purify lyophobic sols?",o:["To add colour","Electrolyte impurities cause flocculation","To increase viscosity","To sterilize"],a:1,e:"Dialysis, electrodialysis, ultrafiltration."},
{l:6,q:"Electrodialysis uses a vessel with how many compartments?",o:["One","Two","Three","Five"],a:2,e:"Electrodes in the outer two, sol in the middle."},
{l:6,q:"In electrodialysis, cations migrate toward the:",o:["Positive electrode","Negative electrode","Sol compartment","They don't move"],a:1,e:"Anions move to the positive electrode."},
{l:6,q:"Ultrafiltration membranes are supported by wire screens because:",o:["They are coloured","High pressure or suction is applied","They dissolve","They are magnetic"],a:1,e:"Very fine pores need support."},
{l:6,q:"In haemodialysis, which substance moves from dialysate INTO blood?",o:["Urea","Bicarbonate","Glucose","Plasma proteins"],a:1,e:"Deficient substances diffuse into blood."},
{l:6,q:"Glucose in dialysate is kept at the same concentration as blood so that:",o:["It diffuses out","There is no net loss or gain","It precipitates","It kills bacteria"],a:1,e:"Normal-level substances stay unchanged."},
{l:6,q:"Success of the artificial kidney is judged by its ability to reduce blood:",o:["Glucose","Urea","Albumin","Bicarbonate"],a:1,e:"Urea diffuses out into dialysate."},
{l:7,q:"The Tyndall cone results from:",o:["Absorption of light","Scattering of light by colloidal particles","Fluorescence","Reflection by the container"],a:1,e:"True solutions don't scatter."},
{l:7,q:"Turbidity of a colloid is measured at:",o:["0°","45°","90°","180°"],a:2,e:"At 90° to the incident beam."},
{l:7,q:"Turbidity of a lyophobic colloid is proportional to:",o:["Viscosity","Molecular weight and concentration","Temperature only","pH"],a:1,e:"Used for molecular weight determination."},
{l:7,q:"In the ultramicroscope, colloidal particles appear as:",o:["Dark spots on light background","Bright spots on dark background","Their true shape","Coloured rings"],a:1,e:"Based on light scattering; useful for counting."},
{l:7,q:"The main drawback of the electron microscope for colloids is:",o:["Low resolution","Only dried samples can be examined (no solvation info)","It can't show shape","It's too fast"],a:1,e:"The solvent sheath is lost on drying."},
{l:7,q:"Resolving power is:",o:["Magnification","The smallest distance at which two objects remain distinguishable","Light intensity","Wavelength"],a:1,e:"Electron microscopes resolve down to ~5 Å."},
{l:7,q:"Brownian motion is caused by:",o:["Gravity","Bombardment by molecules of the dispersion medium","Electric fields","Light"],a:1,e:"Random zig-zag movement."},
{l:7,q:"Brownian motion is faster with:",o:["Larger particles","Smaller particles and lower viscosity","Higher viscosity","Lower temperature"],a:1,e:"Glycerin slows and stops it."},
{l:7,q:"Diffusion of colloids is a direct result of:",o:["Sedimentation","Brownian motion","Osmosis","Viscosity"],a:1,e:"Described by Fick's first law."},
{l:7,q:"The minus sign in Fick's first law indicates:",o:["Diffusion is negative","Diffusion goes toward decreasing concentration","Particles are negative","Time is reversed"],a:1,e:"dm/dt = −D·A·dC/dx."},
{l:7,q:"Osmosis is the movement of:",o:["Solute from high to low concentration","Solvent from lower to higher solute concentration across a semipermeable membrane","Colloids through filter paper","Ions in an electric field"],a:1,e:"The pressure involved is osmotic pressure."},
{l:7,q:"In Stokes' law, halving the particle radius changes settling velocity to:",o:["Half","A quarter","Double","Unchanged"],a:1,e:"v ∝ r²."},
{l:7,q:"Increasing medium viscosity in Stokes' law:",o:["Increases settling","Decreases settling","Has no effect","Reverses settling"],a:1,e:"η is in the denominator."},
{l:7,q:"Below about 0.5 µm, sedimentation is opposed by:",o:["Gravity","Brownian motion","Viscosity alone","Charge"],a:1,e:"An ultracentrifuge is needed."},
{l:7,q:"The ultracentrifuge is used to determine:",o:["Colour","Molecular weight of proteins and sample homogeneity","pH","Turbidity"],a:1,e:"Also separates polydisperse systems."},
{l:7,q:"In η(int) = K·Mᵃ, K and a are:",o:["Universal constants","Constants characteristic of the polymer–solvent system","Variables","Temperature terms"],a:1,e:"Used for molecular weight from viscosity."},
{l:7,q:"Linear lyophilic particles give high viscosity because they are:",o:["Unsolvated and spherical","Solvated and asymmetric","Charged only","Small"],a:1,e:"Spherical lyophobic particles give low viscosity."},
{l:7,q:"Electrophoresis is the:",o:["Scattering of light","Movement of charged colloidal particles in an electric field","Settling under gravity","Diffusion"],a:1,e:"Linked to the electric double layer."}
];

QX.genetics=[
{l:1,q:"Rosalind Franklin's X-ray work showed that the sugar–phosphate backbone is:",o:["Inside the helix","Outside the helix","Absent in DNA","Only on one strand"],a:1,e:"The charged backbone faces water on the outside; the hydrophobic bases are inside."},
{l:1,q:"A DNA sample contains 30% guanine. What percentage is thymine?",o:["30%","20%","40%","70%"],a:1,e:"G = C = 30%, so G + C = 60%. A + T = 40%, split equally: T = 20%."},
{l:1,q:"Chargaff's rule states that:",o:["A = G and C = T","Purines = pyrimidines","A + T = G + C always","DNA has no uracil"],a:1,e:"A = T and G = C, so A + G (purines) = T + C (pyrimidines)."},
{l:1,q:"The bond joining a nitrogenous base to the pentose sugar is the:",o:["Phosphodiester bond","Hydrogen bond","N-glycosidic bond","Peptide bond"],a:2,e:"Base–sugar = N-glycosidic. Nucleotide–nucleotide = phosphodiester."},
{l:1,q:"A phosphodiester bond links:",o:["The 3'-OH of one sugar to the 5' carbon of the next via phosphate","Two bases across the helix","Base to sugar","Two phosphates directly"],a:0,e:"That 3'→5' linkage gives every strand a 5' end and a 3' end."},
{l:1,q:"Which DNA form exists under dehydrating conditions?",o:["B-DNA","Z-DNA","A-DNA","C-DNA"],a:2,e:"A-DNA is right-handed and dehydrated; B is the common cellular form; Z is left-handed."},
{l:1,q:"About how many base pairs wrap around one histone octamer in a nucleosome?",o:["46","92","146","1,000"],a:2,e:"About 146 bp around eight histones form one nucleosome."},
{l:1,q:"Why are replication origins AT-rich?",o:["A=T pairs have only 2 hydrogen bonds, so they melt easily","AT is needed by ligase","Primase only reads AT","GC is absent in eukaryotes"],a:0,e:"Fewer hydrogen bonds make AT regions easier to unwind."},
{l:1,q:"Eukaryotes differ from prokaryotes in replication because they have:",o:["No primers","A single origin","Multiple origins","No lagging strand"],a:2,e:"Large eukaryotic genomes need many origins to finish replication in time."},
{l:1,q:"Which protein binds the origin first and needs ATP to start melting it?",o:["DnaA","SSB","Ligase","Pol I"],a:0,e:"DnaA binds the AT-rich origin sequences and requires ATP."},
{l:1,q:"Single-stranded DNA binding (SSB) proteins:",o:["Synthesize primers","Keep separated strands apart and protect them from nucleases","Seal nicks","Relieve supercoils"],a:1,e:"SSBs coat single strands so they don't re-anneal or get degraded."},
{l:1,q:"The RNA primer made by primase is about how long?",o:["2 nucleotides","10 nucleotides","100 nucleotides","1,000 nucleotides"],a:1,e:"Primase lays down a short primer of about 10 nucleotides."},
{l:1,q:"DNA polymerase III reads the template in which direction?",o:["5'→3'","3'→5'","Both directions equally","It doesn't read a template"],a:1,e:"It reads 3'→5' and builds the new strand 5'→3'."},
{l:1,q:"The leading strand needs how many primers?",o:["None","One","One per Okazaki fragment","Two"],a:1,e:"It is synthesized continuously from a single primer."},
{l:1,q:"Proofreading by DNA polymerase III uses its:",o:["5'→3' polymerase","5'→3' exonuclease","3'→5' exonuclease","Ligase activity"],a:2,e:"It removes a wrongly added nucleotide from the growing 3' end."},
{l:1,q:"The energy for DNA ligase to seal a nick comes from:",o:["GTP → GDP","ATP → AMP + PPi","NADH","Light"],a:1,e:"Ligase splits ATP to AMP + PPi to form the phosphodiester bond."},
{l:1,q:"Semiconservative replication means each daughter DNA has:",o:["Two new strands","Two old strands","One old and one new strand","Mixed fragments on both strands"],a:2,e:"One parental strand is conserved in each new double helix."},
{l:2,q:"The end replication problem occurs at the:",o:["5' end of the leading strand","3' end of the lagging-strand template of linear chromosomes","Origin of replication","Middle of the chromosome"],a:1,e:"After the last primer is removed there's no 3'-OH to fill the gap at the tip."},
{l:2,q:"Why don't bacteria have the end replication problem?",o:["They lack DNA polymerase","Their chromosome is circular","They have no primers","They use RNA genomes"],a:1,e:"A circular chromosome has no ends."},
{l:2,q:"The human telomere repeat sequence is:",o:["TATAAA","TTAGGG","AAUAAA","GCGCGC"],a:1,e:"Telomeres are tandem TTAGGG repeats with a 12–16 nt 3' overhang."},
{l:2,q:"How many telomeres does a normal human somatic cell have?",o:["23","46","92","184"],a:2,e:"46 chromosomes × 2 ends = 92 telomeres."},
{l:2,q:"Telomerase is best described as:",o:["A DNA-dependent RNA polymerase","A reverse transcriptase carrying its own RNA template","A restriction enzyme","A helicase"],a:1,e:"It makes DNA from its built-in RNA template."},
{l:2,q:"The correct order of telomerase action is:",o:["Translocation → binding → polymerization","Binding → polymerization → translocation","Polymerization → binding → translocation","Binding → translocation → ligation"],a:1,e:"It binds the overhang, copies its template, then slides along and repeats."},
{l:2,q:"Telomere length falls from about ___ at birth to about ___ late in life.",o:["1,000 to 500 bp","10,000 to 5,000 bp","100,000 to 50,000 bp","5,000 to 1,000 bp"],a:1,e:"About 10,000 bp at birth, about 5,000 bp in old age."},
{l:2,q:"Cancer cells typically show:",o:["Low telomerase and short telomeres","High telomerase and maintained telomeres","No telomeres","No cell division"],a:1,e:"High telomerase lets them divide indefinitely, making it a drug target."},
{l:2,q:"The 2009 Nobel Prize (telomeres and telomerase) went to:",o:["Watson and Crick","Blackburn, Greider and Szostak","Ambros and Ruvkun","Kaelin, Ratcliffe and Semenza"],a:1,e:"Blackburn, Greider and Szostak."},
{l:2,q:"Template strand 3'-TACGGA-5' gives which mRNA?",o:["5'-ATGCCT-3'","5'-AUGCCU-3'","5'-UACGGA-3'","3'-AUGCCU-5'"],a:1,e:"mRNA is complementary to the template, with U instead of T."},
{l:2,q:"Which RNA polymerase makes tRNA?",o:["Pol I","Pol II","Pol III","Primase"],a:2,e:"Pol III makes tRNA and 5S rRNA."},
{l:2,q:"Intron sequences start with ___ and end with ___.",o:["AG … GT","GT … AG","TATA … AAUAAA","AUG … UGA"],a:1,e:"All introns begin GT (5') and end AG (3')."},
{l:2,q:"The CAAT box mainly controls:",o:["Where translation starts","How often transcription starts","Polyadenylation","Splicing"],a:1,e:"Mutations there cut transcription starts 10–20 fold."},
{l:2,q:"Repressors bind to:",o:["Enhancers","Silencers","TATA box only","Poly-A signal"],a:1,e:"Repressors bind silencers and reduce transcription."},
{l:2,q:"A TATA box is an example of a:",o:["Trans-acting element","Cis-acting element","Coactivator","Ribozyme"],a:1,e:"Cis = DNA sequence; trans = the protein that binds it."},
{l:2,q:"Which factor recognizes the core promoter via TBP?",o:["TFIIB","TFIID","TFIIE","TFIIF"],a:1,e:"TFIID = TBP + TAFs, binding the TATA box."},
{l:2,q:"TFIIB's role in initiation is to:",o:["Unwind DNA","Act as a bridge between TFIID and RNA pol II","Add the poly-A tail","Phosphorylate histones"],a:1,e:"TFIIB brings RNA polymerase II to the promoter-bound TFIID."},
{l:2,q:"The poly-A signal in pre-mRNA is:",o:["TTAGGG","AAUAAA","AUG","GU…AG"],a:1,e:"Cutting occurs 10–35 nt downstream of AAUAAA."},
{l:3,q:"Histone acetyltransferase (HAT) activates genes by:",o:["Adding methyl groups to DNA","Lowering histone basicity so DNA loosens","Cutting introns","Adding the 5' cap"],a:1,e:"Acetylation removes positive charge, freeing DNA and exposing the promoter."},
{l:3,q:"Which enzyme reverses HAT's effect and silences genes?",o:["DNA ligase","Histone deacetylase (HDAC)","Primase","Telomerase"],a:1,e:"HDAC removes acetyl groups, restoring tight nucleosomes."},
{l:3,q:"The unprocessed eukaryotic transcript is called:",o:["cDNA","hnRNA (pre-mRNA)","tRNA","snRNA"],a:1,e:"Heterogeneous nuclear RNA is processed before leaving the nucleus."},
{l:3,q:"snRNPs ('snurps') are made of:",o:["DNA + histones","Small nuclear RNA + proteins","rRNA only","Lipids"],a:1,e:"They are the subunits of the spliceosome."},
{l:3,q:"Which is NOT a function of the spliceosome?",o:["Recognizing intron–exon boundaries","Holding pre-mRNA in shape","Catalysing intron removal","Adding the poly-A tail"],a:3,e:"Polyadenylation is a separate enzymatic step."},
{l:3,q:"Alternative splicing allows:",o:["One gene to make several proteins","DNA replication","Translation without ribosomes","Removal of exons only"],a:0,e:"Different exon combinations give different mature mRNAs."},
{l:3,q:"The 5' cap is added when the transcript is about:",o:["2–5 nt long","20–25 nt long","200 nt long","After transcription is finished"],a:1,e:"Capping happens early, during transcription by pol II."},
{l:3,q:"Which is a function of the 5' cap?",o:["Encodes methionine","Protects mRNA from nucleases and helps ribosome binding","Signals termination","Removes introns"],a:1,e:"It also aids nuclear export and splicing."},
{l:3,q:"The poly-A tail is:",o:["Encoded in the gene","Added enzymatically after transcription","Added by the ribosome","Part of tRNA"],a:1,e:"It isn't in the gene; it's added after cleavage downstream of AAUAAA."},
{l:3,q:"tRNA is roughly how long?",o:["8 nt","80 nt","800 nt","8,000 nt"],a:1,e:"A single strand of about 80 nucleotides folded into an L shape."},
{l:3,q:"Aminoacyl-tRNA synthetase attaches the amino acid using energy from:",o:["GTP","ATP","NADPH","Light"],a:1,e:"ATP → AMP + PPi charges the tRNA."},
{l:3,q:"At the wobble position, G can pair with:",o:["A or G","C or U","Only C","T"],a:1,e:"Flexible pairing at the third codon base only."},
{l:3,q:"Ribosomes are composed of:",o:["60% rRNA, 40% protein","40% rRNA, 60% protein","100% protein","DNA and protein"],a:1,e:"rRNA 40% and protein 60% per the lecture."},
{l:3,q:"The E site of the ribosome holds:",o:["The incoming aminoacyl-tRNA","The tRNA with the growing chain","The empty tRNA about to leave","The mRNA cap"],a:2,e:"A = incoming, P = peptidyl, E = exit."},
{l:3,q:"The polypeptide chain grows from:",o:["C-terminus to N-terminus","N-terminus to C-terminus","Both ends","The middle outward"],a:1,e:"Methionine (N-terminus) first, last amino acid at the C-terminus."},
{l:3,q:"GTP is used during which steps of elongation?",o:["Peptide bond formation only","Codon recognition and translocation","Termination only","Capping"],a:1,e:"GTP powers aminoacyl-tRNA entry and ribosome movement."},
{l:3,q:"At termination, the peptide is released by:",o:["A tRNA binding the stop codon","Hydrolysis of the bond to the P-site tRNA","Ligase","Splicing"],a:1,e:"No tRNA reads stop codons; water releases the chain."},
{l:3,q:"Many ribosomes translating one mRNA together form a:",o:["Spliceosome","Polysome","Nucleosome","Proteasome"],a:1,e:"Polyribosomes make many copies quickly."},
{l:4,q:"The proteome (>1 million proteins) is much larger than the genome (20–25,000 genes) mainly because of:",o:["Mutation","Alternative splicing plus PTMs","DNA replication errors","Telomerase"],a:1,e:"Splicing expands the transcriptome; PTMs multiply the proteome."},
{l:4,q:"Ubiquitination is classified as a PTM by addition of:",o:["Chemical groups","Complex groups","Polypeptides","Cleavage"],a:2,e:"Ubiquitin is a small protein (polypeptide) added to the target."},
{l:4,q:"Glycosylation belongs to which PTM group?",o:["Chemical groups","Complex groups","Polypeptides","Proteolysis"],a:1,e:"Complex groups: glycosylation, AMPylation, lipidation."},
{l:4,q:"Phosphorylation makes a protein region:",o:["Positively charged and hydrophobic","Negatively charged and hydrophilic","Uncharged","Lipid-soluble"],a:1,e:"Phosphate adds negative charge, changing conformation."},
{l:4,q:"Acetyl-CoA carboxylase is ___ by phosphorylation.",o:["Activated","Inhibited","Degraded","Not affected"],a:1,e:"It is inhibited by phosphorylation and activated by dephosphorylation."},
{l:4,q:"p53 is ___ by phosphorylation of its N-terminus.",o:["Inhibited","Activated","Degraded","Exported"],a:1,e:"Several kinases phosphorylate and activate this tumour suppressor."},
{l:4,q:"Hydroxylation of proline and lysine is classically seen in:",o:["Haemoglobin","Collagen","Insulin","Histone H1"],a:1,e:"Hydroxylases act on Pro and Lys in collagen."},
{l:4,q:"Lysine can be methylated up to:",o:["Once","Twice","Three times","Five times"],a:2,e:"Lys: 1–3 times; Arg: 1–2 times."},
{l:4,q:"Ubiquitin's molecular weight is about:",o:["0.86 kDa","8.6 kDa","86 kDa","860 kDa"],a:1,e:"It is a small 8.6 kDa regulatory protein."},
{l:4,q:"In a polyubiquitin chain, each new ubiquitin links to:",o:["Any serine","One of seven lysines or the N-terminal Met of the previous ubiquitin","The C-terminus of the target only","DNA"],a:1,e:"That is how chains are built."},
{l:4,q:"Removal of the N-terminal methionine is an example of:",o:["Phosphorylation","Proteolysis","Carboxylation","Acetylation"],a:1,e:"Proteolysis = cleavage of proteins."},
{l:4,q:"Gamma-carboxylation of clotting factors needs:",o:["Vitamin C","Vitamin K","Vitamin B12","Vitamin D"],a:1,e:"γ-glutamyl carboxylase is vitamin K dependent."},
{l:4,q:"Under low oxygen, HIF-1α:",o:["Is hydroxylated and degraded","Accumulates and switches on genes like EPO","Binds VHL more strongly","Is exported from cells"],a:1,e:"Without prolyl hydroxylation, VHL can't tag it, so it builds up."},
{l:4,q:"Which protein recognizes hydroxylated HIF-1α?",o:["p53","VHL","TBP","Dicer"],a:1,e:"VHL binds it, leading to ubiquitination and proteasomal degradation."},
{l:4,q:"Translate: AUG-UUU-GGC-UAA",o:["Met-Phe-Gly-Stop","Met-Leu-Gly-Stop","Met-Phe-Ala","Stop-Phe-Gly-Met"],a:0,e:"AUG Met, UUU Phe, GGC Gly, UAA stop."},
{l:4,q:"Which codon is NOT a stop codon?",o:["UAA","UAG","UGA","UGG"],a:3,e:"UGG codes for tryptophan."},
{l:4,q:"CGA and AGG both code for arginine. This illustrates:",o:["Wobble only","Redundancy (degeneracy) of the code","A mutation","Overlapping code"],a:1,e:"Several codons can specify the same amino acid."},
{l:5,q:"Housekeeping genes encoding metabolic enzymes show:",o:["Facultative expression","Constitutive expression","No expression","Only embryonic expression"],a:1,e:"Always on, at a constant level."},
{l:5,q:"Epigenetics refers to changes in gene expression that:",o:["Alter the DNA sequence","Do not alter the DNA sequence","Only affect RNA viruses","Only happen in bacteria"],a:1,e:"Tools: cis/trans elements, ncRNAs, histone modifications."},
{l:5,q:"C/EBPs are a family of how many transcription factors?",o:["Two","Four","Six","Twelve"],a:2,e:"Six members that recruit co-activators."},
{l:5,q:"Sp1 binds which promoter element?",o:["TATA box","GC box","CAAT box only","Poly-A signal"],a:1,e:"Sp1 binds GC boxes and recruits TFIID and RNA pol II."},
{l:5,q:"An activator's two domains are:",o:["DNA-binding and regulatory","Kinase and phosphatase","Helicase and primase","Cap and tail"],a:0,e:"One attaches to DNA; the other interacts with other regulators."},
{l:5,q:"Coactivators:",o:["Bind silencers","Transmit signals from activators to basal factors","Cut miRNA hairpins","Methylate DNA"],a:1,e:"They link activators and the basal machinery."},
{l:5,q:"Enhancers far from a gene can act on it because:",o:["The DNA loops, bringing the enhancer-bound activator near the promoter","They are transcribed into mRNA","They encode the gene","They move along the chromosome"],a:0,e:"Looping allows control at a distance."},
{l:5,q:"Methylation of CpG islands near a promoter usually:",o:["Activates transcription","Represses transcription","Has no effect","Causes splicing"],a:1,e:"It blocks Sp1 and recruits methyl-CpG binding protein + HDAC."},
{l:5,q:"Methyl-CpG binding protein silences genes mainly by recruiting:",o:["HAT","HDAC","RNA pol II","Telomerase"],a:1,e:"HDAC closes the chromatin."},
{l:5,q:"About what fraction of the primary transcript is removed during processing?",o:["10%","50%","90%","None"],a:2,e:"About 90% is removed to make mature mRNA."},
{l:5,q:"miRNA is about how long?",o:["2 nt","22 nt","220 nt","2,200 nt"],a:1,e:"Single-stranded, about 22 nucleotides."},
{l:5,q:"Which enzyme cuts the miRNA hairpin?",o:["Ligase","Dicer","Primase","Telomerase"],a:1,e:"Dicer cleaves double-stranded RNA."},
{l:5,q:"miRNA works inside which complex?",o:["Spliceosome","RISC","Proteasome","Nucleosome"],a:1,e:"RNA-induced silencing complex."},
{l:5,q:"Which polymerase transcribes miRNA genes?",o:["RNA pol I","RNA pol II","RNA pol III","DNA pol III"],a:1,e:"Pol II makes the hairpin precursor."},
{l:5,q:"Over-expression of miRNA-181 would:",o:["Increase telomerase","Decrease telomerase","Not affect telomerase","Lengthen telomeres"],a:1,e:"More miRNA silences more telomerase mRNA."},
{l:5,q:"The 2024 Nobel Prize in Physiology or Medicine was for:",o:["Telomerase","microRNA","HIF-1α","CRISPR"],a:1,e:"Ambros and Ruvkun discovered microRNA."},
{l:6,q:"circRNAs are formed by:",o:["Canonical splicing","Back-splicing joining 5' to 3' end","Reverse transcription","Replication"],a:1,e:"The cut segment closes into a ring."},
{l:6,q:"circRNA half-life is about:",o:["4 minutes","48 hours","48 days","4 years"],a:1,e:"About 48 h, roughly 5× more stable than linear mRNA."},
{l:6,q:"Why are circRNAs so stable?",o:["They are double-stranded","They have no free ends for exonucleases","They are methylated","They are in the nucleolus"],a:1,e:"Most RNA-degrading enzymes attack ends."},
{l:6,q:"lncRNAs are typically:",o:["Shorter than 22 nt","Longer than 200 nt, often 1,000–10,000 nt","Circular","Translated into protein"],a:1,e:"They resemble mRNA: pol II, capped, polyadenylated."},
{l:6,q:"An lncRNA that binds a transcription factor and keeps it from its target acts as a:",o:["Guide","Scaffold","Decoy","Ribozyme"],a:2,e:"Decoys sequester proteins, silencing genes."},
{l:6,q:"HOTAIR over-expression lowers ubiquitin protein because HOTAIR:",o:["Degrades ubiquitin mRNA","Recruits HDAC to the ubiquitin promoter","Is translated into a repressor","Methylates ubiquitin"],a:1,e:"Deacetylation closes chromatin and lowers transcription."},
{l:6,q:"If HOTAIR (which sponges miR-236) decreases, p21 will:",o:["Increase","Decrease","Stay the same","Be mutated"],a:1,e:"More free miR-236 silences p21 mRNA."},
{l:6,q:"The linker histone that forms the 30 nm fibre is:",o:["H2A","H3","H1","CENP-A"],a:2,e:"H1 binds outside the octamer."},
{l:6,q:"Which nucleosome sites are most frequently accessible?",o:["Those at the centre","Those near the ends","None","Only histone sites"],a:1,e:"DNA near the ends unwraps most often."},
{l:6,q:"Nucleosome remodeling complexes use energy from:",o:["GTP","ATP","NADH","Light"],a:1,e:"They slide, transfer or remodel nucleosomes using ATP."},
{l:6,q:"Moving a histone octamer to another DNA molecule is called:",o:["Sliding","Transfer","Remodeling","Positioning"],a:1,e:"Sliding moves along the same DNA; transfer moves to another."},
{l:6,q:"A:T-rich DNA is favoured where the minor groove:",o:["Faces away from the octamer","Faces the octamer","Is absent","Is methylated"],a:1,e:"A:T-rich DNA bends easily toward the minor groove."},
{l:6,q:"Serine phosphorylation of histone tails gives:",o:["Repressed chromatin","Active chromatin","Heterochromatin always","No change"],a:1,e:"Like acetylation, it reduces positive charge."},
{l:6,q:"Chromodomains recognize:",o:["Acetylated tails","Methylated tails","Phosphorylated DNA","CpG islands"],a:1,e:"Bromo = acetyl; chromo = methyl."},
{l:6,q:"Which is NOT a level of eukaryotic gene regulation?",o:["Transcription","RNA processing","Translation","DNA replication fidelity"],a:3,e:"The four levels: transcription, RNA processing, translation, post-translation."},
{l:6,q:"Which haemoglobin has the highest oxygen affinity?",o:["Adult","Fetal","Embryonic","All equal"],a:2,e:"Embryo highest, fetus high, adult moderate."},
{l:6,q:"Adult haemoglobin consists of:",o:["2α + 2γ","2α + 2β","2ζ + 2ε","4β"],a:1,e:"Fetal is 2α + 2γ; embryonic 2ζ + 2ε."},
{l:6,q:"Regulatory protein-binding sites near promoters are usually:",o:["1–2 nt","10–15 nt","100–150 nt","1,000 nt"],a:1,e:"Short sites of about 10–15 nucleotides."},
{l:6,q:"DNA-binding proteins usually read the major groove because:",o:["It is narrower","Individual base pairs can be distinguished there","It contains no bases","It is single-stranded"],a:1,e:"The major groove is wider and exposes sequence information."},
{l:6,q:"The leucine zipper is formed by:",o:["One α-helix","Two subunits joined by hydrophobic leucines into a Y shape","Zinc atoms","RNA"],a:1,e:"The two helical arms fit into the major groove."},
{l:7,q:"Which non-human organism was NOT among those sequenced by the HGP?",o:["E. coli","Baker's yeast","Fruit fly","Zebrafish"],a:3,e:"The list was E. coli, yeast, fruit fly and mouse."},
{l:7,q:"How many countries took part in the International Human Genome Sequencing Consortium?",o:["2","6","20","50"],a:1,e:"20 centres in 6 countries."},
{l:7,q:"Which sequencing method did the HGP use (after improving it)?",o:["Nanopore","Sanger sequencing","Illumina","Maxam–Gilbert"],a:1,e:"Sanger sequencing, greatly advanced by innovations."},
{l:7,q:"The June 2000 draft contained about how many gaps?",o:["Fewer than 400","About 4,000","More than 150,000","None"],a:2,e:"Over 150,000 gaps; the 2003 version had fewer than 400."},
{l:7,q:"The 2003 'essentially complete' sequence covered about:",o:["50%","90%","92%","100%"],a:2,e:"About 92% with fewer than 400 gaps."},
{l:7,q:"The hardest regions to sequence were:",o:["Exons","Telomeres and centromeres","Promoters","Mitochondrial genes"],a:1,e:"Highly repetitive DNA is hard to assemble."},
{l:7,q:"When was the first truly complete human genome announced?",o:["April 2003","June 2000","31 March 2022","March 2021"],a:2,e:"By the Telomere-to-Telomere (T2T) consortium."},
{l:7,q:"The Egyptian Genome Project was launched in:",o:["1990","2003","March 2021","2022"],a:2,e:"March 2021."},
{l:7,q:"Which is an aim of the Egyptian Genome Project?",o:["Sequencing the mouse genome","Studying genomes of ancient Egyptians","Replacing Sanger sequencing","Cloning humans"],a:1,e:"Also a reference Egyptian genome, common disease genes and sports performance."},
{l:7,q:"Humans are about what percent identical at the base-pair level?",o:["90%","99%","99.9%","100%"],a:2,e:"The 0.1% difference shapes traits and disease risk."},
{l:7,q:"A single-base variant found in 5% of a population is a:",o:["Mutation","SNP","Deletion","Translocation"],a:1,e:"≥ 1% = SNP; < 1% = mutation."},
{l:7,q:"'45 C>T' means:",o:["45 copies of C","At nucleotide 45, normal C is replaced by T","C and T are deleted","A 45-base insertion"],a:1,e:"Standard notation for a single-base change."}

QX.organic=[
{l:1,q:"The carbonyl carbon in aldehydes and ketones is hybridized:",o:["sp","sp²","sp³","dsp²"],a:1,e:"Trigonal planar, ~120°."},
{l:1,q:"The C=O bond is polar with partial positive charge on:",o:["Oxygen","Carbon","Hydrogen","Both equally"],a:1,e:"O is more electronegative; C is electrophilic."},
{l:1,q:"The IUPAC suffix for aldehydes is:",o:["-one","-al","-ol","-oic acid"],a:1,e:"Ketones use -one."},
{l:1,q:"CH₃COCH₃ is named:",o:["Propanal","Propanone","Ethanal","Butanone"],a:1,e:"Common name acetone."},
{l:1,q:"HCHO is:",o:["Acetaldehyde","Formaldehyde (methanal)","Acetone","Benzaldehyde"],a:1,e:"The simplest aldehyde."},
{l:1,q:"Aldehydes and ketones have boiling points:",o:["Higher than alcohols of similar mass","Lower than alcohols but higher than alkanes","Lower than alkanes","Same as alkanes"],a:1,e:"Dipole–dipole but no H-bonding between molecules."},
{l:1,q:"Lower aldehydes and ketones are water soluble because:",o:["They ionize","They form H-bonds with water through the carbonyl oxygen","They are non-polar","They react with water fully"],a:1,e:"Solubility falls as the chain grows."},
