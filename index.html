<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noor E-Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@400;700&display=swap">
<style>
/* Layout: a study desk. Dashboard = greeting, exam countdown strip, course cards; course view = lecture list + quiz workspace. Lab teal with amber "noor" light. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e9efed; --ink:#14211f; --muted:#5a6a67; --line:#d6e0dd;
  --teal:#0f6b62; --teal-soft:#dfeeea; --amber:#b97c06; --amber-soft:#fbf0d9;
  --good:#1d7a45; --good-soft:#e1f2e7; --bad:#b4372f; --bad-soft:#f8e3e1;
  --c1:#2f6fb5; --c2:#c2416b; --c3:#7a5bc4; --c4:#0f8a7c; --c5:#c46a1c;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1615; --surface:#14201f; --sunk:#192826; --ink:#e3edeb; --muted:#93a7a3; --line:#253c38;
  --teal:#4fc1b2; --teal-soft:#15302c; --amber:#f0b53c; --amber-soft:#2d2410;
  --good:#5fcf8c; --good-soft:#132e1e; --bad:#f08a80; --bad-soft:#381b18;
  --c1:#6aa6ea; --c2:#ec7fa2; --c3:#a991ea; --c4:#4fc1b2; --c5:#eb9b52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1615; --surface:#14201f; --sunk:#192826; --ink:#e3edeb; --muted:#93a7a3; --line:#253c38;
  --teal:#4fc1b2; --teal-soft:#15302c; --amber:#f0b53c; --amber-soft:#2d2410;
  --good:#5fcf8c; --good-soft:#132e1e; --bad:#f08a80; --bad-soft:#381b18;
  --c1:#6aa6ea; --c2:#ec7fa2; --c3:#a991ea; --c4:#4fc1b2; --c5:#eb9b52; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

header.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex:none}
.top .brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;line-height:1;cursor:pointer;background:none;border:0;padding:0}
.top .brand span{color:var(--amber)}
.top .sub{color:var(--muted);font-size:.85rem;margin-left:auto}

/* dashboard */
.hello h1{font-family:var(--f-display);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.statrow{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 26px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec-label{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 10px}
.upcoming{display:flex;flex-direction:column;gap:8px;margin-bottom:30px}
.up{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.up .d{font-family:var(--f-mono);font-size:.8rem;line-height:1.25;color:var(--muted)}
.up .d b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.up .t{font-weight:700}
.up .n{font-size:.85rem;color:var(--muted)}
.chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--amber-soft);color:var(--amber)}
.chip.soon{background:var(--bad-soft);color:var(--bad)}
.chip.past{background:var(--sunk);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--hue);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.card .code{font-family:var(--f-mono);font-size:.78rem;color:var(--hue);font-weight:600}
.card h3{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;margin:0}
.card .meta{font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--hue)}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.card .foot b{color:var(--hue)}

/* course view */
.back{all:unset;cursor:pointer;color:var(--muted);font-size:.9rem;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.back:hover{color:var(--teal)}
.chead{border-left:5px solid var(--hue);padding-left:14px;margin-bottom:6px}
.chead .code{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.chead h2{font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.1;margin:2px 0 4px;text-wrap:balance}
.chead p{margin:0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--hue)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.lecnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.lecbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 16px;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:.9rem;line-height:1.3}
.lecbtn:hover{background:var(--surface)}
.lecbtn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--hue)}
.lecbtn .num{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.lecbtn .ok{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.lecbtn .ok.on{background:var(--good);border-color:var(--good)}
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);min-width:0}
.lesson .ln{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.lesson h3{font-family:var(--f-display);font-size:1.55rem;line-height:1.15;margin:4px 0 16px;text-wrap:balance}
.lesson h4{font-family:var(--f-display);font-size:1.08rem;margin:22px 0 8px}
.lesson p,.lesson ul,.lesson ol{max-width:70ch;margin:0 0 12px}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin-bottom:4px}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--teal-soft);padding:12px 16px;border-radius:8px;margin:12px 0;overflow-x:auto;line-height:1.7}
.formula small{display:block;font-family:var(--f-body);color:var(--muted)}
.pearl{background:var(--amber-soft);border-left:4px solid var(--amber);padding:12px 16px;border-radius:0 8px 8px 0;max-width:70ch;margin:14px 0}
.pearl strong{color:var(--amber)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0 14px}
.term{background:var(--sunk);border-radius:8px;padding:10px 12px}
.term b{display:block;font-family:var(--f-display)}
.term span{font-size:.88rem;color:var(--muted)}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lessonfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.btn{all:unset;cursor:pointer;background:var(--teal);color:var(--surface);font-weight:700;padding:10px 18px;border-radius:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.done{background:var(--good)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{all:unset;cursor:pointer;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);max-width:760px}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin:8px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hue);transition:width .3s}
.qlec{font-family:var(--f-mono);font-size:.75rem;color:var(--hue)}
.qtext{font-family:var(--f-display);font-size:1.22rem;line-height:1.35;margin:4px 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.opt:hover:not([disabled]){border-color:var(--hue)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--hue);flex:none;width:1.3em}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:.95rem}
.feedback.ok{background:var(--good-soft)}.feedback.no{background:var(--bad-soft)}
.feedback b{display:block}
.qnav{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center}
.result .score{font-family:var(--f-display);font-size:3.4rem;font-weight:800;color:var(--hue);line-height:1}
.result>p{color:var(--muted)}
.review{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.review div{font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--bg)}
.review .x{color:var(--bad);font-weight:700}.review .v{color:var(--good);font-weight:700}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
footer{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .lecnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .lecbtn{grid-template-columns:auto;flex:none;padding:8px 12px;border:1px solid var(--line);background:var(--surface)}
  .lecbtn .ttl,.lecbtn .ok{display:none}
  .lecbtn[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--hue)}
  .top .sub{margin-left:0;width:100%}
  .up{grid-template-columns:60px minmax(0,1fr)}
  .up .chip{grid-column:2;justify-self:start}
}


/* reading mode switch */
.lesson .bi-ar{direction:rtl;font-family:"Cairo",var(--f-body);line-height:1.9;background:var(--amber-soft);border-right:4px solid var(--amber);border-radius:8px 0 0 8px;padding:12px 16px;margin:8px 0 20px;max-width:70ch}
.lesson .bi-ar h4{margin-top:0;font-family:"Cairo",var(--f-body);color:var(--amber)}
.lesson .bi-ar h5{font-family:"Cairo",var(--f-body)}
.lesson .bi-ar ul,.lesson .bi-ar ol{padding-left:0;padding-right:22px}
.lesson .bi-ar .formula,.lesson .bi-ar .tblwrap{direction:ltr;text-align:left}
.lesson .bi-ar .pearl{border-left:0;border-right:4px solid var(--amber);background:var(--surface)}
.lesson .bi-ar .ex{background:var(--surface)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--sunk);margin:0 0 18px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;font-size:.85rem;font-weight:700;padding:6px 14px;border-radius:999px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg button:focus-visible{outline:2px solid var(--amber)}
.lesson .rtl{direction:rtl;font-family:"Cairo",var(--f-body);line-height:1.9}
.lesson .rtl h4{font-family:"Cairo",var(--f-body)}
.lesson .rtl ul,.lesson .rtl ol{padding-left:0;padding-right:22px}
.lesson .rtl .pearl{border-left:0;border-right:4px solid var(--amber);border-radius:8px 0 0 8px}
.lesson .rtl .formula,.lesson .rtl .tblwrap{direction:ltr;text-align:left}
.lesson .deep h4{font-size:1.15rem;margin-top:26px;color:var(--teal)}
.lesson .deep h5{font-family:var(--f-display);font-size:1rem;margin:16px 0 6px}
.lesson .deep .ex{background:var(--sunk);border-radius:8px;padding:12px 16px;margin:12px 0;max-width:70ch}
.lesson .deep .ex b:first-child{color:var(--teal)}
/* lecture tools: four generate buttons */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 18px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.tool:hover:not([disabled]){border-color:var(--hue)}
.tool:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tool b{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.tool span{font-size:.78rem;color:var(--muted);line-height:1.3}
.tool .ic{font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--hue);letter-spacing:.06em}
.tool[disabled]{opacity:.6;cursor:progress}
.tool .ar{font-family:"Cairo",var(--f-body);font-size:inherit;color:inherit}
.tool.wide{grid-column:1/-1;border-color:var(--hue);background:var(--surface)}
.toolmsg{font-size:.85rem;color:var(--muted);margin:-10px 0 16px;min-height:1.2em}
.toolmsg.err{color:var(--bad)}
@media (max-width:760px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

<div class="wrap">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--teal)"/><rect x="16.5" y="8" width="7" height="24" rx="2" fill="var(--surface)"/><rect x="8" y="16.5" width="24" height="7" rx="2" fill="var(--surface)"/><circle cx="20" cy="20" r="3.2" fill="var(--amber)"/></svg>
    <button class="brand" id="home">Noor <span>E-Learning</span></button>
    <div class="sub">Pharmacy · Year 2 · MSA University · Fall 2026</div>
  </header>
  <main id="view"></main>
  <footer>Lessons and quizzes built from Noor's MSA e-learning lectures (Fall 2026). Progress is saved in this browser.</footer>
</div>

<script>
const COURSES = [
{
 id:"genetics", code:"PHB221", name:"Molecular Genetics", hue:"var(--c1)",
 staff:"Assoc. Prof. Amr Abdelhamid · Dr. Mohamed Abdelghany",
 lectures:[
 {n:1,t:"DNA structure and replication",h:`
 <p>DNA is a <b>double helix</b> of two <b>antiparallel</b> strands (one runs 5'→3', the other 3'→5'). The sugar–phosphate backbone is outside; the bases are inside.</p>
 <ul>
 <li><b>Franklin</b> (X-ray crystallography): backbone outside, bases inside, helical, two strands.</li>
 <li><b>Chargaff's rules</b>: A = T and G = C, so purines (A+G) = pyrimidines (T+C). A=T has <b>2</b> H-bonds; G≡C has <b>3</b> (about 50% stronger).</li>
 <li><b>Watson & Crick (1953)</b>: double helix, antiparallel, read 5'→3'.</li>
 <li>Nucleotides are linked by <b>phosphodiester bonds</b> (3'-OH of one sugar to 5' of the next). Base–sugar link = <b>N-glycosidic bond</b>.</li>
 </ul>
 <div class="terms"><div class="term"><b>Nucleobase</b><span>Base only</span></div><div class="term"><b>Nucleoside</b><span>Base + pentose</span></div><div class="term"><b>Nucleotide</b><span>Base + pentose + phosphate</span></div></div>
 <p><b>DNA forms:</b> B (right-handed, common in cells, high water), A (right-handed, dehydrated), Z (left-handed, rare, narrow and elongated).</p>
 <p><b>Packing:</b> DNA wraps ~<b>146 bp</b> around a histone octamer = one <b>nucleosome</b> → chromatin fibre → chromosome.</p>
 <h4>Replication is semiconservative</h4>
 <ol>
 <li><b>Origin</b>: AT-rich consensus sequence (one in prokaryotes, many in eukaryotes). DnaA binds (needs ATP).</li>
 <li><b>Helicase</b> unwinds (ATP); <b>SSB proteins</b> keep strands apart; <b>topoisomerase</b> relieves supercoils ahead of the fork.</li>
 <li><b>Primase</b> makes a short RNA <b>primer</b> (~10 nt).</li>
 <li><b>DNA pol III</b> adds dNTPs to the free 3'-OH: reads template 3'→5', builds new strand 5'→3'. <b>Leading strand</b> = continuous (1 primer). <b>Lagging strand</b> = discontinuous <b>Okazaki fragments</b> (many primers).</li>
 <li><b>DNA pol I</b> removes primers (5'→3' exonuclease) and fills gaps.</li>
 <li><b>Ligase</b> seals nicks with a phosphodiester bond (ATP → AMP + PPi).</li>
 </ol>
 <div class="tblwrap"><table><tr><th>DNA pol III</th><th>DNA pol I</th></tr><tr><td>5'→3' polymerase (main synthesis)<br>3'→5' exonuclease = proofreading</td><td>5'→3' exonuclease removes primers<br>5'→3' polymerase fills gaps<br>3'→5' proofreading</td></tr></table></div>
 <div class="pearl"><strong>Exam order:</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase.</div>`},
 {n:2,t:"End replication problem and transcription",h:`
 <p>DNA polymerases only build 5'→3' and cannot start without a primer, so the extreme 3' end of the lagging strand is not copied: the <b>end replication problem</b>.</p>
 <ul>
 <li><b>Telomeres</b> cap chromosome ends: tandem <b>TTAGGG</b> repeats + a 12–16 nt 3' overhang. Humans: 46 chromosomes = <b>92 telomeres</b>.</li>
 <li><b>Telomerase</b> = protein + its own RNA template; it works as a <b>reverse transcriptase</b> (binding → polymerization → translocation).</li>
 <li>Low telomerase in normal cells → telomeres shorten with age (~10,000 bp at birth → ~5,000 bp late in life). <b>Cancer cells often have high telomerase</b>, a drug target. Nobel 2009: Blackburn, Greider, Szostak.</li>
 </ul>
 <h4>Transcription (DNA → RNA)</h4>
 <ul>
 <li><b>Template (antisense) strand</b> is read; <b>coding (sense) strand</b> has the same sequence as the mRNA (T instead of U).</li>
 <li>RNA pol slides 3'→5' on the template and synthesizes RNA 5'→3'.</li>
 </ul>
 <div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr><tr><td>RNA pol I</td><td>rRNA (except 5S)</td></tr><tr><td>RNA pol II</td><td>All mRNA (structural genes), some snRNA</td></tr><tr><td>RNA pol III</td><td>tRNA and 5S rRNA</td></tr></table></div>
 <p><b>Eukaryotic gene parts:</b> exons (coding), introns (non-coding, start GT and end AG), promoter with <b>TATA box</b> (~25 bp upstream, binds TFs + RNA pol II) and <b>CAAT box</b> (sets how often transcription starts), <b>enhancers</b> (activators bind, ↑ rate) and <b>silencers</b> (repressors bind, ↓ rate).</p>
 <p><b>Cis-acting</b> = DNA sequences (TATA, enhancers, silencers). <b>Trans-acting</b> = proteins that bind them.</p>
 <h4>Stages</h4>
 <ul><li><b>Initiation:</b> TFIID (TBP + TAFs) recognizes the promoter; TFIIB bridges to RNA pol II; <b>TFIIH</b> acts as helicase (open complex) and phosphorylates the CTD of pol II; TFIIE helps the move into elongation.</li>
 <li><b>Elongation:</b> pol II unwinds 10–20 bases at a time.</li>
 <li><b>Termination:</b> poly-A signal <b>AAUAAA</b>; transcript cut 10–35 nt downstream.</li></ul>`},
 {n:3,t:"RNA processing and translation",h:`
 <p><b>Chromatin remodeling:</b> tight histone–DNA blocks RNA pol. Activators recruit <b>histone acetyltransferase (HAT)</b>; acetylation lowers histone basicity → DNA loosens → promoter exposed. <b>Histone deacetylase (HDAC)</b> reverses this.</p>
 <h4>Post-transcriptional modification</h4>
 <ul>
 <li><b>Splicing</b> by the <b>spliceosome</b> (snRNPs, "snurps"): introns removed from pre-mRNA (hnRNA), exons joined. Also group I and group II self-splicing.</li>
 <li><b>Alternative splicing</b>: one gene → several proteins.</li>
 <li><b>5' cap</b>: 7-methylguanosine, added when the transcript is only 20–25 nt long. Protects from nucleases, helps export and ribosome binding.</li>
 <li><b>3' poly-A tail</b>: not encoded in the gene; added after transcription. Stability and translation.</li>
 <li>Trimming of rRNA and tRNA; editing and base modification of tRNA.</li>
 </ul>
 <h4>Translation (mRNA → protein)</h4>
 <ul>
 <li><b>tRNA</b>: L-shaped, ~80 nt; carries an amino acid and an <b>anticodon</b>. <b>Aminoacyl-tRNA synthetase</b> attaches the right amino acid.</li>
 <li><b>Wobble</b>: flexible pairing at the <b>third</b> codon base only (G pairs C or U).</li>
 <li><b>Ribosome</b>: rRNA 40% + protein 60%. Sites: <b>A</b> (new aminoacyl-tRNA), <b>P</b> (growing peptide), <b>E</b> (exit).</li>
 <li><b>Initiation:</b> small 40S subunit binds the 5' cap, finds <b>AUG</b> (Met); 60S joins.</li>
 <li><b>Elongation:</b> codon recognition (GTP) → peptide bond → translocation (GTP). Chain grows N-terminus → C-terminus.</li>
 <li><b>Termination:</b> stop codon in A site, no tRNA binds, peptide released.</li>
 <li><b>Polysome</b>: many ribosomes on one mRNA.</li>
 </ul>`},
 {n:4,t:"Post-translational modifications and the genetic code",h:`
 <p>PTMs are chemical changes after a protein is made. ~20,000–25,000 genes give a proteome of over 1 million proteins, mainly through alternative splicing plus PTMs.</p>
 <div class="tblwrap"><table><tr><th>PTM</th><th>Key facts</th></tr>
 <tr><td>Phosphorylation</td><td>On Ser, Thr, Tyr. Kinases add, phosphatases remove. Adds negative charge. Activates p53. <b>Inhibits</b> acetyl-CoA carboxylase (activated by dephosphorylation).</td></tr>
 <tr><td>Hydroxylation</td><td>Hydroxylases; Pro and Lys in collagen.</td></tr>
 <tr><td>Acetylation</td><td>Histone acetylation reduces positive charge → DNA looser → transcription.</td></tr>
 <tr><td>Methylation</td><td>Methyltransferases on Lys (up to 3×) or Arg (up to 2×). On histones can activate or repress.</td></tr>
 <tr><td>Ubiquitination</td><td>Ubiquitin (8.6 kDa) tags proteins, often for <b>proteasome</b> degradation.</td></tr>
 <tr><td>Proteolysis</td><td>Cleavage, e.g. removal of N-terminal Met, activation of inactive precursors.</td></tr>
 <tr><td>Carboxylation</td><td>γ-glutamyl carboxylase; needs <b>vitamin K</b> (clotting factors).</td></tr></table></div>
 <div class="pearl"><strong>Nobel 2019 (HIF-1α):</strong> at normal O₂, HIF-1α is <b>prolyl-hydroxylated</b> → recognized by <b>VHL</b> → ubiquitinated → degraded in the proteasome. At low O₂, HIF-1α builds up and switches on genes such as EPO.</div>
 <h4>Genetic code</h4>
 <ul><li>Codon = 3 bases. 4×4×4 = <b>64 codons</b>: 61 code amino acids, 3 are stop codons.</li>
 <li><b>AUG</b> = Met and the start codon. Several codons can code the same amino acid (redundancy).</li>
 <li>Example: AUG-GUG-CCA-CGA-AGG-UGA = Met-Val-Pro-Arg-Arg-Stop.</li></ul>`},
 {n:5,t:"Regulation of gene expression I",h:`
 <ul><li><b>Constitutive</b> genes: always on, constant level (survival, metabolic enzymes). <b>Facultative</b>: on only under certain conditions.</li>
 <li><b>Epigenetics</b>: changes in gene expression without changing the DNA sequence. Three tools: cis/trans elements, ncRNAs, histone modifications.</li></ul>
 <h4>Proteins and DNA elements</h4>
 <ul><li><b>C/EBPs</b>: family of 6 TFs that recruit co-activators.</li>
 <li><b>Sp1</b> binds <b>GC boxes</b> and recruits TFIID and RNA pol II.</li>
 <li>Activators have a <b>DNA-binding domain</b> and a <b>regulatory domain</b>; at enhancers they recruit HAT. <b>Coactivators</b> pass the signal to the basal factors.</li>
 <li>Thymidine kinase promoter: GC, CAAT, GC, TATA (at about −25).</li></ul>
 <h4>DNA methylation</h4>
 <p>DNA methylase adds −CH₃ at <b>CpG islands</b> near promoters → <b>represses</b> transcription by (1) blocking Sp1 binding to the GC box and (2) recruiting <b>methyl-CpG binding protein</b> + HDAC → closed chromatin. Unmethylated CpG islands = active genes.</p>
 <h4>Non-coding RNAs</h4>
 <ul><li>Transcribed but not translated; include miRNA, lncRNA, circRNA.</li>
 <li><b>miRNA</b>: ~22 nt single strand; made by RNA pol II as hairpin, cut by <b>Dicer</b>, works inside <b>RISC</b>; binds the <b>3'UTR</b> of target mRNA → degradation or translational block.</li>
 <li>Nobel 2024: Ambros & Ruvkun, discovery of microRNA.</li></ul>
 <div class="pearl"><strong>Case logic:</strong> more miRNA-181 → less telomerase (its mRNA is silenced).</div>`},
 {n:6,t:"Regulation of gene expression II",h:`
 <ul><li><b>circRNA</b>: made by <b>back-splicing</b> (5' end joins 3' end). Half-life ~48 h, about 5× more stable than linear mRNA. Acts as a <b>miRNA sponge</b>.</li>
 <li><b>lncRNA</b>: &gt;200 nt (usually 1,000–10,000), made by pol II, capped and polyadenylated. Works as <b>guide</b>, <b>scaffold</b>, <b>decoy</b> for TFs, or binds miRNA.</li></ul>
 <div class="pearl"><strong>Case logic:</strong> a circRNA that sponges miRNA-181 goes down → more free miRNA-181 → less telomerase.</div>
 <h4>Histones and chromatin</h4>
 <ul><li>Octamer = 2 × (H2A, H2B, H3, H4). <b>H1</b> is the linker histone → 30 nm fibre.</li>
 <li><b>CENP-A</b> replaces H3 at centromeres (kinetochore attachment).</li>
 <li>Remodeling complexes use ATP to <b>slide</b>, <b>transfer</b> or <b>remodel</b> nucleosomes.</li>
 <li>Positioning: A:T-rich DNA bends easily toward the minor groove facing the octamer.</li></ul>
 <div class="tblwrap"><table><tr><th>Histone tail change</th><th>Effect</th></tr><tr><td>Lysine acetylation</td><td>Active chromatin</td></tr><tr><td>Deacetylation</td><td>Repressed chromatin</td></tr><tr><td>Methylation</td><td>Active or repressed (depends on residue)</td></tr><tr><td>Serine phosphorylation</td><td>Active chromatin</td></tr></table></div>
 <p><b>Bromodomains</b> read acetylated tails; <b>chromodomains</b> read methylated tails.</p>
 <h4>Examples and motifs</h4>
 <ul><li>Cell differentiation: same genome, different proteome.</li>
 <li>Globin switching from embryo → fetus → adult changes oxygen affinity (highest in embryo).</li>
 <li>DNA-binding proteins read the <b>major groove</b>. Motifs: <b>helix-turn-helix</b> (most common), <b>zinc finger</b> (more fingers = tighter binding), <b>leucine zipper</b> (Y-shaped dimer joined by leucines).</li></ul>`},
 {n:7,t:"Genetic variation and the Human Genome Project",h:`
 <ul><li><b>HGP</b>: launched Oct 1990, completed Apr 2003; international consortium of 20 centres in 6 countries; used and improved <b>Sanger sequencing</b>.</li>
 <li>Draft (June 2000) covered ~90%; 2003 version ~<b>92%</b> with &lt;400 gaps. Hard regions: telomeres and centromeres (highly repetitive).</li>
 <li><b>T2T consortium, March 2022</b>: first truly complete human genome.</li>
 <li>Impact: genetic testing, ancestry, <b>precision medicine</b>.</li>
 <li><b>Egyptian Genome Project</b> (March 2021): a reference Egyptian genome, genes of common diseases, ancient Egyptian genomes, personalized medicine.</li>
 <li>Humans are <b>99.9%</b> identical at the base-pair level; the 0.1% (e.g. SNPs) shapes traits and disease risk.</li></ul>`}
 ],
 quiz:[
 {l:1,q:"How many hydrogen bonds hold a G–C base pair together?",o:["1","2","3","4"],a:2,e:"G≡C has 3 hydrogen bonds, which makes it about 50% stronger than A=T (2 bonds)."},
 {l:1,q:"Which enzyme removes the RNA primers during DNA replication?",o:["DNA polymerase III","DNA polymerase I","Primase","Ligase"],a:1,e:"Pol I uses its 5'→3' exonuclease activity to remove primers, then fills the gaps."},
 {l:1,q:"Okazaki fragments are formed on the:",o:["Leading strand","Lagging strand","Template strand of RNA","Coding strand"],a:1,e:"The lagging strand grows away from the fork, so it is made discontinuously in short fragments."},
 {l:1,q:"A nucleoside consists of:",o:["Base only","Base + pentose","Base + pentose + phosphate","Pentose + phosphate"],a:1,e:"Nucleoside = base + sugar. Add a phosphate and it becomes a nucleotide."},
 {l:1,q:"Which DNA form is left-handed?",o:["A-DNA","B-DNA","Z-DNA","All of them"],a:2,e:"Z-DNA is the rare left-handed form. A and B are right-handed."},
 {l:1,q:"Which protein relieves the supercoils that form ahead of the replication fork?",o:["SSB proteins","Topoisomerase","DnaA","Primase"],a:1,e:"Topoisomerases relieve supercoiling caused by unwinding."},
 {l:2,q:"Telomerase extends telomeres because it acts as a:",o:["DNA-dependent RNA polymerase","Reverse transcriptase with its own RNA template","Ligase","Restriction enzyme"],a:1,e:"Telomerase carries an RNA template and synthesizes DNA from it, which is reverse transcription."},
 {l:2,q:"RNA polymerase III transcribes:",o:["All mRNA","rRNA except 5S","tRNA and 5S rRNA","Mitochondrial DNA only"],a:2,e:"Pol I: rRNA (except 5S). Pol II: mRNA. Pol III: tRNA + 5S rRNA."},
 {l:2,q:"The coding (sense) strand of DNA:",o:["Is used as the template","Has the same sequence as the mRNA (T for U)","Is complementary to the mRNA","Is always on the 3' side"],a:1,e:"The template (antisense) strand is read; the coding strand matches the mRNA sequence."},
 {l:2,q:"Which general transcription factor has helicase activity and phosphorylates the CTD of RNA pol II?",o:["TFIIB","TFIID","TFIIE","TFIIH"],a:3,e:"TFIIH opens the DNA (helicase) and phosphorylates the CTD, releasing pol II into elongation."},
 {l:3,q:"The 5' cap of eukaryotic mRNA is:",o:["A poly-A sequence","7-methylguanosine","A TATA box","An anticodon loop"],a:1,e:"A 7-methylguanosine cap is added early, when the transcript is 20–25 nt long."},
 {l:3,q:"Which ribosomal site holds the tRNA carrying the growing polypeptide?",o:["A site","P site","E site","Exit tunnel"],a:1,e:"A = incoming aminoacyl-tRNA, P = peptidyl-tRNA, E = empty tRNA leaving."},
 {l:3,q:"Wobble pairing happens at which position of the codon?",o:["First base","Second base","Third base","Any base"],a:2,e:"Only the third base is flexible; the first two must pair exactly."},
 {l:4,q:"At normal oxygen levels, HIF-1α is degraded because it is first:",o:["Phosphorylated on tyrosine","Prolyl-hydroxylated, then recognized by VHL and ubiquitinated","Acetylated by HAT","Glycosylated in the Golgi"],a:1,e:"Prolyl hydroxylation lets VHL bind, ubiquitin is added, and the proteasome destroys HIF-1α (Nobel 2019)."},
 {l:4,q:"Protein phosphorylation occurs on which residues?",o:["Lys and Arg","Ser, Thr and Tyr","Pro and Lys","Gly and Ala"],a:1,e:"Kinases add phosphate to serine, threonine or tyrosine."},
 {l:4,q:"How many of the 64 codons specify amino acids?",o:["20","60","61","64"],a:2,e:"61 code amino acids; 3 are stop codons."},
 {l:5,q:"A microRNA silences its target by binding to the:",o:["Promoter","5' cap","3'UTR of the mRNA","TATA box"],a:2,e:"miRNA, inside RISC, pairs with the 3'UTR and causes degradation or blocks translation."},
 {l:5,q:"Methylation of CpG islands near a promoter usually:",o:["Activates transcription","Represses transcription","Has no effect","Causes alternative splicing"],a:1,e:"It blocks Sp1 binding and recruits methyl-CpG binding protein + HDAC, closing chromatin."},
 {l:6,q:"Bromodomains recognize:",o:["Methylated histone tails","Acetylated histone tails","Phosphorylated DNA","CpG islands"],a:1,e:"Bromodomains read acetylation; chromodomains read methylation."},
 {l:6,q:"Circular RNAs commonly regulate gene expression by:",o:["Coding for proteins","Acting as miRNA sponges","Adding the 5' cap","Replacing histone H3"],a:1,e:"circRNAs bind and sequester miRNAs, freeing those miRNAs' target mRNAs."},
 {l:6,q:"Which histone variant replaces H3 at centromeres?",o:["H1","H2A.Z","CENP-A","H4"],a:2,e:"CENP-A nucleosomes are built into the kinetochore that attaches to the spindle."},
 {l:7,q:"When was the first truly complete (telomere-to-telomere) human genome announced?",o:["2000","2003","2013","2022"],a:3,e:"The T2T consortium filled the last gaps in March 2022."}

 id:"physio", code:"PHO221", name:"Physiology & Pathophysiology", hue:"var(--c2)",
 staff:"Assoc. Prof. Sameh Shaaban · Dr. Omnia Farouk · Dr. Nada Ezz",
 lectures:[
 {n:1,t:"Body fluids, membrane transport and water balance",h:`
 <p><b>Physiology</b> = normal function. <b>Pathophysiology</b> = the deranged function that occurs in disease. Organization: cell → tissue → organ → system → organism.</p>
 <div class="tblwrap"><table><tr><th>Transport</th><th>Energy</th><th>Example</th></tr>
 <tr><td>Simple diffusion</td><td>None, down gradient, no protein</td><td>O₂, CO₂, lipid-soluble molecules</td></tr>
 <tr><td>Facilitated diffusion</td><td>None, down gradient, via channel/carrier</td><td>Glucose by GLUT carriers</td></tr>
 <tr><td>Primary active</td><td>ATP directly, against gradient</td><td>Na⁺/K⁺-ATPase (3 Na⁺ out, 2 K⁺ in)</td></tr>
 <tr><td>Secondary active (co-transport)</td><td>Uses an existing Na⁺ gradient</td><td>Na⁺–glucose co-transport in gut</td></tr></table></div>
 <ul><li><b>Water balance:</b> high blood solute (dehydration) → hypothalamic osmoreceptors → <b>ADH</b> from the <b>posterior pituitary</b> → kidneys reabsorb water.</li>
 <li><b>Dehydration</b> signs: low BP, high heart rate, dry skin/mucosa, no sweating; severe (10–15% water loss): lethargy, delirium. The elderly have less body water and dehydrate easily.</li>
 <li><b>Hyponatremia</b> (e.g. after vomiting/diarrhoea): water moves into brain cells → <b>cerebral oedema</b> → confusion, lethargy, seizures.</li>
 <li><b>Hyperkalemia</b>: changes the resting membrane potential → life-threatening <b>arrhythmias</b>.</li>
 <li><b>Tonicity:</b> hypotonic solution → RBCs swell and lyse; hypertonic → they shrink.</li></ul>`},
 {n:2,t:"Blood and blood disorders",h:`
 <p>Blood = plasma + formed elements (RBCs, WBCs, platelets). pH <b>7.35–7.45</b>. Plasma proteins: albumins, globulins, fibrinogen.</p>
 <div class="pearl"><strong>Albumin and oedema:</strong> albumin is too large to leave capillaries and makes ~<b>80%</b> of colloid osmotic pressure (COP). Low albumin (e.g. liver failure) → low COP → fluid stays in tissues → <b>oedema</b>.</div>
 <h4>Red blood cells</h4>
 <ul><li>Biconcave, <b>no nucleus</b>, spectrin makes the membrane flexible. Life span <b>100–120 days</b>.</li>
 <li>Count: males 5–5.5 ×10⁶/mm³, females 4.5–5 ×10⁶/mm³.</li>
 <li>Hb = 2α + 2β globins + 4 heme (Fe²⁺) → binds 4 O₂. With CO₂ → carbaminohemoglobin; with CO → carboxyhemoglobin; oxidizing drugs turn Fe²⁺ to Fe³⁺ → <b>methemoglobin</b>.</li>
 <li><b>Erythropoiesis</b> ↑ by hypoxia (→ erythropoietin), needs healthy marrow, liver (stores iron and B12), diet (iron, B12, folate, protein), thyroxine and androgens.</li></ul>
 <p><b>Terms:</b> leukopenia (↓WBC), thrombocytopenia (↓platelets), pancytopenia (all ↓), thrombus (clot in an intact vessel), embolus (floating clot). Platelets live ~6–10 days. In secondary hemostasis, <b>thrombin</b> turns fibrinogen into a fibrin mesh.</p>
 <h4>Anemias</h4>
 <div class="tblwrap"><table><tr><th>Type</th><th>Cause / key point</th></tr>
 <tr><td>Microcytic</td><td>Hb synthesis problem: <b>iron deficiency</b> (most common), thalassemia</td></tr>
 <tr><td>Macrocytic (megaloblastic)</td><td>DNA synthesis problem: <b>B12 or folate</b> deficiency</td></tr>
 <tr><td>Pernicious</td><td>No <b>intrinsic factor</b> (parietal cells) → no B12 absorption</td></tr>
 <tr><td>Hemolytic</td><td>RBCs destroyed faster than made</td></tr>
 <tr><td>Aplastic</td><td>Marrow failure (radiation, drugs, toxins)</td></tr></table></div>
 <ul><li><b>Ferritin</b> = iron storage (low in iron deficiency). <b>Transferrin</b> = transport (high in iron deficiency). Iron is absorbed as Fe²⁺ in the <b>duodenum</b>.</li>
 <li>B12 path: freed by acid/pepsin → R-binder → freed in duodenum → binds intrinsic factor → absorbed in <b>terminal ileum</b> → transcobalamin II.</li></ul>
 <div class="tblwrap"><table><tr><th>Hereditary</th><th>Defect</th><th>Inheritance</th></tr>
 <tr><td>Sickle cell</td><td>HbS → sickling, pain crises</td><td>Autosomal recessive</td></tr>
 <tr><td>G6PD deficiency (favism)</td><td>No NADPH → RBCs damaged by oxidants. Triggers: fava beans, sulfa drugs, antimalarials, infections</td><td>X-linked</td></tr>
 <tr><td>Thalassemia</td><td>Reduced globin chain production</td><td>Autosomal recessive</td></tr></table></div>`},
 {n:3,t:"Nervous system I: neurons and action potentials",h:`
 <ul><li><b>Hippocampus</b>: memory, learning. <b>Hypothalamus</b>: homeostasis (temperature, hunger, sleep, hormones). <b>Medulla</b>: heartbeat, breathing. <b>Cerebellum</b>: balance, movement.</li>
 <li>Lobes: occipital = vision, temporal = hearing, frontal = critical thinking, parietal = body orientation.</li>
 <li>12 cranial nerves; <b>vagus (X)</b> is the main parasympathetic nerve.</li></ul>
 <h4>Neuron</h4>
 <ul><li>Dendrites receive; axon transmits; <b>axon hillock</b> generates the impulse; Schwann cells make myelin in the PNS.</li>
 <li>Properties: excitability, conductivity, secretion, <b>all-or-none law</b>.</li>
 <li>Myelin: faster <b>saltatory</b> conduction (node to node of Ranvier), protection, insulation.</li></ul>
 <div class="tblwrap"><table><tr><th>Glial cell</th><th>Role</th></tr><tr><td>Astrocytes</td><td>Blood-brain barrier</td></tr><tr><td>Ependymal cells</td><td>CSF</td></tr><tr><td>Oligodendrocytes</td><td>CNS myelin</td></tr><tr><td>Microglia</td><td>Brain immune cells</td></tr><tr><td>Satellite cells</td><td>Regulate neurotransmitters (PNS)</td></tr><tr><td>Schwann cells</td><td>PNS myelin, regeneration</td></tr></table></div>
 <h4>Membrane potentials</h4>
 <ul><li><b>Resting potential</b> (~−70 mV) comes from: K⁺ leaking out more than Na⁺ leaks in, Na⁺/K⁺ pump (3 Na⁺ out / 2 K⁺ in), and negative intracellular proteins.</li>
 <li><b>Depolarization</b>: voltage-gated Na⁺ channels open → Na⁺ influx.</li>
 <li><b>Repolarization</b>: K⁺ channels open → K⁺ efflux.</li>
 <li><b>Hyperpolarization</b> (undershoot): K⁺ channels close slowly → extra K⁺ efflux.</li>
 <li><b>Absolute refractory</b>: no new AP possible (Na⁺ channels inactivated). <b>Relative refractory</b>: needs a stronger stimulus.</li></ul>
 <p><b>Reflex arc:</b> receptor → sensory (afferent) neuron → relay neuron in spinal cord → motor (efferent) neuron → effector. It works before the signal reaches the brain.</p>`},
 {n:4,t:"Autonomic nervous system and muscle",h:`
 <div class="tblwrap"><table><tr><th></th><th>Sympathetic</th><th>Parasympathetic</th></tr>
 <tr><td>Role</td><td>Fear, fight, flight</td><td>Rest and digest</td></tr>
 <tr><td>Origin</td><td>Thoracolumbar</td><td>Craniosacral</td></tr>
 <tr><td>Ganglia</td><td>Close to spinal cord</td><td>Near or in target organ</td></tr>
 <tr><td>Postganglionic transmitter</td><td>Noradrenaline → α/β (sweat glands: ACh → M3)</td><td>ACh → muscarinic (M1–M5)</td></tr>
 <tr><td>Eye</td><td>Dilator pupillae → <b>mydriasis</b>; far vision</td><td>Sphincter pupillae → <b>miosis</b>; ciliary contraction for near vision</td></tr>
 <tr><td>Heart / bronchi</td><td>↑ heart rate, bronchodilation</td><td>↓ heart rate, ↑ salivation</td></tr></table></div>
 <p>All preganglionic fibres release <b>ACh</b> onto <b>nicotinic (Nn)</b> receptors. Drug links: salbutamol (↑ sympathetic β₂, bronchodilator), epinephrine.</p>
 <h4>Muscle contraction</h4>
 <ul><li><b>Smooth muscle:</b> ↑Ca²⁺ → Ca²⁺–<b>calmodulin</b> → activates <b>myosin light-chain kinase</b> → phosphorylates myosin → ↑ATPase → cross-bridges.</li>
 <li><b>Skeletal muscle:</b> AP at nerve → ACh at NMJ → Na⁺ influx → AP along T-tubules → SR releases Ca²⁺ → actin–myosin sliding; Ca²⁺ pumped back to relax.</li></ul>
 <h4>Pathophysiology</h4>
 <ul><li><b>Myasthenia gravis</b>: autoantibodies against <b>nicotinic ACh receptors</b> → weakness. Treat with anticholinesterases + immunosuppressants.</li>
 <li><b>Alzheimer's</b>: loss of cholinergic transmission + glutamate excitotoxicity.</li>
 <li><b>Parkinson's</b>: death of <b>dopaminergic</b> neurons → tremor, bradykinesia.</li>
 <li><b>Epilepsy</b>: excessive neuronal firing. <b>Stroke</b>: cut blood supply (bleed or thrombus). <b>MS</b>: inflammatory demyelination.</li></ul>`},
 {n:5,t:"Cardiovascular system I: cardiac muscle and potentials",h:`
 <ul><li>Valves open and close passively by pressure → one-way flow.</li>
 <li>Coronaries: <b>left main</b> → LAD + left circumflex; and the <b>right coronary artery</b>.</li>
 <li>Conducting cells (SAN, AVN, Purkinje) start and spread impulses; contractile cells pump.</li>
 <li>Properties: <b>rhythmicity</b> (automaticity), <b>excitability</b>, <b>conductivity</b>, <b>contractility</b>.</li></ul>
 <div class="tblwrap"><table><tr><th>Pacemaker</th><th>Intrinsic rate (/min)</th></tr><tr><td>SAN</td><td>90–105 (vagal tone slows it to ~75)</td></tr><tr><td>AVN</td><td>40–60</td></tr><tr><td>Purkinje</td><td>15–40</td></tr></table></div>
 <p><b>Chronotropic drugs</b> change SAN rate: adrenaline is positive; digitalis is negative.</p>
 <h4>Nodal (pacemaker) potential, no true resting level</h4>
 <ul><li><b>Phase 4</b>: slow Na⁺ influx (<b>funny current, If</b>) from ~−60 mV; T-type Ca²⁺ opens near −50 mV.</li>
 <li><b>Phase 0</b>: L-type Ca²⁺ influx; threshold −40 to −30 mV.</li>
 <li><b>Phase 3</b>: K⁺ efflux.</li></ul>
 <h4>Ventricular muscle potential (rest ≈ −90 mV)</h4>
 <ul><li>0: fast Na⁺ influx. 1: brief K⁺ efflux. 2: <b>plateau</b>, L-type Ca²⁺ influx. 3: K⁺ efflux. 4: rest (Na⁺/K⁺-ATPase).</li></ul>
 <div class="pearl"><strong>Why no tetanus in the heart?</strong> The absolute refractory period is long (phases 0–2 and half of 3), so the heart must relax and refill before it can fire again. Skeletal muscle can be tetanized.</div>
 <p>Hypoxic or ischemic ventricular cells can become pacemaker-like (Ca²⁺-driven) → ectopic beats and arrhythmias.</p>`},
 {n:6,t:"Cardiovascular system II: conduction, cycle and blood pressure",h:`
 <p><b>Conduction path:</b> SAN → atria → <b>AVN</b> → bundle of His → right/left bundle branches → <b>Purkinje</b> fibres.</p>
 <ul><li>Slowest at AVN (<b>0.05 m/s</b>) → delay lets ventricles fill.</li>
 <li>Fastest in Purkinje (<b>4 m/s</b>) → both ventricles contract together.</li></ul>
 <h4>Excitation–contraction coupling</h4>
 <ol><li>AP travels along sarcolemma and T-tubules.</li><li>L-type Ca²⁺ (DHP) channels let a little Ca²⁺ in.</li><li>That Ca²⁺ opens <b>ryanodine receptors</b> on the SR: <b>calcium-induced calcium release</b>.</li><li>Ca²⁺ binds <b>troponin C</b> → tropomyosin moves → cross-bridges → contraction.</li><li><b>SERCA</b> pumps Ca²⁺ back into the SR → relaxation.</li></ol>
 <h4>Cardiac cycle and pressure</h4>
 <div class="formula">SV = EDV − ESV &nbsp;|&nbsp; CO = SV × HR &nbsp;|&nbsp; EF = SV / EDV<small>EDV: end-diastolic volume · ESV: end-systolic volume</small></div>
 <div class="formula">Pulse pressure = SBP − DBP (120 − 80 = 40 mmHg) &nbsp;|&nbsp; Mean ABP = DBP + ⅓ PP (≈ 93 mmHg)</div>
 <ul><li>Vasoconstrictors: angiotensin II, adrenaline, noradrenaline. Vasodilators: NO, prostacyclin (PGI₂), histamine, bradykinin.</li>
 <li>Total peripheral resistance depends on vessel diameter.</li>
 <li>Sympathetic: +ve chronotropic and +ve inotropic. Parasympathetic (vagus, ACh): −ve chronotropic.</li>
 <li><b>Baroreceptors</b> give minute-to-minute neural control; low BP → ↑CO₂/↓O₂ stimulates <b>chemoreceptors</b>; the <b>medulla</b> integrates the signals.</li></ul>`}
 ],
 quiz:[
 {l:1,q:"Intestinal cells take up glucose against its gradient by coupling it to Na⁺ moving down its gradient. This is:",o:["Simple diffusion","Facilitated diffusion","Primary active transport","Secondary active transport"],a:3,e:"The energy comes from the Na⁺ gradient (made by the Na⁺/K⁺ pump), not ATP directly: secondary active co-transport."},
 {l:1,q:"A patient receives a large volume of a hypotonic solution. What happens to the RBCs?",o:["They shrink","They swell and may lyse","No change","They become sickle-shaped"],a:1,e:"Water enters cells in a hypotonic solution, so RBCs swell and can burst."},
 {l:1,q:"After heavy sweating, how does the body restore water balance?",o:["↓ ADH, more water excreted","↑ ADH from the posterior pituitary, more water reabsorbed","Kidneys release erythropoietin","Thirst is suppressed"],a:1,e:"High solute concentration is detected by the hypothalamus → ADH release → renal water reabsorption."},
 {l:1,q:"Why is severe hyperkalemia life-threatening?",o:["It causes kidney stones","It alters the resting membrane potential, causing arrhythmias","It stops ADH release","It lowers COP"],a:1,e:"K⁺ sets the resting potential; disturbing it disrupts cardiac excitability."},
 {l:2,q:"In liver failure, low albumin causes oedema because:",o:["Albumin blocks lymphatics","Colloid osmotic pressure falls, so less fluid returns to capillaries","Sodium is pumped into tissues","Hydrostatic pressure falls"],a:1,e:"Albumin provides ~80% of COP, the force pulling water back into vessels."},
 {l:2,q:"An oxidizing drug converts heme iron from Fe²⁺ to Fe³⁺. This forms:",o:["Oxyhemoglobin","Carboxyhemoglobin","Methemoglobin","Carbaminohemoglobin"],a:2,e:"Fe³⁺ hemoglobin is methemoglobin, which cannot carry O₂ properly."},
 {l:2,q:"Pernicious anemia is caused by:",o:["Iron deficiency","Lack of intrinsic factor","Globin chain defect","Bone marrow aplasia"],a:1,e:"Without intrinsic factor from parietal cells, B12 is not absorbed in the ileum → megaloblastic anemia."},
 {l:2,q:"Low ferritin with high transferrin and small RBCs suggests:",o:["B12 deficiency","Iron deficiency anemia","G6PD deficiency","Aplastic anemia"],a:1,e:"Iron stores (ferritin) are depleted; transferrin rises to grab more iron. Microcytic picture."},
 {l:2,q:"G6PD deficiency (favism) is inherited as:",o:["Autosomal dominant","Autosomal recessive","X-linked","Mitochondrial"],a:2,e:"It is X-linked. Fava beans, sulfa drugs and antimalarials trigger hemolysis."},
 {l:2,q:"Normal RBC life span is:",o:["6–10 days","30–45 days","100–120 days","1 year"],a:2,e:"RBCs live 100–120 days; platelets only about 6–10 days."},
 {l:3,q:"Where is the action potential initiated in a neuron?",o:["Dendrites","Axon hillock","Node of Ranvier","Synaptic terminal"],a:1,e:"The axon hillock has the lowest threshold and generates the impulse."},
 {l:3,q:"Which glial cell forms myelin in the CNS?",o:["Schwann cells","Oligodendrocytes","Astrocytes","Microglia"],a:1,e:"Oligodendrocytes myelinate CNS axons; Schwann cells do it in the PNS."},
 {l:3,q:"The hyperpolarization (undershoot) after an action potential is due to:",o:["Na⁺/K⁺ pump reversal","Slow closure of voltage-gated K⁺ channels","Na⁺ influx","Cl⁻ efflux"],a:1,e:"K⁺ keeps leaving while K⁺ channels close slowly, so the membrane dips below rest."},
 {l:3,q:"During the absolute refractory period no new AP can fire because:",o:["K⁺ channels are closed","Voltage-gated Na⁺ channels are inactivated","The pump has stopped","The cell is at −90 mV"],a:1,e:"Inactivated Na⁺ channels cannot reopen until the membrane repolarizes."},
 {l:3,q:"Correct order in a spinal reflex arc:",o:["Receptor → motor → relay → sensory → effector","Receptor → sensory → relay → motor → effector","Effector → sensory → relay → motor → receptor","Receptor → brain → motor → effector"],a:1,e:"Sensory (afferent) in, relay neuron in the cord, motor (efferent) out to the muscle."},
 {l:4,q:"Postganglionic sympathetic fibres to sweat glands release:",o:["Noradrenaline on β₂","ACh on muscarinic (M3)","Dopamine","ACh on nicotinic"],a:1,e:"Sweat glands are the exception: sympathetic but cholinergic (ACh → M3)."},
 {l:4,q:"Parasympathetic stimulation of the eye causes:",o:["Mydriasis","Miosis","Relaxed ciliary muscle","Dry eye"],a:1,e:"It contracts the sphincter pupillae (miosis) and the ciliary muscle for near vision."},
 {l:4,q:"In myasthenia gravis, antibodies are directed against:",o:["Muscarinic receptors","Nicotinic ACh receptors at the NMJ","Acetylcholinesterase","Dopamine receptors"],a:1,e:"Blocked nicotinic receptors stop transmission → muscle weakness; anticholinesterases help."},
 {l:4,q:"In smooth muscle, Ca²⁺ triggers contraction by binding:",o:["Troponin C","Calmodulin, which activates myosin light-chain kinase","Tropomyosin","Ryanodine receptors only"],a:1,e:"Ca²⁺–calmodulin activates MLCK, which phosphorylates myosin light chains."},
 {l:4,q:"Parkinson's disease is caused by loss of:",o:["Cholinergic neurons","Dopaminergic neurons","Myelin","Glutamate receptors"],a:1,e:"Death of dopaminergic neurons controlling movement → tremor, bradykinesia."},
 {l:5,q:"The intrinsic firing rate of the SA node is about:",o:["15–40/min","40–60/min","90–105/min","150–200/min"],a:2,e:"Vagal tone slows it to around 75/min at rest."},
 {l:5,q:"Phase 4 of the SA nodal potential is mainly due to:",o:["Fast Na⁺ influx","Slow Na⁺ influx (funny current)","K⁺ efflux","Cl⁻ influx"],a:1,e:"The funny current (If) slowly depolarizes the membrane toward threshold."},
 {l:5,q:"The plateau (phase 2) of the ventricular action potential is due to:",o:["Na⁺ influx","L-type Ca²⁺ influx","K⁺ influx","Na⁺/K⁺ pump"],a:1,e:"Ca²⁺ entry through L-type channels balances K⁺ efflux and holds the plateau."},
 {l:5,q:"Cardiac muscle cannot be tetanized because:",o:["It has no Ca²⁺","Its absolute refractory period is long","It is voluntary","It lacks gap junctions"],a:1,e:"The long absolute refractory period lasts through systole and early diastole."},
 {l:6,q:"Where is conduction slowest in the heart?",o:["SA node","AV node","Bundle of His","Purkinje fibres"],a:1,e:"About 0.05 m/s at the AVN, giving the ventricles time to fill."},
 {l:6,q:"EDV = 120 mL and ESV = 50 mL. What is the stroke volume?",o:["50 mL","70 mL","120 mL","170 mL"],a:1,e:"SV = EDV − ESV = 120 − 50 = 70 mL."},
 {l:6,q:"Blood pressure is 120/80 mmHg. The mean arterial pressure is about:",o:["80 mmHg","93 mmHg","100 mmHg","40 mmHg"],a:1,e:"MAP = DBP + ⅓ pulse pressure = 80 + 40/3 ≈ 93 mmHg."},
 {l:6,q:"In cardiac muscle, the small Ca²⁺ influx triggers a large release from the SR through:",o:["SERCA","Ryanodine receptors","Calmodulin","Na⁺/Ca²⁺ exchanger"],a:1,e:"Calcium-induced calcium release via ryanodine receptors. SERCA pumps it back for relaxation."}
 ]
