<p>محاضرة 6 بتنقل من المحاليل الحقيقية لـ<b>الغرويات (colloids)</b>: أنظمة الجزيئات فيها شكلها كأنها دايبة بس هي فعليًا أكبر بكتير من الجزيئات. لازم تعرفي تقسّمي الأنظمة المنتشرة حسب حجم الجزيئات، وتعرفي أنواع الغرويات التلاتة والفرق بينهم، وتشرحي ليه الغروي ثابت أو مش ثابت، وإزاي الـ lyophobic بيتحضّر ويتنقّى، ومعاها الكلية الصناعية.</p>

<h4>1. الأنظمة المنتشرة (Disperse systems)</h4>
<p>كل نظام منتشر ليه جزئين: <b>الطور المنتشر (dispersed phase)</b> وهو الجزيئات، و<b>وسط الانتشار (dispersion medium)</b> أو الـ <b>continuous phase</b> وهو اللي الجزيئات منتشرة فيه. وبيتقسّموا حسب <b>حجم الجزيئات</b>:</p>
<div class="tblwrap"><table><tr><th></th><th>Molecular</th><th>Colloidal</th><th>Coarse</th></tr>
<tr><td>Size</td><td>&lt; 1 nm</td><td>1–500 nm</td><td>&gt; 500 nm</td></tr>
<tr><td>Seen by</td><td>Invisible even in EM</td><td>Ultramicroscope / EM</td><td>Light microscope</td></tr>
<tr><td>Filter paper</td><td>Passes</td><td>Passes</td><td>Retained</td></tr>
<tr><td>Semipermeable membrane</td><td>Passes</td><td>Retained</td><td>Retained</td></tr>
<tr><td>Diffusion</td><td>Rapid</td><td>Very slow</td><td>None</td></tr>
<tr><td>Examples</td><td>O₂, glucose</td><td>Colloidal silver, polymers</td><td>Sand, emulsions, suspensions, RBCs</td></tr></table></div>
<p>يعني: الـ <b>molecular</b> أقل من 1 nm، ما بيتشافش حتى بالميكروسكوب الإلكتروني، وبيعدّي من كل حاجة، وانتشاره سريع (زي الأكسجين والجلوكوز). الـ <b>colloidal</b> من 1 لـ 500 nm، بيتكشف بالـ <b>ultramicroscope</b>، بيعدّي من ورق الترشيح بس <b>ما بيعدّيش</b> من الغشاء شبه المنفذ، وانتشاره بطيء جدًا. الـ <b>coarse</b> أكبر من 500 nm، بيتشاف بالميكروسكوب الضوئي، وبيتحجز في ورق الترشيح، وما بينتشرش (زي الرمل والمعلقات والمستحلبات وكرات الدم).</p>
<p>قوة التكبير: الضوئي &lt; الـ ultramicroscope &lt; الإلكتروني.</p>
<div class="pearl"><strong>منطق الفلاتر:</strong> ورق الترشيح بيوقف الخشن بس. الغشاء شبه المنفذ بيعدّي الجزيئات الصغيرة بس. والغرويات في النص: بتعدّي من الورق وبتتحجز في الغشاء. ودي أساس الـ dialysis.</div>

<h4>2. مساحة سطحية نوعية ضخمة</h4>
<p>الـ <b>specific surface area</b> هي المساحة السطحية لكل وحدة وزن أو حجم. الجزيئات الغروية صغيرة جدًا فمساحتها النوعية ضخمة، ودي بتديها خواص مميزة:</p>
<ul>
<li><b>Platinum black</b> (بلاتين غروي) <b>عامل حفّاز</b> قوي، لأن العوامل الحفازة بتشتغل بإنها تمسك المتفاعلات على سطحها.</li>
<li><b>اللون بيعتمد على حجم الجزيئات</b>: محلول الدهب الغروي الأحمر بيبقى <b>أزرق</b> لما جزيئاته تكبر.</li>
</ul>
<h5>الاستخدامات الصيدلانية</h5>
<ol>
<li><b>الفضة الغروية</b> (silver iodide و silver chloride و silver protein): <b>مطهرات</b> فعالة من غير التهييج اللي بتعمله أملاح الفضة الأيونية.</li>
<li><b>الدهب الغروي</b>: في التشخيص وعلاج السرطان.</li>
<li><b>الزئبق الغروي</b>: للزهري.</li>
<li><b>النحاس الغروي</b>: في السرطان.</li>
<li><b>Association colloids</b> (الـ surfactants): بتزوّد ذوبان وثبات المواد في المستحضرات المائية والزيتية.</li>
<li>مواد بتشتغل أحسن في الشكل الغروي بسبب المساحة الكبيرة: <b>الكاولين بيمتص السموم</b> في الأمعاء، و<b>هيدروكسيد الألومنيوم</b> كمضاد حموضة.</li>
<li><b>بدائل البلازما</b>: <b>dextran و PVP و gelatin</b> غرويات محبة للماء بترجّع أو تحافظ على حجم الدم.</li>
<li><b>Iron–dextran</b> بيعمل محاليل غروية لعلاج <b>الأنيميا</b>.</li>
</ol>

<h4>3. أنواع الغرويات التلاتة</h4>
<p>بتتقسم حسب <b>تفاعل الجزيئات مع الوسط</b>.</p>
<h5>Lyophilic ("بيحب المذيب")</h5>
<ul>
<li>جذب قوي بين الجزيئات والوسط، فبتتكون <b>لوحدها (spontaneously)</b> بمجرد ما نحط المادة في المذيب.</li>
<li>الجذب ده بيعمل <b>solvation</b>: <b>غلاف من المذيب</b> حوالين كل جزيء. لو الوسط ماء اسمه <b>hydration</b> (hydrophilic زي <b>الجيلاتين والأكاسيا في الماء</b>). وفي المذيبات العضوية lipophilic (زي <b>المطاط أو البوليستيرين</b>).</li>
<li>غالبًا جزيئات <b>عضوية</b> كبيرة: بروتينات، صموغ نباتية، <b>HPMC</b>.</li>
<li>ثابتة بسبب <b>غلاف المذيب + الشحنة الكهربية</b>.</li>
<li>الجزيئات غالبًا <b>مش متماثلة</b> (سلاسل طويلة).</li>
</ul>
<h5>Lyophobic ("بيكره المذيب")</h5>
<ul>
<li>جذب ضعيف جدًا للوسط، فـ<b>مفيش غلاف مذيب</b>.</li>
<li>غالبًا جزيئات <b>غير عضوية</b> في الماء: <b>دهب، فضة، كبريت، arsenous sulfide، silver iodide</b>.</li>
<li><b>ما بتتكونش لوحدها</b>: محتاجة طرق خاصة.</li>
<li>الجزيئات غالبًا <b>متماثلة</b>.</li>
</ul>
<div class="ex"><b>تشبيه القنفد:</b> في مذيب "صاحبه" الجزيء الغروي "بيفرد نفسه" ويكشف أكبر مساحة، وسلسلته الطويلة بتعمل تلامسات جذب كتير (lyophilic). وفي مذيب "عدو" بيـ"لف نفسه" عشان يقلل التلامس (lyophobic).</div>
<h5>Association (amphiphilic) colloids</h5>
<p>مكوّنة من جزيئات <b>surfactant</b> كل واحد لوحده أصغر من الحجم الغروي. لما التركيز يزيد فوق الـ <b>CMC</b>، بيتجمعوا ويعملوا <b>micelles</b> بحجم غروي.</p>

<h4>4. مقارنة الأنواع التلاتة</h4>
<div class="tblwrap"><table><tr><th></th><th>Lyophilic</th><th>Lyophobic</th><th>Association</th></tr>
<tr><td>Dispersed phase</td><td>Organic molecules</td><td>Inorganic particles</td><td>Micelles</td></tr>
<tr><td>Solvation</td><td>Solvated</td><td>Not solvated</td><td>Solvated</td></tr>
<tr><td>Formation</td><td>Spontaneous</td><td>Special methods</td><td>Spontaneous above CMC</td></tr>
<tr><td>Viscosity</td><td>Greatly increased</td><td>Hardly changed</td><td>Increases with concentration</td></tr>
<tr><td>Electrolytes</td><td>Stable; salted out at high conc.</td><td>Unstable with small amounts</td><td>Lower the CMC</td></tr></table></div>
<p>بالعربي: الـ <b>lyophilic</b> <b>بيزوّد اللزوجة جدًا</b> (بسبب الغلاف والشكل الغير متماثل)، و<b>ثابت مع كمية قليلة من الإلكتروليتات</b> بس بيتـ<b>salted out</b> بالتركيز العالي لأنها بتشيل الغلاف. الـ <b>lyophobic</b> <b>اللزوجة تقريبًا ما بتتغيرش</b>، و<b>مش ثابت حتى مع كمية قليلة</b> من الإلكتروليتات لأن شحنته بتتعادل. والـ <b>association</b> اللزوجة بتزيد مع التركيز، والإلكتروليتات <b>بتقلل الـ CMC</b>.</p>

<h4>5. ليه الغرويات ثابتة أو مش ثابتة؟</h4>
<p>تحويل جزيئات كبيرة لصغيرة محتاج شغل (كهربي، ميكانيكي، موجات). النتيجة مساحة سطحية ضخمة بـ<b>طاقة سطحية حرة عالية</b>. وده <b>نظام غير مستقر ديناميكيًا حراريًا</b>: الجزيئات "عايزة" تتجمع تاني عشان تقلل المساحة والطاقة. والتكتل ده اسمه <b>aggregation</b>.</p>
<p>اللي بيمنعه:</p>
<ul>
<li><b>Lyophilic</b>: <b>غلاف المذيب</b>، ومعاه أو من غيره <b>شحنة سطحية</b>. طبقتين حماية، وعشان كده كمية قليلة من الإلكتروليت ما بتأثرش؛ الكمية الكبيرة بس هي اللي بتشيل الغلاف (salting out).</li>
<li><b>Lyophobic</b>: <b>الشحنة السطحية بس</b>. الجزيئات المتشابهة في الشحنة بتتنافر. لو ضفنا شوية إلكتروليت، الأيونات العكسية <b>بتعادل الشحنة</b>، فمفيش حاجة تبعد الجزيئات عن بعض فـ<b>تتكتل (flocculate)</b>.</li>
</ul>

<h4>6. تحضير الـ Lyophobic colloids</h4>
<h5>أ) طرق الـ Dispersion (من كبير لصغير)</h5>
<ol>
<li><b>Ultrasonic generator</b>: موجات فوق صوتية قوية أكتر من <b>20,000 ذبذبة في الثانية</b> بتكسّر الجزيئات.</li>
<li><b>Electric arc</b>: قوس كهربي بين قطبين معدن تحت السائل. الحرارة الشديدة بتبخّر جزء من المعدن، وبعدين يتكثف لجزيئات غروية.</li>
<li><b>Colloid mill</b>: المادة بتتقص بين لوحين قريبين من بعض بيلفوا بسرعة. <b>كفاءته قليلة</b>: بيصغّر نسبة صغيرة بس من الجزيئات.</li>
</ol>
<h5>ب) طرق الـ Condensation (من صغير لكبير)</h5>
<p>جزيئات أصغر من الغروية بنخليها تكبر للحجم الغروي.</p>
<ol>
<li><b>التشبع الزائد</b> ثم تكوين نوى ونموها: ندوّب <b>الكبريت</b> في مذيب عضوي ونصب المحلول المركّز في ماء كتير. بتتكون نوى صغيرة كتير في الخليط فوق المشبع وتكبر بسرعة وتعمل <b>محلول كبريت غروي</b>.</li>
<li><b>تفاعلات كيميائية</b>:
<ul><li><b>أكسدة</b>: H₂S + عامل مؤكسد ← كبريت غروي.</li>
<li><b>تحلل مائي</b>: غلي كلوريد الحديديك مع الماء ← محلول أكسيد حديديك أحمر.</li>
<li>وكمان الاختزال والـ double decomposition.</li></ul></li>
</ol>

<h4>7. تنقية الغرويات</h4>
<p><b>ليه؟</b> محاليل الـ lyophobic غالبًا فيها مواد دايبة، خصوصًا <b>شوائب إلكتروليتية</b> بتعادل شحنة الجزيئات وتعمل <b>تكتل</b>.</p>
<ol>
<li><b>Dialysis</b>: بيعتمد على فرق الحجم بين الجزيئات الغروية (المنتج) والشوائب الصغيرة. <b>الغشاء شبه المنفذ</b> بيخلي الجزيئات والأيونات الصغيرة (جلوكوز، يوريا، NaCl) تخرج لحد ما يحصل توازن، ويحجز الغروي جوه.</li>
<li><b>Electrodialysis</b>: جهد كهربي بيسرّع خروج الشوائب الأيونية من الغشاء. بيستخدم <b>وعاء من 3 أقسام</b>: ماء وأقطاب في القسمين اللي برّه، والمحلول الغروي في النص. <b>الأيونات الموجبة</b> بتروح ناحية القطب <b>السالب</b>، و<b>السالبة</b> ناحية <b>الموجب</b>، فتسيب المحلول.</li>
<li><b>Ultrafiltration</b>: ترشيح <b>بالشفط (ضغط سالب)</b> من غشاء مسامه صغيرة جدًا (nitrocellulose أو collodion)، متركّب في قمع Büchner على شبكة سلك رفيعة. الغرويات بتعدّي من ورق الترشيح العادي بس بتتحجز هنا، والجزيئات الصغيرة بتعدّي.</li>
</ol>

<h4>8. الـ Dialysis في الطب: الكلية الصناعية (الغسيل الكلوي)</h4>
<ul>
<li>دم المريض الشرياني بيعدّي في أنابيب <b>سيلوفان</b>، وهو غشاء شبه منفذ مثالي. بيعدّي <b>اليوريا والجلوكوز والأملاح</b>، و<b>ما بيعدّيش بروتينات البلازما ولا خلايا الدم</b>.</li>
<li>الدم النضيف بيرجع للجسم من وريد.</li>
<li>نجاح الجهاز بيتقاس بقدرته على <b>تقليل يوريا الدم</b>.</li>
</ul>
<p><b>سائل الغسيل (dialysate) معمول بحيث:</b></p>
<ul>
<li>المواد <b>الزيادة</b> في الدم (<b>اليوريا</b>) تنتشر <b>لبرّه</b> في السائل (السائل ما فيهوش يوريا)؛</li>
<li>المواد <b>الناقصة</b> في الدم (<b>البيكربونات</b>) تنتشر <b>للدم</b> (السائل فيه أكتر)؛</li>
<li>المواد اللي مستواها <b>طبيعي</b> (<b>الجلوكوز</b> وغيره) تكون <b>بنفس التركيز</b> في الناحيتين، فمفيش حركة.</li>
</ul>

DEEP.dosage[7]={en:`
<p>Lecture 7 finishes colloids with their <b>properties</b>. These matter because they are how we <b>detect</b> colloids, <b>measure</b> their particle size, molecular weight and shape, and predict their <b>stability</b>. The properties fall into three groups: <b>optical</b>, <b>kinetic</b> and <b>electrical</b>.</p>

<h4>1. Optical properties</h4>
<h5>Faraday–Tyndall effect (light scattering)</h5>
<ul>
<li><b>True solutions</b> don't scatter light, so they look clear.</li>
<li><b>Colloidal dispersions</b> contain particles big enough to <b>scatter</b> light, so they look turbid. Shine a strong beam through a sol and you see a bright, visible path: the <b>Tyndall cone</b>. (The same thing makes a torch beam visible in fog or dust.)</li>
<li>Uses: determining the <b>molecular weight</b> of the colloid and getting information about particle <b>shape and size</b>.</li>
<li>Scattering is expressed as <b>turbidity (τ)</b>, measured at <b>90°</b> to the incident beam.</li>
<li>Turbidity is <b>proportional to the molecular weight</b> of a lyophobic colloid and to its <b>concentration</b>.</li>
</ul>
<h5>The ultramicroscope</h5>
<ul>
<li>Works by <b>light scattering</b>: particles appear as <b>bright spots</b> against a <b>dark background</b>.</li>
<li>You can't see the particles' real shape, but you can see and <b>count</b> the spots.</li>
<li>Some lyophilic colloids can't be resolved by it, so its use has declined.</li>
</ul>
<h5>The electron microscope</h5>
<ul>
<li>Uses high-energy electron beams, so it has much greater <b>resolving power</b> (the smallest distance at which two objects can still be told apart), down to about <b>5 Å</b> (1 nm = 10 Å = 10⁻⁹ m).</li>
<li>Gives an <b>actual picture</b> of the particles: their <b>size, shape and structure</b>.</li>
<li><b>Drawback:</b> only <b>dried</b> samples can be examined, so it gives <b>no information about solvation</b> (the solvent sheath is lost on drying).</li>
</ul>

<h4>2. Kinetic properties (particle motion)</h4>
<h5>Brownian motion</h5>
<ul>
<li><b>Random, zig-zag movement</b> of colloidal particles caused by <b>bombardment by molecules of the dispersion medium</b>. A small particle is hit unevenly from different sides at each instant, so it jitters about.</li>
<li>Visible under the ultramicroscope for particles up to about <b>5 µm</b>.</li>
<li>Faster with <b>smaller particles</b> and <b>lower viscosity</b> of the medium.</li>
<li><b>Increasing viscosity</b> (e.g. adding glycerin) slows and eventually <b>stops</b> Brownian motion.</li>
</ul>
<h5>Diffusion</h5>
<p>Particles spread from regions of higher to lower concentration until the system is uniform. Diffusion is a <b>direct result of Brownian motion</b>. It is described by <b>Fick's first law</b>:</p>
<div class="formula">dm/dt = − D · A · dC/dx<small>The amount diffusing per unit time across area A is proportional to the concentration gradient dC/dx. D = diffusion coefficient. The minus sign means diffusion runs towards decreasing concentration.</small></div>
<p>Colloids diffuse <b>very slowly</b> compared with true solutes, because they are much larger.</p>
<h5>Osmosis</h5>
<p><b>Osmosis</b> is the movement of <b>solvent</b> (water) molecules from a region of <b>lower solute concentration</b> to one of <b>higher solute concentration</b>, through a <b>semipermeable membrane</b> that lets solvent through but not solute. The pressure the concentrated solution exerts on the membrane is the <b>osmotic pressure</b>.</p>
<h5>Sedimentation</h5>
<p>Particles heavier than the medium settle under gravity. For spherical particles the settling velocity is given by <b>Stokes' law</b>:</p>
<div class="formula">v = 2r² (ρ − ρ₀) g / 9η<small>v = sedimentation velocity · r = particle radius · ρ = particle density · ρ₀ = medium density · g = gravity · η = medium viscosity</small></div>
<p>Read the equation as a list of ways to <b>slow settling</b> (useful later for suspensions): make particles <b>smaller</b> (the effect is <b>squared</b>, so halving r cuts v to a quarter), reduce the <b>density difference</b>, or increase the <b>viscosity</b>.</p>
<p>For particles <b>below about 0.5 µm (500 nm)</b>, Brownian motion is strong enough to <b>oppose</b> settling and keep them mixed. To make them sediment measurably we use an <b>ultracentrifuge</b>, which applies a far stronger force than gravity. The ultracentrifuge is used to:</p>
<ol>
<li>determine the <b>molecular weight</b> of polymers, especially <b>proteins</b>;</li>
<li>check the <b>homogeneity</b> of a sample (whether all particles are the same size);</li>
<li><b>separate</b> polydisperse systems (mixtures of particle sizes).</li>
</ol>
<h5>Viscosity</h5>
<p><b>Viscosity</b> is a system's <b>resistance to flow</b> under applied stress. In colloids it gives two kinds of information:</p>
<ul>
<li><b>Molecular weight</b>: the intrinsic viscosity follows <b>η<sub>int</sub> = K·M<sup>a</sup></b>, where K and a are constants for that polymer–solvent pair.</li>
<li><b>Particle shape</b>: <b>spherical</b> particles (<b>lyophobic</b> sols, "spherocolloids") give <b>low-viscosity</b> dispersions because they are unsolvated. <b>Linear</b> particles (<b>lyophilic</b> colloids) give <b>high-viscosity</b> dispersions because they are solvated: the solvent sheath makes each one effectively larger and long chains tangle and resist flow.</li>
</ul>

<h4>3. Electrical properties</h4>
<p>The lecture lists two electrical properties to complete the picture: the <b>electric double layer</b> (the layer of charge on the particle surface plus the oppositely charged ions gathered around it) and <b>electrophoresis</b> (movement of charged colloidal particles towards an electrode in an electric field). This surface charge is exactly what keeps <b>lyophobic</b> colloids stable (Lecture 6) and what electrolytes neutralise.</p>

<h4>4. Summary: which property tells you what</h4>
<div class="tblwrap"><table><tr><th>Property</th><th>Tells you / used for</th></tr>
<tr><td>Tyndall effect / turbidity</td><td>Detects a colloid; molecular weight, size, shape (turbidity measured at 90°)</td></tr>
<tr><td>Ultramicroscope</td><td>Counting particles (bright spots)</td></tr>
<tr><td>Electron microscope</td><td>Real size, shape, structure; dried samples only, no solvation information</td></tr>
<tr><td>Brownian motion</td><td>Faster with smaller particles and lower viscosity; opposes sedimentation below 0.5 µm</td></tr>
<tr><td>Diffusion (Fick)</td><td>Follows from Brownian motion; very slow for colloids</td></tr>
<tr><td>Sedimentation (Stokes), ultracentrifuge</td><td>Molecular weight of proteins, homogeneity, separation</td></tr>
<tr><td>Viscosity</td><td>Molecular weight (η = K·Mᵃ) and shape (spherical = low, linear = high)</td></tr></table></div>

<p>محاضرة 7 بتقفل الغرويات بـ<b>خواصها</b>. الخواص دي مهمة لأنها الطريقة اللي بنـ<b>كشف</b> بيها الغروي، و<b>نقيس</b> حجم جزيئاته ووزنه الجزيئي وشكله، ونتوقع <b>ثباته</b>. والخواص بتتقسم 3 مجموعات: <b>ضوئية</b> و<b>حركية</b> و<b>كهربية</b>.</p>

<h4>1. الخواص الضوئية</h4>
<h5>ظاهرة Faraday–Tyndall (تشتت الضوء)</h5>
<ul>
<li><b>المحاليل الحقيقية</b> ما بتشتتش الضوء، فشكلها رايق.</li>
<li><b>المحاليل الغروية</b> فيها جزيئات كبيرة كفاية إنها <b>تشتت</b> الضوء، فشكلها معكّر. لو عدّيتي شعاع ضوء قوي فيها هتشوفي مسار منوّر واضح اسمه <b>Tyndall cone</b>. (نفس اللي بيخلي شعاع الكشاف يبان في الضباب أو التراب.)</li>
<li>الاستخدام: تحديد <b>الوزن الجزيئي</b> للغروي ومعرفة <b>شكل وحجم</b> الجزيئات.</li>
<li>التشتت بيتعبّر عنه بـ<b>العكارة (turbidity, τ)</b>، وبتتقاس عند زاوية <b>90°</b> من الشعاع.</li>
<li>العكارة <b>بتتناسب مع الوزن الجزيئي</b> للغروي الـ lyophobic ومع <b>تركيزه</b>.</li>
</ul>
<h5>الـ Ultramicroscope</h5>
<ul>
<li>بيشتغل بـ<b>تشتت الضوء</b>: الجزيئات بتبان <b>نقط منوّرة</b> على <b>خلفية سودا</b>.</li>
<li>مش هتشوفي شكل الجزيء الحقيقي، بس تقدري تشوفي النقط و<b>تعدّيها</b>.</li>
<li>بعض الـ lyophilic ما بيبانوش بيه، فاستخدامه قلّ.</li>
</ul>
<h5>الميكروسكوب الإلكتروني</h5>
<ul>
<li>بيستخدم شعاع إلكترونات عالي الطاقة، فـ<b>قوة التمييز (resolving power)</b> بتاعته أعلى بكتير (أصغر مسافة بين حاجتين ونقدر نفرّق بينهم)، لحد حوالي <b>5 أنجستروم</b> (<bdi>1 nm = 10 Å = 10⁻⁹ m</bdi>).</li>
<li>بيدي <b>صورة حقيقية</b> للجزيئات: <b>الحجم والشكل والتركيب</b>.</li>
<li><b>العيب:</b> بيفحص العينات <b>الناشفة</b> بس، فـ<b>ما بيديش معلومات عن الـ solvation</b> (غلاف المذيب بيضيع لما العينة تنشف).</li>
</ul>

<h4>2. الخواص الحركية</h4>
<h5>الحركة البراونية (Brownian motion)</h5>
<ul>
<li><b>حركة عشوائية متعرجة</b> للجزيئات الغروية بسبب <b>خبط جزيئات الوسط فيها</b>. الجزيء الصغير بيتخبط من نواحي مختلفة بشكل مش متساوي كل لحظة، فبيرتعش ويتنطط.</li>
<li>بتتشاف بالـ ultramicroscope للجزيئات لحد حوالي <b>5 µm</b>.</li>
<li>بتبقى أسرع مع <b>الجزيئات الأصغر</b> و<b>اللزوجة الأقل</b>.</li>
<li><b>زيادة اللزوجة</b> (زي إضافة جلسرين) بتبطّأها ولحد ما <b>توقفها</b>.</li>
</ul>
<h5>الانتشار (Diffusion)</h5>
<p>الجزيئات بتنتشر من التركيز العالي للواطي لحد ما النظام يبقى متجانس. الانتشار <b>نتيجة مباشرة للحركة البراونية</b>، وبيوصفه <b>قانون Fick الأول</b>:</p>
<div class="formula">dm/dt = − D · A · dC/dx<small>Amount diffusing per unit time across area A is proportional to the concentration gradient. D = diffusion coefficient. Minus sign: towards lower concentration.</small></div>
<p>الغرويات بتنتشر <b>ببطء جدًا</b> مقارنة بالمذابات الحقيقية لأنها أكبر بكتير.</p>
<h5>الأسموزية (Osmosis)</h5>
<p>حركة جزيئات <b>المذيب</b> (الماء) من منطقة <b>تركيز المذاب فيها أقل</b> لمنطقة <b>تركيزه أعلى</b>، من خلال <b>غشاء شبه منفذ</b> بيعدّي المذيب ومش بيعدّي المذاب. والضغط اللي المحلول المركّز بيعمله على الغشاء اسمه <b>الضغط الأسموزي</b>.</p>
<h5>الترسيب (Sedimentation)</h5>
<p>الجزيئات الأتقل من الوسط بتنزل بالجاذبية. للجزيئات الكروية، سرعة النزول بيحددها <b>قانون Stokes</b>:</p>
<div class="formula">v = 2r² (ρ − ρ₀) g / 9η<small>v = sedimentation velocity · r = radius · ρ = particle density · ρ₀ = medium density · g = gravity · η = viscosity</small></div>
<p>اقري المعادلة كقايمة طرق لـ<b>تبطيء الترسيب</b> (هتفيدك بعدين في المعلقات): صغّري الجزيئات (التأثير <b>تربيعي</b>، يعني لو نصّيتي r السرعة تبقى الربع)، أو قللي <b>فرق الكثافة</b>، أو زوّدي <b>اللزوجة</b>.</p>
<p>للجزيئات <b>الأصغر من حوالي 0.5 µm (500 nm)</b>، الحركة البراونية قوية كفاية إنها <b>تقاوم</b> النزول وتخليها مختلطة. وعشان نخليها تترسب بشكل نقدر نقيسه بنستخدم <b>ultracentrifuge</b>، بيدي قوة أكبر بكتير من الجاذبية. وبنستخدمه في:</p>
<ol>
<li>تحديد <b>الوزن الجزيئي</b> للبوليمرات، خصوصًا <b>البروتينات</b>؛</li>
<li>معرفة <b>تجانس</b> العينة (هل كل الجزيئات بنفس الحجم)؛</li>
<li><b>فصل</b> الأنظمة اللي فيها أحجام مختلفة (polydisperse).</li>
</ol>
<h5>اللزوجة (Viscosity)</h5>
<p>الـ <b>لزوجة</b> هي <b>مقاومة النظام للسريان</b> تحت قوة. في الغرويات بتدينا نوعين معلومات:</p>
<ul>
<li><b>الوزن الجزيئي</b>: الـ intrinsic viscosity ماشية على <bdi>η int = K·Mᵃ</bdi>، و K و a ثوابت لكل زوج بوليمر ومذيب.</li>
<li><b>شكل الجزيء</b>: الجزيئات <b>الكروية</b> (الـ <b>lyophobic</b>، اسمها spherocolloids) بتدي <b>لزوجة قليلة</b> لأنها مش solvated. والجزيئات <b>الخطية</b> (الـ <b>lyophilic</b>) بتدي <b>لزوجة عالية</b> لأنها solvated: غلاف المذيب بيكبّر حجمها الفعلي، والسلاسل الطويلة بتتلخبط في بعض وتقاوم السريان.</li>
</ul>

<h4>3. الخواص الكهربية</h4>
<p>المحاضرة بتذكر خاصيتين كهربيتين عشان الصورة تكمل: الـ <b>electric double layer</b> (طبقة الشحنة على سطح الجزيء والأيونات العكسية اللي متجمعة حواليها)، والـ <b>electrophoresis</b> (حركة الجزيئات الغروية المشحونة ناحية قطب في مجال كهربي). الشحنة السطحية دي هي بالظبط اللي بتخلي الـ <b>lyophobic</b> ثابت (محاضرة 6)، وهي اللي الإلكتروليتات بتعادلها.</p>

<h4>4. ملخص: كل خاصية بتقولنا إيه</h4>
<div class="tblwrap"><table><tr><th>Property</th><th>Tells you / used for</th></tr>
<tr><td>Tyndall / turbidity</td><td>Detects colloid; molecular weight, size, shape (at 90°)</td></tr>
<tr><td>Ultramicroscope</td><td>Counting particles</td></tr>
<tr><td>Electron microscope</td><td>Real size and shape; dried samples only</td></tr>
<tr><td>Brownian motion</td><td>Faster if smaller/less viscous; opposes settling below 0.5 µm</td></tr>
<tr><td>Diffusion (Fick)</td><td>Result of Brownian motion; slow for colloids</td></tr>
<tr><td>Sedimentation, ultracentrifuge</td><td>Protein molecular weight, homogeneity, separation</td></tr>
<tr><td>Viscosity</td><td>Molecular weight and shape (spherical low, linear high)</td></tr></table></div>

DEEP.genetics[1]={en:`
<p>This first lecture answers two questions: <b>what does DNA look like</b>, and <b>how does a cell copy it</b> before dividing? Everything later in the course (transcription, translation, gene regulation) builds on these two ideas, so it is worth understanding them properly rather than memorising lists.</p>

<h4>1. How the structure of DNA was discovered</h4>
<p>The double helix was not found by one person. Three groups each added a piece, and the exam often asks you to match the scientist to the conclusion.</p>
<h5>Rosalind Franklin: X-ray crystallography</h5>
<p>Franklin passed X-rays through aligned fibres of purified DNA. Atoms scatter X-rays in a pattern (a diffraction pattern), and from that pattern you can work out where the atoms sit. Her pictures showed three things:</p>
<ul>
<li>The <b>sugar–phosphate backbone is on the outside</b> of the molecule. This makes sense chemically: phosphate groups are charged and hydrophilic, so they face the watery surroundings.</li>
<li>The <b>nitrogenous bases are on the inside</b>. Bases are flat, relatively hydrophobic rings, so they hide from water in the core.</li>
<li>The molecule is made of <b>two strands arranged as a helix</b>.</li>
</ul>
<h5>Erwin Chargaff: base ratios</h5>
<p>Chargaff measured how much of each base was in DNA and found that <b>A always equals T</b> and <b>G always equals C</b>. It follows that the total purines (A + G) equal the total pyrimidines (T + C). The explanation is base pairing: the two strands are held together by hydrogen bonds between bases, and pairing is strict.</p>
<ul>
<li><b>A pairs only with T</b> through <b>2 hydrogen bonds</b> (A=T).</li>
<li><b>G pairs only with C</b> through <b>3 hydrogen bonds</b> (G≡C).</li>
<li>Because of the extra hydrogen bond, a G≡C pair is about <b>50% stronger</b> than an A=T pair. A DNA region rich in G and C is therefore harder to separate. Keep this in mind: it is why replication origins are <b>AT-rich</b> (easy to melt).</li>
</ul>
<div class="ex"><b>Worked example:</b> a DNA sample is 20% adenine. Then T = 20%, so A + T = 40%. The remaining 60% is G + C, split equally: G = 30% and C = 30%.</div>
<h5>Watson and Crick (1953): the model</h5>
<p>Watson and Crick combined Franklin's and Chargaff's data into one model: a <b>double helix</b> (a cylindrical spiral) of two polynucleotide chains running in <b>opposite directions</b>. One strand runs 5'→3' and its partner runs 3'→5'. This is called <b>antiparallel</b>. By convention a DNA sequence is always <b>read and written 5'→3'</b>.</p>

<h4>2. The chemistry of the chain</h4>
<p>The building block is the <b>nucleotide</b>. Learn the three levels of naming, because MCQs love to swap them:</p>
<ul>
<li><b>Nucleobase</b> = the nitrogenous base alone (A, G, C, T or U).</li>
<li><b>Nucleoside</b> = base + pentose sugar. The bond joining base to sugar is the <b>N-glycosidic bond</b>.</li>
<li><b>Nucleotide</b> = base + pentose + phosphate.</li>
</ul>
<p>Nucleotides join into a strand through <b>phosphodiester bonds</b>: a phosphate group links the <b>3'-OH</b> of one sugar to the <b>5'-OH</b> of the next sugar. That is where "5' end" and "3' end" come from. One end of every strand has a free 5'-phosphate, the other a free 3'-OH. The free 3'-OH matters a lot later, because enzymes can only add new nucleotides onto it.</p>
<p>The sugar differs between the two nucleic acids: <b>deoxyribose in DNA</b> (no OH at carbon 2') and <b>ribose in RNA</b>. DNA uses thymine; RNA uses uracil instead. DNA is double-stranded; RNA is usually single-stranded. The three main RNA types are mRNA (carries the code), tRNA (brings amino acids, has the anticodon) and rRNA (part of the ribosome).</p>

<h4>3. The three forms of DNA</h4>
<ul>
<li><b>B-DNA</b>: the common <b>right-handed</b> form found in cells, with high water content. Its base pairs lie flat, perpendicular to the helix axis, so proteins can easily reach and read them.</li>
<li><b>A-DNA</b>: also <b>right-handed</b>, but it appears under <b>dehydrating</b> conditions.</li>
<li><b>Z-DNA</b>: the rare <b>left-handed</b> form. Its helix is narrower and more elongated than A or B.</li>
</ul>
<div class="pearl"><strong>Exam trap:</strong> only Z-DNA is left-handed. A and B are both right-handed.</div>

<h4>4. Packing DNA into chromosomes</h4>
<p>Human DNA is about two metres long per cell, yet it fits inside a nucleus a few micrometres wide. It is packed in levels:</p>
<ol>
<li>About <b>146 base pairs</b> of DNA wrap around a core of <b>eight histone proteins</b> (the histone octamer). This unit is the <b>nucleosome</b>, the basic subunit of chromatin. Histones are <b>basic</b> (positively charged) proteins, which is why they grip the negatively charged phosphate backbone so tightly.</li>
<li>Strings of nucleosomes coil into a <b>chromatin fibre</b>.</li>
<li>The fibre is compacted further into a highly organised DNA–protein complex: the <b>chromosome</b>.</li>
</ol>
<p>A <b>gene</b> is a length of DNA that codes for a specific protein. DNA has two essential properties: it can <b>replicate</b> (copy itself), and it <b>codes for proteins</b> through RNA.</p>

<h4>5. Replication is semiconservative</h4>
<p>Three models were proposed for how DNA could be copied:</p>
<ul>
<li><b>Conservative</b>: the original double helix stays intact and a completely new one is made.</li>
<li><b>Semiconservative</b>: the two strands separate, each acts as a template, and every new double helix contains <b>one old strand and one new strand</b>.</li>
<li><b>Dispersive</b>: old and new DNA are mixed in fragments along both strands.</li>
</ul>
<p>The correct model is <b>semiconservative</b>. In each daughter molecule one parental strand is conserved.</p>

<h4>6. Step by step: how replication happens</h4>
<h5>Step 1: the origin of replication</h5>
<p>Replication starts at a specific nucleotide sequence called the <b>origin of replication</b>. It is a <b>consensus sequence</b>, meaning the order of nucleotides is essentially the same at every origin. It contains short <b>AT-rich</b> segments, which melt easily because A=T has only two hydrogen bonds. Prokaryotes have a <b>single origin</b>; eukaryotes, with much larger genomes, have <b>multiple origins</b> so the job finishes in time.</p>
<h5>Step 2: separating the strands (forming the replication fork)</h5>
<p>Four proteins work together here. Know each one's job:</p>
<ul>
<li><b>DnaA protein</b> binds the AT-rich sequences at the origin and starts melting them. It needs <b>ATP</b>.</li>
<li><b>DNA helicase</b> binds near the fork and moves into the double helix, unwinding it. It also needs <b>ATP</b>.</li>
<li><b>SSB proteins</b> (single-stranded DNA binding proteins) coat the exposed single strands. They keep the strands apart and protect them from nucleases.</li>
<li><b>Topoisomerases</b> solve a mechanical problem. Unwinding a twisted rope in one place makes it over-twist further along. In the same way, unwinding DNA creates <b>supercoils ahead of the fork</b>. Topoisomerases relieve these supercoils.</li>
</ul>
<h5>Step 3: making a primer</h5>
<p>DNA polymerase cannot start a strand from nothing. It can only add to an existing free 3'-OH. So the enzyme <b>primase</b> first lays down a short <b>RNA primer</b> of about <b>10 nucleotides</b>. That primer supplies the 3'-OH starting point.</p>
<h5>Step 4: the leading strand</h5>
<p><b>DNA polymerase III</b> adds deoxyribonucleotides (dNTPs) to the free 3'-OH of the primer. It reads the parent strand <b>3'→5'</b> and builds the new strand <b>5'→3'</b>. On one template this direction points toward the replication fork, so the polymerase can simply follow the fork as it opens. This is the <b>leading strand</b>: it is made <b>continuously</b> and needs only <b>one primer</b>, at its start.</p>
<h5>Step 5: the lagging strand</h5>
<p>The other template runs the opposite way. Since synthesis can only go 5'→3', the new strand on this side grows <b>away from the fork</b>. The polymerase must keep jumping back to the fork as more DNA is exposed and make short pieces. These pieces are <b>Okazaki fragments</b>, and the strand is the <b>lagging strand</b>. It is made <b>discontinuously</b>, and every fragment needs its <b>own primer</b>, so there are many primers.</p>
<h5>Step 6: removing primers</h5>
<p>DNA polymerase III keeps synthesising until it bumps into the next RNA primer. <b>DNA polymerase I</b> then removes the RNA primer with its <b>5'→3' exonuclease</b> activity and fills the gap with DNA using its <b>5'→3' polymerase</b> activity.</p>
<h5>Step 7: ligation</h5>
<p>A small break, a <b>nick</b>, remains between neighbouring fragments. <b>DNA ligase</b> seals it by making a phosphodiester bond between the 3'-OH of one fragment and the 5'-phosphate of the next. The energy comes from splitting <b>ATP into AMP + PPi</b>.</p>

<h4>7. Proofreading: why replication is so accurate</h4>
<p>As it builds, DNA polymerase III checks each nucleotide it has added. If the base is wrong, the enzyme steps back, removes it, and inserts the right one. This uses its <b>3'→5' exonuclease</b> activity, which is called <b>proofreading</b>.</p>
<div class="tblwrap"><table><tr><th>DNA polymerase III</th><th>DNA polymerase I</th></tr>
<tr><td>5'→3' polymerase: builds the new strand (main synthesis)</td><td>5'→3' exonuclease: removes RNA primers</td></tr>
<tr><td>3'→5' exonuclease: proofreading</td><td>5'→3' polymerase: fills the gaps</td></tr>
<tr><td></td><td>3'→5' exonuclease: proofreading</td></tr></table></div>
<p>Notice the direction tells you the job. <b>5'→3' exonuclease</b> chews from the front, which is how primers ahead of Pol I are removed. <b>3'→5' exonuclease</b> chews backwards from the growing end, which is how a mistake that was just added gets removed.</p>
<div class="pearl"><strong>Lecture question (order of enzymes):</strong> Helicase → Topoisomerase → Primase → DNA polymerase III → DNA polymerase I → Ligase.</div>
<div class="ex"><b>Group discussion from the lecture:</b> "DNA polymerase III functions in association with primase." This is true. Pol III cannot begin without the primer that primase makes, and on the lagging strand primase must work again and again, once for each Okazaki fragment.</div>

<p>المحاضرة دي بتجاوب على سؤالين: <b>شكل الـ DNA عامل إزاي</b>، و<b>الخلية بتنسخه إزاي</b> قبل ما تنقسم؟ كل اللي جاي في الكورس (النسخ، الترجمة، تنظيم الجينات) مبني على الفكرتين دول، فمهم نفهمهم كويس مش نحفظهم بس.</p>

<h4>1. اكتشاف تركيب الـ DNA</h4>
<p>الحلزون المزدوج ما اكتشفهوش شخص واحد. تلات مجموعات كل واحدة ضافت حتة، والامتحان كتير بيسأل: مين العالم اللي وصل للاستنتاج ده؟</p>
<h5>Rosalind Franklin والأشعة السينية</h5>
<p>فرانكلين عدّت X-rays على ألياف DNA نقية ومترتبة. الذرات بتشتت الأشعة بنمط معين (diffraction pattern)، ومن النمط ده بنعرف أماكن الذرات. صورها أثبتت 3 حاجات:</p>
<ul>
<li>الـ <b>sugar–phosphate backbone برّه</b> الجزيء. ده منطقي لأن مجموعات الفوسفات مشحونة ومحبة للماء، فبتبص ناحية الوسط المائي.</li>
<li>القواعد النيتروجينية <b>جوّه</b>، لأنها حلقات مسطحة وكارهة للماء نسبيًا فبتستخبى في القلب.</li>
<li>الجزيء مكوَّن من <b>شريطين ملفوفين حلزوني</b>.</li>
</ul>
<h5>Erwin Chargaff ونسب القواعد</h5>
<p>شارجاف قاس كمية كل قاعدة ولقى إن <b>A دايمًا = T</b> و <b>G دايمًا = C</b>. وبالتالي مجموع الـ purines (A + G) = مجموع الـ pyrimidines (T + C). السبب هو التزاوج بين القواعد: الشريطين ماسكين في بعض بروابط هيدروجينية بين القواعد، والتزاوج ثابت:</p>
<ul>
<li><b>A مع T بس</b> بـ <b>رابطتين هيدروجين</b>.</li>
<li><b>G مع C بس</b> بـ <b>3 روابط هيدروجين</b>.</li>
<li>عشان الرابطة الزيادة، زوج G≡C أقوى بحوالي <b>50%</b> من A=T. فالمنطقة الغنية بـ GC أصعب في الفصل. خلي ده في دماغك: هو السبب إن أماكن بداية التضاعف بتكون <b>غنية بـ AT</b> (سهلة الفك).</li>
</ul>
<div class="ex"><b>مثال محلول:</b> عينة DNA فيها 20% أدينين. يبقى T = 20%، و A + T = 40%. الـ 60% الباقيين هما G + C بالتساوي: G = 30% و C = 30%.</div>
<h5>Watson و Crick سنة 1953</h5>
<p>جمعوا بيانات فرانكلين وشارجاف في موديل واحد: <b>حلزون مزدوج</b> (لولب أسطواني) من سلسلتين بيمشوا في <b>اتجاهين عكس بعض</b>، واحدة من 5' لـ 3' والتانية من 3' لـ 5'. ده اسمه <b>antiparallel</b>. وبالاتفاق، تسلسل الـ DNA <b>بيتقري ويتكتب دايمًا من 5' لـ 3'</b>.</p>

<h4>2. كيمياء السلسلة</h4>
<p>وحدة البناء هي الـ <b>nucleotide</b>. احفظي المستويات التلاتة للتسمية لأن أسئلة الـ MCQ بتبدّل بينهم:</p>
<ul>
<li><b>Nucleobase</b> = القاعدة النيتروجينية لوحدها (A أو G أو C أو T أو U).</li>
<li><b>Nucleoside</b> = قاعدة + سكر خماسي. الرابطة بين القاعدة والسكر اسمها <b>N-glycosidic bond</b>.</li>
<li><b>Nucleotide</b> = قاعدة + سكر + فوسفات.</li>
</ul>
<p>النيوكليوتيدات بتتوصل ببعض بـ <b>phosphodiester bonds</b>: مجموعة فوسفات بتربط الـ <b>3'-OH</b> بتاع سكر بالـ <b>5'-OH</b> بتاع السكر اللي بعده. ومن هنا جه اسم الطرف 5' والطرف 3'. كل شريط ليه طرف فيه فوسفات حر عند 5'، وطرف فيه OH حر عند 3'. الـ 3'-OH الحر ده مهم جدًا بعدين، لأن الإنزيمات ما تقدرش تضيف نيوكليوتيدات جديدة غير عليه.</p>
<p>السكر بيختلف: <b>deoxyribose في الـ DNA</b> (مفيش OH على كربون 2') و<b>ribose في الـ RNA</b>. الـ DNA فيه thymine، والـ RNA فيه uracil بداله. الـ DNA شريطين، والـ RNA غالبًا شريط واحد. أنواع الـ RNA الأساسية: mRNA (بيشيل الشفرة)، tRNA (بيجيب الأحماض الأمينية وفيه الـ anticodon)، و rRNA (جزء من الريبوسوم).</p>

<h4>3. أشكال الـ DNA التلاتة</h4>
<ul>
<li><b>B-DNA</b>: الشكل الشائع في الخلية، <b>يميني</b>، ومحتوى الماء فيه عالي. أزواج القواعد فيه أفقية (عمودية على محور الحلزون)، فالبروتينات توصلها وتقراها بسهولة.</li>
<li><b>A-DNA</b>: برضه <b>يميني</b>، بس بيظهر في ظروف <b>الجفاف</b>.</li>
<li><b>Z-DNA</b>: نادر و<b>يساري</b>، والحلزون فيه أرفع وأطول من A و B.</li>
</ul>
<div class="pearl"><strong>فخ في الامتحان:</strong> Z-DNA بس هو اليساري. A و B الاتنين يمينيين.</div>

<h4>4. تعبئة الـ DNA في الكروموسومات</h4>
<p>الـ DNA في الخلية الواحدة طوله حوالي 2 متر، ومع ذلك بيدخل في نواة قطرها كام ميكرومتر. ده بيحصل على مراحل:</p>
<ol>
<li>حوالي <b>146 زوج قاعدة</b> بيلفوا حوالين <b>8 بروتينات هستون</b> (histone octamer)، والوحدة دي اسمها <b>nucleosome</b>، وهي الوحدة الأساسية للكروماتين. الهستونات بروتينات <b>قاعدية</b> (موجبة الشحنة)، وده سبب إنها ماسكة جامد في الهيكل السالب بتاع الفوسفات.</li>
<li>سلاسل النيوكليوزومات بتلتف وتعمل <b>chromatin fibre</b>.</li>
<li>الليفة دي بتتضغط أكتر وتعمل تركيب منظم جدًا من DNA وبروتين اسمه <b>الكروموسوم</b>.</li>
</ol>
<p>الـ <b>gene</b> هو جزء من الـ DNA بيشفّر لبروتين معين. والـ DNA ليه خاصيتين أساسيتين: إنه <b>يتضاعف</b> (ينسخ نفسه)، وإنه <b>يشفّر للبروتينات</b> عن طريق الـ RNA.</p>

<h4>5. التضاعف نصف محافظ (semiconservative)</h4>
<p>كان فيه 3 نظريات لطريقة نسخ الـ DNA:</p>
<ul>
<li><b>Conservative</b>: الحلزون الأصلي يفضل زي ما هو، ويتعمل واحد جديد بالكامل.</li>
<li><b>Semiconservative</b>: الشريطين يتفصلوا، وكل واحد يبقى قالب، فكل جزيء جديد يبقى فيه <b>شريط قديم وشريط جديد</b>.</li>
<li><b>Dispersive</b>: القديم والجديد متلخبطين على شكل حتت على الشريطين.</li>
</ul>
<p>الصح هو <b>semiconservative</b>: في كل جزيء جديد، شريط واحد من الأصل بيتحفظ.</p>

<h4>6. خطوات التضاعف بالتفصيل</h4>
<h5>الخطوة 1: نقطة البداية (Origin of replication)</h5>
<p>التضاعف بيبدأ عند تسلسل معين اسمه <b>origin of replication</b>، وهو <b>consensus sequence</b> يعني ترتيب النيوكليوتيدات فيه تقريبًا ثابت في كل مكان. فيه أجزاء قصيرة <b>غنية بـ AT</b> بتتفك بسهولة لأن A=T ليها رابطتين بس. البكتيريا (prokaryotes) عندها <b>origin واحد</b>، والـ eukaryotes عندهم <b>origins كتير</b> لأن الجينوم كبير جدًا ولازم الشغل يخلص في وقته.</p>
<h5>الخطوة 2: فصل الشريطين (تكوين الـ replication fork)</h5>
<p>4 بروتينات بيشتغلوا مع بعض هنا، اعرفي شغل كل واحد:</p>
<ul>
<li><b>DnaA</b>: بيرتبط بالتسلسلات الغنية بـ AT عند الـ origin ويبدأ يفكها، ومحتاج <b>ATP</b>.</li>
<li><b>Helicase</b>: بيرتبط جنب الـ fork ويدخل في الحلزون ويفكه، ومحتاج <b>ATP</b> برضه.</li>
<li><b>SSB proteins</b>: بتغطي الشرايط المفردة المكشوفة، فتمنعهم يرجعوا يلزقوا وتحميهم من الـ nucleases.</li>
<li><b>Topoisomerase</b>: بيحل مشكلة ميكانيكية. لو فكيتي حبل ملفوف من حتة، الالتواء بيزيد في الحتة اللي قدامها. بنفس الطريقة، فك الـ DNA بيعمل <b>supercoils قدام الـ fork</b>، والـ topoisomerase بيشيلهم.</li>
</ul>
<h5>الخطوة 3: عمل الـ primer</h5>
<p>الـ DNA polymerase ما يقدرش يبدأ شريط من الصفر، لازم يضيف على 3'-OH موجود. فإنزيم <b>primase</b> بيحط الأول <b>RNA primer</b> قصير حوالي <b>10 نيوكليوتيدات</b>، وده بيدي نقطة البداية.</p>
<h5>الخطوة 4: الـ Leading strand</h5>
<p>الـ <b>DNA polymerase III</b> بيضيف dNTPs على الـ 3'-OH بتاع الـ primer. بيقرا الشريط الأصلي من <b>3' لـ 5'</b> ويبني الجديد من <b>5' لـ 3'</b>. على أحد القالبين الاتجاه ده رايح ناحية الـ fork، فالإنزيم بيمشي ورا الـ fork وهي بتتفتح. ده الـ <b>leading strand</b>: بيتعمل <b>بشكل مستمر</b> ومحتاج <b>primer واحد بس</b> في أوله.</p>
<h5>الخطوة 5: الـ Lagging strand</h5>
<p>القالب التاني اتجاهه عكس. وبما إن البناء لازم يكون من 5' لـ 3'، الشريط الجديد هنا بيكبر <b>بعيد عن الـ fork</b>. فالإنزيم لازم يرجع للـ fork كل ما جزء جديد يتكشف ويعمل حتت قصيرة اسمها <b>Okazaki fragments</b>، والشريط ده اسمه <b>lagging strand</b>. بيتعمل <b>بشكل متقطع</b>، وكل حتة محتاجة <b>primer خاص بيها</b>، فبيبقى فيه primers كتير.</p>
<h5>الخطوة 6: شيل الـ primers</h5>
<p>الـ Pol III بيفضل يبني لحد ما يخبط في الـ primer اللي بعده. وقتها <b>DNA polymerase I</b> بيشيل الـ RNA primer بنشاط الـ <b>5'→3' exonuclease</b>، ويملا الفراغ بـ DNA بنشاط الـ <b>5'→3' polymerase</b>.</p>
<h5>الخطوة 7: اللحام (Ligation)</h5>
<p>بيفضل فيه قطع صغير اسمه <b>nick</b> بين كل حتتين. إنزيم <b>DNA ligase</b> بيقفله بعمل رابطة phosphodiester بين الـ 3'-OH والـ 5'-phosphate، والطاقة بتيجي من تكسير <b>ATP لـ AMP + PPi</b>.</p>

<h4>7. التصحيح (Proofreading): ليه النسخ دقيق جدًا؟</h4>
<p>وهو بيبني، الـ Pol III بيراجع كل نيوكليوتيد ضافه. لو القاعدة غلط، بيرجع خطوة ويشيلها ويحط الصح. ده بيحصل بنشاط الـ <b>3'→5' exonuclease</b> واسمه <b>proofreading</b>.</p>
<div class="tblwrap"><table><tr><th>DNA polymerase III</th><th>DNA polymerase I</th></tr>
<tr><td>5'→3' polymerase: builds the new strand</td><td>5'→3' exonuclease: removes RNA primers</td></tr>
<tr><td>3'→5' exonuclease: proofreading</td><td>5'→3' polymerase: fills the gaps</td></tr>
<tr><td></td><td>3'→5' exonuclease: proofreading</td></tr></table></div>
<p>لاحظي إن الاتجاه بيقولك الوظيفة: الـ <b>5'→3' exonuclease</b> بياكل من قدام، وده اللي بيشيل الـ primers. الـ <b>3'→5' exonuclease</b> بياكل لورا من الطرف اللي بيكبر، وده اللي بيشيل الغلطة اللي لسه متضافة.</p>
<div class="pearl"><strong>سؤال المحاضرة (ترتيب الإنزيمات):</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase</div>
<div class="ex"><b>مناقشة من المحاضرة:</b> "الـ DNA polymerase III بيشتغل مع إنزيم primase". العبارة دي صح: الـ Pol III ما يقدرش يبدأ من غير الـ primer اللي بيعمله الـ primase، وعلى الـ lagging strand الـ primase لازم يشتغل تاني وتالت، مرة لكل Okazaki fragment.</div>

DEEP.genetics[2]={en:`
<p>Lecture 2 has two halves. The first finishes replication with a problem that only linear chromosomes have, the <b>end replication problem</b>, and the enzyme that solves it, <b>telomerase</b>. The second half starts the next step of gene expression: <b>transcription</b>, copying DNA into RNA.</p>

<h4>1. The end replication problem</h4>
<p>DNA polymerases have two limitations you already met in Lecture 1:</p>
<ol>
<li>They synthesise DNA <b>only in the 5'→3' direction</b>.</li>
<li>They <b>cannot start</b> a new chain; they need a primer with a free 3'-OH.</li>
</ol>
<p>Together these cause trouble at the very end of a <b>linear</b> chromosome, on the <b>lagging strand</b>. When the last RNA primer at the tip is removed, there is no upstream DNA with a 3'-OH that DNA polymerase I could extend to fill that gap. The extreme 3' end of the template is therefore never copied. Each round of replication loses a little DNA from the chromosome ends. If nothing stopped this, chromosomes would get shorter with every cell division until genes themselves were lost.</p>
<div class="pearl"><strong>Why bacteria don't have this problem:</strong> their chromosome is circular, so there is no "end" to lose.</div>

<h4>2. Telomeres: protective caps</h4>
<p>Linear eukaryotic chromosomes carry <b>telomeres</b> at both ends. Their functions:</p>
<ul>
<li>They act as a <b>cap</b> of DNA sequence at the chromosome tip.</li>
<li>They <b>separate chromosomes</b> from each other and stop them fusing end to end.</li>
<li>They protect the chromosome tips from <b>trimming and shortening</b>. Losing a few telomere repeats does no harm, because they don't code for anything.</li>
<li>Without telomeres, the cell suffers <b>genomic instability</b>.</li>
</ul>
<h5>Structure</h5>
<ul>
<li>Moderately repetitive <b>tandem repeats of TTAGGG</b> (TTAGGGTTAGGGTTAGGG…).</li>
<li>A single-stranded <b>3' overhang 12–16 nucleotides long</b>.</li>
<li>Humans have 46 chromosomes, each with two ends, so <b>92 telomeres</b>.</li>
</ul>

<h4>3. Telomerase: how the cell fixes it</h4>
<p>The cell adds new telomeric repeats onto the chromosome ends with the enzyme <b>telomerase</b>. Telomerase is made of <b>protein + RNA</b>. Its RNA is complementary to the telomere repeat, so it can base-pair with the last nucleotides of the 3' overhang and use itself as a template.</p>
<p>Telomerase has two special features:</p>
<ul>
<li>It carries its <b>own RNA sequence</b> (the template).</li>
<li>It works as a <b>reverse transcriptase</b>: it synthesises <b>DNA from an RNA template</b>, the reverse of normal transcription.</li>
</ul>
<p>It works in a repeating three-step cycle:</p>
<ol>
<li><b>Binding</b>: the telomerase RNA pairs with the end of the 3' overhang.</li>
<li><b>Polymerisation</b>: it copies its RNA template, adding a new TTAGGG repeat to the DNA 3' end.</li>
<li><b>Translocation</b>: it slides along to the new end and repeats.</li>
</ol>
<p>Once the overhang has been lengthened, primase and DNA polymerase can fill in the complementary strand in the normal way.</p>

<h4>4. Telomeres, ageing and cancer</h4>
<p>Most of our cells have <b>too little telomerase</b>, so telomeres shorten as cells divide: about <b>10,000 bp at birth</b> down to about <b>5,000 bp</b> late in life.</p>
<ul>
<li><b>Ageing</b>: short telomeres make cells age and can trigger apoptosis-mediated inflammation. Age-related telomerase dysregulation also causes <b>mitochondrial dysfunction</b> and more <b>oxidative stress</b>, independent of telomere length. The end result is tissue dysfunction and chronic disease with age.</li>
<li>High telomerase keeps telomeres long and <b>delays cellular ageing</b>.</li>
<li>Most normal cells divide rarely, so they don't need high telomerase.</li>
<li><b>Cancer cells</b> divide endlessly yet keep their telomeres, because they often have <b>high telomerase activity</b>. This makes telomerase a possible <b>drug target</b>. Studies are underway, including clinical trials of <b>vaccines against cells with high telomerase activity</b>.</li>
</ul>
<div class="ex"><b>Group activity logic:</b> if a diagram shows a cell line whose telomeres stay the same length over many divisions, expect <b>high telomerase</b> (for example, cancer or stem cells). If telomeres shorten each division, expect <b>low telomerase</b> (normal somatic cells).</div>
<p><b>Nobel Prize 2009</b> (Physiology or Medicine): Elizabeth Blackburn, Carol Greider and Jack Szostak, "for the discovery of how chromosomes are protected by telomeres and the enzyme telomerase."</p>

<h4>5. What transcription is</h4>
<p>"Transcription" literally means making a copy. In genetics it is <b>copying a DNA sequence into an RNA sequence</b>. The DNA is not changed by the process. For protein-coding genes, the enzyme is <b>RNA polymerase II</b> and the product is mRNA.</p>
<h5>Which strand is copied?</h5>
<ul>
<li>The <b>template (antisense) strand</b> is the one that is actually read. The RNA is <b>complementary</b> to it.</li>
<li>The <b>coding (sense) strand</b> is <b>not transcribed</b>, but its sequence is the <b>same as the mRNA</b>, just with T where the RNA has U.</li>
<li>RNA polymerase slides along the template <b>3'→5'</b> and builds RNA <b>5'→3'</b>, the same rule as DNA polymerase.</li>
<li>Which DNA strand serves as template <b>varies from gene to gene</b>.</li>
</ul>
<div class="ex"><b>Example:</b> template strand 3'-TACGGA-5'. The mRNA is 5'-AUGCCU-3', and the coding strand is 5'-ATGCCT-3'.</div>
<h5>Types of RNA transcript</h5>
<p>Over 90% of genes are <b>structural genes</b>: their transcript is <b>mRNA</b>, which is translated into a polypeptide. Transcripts from non-structural genes are not translated but still do important jobs, often as part of RNA–protein complexes such as <b>ribosomes</b>, <b>spliceosomes</b> and <b>signal recognition particles</b>.</p>
<h5>The three nuclear RNA polymerases</h5>
<div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr>
<tr><td>RNA pol I</td><td>All rRNA genes <b>except 5S rRNA</b></td></tr>
<tr><td>RNA pol II</td><td>All <b>structural genes</b> (so all mRNA) and some snRNA</td></tr>
<tr><td>RNA pol III</td><td>All <b>tRNA</b> genes and the <b>5S rRNA</b> gene</td></tr></table></div>

<h4>6. Key DNA elements for transcription</h4>
<ul>
<li><b>Promoter</b>: where RNA polymerase binds; it signals the <b>start</b>.</li>
<li><b>Terminator</b>: signals the <b>end</b>.</li>
<li><b>Regulatory sequences</b>: where regulatory proteins bind to control how much the gene is expressed.</li>
</ul>
<h5>Parts of a eukaryotic gene</h5>
<ol>
<li><b>Exons</b>: coding sequences that end up in the mRNA and join together to code the correct amino acids.</li>
<li><b>Introns</b>: non-coding sequences between exons. All introns start with <b>GT</b> at their 5' end and end with <b>AG</b> at their 3' end. These are the signals the splicing machinery recognises (Lecture 3).</li>
<li><b>Promoter</b> (upstream) with two consensus sequences:
<ul><li><b>TATA box</b>: usually about <b>15–30 bp upstream</b> of the start site. <b>Transcription factors</b> bind here and help RNA polymerase II bind.</li>
<li><b>CAAT box</b>: sets <b>how often</b> transcription starts. Mutations here cut transcription starts <b>10–20 fold</b>.</li></ul></li>
<li><b>Enhancers and silencers</b>: regulatory sequences that can be upstream or downstream, near or far from the gene. <b>Activators</b> bind enhancers and <b>increase</b> the rate; <b>repressors</b> bind silencers and <b>reduce</b> it.</li>
<li><b>Upstream</b> non-coding region (5' side): where the <b>cap</b> will be added.</li>
<li><b>Downstream</b> non-coding region (3' side): where the <b>poly-A tail</b> will be added.</li>
<li><b>Terminator</b> sequences.</li>
</ol>
<h5>Cis versus trans</h5>
<ul>
<li><b>Cis-acting elements</b> are <b>DNA sequences</b> that affect only nearby genes on the same molecule: TATA box, enhancers, silencers.</li>
<li><b>Trans-acting elements</b> are <b>proteins</b> (made from other genes) that bind those sequences.</li>
</ul>
<div class="pearl"><strong>Memory hook:</strong> cis = the "site" on the DNA; trans = the "travelling" protein that comes to it.</div>

<h4>7. The three stages of transcription</h4>
<h5>Initiation</h5>
<p>Basal transcription needs three groups of proteins: <b>RNA polymerase II</b>, five <b>general transcription factors</b> (GTFs), and a complex called <b>mediator</b>. Together with the promoter they form the <b>initiation complex</b>.</p>
<ul>
<li><b>TFIID</b> = TBP (TATA-binding protein) + TAFs (TBP-associated factors). It <b>recognises the core promoter</b>.</li>
<li><b>TFIIB</b> binds TFIID and acts as a <b>bridge</b> to bring in RNA polymerase II.</li>
<li><b>TFIIF</b> travels together with RNA polymerase II.</li>
<li><b>TFIIH</b> turns the <b>closed complex</b> into an <b>open complex</b>. Some of its subunits are <b>helicases</b> that unwind the DNA. Another subunit hydrolyses ATP and <b>phosphorylates the carboxyl-terminal domain (CTD)</b> of RNA pol II, which breaks its contact with TFIIB and frees it to move.</li>
<li><b>TFIIE</b> helps the <b>transition from initiation to elongation</b>.</li>
</ul>
<p>Most of these factors are released once the open complex forms, and RNA pol II proceeds to elongation.</p>
<h5>Elongation</h5>
<p>RNA polymerase II moves downstream, unwinding <b>10–20 bases at a time</b> so ribonucleotides can pair with the exposed template.</p>
<h5>Termination</h5>
<p>Pol II transcribes a sequence that gives the <b>poly-A signal AAUAAA</b> in the pre-mRNA. About <b>10–35 nucleotides downstream</b> of that signal, proteins cut the RNA free. Pol II keeps going for a few hundred more nucleotides and then detaches from the DNA.</p>
<div class="pearl"><strong>Exam favourite:</strong> TFIIH = helicase + phosphorylates the CTD. TFIID = recognises the promoter (TBP binds the TATA box). TFIIB = bridge to pol II.</div>

<p>المحاضرة دي نصّين. النص الأول بيكمّل التضاعف بمشكلة موجودة بس في الكروموسومات الخطية، اسمها <b>end replication problem</b>، والإنزيم اللي بيحلها: <b>telomerase</b>. والنص التاني بيبدأ الخطوة اللي بعد كده في التعبير الجيني: <b>النسخ (transcription)</b>، يعني نسخ الـ DNA لـ RNA.</p>

<h4>1. مشكلة نهاية التضاعف</h4>
<p>الـ DNA polymerase عنده عيبين شفناهم في محاضرة 1:</p>
<ol>
<li>بيبني <b>من 5' لـ 3' بس</b>.</li>
<li><b>ما يقدرش يبدأ</b> سلسلة جديدة، لازم primer فيه 3'-OH حر.</li>
</ol>
<p>العيبين دول مع بعض بيعملوا مشكلة في آخر طرف الكروموسوم <b>الخطي</b>، على الـ <b>lagging strand</b>. لما آخر RNA primer عند الطرف يتشال، مفيش DNA قبله فيه 3'-OH يقدر الـ Pol I يكمّل منه ويملا الفراغ. فآخر جزء عند الطرف 3' عمره ما بيتنسخ، وكل دورة تضاعف بنخسر حتة صغيرة من أطراف الكروموسوم. لو مفيش حاجة وقفت ده، الكروموسومات هتقصر مع كل انقسام لحد ما الجينات نفسها تضيع.</p>
<div class="pearl"><strong>ليه البكتيريا ما عندهاش المشكلة دي؟</strong> لأن الكروموسوم بتاعها دائري، فمفيش "طرف" يضيع.</div>

<h4>2. الـ Telomeres: غطا الحماية</h4>
<p>الكروموسومات الخطية في الـ eukaryotes عندها <b>تيلوميرات</b> في الطرفين. وظايفها:</p>
<ul>
<li>بتعمل <b>غطا</b> من تسلسل DNA على طرف الكروموسوم.</li>
<li>بتفصل الكروموسومات عن بعض وبتمنعها <b>تلزق في بعض</b> من الأطراف.</li>
<li>بتحمي أطراف الكروموسوم من <b>القص والقِصَر</b>. لو ضاع كام تكرار من التيلومير مش مشكلة، لأنها مش بتشفّر لحاجة.</li>
<li>من غيرها الخلية بيحصل فيها <b>genomic instability</b> (عدم استقرار الجينوم).</li>
</ul>
<h5>التركيب</h5>
<ul>
<li>تكرارات ورا بعض من <b>TTAGGG</b>.</li>
<li>طرف مفرد بارز عند <b>3' طوله 12–16 نيوكليوتيد</b>.</li>
<li>الإنسان عنده 46 كروموسوم، لكل واحد طرفين، يعني <b>92 تيلومير</b>.</li>
</ul>

<h4>3. الـ Telomerase: الخلية بتحل المشكلة إزاي</h4>
<p>الخلية بتضيف تكرارات جديدة على أطراف الكروموسوم بإنزيم <b>telomerase</b>. الإنزيم ده مكوَّن من <b>بروتين + RNA</b>. الـ RNA بتاعه مكمّل لتكرار التيلومير، فيقدر يتزاوج مع آخر نيوكليوتيدات في الطرف 3' البارز ويستخدم نفسه كقالب.</p>
<p>ليه ميزتين خاصين:</p>
<ul>
<li>شايل <b>RNA خاص بيه</b> (القالب).</li>
<li>بيشتغل كـ <b>reverse transcriptase</b>: يعني بيعمل <b>DNA من قالب RNA</b>، عكس النسخ العادي.</li>
</ul>
<p>وبيشتغل في دورة من 3 خطوات بتتكرر:</p>
<ol>
<li><b>Binding</b>: الـ RNA بتاع الإنزيم يتزاوج مع آخر الطرف البارز.</li>
<li><b>Polymerization</b>: ينسخ القالب ويضيف تكرار TTAGGG جديد على طرف 3'.</li>
<li><b>Translocation</b>: يتزحلق للطرف الجديد ويعيد تاني.</li>
</ol>
<p>بعد ما الطرف البارز يطول، الـ primase والـ DNA polymerase يقدروا يملوا الشريط المكمّل بالطريقة العادية.</p>

<h4>4. التيلوميرات والشيخوخة والسرطان</h4>
<p>معظم خلايانا فيها <b>تيلوميراز قليل</b>، فالتيلوميرات بتقصر مع الانقسام: حوالي <b>10,000 bp عند الولادة</b> لحد حوالي <b>5,000 bp</b> في آخر العمر.</p>
<ul>
<li><b>الشيخوخة</b>: التيلوميرات القصيرة بتخلي الخلايا تعجّز وممكن تعمل التهاب عن طريق الـ apoptosis. كمان اضطراب التيلوميراز مع السن بيعمل <b>خلل في الميتوكوندريا</b> و<b>oxidative stress</b> أكتر، بغض النظر عن طول التيلومير. والنتيجة خلل في الأنسجة وأمراض مزمنة مع السن.</li>
<li>التيلوميراز العالي بيحافظ على طول التيلوميرات وبيأخّر شيخوخة الخلية.</li>
<li>معظم الخلايا العادية نادرًا ما بتنقسم، فمش محتاجة تيلوميراز عالي.</li>
<li><b>الخلايا السرطانية</b> بتنقسم من غير نهاية ومع ذلك محافظة على تيلوميراتها، لأن غالبًا التيلوميراز فيها <b>عالي</b>. عشان كده التيلوميراز ممكن يبقى <b>هدف للأدوية</b>، وفيه دراسات شغالة منها تجارب إكلينيكية لـ <b>لقاحات ضد الخلايا اللي فيها تيلوميراز عالي</b>.</li>
</ul>
<div class="ex"><b>منطق النشاط الجماعي:</b> لو الرسمة بتوضح خلايا التيلوميرات فيها ثابتة الطول على انقسامات كتير، توقّعي <b>تيلوميراز عالي</b> (زي السرطان أو الخلايا الجذعية). ولو بتقصر مع كل انقسام، يبقى <b>تيلوميراز قليل</b> (خلايا جسدية عادية).</div>
<p><b>نوبل 2009</b>: Elizabeth Blackburn و Carol Greider و Jack Szostak، لاكتشاف إزاي التيلوميرات وإنزيم التيلوميراز بيحموا الكروموسومات.</p>

<h4>5. يعني إيه Transcription؟</h4>
<p>الكلمة معناها "عمل نسخة". في الجينات معناها <b>نسخ تسلسل DNA لتسلسل RNA</b>، والـ DNA نفسه ما بيتغيرش. في الجينات اللي بتشفّر لبروتين، الإنزيم هو <b>RNA polymerase II</b> والناتج mRNA.</p>
<h5>أنهي شريط بيتنسخ؟</h5>
<ul>
<li>الـ <b>template (antisense) strand</b> هو اللي بيتقري فعلًا، والـ RNA <b>مكمّل</b> ليه.</li>
<li>الـ <b>coding (sense) strand</b> <b>مش بيتنسخ</b>، بس تسلسله <b>زي الـ mRNA بالظبط</b> ما عدا إن فيه T مكان U.</li>
<li>الـ RNA polymerase بيتزحلق على القالب من <b>3' لـ 5'</b> ويبني الـ RNA من <b>5' لـ 3'</b>، نفس قاعدة الـ DNA polymerase.</li>
<li>أنهي شريط يبقى القالب ده <b>بيختلف من جين للتاني</b>.</li>
</ul>
<div class="ex"><b>مثال:</b> الـ template: <bdi>3'-TACGGA-5'</bdi>، يبقى الـ mRNA: <bdi>5'-AUGCCU-3'</bdi>، والـ coding strand: <bdi>5'-ATGCCT-3'</bdi>.</div>
<h5>أنواع الـ RNA الناتج</h5>
<p>أكتر من 90% من الجينات <b>structural genes</b>: ناتجها <b>mRNA</b> بيتترجم لسلسلة ببتيد. الجينات التانية ناتجها مش بيتترجم بس ليه وظايف مهمة، غالبًا جزء من مركّبات RNA وبروتين زي <b>الريبوسومات</b> و<b>الـ spliceosomes</b> و<b>signal recognition particles</b>.</p>
<h5>إنزيمات الـ RNA polymerase التلاتة في النواة</h5>
<div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr>
<tr><td>RNA pol I</td><td>All rRNA genes except 5S rRNA</td></tr>
<tr><td>RNA pol II</td><td>All structural genes (all mRNA) and some snRNA</td></tr>
<tr><td>RNA pol III</td><td>All tRNA genes and the 5S rRNA gene</td></tr></table></div>

<h4>6. عناصر الـ DNA المهمة في النسخ</h4>
<ul>
<li><b>Promoter</b>: مكان ارتباط الـ RNA polymerase، وبيدي إشارة <b>البداية</b>.</li>
<li><b>Terminator</b>: إشارة <b>النهاية</b>.</li>
<li><b>Regulatory sequences</b>: أماكن ارتباط البروتينات المنظِّمة اللي بتتحكم في كمية التعبير.</li>
</ul>
<h5>أجزاء الجين في الـ eukaryotes</h5>
<ol>
<li><b>Exons</b>: تسلسلات بتشفّر، بتوصل للـ mRNA وبتتوصل ببعض عشان تدي الأحماض الأمينية الصح.</li>
<li><b>Introns</b>: تسلسلات مش بتشفّر بين الـ exons. كل الـ introns بتبدأ بـ <b>GT</b> عند 5' وبتنتهي بـ <b>AG</b> عند 3'، ودي الإشارات اللي ماكينة الـ splicing بتتعرف عليها (محاضرة 3).</li>
<li><b>Promoter</b> (قبل الجين) وفيه تسلسلين ثابتين:
<ul><li><b>TATA box</b>: غالبًا على بعد <b>15–30 bp قبل</b> نقطة البداية. الـ <b>transcription factors</b> بترتبط هنا وبتساعد الـ RNA pol II يرتبط.</li>
<li><b>CAAT box</b>: بيحدد <b>بيبدأ النسخ قد إيه</b>. الطفرات فيه بتقلل مرات البداية <b>10–20 مرة</b>.</li></ul></li>
<li><b>Enhancers و silencers</b>: تسلسلات تنظيمية ممكن تكون قبل أو بعد الجين، قريبة أو بعيدة. الـ <b>activators</b> بترتبط بالـ enhancers و<b>بتزوّد</b> المعدل، والـ <b>repressors</b> بترتبط بالـ silencers و<b>بتقلله</b>.</li>
<li>منطقة <b>upstream</b> (ناحية 5'): مكان إضافة الـ <b>cap</b>.</li>
<li>منطقة <b>downstream</b> (ناحية 3'): مكان إضافة الـ <b>poly-A tail</b>.</li>
<li>تسلسلات الـ <b>terminator</b>.</li>
</ol>
<h5>Cis مقابل Trans</h5>
<ul>
<li><b>Cis-acting elements</b> = <b>تسلسلات DNA</b> بتأثر بس على الجينات القريبة على نفس الجزيء: TATA box و enhancers و silencers.</li>
<li><b>Trans-acting elements</b> = <b>بروتينات</b> (جاية من جينات تانية) بترتبط بالتسلسلات دي.</li>
</ul>
<div class="pearl"><strong>طريقة للحفظ:</strong> cis = "المكان" على الـ DNA، و trans = البروتين "اللي بيسافر" ويجيله.</div>

<h4>7. مراحل النسخ التلاتة</h4>
<h5>البداية (Initiation)</h5>
<p>النسخ الأساسي محتاج 3 مجموعات بروتين: <b>RNA polymerase II</b>، و5 <b>general transcription factors</b>، ومركّب اسمه <b>mediator</b>. ومع الـ promoter بيعملوا الـ <b>initiation complex</b>.</p>
<ul>
<li><b>TFIID</b> = TBP (البروتين اللي بيرتبط بالـ TATA box) + TAFs. وظيفته <b>يتعرف على الـ promoter</b>.</li>
<li><b>TFIIB</b> بيرتبط بـ TFIID وبيعمل <b>كوبري</b> يجيب الـ RNA pol II.</li>
<li><b>TFIIF</b> بيكون ماشي مع الـ RNA pol II.</li>
<li><b>TFIIH</b> بيحوّل الـ <b>closed complex</b> لـ <b>open complex</b>: بعض أجزائه <b>helicases</b> بتفك الـ DNA، وجزء تاني بيكسر ATP ويعمل <b>phosphorylation للـ CTD</b> بتاع الـ pol II، فيفك ارتباطه بـ TFIIB ويخليه حر يتحرك.</li>
<li><b>TFIIE</b> بيساعد في <b>الانتقال من البداية للاستطالة</b>.</li>
</ul>
<p>معظم العوامل دي بتتساب بعد ما الـ open complex يتكوّن، والـ pol II يكمّل للاستطالة.</p>
<h5>الاستطالة (Elongation)</h5>
<p>الـ pol II بيتحرك لقدام وبيفك <b>10–20 قاعدة كل مرة</b> عشان الـ ribonucleotides تتزاوج مع القالب المكشوف.</p>
<h5>النهاية (Termination)</h5>
<p>الـ pol II بينسخ تسلسل بيدي <b>إشارة الـ poly-A: AAUAAA</b> في الـ pre-mRNA. وبعدها بحوالي <b>10–35 نيوكليوتيد</b> بروتينات بتقطع الـ RNA وتحرره. الـ pol II بيكمّل كام مية نيوكليوتيد كمان وبعدين يسيب الـ DNA.</p>
<div class="pearl"><strong>بيتسأل كتير:</strong> TFIIH = helicase + فسفرة الـ CTD. TFIID = التعرف على الـ promoter (الـ TBP بيرتبط بالـ TATA box). TFIIB = الكوبري للـ pol II.</div>

<p>Lecture 3 follows the RNA after it is made. First, the chromatin must open so the gene can be transcribed at all. Then the new pre-mRNA is <b>processed</b> (spliced, capped, tailed) before it leaves the nucleus. Finally it is <b>translated</b> into protein. The big picture is the flow of genetic information: <b>DNA → (transcription) → RNA → (translation) → protein</b>. Proteins are the link between <b>genotype</b> (the DNA you inherit) and <b>phenotype</b> (the traits you show): hormones, antibodies, enzymes, muscle, cartilage and more.</p>

<h4>1. Chromatin structure controls access to genes</h4>
<p>When histones grip DNA tightly, RNA polymerase can't reach the promoter, so the gene stays silent. One job of <b>enhancers</b> is to loosen this grip. Changing nucleosome structure like this is called <b>chromatin remodeling</b>.</p>
<h5>How histone acetylation opens chromatin</h5>
<ol>
<li>An <b>activator protein</b> binds a specific enhancer.</li>
<li>It recruits <b>histone acetyltransferase (HAT)</b> to the same place.</li>
<li>HAT adds acetyl groups to the amino groups of lysines on the histones.</li>
<li>This <b>lowers the histones' basicity</b> (removes positive charge), so they hold the negatively charged DNA less tightly.</li>
<li>DNA and histones separate, the <b>promoter is exposed</b>, and RNA polymerase can bind.</li>
</ol>
<p>To switch the gene off again, <b>histone deacetylase (HDAC)</b> removes the acetyl groups and the tight nucleosome structure returns.</p>
<div class="pearl"><strong>Rule:</strong> acetylation = open = ON. Deacetylation = closed = OFF.</div>

<h4>2. Post-transcriptional modification</h4>
<p>The first transcript of a eukaryotic structural gene is long and unfinished. It is called <b>pre-mRNA</b> or <b>heterogeneous nuclear RNA (hnRNA)</b>. Before leaving the nucleus it is modified in two groups of ways: (1) <b>splicing</b>, and (2) <b>editing, trimming, capping and tailing</b>.</p>
<h5>Splicing</h5>
<p>The coding sequences (<b>exons</b>) are interrupted by non-coding <b>introns</b>. Splicing <b>removes the introns</b> and <b>joins the exons</b> with phosphodiester bonds. There are three mechanisms:</p>
<ul>
<li>the <b>spliceosome</b> (used for pre-mRNA);</li>
<li><b>group I self-splicing</b> introns;</li>
<li><b>group II self-splicing</b> introns (the RNA itself catalyses its own splicing).</li>
</ul>
<p>Splicing is common in eukaryotic structural genes, but it also happens in some rRNA and tRNA genes and a few bacterial genes.</p>
<h5>The spliceosome</h5>
<p>The spliceosome is a large complex built from subunits called <b>snRNPs ("snurps")</b>. Each snRNP is <b>small nuclear RNA + proteins</b>. Its subunits do three jobs:</p>
<ol>
<li>bind the intron and <b>precisely recognise the intron–exon boundaries</b> (remember introns start GT and end AG in DNA, GU…AG in RNA);</li>
<li><b>hold the pre-mRNA</b> in the correct shape;</li>
<li><b>catalyse the reactions</b> that cut out the intron and link the exons covalently. The free 3'-OH of exon 1 attacks and joins to exon 2.</li>
</ol>
<h5>Why introns are useful: alternative splicing</h5>
<p>A pre-mRNA with several introns can be spliced in <b>different ways</b>, keeping different combinations of exons. This can differ between <b>cell types</b> or <b>stages of development</b>. So <b>one gene can make two or more different polypeptides</b>, which means an organism needs fewer genes. Also, proteins are often built from separate <b>domains</b>, and different exons often code for different domains. Shuffling exons during evolution (<b>exon shuffling</b>) can create new proteins.</p>
<h5>Trimming and editing</h5>
<ul>
<li><b>Trimming</b>: many non-structural genes (rRNA, tRNA) are first transcribed as one large RNA, which is then <b>cut enzymatically</b> into smaller functional pieces.</li>
<li><b>Editing and base modification</b> happen in tRNA transcripts.</li>
</ul>
<h5>The 5' cap</h5>
<p>Most mature eukaryotic mRNAs carry a <b>7-methylguanosine</b> covalently attached at the 5' end. It is added <b>while pol II is still transcribing</b>, when the transcript is only <b>20–25 bases long</b>. Cap-binding proteins recognise it. The cap:</p>
<ul>
<li>helps <b>move the mRNA out to the cytoplasm</b>;</li>
<li>is needed for the <b>early stages of translation</b> (it is the ribosome's binding site);</li>
<li><b>protects the RNA from nucleases</b>;</li>
<li>helps with <b>splicing</b> of introns.</li>
</ul>
<h5>The 3' poly-A tail</h5>
<p>Most mature mRNAs end in a string of adenines: the <b>poly-A tail</b>. It is <b>not encoded in the gene</b>; an enzyme adds it <b>after transcription is complete</b> (after the cut downstream of the AAUAAA signal). Its length varies between species, from a few dozen to several hundred A's. It is important for <b>mRNA stability</b> and for <b>translation</b>.</p>

<h4>3. Translation: the molecules involved</h4>
<p>Translation is the <b>RNA-directed synthesis of a polypeptide</b>. It uses three kinds of RNA: <b>mRNA</b> (the message), <b>tRNA</b> (the adaptor) and <b>rRNA</b> (inside the ribosome).</p>
<h5>tRNA</h5>
<ul>
<li>A single RNA strand only about <b>80 nucleotides</b> long. Internal hydrogen bonds fold it into a roughly <b>L-shaped</b> 3D molecule.</li>
<li>One end carries a <b>specific amino acid</b>; the other end has the <b>anticodon</b>, which base-pairs with a complementary <b>codon</b> on the mRNA.</li>
</ul>
<h5>Accurate translation needs two correct matches</h5>
<ol>
<li><b>tRNA ↔ amino acid</b>: the enzyme <b>aminoacyl-tRNA synthetase</b> attaches the right amino acid to the right tRNA, using ATP (ATP → AMP + PPi). The product is an <b>aminoacyl-tRNA</b>, also called a "charged tRNA".</li>
<li><b>anticodon ↔ codon</b>: the tRNA anticodon must pair with the mRNA codon.</li>
</ol>
<p><b>Wobble</b>: pairing is flexible at the <b>third base of the codon only</b>; the first two must match exactly. At the wobble position <b>G can pair with C or U</b> (and so U can pair with A or G). This lets one tRNA read more than one codon.</p>
<h5>The ribosome</h5>
<ul>
<li>Two subunits, large and small, made of <b>rRNA (40%) and protein (60%)</b>. In eukaryotes: small <b>40S</b> and large <b>60S</b>.</li>
<li>It couples tRNA anticodons to mRNA codons.</li>
<li>Three tRNA binding sites, spanning both subunits:
<ul><li><b>A site</b> (aminoacyl): accepts the incoming tRNA that matches the codon sitting there;</li>
<li><b>P site</b> (peptidyl): holds the tRNA carrying the growing chain;</li>
<li><b>E site</b> (exit): the empty tRNA about to leave.</li></ul></li>
<li>The growing polypeptide leaves through an <b>exit tunnel</b> in the large subunit.</li>
</ul>

<h4>4. The three stages of translation</h4>
<p>All three stages need helper protein <b>factors</b> (initiation, elongation and release factors).</p>
<h5>Initiation</h5>
<p>The start codon <b>5'-AUG</b> must be found. It codes for <b>methionine</b>, which is nearly always the first amino acid. The <b>small 40S subunit binds at the 5' cap</b> and scans to AUG; initiation factors then bring in the <b>large 60S subunit</b> to complete the initiation complex. The initiator Met-tRNA sits in the P site.</p>
<h5>Elongation: a three-step cycle</h5>
<ol>
<li><b>Codon recognition</b>: the aminoacyl-tRNA complementary to the next codon binds the <b>A site</b>. This uses energy from <b>GTP</b> hydrolysis.</li>
<li><b>Peptide bond formation</b>: the chain in the P site is transferred onto the amino acid in the A site and joined by a peptide bond. The tRNA in the P site is now empty.</li>
<li><b>Translocation</b>: the ribosome moves one codon along the mRNA, again using <b>GTP</b>. The chain-carrying tRNA is now in the P site, the empty tRNA leaves from the E site, and the A site is free for the next aminoacyl-tRNA.</li>
</ol>
<p>The chain grows from the <b>N-terminus</b> (methionine) to the <b>C-terminus</b> (the last amino acid).</p>
<h5>Termination</h5>
<p>When one of the three <b>stop codons</b> enters the A site, no tRNA binds it. Instead the bond between the polypeptide and the tRNA in the P site is <b>hydrolysed</b> (a water molecule is added), releasing the polypeptide into the cytoplasm. The two subunits separate, ready for another round.</p>
<h5>Polyribosomes</h5>
<p>Several ribosomes can translate the same mRNA at once, one behind another. This is a <b>polyribosome (polysome)</b>, and it lets the cell make many copies of a protein very quickly.</p>
<div class="pearl"><strong>Quick check:</strong> GTP is used twice per cycle (codon recognition and translocation). ATP is used by aminoacyl-tRNA synthetase to charge the tRNA.</div>

<p>المحاضرة دي بتتابع الـ RNA بعد ما يتعمل. الأول لازم الكروماتين يتفتح عشان الجين يتنسخ أصلًا. بعدين الـ pre-mRNA الجديد بيتـ<b>عالج</b> (splicing و cap و tail) قبل ما يخرج من النواة. وفي الآخر بيتـ<b>ترجم</b> لبروتين. الصورة الكبيرة هي سريان المعلومة الوراثية: <b>DNA ← (نسخ) ← RNA ← (ترجمة) ← بروتين</b>. البروتينات هي الرابط بين الـ <b>genotype</b> (الـ DNA اللي ورثتيه) والـ <b>phenotype</b> (الصفات اللي بتظهر): هرمونات، أجسام مضادة، إنزيمات، عضلات، غضاريف وغيرها.</p>

<h4>1. شكل الكروماتين بيتحكم في الوصول للجين</h4>
<p>لما الهستونات تكون ماسكة الـ DNA جامد، الـ RNA polymerase ما يقدرش يوصل للـ promoter، فالجين يفضل ساكت. من وظايف الـ <b>enhancers</b> إنها تفك المسكة دي. تغيير تركيب الـ nucleosome بالشكل ده اسمه <b>chromatin remodeling</b>.</p>
<h5>الـ acetylation بيفتح الكروماتين إزاي؟</h5>
<ol>
<li>بروتين <b>activator</b> بيرتبط بـ enhancer معين.</li>
<li>بيجيب إنزيم <b>histone acetyltransferase (HAT)</b> لنفس المكان.</li>
<li>الـ HAT بيضيف مجموعات acetyl على مجموعات الأمين في الليسين بتاع الهستونات.</li>
<li>ده <b>بيقلل قاعدية الهستونات</b> (بيشيل الشحنة الموجبة)، فمسكتها للـ DNA السالب تضعف.</li>
<li>الـ DNA يبعد عن الهستونات، والـ <b>promoter يتكشف</b>، والـ RNA polymerase يقدر يرتبط.</li>
</ol>
<p>ولما نحب نطفي الجين تاني، إنزيم <b>histone deacetylase (HDAC)</b> بيشيل الـ acetyl والـ nucleosome يرجع يتقفل.</p>
<div class="pearl"><strong>القاعدة:</strong> acetylation = مفتوح = شغال. deacetylation = مقفول = مطفي.</div>

<h4>2. التعديلات بعد النسخ</h4>
<p>أول ناتج من الجين في الـ eukaryotes بيكون طويل ومش جاهز، واسمه <b>pre-mRNA</b> أو <b>hnRNA</b>. قبل ما يخرج من النواة بيتعدل بطريقتين: (1) <b>splicing</b>، و(2) <b>editing و trimming و capping و tailing</b>.</p>
<h5>الـ Splicing</h5>
<p>الأجزاء اللي بتشفّر (<b>exons</b>) بيقطعها أجزاء مش بتشفّر (<b>introns</b>). الـ splicing بيـ<b>شيل الـ introns</b> و<b>يوصّل الـ exons</b> بروابط phosphodiester. فيه 3 آليات:</p>
<ul>
<li>الـ <b>spliceosome</b> (للـ pre-mRNA)؛</li>
<li><b>group I self-splicing</b>؛</li>
<li><b>group II self-splicing</b> (الـ RNA نفسه بيعمل الـ splicing لنفسه).</li>
</ul>
<p>الـ splicing شائع في الجينات اللي بتشفّر لبروتين في الـ eukaryotes، بس بيحصل كمان في بعض جينات الـ rRNA والـ tRNA وشوية جينات بكتيرية.</p>
<h5>الـ Spliceosome</h5>
<p>مركّب كبير مكوَّن من وحدات اسمها <b>snRNPs (snurps)</b>، وكل واحدة = <b>small nuclear RNA + بروتينات</b>. وحداته بتعمل 3 حاجات:</p>
<ol>
<li>ترتبط بالـ intron و<b>تحدد حدود الـ intron والـ exon بدقة</b> (افتكري الـ intron بيبدأ GT وينتهي AG في الـ DNA، يعني GU…AG في الـ RNA)؛</li>
<li><b>تمسك الـ pre-mRNA</b> في الشكل الصح؛</li>
<li><b>تعمل التفاعلات</b> اللي بتقص الـ intron وتوصّل الـ exons. الـ 3'-OH الحر بتاع exon 1 بيهاجم ويرتبط بـ exon 2.</li>
</ol>
<h5>فايدة الـ introns: الـ Alternative splicing</h5>
<p>الـ pre-mRNA اللي فيه كذا intron ممكن يتعمله splicing <b>بطرق مختلفة</b>، فنحتفظ بتوليفات مختلفة من الـ exons. ده ممكن يختلف من <b>نوع خلية لنوع</b> أو من <b>مرحلة نمو لمرحلة</b>. يعني <b>جين واحد يدي بروتينين أو أكتر</b>، والكائن يحتاج جينات أقل. كمان البروتينات غالبًا متقسمة <b>domains</b>، وكل exon غالبًا بيشفّر لـ domain. وخلط الـ exons على مدار التطور (<b>exon shuffling</b>) ممكن يطلّع بروتينات جديدة.</p>
<h5>الـ Trimming والـ Editing</h5>
<ul>
<li><b>Trimming</b>: جينات كتير مش بتشفّر لبروتين (rRNA و tRNA) بتتنسخ الأول RNA واحد كبير، وبعدين <b>بيتقطع بإنزيمات</b> لحتت أصغر شغالة.</li>
<li><b>Editing وتعديل القواعد</b> بيحصل في الـ tRNA.</li>
</ul>
<h5>الـ 5' cap</h5>
<p>معظم الـ mRNA الناضج عنده <b>7-methylguanosine</b> مربوط بالطرف 5'. بيتضاف <b>والـ pol II لسه بينسخ</b>، لما يكون طول الناتج <b>20–25 قاعدة</b> بس. بروتينات اسمها cap-binding proteins بتتعرف عليه. وظايف الـ cap:</p>
<ul>
<li>يساعد الـ mRNA <b>يخرج للسيتوبلازم</b>؛</li>
<li>مهم في <b>أول مراحل الترجمة</b> (مكان ارتباط الريبوسوم)؛</li>
<li><b>يحمي الـ RNA من الـ nucleases</b>؛</li>
<li>يساعد في <b>الـ splicing</b>.</li>
</ul>
<h5>الـ Poly-A tail عند 3'</h5>
<p>معظم الـ mRNA الناضج بينتهي بسلسلة A اسمها <b>poly-A tail</b>. هي <b>مش موجودة في الجين</b>، إنزيم بيضيفها <b>بعد ما النسخ يخلص</b> (بعد القطع اللي بعد إشارة AAUAAA). طولها بيختلف من كائن للتاني، من كام عشرة لكام مية A. وهي مهمة لـ <b>ثبات الـ mRNA</b> ولـ <b>الترجمة</b>.</p>

<h4>3. الترجمة: الجزيئات المشاركة</h4>
<p>الترجمة هي <b>تصنيع سلسلة ببتيد بتوجيه من الـ RNA</b>، وبتستخدم 3 أنواع RNA: <b>mRNA</b> (الرسالة)، <b>tRNA</b> (الوسيط)، و<b>rRNA</b> (جوه الريبوسوم).</p>
<h5>الـ tRNA</h5>
<ul>
<li>شريط RNA واحد طوله حوالي <b>80 نيوكليوتيد</b> بس. الروابط الهيدروجينية جواه بتطبّقه لشكل <b>حرف L</b> تقريبًا.</li>
<li>طرف شايل <b>حمض أميني معين</b>، والطرف التاني فيه الـ <b>anticodon</b> اللي بيتزاوج مع الـ <b>codon</b> المكمّل على الـ mRNA.</li>
</ul>
<h5>الترجمة الدقيقة محتاجة تطابقين صح</h5>
<ol>
<li><b>tRNA مع الحمض الأميني</b>: إنزيم <b>aminoacyl-tRNA synthetase</b> بيربط الحمض الأميني الصح بالـ tRNA الصح، وبيستخدم ATP (ATP → AMP + PPi). الناتج اسمه <b>aminoacyl-tRNA</b> أو "charged tRNA".</li>
<li><b>anticodon مع codon</b>: الـ anticodon لازم يتزاوج مع الكودون على الـ mRNA.</li>
</ol>
<p><b>Wobble</b>: التزاوج بيبقى مرن في <b>القاعدة التالتة من الكودون بس</b>، وأول اتنين لازم يتطابقوا بالظبط. في مكان الـ wobble، <b>G ممكن تتزاوج مع C أو U</b> (وبالتالي U مع A أو G). وده بيخلي tRNA واحد يقرا أكتر من كودون.</p>
<h5>الريبوسوم</h5>
<ul>
<li>وحدتين كبيرة وصغيرة، مكوّنين من <b>rRNA (40%) وبروتين (60%)</b>. في الـ eukaryotes: الصغيرة <b>40S</b> والكبيرة <b>60S</b>.</li>
<li>وظيفته يربط الـ anticodon بالـ codon.</li>
<li>فيه 3 أماكن للـ tRNA، ممتدة على الوحدتين:
<ul><li><b>A site</b>: بيستقبل الـ tRNA الجديد اللي بيطابق الكودون اللي واقف فيه؛</li>
<li><b>P site</b>: فيه الـ tRNA الشايل السلسلة اللي بتكبر؛</li>
<li><b>E site</b>: الـ tRNA الفاضي اللي خارج.</li></ul></li>
<li>السلسلة اللي بتكبر بتطلع من <b>exit tunnel</b> في الوحدة الكبيرة.</li>
</ul>

<h4>4. مراحل الترجمة التلاتة</h4>
<p>المراحل التلاتة محتاجة <b>factors</b> بروتينية مساعدة.</p>
<h5>البداية (Initiation)</h5>
<p>لازم نلاقي كودون البداية <b>AUG</b> عند 5'، وهو بيشفّر لـ <b>methionine</b> اللي تقريبًا دايمًا أول حمض أميني. الوحدة <b>الصغيرة 40S بترتبط عند الـ 5' cap</b> وتمشي لحد AUG، وبعدين الـ initiation factors بتجيب الوحدة <b>الكبيرة 60S</b> فيكتمل الـ initiation complex. الـ Met-tRNA بيكون في الـ P site.</p>
<h5>الاستطالة: دورة من 3 خطوات</h5>
<ol>
<li><b>التعرف على الكودون</b>: الـ aminoacyl-tRNA المكمّل للكودون اللي جاي بيدخل الـ <b>A site</b>، باستخدام طاقة من تكسير <b>GTP</b>.</li>
<li><b>تكوين الرابطة الببتيدية</b>: السلسلة اللي في الـ P site بتتنقل على الحمض الأميني اللي في الـ A site وتترابط برابطة ببتيدية، والـ tRNA اللي في الـ P site يبقى فاضي.</li>
<li><b>Translocation</b>: الريبوسوم يتحرك كودون واحد على الـ mRNA، باستخدام <b>GTP</b> برضه. الـ tRNA الشايل السلسلة يبقى في الـ P site، والفاضي يخرج من الـ E site، والـ A site يفضى للي بعده.</li>
</ol>
<p>السلسلة بتكبر من الطرف <b>N</b> (الميثيونين) للطرف <b>C</b> (آخر حمض أميني).</p>
<h5>النهاية (Termination)</h5>
<p>لما واحد من الـ <b>stop codons</b> التلاتة يدخل الـ A site، مفيش tRNA بيرتبط بيه. بدل كده الرابطة بين السلسلة والـ tRNA اللي في الـ P site <b>بتتكسر بالماء (hydrolysis)</b>، والسلسلة تتحرر في السيتوبلازم. والوحدتين يفترقوا ويستعدوا لدورة جديدة.</p>
<h5>الـ Polyribosomes</h5>
<p>كذا ريبوسوم ممكن يترجموا نفس الـ mRNA في نفس الوقت ورا بعض. ده اسمه <b>polysome</b>، وبيخلي الخلية تعمل نسخ كتير من البروتين بسرعة جدًا.</p>
<div class="pearl"><strong>مراجعة سريعة:</strong> الـ GTP بيُستخدم مرتين في كل دورة (التعرف على الكودون والـ translocation). والـ ATP بيستخدمه الـ aminoacyl-tRNA synthetase عشان يشحن الـ tRNA.</div>
