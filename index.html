{
 id:"analytical", code:"PHC223", name:"Pharmaceutical Analytical Chemistry 3", hue:"var(--c3)",
 staff:"Assoc. Prof. Sarah Salah · Assoc. Prof. Omnia Ali · Assoc. Prof. Heba Tarek",
 lectures:[
 {n:1,t:"Introduction to redox reactions",h:`
 <div class="tblwrap"><table><tr><th>Oxidizing agent</th><th>Reducing agent</th></tr>
 <tr><td>Is <b>reduced</b></td><td>Is <b>oxidized</b></td></tr><tr><td>Gains electrons (acceptor)</td><td>Loses electrons (donor)</td></tr><tr><td>Oxidation number ↓</td><td>Oxidation number ↑</td></tr><tr><td>KMnO₄, K₂Cr₂O₇, I₂, KIO₃, KBrO₃, Ce⁴⁺</td><td>Na₂S₂O₃, oxalate, Fe²⁺, metallic iron</td></tr></table></div>
 <p><b>Oxidation number rules:</b> free element = 0; H = +1 (not hydrides); O = −2 (not peroxides); ion = its charge; neutral compound sums to 0. Example: Mn in KMnO₄ = +7; S in H₂SO₄ = +6.</p>
 <div class="formula">Equivalent weight = Molecular weight / change in oxidation number</div>
 <ul><li>KMnO₄ (M = 158) in <b>acid</b>: Mn +7 → +2 (5 e) → Eq. wt = 158/5 = <b>31.6</b></li>
 <li>KMnO₄ in <b>alkaline</b>: Mn +7 → +4 (MnO₂, 3 e) → Eq. wt = 158/3 = <b>52.67</b></li></ul>
 <h4>Balancing by half-equations</h4>
 <ol><li>Split into oxidant and reductant half-equations.</li><li>Balance ionically (O with H₂O, H with H⁺), then electronically (add e⁻).</li><li>Multiply so electrons lost = electrons gained, then add.</li></ol>
 <div class="formula">MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O<br>Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O</div>`},
 {n:2,t:"Electrode potential",h:`
 <div class="tblwrap"><table><tr><th>Solution pressure &gt; ionic pressure</th><th>Ionic pressure &gt; solution pressure</th></tr>
 <tr><td>Metal dissolves (is oxidized), e.g. Zn⁰ → Zn²⁺ + 2e</td><td>Ions deposit (are reduced), e.g. Cu²⁺ + 2e → Cu⁰</td></tr>
 <tr><td>Electrode becomes <b>negative</b>; loses weight</td><td>Electrode becomes <b>positive</b>; gains weight</td></tr></table></div>
 <ul><li>Standard potentials are measured against the <b>standard hydrogen electrode</b> (E⁰ = 0).</li>
 <li>An electrode has the same sign as its E⁰. Current flows from the more negative to the more positive E⁰ (e.g. Mg −2.36 → Ag +0.80).</li></ul>
 <div class="formula">Electrode potential: E = E⁰ + (0.059/n) log [Mⁿ⁺] &nbsp;→ E = E⁰ when [Mⁿ⁺] = 1 M</div>
 <p><b>Electrochemical series:</b> metals with more negative potential are reducing agents and displace metals below them from solution.</p>`},
 {n:3,t:"Electrochemical cells",h:`
 <ul><li><b>Galvanic (voltaic) cell</b>: a spontaneous redox reaction produces current. Oxidation at the anode, reduction at the cathode.</li>
 <li><b>Electrolytic cell</b>: an external current drives a non-spontaneous reaction.</li>
 <li><b>Salt bridge</b>: connects the two half-cells, completes the circuit and keeps each solution electrically neutral by letting ions migrate.</li></ul>
 <div class="pearl"><strong>Tip:</strong> cell EMF = E⁰(cathode) − E⁰(anode). A positive EMF means the reaction runs spontaneously.</div>`},
 {n:4,t:"Oxidation potential and the factors that change it",h:`
 <div class="formula">For a redox couple on an inert Pt electrode: E = E⁰ + (0.059/n) log [Ox]/[Red] &nbsp;→ E = E⁰ when [Ox] = [Red]</div>
 <ul><li><b>SOP series</b>: large positive E⁰ = strong oxidizing agent (top); negative E⁰ = strong reducing agent.</li>
 <li>For a reaction to go to completion, the two systems should differ by about <b>0.4 V</b>.</li>
 <li>Remove the <b>oxidized</b> form (precipitate or complex it) → E falls. Remove the <b>reduced</b> form → E rises. Adding a common ion shifts it the same way.</li></ul>
 <div class="tblwrap"><table><tr><th>System</th><th>E⁰ (V)</th></tr><tr><td>MnO₄⁻/Mn²⁺</td><td>1.51</td></tr><tr><td>Ce⁴⁺/Ce³⁺</td><td>1.44</td></tr><tr><td>Cl₂/Cl⁻</td><td>1.36</td></tr><tr><td>Cr₂O₇²⁻/Cr³⁺</td><td>1.36</td></tr><tr><td>Fe³⁺/Fe²⁺</td><td>0.77</td></tr><tr><td>I₂/I⁻</td><td>0.54</td></tr></table></div>
 <p>So MnO₄⁻ can oxidize Cl⁻, Br⁻, I⁻ and Fe²⁺, but Fe³⁺ can oxidize only I⁻.</p>
 <h4>Applied problems</h4>
 <ul><li><b>FeCl₂ by KMnO₄:</b> Cl⁻ would also be oxidized. Add <b>Zimmermann–Reinhardt reagent</b>: MnSO₄ (Mn²⁺ lowers MnO₄⁻/Mn²⁺ potential below Cl₂/Cl⁻ but above Fe), H₃PO₄ (complexes yellow Fe³⁺ to a colourless complex and lowers Fe³⁺/Fe²⁺), H₂SO₄ (acidity).</li>
 <li><b>FeCl₂ by iodine:</b> I₂ (0.54) is too weak for Fe²⁺ (0.77). Add HgCl₂ (removes I⁻ as [HgI₄]²⁻, raising the I₂/I⁻ potential) + H₃PO₄ (lowers Fe³⁺/Fe²⁺).</li></ul>`},
 {n:5,t:"Redox indicators, titrants and titration curves",h:`
 <div class="tblwrap"><table><tr><th>Indicator type</th><th>Example</th></tr><tr><td>Self</td><td>KMnO₄ (first permanent pink), I₂</td></tr><tr><td>External</td><td>K-ferricyanide spot test for Fe²⁺ (no blue colour at end point)</td></tr><tr><td>Internal</td><td>Diphenylamine, ferroin, N-phenylanthranilic acid</td></tr><tr><td>Irreversible</td><td>Methyl orange / methyl red (destroyed by excess oxidant)</td></tr><tr><td>Specific</td><td>Starch (I₂), SCN⁻ (Fe³⁺)</td></tr><tr><td>Instrumental</td><td>Potentiometric</td></tr></table></div>
 <div class="tblwrap"><table><tr><th>Internal indicator</th><th>E⁰ (V)</th><th>Colour change</th></tr><tr><td>Diphenylamine</td><td>0.76</td><td>Colourless → violet</td></tr><tr><td>Ferroin</td><td>1.06</td><td>Red → blue</td></tr><tr><td>N-Phenylanthranilic acid</td><td>1.08</td><td>Colourless → pinkish violet</td></tr></table></div>
 <div class="pearl"><strong>Memorize:</strong> diphenylamine (0.76) is too close to Fe³⁺/Fe²⁺ (0.77) for Fe²⁺/dichromate, so add PO₄³⁻ (or F⁻) to lower the iron potential. Phenylanthranilic acid (1.08) works directly because it lies between 0.77 and 1.36.</div>
 <div class="tblwrap"><table><tr><th></th><th>KMnO₄</th><th>Ce⁴⁺</th><th>K₂Cr₂O₇</th></tr>
 <tr><td>Self indicator</td><td>Yes (purple → colourless; first pink)</td><td>Yes, weak (yellow → colourless)</td><td>No (orange → green)</td></tr>
 <tr><td>Primary standard</td><td>No (standardize vs sodium oxalate or As₂O₃)</td><td>No</td><td><b>Yes</b></td></tr>
 <tr><td>Strength</td><td>Strongest</td><td>2nd</td><td>3rd</td></tr>
 <tr><td>Indicator used</td><td>Self</td><td>Ferroin</td><td>Ferroin / diphenylamine</td></tr>
 <tr><td>Medium</td><td>Acidic</td><td>Any</td><td>Acidic</td></tr></table></div>
 <p>Ferric samples are first reduced to Fe²⁺ (SnCl₂ or amalgamated zinc), then titrated.</p>
 <h4>Titration curve</h4>
 <div class="formula">At the equivalence point: E = (n₁E₁⁰ + n₂E₂⁰) / (n₁ + n₂)<small>I⁻ with Ce⁴⁺: (2×0.54 + 1×1.44)/3 = 0.84 V</small></div>
 <p>Potential changes slowly before the end point and jumps sharply at the equivalence point.</p>`},
 {n:6,t:"Iodimetry, iodometry, KIO₃ and KBrO₃",h:`
 <div class="tblwrap"><table><tr><th>Iodimetry (direct)</th><th>Iodometry (indirect)</th></tr>
 <tr><td>Titrant = standard I₂</td><td>Excess KI added; liberated I₂ titrated with Na₂S₂O₃</td></tr>
 <tr><td>Determines <b>reducing</b> agents</td><td>Determines <b>oxidizing</b> agents</td></tr>
 <tr><td>E.g. thiosulfate, ascorbic acid</td><td>E.g. H₂O₂, Cu²⁺</td></tr></table></div>
 <div class="formula">I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻ (tetrathionate) &nbsp;|&nbsp; H₂O₂ + 2H⁺ + 2I⁻ → I₂ + 2H₂O</div>
 <ul><li>Indicator: <b>starch</b> (specific for I₂). I₂ is ~90× more soluble in CHCl₃ or CCl₄ than in water.</li>
 <li><b>KIO₃</b> is a powerful oxidant; its product depends on acidity:</li></ul>
 <div class="tblwrap"><table><tr><th>Medium</th><th>Half-reaction</th><th>e⁻</th></tr><tr><td>Neutral</td><td>IO₃⁻ + 3H₂O + 6e → I⁻ + 6OH⁻</td><td>6</td></tr><tr><td>Slightly acidic</td><td>IO₃⁻ + 6H⁺ + 5e → ½I₂ + 3H₂O</td><td>5</td></tr><tr><td>Strongly acidic</td><td>IO₃⁻ + 6H⁺ + 4e → I⁺ + 3H₂O</td><td>4</td></tr></table></div>`},
 {n:7,t:"Midterm revision",h:`<p>Lecture 7 is a revision of lectures 1–6. Use it with the quiz: balancing equations, electrode vs oxidation potential, factors affecting potential, Zimmermann's reagent, indicator choice, the three oxidizing titrants and the titration curve.</p>
 <div class="tblwrap"><table><tr><th>Reducing sample</th><th>Oxidized to</th><th>Can be titrated by</th></tr>
 <tr><td>Oxalate</td><td>CO₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr><tr><td>Fe²⁺</td><td>Fe³⁺</td><td>MnO₄⁻, Ce⁴⁺, Cr₂O₇²⁻</td></tr><tr><td>Ferrocyanide</td><td>Ferricyanide</td><td>MnO₄⁻, Ce⁴⁺</td></tr><tr><td>H₂O₂</td><td>O₂</td><td>MnO₄⁻, Ce⁴⁺</td></tr><tr><td>As³⁺, Sb³⁺, SO₃²⁻, NO₂⁻</td><td>As⁵⁺, Sb⁵⁺, SO₄²⁻, NO₃⁻</td><td>MnO₄⁻</td></tr></table></div>`}
 ],
 quiz:[
 {l:1,q:"What is the equivalent weight of KMnO₄ (M = 158) in acid medium?",o:["158","52.67","31.6","79"],a:2,e:"Mn goes from +7 to +2: a change of 5. 158 ÷ 5 = 31.6."},
 {l:1,q:"And in alkaline medium (forming MnO₂)?",o:["31.6","52.67","39.5","158"],a:1,e:"Mn goes from +7 to +4: a change of 3. 158 ÷ 3 = 52.67."},
 {l:1,q:"An oxidizing agent:",o:["Loses electrons","Gains electrons and its oxidation number decreases","Is oxidized","Has a low oxidation number"],a:1,e:"The oxidant accepts electrons, so it is itself reduced."},
 {l:1,q:"In the balanced reaction of MnO₄⁻ with Fe²⁺ in acid, the mole ratio MnO₄⁻ : Fe²⁺ is:",o:["1 : 1","1 : 3","1 : 5","2 : 5"],a:2,e:"MnO₄⁻ gains 5 electrons and each Fe²⁺ gives 1, so 1 : 5."},
 {l:1,q:"How many H⁺ appear in the balanced dichromate–ferrous equation?",o:["6","8","14","7"],a:2,e:"Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O."},
 {l:2,q:"When solution pressure is greater than ionic pressure, the metal electrode:",o:["Becomes positive and gains weight","Becomes negative and loses weight","Is unaffected","Plates out ions"],a:1,e:"The metal dissolves as ions, leaving electrons behind: negative charge, weight loss."},
 {l:2,q:"According to E = E⁰ + (0.059/n) log[Mⁿ⁺], E equals E⁰ when:",o:["[Mⁿ⁺] = 0","[Mⁿ⁺] = 1 M","n = 1","The temperature is 0 °C"],a:1,e:"log 1 = 0, so E = E⁰ at unit ion concentration."},
 {l:3,q:"The main role of a salt bridge is to:",o:["Supply electrons","Complete the circuit and keep the half-cells electrically neutral","Raise the EMF","Act as the cathode"],a:1,e:"Ions migrate through the bridge, balancing the charge build-up in each half-cell."},
 {l:4,q:"Adding a complexing agent that removes the oxidized form of a couple will:",o:["Raise its potential","Lower its potential","Not change it","Double it"],a:1,e:"E = E⁰ + (0.059/n) log [Ox]/[Red]. Less [Ox] → lower E."},
 {l:4,q:"Fe³⁺ (E⁰ 0.77 V) can oxidize which halide?",o:["Cl⁻","Br⁻","I⁻ only","All halides"],a:2,e:"Only I₂/I⁻ (0.54 V) lies below Fe³⁺/Fe²⁺."},
 {l:4,q:"In Zimmermann–Reinhardt reagent, the role of MnSO₄ is to:",o:["Complex Fe³⁺","Lower the MnO₄⁻/Mn²⁺ potential below that of Cl₂/Cl⁻","Act as indicator","Provide acidity"],a:1,e:"Extra Mn²⁺ lowers the permanganate potential so chloride is no longer oxidized."},
 {l:4,q:"For a redox reaction to be complete, the two systems' potentials should differ by about:",o:["0.04 V","0.1 V","0.4 V","1.5 V"],a:2,e:"A difference of about 0.4 V is needed for quantitative reaction."},
 {l:5,q:"Why is diphenylamine unsuitable for Fe²⁺ with dichromate unless phosphate is added?",o:["It is too strong","Its E⁰ (0.76) is too close to Fe³⁺/Fe²⁺ (0.77)","It reacts with Cl⁻","It is a self-indicator"],a:1,e:"Phosphate complexes Fe³⁺, lowering the iron potential so the indicator changes after the end point."},
 {l:5,q:"Which oxidizing titrant is a primary standard?",o:["KMnO₄","Ceric sulfate","Potassium dichromate","Iodine"],a:2,e:"K₂Cr₂O₇ is a primary standard. KMnO₄ must be standardized against sodium oxalate or As₂O₃."},
 {l:5,q:"Ferroin changes colour at the end point from:",o:["Colourless to violet","Red to blue","Blue to red","Yellow to green"],a:1,e:"Ferroin (E⁰ 1.06): red (reduced) → blue (oxidized)."},
 {l:5,q:"100 mL of 0.1 N KI is titrated with 0.1 N Ce⁴⁺ (E⁰: I₂/I⁻ 0.54, n=2; Ce⁴⁺/Ce³⁺ 1.44, n=1). Potential at equivalence?",o:["0.54 V","0.84 V","0.99 V","1.44 V"],a:1,e:"E = (2×0.54 + 1×1.44)/(2+1) = 2.52/3 = 0.84 V."},
 {l:5,q:"Starch is classified as which type of redox indicator?",o:["Self","External","Irreversible","Specific"],a:3,e:"Starch reacts specifically with iodine (blue complex)."},
 {l:6,q:"H₂O₂ is determined by adding excess KI and titrating the liberated I₂ with thiosulfate. This is:",o:["Iodimetry","Iodometry","Cerimetry","Permanganometry"],a:1,e:"Indirect method for an oxidizing sample = iodometry."},
 {l:6,q:"Thiosulfate is oxidized by iodine to:",o:["Sulfate","Sulfite","Tetrathionate","Sulfur"],a:2,e:"I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻."},
 {l:6,q:"In strongly acidic medium, how many electrons does each IO₃⁻ gain?",o:["6","5","4","2"],a:2,e:"IO₃⁻ + 6H⁺ + 4e → I⁺ + 3H₂O. Neutral: 6 e; slightly acidic: 5 e."}
 ]
},
{
 id:"dosage", code:"PHT231", name:"Pharmaceutical Dosage Forms 1", hue:"var(--c4)",
 staff:"Prof. Amal Makhlouf · Assoc. Prof. Nabila Sweed",
 lectures:[
 {n:1,t:"Liquid dosage forms and solubilization",h:`
 <p>A <b>dosage form</b> is the physical form in which a drug is delivered to its site of action. A <b>solution</b> is a homogeneous mixture of solute in solvent. Exception to "solvent is the larger part": <b>Syrup BP</b> = 66.7% w/w sucrose in 33.3% w/w water.</p>
 <div class="tblwrap"><table><tr><th>Advantages of solutions</th><th>Disadvantages</th></tr><tr><td>Easy to swallow (children, elderly)<br>Fast absorption and response<br>Less GIT irritation (aspirin, KCl diluted)<br>Homogeneous, uniform dose<br>Many routes</td><td>Bulky to carry and store<br>Less stable (hydrolysis)<br>Microbial growth (needs preservative)<br>Taste more obvious<br>Dose depends on patient measuring</td></tr></table></div>
 <p><b>Solubilization</b> = increasing the solubility of a poorly water-soluble drug. ~40% of lipophilic drug candidates fail because of poor bioavailability.</p>
 <div class="tblwrap"><table><tr><th>BCS</th><th>Solubility</th><th>Permeability</th></tr><tr><td>I</td><td>High</td><td>High</td></tr><tr><td>II</td><td>Low</td><td>High</td></tr><tr><td>III</td><td>High</td><td>Low</td></tr><tr><td>IV</td><td>Low</td><td>Low</td></tr></table></div>
 <h4>Methods</h4>
 <ol><li><b>pH change / salt formation</b>: simplest for ionizable drugs. Helps BCS II; may hurt BCS III (more polar → less permeation).</li>
 <li><b>Chemical modification</b>: soluble derivative, e.g. hydrocortisone sodium phosphate; chloramphenicol sodium succinate (inactive itself, for injection).</li>
 <li><b>Co-solvency</b>: water-miscible solvents (glycerol, ethanol, propylene glycol), e.g. <b>paracetamol elixir</b>.</li>
 <li><b>Micellar solubilization</b>: surfactant above its <b>CMC</b> (0.05–0.1%) traps drug in micelles, e.g. Tweens for vitamins A, D, E, K; soaps for cresol and chloroxylenol (Lysol, Dettol). Amphiphilic polymers (PEG–PLA) form polymeric micelles.</li>
 <li><b>Hydrotropy</b>: large amount of a second solute (sodium benzoate, sodium salicylate, urea). Hydrophobic part too small to self-aggregate, so <b>no CMC</b>.</li>
 <li><b>Complexation</b>: <b>cyclodextrins</b> (α = 6, β = 7, γ = 8 glucose units) with a hydrophilic outside and hydrophobic cavity form inclusion complexes.</li>
 <li><b>Particle size reduction</b> (lecture 2).</li>
 <li><b>Solid dispersion</b>: drug dispersed molecularly in a hydrophilic polymer (PVP, HPMC, PEG 6000) by melting or kneading.</li></ol>`},
 {n:2,t:"Particle size reduction: micronization, nanocrystals, cocrystals",h:`
 <div class="formula">Noyes–Whitney: dm/dt = D·A·(Cs − C)/h<small>Dissolution rate is directly proportional to surface area A</small></div>
 <div class="tblwrap"><table><tr><th></th><th>Micronization</th><th>Nanocrystals</th></tr>
 <tr><td>Size</td><td>1–10 µm</td><td>100–1000 nm</td></tr><tr><td>Methods</td><td>Jet milling, ball milling</td><td>Top-down: high-pressure homogenization. Bottom-up: solvent–antisolvent precipitation</td></tr>
 <tr><td>Stability</td><td>More stable</td><td>Aggregate; need <b>stabilizers</b></td></tr><tr><td>Products</td><td>Griseofulvin, spironolactone</td><td>Tricor® (fenofibrate), Rapamune® (sirolimus), Emend® (aprepitant)</td></tr></table></div>
 <p>Micronization helps BCS II drugs but may not be enough when log P &gt; 4. Top-down is scalable but uses high energy and heat; bottom-up is gentler but has solvent residue and scale-up problems.</p>
 <p><b>Stabilizers:</b> steric (polymers PVP, HPMC, PEG), electrostatic (charged, e.g. SDS → zeta potential), or both (ionic surfactants). Surfactants also include Tween 80 and Spans.</p>
 <h4>Cocrystals</h4>
 <ul><li>Drug + <b>coformer</b> in one crystal, held by non-covalent bonds (H-bonds, van der Waals, π–π). Changes physical properties, not pharmacology. Example: <b>carbamazepine–saccharin 1:1</b>.</li>
 <li>Why solubility rises: weaker crystal lattice, better wetting (hydrophilic coformers such as nicotinamide, caffeine, saccharin), thermodynamic driving force.</li>
 <li>Coformer criteria: can H-bond, <b>GRAS</b> and safe, improves properties, does not react with the drug.</li>
 <li><b>Multidrug cocrystals</b>: two APIs in one lattice, e.g. <b>Entresto®</b> (sacubitril + valsartan) for heart failure; meloxicam–aspirin raised bioavailability from 16% to 69%.</li>
 <li>Uses: solubility and faster onset (naproxen–L-alanine), bioavailability (baicalein–caffeine), stability and less hygroscopicity (caffeine–oxalic acid), taste masking.</li>
 <li>Preparation: neat (dry) grinding, liquid-assisted grinding, solvent evaporation, ultrasound- or microwave-assisted.</li></ul>`},
 {n:3,t:"Pharmaceutical waters and aromatic waters",h:`
 <div class="tblwrap"><table><tr><th>Water</th><th>Key points</th></tr>
 <tr><td>Potable (tap)</td><td>Not for dispensing: microbes and dissolved salts (precipitation, discoloration, effervescence)</td></tr>
 <tr><td>Freshly boiled & cooled</td><td>Kills vegetative bacteria; spores and salts remain</td></tr>
 <tr><td>Purified Water USP</td><td>Free of ions and microbes; for all dosage forms and tests <b>except injections and eye preparations</b></td></tr>
 <tr><td>Water for Injection (WFI)</td><td><b>Pyrogen-free</b>, sterilized; single-dose containers ≤ 1 L; <b>no antimicrobial</b></td></tr>
 <tr><td>Bacteriostatic WFI</td><td>Contains antimicrobial (label must state it); multi-dose vials. If &gt; 5 mL is needed, use sterile WFI instead</td></tr></table></div>
 <h4>Making purified water</h4>
 <ul><li><b>Distillation</b>: discard the first 10–20% (volatile impurities) and the last 10–20% (decomposition products).</li>
 <li><b>Ion exchange</b>: cation resin swaps Ca²⁺/Mg²⁺ for H⁺; anion resin swaps Cl⁻/SO₄²⁻ for OH⁻ → H₂O. One- or two-column. No heat, cheap, simple, mobile.</li>
 <li><b>Reverse osmosis</b>: pressure pushes water through a semipermeable membrane against osmosis; removes pyrogens, organics and 90–99% of ions.</li></ul>
 <h4>Aromatic waters</h4>
 <p>Nearly saturated clear aqueous solutions of volatile oils (peppermint, rose, anise, camphor, chloroform). Used as pleasant flavoured vehicles. Must smell like the source, be clear, fresh (few weeks) and free of foreign odours.</p>
 <ul><li>Problems: salting out with soluble salts; cloudy with time; sensitive to light and heat → small batches, airtight light-resistant containers, cool dark place.</li>
 <li>Preparation: <b>distillation</b> (best, slow, costly; repeated distillation = <b>cohobation</b>, e.g. rose water); <b>simple solution</b> (2 g or 2 mL oil + 1000 mL water, stand 12 h, filter, make to volume, e.g. peppermint and chloroform water); <b>solubilizing agent</b> (Tween 20, Span 60; mould-prone, taste above 2%).</li>
 <li>Uses: camphor water (carminative, eye lotions), chloroform water (expectorant, carminative, <b>preservative</b>), peppermint water (carminative), anise water (carminative).</li></ul>`},
 {n:4,t:"Excipients in liquids, oral solutions and syrups",h:`
 <div class="tblwrap"><table><tr><th>Additive</th><th>Key points</th></tr>
 <tr><td>Buffers</td><td>Carbonates, citrates, phosphates, tartrates. <b>Borate: external only</b>. Injections and eye drops ~7.4; nasal 5.3–7.0. Benzylpenicillin injection buffered to 6–7 with sodium citrate.</td></tr>
 <tr><td>Isotonicity modifiers</td><td>NaCl and dextrose; isotonic = 0.9% NaCl. Needed for injections, eye and nasal drops.</td></tr>
 <tr><td>Viscosity enhancers</td><td>Povidone, hydroxyethylcellulose, carbomer: longer contact on skin or eye.</td></tr>
 <tr><td>Preservatives</td><td>Benzoic acid 0.1–0.2%, parabens 0.1%, alcohol &gt; 20%. Parabens get trapped in non-ionic surfactant micelles and lose activity.</td></tr>
 <tr><td>Antioxidants</td><td>Chelators (EDTA); oils: tocopherol, BHA, BHT; aqueous: ascorbic acid. Also N₂ headspace, cool storage, light-resistant packs.</td></tr>
 <tr><td>Sweeteners</td><td>Sucrose (stable pH 4–8); sorbitol, mannitol, glycerol; saccharin &lt; 0.2% (bitter/metallic aftertaste), aspartame.</td></tr>
 <tr><td>Flavours</td><td>Bitter: anise, chocolate, mint, wild cherry. Salty: apricot, liquorice, peach, vanilla. Sour: citrus, liquorice, raspberry. Menthol numbs taste buds.</td></tr>
 <tr><td>Colours</td><td>Match flavour, identify products (poisons, antiseptics), hide degradation colour.</td></tr></table></div>
 <h4>Oral solutions</h4>
 <ul><li>Doses: 5 mL (teaspoon), 10 mL (dessertspoon), 15 mL (tablespoon), or calibrated drops.</li>
 <li><b>ORS</b> per litre: 45 mEq Na⁺, 20 mEq K⁺, 35 mEq Cl⁻, 30 mEq citrate, 25 g dextrose.</li>
 <li>Magnesium citrate: saline cathartic (200 mL). Sodium citrate–citric acid: alkalinizes urine (renal stones, gout).</li></ul>
 <h4>Syrups and linctuses</h4>
 <ul><li>Syrups: concentrated sugar solutions. For diabetics: non-glycogenic, e.g. <b>artificial syrup</b> = sodium CMC 1.5% + saccharin sodium 0.6%.</li>
 <li>Nearly saturated sucrose syrups need no preservative (no free water). Alcohol below 15–20% does not preserve.</li>
 <li><b>Linctus</b>: viscous cough preparation; sip slowly, <b>do not dilute</b> (demulcent on the throat).</li></ul>`},
 {n:5,t:"External aqueous and non-aqueous solutions",h:`
 <h4>Aqueous, external</h4>
 <ul><li><b>Lotions</b>: low viscosity, applied without friction (e.g. calamine). May contain glycerin (humectant) or alcohol (cooling).</li>
 <li><b>Douches</b>: stream into a cavity for cleansing (eye, pharyngeal, vaginal). Vaginal douches may contain astringents (alum), antimicrobials (povidone-iodine), menthol, buffers.</li>
 <li><b>Enemas</b>: evacuation (0.5–1 L water, or ~130 mL phosphate/MgSO₄); retention for local or systemic effect (hydrocortisone for ulcerative colitis; aminophylline, chloral hydrate), <b>≤ 150 mL</b> in adults; diagnostic (<b>barium sulfate</b>).</li>
 <li><b>Nasal</b>: isotonic, buffered pH 5.5–6.5 to protect cilia. Local (ephedrine) or systemic (calcitonin). Decongestants max 3–5 days: risk of <b>rhinitis medicamentosa</b>.</li>
 <li><b>Otic</b>: remove wax, treat infection or pain. Glycerin or propylene glycol vehicles are viscous (longer contact) and hygroscopic (less microbial growth, less swelling).</li></ul>
 <h4>Non-aqueous</h4>
 <ul><li>Good for water-insoluble or hydrolysis-prone drugs; oily IM <b>depots</b> (testosterone, estradiol esters).</li>
 <li><b>Ethanol</b>: extracts resins, oils, alkaloids, glycosides (not gums, starch); co-solvent; preservative above 15–20%; cooling on skin. Toxic: OTC oral limits are <b>0.5%</b> under 6 years, 5% for 6–12, 10% over 12.</li>
 <li>Alcohol precipitates tragacanth, acacia, agar and salts; diluting alcoholic solutions with water may precipitate drug.</li>
 <li><b>Glycerin</b> (3 OH) and <b>propylene glycol</b> (2 OH): solvents, preservatives, viscosity; glycerin is not selective and very viscous.</li>
 <li><b>Fixed oils</b>: almond oil (oily phenol injection), sesame, olive, castor (parenteral depots), coconut (oral antibiotics, vitamins A and D).</li>
 <li>Internal non-aqueous: elixirs, spirits, tinctures, glycerites (covered in labs).</li></ul>
 <h4>External non-aqueous</h4>
 <ul><li><b>Liniments</b>: applied with rubbing; alcoholic (rubefacient, counter-irritant) or oily (massage). <b>Not on broken skin.</b></li>
 <li><b>Collodion</b>: 4% pyroxylin in alcohol/ether; dries to a protective film. <b>Flexible collodion</b> = + 2% camphor (waterproof) + 3% castor oil (flexible). <b>Salicylic acid collodion</b> 10% removes corns.</li></ul>`},
 {n:6,t:"Colloids: classes, preparation and purification",h:`
 <div class="tblwrap"><table><tr><th></th><th>Molecular</th><th>Colloidal</th><th>Coarse</th></tr><tr><td>Size</td><td>&lt; 1 nm</td><td>1–500 nm</td><td>&gt; 500 nm</td></tr><tr><td>Seen by</td><td>Not even EM</td><td>Ultramicroscope / EM</td><td>Light microscope</td></tr><tr><td>Filter paper</td><td>Passes</td><td>Passes</td><td>Retained</td></tr><tr><td>Semipermeable membrane</td><td>Passes</td><td>Retained</td><td>Retained</td></tr><tr><td>Diffusion</td><td>Rapid</td><td>Very slow</td><td>None</td></tr></table></div>
 <p>Colloids have a huge <b>specific surface area</b>: platinum black as catalyst, kaolin adsorbing toxins, Al(OH)₃ antacid. Uses: silver germicides, plasma substitutes (dextran, PVP, gelatin), iron–dextran for anemia.</p>
 <div class="tblwrap"><table><tr><th>Lyophilic</th><th>Lyophobic</th><th>Association</th></tr>
 <tr><td>Organic polymers (gelatin, acacia, HPMC)</td><td>Inorganic (gold, silver, sulfur, AgI)</td><td>Surfactant micelles</td></tr>
 <tr><td>Form spontaneously; solvated</td><td>Need special methods; not solvated</td><td>Form spontaneously above CMC</td></tr>
 <tr><td>Viscosity ↑ greatly</td><td>Viscosity hardly changes</td><td>Viscosity ↑ with concentration</td></tr>
 <tr><td>Stable with electrolytes; salted out at high conc.</td><td><b>Unstable</b> with small amounts of electrolyte (charge neutralized)</td><td>Electrolytes lower CMC</td></tr></table></div>
 <p><b>Lyophobic preparation:</b> dispersion (large → small: ultrasonic generator &gt; 20,000 cycles/s, electric arc, colloid mill) or condensation (small → large: supersaturation, e.g. sulfur sol; chemical reactions: oxidation of H₂S, hydrolysis of FeCl₃).</p>
 <h4>Purification</h4>
 <ul><li><b>Dialysis</b>: semipermeable membrane lets small ions and molecules out, keeps colloids.</li>
 <li><b>Electrodialysis</b>: electric field speeds ion removal (3-compartment cell).</li>
 <li><b>Ultrafiltration</b>: suction through a fine membrane.</li>
 <li><b>Artificial kidney</b>: cellophane passes urea, glucose and electrolytes, not proteins or cells. Urea leaves blood; bicarbonate enters from the dialysate.</li></ul>`},
 {n:7,t:"Properties of colloids",h:`
 <h4>Optical</h4>
 <ul><li><b>Faraday–Tyndall effect</b>: colloids scatter light (visible cone); true solutions don't. Turbidity, measured at 90°, relates to molecular weight.</li>
 <li><b>Ultramicroscope</b>: particles appear as bright spots (counting). <b>Electron microscope</b>: real size and shape, but samples must be dried.</li></ul>
 <h4>Kinetic</h4>
 <ul><li><b>Brownian motion</b>: random movement from solvent bombardment; faster with smaller particles and lower viscosity.</li>
 <li><b>Diffusion</b> (Fick's first law): dm/dt = −D·A·dC/dx.</li>
 <li><b>Osmosis</b> and osmotic pressure.</li>
 <li><b>Sedimentation</b> (Stokes): v = 2r²(ρ − ρ₀)g / 9η. Below 0.5 µm Brownian motion opposes settling, so an <b>ultracentrifuge</b> is used (molecular weight, homogeneity).</li>
 <li><b>Viscosity</b>: η<sub>int</sub> = K·Mᵃ. Spherical lyophobic particles → low viscosity; linear solvated lyophilic particles → high viscosity.</li></ul>`}
 ],
 quiz:[
 {l:1,q:"Syrup BP is an exception to the usual solute/solvent rule because it contains:",o:["33.3% w/w sucrose","66.7% w/w sucrose","50% w/v sucrose","85% w/v sucrose"],a:1,e:"The sucrose (solute) is the larger part: 66.7% w/w in 33.3% w/w water."},
 {l:1,q:"Paracetamol elixir is solubilized mainly by:",o:["Hydrotropy","Co-solvency (alcohol + propylene glycol)","Complexation","Micellization"],a:1,e:"Water-miscible co-solvents in which paracetamol is soluble."},
 {l:1,q:"Which statement about hydrotropes is correct?",o:["They have a CMC","Their hydrophobic part is too small to self-aggregate, so no CMC","They are cyclodextrins","They work at 0.05%"],a:1,e:"Unlike surfactants, hydrotropes (e.g. sodium benzoate, urea) don't form micelles."},
 {l:1,q:"β-cyclodextrin is made of how many glucose units?",o:["6","7","8","9"],a:1,e:"α = 6, β = 7, γ = 8."},
 {l:1,q:"A BCS class II drug has:",o:["High solubility, high permeability","Low solubility, high permeability","High solubility, low permeability","Low solubility, low permeability"],a:1,e:"Dissolution limits absorption, so solubilization helps these most."},
 {l:2,q:"According to Noyes–Whitney, dissolution rate is directly proportional to:",o:["Particle size","Surface area","Diffusion layer thickness h","Drug concentration in the bulk C"],a:1,e:"dm/dt = D·A·(Cs − C)/h; smaller particles → larger A → faster dissolution."},
 {l:2,q:"Drug nanocrystals are in the size range:",o:["1–10 µm","100–1000 nm","1–10 nm","10–100 µm"],a:1,e:"Micronized = 1–10 µm; nanocrystals = 100–1000 nm."},
 {l:2,q:"Why do nanocrystal formulations need stabilizers?",o:["To raise the dose","Their high surface energy makes them aggregate","To mask taste","To lower pH"],a:1,e:"Polymers (steric) or charged surfactants (electrostatic) keep particles apart."},
 {l:2,q:"Entresto® (sacubitril + valsartan) is an example of a:",o:["Nanocrystal","Single-drug cocrystal","Multidrug cocrystal","Solid dispersion"],a:2,e:"Two APIs in one crystal lattice, held by non-covalent bonds."},
 {l:3,q:"Which water must be used for injections?",o:["Purified water","Freshly boiled water","Water for injection (pyrogen-free)","Potable water"],a:2,e:"Purified water is not allowed for parenteral or ophthalmic products."},
 {l:3,q:"Water for injection is packed in single-dose containers of no more than:",o:["100 mL","500 mL","1 L","5 L"],a:2,e:"≤ 1 L and with no antimicrobial agent."},
 {l:3,q:"In distillation of purified water, which portions are discarded?",o:["Only the last 50%","First 10–20% and last 10–20%","Only the first 5%","None"],a:1,e:"The first part carries volatile impurities; the last carries decomposition products."},
 {l:3,q:"Repeated redistillation of the distillate with fresh drug (e.g. rose water) is called:",o:["Cohobation","Percolation","Maceration","Trituration"],a:0,e:"Cohobation is used when the volatile oil content is small."},
 {l:4,q:"Borate buffers can be used:",o:["Orally","Parenterally","For external application only","In all routes"],a:2,e:"Borates are for skin lotions, mouthwash, eyewash, not oral or parenteral use."},
 {l:4,q:"Which antioxidant suits an oily (non-aqueous) preparation?",o:["Ascorbic acid","BHA / BHT","Sodium citrate","EDTA only"],a:1,e:"Tocopherol, BHA and BHT for oils; ascorbic acid for aqueous systems."},
 {l:4,q:"Why do nearly saturated sucrose syrups not need a preservative?",o:["Sucrose is antibacterial","There is no free water for microbes","They are sterile","They contain alcohol"],a:1,e:"Microbes need free water; saturated syrup is effectively anhydrous for them."},
 {l:4,q:"A bitter drug is best masked with:",o:["Apricot or peach","Anise, chocolate, mint or wild cherry","Citrus or raspberry","Vanilla only"],a:1,e:"Salty → apricot/peach; sour → citrus/raspberry; bitter → anise, chocolate, mint, wild cherry."},
 {l:5,q:"Retention enemas in adults should not exceed:",o:["50 mL","150 mL","500 mL","1 L"],a:1,e:"Larger volumes stimulate evacuation, so the drug would not be retained."},
 {l:5,q:"Nasal decongestant solutions should be used for no more than 3–5 days to avoid:",o:["Rhinitis medicamentosa","Hypertension only","Loss of smell","Nose bleeds"],a:0,e:"Rebound congestion (rhinitis medicamentosa) worsens the original symptom."},
 {l:5,q:"Flexible collodion contains, besides pyroxylin:",o:["10% salicylic acid","2% camphor + 3% castor oil","Glycerin + alcohol","Starch"],a:1,e:"Castor oil adds flexibility; camphor makes it waterproof."},
 {l:5,q:"The FDA-proposed alcohol limit in OTC oral products for children under 6 is:",o:["0.5%","5%","10%","20%"],a:0,e:"Under 6: 0.5%; 6–12: 5%; over 12 and adults: 10%."},
 {l:6,q:"Colloidal particles are in the size range:",o:["< 1 nm","1–500 nm","> 500 nm","1–10 µm"],a:1,e:"They pass filter paper but not semipermeable membranes."},
 {l:6,q:"Lyophobic sols are unstable in the presence of small amounts of electrolytes because:",o:["They lose their solvent sheath","The charge on their particles is neutralized","They form micelles","They become viscous"],a:1,e:"They depend on surface charge only; lyophilic colloids also have a solvent sheath."},
 {l:6,q:"Dialysis separates colloids from impurities based on:",o:["Charge","Particle size, using a semipermeable membrane","Density","Colour"],a:1,e:"Small ions and molecules pass the membrane; colloidal particles stay."},
 {l:7,q:"The visible cone of light through a colloidal dispersion is the:",o:["Brownian effect","Faraday–Tyndall effect","Donnan effect","Doppler effect"],a:1,e:"Colloidal particles scatter light; true solutions appear clear."},
 {l:7,q:"Brownian motion increases when:",o:["Particle size and viscosity increase","Particle size and viscosity decrease","Glycerin is added","The particles are > 5 µm"],a:1,e:"Smaller particles in a less viscous medium move faster."},
 {l:7,q:"By Stokes' law, doubling the particle radius makes sedimentation velocity:",o:["Double","Four times faster","Half","Unchanged"],a:1,e:"v ∝ r², so 2² = 4 times faster."}
 ]
},

 id:"organic", code:"PHC213", name:"Pharmaceutical Organic Chemistry 3", hue:"var(--c5)",
 staff:"Dr. Heba Elsayed · Dr. Amal Elsayed · Dr. Sandra",
 lectures:[
 {n:1,t:"Aldehydes and ketones: names, properties, preparation",h:`
 <ul><li>Aliphatic aldehydes: suffix <b>-al</b>, carbonyl carbon = C1 (methanal, ethanal). Ring + CHO: <b>carbaldehyde</b>; lower-priority CHO: <b>formyl</b>.</li>
 <li>Ketones: suffix <b>-one</b>, lowest number to C=O (propanone). Common names: alkyl groups alphabetically + "ketone" (ethyl methyl ketone). Ring-C=O: <b>-phenone</b> (acetophenone).</li></ul>
 <div class="formula">Priority: −COOH &gt; −COOR &gt; −COCl &gt; −CONH₂ &gt; −CN &gt; −CHO &gt; C=O &gt; −OH &gt; −NH₂</div>
 <p><b>Uses:</b> formaldehyde (preservative, disinfectant, vaccines), benzaldehyde (flavour, API precursor), acetone (solvent, recrystallization), acetophenone (ibuprofen precursor).</p>
 <p><b>Properties:</b> polar (dipole–dipole); bp higher than alkanes but lower than alcohols; &lt; 6 C soluble in water; H-bond with water but <b>not with each other</b>.</p>
 <div class="tblwrap"><table><tr><th>Method</th><th>Gives</th></tr>
 <tr><td>Hot KMnO₄ oxidative cleavage of alkenes</td><td>Aldehydes/ketones</td></tr>
 <tr><td><b>PCC</b> oxidation of alcohols</td><td>1° → aldehyde (stops there), 2° → ketone</td></tr>
 <tr><td>Nitrile + Grignard (RMgX)</td><td>Ketones only</td></tr>
 <tr><td><b>Friedel–Crafts acylation</b> (benzene + RCOCl / AlCl₃)</td><td>Aromatic ketones only</td></tr>
 <tr><td>Acyl chloride + dialkylcadmium (R₂Cd)</td><td>Ketones only</td></tr>
 <tr><td><b>Rosenmund</b>: RCOCl + H₂/Pd–BaSO₄ (poisoned)</td><td>Aldehydes only (BaSO₄ stops reduction to alcohol)</td></tr>
 <tr><td>Partial oxidation of toluene (CrO₃)</td><td>Benzaldehyde</td></tr>
 <tr><td><b>Reimer–Tiemann</b></td><td>Phenolic aldehydes (salicylaldehyde)</td></tr></table></div>
 <p><b>Keto–enol tautomerism:</b> equilibrium lies toward the <b>keto</b> form because C=O is much stronger than C=C.</p>`},
 {n:2,t:"Nucleophilic addition, stereochemistry and reduction",h:`
 <ul><li>Reactivity: <b>aldehydes &gt; ketones</b> (less steric hindrance, less stabilized C⁺); <b>aliphatic &gt; aromatic</b> (resonance makes aromatic C=O less electrophilic).</li></ul>
 <div class="tblwrap"><table><tr><th>Nucleophile</th><th>Product</th></tr>
 <tr><td>2 ROH, dry HCl</td><td>Hemiacetal/hemiketal → <b>acetal/ketal</b> (reversible with water). Diols give cyclic acetals: <b>protecting groups</b>.</td></tr>
 <tr><td>HCN</td><td><b>Cyanohydrin</b> → α-hydroxy acids (e.g. mandelic acid, skin exfoliant)</td></tr>
 <tr><td>Grignard RMgX</td><td>Alcohols</td></tr>
 <tr><td>NH₃ derivatives (condensation)</td><td>Imines, <b>oximes</b> (antidotes for organophosphate poisoning), hydrazones, semicarbazones</td></tr></table></div>
 <h4>Stereochemistry</h4>
 <ul><li><b>Prochiral</b>: achiral but becomes chiral after one change. Attack on a prochiral carbonyl with no other stereocentre → 50:50 <b>racemic mixture</b> (optically inactive).</li>
 <li>If a chiral α-carbon already exists → <b>stereoselective</b> reaction → unequal diastereomers. <b>Cram & Abdel-Hafez rule</b>: the nucleophile attacks from the side of the <b>small</b> group → <b>threo (major)</b>; from the medium side → erythro (minor).</li>
 <li><b>R/S in Fischer</b>: priority by atomic number (I &gt; Br &gt; Cl &gt; S &gt; F &gt; O &gt; N &gt; C &gt; H). Lowest priority <b>vertical</b>: clockwise = R. Lowest priority <b>horizontal</b>: reverse it (clockwise = S).</li>
 <li><b>Erythro</b>: like groups on the same side; <b>threo</b>: opposite sides.</li>
 <li><b>Enantiomers</b>: mirror images, same properties except optical rotation. <b>Diastereomers</b>: not mirror images, ≥ 2 stereocentres, different physical properties.</li></ul>
 <h4>Reduction</h4>
 <ul><li>To alkanes: <b>Clemmensen</b> (Zn(Hg)/HCl) or <b>Wolff–Kishner</b> (N₂H₄/KOH).</li>
 <li>To alcohols: <b>NaBH₄ or LiAlH₄</b>: aldehyde → 1° alcohol, ketone → 2° alcohol. Creates a new sp³ stereocentre.</li></ul>`},
 {n:3,t:"α-Hydrogen reactions and carboxylic acids",h:`
 <p>α-H is acidic because the carbonyl stabilizes the carbanion (−I and resonance).</p>
 <ul><li><b>Aldol condensation</b>: needs α-H + strong base (NaOH/NaOEt). Enolate attacks a second carbonyl → dehydration → <b>α,β-unsaturated</b> carbonyl.</li>
 <li><b>Cannizzaro</b>: aldehydes with <b>no α-H</b> (HCHO, benzaldehyde) + hot strong alkali → one molecule reduced to alcohol, one oxidized to acid (self oxidation–reduction).</li>
 <li><b>Haloform (iodoform)</b>: any CH₃CO− group + I₂/NaOH → CHI₃ (yellow) + acid salt with <b>one carbon fewer</b>.</li>
 <li>SEAr: −CHO and −COR are <b>deactivating, meta-directing</b> (−I, −M).</li></ul>
 <h4>Carboxylic acids</h4>
 <ul><li>IUPAC: <b>-oic acid</b>, C=O carbon = C1 (e.g. CH₃CH(Cl)CH₂CH₂COOH = 4-chloropentanoic acid). Ring-COOH: "-carboxylic acid".</li>
 <li><b>Esters</b>: alkyl + acid name with "-ate" (propyl hexanoate).</li>
 <li>High bp because two molecules form <b>H-bonded dimers</b>. First four acids are fully miscible with water; solubility falls as chains lengthen.</li></ul>`},
 {n:4,t:"Acidity, preparation and reactions of carboxylic acids",h:`
 <p>Acidity depends on the stability of the <b>carboxylate</b> ion (−I of C=O and charge delocalized over 2 O).</p>
 <ul><li>More <b>s-character</b> → more acidic (sp &gt; sp² &gt; sp³).</li>
 <li><b>+I</b> alkyl groups decrease acidity. <b>−I</b> groups increase it: more of them, more electronegative (F &gt; Cl &gt; Br &gt; I), and closer to COOH = stronger.</li>
 <li>Benzoic acid (pKa 4.2) is stronger than acetic acid: the −I effect of the sp² ring wins.</li>
 <li>Para-EWG (NO₂) acts by −M → stronger than meta (−I only). Para-EDG (OH, OCH₃) +M weakens acid; meta-EDG acts by −I only.</li>
 <li><b>Ortho effect</b>: any ortho group twists COOH out of the ring plane, removing resonance donation → stronger acid (o-toluic pKa 3.9), even for donating groups.</li></ul>
 <h4>Preparation</h4>
 <ul><li>Oxidation of 1° alcohols or aldehydes (KMnO₄).</li><li><b>Grignard + CO₂</b> → acid with <b>one more carbon</b>.</li><li>Acid hydrolysis of nitriles.</li>
 <li>Products: benzoic acid (preservative, antifungal), phenylacetic acid (diclofenac precursor), salicylic acid (BHA), salol (analgesic, antiseptic).</li></ul>
 <h4>Reactions</h4>
 <ul><li><b>HVZ</b> (X₂/P): α-halogenation → then OH or NH₂ substitution gives α-hydroxy or α-amino acids.</li>
 <li>With NaOH → carboxylate salts. <b>Diclofenac potassium</b> is more soluble → faster onset (acute pain); diclofenac sodium → slower, delayed release (chronic arthritis).</li>
 <li><b>Nucleophilic acyl substitution</b> (addition → elimination). Acid chlorides are the most reactive derivatives (Cl⁻ = weak base, good leaving group). Acid chloride + alcohol → ester; + amine → <b>amide</b> (best route to amides).</li>
 <li>Fischer esterification is reversible: use excess alcohol or acid.</li>
 <li>COOH is meta-directing and deactivating.</li></ul>`},
 {n:5,t:"Conformations and cyclohexane",h:`
 <ul><li><b>Conformers</b>: same molecule, interconverted by rotation about single bonds or ring flipping; low energy barrier.</li>
 <li>Energy factors: <b>torsional</b> (eclipsing) strain, <b>steric</b> strain, dipole–dipole, H-bonding.</li>
 <li>Butane stability: anti (staggered) &gt; gauche &gt; partially eclipsed &gt; fully eclipsed.</li>
 <li>Ethylene glycol, ethanolamine, ethylenediamine: <b>gauche</b> is most stable because of an intramolecular H-bond.</li></ul>
 <div class="tblwrap"><table><tr><th></th><th>Chair</th><th>Boat</th></tr><tr><td>Angle strain</td><td>None (109.5°)</td><td>None</td></tr><tr><td>Torsional strain</td><td>None (staggered)</td><td>Eclipsed H at C2–C3 and C5–C6</td></tr><tr><td>Steric strain</td><td>None</td><td><b>Flagpole</b> H at C1 and C4</td></tr><tr><td>Stability</td><td><b>Most stable</b></td><td>Less stable</td></tr></table></div>
 <p>A planar ring would need 120° angles, so cyclohexane puckers. Each carbon has one <b>axial</b> and one <b>equatorial</b> bond; ring flip swaps them. Substituents prefer <b>equatorial</b> (avoids 1,3-diaxial clashes); the bulkier group takes equatorial in disubstituted rings.</p>`},
 {n:6,t:"Nomenclature of heterocycles",h:`
 <p>A <b>heterocycle</b> has at least one non-carbon ring atom (N, O, S…). About <b>59%</b> of US FDA-approved drugs contain nitrogen heterocycles. Nucleic acids are heterocycles too.</p>
 <ul><li><b>Trivial names</b>: 5-membered: pyrrole, furan, thiophene, imidazole, pyrazole, oxazole, thiazole. 6-membered: pyridine, pyrimidine, pyrazine, pyridazine.</li>
 <li><b>IUPAC (Hantzsch–Widman)</b> = <b>prefix</b> (heteroatom: oxa &gt; thia &gt; aza…, with di-, tri- and position numbers) + <b>stem</b> (ring size) + <b>suffix</b> (saturated or not; N present or not).</li></ul>
 <div class="tblwrap"><table><tr><th>3-membered</th><th>With N</th><th>Without N</th></tr><tr><td>Unsaturated</td><td>-irine</td><td>-irene</td></tr><tr><td>Saturated</td><td>-iridine</td><td>-irane</td></tr></table></div>
 <p>Examples: aziridine (saturated, N), oxirane (saturated, O), thiirane (saturated, S).</p>`}
 ],
