DEEP.genetics[3]={en:`
<p>Lecture 3 follows the RNA after it is made. First, the chromatin must open so the gene can be transcribed at all. Then the new pre-mRNA is <b>processed</b> (spliced, capped, tailed) before it leaves the nucleus. Finally it is <b>translated</b> into protein. The big picture is the flow of genetic information: <b>DNA → (transcription) → RNA → (translation) → protein</b>. Proteins are the link between <b>genotype</b> (the DNA you inherit) and <b>phenotype</b> (the traits you show): hormones, antibodies, enzymes, muscle, cartilage and more.</p>

<h4>1. Chromatin structure controls access to genes</h4>
<p>When histones grip DNA tightly, RNA polymerase can't reach the promoter, so the gene stays silent. One job of <b>enhancers</b> is to loosen this grip. Changing nucleosome structure like this is called <b>chromatin remodeling</b>.</p>
<h5>How histone acetylation opens chromatin</h5>
<ol>
<li>An <b>activator protein</b> binds a specific enhancer.</li>
<li>It recruits <b>histone acetyltransferase (HAT)</b> to the same place.</li>
<li>HAT adds acetyl groups to the amino groups of lysines on the histones.</li>
<li>This <b>lowers the histones' basicity</b> (removes positive charge), so they hold the negatively charged DNA less tightly.</li>
<li>DNA and histones separate, the <b>promoter is exposed</b>, and RNA polymerase can bind.</li>
</ol>
<p>To switch the gene off again, <b>histone deacetylase (HDAC)</b> removes the acetyl groups and the tight nucleosome structure returns.</p>
<div class="pearl"><strong>Rule:</strong> acetylation = open = ON. Deacetylation = closed = OFF.</div>

<h4>2. Post-transcriptional modification</h4>
<p>The first transcript of a eukaryotic structural gene is long and unfinished. It is called <b>pre-mRNA</b> or <b>heterogeneous nuclear RNA (hnRNA)</b>. Before leaving the nucleus it is modified in two groups of ways: (1) <b>splicing</b>, and (2) <b>editing, trimming, capping and tailing</b>.</p>
<h5>Splicing</h5>
<p>The coding sequences (<b>exons</b>) are interrupted by non-coding <b>introns</b>. Splicing <b>removes the introns</b> and <b>joins the exons</b> with phosphodiester bonds. There are three mechanisms:</p>
<ul>
<li>the <b>spliceosome</b> (used for pre-mRNA);</li>
<li><b>group I self-splicing</b> introns;</li>
<li><b>group II self-splicing</b> introns (the RNA itself catalyses its own splicing).</li>
</ul>
<p>Splicing is common in eukaryotic structural genes, but it also happens in some rRNA and tRNA genes and a few bacterial genes.</p>
<h5>The spliceosome</h5>
<p>The spliceosome is a large complex built from subunits called <b>snRNPs ("snurps")</b>. Each snRNP is <b>small nuclear RNA + proteins</b>. Its subunits do three jobs:</p>
<ol>
<li>bind the intron and <b>precisely recognise the intron–exon boundaries</b> (remember introns start GT and end AG in DNA, GU…AG in RNA);</li>
<li><b>hold the pre-mRNA</b> in the correct shape;</li>
<li><b>catalyse the reactions</b> that cut out the intron and link the exons covalently. The free 3'-OH of exon 1 attacks and joins to exon 2.</li>
</ol>
<h5>Why introns are useful: alternative splicing</h5>
<p>A pre-mRNA with several introns can be spliced in <b>different ways</b>, keeping different combinations of exons. This can differ between <b>cell types</b> or <b>stages of development</b>. So <b>one gene can make two or more different polypeptides</b>, which means an organism needs fewer genes. Also, proteins are often built from separate <b>domains</b>, and different exons often code for different domains. Shuffling exons during evolution (<b>exon shuffling</b>) can create new proteins.</p>
<h5>Trimming and editing</h5>
<ul>
<li><b>Trimming</b>: many non-structural genes (rRNA, tRNA) are first transcribed as one large RNA, which is then <b>cut enzymatically</b> into smaller functional pieces.</li>
<li><b>Editing and base modification</b> happen in tRNA transcripts.</li>
</ul>
<h5>The 5' cap</h5>
<p>Most mature eukaryotic mRNAs carry a <b>7-methylguanosine</b> covalently attached at the 5' end. It is added <b>while pol II is still transcribing</b>, when the transcript is only <b>20–25 bases long</b>. Cap-binding proteins recognise it. The cap:</p>
<ul>
<li>helps <b>move the mRNA out to the cytoplasm</b>;</li>
<li>is needed for the <b>early stages of translation</b> (it is the ribosome's binding site);</li>
<li><b>protects the RNA from nucleases</b>;</li>
<li>helps with <b>splicing</b> of introns.</li>
</ul>
<h5>The 3' poly-A tail</h5>
<p>Most mature mRNAs end in a string of adenines: the <b>poly-A tail</b>. It is <b>not encoded in the gene</b>; an enzyme adds it <b>after transcription is complete</b> (after the cut downstream of the AAUAAA signal). Its length varies between species, from a few dozen to several hundred A's. It is important for <b>mRNA stability</b> and for <b>translation</b>.</p>

<h4>3. Translation: the molecules involved</h4>
<p>Translation is the <b>RNA-directed synthesis of a polypeptide</b>. It uses three kinds of RNA: <b>mRNA</b> (the message), <b>tRNA</b> (the adaptor) and <b>rRNA</b> (inside the ribosome).</p>
<h5>tRNA</h5>
<ul>
<li>A single RNA strand only about <b>80 nucleotides</b> long. Internal hydrogen bonds fold it into a roughly <b>L-shaped</b> 3D molecule.</li>
<li>One end carries a <b>specific amino acid</b>; the other end has the <b>anticodon</b>, which base-pairs with a complementary <b>codon</b> on the mRNA.</li>
</ul>
<h5>Accurate translation needs two correct matches</h5>
<ol>
<li><b>tRNA ↔ amino acid</b>: the enzyme <b>aminoacyl-tRNA synthetase</b> attaches the right amino acid to the right tRNA, using ATP (ATP → AMP + PPi). The product is an <b>aminoacyl-tRNA</b>, also called a "charged tRNA".</li>
<li><b>anticodon ↔ codon</b>: the tRNA anticodon must pair with the mRNA codon.</li>
</ol>
<p><b>Wobble</b>: pairing is flexible at the <b>third base of the codon only</b>; the first two must match exactly. At the wobble position <b>G can pair with C or U</b> (and so U can pair with A or G). This lets one tRNA read more than one codon.</p>
<h5>The ribosome</h5>
<ul>
<li>Two subunits, large and small, made of <b>rRNA (40%) and protein (60%)</b>. In eukaryotes: small <b>40S</b> and large <b>60S</b>.</li>
<li>It couples tRNA anticodons to mRNA codons.</li>
<li>Three tRNA binding sites, spanning both subunits:
<ul><li><b>A site</b> (aminoacyl): accepts the incoming tRNA that matches the codon sitting there;</li>
<li><b>P site</b> (peptidyl): holds the tRNA carrying the growing chain;</li>
<li><b>E site</b> (exit): the empty tRNA about to leave.</li></ul></li>
<li>The growing polypeptide leaves through an <b>exit tunnel</b> in the large subunit.</li>
</ul>

<h4>4. The three stages of translation</h4>
<p>All three stages need helper protein <b>factors</b> (initiation, elongation and release factors).</p>
<h5>Initiation</h5>
<p>The start codon <b>5'-AUG</b> must be found. It codes for <b>methionine</b>, which is nearly always the first amino acid. The <b>small 40S subunit binds at the 5' cap</b> and scans to AUG; initiation factors then bring in the <b>large 60S subunit</b> to complete the initiation complex. The initiator Met-tRNA sits in the P site.</p>
<h5>Elongation: a three-step cycle</h5>
<ol>
<li><b>Codon recognition</b>: the aminoacyl-tRNA complementary to the next codon binds the <b>A site</b>. This uses energy from <b>GTP</b> hydrolysis.</li>
<li><b>Peptide bond formation</b>: the chain in the P site is transferred onto the amino acid in the A site and joined by a peptide bond. The tRNA in the P site is now empty.</li>
<li><b>Translocation</b>: the ribosome moves one codon along the mRNA, again using <b>GTP</b>. The chain-carrying tRNA is now in the P site, the empty tRNA leaves from the E site, and the A site is free for the next aminoacyl-tRNA.</li>
</ol>
<p>The chain grows from the <b>N-terminus</b> (methionine) to the <b>C-terminus</b> (the last amino acid).</p>
<h5>Termination</h5>
<p>When one of the three <b>stop codons</b> enters the A site, no tRNA binds it. Instead the bond between the polypeptide and the tRNA in the P site is <b>hydrolysed</b> (a water molecule is added), releasing the polypeptide into the cytoplasm. The two subunits separate, ready for another round.</p>
<h5>Polyribosomes</h5>
<p>Several ribosomes can translate the same mRNA at once, one behind another. This is a <b>polyribosome (polysome)</b>, and it lets the cell make many copies of a protein very quickly.</p>
<div class="pearl"><strong>Quick check:</strong> GTP is used twice per cycle (codon recognition and translocation). ATP is used by aminoacyl-tRNA synthetase to charge the tRNA.</div>
`,ar:`
<p>المحاضرة دي بتتابع الـ RNA بعد ما يتعمل. الأول لازم الكروماتين يتفتح عشان الجين يتنسخ أصلًا. بعدين الـ pre-mRNA الجديد بيتـ<b>عالج</b> (splicing و cap و tail) قبل ما يخرج من النواة. وفي الآخر بيتـ<b>ترجم</b> لبروتين. الصورة الكبيرة هي سريان المعلومة الوراثية: <b>DNA ← (نسخ) ← RNA ← (ترجمة) ← بروتين</b>. البروتينات هي الرابط بين الـ <b>genotype</b> (الـ DNA اللي ورثتيه) والـ <b>phenotype</b> (الصفات اللي بتظهر): هرمونات، أجسام مضادة، إنزيمات، عضلات، غضاريف وغيرها.</p>

<h4>1. شكل الكروماتين بيتحكم في الوصول للجين</h4>
<p>لما الهستونات تكون ماسكة الـ DNA جامد، الـ RNA polymerase ما يقدرش يوصل للـ promoter، فالجين يفضل ساكت. من وظايف الـ <b>enhancers</b> إنها تفك المسكة دي. تغيير تركيب الـ nucleosome بالشكل ده اسمه <b>chromatin remodeling</b>.</p>
<h5>الـ acetylation بيفتح الكروماتين إزاي؟</h5>
<ol>
<li>بروتين <b>activator</b> بيرتبط بـ enhancer معين.</li>
<li>بيجيب إنزيم <b>histone acetyltransferase (HAT)</b> لنفس المكان.</li>
<li>الـ HAT بيضيف مجموعات acetyl على مجموعات الأمين في الليسين بتاع الهستونات.</li>
<li>ده <b>بيقلل قاعدية الهستونات</b> (بيشيل الشحنة الموجبة)، فمسكتها للـ DNA السالب تضعف.</li>
<li>الـ DNA يبعد عن الهستونات، والـ <b>promoter يتكشف</b>، والـ RNA polymerase يقدر يرتبط.</li>
</ol>
<p>ولما نحب نطفي الجين تاني، إنزيم <b>histone deacetylase (HDAC)</b> بيشيل الـ acetyl والـ nucleosome يرجع يتقفل.</p>
<div class="pearl"><strong>القاعدة:</strong> acetylation = مفتوح = شغال. deacetylation = مقفول = مطفي.</div>

<h4>2. التعديلات بعد النسخ</h4>
<p>أول ناتج من الجين في الـ eukaryotes بيكون طويل ومش جاهز، واسمه <b>pre-mRNA</b> أو <b>hnRNA</b>. قبل ما يخرج من النواة بيتعدل بطريقتين: (1) <b>splicing</b>، و(2) <b>editing و trimming و capping و tailing</b>.</p>
<h5>الـ Splicing</h5>
<p>الأجزاء اللي بتشفّر (<b>exons</b>) بيقطعها أجزاء مش بتشفّر (<b>introns</b>). الـ splicing بيـ<b>شيل الـ introns</b> و<b>يوصّل الـ exons</b> بروابط phosphodiester. فيه 3 آليات:</p>
<ul>
<li>الـ <b>spliceosome</b> (للـ pre-mRNA)؛</li>
<li><b>group I self-splicing</b>؛</li>
<li><b>group II self-splicing</b> (الـ RNA نفسه بيعمل الـ splicing لنفسه).</li>
</ul>
<p>الـ splicing شائع في الجينات اللي بتشفّر لبروتين في الـ eukaryotes، بس بيحصل كمان في بعض جينات الـ rRNA والـ tRNA وشوية جينات بكتيرية.</p>
<h5>الـ Spliceosome</h5>
<p>مركّب كبير مكوَّن من وحدات اسمها <b>snRNPs (snurps)</b>، وكل واحدة = <b>small nuclear RNA + بروتينات</b>. وحداته بتعمل 3 حاجات:</p>
<ol>
<li>ترتبط بالـ intron و<b>تحدد حدود الـ intron والـ exon بدقة</b> (افتكري الـ intron بيبدأ GT وينتهي AG في الـ DNA، يعني GU…AG في الـ RNA)؛</li>
<li><b>تمسك الـ pre-mRNA</b> في الشكل الصح؛</li>
<li><b>تعمل التفاعلات</b> اللي بتقص الـ intron وتوصّل الـ exons. الـ 3'-OH الحر بتاع exon 1 بيهاجم ويرتبط بـ exon 2.</li>
</ol>
<h5>فايدة الـ introns: الـ Alternative splicing</h5>
<p>الـ pre-mRNA اللي فيه كذا intron ممكن يتعمله splicing <b>بطرق مختلفة</b>، فنحتفظ بتوليفات مختلفة من الـ exons. ده ممكن يختلف من <b>نوع خلية لنوع</b> أو من <b>مرحلة نمو لمرحلة</b>. يعني <b>جين واحد يدي بروتينين أو أكتر</b>، والكائن يحتاج جينات أقل. كمان البروتينات غالبًا متقسمة <b>domains</b>، وكل exon غالبًا بيشفّر لـ domain. وخلط الـ exons على مدار التطور (<b>exon shuffling</b>) ممكن يطلّع بروتينات جديدة.</p>
<h5>الـ Trimming والـ Editing</h5>
<ul>
<li><b>Trimming</b>: جينات كتير مش بتشفّر لبروتين (rRNA و tRNA) بتتنسخ الأول RNA واحد كبير، وبعدين <b>بيتقطع بإنزيمات</b> لحتت أصغر شغالة.</li>
<li><b>Editing وتعديل القواعد</b> بيحصل في الـ tRNA.</li>
</ul>
<h5>الـ 5' cap</h5>
<p>معظم الـ mRNA الناضج عنده <b>7-methylguanosine</b> مربوط بالطرف 5'. بيتضاف <b>والـ pol II لسه بينسخ</b>، لما يكون طول الناتج <b>20–25 قاعدة</b> بس. بروتينات اسمها cap-binding proteins بتتعرف عليه. وظايف الـ cap:</p>
<ul>
<li>يساعد الـ mRNA <b>يخرج للسيتوبلازم</b>؛</li>
<li>مهم في <b>أول مراحل الترجمة</b> (مكان ارتباط الريبوسوم)؛</li>
<li><b>يحمي الـ RNA من الـ nucleases</b>؛</li>
<li>يساعد في <b>الـ splicing</b>.</li>
</ul>
<h5>الـ Poly-A tail عند 3'</h5>
<p>معظم الـ mRNA الناضج بينتهي بسلسلة A اسمها <b>poly-A tail</b>. هي <b>مش موجودة في الجين</b>، إنزيم بيضيفها <b>بعد ما النسخ يخلص</b> (بعد القطع اللي بعد إشارة AAUAAA). طولها بيختلف من كائن للتاني، من كام عشرة لكام مية A. وهي مهمة لـ <b>ثبات الـ mRNA</b> ولـ <b>الترجمة</b>.</p>

<h4>3. الترجمة: الجزيئات المشاركة</h4>
<p>الترجمة هي <b>تصنيع سلسلة ببتيد بتوجيه من الـ RNA</b>، وبتستخدم 3 أنواع RNA: <b>mRNA</b> (الرسالة)، <b>tRNA</b> (الوسيط)، و<b>rRNA</b> (جوه الريبوسوم).</p>
<h5>الـ tRNA</h5>
<ul>
<li>شريط RNA واحد طوله حوالي <b>80 نيوكليوتيد</b> بس. الروابط الهيدروجينية جواه بتطبّقه لشكل <b>حرف L</b> تقريبًا.</li>
<li>طرف شايل <b>حمض أميني معين</b>، والطرف التاني فيه الـ <b>anticodon</b> اللي بيتزاوج مع الـ <b>codon</b> المكمّل على الـ mRNA.</li>
</ul>
<h5>الترجمة الدقيقة محتاجة تطابقين صح</h5>
<ol>
<li><b>tRNA مع الحمض الأميني</b>: إنزيم <b>aminoacyl-tRNA synthetase</b> بيربط الحمض الأميني الصح بالـ tRNA الصح، وبيستخدم ATP (ATP → AMP + PPi). الناتج اسمه <b>aminoacyl-tRNA</b> أو "charged tRNA".</li>
<li><b>anticodon مع codon</b>: الـ anticodon لازم يتزاوج مع الكودون على الـ mRNA.</li>
</ol>
<p><b>Wobble</b>: التزاوج بيبقى مرن في <b>القاعدة التالتة من الكودون بس</b>، وأول اتنين لازم يتطابقوا بالظبط. في مكان الـ wobble، <b>G ممكن تتزاوج مع C أو U</b> (وبالتالي U مع A أو G). وده بيخلي tRNA واحد يقرا أكتر من كودون.</p>
<h5>الريبوسوم</h5>
<ul>
<li>وحدتين كبيرة وصغيرة، مكوّنين من <b>rRNA (40%) وبروتين (60%)</b>. في الـ eukaryotes: الصغيرة <b>40S</b> والكبيرة <b>60S</b>.</li>
<li>وظيفته يربط الـ anticodon بالـ codon.</li>
<li>فيه 3 أماكن للـ tRNA، ممتدة على الوحدتين:
<ul><li><b>A site</b>: بيستقبل الـ tRNA الجديد اللي بيطابق الكودون اللي واقف فيه؛</li>
<li><b>P site</b>: فيه الـ tRNA الشايل السلسلة اللي بتكبر؛</li>
<li><b>E site</b>: الـ tRNA الفاضي اللي خارج.</li></ul></li>
<li>السلسلة اللي بتكبر بتطلع من <b>exit tunnel</b> في الوحدة الكبيرة.</li>
</ul>

<h4>4. مراحل الترجمة التلاتة</h4>
<p>المراحل التلاتة محتاجة <b>factors</b> بروتينية مساعدة.</p>
<h5>البداية (Initiation)</h5>
<p>لازم نلاقي كودون البداية <b>AUG</b> عند 5'، وهو بيشفّر لـ <b>methionine</b> اللي تقريبًا دايمًا أول حمض أميني. الوحدة <b>الصغيرة 40S بترتبط عند الـ 5' cap</b> وتمشي لحد AUG، وبعدين الـ initiation factors بتجيب الوحدة <b>الكبيرة 60S</b> فيكتمل الـ initiation complex. الـ Met-tRNA بيكون في الـ P site.</p>
<h5>الاستطالة: دورة من 3 خطوات</h5>
<ol>
<li><b>التعرف على الكودون</b>: الـ aminoacyl-tRNA المكمّل للكودون اللي جاي بيدخل الـ <b>A site</b>، باستخدام طاقة من تكسير <b>GTP</b>.</li>
<li><b>تكوين الرابطة الببتيدية</b>: السلسلة اللي في الـ P site بتتنقل على الحمض الأميني اللي في الـ A site وتترابط برابطة ببتيدية، والـ tRNA اللي في الـ P site يبقى فاضي.</li>
<li><b>Translocation</b>: الريبوسوم يتحرك كودون واحد على الـ mRNA، باستخدام <b>GTP</b> برضه. الـ tRNA الشايل السلسلة يبقى في الـ P site، والفاضي يخرج من الـ E site، والـ A site يفضى للي بعده.</li>
</ol>
<p>السلسلة بتكبر من الطرف <b>N</b> (الميثيونين) للطرف <b>C</b> (آخر حمض أميني).</p>
<h5>النهاية (Termination)</h5>
<p>لما واحد من الـ <b>stop codons</b> التلاتة يدخل الـ A site، مفيش tRNA بيرتبط بيه. بدل كده الرابطة بين السلسلة والـ tRNA اللي في الـ P site <b>بتتكسر بالماء (hydrolysis)</b>، والسلسلة تتحرر في السيتوبلازم. والوحدتين يفترقوا ويستعدوا لدورة جديدة.</p>
<h5>الـ Polyribosomes</h5>
<p>كذا ريبوسوم ممكن يترجموا نفس الـ mRNA في نفس الوقت ورا بعض. ده اسمه <b>polysome</b>، وبيخلي الخلية تعمل نسخ كتير من البروتين بسرعة جدًا.</p>
<div class="pearl"><strong>مراجعة سريعة:</strong> الـ GTP بيُستخدم مرتين في كل دورة (التعرف على الكودون والـ translocation). والـ ATP بيستخدمه الـ aminoacyl-tRNA synthetase عشان يشحن الـ tRNA.</div>

DEEP.genetics[4]={en:`
<p>A freshly translated polypeptide is usually not yet a working protein. It must fold, sometimes join other subunits, and very often be <b>chemically modified</b>. Those modifications are <b>post-translational modifications (PTMs)</b>, the main subject of this lecture. The second part explains the <b>genetic code</b>, the dictionary used to read codons during translation.</p>

<h4>1. What PTMs are and why they matter</h4>
<p>A PTM is any <b>chemical change made to a protein after it has been produced</b>. PTMs can change a protein's <b>structure</b>, its <b>electrophilicity</b> (charge) and its <b>interactions</b> with other molecules.</p>
<h5>PTMs multiply protein diversity</h5>
<p>Our genome has only about <b>20,000–25,000 genes</b>, yet the proteome (all the proteins) is estimated at over <b>1 million</b> proteins. Two layers explain the gap:</p>
<ol>
<li>At the RNA level, mainly through <b>alternative splicing</b>, the transcriptome becomes larger than the genome.</li>
<li>The many different PTMs then expand the proteome <b>exponentially</b> beyond both.</li>
</ol>
<h5>What PTMs are for</h5>
<ul>
<li><b>Targeting</b>: sending the protein to the right place (e.g. some lipoproteins).</li>
<li><b>Stability</b> (e.g. secreted glycoproteins).</li>
<li><b>Function</b> (e.g. surface glycoproteins).</li>
<li><b>Control of activity</b> (e.g. clotting factors, caspases that are switched on by cutting).</li>
</ul>
<p>Most PTMs are made by <b>enzymes that recognise specific target sequences</b>. They regulate folding, send proteins to particular compartments, control interactions with ligands and other proteins, and switch catalytic activity or signalling on and off.</p>

<h4>2. Classifying PTMs</h4>
<ul>
<li><b>I. Addition of chemical groups</b>: phosphorylation, acetylation, hydroxylation, methylation.</li>
<li><b>II. Addition of complex groups</b>: glycosylation, AMPylation, lipidation.</li>
<li><b>III. Addition of polypeptides</b>: ubiquitination.</li>
<li><b>IV. Cleavage of proteins</b>: proteolysis.</li>
</ul>

<h4>3. The PTMs you must know in detail</h4>
<h5>Phosphorylation</h5>
<ul>
<li>A phosphate group is added to <b>serine, threonine or tyrosine</b>. It is <b>reversible</b>.</li>
<li><b>Kinases</b> add phosphate; <b>phosphatases</b> remove it.</li>
<li>It turns an uncharged region into a <b>negatively charged, hydrophilic</b> one, which changes the protein's shape (conformation) and therefore its activity.</li>
<li>It is involved in the cell cycle, growth, apoptosis and signal transduction.</li>
<li><b>Example 1 (activation)</b>: the tumour-suppressor <b>p53 is activated</b> when several kinases phosphorylate its N-terminus.</li>
<li><b>Example 2 (inhibition)</b>: <b>acetyl-CoA carboxylase</b>, the key enzyme of fatty acid synthesis, is <b>inhibited by phosphorylation</b> and <b>activated by dephosphorylation</b>.</li>
</ul>
<div class="pearl"><strong>Watch out:</strong> phosphorylation does not always mean "on". It activates p53 but switches acetyl-CoA carboxylase off.</div>
<h5>Hydroxylation</h5>
<p>Adds an <b>–OH group</b>, catalysed by <b>hydroxylases</b>. It makes hydrophobic parts more hydrophilic. Most common on <b>lysine and proline</b>, classically in <b>collagen</b>.</p>
<h5>Acetylation</h5>
<p>Adds an acetyl group. It affects protein stability, location and synthesis, apoptosis, cancer and DNA stability. On <b>histones</b>, acetylation removes positive charge, so histones bind the negatively charged DNA phosphates less tightly and the DNA becomes accessible for transcription (as in Lecture 3).</p>
<h5>Methylation</h5>
<p><b>Methyltransferases</b> add a methyl group to <b>lysine or arginine</b>. <b>Arginine can be methylated once or twice</b>; <b>lysine once, twice or three times</b>. On histones, methylation can either <b>activate or repress</b> genes, depending on which residue is methylated.</p>
<h5>Ubiquitination</h5>
<p><b>Ubiquitin</b> is a small regulatory protein (<b>8.6 kDa</b>) found in almost all eukaryotic tissues, hence its name ("ubiquitous"). Attaching it can:</p>
<ul>
<li><b>mark the protein for degradation by the proteasome</b> (the classic role);</li>
<li>change its location in the cell;</li>
<li>change its activity;</li>
<li>promote or prevent interactions with other proteins.</li>
</ul>
<p>A single ubiquitin is <b>monoubiquitination</b>; a chain is <b>polyubiquitination</b>. Each extra ubiquitin in a chain is linked to one of the <b>seven lysines</b> or to the <b>N-terminal methionine</b> of the previous ubiquitin.</p>
<h5>Proteolysis</h5>
<p>Breaking a protein into smaller polypeptides or amino acids. Examples: <b>removal of the N-terminal methionine</b>, and cutting off a <b>signal peptide</b> or pro-segment so an inactive precursor becomes active.</p>
<h5>Carboxylation (and iodination)</h5>
<p>Carboxylation is done by <b>γ-glutamyl carboxylase</b> and <b>requires vitamin K</b>. It is essential for clotting factors, which is why vitamin K deficiency or warfarin causes bleeding.</p>

<h4>4. Folding and the functional protein</h4>
<p>Translation alone does not give a working protein. During and after synthesis the chain <b>folds spontaneously</b> into its 3D shape. Several polypeptides may assemble as subunits of a protein with <b>quaternary structure</b>. Many proteins then need PTMs, or need to be <b>cut by enzymes</b>, before they become active.</p>

<h4>5. Case study: Nobel Prize 2019, how cells sense oxygen</h4>
<p>William Kaelin, Peter Ratcliffe and Gregg Semenza won for discovering how cells sense and adapt to oxygen through PTMs of the protein <b>HIF-1α</b> (hypoxia-inducible factor).</p>
<ul>
<li>HIF-1α is a transcription factor that controls the response to low oxygen. One of its targets is the <b>erythropoietin (EPO)</b> gene; EPO is the hormone that increases red blood cell production.</li>
<li><b>Normal oxygen</b>: cells contain very little HIF-1α, because:
<ol><li>hydroxyl groups are added at <b>two specific prolines</b> (<b>prolyl hydroxylation</b>);</li>
<li>this lets the <b>VHL</b> protein recognise and bind HIF-1α;</li>
<li><b>ubiquitin</b> is attached, tagging it;</li>
<li>the <b>proteasome degrades</b> it.</li></ol></li>
<li><b>Low oxygen</b>: the hydroxylation can't happen, VHL can't bind, so HIF-1α <b>accumulates</b>, enters the nucleus and switches on genes such as EPO.</li>
</ul>
<div class="pearl"><strong>Why this case matters:</strong> it combines two PTMs from this lecture, hydroxylation and ubiquitination, in one pathway.</div>

<h4>6. The genetic code</h4>
<p>The code is read in three-letter "words" called <b>codons</b>. Each codon on the mRNA codes for one amino acid (or a stop signal).</p>
<ul>
<li>There are 4 bases for each of 3 positions, so <b>4 × 4 × 4 = 64 codons</b>.</li>
<li><b>61</b> codons specify amino acids; <b>3</b> are <b>stop (chain-terminating)</b> codons that code for no amino acid.</li>
<li><b>AUG</b> codes for <b>methionine</b> and is also the <b>start</b> codon.</li>
<li>There are only <b>20 amino acids</b> for 61 codons, so most amino acids have <b>more than one codon</b>. This is the <b>redundancy</b> (degeneracy) of the code.</li>
<li>Read the standard codon wheel from the <b>centre outwards</b> (first, then second, then third base).</li>
</ul>
<h5>How to translate a sequence</h5>
<ol><li>Find AUG (the start).</li><li>Split into triplets from there.</li><li>Look up each codon.</li><li>Stop at the first stop codon (UAA, UAG or UGA).</li></ol>
<div class="ex"><b>Example 1:</b> UCGCACGGUCAGGUGCAC → UCG-CAC-GGU-CAG-GUG-CAC → Ser-His-Gly-Gln-Val-His.</div>
<div class="ex"><b>Example 2 (lecture "Your turn"):</b> AUGGUGCCACGAAGGUGA → AUG-GUG-CCA-CGA-AGG-UGA → Met-Val-Pro-Arg-Arg-Stop. Note that CGA and AGG both give arginine: redundancy in action.</div>
<div class="ex"><b>Lecture practice:</b> GGG = glycine, UCA = serine, CAU = histidine, GCA = alanine, AAA = lysine.</div>

<p>السلسلة الببتيدية اللي لسه متترجمة غالبًا مش بروتين شغال لسه. لازم تتطبّق، وأحيانًا تتجمع مع وحدات تانية، وكتير جدًا بتتـ<b>عدّل كيميائيًا</b>. التعديلات دي اسمها <b>post-translational modifications (PTMs)</b>، وهي موضوع المحاضرة الأساسي. الجزء التاني بيشرح <b>الشفرة الوراثية</b>، القاموس اللي بنقرا بيه الكودونات في الترجمة.</p>

<h4>1. يعني إيه PTMs وليه مهمة؟</h4>
<p>الـ PTM هو أي <b>تغيير كيميائي بيحصل للبروتين بعد ما يتصنع</b>. ممكن يغيّر <b>تركيب</b> البروتين، و<b>شحنته</b> (electrophilicity)، و<b>تفاعلاته</b> مع الجزيئات التانية.</p>
<h5>الـ PTMs بتضاعف تنوع البروتينات</h5>
<p>الجينوم فيه حوالي <b>20–25 ألف جين</b> بس، والبروتيوم (كل البروتينات) متقدّر بأكتر من <b>مليون</b> بروتين. فيه طبقتين بيفسروا الفرق:</p>
<ol>
<li>على مستوى الـ RNA، أساسًا بالـ <b>alternative splicing</b>، الـ transcriptome بيبقى أكبر من الجينوم.</li>
<li>وبعدين الـ PTMs الكتير المختلفة بتكبّر البروتيوم <b>بشكل أُسّي</b> فوق الاتنين.</li>
</ol>
<h5>الـ PTMs بتتعمل ليه؟</h5>
<ul>
<li><b>Targeting</b>: توصيل البروتين لمكانه الصح (زي بعض الـ lipoproteins).</li>
<li><b>الثبات</b> (زي الـ glycoproteins اللي بتتفرز).</li>
<li><b>الوظيفة</b> (زي الـ glycoproteins اللي على سطح الخلية).</li>
<li><b>التحكم في النشاط</b> (زي عوامل التجلط والـ caspases اللي بتشتغل لما تتقطع).</li>
</ul>
<p>معظم الـ PTMs بتعملها <b>إنزيمات بتتعرف على تسلسلات معينة</b> في البروتين. وبتنظم التطبيق، وبتبعت البروتين لأماكن معينة في الخلية، وبتتحكم في تفاعله مع الـ ligands والبروتينات التانية، وبتشغّل أو تطفي النشاط الإنزيمي أو الإشارات.</p>

<h4>2. تقسيم الـ PTMs</h4>
<ul>
<li><b>I. إضافة مجموعات كيميائية</b>: phosphorylation و acetylation و hydroxylation و methylation.</li>
<li><b>II. إضافة مجموعات معقدة</b>: glycosylation و AMPylation و lipidation.</li>
<li><b>III. إضافة ببتيدات</b>: ubiquitination.</li>
<li><b>IV. تقطيع البروتين</b>: proteolysis.</li>
</ul>

<h4>3. الـ PTMs اللي لازم تعرفيها بالتفصيل</h4>
<h5>Phosphorylation</h5>
<ul>
<li>إضافة مجموعة فوسفات على <b>serine أو threonine أو tyrosine</b>، وهي <b>عكسية</b>.</li>
<li>الـ <b>kinases</b> بتضيف، والـ <b>phosphatases</b> بتشيل.</li>
<li>بتحوّل منطقة متعادلة لمنطقة <b>سالبة الشحنة ومحبة للماء</b>، فشكل البروتين يتغير وبالتالي نشاطه.</li>
<li>داخلة في دورة الخلية، والنمو، والـ apoptosis، ونقل الإشارات.</li>
<li><b>مثال 1 (تنشيط)</b>: بروتين <b>p53</b> المضاد للأورام <b>بيتنشط</b> لما كذا kinase يعملوا phosphorylation للطرف N بتاعه.</li>
<li><b>مثال 2 (تثبيط)</b>: إنزيم <b>acetyl-CoA carboxylase</b> (الإنزيم الأساسي في تصنيع الأحماض الدهنية) <b>بيتثبط بالـ phosphorylation</b> و<b>بيتنشط بالـ dephosphorylation</b>.</li>
</ul>
<div class="pearl"><strong>خلي بالك:</strong> الـ phosphorylation مش دايمًا معناه "تشغيل". بيشغّل p53 بس بيطفي acetyl-CoA carboxylase.</div>
<h5>Hydroxylation</h5>
<p>إضافة مجموعة <b>OH</b> بإنزيمات اسمها <b>hydroxylases</b>، وبتخلي الأجزاء الكارهة للماء محبة له أكتر. أشهرها على <b>الليسين والبرولين</b>، والمثال الكلاسيكي في <b>الكولاجين</b>.</p>
<h5>Acetylation</h5>
<p>إضافة مجموعة acetyl، وليها دور في ثبات البروتين ومكانه وتصنيعه، والـ apoptosis، والسرطان، وثبات الـ DNA. على <b>الهستونات</b> بتشيل الشحنة الموجبة، فمسكتها للفوسفات السالب في الـ DNA تضعف، والـ DNA يبقى متاح للنسخ (زي محاضرة 3).</p>
<h5>Methylation</h5>
<p>إنزيمات <b>methyltransferases</b> بتضيف مجموعة ميثيل على <b>الليسين أو الأرجينين</b>. <b>الأرجينين ممكن يتمثّل مرة أو مرتين</b>، و<b>الليسين مرة أو مرتين أو 3</b>. على الهستونات، الـ methylation ممكن <b>يشغّل أو يطفي</b> الجين حسب أنهي حمض أميني اتمثّل.</p>
<h5>Ubiquitination</h5>
<p>الـ <b>ubiquitin</b> بروتين تنظيمي صغير (<b>8.6 kDa</b>) موجود تقريبًا في كل أنسجة الـ eukaryotes، ومن هنا اسمه (ubiquitous يعني موجود في كل مكان). إضافته ممكن:</p>
<ul>
<li>تـ<b>علّم البروتين عشان يتكسر في الـ proteasome</b> (الدور الأشهر)؛</li>
<li>تغيّر مكانه في الخلية؛</li>
<li>تغيّر نشاطه؛</li>
<li>تشجّع أو تمنع تفاعله مع بروتينات تانية.</li>
</ul>
<p>إضافة ubiquitin واحد اسمها <b>monoubiquitination</b>، وسلسلة اسمها <b>polyubiquitination</b>. كل ubiquitin زيادة في السلسلة بيترابط بواحد من <b>7 ليسينات</b> أو بالـ <b>methionine عند الطرف N</b> في الـ ubiquitin اللي قبله.</p>
<h5>Proteolysis</h5>
<p>تكسير البروتين لببتيدات أصغر أو أحماض أمينية. أمثلة: <b>شيل الـ methionine الأولاني</b>، وقطع الـ <b>signal peptide</b> أو جزء الـ pro عشان الـ precursor غير النشط يبقى نشط.</p>
<h5>Carboxylation (و Iodination)</h5>
<p>الـ carboxylation بيعملها إنزيم <b>γ-glutamyl carboxylase</b> و<b>محتاجة فيتامين K</b>. وهي ضرورية لعوامل التجلط، وعشان كده نقص فيتامين K أو دوا الـ warfarin بيعملوا نزيف.</p>

<h4>4. التطبيق والبروتين الشغال</h4>
<p>الترجمة لوحدها مش بتدي بروتين شغال. أثناء وبعد التصنيع السلسلة بـ<b>تتطبّق لوحدها</b> لشكلها التلاتي الأبعاد. وممكن كذا سلسلة تتجمع كوحدات لبروتين ليه <b>quaternary structure</b>. وبروتينات كتير بعد كده محتاجة PTMs، أو محتاجة <b>إنزيمات تقطّعها</b>، عشان تشتغل.</p>

<h4>5. حالة دراسية: نوبل 2019، الخلايا بتحس بالأكسجين إزاي</h4>
<p>William Kaelin و Peter Ratcliffe و Gregg Semenza خدوا الجايزة لاكتشاف إزاي الخلايا بتحس بالأكسجين وتتكيف عن طريق PTMs لبروتين <b>HIF-1α</b>.</p>
<ul>
<li>الـ HIF-1α هو transcription factor بيتحكم في استجابة الخلية لنقص الأكسجين، ومن الجينات اللي بيشغّلها جين <b>الإريثروبويتين (EPO)</b>، الهرمون اللي بيزوّد تصنيع كرات الدم الحمرا.</li>
<li><b>في الأكسجين الطبيعي</b>: الخلية فيها HIF-1α قليل جدًا، لأن:
<ol><li>بيتضاف OH على <b>برولينين معينين</b> (<b>prolyl hydroxylation</b>)؛</li>
<li>ده بيخلي بروتين <b>VHL</b> يتعرف عليه ويرتبط بيه؛</li>
<li>بيتضاف <b>ubiquitin</b> كعلامة؛</li>
<li>الـ <b>proteasome بيكسّره</b>.</li></ol></li>
<li><b>في نقص الأكسجين</b>: الـ hydroxylation ما بيحصلش، فالـ VHL ما يرتبطش، والـ HIF-1α <b>يتراكم</b> ويدخل النواة ويشغّل جينات زي EPO.</li>
</ul>
<div class="pearl"><strong>أهمية الحالة دي:</strong> بتجمع اتنين PTMs من المحاضرة، الـ hydroxylation والـ ubiquitination، في مسار واحد.</div>

<h4>6. الشفرة الوراثية</h4>
<p>الشفرة بتتقري في "كلمات" من 3 حروف اسمها <b>codons</b>. كل كودون على الـ mRNA بيشفّر لحمض أميني واحد (أو إشارة وقوف).</p>
<ul>
<li>عندنا 4 قواعد لكل مكان من التلاتة، يعني <bdi>4 × 4 × 4 = 64</bdi> كودون.</li>
<li><b>61</b> كودون بيدّوا أحماض أمينية، و<b>3</b> كودونات <b>وقوف (stop)</b> مش بتدي أي حمض أميني.</li>
<li>الـ <b>AUG</b> بيشفّر لـ <b>methionine</b> وهو كمان كودون <b>البداية</b>.</li>
<li>عندنا <b>20 حمض أميني</b> بس لـ 61 كودون، فمعظم الأحماض الأمينية ليها <b>أكتر من كودون</b>. ده اسمه <b>redundancy</b> (degeneracy) في الشفرة.</li>
<li>عجلة الكودونات بتتقري <b>من المركز لبرّه</b> (القاعدة الأولى، ثم التانية، ثم التالتة).</li>
</ul>
<h5>إزاي تترجمي تسلسل</h5>
<ol><li>دوّري على AUG (البداية).</li><li>قسّمي لتلاتات من عنده.</li><li>دوّري على كل كودون في الجدول.</li><li>وقّفي عند أول stop codon (UAA أو UAG أو UGA).</li></ol>
<div class="ex"><b>مثال 1:</b> <bdi>UCG-CAC-GGU-CAG-GUG-CAC</bdi> ← <bdi>Ser-His-Gly-Gln-Val-His</bdi>.</div>
<div class="ex"><b>مثال 2 (Your turn في المحاضرة):</b> <bdi>AUG-GUG-CCA-CGA-AGG-UGA</bdi> ← <bdi>Met-Val-Pro-Arg-Arg-Stop</bdi>. لاحظي إن CGA و AGG الاتنين بيدّوا arginine: ده الـ redundancy بالظبط.</div>
<div class="ex"><b>تدريب المحاضرة:</b> GGG = glycine، UCA = serine، CAU = histidine، GCA = alanine، AAA = lysine.</div>

DEEP.genetics[5]={en:`
<p>Every cell in your body has the same DNA, yet a liver cell and a neuron make very different proteins. The difference is <b>gene regulation</b>: the cell's ability to control which genes are expressed, when, and how much. This lecture covers the first two of the three epigenetic tools: <b>cis/trans-acting elements</b> (including DNA methylation) and <b>non-coding RNAs</b>, focusing on microRNA. Histone modifications come in Lecture 6.</p>

<h4>1. Why regulate genes?</h4>
<p>Most genes in every species are regulated, so their proteins are made <b>at specific times and in specific amounts</b>. Two kinds of expression:</p>
<ul>
<li><b>Constitutive expression</b>: the gene is <b>always on</b> at a roughly <b>constant level</b>. These genes usually encode proteins needed for survival, for example metabolic enzymes ("housekeeping" genes).</li>
<li><b>Facultative expression</b>: the gene is expressed <b>only under certain conditions</b>, in controlled amounts.</li>
</ul>
<p>The organism benefits in three ways. Gene regulation ensures that:</p>
<ol><li>the cell makes only the proteins it <b>needs</b>;</li><li>genes are expressed in the <b>right cell types</b>;</li><li>genes are expressed at the <b>right stage of development</b>.</li></ol>

<h4>2. Epigenetics</h4>
<p><b>Epigenetics</b> is the study of changes in gene expression that <b>do not involve changing the DNA sequence</b>. Eukaryotes use three epigenetic tools:</p>
<ol><li><b>cis- and trans-acting elements</b>;</li><li><b>non-coding RNAs</b> (miRNAs, circRNAs, lncRNAs);</li><li><b>histone modifications</b>.</li></ol>

<h4>3. Cis- and trans-acting elements in detail</h4>
<p>Recall: <b>cis-acting</b> elements are <b>DNA sequences</b> that act only on nearby genes (TATA box, enhancers, silencers). <b>Trans-acting</b> elements are the <b>proteins</b> that bind them.</p>
<h5>Gene regulatory proteins</h5>
<ul>
<li><b>C/EBPs</b> (CCAAT-enhancer-binding proteins): a family of <b>six</b> transcription factors. Once bound to DNA they recruit <b>co-activators</b>, which either open up chromatin or recruit the basal transcription factors.</li>
<li><b>Sp1</b> (specificity protein 1), encoded by the SP1 gene, is a transcriptional <b>activator</b> of many genes. It binds <b>GC boxes</b> and recruits <b>TFIID and RNA polymerase II</b>.</li>
</ul>
<h5>The promoter and "control at a distance"</h5>
<p>In eukaryotes, sites far away on the chromosome can control transcription. Two features make this flexible:</p>
<ol><li>a set of proteins that help <b>RNA polymerase bind the promoter</b>;</li><li><b>modular regulatory proteins</b> that bind <b>distant sites</b>.</li></ol>
<div class="ex"><b>Lecture example, the thymidine kinase promoter:</b> reading towards the gene it has a GC box (about −100), a CAAT box (about −80), another GC box (about −60) and the TATA box (about −25), where the initiation factor binds.</div>
<h5>Transcription factors and how they assemble</h5>
<ul>
<li><b>Basal factors</b> assemble on the promoter, starting at the TATA sequence about 25 nucleotides upstream. Together they position RNA polymerase at the start of the coding sequence and then release it to transcribe. (They are named by letters such as A, B, E, F, H, roughly according to molecular weight.)</li>
<li><b>Activators</b> bind <b>enhancers</b>, often far away. When the DNA <b>loops</b> so that the enhancer comes close to the transcription complex, the activator touches the complex and <b>increases the rate</b> of transcription.</li>
<li><b>Repressors</b> bind <b>silencers</b> and stop activators binding nearby enhancers, which <b>slows</b> transcription.</li>
<li><b>Coactivators</b> pass the signal from activators to the basal factors.</li>
</ul>
<h5>The activator has two domains</h5>
<ol>
<li>A <b>DNA-binding domain</b> that attaches the protein to a specific DNA site using a structural motif (motifs are in Lecture 6). At enhancers, activators recruit <b>histone acetyltransferase</b>, opening chromatin.</li>
<li>A <b>regulatory domain</b> that interacts with other regulatory proteins, such as coactivators.</li>
</ol>
<p>Because regulatory sites can be far away, many different sequences scattered along the DNA can all influence one gene.</p>
<h5>Promoter blocking by nucleosomes</h5>
<p>As in Lecture 3, tight histone–DNA binding blocks RNA polymerase. Enhancers help loosen it (chromatin remodeling).</p>

<h4>4. DNA methylation</h4>
<p>The enzyme <b>DNA methylase</b> attaches methyl groups (–CH₃) covalently to DNA. Methylation usually <b>inhibits transcription</b>, especially near the promoter.</p>
<ul>
<li>In vertebrates and flowering plants, many genes have <b>CpG islands</b> near their promoters: stretches where C is followed by G, linked by a phosphodiester bond. The C in these sites can be methylated.</li>
<li><b>Unmethylated CpG islands = active genes</b>. <b>Methylated CpG islands = repressed genes</b>.</li>
</ul>
<p>Methylation blocks transcription in two ways:</p>
<ol>
<li><b>Directly</b>: methylated CpG in the GC box stops <b>Sp1</b> from binding, so initiation fails.</li>
<li><b>Through chromatin</b>: a <b>methyl-CpG binding protein</b> binds the methylated island and recruits other proteins, such as <b>histone deacetylase</b>. These convert the chromatin from <b>open to closed</b>.</li>
</ol>

<h4>5. Non-coding RNAs</h4>
<p>About <b>90% of the primary RNA transcript is removed</b> during processing to make mature mRNA. (Splicing recap: snRNPs bind the 5' end of the intron; the intron forms a loop, its 5' end is cut and linked near its 3' end; the loop is removed and the exons are joined; the spliceosome releases the mature mRNA.)</p>
<p><b>Non-coding RNAs (ncRNAs)</b> are RNAs that are <b>transcribed from DNA but not translated</b> into protein. They are generated through specific alternative splicing and regulate gene expression at three levels: <b>transcriptional</b>, <b>post-transcriptional</b> and <b>translational</b>. The main types are <b>microRNA (miRNA)</b>, <b>long non-coding RNA (lncRNA)</b> and <b>circular RNA (circRNA)</b>.</p>
<p><b>Nobel Prize 2024</b> (Physiology or Medicine): Victor Ambros and Gary Ruvkun, for the discovery of microRNA and its role in post-transcriptional gene regulation.</p>
<h5>microRNA (miRNA)</h5>
<ul>
<li>A <b>single-stranded</b> non-coding RNA about <b>22 nucleotides</b> long.</li>
<li>It binds a complementary sequence in the <b>3' untranslated region (3'UTR)</b> of a target mRNA.</li>
<li>It silences that gene by <b>degrading the transcript</b> or <b>suppressing its translation</b>.</li>
</ul>
<h5>How miRNA is made (biogenesis)</h5>
<ol>
<li><b>RNA polymerase II</b> transcribes it as a <b>hairpin</b> (a double-stranded, self-complementary RNA).</li>
<li>The double-strand-cutting enzyme <b>Dicer</b> cuts the hairpin into small fragments.</li>
<li>The mature miRNA joins a protein complex called <b>RISC</b> (RNA-induced silencing complex). It then inhibits protein synthesis only from its <b>specific</b> target mRNA.</li>
</ol>

<h4>6. Case study: miRNA-181 and telomerase</h4>
<p>Studies show that <b>miRNA-181 regulates the level and function of telomerase</b>.</p>
<ol>
<li><b>Target site?</b> The <b>3'UTR of the telomerase mRNA</b>.</li>
<li><b>Over-expression of miRNA-181?</b> More miRNA-181 binds the telomerase mRNA, so it is degraded or not translated. <b>Telomerase levels fall</b>, and so does its function: telomeres are maintained less, and they shorten faster with each division.</li>
</ol>
<div class="pearl"><strong>Logic chain to remember:</strong> ↑ miRNA → ↓ target mRNA → ↓ target protein. Every case question in this topic follows this pattern.</div>

<p>كل خلية في جسمك فيها نفس الـ DNA، ومع ذلك خلية الكبد والخلية العصبية بيعملوا بروتينات مختلفة جدًا. الفرق ده سببه <b>تنظيم الجينات (gene regulation)</b>: قدرة الخلية تتحكم في أنهي جين يشتغل، وإمتى، وبكمية قد إيه. المحاضرة دي بتغطي أول أداتين من أدوات الـ epigenetics التلاتة: <b>العناصر الـ cis/trans</b> (ومعاها الـ DNA methylation) و<b>الـ RNA اللي مش بيشفّر</b> مع التركيز على الـ microRNA. وتعديلات الهستونات في محاضرة 6.</p>

<h4>1. ليه بننظم الجينات؟</h4>
<p>معظم الجينات في كل الكائنات متنظمة، فبروتيناتها بتتعمل <b>في أوقات معينة وبكميات معينة</b>. فيه نوعين من التعبير:</p>
<ul>
<li><b>Constitutive</b>: الجين <b>شغال دايمًا</b> بمستوى <b>ثابت تقريبًا</b>. الجينات دي غالبًا بتشفّر لبروتينات مهمة للحياة، زي إنزيمات الأيض (housekeeping genes).</li>
<li><b>Facultative</b>: الجين بيشتغل <b>في ظروف معينة بس</b> وبكمية متحكَّم فيها.</li>
</ul>
<p>الكائن بيستفيد من ده في 3 حاجات، التنظيم بيضمن إن:</p>
<ol><li>الخلية تعمل البروتينات اللي <b>محتاجاها</b> بس؛</li><li>الجينات تشتغل في <b>أنواع الخلايا الصح</b>؛</li><li>الجينات تشتغل في <b>مرحلة النمو الصح</b>.</li></ol>

<h4>2. الـ Epigenetics</h4>
<p>الـ <b>Epigenetics</b> هو دراسة التغيرات في التعبير الجيني اللي <b>ما بتغيرش تسلسل الـ DNA</b>. الـ eukaryotes بتستخدم 3 أدوات:</p>
<ol><li>عناصر <b>cis و trans</b>؛</li><li><b>ncRNAs</b> (miRNA و circRNA و lncRNA)؛</li><li><b>تعديلات الهستونات</b>.</li></ol>

<h4>3. عناصر الـ cis والـ trans بالتفصيل</h4>
<p>افتكري: الـ <b>cis</b> = <b>تسلسلات DNA</b> بتأثر على الجينات القريبة (TATA box و enhancers و silencers). والـ <b>trans</b> = <b>البروتينات</b> اللي بترتبط بيها.</p>
<h5>البروتينات المنظِّمة</h5>
<ul>
<li><b>C/EBPs</b>: عيلة من <b>6</b> transcription factors. لما ترتبط بالـ DNA بتجيب <b>co-activators</b>، واللي بدورها يا تفتح الكروماتين يا تجيب الـ basal transcription factors.</li>
<li><b>Sp1</b> (specificity protein 1)، بيشفّر له جين SP1، وهو <b>activator</b> لجينات كتير. بيرتبط بالـ <b>GC box</b> وبيجيب <b>TFIID و RNA polymerase II</b>.</li>
</ul>
<h5>الـ Promoter و"التحكم من بعيد"</h5>
<p>في الـ eukaryotes، أماكن بعيدة على الكروموسوم ممكن تتحكم في نسخ جين. وفيه ميزتين بيخلوا ده مرن:</p>
<ol><li>مجموعة بروتينات بتساعد <b>الـ RNA polymerase يرتبط بالـ promoter</b>؛</li><li><b>بروتينات تنظيمية</b> بترتبط بـ<b>أماكن بعيدة</b>.</li></ol>
<div class="ex"><b>مثال المحاضرة، promoter جين thymidine kinase:</b> وإحنا رايحين ناحية الجين فيه GC box (حوالي −100)، و CAAT box (حوالي −80)، و GC box تاني (حوالي −60)، والـ TATA box (حوالي −25) اللي بيرتبط بيه الـ initiation factor.</div>
<h5>الـ Transcription factors وطريقة تجمعها</h5>
<ul>
<li><b>Basal factors</b>: بتتجمع على الـ promoter بداية من تسلسل TATA اللي قبل البداية بحوالي 25 نيوكليوتيد. مع بعض بيحطوا الـ RNA polymerase عند بداية الجين وبعدين يسيبوه ينسخ. (أساميهم حروف زي A و B و E و F و H تقريبًا حسب الوزن الجزيئي.)</li>
<li><b>Activators</b>: بترتبط بالـ <b>enhancers</b> اللي غالبًا بعيدة. لما الـ DNA <b>يتني</b> والـ enhancer يقرب من مركّب النسخ، الـ activator يلمس المركّب و<b>يزوّد معدل</b> النسخ.</li>
<li><b>Repressors</b>: بترتبط بالـ <b>silencers</b> وبتمنع الـ activators ترتبط بالـ enhancers القريبة، فالنسخ <b>يبطأ</b>.</li>
<li><b>Coactivators</b>: بتنقل الإشارة من الـ activators للـ basal factors.</li>
</ul>
<h5>الـ Activator ليه جزئين (domains)</h5>
<ol>
<li><b>DNA-binding domain</b>: بيربط البروتين بمكان معين على الـ DNA باستخدام motif (الموتيفات في محاضرة 6). وعند الـ enhancers الـ activators بتجيب <b>HAT</b> فتفتح الكروماتين.</li>
<li><b>Regulatory domain</b>: بيتفاعل مع بروتينات تنظيمية تانية زي الـ coactivators.</li>
</ol>
<p>وبما إن أماكن التنظيم ممكن تكون بعيدة، تسلسلات كتير مختلفة متفرقة على الـ DNA ممكن كلها تأثر على جين واحد.</p>
<h5>الـ Nucleosomes بتقفل الـ promoter</h5>
<p>زي محاضرة 3: الهستونات لما تمسك الـ DNA جامد بتمنع الـ RNA polymerase، والـ enhancers بتساعد تفكها (chromatin remodeling).</p>

<h4>4. الـ DNA methylation</h4>
<p>إنزيم <b>DNA methylase</b> بيضيف مجموعات ميثيل (CH₃) على الـ DNA برابطة تساهمية. الـ methylation غالبًا <b>بيوقف النسخ</b>، خصوصًا لو جنب الـ promoter.</p>
<ul>
<li>في الفقاريات والنباتات المزهرة، جينات كتير عندها <b>CpG islands</b> جنب الـ promoter: مناطق فيها C وراه G مربوطين برابطة phosphodiester. الـ C في الأماكن دي ممكن يتمثّل.</li>
<li><b>CpG مش ممثّلة = جينات شغالة</b>. <b>CpG ممثّلة = جينات مطفية</b>.</li>
</ul>
<p>الـ methylation بيوقف النسخ بطريقتين:</p>
<ol>
<li><b>مباشرة</b>: الـ CpG الممثّلة في الـ GC box بتمنع <b>Sp1</b> يرتبط، فالبداية ما تحصلش.</li>
<li><b>عن طريق الكروماتين</b>: بروتين اسمه <b>methyl-CpG binding protein</b> بيرتبط بالمنطقة الممثّلة ويجيب بروتينات تانية زي <b>HDAC</b>، فيحوّلوا الكروماتين من <b>مفتوح لمقفول</b>.</li>
</ol>

<h4>5. الـ RNA اللي مش بيشفّر (ncRNAs)</h4>
<p>حوالي <b>90% من الـ RNA الأولي بيتشال</b> أثناء المعالجة عشان يطلع الـ mRNA الناضج. (مراجعة الـ splicing: الـ snRNPs بترتبط بطرف 5' بتاع الـ intron، والـ intron يعمل لفة، وطرفه 5' يتقطع ويتربط جنب طرفه 3'، واللفة تتشال والـ exons تتوصل، والـ spliceosome يسيب الـ mRNA الناضج.)</p>
<p>الـ <b>ncRNAs</b> هي أنواع RNA <b>بتتنسخ من الـ DNA بس مش بتتترجم</b> لبروتين. بتتعمل بـ alternative splicing معين، وبتنظم التعبير الجيني على 3 مستويات: <b>النسخ</b>، و<b>بعد النسخ</b>، و<b>الترجمة</b>. أنواعها الأساسية: <b>microRNA (miRNA)</b> و<b>long non-coding RNA (lncRNA)</b> و<b>circular RNA (circRNA)</b>.</p>
<p><b>نوبل 2024</b>: Victor Ambros و Gary Ruvkun لاكتشاف الـ microRNA ودوره في تنظيم الجينات بعد النسخ.</p>
<h5>الـ microRNA</h5>
<ul>
<li>RNA <b>شريط واحد</b> مش بيشفّر، طوله حوالي <b>22 نيوكليوتيد</b>.</li>
<li>بيرتبط بتسلسل مكمّل في الـ <b>3'UTR</b> (المنطقة اللي مش بتتترجم عند 3') في الـ mRNA المستهدف.</li>
<li>بيطفي الجين ده يا بـ<b>تكسير الـ mRNA</b> يا بـ<b>منع ترجمته</b>.</li>
</ul>
<h5>الـ miRNA بيتعمل إزاي؟</h5>
<ol>
<li>الـ <b>RNA polymerase II</b> بينسخه على شكل <b>hairpin</b> (RNA مزدوج مكمّل لنفسه).</li>
<li>إنزيم <b>Dicer</b> اللي بيقطع الـ RNA المزدوج بيقطّع الـ hairpin لحتت صغيرة.</li>
<li>الـ miRNA الناضج بيدخل مركّب بروتيني اسمه <b>RISC</b> (RNA-induced silencing complex)، وبعدها بيوقف تصنيع البروتين من الـ mRNA <b>المستهدف بتاعه بس</b>.</li>
</ol>

<h4>6. حالة دراسية: miRNA-181 والتيلوميراز</h4>
<p>الدراسات بتقول إن <b>miRNA-181 بينظم مستوى ووظيفة التيلوميراز</b>.</p>
<ol>
<li><b>مكان الارتباط؟</b> الـ <b>3'UTR بتاع الـ mRNA الخاص بالتيلوميراز</b>.</li>
<li><b>لو miRNA-181 زاد؟</b> هيرتبط أكتر بالـ mRNA بتاع التيلوميراز فيتكسر أو ما يتترجمش. <b>مستوى التيلوميراز يقل</b>، ووظيفته كمان: التيلوميرات مش هتتحافظ عليها كويس وهتقصر أسرع مع كل انقسام.</li>
</ol>
<div class="pearl"><strong>سلسلة منطقية احفظيها:</strong> ↑ miRNA ← ↓ الـ mRNA المستهدف ← ↓ البروتين. كل أسئلة الحالات في الموضوع ده ماشية على النمط ده.</div>

DEEP.genetics[6]={en:`
<p>Lecture 6 finishes the epigenetics story. It covers the two remaining non-coding RNAs (<b>circRNA</b> and <b>lncRNA</b>), works through two case studies, then explains the third epigenetic tool, <b>histone modifications and chromatin remodeling</b>. It ends with the <b>levels</b> at which genes are regulated, real examples, and the <b>protein motifs</b> that bind DNA.</p>

<h4>1. Circular RNAs (circRNAs)</h4>
<h5>How they form</h5>
<p>Normal (linear) mRNA is made by <b>canonical splicing</b>: snRNPs cut out the introns. circRNAs are made by <b>back-splicing</b>: a segment of the pre-mRNA is cut out and its <b>5' end joins its own 3' end</b>, closing it into a ring. The ring can contain exons and/or introns.</p>
<h5>Why being circular matters</h5>
<p>Most RNA-degrading enzymes attack free ends, and a circle has none. So circRNAs are very stable: half-life about <b>48 hours</b>, roughly <b>five times more stable</b> than linear mRNAs.</p>
<h5>How they regulate genes</h5>
<ul>
<li><b>Directly</b>: they <b>compete with the splicing machinery</b> for the same pre-mRNA, reducing how much linear mRNA is made.</li>
<li><b>Indirectly</b>: they act as <b>miRNA sponges</b>. They bind and sequester miRNAs, so those miRNAs can't silence their targets.</li>
</ul>

<h4>2. Long non-coding RNAs (lncRNAs)</h4>
<p>lncRNAs are longer than <b>200 nucleotides</b>, typically <b>1,000–10,000</b>, with no protein-coding ability. They resemble mRNA: made by <b>RNA polymerase II</b>, <b>5' capped</b>, <b>3' polyadenylated</b>, and often spliced.</p>
<p>They regulate genes in four ways:</p>
<ol>
<li><b>Guide</b>: lead a transcription factor to a specific place in the genome, to <b>activate</b> a gene.</li>
<li><b>Scaffold</b>: a platform where several cofactors assemble temporarily and activate expression.</li>
<li><b>Decoy for transcription factors</b>: bind a transcription factor and keep it away from its target, causing <b>gene silencing</b>.</li>
<li><b>miRNA binding</b>: either guide a miRNA to its target mRNA, or act as a <b>decoy (sponge)</b> that keeps the miRNA away from its target.</li>
</ol>

<h4>3. Case studies: solving them step by step</h4>
<div class="ex"><b>Case 1, miRNA-181 and telomerase (continued from Lecture 5).</b><br>
Q1. Target site of miRNA-181? The <b>3'UTR of the telomerase mRNA</b>.<br>
Q2. Over-expression of miRNA-181? More silencing of telomerase mRNA → <b>less telomerase</b> → weaker telomere maintenance.<br>
Q3. A specific circRNA sponges miRNA-181. If that circRNA goes <b>down</b>? Less sponging → <b>more free miRNA-181</b> → more silencing of telomerase mRNA → <b>less telomerase</b>.</div>
<div class="ex"><b>Case 2, HOTAIR.</b> HOTAIR is a lncRNA that recruits <b>histone deacetylase (HDAC)</b> to the promoter of the <b>ubiquitin gene</b>. miRNA-236 targets the <b>p21 gene</b>, and HOTAIR binds miR-236 and lowers its activity.<br>
Q1. HOTAIR <b>over</b>-expressed: more HDAC at the ubiquitin promoter → histones deacetylated → chromatin closes → transcription falls → <b>ubiquitin protein decreases</b>.<br>
Q2. HOTAIR <b>under</b>-expressed, effect on p21: less HOTAIR means less sponging of miR-236 → <b>more free miR-236</b> → it binds the 3'UTR of p21 mRNA → degradation or blocked translation → <b>p21 decreases</b>. This is post-transcriptional (epigenetic) silencing, with no change to the p21 DNA.</div>
<div class="pearl"><strong>Method for any ncRNA case:</strong> write the chain with arrows. A "sponge" or "decoy" reverses the sign: ↓ sponge → ↑ free miRNA → ↓ target protein.</div>

<h4>4. Histone modifications and chromatin remodeling</h4>
<p>The nucleosome does more than pack DNA. Its histone PTMs and histone variants carry information that affects <b>replication, repair and transcription</b>.</p>
<h5>Nucleosome structure recap</h5>
<ul>
<li>About <b>146 bp</b> of DNA wrapped around a histone octamer: <b>two copies each of H2A, H2B, H3 and H4</b>.</li>
<li>A fifth histone, <b>H1</b>, is the <b>linker histone</b>. It binds the nucleosome and organises nucleosomes into the higher-order <b>30 nm fibre</b>.</li>
</ul>
<p>Chromatin structure is altered in three ways: <b>(I) histone variants</b>, <b>(II) regulating chromatin structure</b>, and <b>(III) modifying histone N-terminal tails</b>.</p>
<h5>I. Histone variants</h5>
<p>Cells have several histone variants that mark special regions. The key example is <b>CENP-A</b> (centromere protein A), which <b>replaces H3</b> at centromeres. Nucleosomes containing CENP-A are built into the <b>kinetochore</b>, which attaches the chromosome to the mitotic spindle through CENP-A's N-terminal tail. Normal H3 can't do this, because its N-terminus is busy forming higher-order chromatin.</p>
<h5>II. Regulating chromatin structure</h5>
<p>DNA's binding to histones is <b>dynamic, not permanent</b>, so the cell can expose regions when needed. Three mechanisms:</p>
<ol>
<li><b>Dynamic DNA–octamer interaction</b>: many DNA-binding proteins can only find their sites when that DNA briefly comes off the octamer or lies in linker DNA. Sites near the <b>ends</b> of the nucleosome are exposed most often; sites near the <b>centre</b> are exposed least often.</li>
<li><b>Nucleosome remodeling</b>: large <b>nucleosome remodeling complexes</b> use <b>ATP</b> to change nucleosomes in three ways:
<ul><li><b>Sliding</b> the octamer along the DNA, exposing binding sites;</li>
<li><b>Transfer</b> of the octamer to another DNA molecule;</li>
<li><b>Remodeling</b> the nucleosome in place, so DNA is more accessible without moving it.</li></ul></li>
<li><b>Nucleosome positioning</b>: nucleosomes form where DNA bends easily. <b>A:T-rich</b> DNA bends toward the minor groove, so it is favoured where the <b>minor groove faces the octamer</b>. <b>G:C-rich</b> DNA is favoured where the minor groove <b>faces away</b>.</li>
</ol>
<h5>III. Modifying histone N-terminal tails</h5>
<p><b>Histone-modifying enzymes</b> (acetyltransferases, deacetylases, methyltransferases, kinases) change the tails, mainly on lysine (K) and serine (S):</p>
<div class="tblwrap"><table><tr><th>Modification</th><th>Effect on chromatin</th></tr>
<tr><td>Lysine acetylation</td><td>Transcriptionally <b>active</b></td></tr>
<tr><td>Deacetylation</td><td>Transcriptionally <b>repressed</b></td></tr>
<tr><td>Methylation</td><td>Active <b>or</b> repressed, depending on which amino acid</td></tr>
<tr><td>Serine phosphorylation</td><td>Transcriptionally <b>active</b></td></tr></table></div>
<p><b>Why these effects?</b></p>
<ul>
<li><b>Acetylation and phosphorylation</b> both reduce the tails' <b>positive charge</b>, so they bind the negatively charged DNA backbone more weakly and chromatin opens.</li>
<li><b>Unmodified and methylated</b> tails hold nucleosomal DNA more tightly than acetylated tails.</li>
<li>Modified tails also create <b>binding sites</b> for proteins: <b>bromodomains</b> bind <b>acetylated</b> tails; <b>chromodomains</b> bind <b>methylated</b> tails. These help maintain the acetylated or methylated state and therefore the level of expression.</li>
<li>Methylation and acetylation happen on the side chains of the tail amino acids.</li>
</ul>

<h4>5. Levels of gene regulation</h4>
<p>In eukaryotes, regulation happens at every step from gene to functional protein:</p>
<ol>
<li><b>Transcription</b>: how much pre-mRNA is made.</li>
<li><b>RNA processing</b>: splicing, and how fast the pre-mRNA is degraded.</li>
<li><b>Translation</b>: blocked by small inhibitory RNAs or RNA-binding proteins.</li>
<li><b>Post-translation</b>: feedback inhibition, PTMs and protein degradation.</li>
</ol>

<h4>6. Examples of regulated expression</h4>
<h5>Cell differentiation</h5>
<p>Skeletal muscle, nerve and skin cells have the <b>same genome</b> but <b>different proteomes</b>, matched to their function. Differentiation is gene regulation in action.</p>
<h5>Globin switching during development</h5>
<p>Haemoglobin is made of four globin chains (two from one gene, two from another). Different globin genes switch on at different stages, so each stage gets the right oxygen affinity:</p>
<div class="tblwrap"><table><tr><th>Stage</th><th>Haemoglobin</th><th>O₂ affinity</th></tr>
<tr><td>Embryo</td><td>2 ζ (zeta) + 2 ε (epsilon)</td><td><b>Highest</b></td></tr>
<tr><td>Fetus</td><td>2 α + 2 γ (gamma)</td><td>High</td></tr>
<tr><td>Adult</td><td>2 α + 2 β (and some δ)</td><td>Moderate</td></tr></table></div>
<p>Higher affinity in early life lets the embryo and fetus pull oxygen from the mother's blood.</p>
<h5>Regulating promoter access</h5>
<p>Proteins bind short regulatory sites, usually only <b>10–15 nucleotides</b> long, near the promoter. They either <b>block</b> transcription by getting in RNA polymerase's way, or <b>stimulate</b> it by helping polymerase bind.</p>

<h4>7. DNA-binding motifs</h4>
<p>A <b>motif</b> is a widespread pattern with biological meaning that recurs in related DNA, RNA or protein sequences. Transcription factors use protein motifs to bind DNA, usually upstream of or near the transcription start site.</p>
<h5>Why the major groove?</h5>
<p>In the <b>major groove</b> a protein can tell each base pair apart and read the actual sequence on each strand. In the <b>minor groove</b> it can only tell sets of base pairs apart. The major groove is also more open. So most DNA-binding proteins read the <b>major groove</b>, recognising promoters, enhancers, repressor sites and restriction sites.</p>
<ul>
<li><b>Helix-turn-helix</b>: the <b>first and most common</b> motif. Two α-helices joined by a short non-helical "turn", held at roughly right angles.</li>
<li><b>Zinc finger</b>: uses <b>zinc atoms</b> to hold its shape. In one form zinc links an α-helix to a β-sheet so the helix fits into the major groove. Zinc fingers often come in clusters: <b>the more fingers, the tighter the binding</b>. In other forms a second helix replaces the β-sheet.</li>
<li><b>Leucine zipper</b>: formed by <b>two protein subunits</b>. Regions rich in hydrophobic amino acids (usually <b>leucines</b>) on each subunit stick together, while the rest of the subunits stay apart. The result is a <b>"Y" shape</b> whose two helical arms fit into the major groove.</li>
</ul>

<p>المحاضرة دي بتقفل موضوع الـ epigenetics. بتشرح نوعين الـ ncRNA الباقيين (<b>circRNA</b> و<b>lncRNA</b>)، وبتحل حالتين دراسيتين، وبعدين بتشرح الأداة التالتة: <b>تعديلات الهستونات والـ chromatin remodeling</b>. وفي الآخر <b>مستويات</b> تنظيم الجينات، وأمثلة حقيقية، والـ <b>motifs</b> البروتينية اللي بترتبط بالـ DNA.</p>

<h4>1. الـ Circular RNAs</h4>
<h5>بتتكوّن إزاي؟</h5>
<p>الـ mRNA العادي (الخطي) بيتعمل بـ <b>canonical splicing</b>: الـ snRNPs بتقص الـ introns. أما الـ circRNA فبيتعمل بـ <b>back-splicing</b>: حتة من الـ pre-mRNA بتتقص، و<b>طرفها 5' يتوصل بطرفها 3'</b> فتقفل على شكل حلقة. الحلقة ممكن يكون فيها exons أو introns أو الاتنين.</p>
<h5>ليه كونها دائرية مهم؟</h5>
<p>معظم الإنزيمات اللي بتكسّر الـ RNA بتهاجم من الأطراف، والدايرة ما لهاش أطراف. فالـ circRNA ثابت جدًا: عمره حوالي <b>48 ساعة</b>، تقريبًا <b>أثبت 5 مرات</b> من الـ mRNA الخطي.</p>
<h5>بتنظم الجينات إزاي؟</h5>
<ul>
<li><b>مباشرة</b>: بتـ<b>نافس ماكينة الـ splicing</b> على نفس الـ pre-mRNA، فالـ mRNA الخطي يقل.</li>
<li><b>بشكل غير مباشر</b>: بتشتغل كـ <b>miRNA sponge</b> (إسفنجة)، بتمسك الـ miRNAs وتحبسها، فما تقدرش تطفي الجينات المستهدفة.</li>
</ul>

<h4>2. الـ Long non-coding RNAs</h4>
<p>أطول من <b>200 نيوكليوتيد</b>، وغالبًا من <b>1000 لـ 10,000</b>، ومش بتشفّر لبروتين. شبه الـ mRNA: بيعملها <b>RNA pol II</b>، وعندها <b>5' cap</b> و<b>poly-A tail</b>، وغالبًا بيتعملها splicing.</p>
<p>بتنظم الجينات بـ 4 طرق:</p>
<ol>
<li><b>Guide</b>: بتوصّل transcription factor لمكان معين في الجينوم عشان <b>تشغّل</b> جين.</li>
<li><b>Scaffold</b>: منصة بتتجمع عليها cofactors مؤقتًا وتشغّل التعبير.</li>
<li><b>Decoy للـ transcription factors</b>: بتمسك الـ factor وتبعده عن هدفه، فالجين <b>يطفي</b>.</li>
<li><b>ارتباط بالـ miRNA</b>: يا توصّل الـ miRNA للـ mRNA المستهدف، يا تشتغل <b>decoy (إسفنجة)</b> تبعده عن هدفه.</li>
</ol>

<h4>3. الحالات الدراسية: الحل خطوة بخطوة</h4>
<div class="ex"><b>حالة 1: miRNA-181 والتيلوميراز (تكملة محاضرة 5).</b><br>
س1. مكان ارتباط miRNA-181؟ الـ <b>3'UTR بتاع mRNA التيلوميراز</b>.<br>
س2. لو miRNA-181 زاد؟ إطفاء أكتر لـ mRNA التيلوميراز ← <b>تيلوميراز أقل</b> ← الحفاظ على التيلوميرات يضعف.<br>
س3. فيه circRNA معين بيمسك miRNA-181. لو الـ circRNA ده <b>قلّ</b>؟ الإسفنجة تقل ← <b>miRNA-181 حر أكتر</b> ← إطفاء أكتر لـ mRNA التيلوميراز ← <b>تيلوميراز أقل</b>.</div>
<div class="ex"><b>حالة 2: HOTAIR.</b> الـ HOTAIR هو lncRNA بيجيب <b>HDAC</b> لـ promoter <b>جين الـ ubiquitin</b>. والـ miRNA-236 بيستهدف <b>جين p21</b>، والـ HOTAIR بيمسك miR-236 ويقلل نشاطه.<br>
س1. لو HOTAIR <b>زاد</b>: HDAC أكتر عند promoter الـ ubiquitin ← الهستونات تفقد الـ acetyl ← الكروماتين يقفل ← النسخ يقل ← <b>بروتين الـ ubiquitin يقل</b>.<br>
س2. لو HOTAIR <b>قلّ</b>، إيه اللي يحصل لـ p21؟ HOTAIR أقل يعني إسفنجة أقل لـ miR-236 ← <b>miR-236 حر أكتر</b> ← يرتبط بالـ 3'UTR بتاع mRNA الـ p21 ← يتكسر أو ترجمته تقف ← <b>p21 يقل</b>. ده إطفاء بعد النسخ (epigenetic) من غير أي تغيير في الـ DNA بتاع p21.</div>
<div class="pearl"><strong>طريقة حل أي حالة ncRNA:</strong> اكتبي السلسلة بالأسهم. الـ "sponge" أو الـ "decoy" بيعكس الإشارة: ↓ إسفنجة ← ↑ miRNA حر ← ↓ البروتين المستهدف.</div>

<h4>4. تعديلات الهستونات والـ Chromatin remodeling</h4>
<p>الـ nucleosome مش بس بيكبس الـ DNA. الـ PTMs والـ variants بتوع الهستونات شايلين معلومات بتأثر على <b>التضاعف والإصلاح والنسخ</b>.</p>
<h5>مراجعة تركيب الـ Nucleosome</h5>
<ul>
<li>حوالي <b>146 bp</b> ملفوفين حوالين octamer: <b>نسختين من كل واحد H2A و H2B و H3 و H4</b>.</li>
<li>هستون خامس، <b>H1</b>، هو الـ <b>linker</b>. بيرتبط بالـ nucleosome وبيرتب النيوكليوزومات في تركيب أعلى، الـ <b>30 nm fibre</b>.</li>
</ul>
<p>شكل الكروماتين بيتغير بـ 3 طرق: <b>(I) histone variants</b>، و<b>(II) تنظيم تركيب الكروماتين</b>، و<b>(III) تعديل ديول الهستونات عند الطرف N</b>.</p>
<h5>I. الـ Histone variants</h5>
<p>الخلايا فيها أنواع مختلفة من الهستونات بتعلّم مناطق خاصة. أهم مثال <b>CENP-A</b> اللي <b>بيحل محل H3</b> عند الـ centromere. النيوكليوزومات اللي فيها CENP-A بتدخل في تكوين الـ <b>kinetochore</b> اللي بيربط الكروموسوم بالـ spindle عن طريق ديل CENP-A. الـ H3 العادي ما يقدرش يعمل كده لأن طرفه N مشغول في تكوين الكروماتين.</p>
<h5>II. تنظيم تركيب الكروماتين</h5>
<p>ارتباط الـ DNA بالهستونات <b>ديناميكي مش دايم</b>، فالخلية تقدر تكشف مناطق وقت الحاجة. فيه 3 آليات:</p>
<ol>
<li><b>تفاعل ديناميكي بين الـ DNA والـ octamer</b>: بروتينات كتير بترتبط بالـ DNA ما تقدرش تلاقي أماكنها غير لما الـ DNA يبعد شوية عن الـ octamer أو يكون في الـ linker. الأماكن اللي عند <b>أطراف</b> النيوكليوزوم بتتكشف أكتر، واللي في <b>النص</b> أقل.</li>
<li><b>Nucleosome remodeling</b>: مركّبات كبيرة اسمها <b>nucleosome remodeling complexes</b> بتستخدم <b>ATP</b> وتغيّر النيوكليوزومات بـ 3 طرق:
<ul><li><b>Sliding</b>: تزحلق الـ octamer على الـ DNA فتكشف أماكن ارتباط؛</li>
<li><b>Transfer</b>: تنقل الـ octamer لجزيء DNA تاني؛</li>
<li><b>Remodeling</b>: تغيّر شكل النيوكليوزوم في مكانه فالـ DNA يبقى متاح أكتر من غير ما يتحرك.</li></ul></li>
<li><b>Nucleosome positioning</b>: النيوكليوزومات بتتكون على الـ DNA اللي بيتني بسهولة. الـ DNA <b>الغني بـ A:T</b> بيتني ناحية الـ minor groove، فبيتفضّل في الأماكن اللي <b>الـ minor groove فيها بيبص ناحية الـ octamer</b>. والغني بـ <b>G:C</b> العكس.</li>
</ol>
<h5>III. تعديل ديول الهستونات</h5>
<p>إنزيمات <b>histone-modifying enzymes</b> (acetyltransferases و deacetylases و methyltransferases و kinases) بتعدّل الديول، أساسًا على الليسين (K) والسيرين (S):</p>
<div class="tblwrap"><table><tr><th>Modification</th><th>Effect on chromatin</th></tr>
<tr><td>Lysine acetylation</td><td>Active</td></tr>
<tr><td>Deacetylation</td><td>Repressed</td></tr>
<tr><td>Methylation</td><td>Active or repressed (depends on the amino acid)</td></tr>
<tr><td>Serine phosphorylation</td><td>Active</td></tr></table></div>
<p><b>ليه التأثيرات دي؟</b></p>
<ul>
<li>الـ <b>acetylation والـ phosphorylation</b> الاتنين بيقللوا <b>الشحنة الموجبة</b> على الديول، فمسكتها للـ DNA السالب تضعف والكروماتين يتفتح.</li>
<li>الديول <b>العادية والممثّلة</b> ماسكة الـ DNA أجمد من الديول اللي عليها acetyl.</li>
<li>الديول المعدّلة كمان بتعمل <b>أماكن ارتباط</b> لبروتينات: الـ <b>bromodomains</b> بترتبط بالديول اللي عليها <b>acetyl</b>، والـ <b>chromodomains</b> بالديول <b>الممثّلة</b>. ودول بيحافظوا على الحالة دي وبالتالي على مستوى التعبير.</li>
<li>الـ methylation والـ acetylation بيحصلوا على السلاسل الجانبية للأحماض الأمينية في الديل.</li>
</ul>

<h4>5. مستويات تنظيم الجينات</h4>
<p>في الـ eukaryotes التنظيم بيحصل في كل خطوة من الجين للبروتين الشغال:</p>
<ol>
<li><b>النسخ</b>: كمية الـ pre-mRNA اللي بتتعمل.</li>
<li><b>معالجة الـ RNA</b>: الـ splicing، وسرعة تكسير الـ pre-mRNA.</li>
<li><b>الترجمة</b>: ممكن تتوقف بـ RNA مثبط صغير أو بروتينات بترتبط بالـ RNA.</li>
<li><b>بعد الترجمة</b>: الـ feedback inhibition، والـ PTMs، وتكسير البروتين.</li>
</ol>

<h4>6. أمثلة على التعبير المنظَّم</h4>
<h5>تمايز الخلايا</h5>
<p>خلايا العضلات والأعصاب والجلد عندهم <b>نفس الجينوم</b> بس <b>بروتيوم مختلف</b> حسب وظيفة كل واحدة. التمايز ده هو تنظيم الجينات بالظبط.</p>
<h5>تغيير الجلوبين مع النمو</h5>
<p>الهيموجلوبين مكوَّن من 4 سلاسل جلوبين (اتنين من جين واتنين من جين تاني). جينات جلوبين مختلفة بتشتغل في مراحل مختلفة، فكل مرحلة تاخد الألفة المناسبة للأكسجين:</p>
<div class="tblwrap"><table><tr><th>Stage</th><th>Haemoglobin</th><th>O₂ affinity</th></tr>
<tr><td>Embryo</td><td>2 ζ + 2 ε</td><td>Highest</td></tr>
<tr><td>Fetus</td><td>2 α + 2 γ</td><td>High</td></tr>
<tr><td>Adult</td><td>2 α + 2 β (and some δ)</td><td>Moderate</td></tr></table></div>
<p>الألفة العالية في أول العمر بتخلي الجنين يسحب الأكسجين من دم الأم.</p>
<h5>التحكم في الوصول للـ promoter</h5>
<p>بروتينات بترتبط بأماكن تنظيمية قصيرة، غالبًا <b>10–15 نيوكليوتيد</b> بس، جنب الـ promoter. يا <b>تمنع</b> النسخ لأنها بتقف في طريق الـ RNA polymerase، يا <b>تشجعه</b> لأنها بتساعده يرتبط.</p>

<h4>7. الـ Motifs اللي بترتبط بالـ DNA</h4>
<p>الـ <b>motif</b> هو نمط منتشر ليه معنى بيولوجي وبيتكرر في تسلسلات DNA أو RNA أو بروتين قريبة من بعض. الـ transcription factors بتستخدم motifs بروتينية عشان ترتبط بالـ DNA، غالبًا قبل أو قريب من نقطة بداية النسخ.</p>
<h5>ليه الـ major groove؟</h5>
<p>في الـ <b>major groove</b> البروتين يقدر يميّز كل زوج قواعد عن التاني ويقرا التسلسل الفعلي على كل شريط. في الـ <b>minor groove</b> يقدر يميّز مجموعات بس. وكمان الـ major groove أوسع. عشان كده معظم البروتينات بتقرا الـ <b>major groove</b>، وبتتعرف على الـ promoters والـ enhancers وأماكن الـ repressors وأماكن القطع.</p>
<ul>
<li><b>Helix-turn-helix</b>: <b>الأول والأشهر</b>. اتنين α-helix متوصلين بجزء قصير مش حلزوني (الـ turn)، وزاوية بينهم تقريبًا قايمة.</li>
<li><b>Zinc finger</b>: بيستخدم <b>ذرات زنك</b> عشان يحافظ على شكله. في نوع منه الزنك بيربط α-helix بـ β-sheet فالـ helix يدخل في الـ major groove. غالبًا بتيجي مجموعات: <b>كل ما الصوابع تزيد، الارتباط يبقى أقوى</b>. وفي أنواع تانية helix تاني بياخد مكان الـ β-sheet.</li>
<li><b>Leucine zipper</b>: بيتكون من <b>وحدتين بروتين</b>. مناطق غنية بأحماض أمينية كارهة للماء (غالبًا <b>ليوسين</b>) في كل وحدة بتلزق في بعض، وباقي الوحدتين متفرقين. النتيجة شكل <b>حرف Y</b>، وذراعيه الحلزونيين بيدخلوا في الـ major groove.</li>
</ul>

<p>This short lecture steps back from mechanisms to the big picture: how scientists read the <b>entire human genome</b>, why it took more than 30 years to finish completely, what that knowledge is used for, Egypt's own genome project, and how tiny DNA differences make each of us unique.</p>

<h4>1. The Human Genome Project (HGP)</h4>
<p>The HGP is one of the greatest scientific achievements in history. It was launched in <b>October 1990</b> and completed in <b>April 2003</b>. Its signature accomplishment was the <b>first sequence of the human genome</b>, the human "blueprint".</p>
<h5>Goals</h5>
<ul>
<li>Sequence the <b>entire human genome</b>.</li>
<li>Also sequence carefully chosen <b>non-human organisms</b>: eventually the bacterium <b>E. coli</b>, <b>baker's yeast</b>, the <b>fruit fly</b> and the <b>mouse</b>. These are model organisms whose biology helps us interpret human genes.</li>
<li>Open a new era of biomedical research. The goals and plans were updated periodically during the project.</li>
</ul>
<h5>Who did it, and whose DNA?</h5>
<p>Researchers at <b>20 universities and research centres</b> in <b>six countries</b>: the USA, UK, France, Germany, Japan and China. Together they were the <b>International Human Genome Sequencing Consortium</b>. DNA came from volunteers who donated blood samples (the lecture shows a 1997 newspaper advert in Buffalo, New York recruiting donors).</p>
<h5>How: DNA sequencing</h5>
<p><b>DNA sequencing</b> means determining the exact order of bases (A, C, G, T) in a stretch of DNA. Because the HGP aimed to sequence whole genomes, it invested heavily in improving sequencing methods. It used <b>Sanger DNA sequencing</b>, but first advanced this basic method through a series of major technical innovations. Sequencing went from needing large labs full of people (1994) to much less manpower (2006).</p>

<h4>2. Was the genome really complete in 2003?</h4>
<p>No, not entirely. The timeline is a frequent exam question:</p>
<div class="tblwrap"><table><tr><th>Date</th><th>Milestone</th></tr>
<tr><td>June 2000</td><td><b>Draft</b> sequence announced (White House event: President Clinton and Francis Collins, NHGRI director). Covered about <b>90%</b> of the genome, with more than <b>150,000 gaps</b> (regions that couldn't be determined accurately).</td></tr>
<tr><td>February 2001</td><td>Papers describing the draft published: the HGP paper and the competing <b>Venter/Celera</b> paper.</td></tr>
<tr><td>April 2003</td><td>"Essentially complete" sequence: about <b>92%</b> of the genome, <b>fewer than 400 gaps</b>, and more accurate.</td></tr>
<tr><td>31 March 2022</td><td>The <b>Telomere-to-Telomere (T2T) consortium</b> filled the remaining gaps: the <b>first truly complete</b> human genome, 32 years after the start.</td></tr></table></div>
<h5>Why was the last 8% so hard?</h5>
<p>The missing regions were mainly <b>telomeres and centromeres</b>. These are made of <b>highly repetitive</b> and complex DNA. Sequencing reads short pieces and then fits them together by their overlaps, like a jigsaw. If thousands of pieces look identical, you can't tell where each one goes. (The lecture illustrates the scale: printed out, the genome would stretch thousands of kilometres.) As one T2T researcher put it, finishing the genome was "like putting on a new pair of glasses."</p>

<h4>3. Beyond the HGP</h4>
<p>The HGP determined most of the ~<b>3 billion bases</b> of the human genome. It was the end of one journey and the start of another: <b>interpreting</b> what that sequence means. Its impact includes:</p>
<ul>
<li><b>Human genomic variation</b>: comparing people's genomes.</li>
<li><b>Revealing human and family origins</b> (ancestry).</li>
<li><b>Genetic testing</b>.</li>
<li><b>Precision medicine</b>: choosing treatment based on a person's genes.</li>
</ul>

<h4>4. The Egyptian Genome Project (launched March 2021)</h4>
<h5>Aims</h5>
<ol>
<li>Establish a <b>reference Egyptian genome</b>.</li>
<li>Use modern technology to select and develop the performance of Egyptian <b>sports champions</b>.</li>
<li>Study genes related to <b>common diseases</b>, such as heart disease and tumours.</li>
<li>Study the reference genome of <b>ancient Egyptians</b>.</li>
</ol>
<h5>Expected outcomes</h5>
<ol>
<li>Development of biomedical sciences.</li>
<li><b>Lower healthcare costs</b>.</li>
<li>New job opportunities in new fields.</li>
<li>Advances in <b>precision and personalised medicine</b> and <b>gene therapy</b> tailored to the Egyptian genome.</li>
</ol>
<p>Why a national reference matters: disease-related variants differ between populations, so a reference built mainly from other populations can miss variants that are common in Egyptians.</p>

<h4>5. Human genomic variation</h4>
<ul>
<li>At the base-pair level, any two humans are <b>99.9% identical</b>. The remaining <b>0.1%</b> contains much of what makes each person unique.</li>
<li>Those differences help determine how you look and your <b>risk of diseases</b>. A small set of variants is linked to traits such as height, weight, skin and eye colour, and to specific genetic diseases.</li>
<li>Agreeing on one <b>reference genome</b> from the HGP made it much easier to compare people's genomes on a large scale.</li>
</ul>
<h5>SNP or mutation? It depends on frequency</h5>
<ul>
<li>A single-base change found in <b>1% or more</b> of a population is a <b>single nucleotide polymorphism (SNP)</b>.</li>
<li>The same kind of change found in <b>less than 1%</b> of a population is called a <b>mutation</b>.</li>

async function saveFile(name,blob){
  // Inside Claude the page asks the viewer to confirm the download; on a normal website it downloads directly.
  let dl=null;
  try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads") }catch(e){}
  if(dl){
    try{ await dl.save({filename:name,data:blob}); return "saved" }
    catch(e){ if(e&&e.code==="declined") return "declined"; if(e&&e.code==="rate_limited") throw new Error("A download is already waiting for you to confirm."); }
  }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
  return "saved";
}
