<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Noor E-Learning</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=Cairo:wght@400;700&display=swap">
<style>
/* Layout: a study desk. Dashboard = greeting, exam countdown strip, course cards; course view = lecture list + quiz workspace. Lab teal with amber "noor" light. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --sunk:#e9efed; --ink:#14211f; --muted:#5a6a67; --line:#d6e0dd;
  --teal:#0f6b62; --teal-soft:#dfeeea; --amber:#b97c06; --amber-soft:#fbf0d9;
  --good:#1d7a45; --good-soft:#e1f2e7; --bad:#b4372f; --bad-soft:#f8e3e1;
  --c1:#2f6fb5; --c2:#c2416b; --c3:#7a5bc4; --c4:#0f8a7c; --c5:#c46a1c;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1615; --surface:#14201f; --sunk:#192826; --ink:#e3edeb; --muted:#93a7a3; --line:#253c38;
  --teal:#4fc1b2; --teal-soft:#15302c; --amber:#f0b53c; --amber-soft:#2d2410;
  --good:#5fcf8c; --good-soft:#132e1e; --bad:#f08a80; --bad-soft:#381b18;
  --c1:#6aa6ea; --c2:#ec7fa2; --c3:#a991ea; --c4:#4fc1b2; --c5:#eb9b52; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1615; --surface:#14201f; --sunk:#192826; --ink:#e3edeb; --muted:#93a7a3; --line:#253c38;
  --teal:#4fc1b2; --teal-soft:#15302c; --amber:#f0b53c; --amber-soft:#2d2410;
  --good:#5fcf8c; --good-soft:#132e1e; --bad:#f08a80; --bad-soft:#381b18;
  --c1:#6aa6ea; --c2:#ec7fa2; --c3:#a991ea; --c4:#4fc1b2; --c5:#eb9b52; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 56px}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

header.top{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.logo{width:40px;height:40px;flex:none}
.top .brand{font-family:var(--f-display);font-weight:800;font-size:1.35rem;letter-spacing:-.01em;line-height:1;cursor:pointer;background:none;border:0;padding:0}
.top .brand span{color:var(--amber)}
.top .sub{color:var(--muted);font-size:.85rem;margin-left:auto}

/* dashboard */
.hello h1{font-family:var(--f-display);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.05;margin:0 0 6px;text-wrap:balance}
.hello p{margin:0;color:var(--muted);max-width:60ch}
.statrow{display:flex;gap:28px;flex-wrap:wrap;margin:20px 0 26px;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1}
.stat span{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sec-label{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 10px}
.upcoming{display:flex;flex-direction:column;gap:8px;margin-bottom:30px}
.up{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.up .d{font-family:var(--f-mono);font-size:.8rem;line-height:1.25;color:var(--muted)}
.up .d b{display:block;font-family:var(--f-display);font-size:1.5rem;color:var(--ink)}
.up .t{font-weight:700}
.up .n{font-size:.85rem;color:var(--muted)}
.chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--amber-soft);color:var(--amber)}
.chip.soon{background:var(--bad-soft);color:var(--bad)}
.chip.past{background:var(--sunk);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--hue);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--hue);outline-offset:2px}
.card .code{font-family:var(--f-mono);font-size:.78rem;color:var(--hue);font-weight:600}
.card h3{font-family:var(--f-display);font-size:1.25rem;line-height:1.2;margin:0}
.card .meta{font-size:.85rem;color:var(--muted)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--hue)}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:auto;padding-top:6px;border-top:1px dashed var(--line)}
.card .foot b{color:var(--hue)}

/* course view */
.back{all:unset;cursor:pointer;color:var(--muted);font-size:.9rem;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.back:hover{color:var(--teal)}
.chead{border-left:5px solid var(--hue);padding-left:14px;margin-bottom:6px}
.chead .code{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.chead h2{font-family:var(--f-display);font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.1;margin:2px 0 4px;text-wrap:balance}
.chead p{margin:0;color:var(--muted);font-size:.9rem}
.tabs{display:flex;gap:4px;margin:20px 0 18px;border-bottom:1px solid var(--line)}
.tab{all:unset;cursor:pointer;padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--hue)}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.lecnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:4px}
.lecbtn{all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 16px;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;font-size:.9rem;line-height:1.3}
.lecbtn:hover{background:var(--surface)}
.lecbtn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--hue)}
.lecbtn .num{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.lecbtn .ok{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.lecbtn .ok.on{background:var(--good);border-color:var(--good)}
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,30px);min-width:0}
.lesson .ln{font-family:var(--f-mono);font-size:.8rem;color:var(--hue);font-weight:600}
.lesson h3{font-family:var(--f-display);font-size:1.55rem;line-height:1.15;margin:4px 0 16px;text-wrap:balance}
.lesson h4{font-family:var(--f-display);font-size:1.08rem;margin:22px 0 8px}
.lesson p,.lesson ul,.lesson ol{max-width:70ch;margin:0 0 12px}
.lesson ul,.lesson ol{padding-left:22px}
.lesson li{margin-bottom:4px}
.formula{font-family:var(--f-mono);font-size:.9rem;background:var(--teal-soft);padding:12px 16px;border-radius:8px;margin:12px 0;overflow-x:auto;line-height:1.7}
.formula small{display:block;font-family:var(--f-body);color:var(--muted)}
.pearl{background:var(--amber-soft);border-left:4px solid var(--amber);padding:12px 16px;border-radius:0 8px 8px 0;max-width:70ch;margin:14px 0}
.pearl strong{color:var(--amber)}
.terms{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:10px 0 14px}
.term{background:var(--sunk);border-radius:8px;padding:10px 12px}
.term b{display:block;font-family:var(--f-display)}
.term span{font-size:.88rem;color:var(--muted)}
.tblwrap{overflow-x:auto;margin:10px 0 14px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lessonfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.btn{all:unset;cursor:pointer;background:var(--teal);color:var(--surface);font-weight:700;padding:10px 18px;border-radius:8px;text-align:center}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.btn.done{background:var(--good)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{all:unset;cursor:pointer;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,3vw,28px);max-width:760px}
.qtop{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--sunk);border-radius:3px;margin:8px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--hue);transition:width .3s}
.qlec{font-family:var(--f-mono);font-size:.75rem;color:var(--hue)}
.qtext{font-family:var(--f-display);font-size:1.22rem;line-height:1.35;margin:4px 0 16px;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.opt:hover:not([disabled]){border-color:var(--hue)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--hue);flex:none;width:1.3em}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;padding:12px 16px;border-radius:8px;font-size:.95rem}
.feedback.ok{background:var(--good-soft)}.feedback.no{background:var(--bad-soft)}
.feedback b{display:block}
.qnav{display:flex;justify-content:flex-end;margin-top:16px}
.result{text-align:center}
.result .score{font-family:var(--f-display);font-size:3.4rem;font-weight:800;color:var(--hue);line-height:1}
.result>p{color:var(--muted)}
.review{text-align:left;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.review div{font-size:.9rem;padding:8px 12px;border-radius:8px;background:var(--bg)}
.review .x{color:var(--bad);font-weight:700}.review .v{color:var(--good);font-weight:700}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
footer{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}

@media (max-width:760px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .lecnav{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}
  .lecbtn{grid-template-columns:auto;flex:none;padding:8px 12px;border:1px solid var(--line);background:var(--surface)}
  .lecbtn .ttl,.lecbtn .ok{display:none}
  .lecbtn[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--hue)}
  .top .sub{margin-left:0;width:100%}
  .up{grid-template-columns:60px minmax(0,1fr)}
  .up .chip{grid-column:2;justify-self:start}
}

/* lecture tools: four generate buttons */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 18px}
.tool{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.tool:hover:not([disabled]){border-color:var(--hue)}
.tool:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tool b{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.tool span{font-size:.78rem;color:var(--muted);line-height:1.3}
.tool .ic{font-family:var(--f-mono);font-size:.7rem;font-weight:600;color:var(--hue);letter-spacing:.06em}
.tool[disabled]{opacity:.6;cursor:progress}
.tool .ar{font-family:"Cairo",var(--f-body)}
.toolmsg{font-size:.85rem;color:var(--muted);margin:-10px 0 16px;min-height:1.2em}
.toolmsg.err{color:var(--bad)}
@media (max-width:760px){.tools{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--teal)"/><rect x="16.5" y="8" width="7" height="24" rx="2" fill="var(--surface)"/><rect x="8" y="16.5" width="24" height="7" rx="2" fill="var(--surface)"/><circle cx="20" cy="20" r="3.2" fill="var(--amber)"/></svg>

  </header>
  <main id="view"></main>
  <footer>Lessons and quizzes built from Noor's MSA e-learning lectures (Fall 2026). Progress is saved in this browser.</footer>
</div>

<script>
const COURSES = [
{
 id:"genetics", code:"PHB221", name:"Molecular Genetics", hue:"var(--c1)",
 staff:"Assoc. Prof. Amr Abdelhamid · Dr. Mohamed Abdelghany",
 lectures:[
 {n:1,t:"DNA structure and replication",h:`
 <p>DNA is a <b>double helix</b> of two <b>antiparallel</b> strands (one runs 5'→3', the other 3'→5'). The sugar–phosphate backbone is outside; the bases are inside.</p>
 <ul>
 <li><b>Franklin</b> (X-ray crystallography): backbone outside, bases inside, helical, two strands.</li>
 <li><b>Chargaff's rules</b>: A = T and G = C, so purines (A+G) = pyrimidines (T+C). A=T has <b>2</b> H-bonds; G≡C has <b>3</b> (about 50% stronger).</li>
 <li><b>Watson & Crick (1953)</b>: double helix, antiparallel, read 5'→3'.</li>
 <li>Nucleotides are linked by <b>phosphodiester bonds</b> (3'-OH of one sugar to 5' of the next). Base–sugar link = <b>N-glycosidic bond</b>.</li>
 </ul>
 <div class="terms"><div class="term"><b>Nucleobase</b><span>Base only</span></div><div class="term"><b>Nucleoside</b><span>Base + pentose</span></div><div class="term"><b>Nucleotide</b><span>Base + pentose + phosphate</span></div></div>
 <p><b>DNA forms:</b> B (right-handed, common in cells, high water), A (right-handed, dehydrated), Z (left-handed, rare, narrow and elongated).</p>
 <p><b>Packing:</b> DNA wraps ~<b>146 bp</b> around a histone octamer = one <b>nucleosome</b> → chromatin fibre → chromosome.</p>
 <h4>Replication is semiconservative</h4>
 <ol>
 <li><b>Origin</b>: AT-rich consensus sequence (one in prokaryotes, many in eukaryotes). DnaA binds (needs ATP).</li>
 <li><b>Helicase</b> unwinds (ATP); <b>SSB proteins</b> keep strands apart; <b>topoisomerase</b> relieves supercoils ahead of the fork.</li>
 <li><b>Primase</b> makes a short RNA <b>primer</b> (~10 nt).</li>
 <li><b>DNA pol III</b> adds dNTPs to the free 3'-OH: reads template 3'→5', builds new strand 5'→3'. <b>Leading strand</b> = continuous (1 primer). <b>Lagging strand</b> = discontinuous <b>Okazaki fragments</b> (many primers).</li>
 <li><b>DNA pol I</b> removes primers (5'→3' exonuclease) and fills gaps.</li>
 <li><b>Ligase</b> seals nicks with a phosphodiester bond (ATP → AMP + PPi).</li>
 </ol>
 <div class="tblwrap"><table><tr><th>DNA pol III</th><th>DNA pol I</th></tr><tr><td>5'→3' polymerase (main synthesis)<br>3'→5' exonuclease = proofreading</td><td>5'→3' exonuclease removes primers<br>5'→3' polymerase fills gaps<br>3'→5' proofreading</td></tr></table></div>
 <div class="pearl"><strong>Exam order:</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase.</div>`},
 {n:2,t:"End replication problem and transcription",h:`
 <p>DNA polymerases only build 5'→3' and cannot start without a primer, so the extreme 3' end of the lagging strand is not copied: the <b>end replication problem</b>.</p>
 <ul>
 <li><b>Telomeres</b> cap chromosome ends: tandem <b>TTAGGG</b> repeats + a 12–16 nt 3' overhang. Humans: 46 chromosomes = <b>92 telomeres</b>.</li>
 <li><b>Telomerase</b> = protein + its own RNA template; it works as a <b>reverse transcriptase</b> (binding → polymerization → translocation).</li>
 <li>Low telomerase in normal cells → telomeres shorten with age (~10,000 bp at birth → ~5,000 bp late in life). <b>Cancer cells often have high telomerase</b>, a drug target. Nobel 2009: Blackburn, Greider, Szostak.</li>
 </ul>
 <h4>Transcription (DNA → RNA)</h4>
 <ul>
 <li><b>Template (antisense) strand</b> is read; <b>coding (sense) strand</b> has the same sequence as the mRNA (T instead of U).</li>
 <li>RNA pol slides 3'→5' on the template and synthesizes RNA 5'→3'.</li>
 </ul>
 <div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr><tr><td>RNA pol I</td><td>rRNA (except 5S)</td></tr><tr><td>RNA pol II</td><td>All mRNA (structural genes), some snRNA</td></tr><tr><td>RNA pol III</td><td>tRNA and 5S rRNA</td></tr></table></div>
 <p><b>Eukaryotic gene parts:</b> exons (coding), introns (non-coding, start GT and end AG), promoter with <b>TATA box</b> (~25 bp upstream, binds TFs + RNA pol II) and <b>CAAT box</b> (sets how often transcription starts), <b>enhancers</b> (activators bind, ↑ rate) and <b>silencers</b> (repressors bind, ↓ rate).</p>
 <p><b>Cis-acting</b> = DNA sequences (TATA, enhancers, silencers). <b>Trans-acting</b> = proteins that bind them.</p>
 <h4>Stages</h4>
 <ul><li><b>Initiation:</b> TFIID (TBP + TAFs) recognizes the promoter; TFIIB bridges to RNA pol II; <b>TFIIH</b> acts as helicase (open complex) and phosphorylates the CTD of pol II; TFIIE helps the move into elongation.</li>
 <li><b>Elongation:</b> pol II unwinds 10–20 bases at a time.</li>
 <li><b>Termination:</b> poly-A signal <b>AAUAAA</b>; transcript cut 10–35 nt downstream.</li></ul>`},
 {n:3,t:"RNA processing and translation",h:`
 <p><b>Chromatin remodeling:</b> tight histone–DNA blocks RNA pol. Activators recruit <b>histone acetyltransferase (HAT)</b>; acetylation lowers histone basicity → DNA loosens → promoter exposed. <b>Histone deacetylase (HDAC)</b> reverses this.</p>
 <h4>Post-transcriptional modification</h4>
 <ul>
 <li><b>Splicing</b> by the <b>spliceosome</b> (snRNPs, "snurps"): introns removed from pre-mRNA (hnRNA), exons joined. Also group I and group II self-splicing.</li>
 <li><b>Alternative splicing</b>: one gene → several proteins.</li>
 <li><b>5' cap</b>: 7-methylguanosine, added when the transcript is only 20–25 nt long. Protects from nucleases, helps export and ribosome binding.</li>
 <li><b>3' poly-A tail</b>: not encoded in the gene; added after transcription. Stability and translation.</li>
 <li>Trimming of rRNA and tRNA; editing and base modification of tRNA.</li>
 </ul>
 <h4>Translation (mRNA → protein)</h4>
 <ul>
 <li><b>tRNA</b>: L-shaped, ~80 nt; carries an amino acid and an <b>anticodon</b>. <b>Aminoacyl-tRNA synthetase</b> attaches the right amino acid.</li>
 <li><b>Wobble</b>: flexible pairing at the <b>third</b> codon base only (G pairs C or U).</li>
 <li><b>Ribosome</b>: rRNA 40% + protein 60%. Sites: <b>A</b> (new aminoacyl-tRNA), <b>P</b> (growing peptide), <b>E</b> (exit).</li>
 <li><b>Initiation:</b> small 40S subunit binds the 5' cap, finds <b>AUG</b> (Met); 60S joins.</li>
 <li><b>Elongation:</b> codon recognition (GTP) → peptide bond → translocation (GTP). Chain grows N-terminus → C-terminus.</li>
 <li><b>Termination:</b> stop codon in A site, no tRNA binds, peptide released.</li>
 <li><b>Polysome</b>: many ribosomes on one mRNA.</li>
 </ul>`},
 {n:4,t:"Post-translational modifications and the genetic code",h:`
 <p>PTMs are chemical changes after a protein is made. ~20,000–25,000 genes give a proteome of over 1 million proteins, mainly through alternative splicing plus PTMs.</p>
 <div class="tblwrap"><table><tr><th>PTM</th><th>Key facts</th></tr>
 <tr><td>Phosphorylation</td><td>On Ser, Thr, Tyr. Kinases add, phosphatases remove. Adds negative charge. Activates p53. <b>Inhibits</b> acetyl-CoA carboxylase (activated by dephosphorylation).</td></tr>
 <tr><td>Hydroxylation</td><td>Hydroxylases; Pro and Lys in collagen.</td></tr>
 <tr><td>Acetylation</td><td>Histone acetylation reduces positive charge → DNA looser → transcription.</td></tr>
 <tr><td>Methylation</td><td>Methyltransferases on Lys (up to 3×) or Arg (up to 2×). On histones can activate or repress.</td></tr>
 <tr><td>Ubiquitination</td><td>Ubiquitin (8.6 kDa) tags proteins, often for <b>proteasome</b> degradation.</td></tr>
 <tr><td>Proteolysis</td><td>Cleavage, e.g. removal of N-terminal Met, activation of inactive precursors.</td></tr>
 <tr><td>Carboxylation</td><td>γ-glutamyl carboxylase; needs <b>vitamin K</b> (clotting factors).</td></tr></table></div>
 <div class="pearl"><strong>Nobel 2019 (HIF-1α):</strong> at normal O₂, HIF-1α is <b>prolyl-hydroxylated</b> → recognized by <b>VHL</b> → ubiquitinated → degraded in the proteasome. At low O₂, HIF-1α builds up and switches on genes such as EPO.</div>
 <h4>Genetic code</h4>
 <ul><li>Codon = 3 bases. 4×4×4 = <b>64 codons</b>: 61 code amino acids, 3 are stop codons.</li>
 <li><b>AUG</b> = Met and the start codon. Several codons can code the same amino acid (redundancy).</li>
 <li>Example: AUG-GUG-CCA-CGA-AGG-UGA = Met-Val-Pro-Arg-Arg-Stop.</li></ul>`},
 {n:5,t:"Regulation of gene expression I",h:`
 <ul><li><b>Constitutive</b> genes: always on, constant level (survival, metabolic enzymes). <b>Facultative</b>: on only under certain conditions.</li>
 <li><b>Epigenetics</b>: changes in gene expression without changing the DNA sequence. Three tools: cis/trans elements, ncRNAs, histone modifications.</li></ul>
 <h4>Proteins and DNA elements</h4>
 <ul><li><b>C/EBPs</b>: family of 6 TFs that recruit co-activators.</li>
 <li><b>Sp1</b> binds <b>GC boxes</b> and recruits TFIID and RNA pol II.</li>
 <li>Activators have a <b>DNA-binding domain</b> and a <b>regulatory domain</b>; at enhancers they recruit HAT. <b>Coactivators</b> pass the signal to the basal factors.</li>
 <li>Thymidine kinase promoter: GC, CAAT, GC, TATA (at about −25).</li></ul>
 <h4>DNA methylation</h4>
 <p>DNA methylase adds −CH₃ at <b>CpG islands</b> near promoters → <b>represses</b> transcription by (1) blocking Sp1 binding to the GC box and (2) recruiting <b>methyl-CpG binding protein</b> + HDAC → closed chromatin. Unmethylated CpG islands = active genes.</p>
 <h4>Non-coding RNAs</h4>
 <ul><li>Transcribed but not translated; include miRNA, lncRNA, circRNA.</li>
 <li><b>miRNA</b>: ~22 nt single strand; made by RNA pol II as hairpin, cut by <b>Dicer</b>, works inside <b>RISC</b>; binds the <b>3'UTR</b> of target mRNA → degradation or translational block.</li>
 <li>Nobel 2024: Ambros & Ruvkun, discovery of microRNA.</li></ul>
 <div class="pearl"><strong>Case logic:</strong> more miRNA-181 → less telomerase (its mRNA is silenced).</div>`},
 {n:6,t:"Regulation of gene expression II",h:`
 <ul><li><b>circRNA</b>: made by <b>back-splicing</b> (5' end joins 3' end). Half-life ~48 h, about 5× more stable than linear mRNA. Acts as a <b>miRNA sponge</b>.</li>
 <li><b>lncRNA</b>: &gt;200 nt (usually 1,000–10,000), made by pol II, capped and polyadenylated. Works as <b>guide</b>, <b>scaffold</b>, <b>decoy</b> for TFs, or binds miRNA.</li></ul>
 <div class="pearl"><strong>Case logic:</strong> a circRNA that sponges miRNA-181 goes down → more free miRNA-181 → less telomerase.</div>
 <h4>Histones and chromatin</h4>
 <ul><li>Octamer = 2 × (H2A, H2B, H3, H4). <b>H1</b> is the linker histone → 30 nm fibre.</li>
 <li><b>CENP-A</b> replaces H3 at centromeres (kinetochore attachment).</li>
 <li>Remodeling complexes use ATP to <b>slide</b>, <b>transfer</b> or <b>remodel</b> nucleosomes.</li>
 <li>Positioning: A:T-rich DNA bends easily toward the minor groove facing the octamer.</li></ul>
 <div class="tblwrap"><table><tr><th>Histone tail change</th><th>Effect</th></tr><tr><td>Lysine acetylation</td><td>Active chromatin</td></tr><tr><td>Deacetylation</td><td>Repressed chromatin</td></tr><tr><td>Methylation</td><td>Active or repressed (depends on residue)</td></tr><tr><td>Serine phosphorylation</td><td>Active chromatin</td></tr></table></div>
 <p><b>Bromodomains</b> read acetylated tails; <b>chromodomains</b> read methylated tails.</p>
 <h4>Examples and motifs</h4>
 <ul><li>Cell differentiation: same genome, different proteome.</li>
 <li>Globin switching from embryo → fetus → adult changes oxygen affinity (highest in embryo).</li>
 <li>DNA-binding proteins read the <b>major groove</b>. Motifs: <b>helix-turn-helix</b> (most common), <b>zinc finger</b> (more fingers = tighter binding), <b>leucine zipper</b> (Y-shaped dimer joined by leucines).</li></ul>`},
 {n:7,t:"Genetic variation and the Human Genome Project",h:`
 <ul><li><b>HGP</b>: launched Oct 1990, completed Apr 2003; international consortium of 20 centres in 6 countries; used and improved <b>Sanger sequencing</b>.</li>
 <li>Draft (June 2000) covered ~90%; 2003 version ~<b>92%</b> with &lt;400 gaps. Hard regions: telomeres and centromeres (highly repetitive).</li>
 <li><b>T2T consortium, March 2022</b>: first truly complete human genome.</li>
 <li>Impact: genetic testing, ancestry, <b>precision medicine</b>.</li>
 <li><b>Egyptian Genome Project</b> (March 2021): a reference Egyptian genome, genes of common diseases, ancient Egyptian genomes, personalized medicine.</li>
 <li>Humans are <b>99.9%</b> identical at the base-pair level; the 0.1% (e.g. SNPs) shapes traits and disease risk.</li></ul>`}
