<p>محاضرة 6 بتفتح النص التاني من الكورس: <b>المركّبات الحلقية غير المتجانسة (heterocycles)</b>. معظم الأدوية فيها حلقة heterocyclic واحدة على الأقل، فلازم تعرفي تميّزيها و<b>تسمّيها</b>، بالـ<b>أسماء الشائعة (trivial)</b> وبالطريقة <b>المنهجية Hantzsch–Widman (IUPAC)</b>، ومعاها الترقيم والحلقات المشبعة جزئيًا.</p>

<h4>1. يعني إيه heterocycle وليه مهم؟</h4>
<p>الـ <b>heterocyclic compound</b> فيه حلقة من ذرات كربون <b>ومعاها عنصر تاني واحد على الأقل</b> (اسمه <b>heteroatom</b>): N أو O أو S، وكمان Si و B و P وغيرهم.</p>
<ul>
<li>كل <b>الأحماض النووية</b> فيها heterocycles (القواعد البيورين والبيريميدين).</li>
<li>نكهات طبيعية كتير وقلويدات (المورفين والنيكوتين).</li>
<li>معظم <b>الأدوية</b>: حوالي <b>59% من الأدوية المعتمدة من الـ FDA فيها حلقات نيتروجينية</b>، لأنها بتحسّن <b>ذوبان</b> الدوا و<b>انتقائيته</b> (النيتروجين بيعمل روابط هيدروجينية وممكن ياخد بروتون).</li>
</ul>
<p>وفي تقسيم محاضرة 5، المركّبات الحلقية يا homocyclic يا <b>heterocyclic</b>، والـ heterocycles ممكن تكون <b>alicyclic</b> (مشبعة زي البيبيريدين) أو <b>أروماتية</b> (زي البيريدين).</p>

<h4>2. نظامين للتسمية</h4>
<ol>
<li><b>الأسماء الشائعة (trivial)</b>: بتدي معلومة قليلة أو مفيش عن التركيب، بس لسه مستخدمة جدًا (pyridine و furan و imidazole).</li>
<li><b>أسماء IUPAC المنهجية (Hantzsch–Widman)</b>: مبنية على قواعد، فتقدري تعرفي التركيب من الاسم.</li>
</ol>

<h4>3. أسماء شائعة لازم تعرفيها</h4>
<h5>حلقات خماسية فيها heteroatom أو اتنين</h5>
<div class="tblwrap"><table><tr><th>Name</th><th>Heteroatom(s)</th></tr>
<tr><td>Pyrrole</td><td>1 N</td></tr><tr><td>Furan</td><td>1 O</td></tr><tr><td>Thiophene</td><td>1 S</td></tr>
<tr><td>Imidazole</td><td>2 N (1,3)</td></tr><tr><td>Pyrazole</td><td>2 N (1,2)</td></tr>
<tr><td>Oxazole</td><td>O + N (1,3)</td></tr><tr><td>Thiazole</td><td>S + N (1,3)</td></tr></table></div>
<p>الحلقات الخماسية الأروماتية اللي فيها نيتروجين اسمها <b>azoles</b>.</p>
<h5>حلقات سداسية فيها نيتروجين واحد أو اتنين (azines)</h5>
<div class="tblwrap"><table><tr><th>Name</th><th>Nitrogens</th></tr>
<tr><td>Pyridine</td><td>1 N</td></tr><tr><td>Pyridazine</td><td>2 N at 1,2</td></tr>
<tr><td>Pyrimidine</td><td>2 N at 1,3</td></tr><tr><td>Pyrazine</td><td>2 N at 1,4</td></tr></table></div>
<h5>Heterocycles مشبعة</h5>
<p>الحلقات المشبعة بالكامل ليها أسماء شائعة برضه، زي <b>pyrrolidine</b> (البيرول المشبع)، و<b>piperidine</b> (البيريدين المشبع)، و<b>tetrahydrofuran</b>، و<b>piperazine</b>، و<b>morpholine</b>.</p>

<h4>4. نظام Hantzsch–Widman: بادئة + جذر + لاحقة</h4>
<div class="formula">IUPAC name = PREFIX (heteroatom type, number, position) + STEM (ring size) + SUFFIX (saturation; N or not)</div>
<h5>البادئة: نوع الـ heteroatom</h5>
<div class="tblwrap"><table><tr><th>Atom</th><th>Prefix</th><th>Priority</th></tr>
<tr><td>O</td><td>oxa</td><td>Highest</td></tr><tr><td>S</td><td>thia</td><td>↓</td></tr><tr><td>N</td><td>aza</td><td>↓</td></tr><tr><td>P</td><td>phospha</td><td>Lowest</td></tr></table></div>
<ul>
<li>لو فيه heteroatoms <b>مختلفة</b>، نكتبهم <b>بترتيب الأولوية</b> (O قبل S قبل N)، وكل واحد برقم مكانه.</li>
<li>لو فيه <b>أكتر من واحد من نفس النوع</b>، نستخدم <b>di و tri و tetra</b> (زي 1,3-diaza).</li>
<li>لما بادئة آخرها "a" تقابل جذر أوله حرف متحرك، الـ "a" بتتشال (oxa + irane ← oxirane).</li>
</ul>
<h5>الجذر واللاحقة: حجم الحلقة والتشبع</h5>
<div class="tblwrap"><table><tr><th>Size</th><th>Stem</th><th>N: unsat.</th><th>N: sat.</th><th>No N: unsat.</th><th>No N: sat.</th></tr>
<tr><td>3</td><td>ir</td><td>-irine</td><td>-iridine</td><td>-irene</td><td>-irane</td></tr>
<tr><td>4</td><td>et</td><td>-ete</td><td>-etidine</td><td>-ete</td><td>-etane</td></tr>
<tr><td>5</td><td>ol</td><td>-ole</td><td>-olidine</td><td>-ole</td><td>-olane</td></tr>
<tr><td>6</td><td>in</td><td>-ine</td><td>-inane</td><td>-ine</td><td>-inane</td></tr>
<tr><td>7</td><td>ep</td><td>-epine</td><td>-epane</td><td>-epine</td><td>-epane</td></tr>
<tr><td>8</td><td>oc</td><td>-ocine</td><td>-ocane</td><td>-ocine</td><td>-ocane</td></tr></table></div>
<p>أنماط تاخدي بالك منها: "-idine" بتظهر بس في <b>الحلقات المشبعة اللي فيها N</b> (التلاتية والرباعية والخماسية)؛ والحلقات المشبعة من غير N آخرها "-ane". و"غير مشبعة" هنا معناها أقصى عدد من الروابط المزدوجة غير المتراكمة.</p>
<div class="ex"><b>أمثلة محلولة:</b><br>
تلاتية، N، مشبعة ← aza + iridine ← <b>aziridine</b>.<br>
تلاتية، O، مشبعة ← oxa + irane ← <b>oxirane</b> (ethylene oxide، إيبوكسيد).<br>
تلاتية، S، مشبعة ← thia + irane ← <b>thiirane</b>.<br>
تلاتية، N، غير مشبعة ← <b>azirine</b>. تلاتية، O، غير مشبعة ← <b>oxirene</b>.<br>
رباعية، N، مشبعة ← <b>azetidine</b> (الحلقة في المضادات الحيوية β-lactam هي azetidinone).<br>
خماسية، O، مشبعة ← <b>oxolane</b> (= tetrahydrofuran). خماسية، N، مشبعة ← <b>azolidine</b> (= pyrrolidine).<br>
خماسية، O و N (1,3)، غير مشبعة ← <b>1,3-oxazole</b>. سداسية، O واحد، غير مشبعة ← oxine (pyran).<br>
سباعية، N واحد، غير مشبعة ← <b>azepine</b> (زي في الـ benzodiazepines).</div>

<h4>5. ترقيم الحلقة الواحدة</h4>
<ol>
<li>الـ heteroatom بياخد رقم <b>1</b>.</li>
<li>لو فيه <b>أكتر من heteroatom من نفس النوع</b>، نبدأ من <b>المشبع</b> فيهم (اللي عليه H، زي الـ NH في imidazole)، وبعدين نرقّم بحيث التاني ياخد أقل رقم.</li>
<li>لو فيه <b>heteroatoms مختلفة</b>، نبدأ من <b>الأعلى أولوية (O &gt; S &gt; N)</b>، ونكمّل في الاتجاه اللي يدي الباقيين <b>أقل أرقام ممكنة</b>. الـ Thiazole: S = 1 و N = 3.</li>
</ol>

<h4>6. الحلقات المشبعة جزئيًا: الهيدروجين المحدد و "hydro"</h4>
<h5>أ. الهيدروجين المحدد (H مائل)</h5>
<p>فيه حلقات فيها <b>أقصى عدد من الروابط المزدوجة غير المتراكمة</b> (حلقة <b>mancude</b>) بس لسه فيها ذرة <b>مربوطة بروابط أحادية بس</b> مع جيرانها، لأن الروابط المزدوجة ممكن تترتب بأكتر من طريقة. المكان "المشبع إجباريًا" ده بنوضحه بـ<b>حرف H كابيتال مائل</b> برقمه، ونختار <b>أقل رقم</b>.</p>
<p>أمثلة: <b>1H-phosphole</b> و<b>2H-1,3-dioxole</b> و<b>5H-1,2,3-oxathiazole</b> و<b>4H-oxine</b> (4H-pyran) و<b>1H-azepine</b>. (والبيرول اسمه الصح 1H-pyrrole: نيتروجين الـ NH هو الذرة المربوطة بروابط أحادية.)</p>
<h5>ب. الهيدروجين المضاف (بادئات "hydro")</h5>
<p>لو الحلقة فيها روابط مزدوجة <b>أقل</b> من الأقصى، بنسميها من الأصل غير المشبع بالكامل ونضيف <b>dihydro أو tetrahydro</b> وهكذا، بأرقام الأماكن المشبعة، بأقل أرقام ممكنة.</p>
<p>أمثلة: <b>1,2-dihydroazine</b> و<b>1,4-dihydroazine</b> (الـ 1,4-dihydropyridines عيلة من حاصرات قنوات الكالسيوم زي nifedipine) و<b>2,3,4,5-tetrahydroazine</b> و<b>2,3-dihydrooxole</b>.</p>
<h5>ج. الاتنين مع بعض</h5>
<p>لو الحلقة فيها روابط مزدوجة أقل من الأقصى <b>وكمان</b> ذرة مشبعة إجباريًا، نستخدم <b>الاتنين</b>: بادئات "hydro" للأماكن المشبعة الزيادة، و<b>H</b> محدد للإجباري. <b>وندي أقل رقم للهيدروجين المحدد الأول.</b></p>
<p>أمثلة: <b>2,3-dihydro-1H-azepine</b>؛ و<b>3,4-dihydro-2H-pyran</b>.</p>
<div class="pearl"><strong>خطوات أي اسم:</strong> (1) حددي الـ heteroatoms ← البادئات بترتيب O &gt; S &gt; N؛ (2) عدّي ذرات الحلقة ← الجذر؛ (3) مشبعة ولا لأ، فيها N ولا لأ ← اللاحقة؛ (4) رقّمي من الـ heteroatom الأعلى أولوية وادي الباقيين أقل أرقام؛ (5) ضيفي H المحدد أو بادئات hydro لو مشبعة جزئيًا.</div>

DEEP.physio[1]={en:`
<p>This course explains how the organs of the body normally work (<b>physiology</b>) and what goes wrong in disease (<b>pathophysiology</b>), linking changes in cells to the signs and symptoms patients show. Lecture 1 lays the foundation: levels of organisation, the cell membrane and how substances cross it, <b>body water balance</b>, and what happens in <b>dehydration, overhydration and electrolyte disturbances</b>. (The slides here are mostly diagrams, so this explanation follows the lecture's outline, its exit-ticket recap and the course question bank.)</p>

<h4>1. Physiology vs pathophysiology</h4>
<ul>
<li><b>Physiology</b>: the study of the <b>normal function</b> of the body and its parts.</li>
<li><b>Pathophysiology</b>: the study of the <b>disordered function</b> that occurs in disease or injury, and how it produces clinical manifestations.</li>
</ul>
<p>A multicellular organism is organised in levels: <b>cell → tissue → organ → system → organism</b>. A tissue is a group of similar cells doing one job; an organ combines tissues; a system is a group of organs working together (e.g. the cardiovascular system).</p>
<p><b>Homeostasis</b> is the body's ability to keep its internal environment (temperature, water, ions, pH, glucose) within narrow limits, usually by <b>negative feedback</b>: a change is detected and a response opposes it.</p>

<h4>2. The cell membrane</h4>
<ul>
<li>A <b>phospholipid bilayer</b>: hydrophilic heads face the watery fluid inside and outside; hydrophobic tails face each other in the middle. This makes the membrane a barrier to charged and polar substances.</li>
<li><b>Membrane proteins</b> do the selective work: <b>channels</b> (pores for specific ions), <b>carriers</b> (bind a substance and change shape to move it), <b>pumps</b> (carriers that use ATP), <b>receptors</b> and enzymes.</li>
<li>Cholesterol adjusts fluidity; carbohydrate chains on the outer surface act in cell recognition.</li>
</ul>

<h4>3. Body fluids</h4>
<p>About 60% of adult body weight is water. It is divided between the <b>intracellular fluid (ICF)</b>, inside cells (about two-thirds), and the <b>extracellular fluid (ECF)</b> (about one-third), which includes <b>interstitial fluid</b> around cells and <b>plasma</b> in blood vessels. ICF is rich in <b>K⁺</b>; ECF is rich in <b>Na⁺ and Cl⁻</b>. The Na⁺/K⁺ pump maintains this difference.</p>
<p>Elderly people have <b>less total body water</b> and a weaker thirst response, so they become dehydrated more easily.</p>

<h4>4. Transport across the membrane</h4>
<div class="tblwrap"><table><tr><th>Type</th><th>Energy</th><th>Direction</th><th>Membrane protein?</th><th>Example</th></tr>
<tr><td><b>Simple diffusion</b></td><td>None (passive)</td><td>Down the concentration gradient</td><td>No: passes through the lipid bilayer</td><td>O₂, CO₂, lipid-soluble molecules</td></tr>
<tr><td><b>Facilitated diffusion</b></td><td>None (passive)</td><td>Down the gradient</td><td>Yes: channel or carrier</td><td>Glucose via GLUT carriers</td></tr>
<tr><td><b>Primary active transport</b></td><td>ATP used <b>directly</b></td><td><b>Against</b> the gradient</td><td>Yes: pump (ATPase)</td><td>Na⁺/K⁺-ATPase: 3 Na⁺ out, 2 K⁺ in</td></tr>
<tr><td><b>Secondary active transport</b> (co-transport)</td><td>Indirect: uses an existing Na⁺ gradient made by the pump</td><td>One substance against its gradient, coupled to Na⁺ moving down its gradient</td><td>Yes: co-transporter</td><td>Na⁺–glucose co-transport in the intestine and kidney</td></tr></table></div>
<div class="ex"><b>Question bank example:</b> intestinal cells take up glucose against its gradient by coupling it to Na⁺ moving down its gradient. That is <b>secondary active transport (co-transport)</b>. It's not simple diffusion: glucose is polar and can't cross the lipid bilayer directly. It's not primary active: no ATP is split by the glucose carrier itself.</div>
<p><b>Osmosis</b> is the passive movement of <b>water</b> across a membrane from a region of lower solute concentration to higher solute concentration.</p>
<h5>Tonicity and red blood cells</h5>
<ul>
<li><b>Isotonic</b> solution (e.g. 0.9% NaCl): no net water movement; cells keep their shape.</li>
<li><b>Hypotonic</b> solution: water enters the cells, so RBCs <b>swell and may burst (lyse, haemolysis)</b>.</li>
<li><b>Hypertonic</b> solution: water leaves the cells, so they <b>shrink</b> (crenation).</li>
</ul>

<h4>5. Homeostasis of water balance</h4>
<p>When the body loses water (sweating, little intake), blood becomes more concentrated (higher osmolality):</p>
<ol>
<li><b>Osmoreceptors in the hypothalamus</b> detect the raised solute concentration.</li>
<li>The hypothalamus triggers release of <b>antidiuretic hormone (ADH, vasopressin)</b> from the <b>posterior pituitary</b>. Thirst is also stimulated.</li>
<li>ADH acts on the kidneys' collecting ducts to <b>reabsorb more water</b>, so urine becomes small in volume and concentrated.</li>
<li>Blood concentration returns toward normal, and ADH release falls (negative feedback).</li>
</ol>
<p>Excess water intake does the opposite: low osmolality, less ADH, large dilute urine.</p>

<h4>6. Dehydration</h4>
<p><b>Signs:</b> <b>low blood pressure</b> (less blood volume), <b>rapid heart rate</b> (the heart compensates), <b>dry skin and mucous membranes</b>, reduced sweating, thirst, dark scanty urine. In <b>severe dehydration (loss of 10–15% of body water)</b>: lethargy, confusion, <b>delirium</b>, and eventually shock.</p>

<h4>7. Overhydration and electrolyte disturbances</h4>
<h5>Hyponatraemia (low blood sodium)</h5>
<p>Can follow vomiting and diarrhoea replaced only with plain water, or excess water intake. The ECF becomes hypotonic, so water moves <b>into cells</b>. Brain cells swell, causing <b>cerebral oedema</b>: headache, <b>confusion, lethargy, seizures</b>, and in severe cases coma.</p>
<h5>Hyperkalaemia (high blood potassium)</h5>
<p>Common in <b>kidney failure</b> (the kidneys can't excrete K⁺). Potassium sets the <b>resting membrane potential</b> of excitable cells, so a high level disturbs heart muscle excitability, causing <b>life-threatening cardiac arrhythmias</b> and possible cardiac arrest. This is the most immediate danger.</p>
<div class="ex"><b>Question bank examples:</b> (1) After heavy sweating, the hypothalamus detects high solute and triggers ADH from the posterior pituitary to increase renal water reabsorption. (2) In end-stage renal disease with severe hyperkalaemia, the most immediate threat to life is severe cardiac arrhythmia.</div>
<div class="pearl"><strong>Exit-ticket recap:</strong> levels of organisation; physiology vs pathophysiology; dehydration vs overhydration; membrane and its proteins; passive (simple and facilitated diffusion) vs active (primary and secondary) transport.</div>

<p>الكورس ده بيشرح أعضاء الجسم بتشتغل إزاي في الطبيعي (<b>الفسيولوجي</b>) وإيه اللي بيبوظ في المرض (<b>الباثوفسيولوجي</b>)، وبيربط التغيرات اللي في الخلايا بالعلامات والأعراض اللي بتظهر على المريض. المحاضرة الأولى بتحط الأساس: مستويات التنظيم، وغشاء الخلية وإزاي المواد بتعدّيه، و<b>توازن الماء في الجسم</b>، واللي بيحصل في <b>الجفاف وزيادة الماء واضطرابات الأملاح</b>. (السلايدات هنا معظمها رسومات، فالشرح ده ماشي على خطة المحاضرة وملخص الـ exit ticket وبنك أسئلة الكورس.)</p>

<h4>1. الفسيولوجي مقابل الباثوفسيولوجي</h4>
<ul>
<li><b>الفسيولوجي</b>: دراسة <b>الوظيفة الطبيعية</b> للجسم وأجزائه.</li>
<li><b>الباثوفسيولوجي</b>: دراسة <b>الوظيفة المختلة</b> اللي بتحصل في المرض أو الإصابة، وإزاي بتطلّع الأعراض.</li>
</ul>
<p>الكائن متعدد الخلايا متنظم على مستويات: <b>خلية ← نسيج ← عضو ← جهاز ← كائن</b>. النسيج مجموعة خلايا شبه بعض بتعمل شغلانة واحدة؛ والعضو بيجمع أنسجة؛ والجهاز مجموعة أعضاء بتشتغل مع بعض (زي الجهاز الدوري).</p>
<p>الـ <b>Homeostasis</b> (الاتزان الداخلي) هو قدرة الجسم إنه يحافظ على البيئة الداخلية (الحرارة، الماء، الأملاح، الـ pH، الجلوكوز) في حدود ضيقة، غالبًا بـ<b>التغذية الراجعة السالبة</b>: التغيير بيتحس، والاستجابة بتعاكسه.</p>

<h4>2. غشاء الخلية</h4>
<ul>
<li><b>طبقتين من الفوسفوليبيد</b>: الروس المحبة للماء بتبص للسائل جوّه وبرّه، والديول الكارهة للماء بتبص لبعض في النص. ده بيخلي الغشاء حاجز قدام المواد المشحونة والقطبية.</li>
<li><b>بروتينات الغشاء</b> هي اللي بتعمل الشغل الانتقائي: <b>قنوات</b> (مسام لأيونات معينة)، و<b>حاملات</b> (بتمسك المادة وتغيّر شكلها عشان تعدّيها)، و<b>مضخات</b> (حاملات بتستخدم ATP)، و<b>مستقبلات</b> وإنزيمات.</li>
<li>الكوليسترول بيظبط سيولة الغشاء، وسلاسل الكربوهيدرات على السطح الخارجي بتساعد الخلايا تتعرف على بعض.</li>
</ul>

<h4>3. سوائل الجسم</h4>
<p>حوالي 60% من وزن الشخص البالغ ماء، ومتقسم بين <b>السائل جوّه الخلايا (ICF)</b> (حوالي التلتين)، و<b>السائل برّه الخلايا (ECF)</b> (حوالي التلت)، وده فيه <b>السائل البيني</b> حوالين الخلايا و<b>البلازما</b> في الأوعية. الـ ICF غني بـ<b>البوتاسيوم</b>، والـ ECF غني بـ<b>الصوديوم والكلوريد</b>. ومضخة Na⁺/K⁺ هي اللي بتحافظ على الفرق ده.</p>
<p>كبار السن عندهم <b>ماء أقل في الجسم</b> وإحساس العطش عندهم أضعف، فبيجيلهم جفاف أسهل.</p>

<h4>4. النقل عبر الغشاء</h4>
<div class="tblwrap"><table><tr><th>Type</th><th>Energy</th><th>Direction</th><th>Protein?</th><th>Example</th></tr>
<tr><td>Simple diffusion</td><td>None</td><td>Down gradient</td><td>No</td><td>O₂, CO₂, lipid-soluble</td></tr>
<tr><td>Facilitated diffusion</td><td>None</td><td>Down gradient</td><td>Channel/carrier</td><td>Glucose via GLUT</td></tr>
<tr><td>Primary active</td><td>ATP directly</td><td>Against gradient</td><td>Pump</td><td>Na⁺/K⁺-ATPase (3 Na⁺ out, 2 K⁺ in)</td></tr>
<tr><td>Secondary active</td><td>Existing Na⁺ gradient</td><td>Against, coupled to Na⁺</td><td>Co-transporter</td><td>Na⁺–glucose in gut and kidney</td></tr></table></div>
<p>يعني: الـ <b>simple diffusion</b> من غير طاقة ومع التدرج ومن غير بروتين (بيعدّي من الدهون نفسها، زي الأكسجين وثاني أكسيد الكربون). والـ <b>facilitated diffusion</b> من غير طاقة ومع التدرج بس بقناة أو حامل (زي الجلوكوز بالـ GLUT). والـ <b>primary active</b> بيستخدم <b>ATP مباشرة</b> ضد التدرج بمضخة (زي Na⁺/K⁺-ATPase: 3 صوديوم برّه و2 بوتاسيوم جوّه). والـ <b>secondary active</b> بيستغل تدرج الصوديوم اللي المضخة عملته عشان يدخّل مادة تانية ضد تدرجها (زي نقل الصوديوم مع الجلوكوز في الأمعاء والكلى).</p>
<div class="ex"><b>مثال من بنك الأسئلة:</b> خلايا الأمعاء بتدخّل الجلوكوز ضد تدرجه بربطه بالصوديوم اللي داخل مع تدرجه. ده <b>secondary active transport (co-transport)</b>. مش simple diffusion لأن الجلوكوز قطبي وما يعدّيش من الدهون مباشرة. ومش primary active لأن حامل الجلوكوز نفسه ما بيكسرش ATP.</div>
<p>الـ <b>Osmosis</b> هو حركة <b>الماء</b> السلبية عبر الغشاء من منطقة تركيز المذاب فيها أقل لمنطقة تركيزه أعلى.</p>
<h5>التوتر (Tonicity) وكرات الدم الحمرا</h5>
<ul>
<li>محلول <b>isotonic</b> (زي 0.9% NaCl): مفيش حركة ماء صافية، والخلايا بتحافظ على شكلها.</li>
<li>محلول <b>hypotonic</b>: الماء بيدخل الخلايا، فكرات الدم <b>بتنتفخ وممكن تنفجر (hemolysis)</b>.</li>
<li>محلول <b>hypertonic</b>: الماء بيخرج من الخلايا، فـ<b>بتنكمش</b>.</li>
</ul>

<h4>5. توازن الماء</h4>
<p>لما الجسم يفقد ماء (عرق، شرب قليل)، الدم بيبقى مركّز أكتر:</p>
<ol>
<li><b>الـ osmoreceptors في الـ hypothalamus</b> بتحس بزيادة تركيز المذاب.</li>
<li>الـ hypothalamus بيخلي <b>الهرمون المضاد لإدرار البول (ADH)</b> ينزل من <b>الـ posterior pituitary</b>، وكمان بيحفّز العطش.</li>
<li>الـ ADH بيشتغل على الكلى عشان <b>ترجّع ماء أكتر</b>، فالبول يبقى قليل ومركّز.</li>
<li>تركيز الدم يرجع للطبيعي، وإفراز الـ ADH يقل (تغذية راجعة سالبة).</li>
</ol>
<p>وشرب ماء زيادة بيعمل العكس: تركيز قليل، ADH أقل، بول كتير مخفف.</p>

<h4>6. الجفاف</h4>
<p><b>العلامات:</b> <b>ضغط واطي</b> (حجم الدم قل)، و<b>نبض سريع</b> (القلب بيعوّض)، و<b>جلد وأغشية ناشفة</b>، وعرق قليل، وعطش، وبول غامق وقليل. وفي <b>الجفاف الشديد (فقد 10–15% من ماء الجسم)</b>: خمول، وتشوش، و<b>هذيان</b>، وفي الآخر صدمة.</p>

<h4>7. زيادة الماء واضطرابات الأملاح</h4>
<h5>نقص الصوديوم (Hyponatremia)</h5>
<p>ممكن يحصل بعد قيء وإسهال اتعوّضوا بماء عادي بس، أو بشرب ماء زيادة. السائل برّه الخلايا بيبقى hypotonic، فالماء <b>بيدخل الخلايا</b>. خلايا المخ بتنتفخ فيحصل <b>وذمة دماغية</b>: صداع، و<b>تشوش، وخمول، وتشنجات</b>، وفي الحالات الشديدة غيبوبة.</p>
<h5>زيادة البوتاسيوم (Hyperkalemia)</h5>
<p>شائعة في <b>الفشل الكلوي</b> (الكلى ما تقدرش تخرّج البوتاسيوم). البوتاسيوم هو اللي بيحدد <b>جهد الراحة</b> في الخلايا القابلة للإثارة، فزيادته بتلخبط استثارة عضلة القلب وتعمل <b>اضطرابات نظم خطيرة على الحياة</b> وممكن توقف القلب. ودي أخطر حاجة فورًا.</p>
<div class="ex"><b>أمثلة من بنك الأسئلة:</b> (1) بعد عرق كتير، الـ hypothalamus بيحس بالتركيز العالي ويطلّع ADH من الـ posterior pituitary عشان الكلى ترجّع ماء أكتر. (2) في الفشل الكلوي النهائي مع زيادة بوتاسيوم شديدة، أخطر تهديد فوري هو اضطراب نظم القلب الشديد.</div>
<div class="pearl"><strong>ملخص الـ exit ticket:</strong> مستويات التنظيم؛ الفسيولوجي مقابل الباثوفسيولوجي؛ الجفاف مقابل زيادة الماء؛ الغشاء وبروتيناته؛ النقل السلبي (simple و facilitated diffusion) مقابل النشط (primary و secondary).</div>

DEEP.physio[2]={en:`
<p>Lecture 2 is about <b>blood</b>: what it is made of, how plasma proteins (especially albumin) hold water in the vessels, the structure and work of <b>red blood cells</b> and <b>haemoglobin</b>, how RBCs are produced, the role of <b>platelets</b> in haemostasis, and the main <b>anaemias</b>, including the inherited ones. It also contains the Lecture 1 case study, solved at the end.</p>

<h4>1. Composition of blood</h4>
<ul>
<li>Blood = <b>plasma</b> (fluid) + <b>formed elements</b> (solid particles): <b>red blood cells</b> (erythrocytes), <b>white blood cells</b> (leukocytes) and <b>platelets</b> (thrombocytes).</li>
<li>All formed elements come from <b>stem cells in the bone marrow</b>; their production is called <b>haematopoiesis</b>.</li>
<li>Normal blood <b>pH is 7.35–7.45</b> (slightly alkaline).</li>
<li>The main <b>plasma proteins</b> are <b>albumins</b>, <b>globulins</b> (including antibodies) and <b>fibrinogen</b> (for clotting).</li>
</ul>

<h4>2. Albumin and colloid osmotic pressure</h4>
<ol>
<li>Water moves freely across capillary walls, but <b>albumin is too large to leave</b> the vessels, so it stays inside.</li>
<li>The dissolved proteins inside the vessel create an osmotic pull called <b>colloid osmotic pressure (COP)</b>, which draws water <b>back into</b> the capillaries (mainly at the venous end) and balances the fluid pushed out by blood pressure.</li>
<li><b>About 80% of COP comes from albumin</b> and about 20% from globulins.</li>
<li>Osmotic pressure depends on the <b>number</b> of particles, not their mass. Albumin is the most abundant protein and relatively small, so it supplies by far the most particles.</li>
<li>When albumin falls (e.g. <b>liver failure</b>, since the liver makes albumin; or protein loss), COP falls. Less water is pulled back, so fluid accumulates in the interstitial space: <b>oedema</b>.</li>
</ol>
<div class="ex"><b>Question bank:</b> liver failure with peripheral oedema and low albumin → <b>decreased colloid osmotic pressure</b> reduces the force pulling water back into the capillaries at the venous end.</div>

<h4>3. Red blood cells (erythrocytes)</h4>
<h5>Structure</h5>
<ul>
<li><b>Biconcave discs</b>: the folded shape increases surface area by about <b>30%</b>, speeding gas exchange, and lets the cell bend through narrow capillaries.</li>
<li><b>No nucleus</b> (anucleate), so they can't divide or repair themselves; this leaves more space for haemoglobin.</li>
<li>The membrane contains <b>spectrin</b>, a cytoskeletal protein that gives <b>flexibility</b>.</li>
<li>Lifespan <b>100–120 days</b>; old cells are removed mainly by the spleen.</li>
<li>Count: <b>males 5–5.5 × 10⁶/mm³</b>; <b>females 4.5–5 × 10⁶/mm³</b>.</li>
</ul>
<h5>Haemoglobin</h5>
<ul>
<li>Haemoglobin makes up about <b>97%</b> of the RBC's content (excluding water).</li>
<li>Each molecule is a tetramer: <b>2 α + 2 β globin chains</b>, each holding one <b>haem</b> group containing <b>ferrous iron (Fe²⁺)</b>.</li>
<li>Each iron binds one O₂, so one haemoglobin carries <b>four O₂ molecules</b>: Hb + O₂ → HbO₂ (<b>oxyhaemoglobin</b>).</li>
</ul>
<p>Other reactions of haemoglobin:</p>
<ul>
<li>With <b>CO₂</b> → <b>carbaminohaemoglobin</b> (one way CO₂ is carried to the lungs).</li>
<li>With <b>carbon monoxide</b> → <b>carboxyhaemoglobin</b>. CO binds far more tightly than O₂, blocking oxygen transport (CO poisoning).</li>
<li>With <b>oxidising drugs</b> and agents, Fe²⁺ is oxidised to <b>ferric Fe³⁺</b> → <b>methaemoglobin</b>, which can't carry oxygen.</li>
</ul>

<h4>4. Erythropoiesis (RBC production)</h4>
<ol>
<li><b>Oxygen supply</b>: <b>hypoxia</b> (low tissue O₂) is the main stimulus. The kidney responds by releasing <b>erythropoietin (EPO)</b>, which drives the marrow to make more RBCs. Examples: high altitude, athletes in training, after haemorrhage.</li>
<li><b>Healthy bone marrow</b>: radiation or certain drugs can destroy it, causing <b>aplastic anaemia</b>.</li>
<li><b>Healthy liver</b>: it stores <b>iron and vitamin B12</b>.</li>
<li><b>Healthy diet</b>: essential nutrients, vitamins (B12), <b>folic acid</b> and <b>proteins</b>.</li>
<li><b>Hormones</b>: <b>thyroxine</b> and <b>androgens</b> stimulate production (one reason men have higher counts).</li>
</ol>

<h4>5. Platelets and haemostasis</h4>
<p><b>Platelets</b> (thrombocytes) are cell fragments from megakaryocytes in the marrow, living about <b>6–10 days</b>. They are central to <b>haemostasis</b>, stopping bleeding from a damaged vessel:</p>
<ol>
<li><b>Vascular spasm</b>: the vessel constricts.</li>
<li><b>Primary haemostasis (platelet plug)</b>: platelets adhere to exposed collagen (with von Willebrand factor), activate and aggregate into a temporary plug.</li>
<li><b>Secondary haemostasis (coagulation)</b>: exposure of <b>tissue factor</b> starts the clotting cascade, ending with <b>thrombin converting soluble fibrinogen into insoluble, cross-linked fibrin</b>, a mesh that reinforces the platelet plug.</li>
</ol>
<div class="ex"><b>Question bank:</b> after vessel trauma exposes tissue factor, the primary outcome of the secondary haemostasis cascade is that <b>thrombin converts fibrinogen into a cross-linked fibrin mesh</b> reinforcing the platelet plug.</div>

<h4>6. Important terms</h4>
<div class="tblwrap"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Anaemia</td><td>Decreased healthy RBCs or haemoglobin</td></tr>
<tr><td>Leukopenia</td><td>Decreased white cells</td></tr>
<tr><td>Thrombocytopenia</td><td>Decreased platelets</td></tr>
<tr><td>Pancytopenia</td><td>All blood components reduced</td></tr>
<tr><td>Thrombus</td><td>A clot in an <b>unbroken</b> vessel (e.g. coronary thrombosis → heart attack)</td></tr>
<tr><td>Embolus</td><td>A <b>free-floating</b> clot (e.g. cerebral embolus → stroke)</td></tr></table></div>
<p>RBCs are also described by <b>size</b> (normocytic, <b>microcytic</b> = small, <b>macrocytic</b> = large) and <b>colour</b> (normochromic, <b>hypochromic</b> = pale, hyperchromic).</p>

<h4>7. Anaemias</h4>
<p><b>Anaemia</b> is a reduced number of healthy RBCs or reduced haemoglobin, so less oxygen reaches tissues. There are over 400 types. By <b>size (MCV, mean cell volume)</b>:</p>
<ul>
<li><b>Microcytic</b> (small cells): iron deficiency, thalassaemia.</li>
<li><b>Normocytic</b> (normal size, fewer cells): anaemia of chronic disease.</li>
<li><b>Macrocytic</b> (large cells): vitamin B12 or folate deficiency.</li>
</ul>
<h5>The major types</h5>
<ol>
<li><b>Iron-deficiency anaemia</b>: the <b>most common</b>. Causes: low intake, blood loss, pregnancy, poor absorption. Symptoms: fatigue, pallor, shortness of breath.</li>
<li><b>Vitamin-deficiency anaemia (B12 and folate)</b>: <b>megaloblastic</b> anaemia, including <b>pernicious anaemia</b>. Causes: poor diet, malabsorption, autoimmunity. Symptoms: fatigue, <b>tingling</b> (B12 is needed for nerves), mouth ulcers.</li>
<li><b>Haemolytic anaemia</b>: RBCs destroyed faster than they are made (autoimmune, inherited disorders, infections, drugs).</li>
<li><b>Aplastic anaemia</b>: the marrow fails to produce RBCs, WBCs and platelets (autoimmunity, radiation, toxins, viruses).</li>
<li><b>Anaemia of chronic disease</b>: with chronic inflammation, kidney disease (less EPO), autoimmune disease or chronic infection.</li>
</ol>
<h5>Iron: storage, transport and absorption</h5>
<ul>
<li><b>Ferritin</b> = <b>storage</b> iron, intracellular; it reflects iron reserves. <b>Low ferritin = iron deficiency</b>; high ferritin = iron overload or inflammation.</li>
<li><b>Transferrin</b> = <b>transport</b> protein, extracellular, delivering iron to cells. In iron deficiency it is <b>high</b>, as the body tries to capture and transport more iron.</li>
<li>Iron is absorbed mainly in the <b>duodenum</b>, as <b>ferrous Fe²⁺</b>, then carried in blood on transferrin.</li>
</ul>
<div class="ex"><b>Question bank:</b> fatigue, microcytic RBCs, low ferritin and high transferrin → <b>impaired haemoglobin synthesis due to depleted iron reserves</b> (iron-deficiency anaemia).</div>
<h5>Vitamin B12 absorption, step by step</h5>
<ol>
<li><b>Stomach</b>: acid and pepsin free B12 from food proteins; it binds <b>R-binder</b> (from salivary and gastric glands).</li>
<li><b>Duodenum</b>: pancreatic proteases digest R-binder, freeing B12.</li>
<li>Free B12 binds <b>intrinsic factor (IF)</b>, secreted by gastric <b>parietal cells</b>.</li>
<li><b>Terminal ileum</b>: the B12–IF complex binds receptors and is absorbed.</li>
<li><b>Blood</b>: B12 travels on <b>transcobalamin II</b> to tissues and is stored, especially in the liver.</li>
</ol>
<p><b>Pernicious anaemia</b> = no intrinsic factor (usually autoimmune destruction of parietal cells), so B12 can't be absorbed, giving megaloblastic anaemia.</p>
<div class="pearl"><strong>Summary:</strong> B12/folate → DNA synthesis problem → <b>big</b> cells → <b>megaloblastic</b>. Iron → haemoglobin synthesis problem → <b>small</b> cells → <b>microcytic</b>. Pernicious anaemia → intrinsic factor problem → B12 deficiency. B12 doesn't control iron absorption, but both are needed for effective RBC production.</div>

<h4>8. Hereditary anaemias</h4>
<div class="tblwrap"><table><tr><th>Category</th><th>Examples</th><th>Key defect</th></tr>
<tr><td>Haemoglobinopathies</td><td>Sickle cell, thalassaemias</td><td>Haemoglobin structure or production</td></tr>
<tr><td>Membrane disorders</td><td>Spherocytosis, elliptocytosis</td><td>RBC membrane proteins</td></tr>
<tr><td>Enzyme defects</td><td>G6PD deficiency, pyruvate kinase deficiency</td><td>RBC metabolic enzymes</td></tr>
<tr><td>Bone marrow failure</td><td>Fanconi anaemia, Diamond–Blackfan</td><td>DNA repair or ribosome defects</td></tr>
<tr><td>Iron/erythropoiesis disorders</td><td>IRIDA, congenital dyserythropoietic anaemia</td><td>Iron regulation or RBC maturation</td></tr></table></div>
<h5>The three most important (exam favourites)</h5>
<div class="tblwrap"><table><tr><th></th><th>Sickle cell anaemia</th><th>Favism (G6PD deficiency)</th><th>Thalassaemia</th></tr>
<tr><td>Cause</td><td>Haemoglobin S mutation → RBCs sickle and block small vessels</td><td>G6PD enzyme deficiency</td><td>Reduced globin chain production</td></tr>
<tr><td>Triggered episodes?</td><td>Spontaneous pain crises</td><td><b>Yes</b>: fava beans, sulfa drugs, antimalarials, infections</td><td>No</td></tr>
<tr><td>Key features</td><td>Pain, chronic haemolytic anaemia, frequent infections (spleen damage), organ damage, stroke, acute chest syndrome, delayed growth</td><td>Acute haemolysis, jaundice, dark urine, kidney injury; can be life-threatening</td><td>Microcytic anaemia, fatigue, pallor; bone deformities in severe forms; iron overload from repeated transfusions</td></tr>
<tr><td>Inheritance</td><td>Autosomal recessive</td><td><b>X-linked</b></td><td>Autosomal recessive</td></tr>
<tr><td>Management</td><td>Hydration, pain control, hydroxyurea, transfusions, vaccines; sometimes marrow transplant or gene therapy</td><td>Avoid triggers; supportive care or transfusion if severe</td><td>Transfusions, iron chelation, folic acid; marrow transplant in severe cases</td></tr></table></div>
<p><b>Why G6PD deficiency causes haemolysis:</b> G6PD makes <b>NADPH</b>, which keeps glutathione in its reduced form to neutralise reactive oxygen species. Without it, oxidants (from fava beans, certain drugs, infection) damage the RBC and it bursts.</p>
<p>Thalassaemia <b>carriers</b> (one faulty gene) usually have only mild anaemia but can pass the gene to their children. <b>Haemophilia</b> is an inherited bleeding disorder (a missing clotting factor).</p>

<h4>9. Lecture 1 case study (solved)</h4>
<div class="ex"><b>Mr Jensen, 80</b>, has had four days of severe diarrhoea and vomiting; he is very lethargic, confused, with very low blood pressure and critically low serum sodium.<br>
<b>Q1, the pathophysiology:</b> pathophysiology is the deranged function that occurs in disease. Here, massive loss of fluid and electrolytes causes <b>dehydration</b> (low blood volume → low blood pressure) and <b>hyponatraemia</b>. Low sodium makes the ECF hypotonic, so water moves into brain cells → <b>cerebral oedema</b> → lethargy, <b>confusion</b>, and risk of seizures and coma.<br>
<b>Q2, contributing factor:</b> his <b>age</b>. The elderly have less total body water and a blunted thirst response, so they dehydrate faster and more severely.</div>

<p>المحاضرة التانية عن <b>الدم</b>: مكوّن من إيه، وإزاي بروتينات البلازما (خصوصًا الألبومين) بتمسك الماء جوه الأوعية، وتركيب وشغل <b>كرات الدم الحمرا</b> و<b>الهيموجلوبين</b>، وإزاي كرات الدم بتتصنع، ودور <b>الصفايح الدموية</b> في وقف النزيف، وأهم أنواع <b>الأنيميا</b> ومنها الوراثية. وفيها كمان الحالة الدراسية بتاعة محاضرة 1، ومحلولة في الآخر.</p>

<h4>1. مكونات الدم</h4>
<ul>
<li>الدم = <b>بلازما</b> (سائل) + <b>عناصر مكوّنة</b> (جزيئات صلبة): <b>كرات حمرا</b>، و<b>كرات بيضا</b>، و<b>صفايح</b>.</li>
<li>كل العناصر دي جاية من <b>الخلايا الجذعية في نخاع العظم</b>، وتصنيعها اسمه <b>haematopoiesis</b>.</li>
<li>الـ <b>pH الطبيعي للدم 7.35–7.45</b> (قلوي خفيف).</li>
<li>أهم <b>بروتينات البلازما</b>: <b>الألبومين</b>، و<b>الجلوبيولين</b> (ومنها الأجسام المضادة)، و<b>الفيبرينوجين</b> (للتجلط).</li>
</ul>

<h4>2. الألبومين والضغط الأسموزي الغروي</h4>
<ol>
<li>الماء بيعدّي بحرية من جدران الشعيرات، بس <b>الألبومين كبير جدًا ومش بيخرج</b>، فبيفضل جوه.</li>
<li>البروتينات الذايبة جوه الوعاء بتعمل شد أسموزي اسمه <b>الضغط الأسموزي الغروي (COP)</b>، بيسحب الماء <b>يرجع جوه</b> الشعيرات (أساسًا عند الطرف الوريدي) وبيوازن الماء اللي ضغط الدم بيزقه لبرّه.</li>
<li><b>حوالي 80% من الـ COP من الألبومين</b> وحوالي 20% من الجلوبيولين.</li>
<li>الضغط الأسموزي بيعتمد على <b>عدد</b> الجزيئات مش وزنها. والألبومين أكتر بروتين موجود وصغير نسبيًا، فبيدي أكبر عدد جزيئات بفرق كبير.</li>
<li>لما الألبومين يقل (زي في <b>فشل الكبد</b>، لأن الكبد هو اللي بيصنعه؛ أو فقد البروتين)، الـ COP يقل، فالماء اللي بيرجع يقل، والسوائل تتجمع في الأنسجة: <b>وذمة (oedema)</b>.</li>
</ol>
<div class="ex"><b>بنك الأسئلة:</b> فشل كبد مع وذمة وألبومين قليل ← <b>قلة الضغط الأسموزي الغروي</b> بتقلل القوة اللي بتسحب الماء يرجع للشعيرات عند الطرف الوريدي.</div>

<h4>3. كرات الدم الحمرا</h4>
<h5>التركيب</h5>
<ul>
<li><b>أقراص مقعرة الوشين</b>: الشكل ده بيزوّد المساحة السطحية حوالي <b>30%</b> فتبادل الغازات يبقى أسرع، وبيخليها تتني وتعدّي من الشعيرات الضيقة.</li>
<li><b>من غير نواة</b>، فما بتنقسمش ولا بتصلّح نفسها، وده بيوفّر مكان أكتر للهيموجلوبين.</li>
<li>غشاؤها فيه <b>spectrin</b>، بروتين بيديها <b>مرونة</b>.</li>
<li>عمرها <b>100–120 يوم</b>، والكرات القديمة بيشيلها الطحال أساسًا.</li>
<li>العدد: <b>الرجالة 5–5.5 مليون/مم³</b>؛ و<b>الستات 4.5–5 مليون/مم³</b>.</li>
</ul>
<h5>الهيموجلوبين</h5>
<ul>
<li>الهيموجلوبين حوالي <b>97%</b> من محتوى الكرة الحمرا (من غير الماء).</li>
<li>كل جزيء مكوَّن من <b>2 سلسلة α + 2 سلسلة β</b>، وكل سلسلة شايلة مجموعة <b>heme</b> فيها <b>حديد ثنائي (Fe²⁺)</b>.</li>
<li>كل حديد بيمسك جزيء أكسجين، فالهيموجلوبين الواحد بيشيل <b>4 جزيئات O₂</b>: Hb + O₂ ← HbO₂ (<b>oxyhaemoglobin</b>).</li>
</ul>
<p>تفاعلات تانية للهيموجلوبين:</p>
<ul>
<li>مع <b>CO₂</b> ← <b>carbaminohaemoglobin</b> (طريقة من طرق نقل CO₂ للرئة).</li>
<li>مع <b>أول أكسيد الكربون</b> ← <b>carboxyhaemoglobin</b>. الـ CO بيرتبط أقوى بكتير من الأكسجين، فبيمنع نقله (تسمم أول أكسيد الكربون).</li>
<li>مع <b>الأدوية المؤكسدة</b>، الـ Fe²⁺ بيتأكسد لـ <b>Fe³⁺</b> ← <b>methaemoglobin</b> اللي ما يقدرش يشيل أكسجين.</li>
</ul>

<h4>4. تصنيع كرات الدم الحمرا (Erythropoiesis)</h4>
<ol>
<li><b>توصيل الأكسجين</b>: <b>نقص الأكسجين (hypoxia)</b> هو المنبه الأساسي. الكلى بتستجيب بإفراز <b>الإريثروبويتين (EPO)</b> اللي بيخلي النخاع يعمل كرات أكتر. أمثلة: الأماكن العالية، والرياضيين، وبعد النزيف.</li>
<li><b>نخاع سليم</b>: الإشعاع أو أدوية معينة ممكن تدمّره فتحصل <b>أنيميا لاتنسجية (aplastic)</b>.</li>
<li><b>كبد سليم</b>: بيخزّن <b>الحديد وفيتامين B12</b>.</li>
<li><b>أكل صحي</b>: عناصر أساسية، وفيتامينات (B12)، و<b>حمض الفوليك</b>، و<b>بروتين</b>.</li>
<li><b>هرمونات</b>: <b>الثيروكسين</b> و<b>الأندروجين</b> بيحفّزوا التصنيع (وده سبب إن عدد الرجالة أعلى).</li>
</ol>

<h4>5. الصفايح ووقف النزيف</h4>
<p>الـ <b>صفايح</b> أجزاء خلايا جاية من الـ megakaryocytes في النخاع، وعمرها حوالي <b>6–10 أيام</b>. وهي أساسية في <b>وقف النزيف (haemostasis)</b> من وعاء مجروح:</p>
<ol>
<li><b>انقباض الوعاء</b>.</li>
<li><b>Primary haemostasis (سدادة الصفايح)</b>: الصفايح بتلزق في الكولاجين المكشوف (بمساعدة von Willebrand factor)، وتتنشط وتتجمع وتعمل سدادة مؤقتة.</li>
<li><b>Secondary haemostasis (التجلط)</b>: انكشاف الـ <b>tissue factor</b> بيبدأ سلسلة التجلط، وآخرها <b>الثرومبين بيحوّل الفيبرينوجين الذايب لفيبرين مش ذايب ومتشابك</b>، شبكة بتقوّي سدادة الصفايح.</li>
</ol>
<div class="ex"><b>بنك الأسئلة:</b> بعد إصابة وعاء وانكشاف الـ tissue factor، النتيجة الأساسية لسلسلة الـ secondary haemostasis إن <b>الثرومبين بيحوّل الفيبرينوجين لشبكة فيبرين متشابكة</b> بتقوّي سدادة الصفايح.</div>

<h4>6. مصطلحات مهمة</h4>
<div class="tblwrap"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Anaemia</td><td>Decreased healthy RBCs or Hb</td></tr>
<tr><td>Leukopenia</td><td>Decreased white cells</td></tr>
<tr><td>Thrombocytopenia</td><td>Decreased platelets</td></tr>
<tr><td>Pancytopenia</td><td>All components reduced</td></tr>
<tr><td>Thrombus</td><td>Clot in an unbroken vessel (coronary thrombosis → heart attack)</td></tr>
<tr><td>Embolus</td><td>Free-floating clot (cerebral embolus → stroke)</td></tr></table></div>
<p>يعني: الـ <b>thrombus</b> جلطة في وعاء سليم (زي جلطة الشريان التاجي اللي بتعمل أزمة قلبية)، والـ <b>embolus</b> جلطة سايبة ماشية في الدم (زي اللي بتوصل المخ وتعمل سكتة دماغية). وكرات الدم بتتوصف كمان بـ<b>الحجم</b> (طبيعي، <b>microcytic</b> صغير، <b>macrocytic</b> كبير) و<b>اللون</b> (طبيعي، <b>hypochromic</b> باهت، hyperchromic).</p>

<h4>7. الأنيميا</h4>
<p>الـ <b>أنيميا</b> هي نقص عدد كرات الدم الحمرا السليمة أو نقص الهيموجلوبين، فالأكسجين اللي بيوصل للأنسجة يقل. فيه أكتر من 400 نوع. وحسب <b>الحجم (MCV)</b>:</p>
<ul>
<li><b>Microcytic</b> (كرات صغيرة): نقص الحديد، والثلاسيميا.</li>
<li><b>Normocytic</b> (حجم طبيعي بس عدد أقل): أنيميا الأمراض المزمنة.</li>
<li><b>Macrocytic</b> (كرات كبيرة): نقص B12 أو الفولات.</li>
</ul>
<h5>الأنواع الأساسية</h5>
<ol>
<li><b>أنيميا نقص الحديد</b>: <b>الأشهر</b>. أسبابها: أكل قليل، أو نزيف، أو حمل، أو امتصاص ضعيف. أعراضها: تعب، وشحوب، ونهجان.</li>
<li><b>أنيميا نقص الفيتامينات (B12 والفولات)</b>: أنيميا <b>megaloblastic</b>، ومنها <b>pernicious anaemia</b>. أسبابها: أكل ضعيف، أو سوء امتصاص، أو مناعة ذاتية. أعراضها: تعب، و<b>تنميل</b> (لأن B12 مهم للأعصاب)، وقرح في البق.</li>
<li><b>Haemolytic anaemia</b>: الكرات بتتكسر أسرع ما بتتعمل (مناعة ذاتية، أمراض وراثية، عدوى، أدوية).</li>
<li><b>Aplastic anaemia</b>: النخاع بيفشل يعمل كرات حمرا وبيضا وصفايح (مناعة ذاتية، إشعاع، سموم، فيروسات).</li>
<li><b>أنيميا الأمراض المزمنة</b>: مع الالتهاب المزمن، أو أمراض الكلى (EPO أقل)، أو أمراض المناعة، أو العدوى المزمنة.</li>
</ol>
<h5>الحديد: التخزين والنقل والامتصاص</h5>
<ul>
<li><b>Ferritin</b> = حديد <b>متخزّن</b>، جوه الخلايا، وبيعكس مخزون الحديد. <b>Ferritin قليل = نقص حديد</b>؛ وعالي = زيادة حديد أو التهاب.</li>
<li><b>Transferrin</b> = بروتين <b>النقل</b>، برّه الخلايا، بيوصّل الحديد للخلايا. في نقص الحديد بيبقى <b>عالي</b>، لأن الجسم بيحاول يمسك وينقل حديد أكتر.</li>
<li>الحديد بيتمتص أساسًا في <b>الاثنى عشر</b>، على شكل <b>Fe²⁺</b>، وبعدين بيتنقل في الدم على الـ transferrin.</li>
</ul>
<div class="ex"><b>بنك الأسئلة:</b> تعب، وكرات صغيرة، و ferritin قليل، و transferrin عالي ← <b>ضعف تصنيع الهيموجلوبين بسبب خلص مخزون الحديد</b> (أنيميا نقص الحديد).</div>
<h5>امتصاص فيتامين B12 خطوة بخطوة</h5>
<ol>
<li><b>المعدة</b>: الحمض والـ pepsin بيحرروا B12 من بروتينات الأكل، وبيرتبط بـ <b>R-binder</b> (من الغدد اللعابية والمعدية).</li>
<li><b>الاثنى عشر</b>: إنزيمات البنكرياس بتهضم الـ R-binder فيتحرر B12.</li>
<li>الـ B12 الحر بيرتبط بـ <b>العامل الداخلي (intrinsic factor)</b> اللي بتفرزه <b>الخلايا الجدارية (parietal)</b> في المعدة.</li>
<li><b>آخر اللفائفي (terminal ileum)</b>: مركّب B12 مع العامل الداخلي بيرتبط بمستقبلات ويتمتص.</li>
<li><b>الدم</b>: الـ B12 بيتنقل على <b>transcobalamin II</b> للأنسجة ويتخزّن، خصوصًا في الكبد.</li>
</ol>
<p><b>الـ Pernicious anaemia</b> = مفيش عامل داخلي (غالبًا مناعة ذاتية بتدمّر الخلايا الجدارية)، فالـ B12 ما يتمتصش، فتحصل أنيميا megaloblastic.</p>
<div class="pearl"><strong>الخلاصة:</strong> B12/فولات ← مشكلة في تصنيع الـ DNA ← كرات <b>كبيرة</b> ← <b>megaloblastic</b>. الحديد ← مشكلة في تصنيع الهيموجلوبين ← كرات <b>صغيرة</b> ← <b>microcytic</b>. الـ Pernicious ← مشكلة في العامل الداخلي ← نقص B12. والـ B12 ما بيتحكمش في امتصاص الحديد، بس الاتنين مهمين عشان تصنيع الكرات يبقى كويس.</div>

<h4>8. الأنيميا الوراثية</h4>
<div class="tblwrap"><table><tr><th>Category</th><th>Examples</th><th>Key defect</th></tr>
<tr><td>Haemoglobinopathies</td><td>Sickle cell, thalassaemias</td><td>Hb structure/production</td></tr>
<tr><td>Membrane disorders</td><td>Spherocytosis, elliptocytosis</td><td>Membrane proteins</td></tr>
<tr><td>Enzyme defects</td><td>G6PD, pyruvate kinase</td><td>Metabolic enzymes</td></tr>
<tr><td>Marrow failure</td><td>Fanconi, Diamond–Blackfan</td><td>DNA repair / ribosomes</td></tr>
<tr><td>Iron/erythropoiesis</td><td>IRIDA, CDA</td><td>Iron regulation / maturation</td></tr></table></div>
<h5>أهم 3 (بيتسألوا كتير)</h5>
<div class="tblwrap"><table><tr><th></th><th>Sickle cell</th><th>Favism (G6PD)</th><th>Thalassaemia</th></tr>
<tr><td>Cause</td><td>HbS → sickling</td><td>G6PD deficiency</td><td>Reduced globin production</td></tr>
<tr><td>Triggered?</td><td>Spontaneous crises</td><td>Yes: fava beans, sulfa, antimalarials, infection</td><td>No</td></tr>
<tr><td>Inheritance</td><td>Autosomal recessive</td><td>X-linked</td><td>Autosomal recessive</td></tr></table></div>
<p><b>الأنيميا المنجلية (sickle cell)</b>: طفرة الهيموجلوبين S بتخلي الكرات منجلية فتسد الأوعية الصغيرة. أعراضها نوبات ألم من غير سبب، وأنيميا تكسيرية مزمنة، وعدوى كتير (لأن الطحال بيتضرر)، وتلف أعضاء، وسكتة، و acute chest syndrome، وتأخر نمو. العلاج: سوائل، ومسكنات، و hydroxyurea، ونقل دم، وتطعيمات، وأحيانًا زرع نخاع أو علاج جيني.</p>
<p><b>أنيميا الفول (G6PD)</b>: بتتحفّز بالفول، وأدوية السلفا، وأدوية الملاريا، والعدوى. بتعمل تكسير حاد، وصفرا، وبول غامق، وممكن إصابة الكلى، وممكن تبقى خطيرة. العلاج: تجنب المحفزات، ورعاية داعمة أو نقل دم لو شديدة. وراثتها <b>X-linked</b>.</p>
<p><b>الثلاسيميا</b>: نقص تصنيع سلاسل الجلوبين، فتحصل أنيميا microcytic وتعب وشحوب، وتشوهات عظام في الأنواع الشديدة، وزيادة حديد من نقل الدم المتكرر. العلاج: نقل دم، و iron chelation، وحمض الفوليك، وزرع نخاع في الحالات الشديدة.</p>
<p><b>ليه نقص G6PD بيعمل تكسير؟</b> إنزيم G6PD بيعمل <b>NADPH</b> اللي بيحافظ على الجلوتاثيون في صورته المختزلة عشان يعادل الـ reactive oxygen species. من غيره، المواد المؤكسدة (من الفول أو أدوية معينة أو العدوى) بتأذي الكرة فتنفجر.</p>
<p>حاملين الثلاسيميا (<b>carriers</b>، جين واحد معيوب) غالبًا عندهم أنيميا بسيطة بس، بس ممكن ينقلوا الجين لولادهم. والـ <b>هيموفيليا</b> مرض نزيف وراثي (نقص عامل تجلط).</p>

  try{ if(window.claude&&window.claude.use) dl=await window.claude.use("downloads") }catch(e){}

// The PDF renderer places each text run by itself; giving every word its own box keeps right-to-left lines in the right order.
function isolateWords(root){

/* ---------- PowerPoint ---------- */
function runsOf(node){
  const out=[];
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){ if(n.textContent) out.push({text:n.textContent}) }
    else if(n.nodeName==="BR") out.push({text:"; "});
    else if(/^(B|STRONG)$/.test(n.nodeName)) out.push({text:n.textContent,options:{bold:true}});
    else out.push({text:n.textContent});
  });
  if(out.length){ out[0].text=out[0].text.replace(/^\s+/,""); out[out.length-1].text=out[out.length-1].text.replace(/\s+$/,""); }
  return out.map(r=>({...r,text:r.text.replace(/\s+/g," ")})).filter(r=>r.text);
}
const runsLen=r=>r.reduce((a,x)=>a+x.text.length,0);
function lectureBlocks(h){
  const root=new DOMParser().parseFromString("<div>"+h+"</div>","text/html").body.firstElementChild;
  root.querySelectorAll("br").forEach(b=>b.replaceWith("\n"));
  root.querySelectorAll(".formula small").forEach(x=>x.prepend("\n"));
  const secs=[{title:null,items:[]}], cur=()=>secs[secs.length-1];
  for(const el of root.children){
    const cls=el.className||"";
    if(el.tagName==="H4") secs.push({title:el.textContent.trim(),items:[]});
    else if(el.tagName==="UL"||el.tagName==="OL") [...el.children].forEach((li,i)=>cur().items.push({t:"b",runs:runsOf(li),num:el.tagName==="OL"?i+1:0}));
    else if(cls.includes("terms")) el.querySelectorAll(".term").forEach(t=>cur().items.push({t:"b",runs:[{text:t.querySelector("b").textContent+": ",options:{bold:true}},{text:t.querySelector("span").textContent}]}));
    else if(cls.includes("tblwrap")||el.tagName==="TABLE") cur().items.push({t:"table",rows:[...el.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>({text:td.textContent.trim(),head:td.tagName==="TH"})))});
    else if(cls.includes("pearl")) cur().items.push({t:"pearl",text:el.textContent.replace(/\s+/g," ").trim()});
    else if(cls.includes("formula")) cur().items.push({t:"formula",text:el.textContent.split("\n").map(x=>x.replace(/\s+/g," ").replace(/ /g," ").trim()).filter(Boolean).join("\n")});
    else { const r=runsOf(el); if(r.length) cur().items.push({t:"b",runs:r}); }
  }
  return secs.filter(s=>s.items.length);
}
// PptxGenJS writes paragraph settings before every text run; PowerPoint expects them once per paragraph, so keep only the first.
async function cleanPptx(buf){
  const zip=await window.JSZip.loadAsync(buf);
  const files=Object.keys(zip.files).filter(f=>/^ppt\/slides\/slide\d+\.xml$/.test(f));
  for(const f of files){
    const xml=await zip.file(f).async("string");
    zip.file(f,xml.replace(/<a:p>([\s\S]*?)<\/a:p>/g,(m,inner)=>{let n=0;return "<a:p>"+inner.replace(/<a:pPr\b[^>]*?(?:\/>|>[\s\S]*?<\/a:pPr>)/g,x=>n++?"":x)+"</a:p>"}));

  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.presentationml.presentation",compression:"DEFLATE"});

        const rh=r=>Math.max(...r.map(x=>x.text.split("\n").reduce((a,l)=>a+Math.max(1,Math.ceil(l.length/cpl)),0)))*0.24+0.1;
        let chunk=[], ch=hdr?rh(hdr):0;
        const whole=ch+body.reduce((a,r)=>a+rh(r),0);
        if(y>TOP+0.05&&y+whole>BOTTOM&&TOP+whole<=BOTTOM) open();
        const put=()=>{ if(!chunk.length) return; if(y>TOP+0.05&&y+ch>BOTTOM) open();
          const data=(hdr?[hdr]:[]).concat(chunk).map(r=>{const cells=r.map(x=>({text:x.text,options:x.head?{bold:true,fill:{color:"DFEEEA"},color:TEAL}:{}}));while(cells.length<cols)cells.push({text:""});return cells});
          slide.addTable(data,{x:X,y,w:CW,fontSize:13,fontFace:"Calibri",color:INK,border:{type:"solid",pt:0.75,color:"D6E0DD"},fill:{color:"FFFFFF"},valign:"top",margin:0.06,autoPage:false});
          y+=ch+0.2; chunk=[]; ch=hdr?rh(hdr):0; };
        for(const r of body){ const h=rh(r); if((y>TOP+0.05?y:TOP)+ch+h>BOTTOM&&chunk.length){ put(); open(); } chunk.push(r); ch+=h; }
        if(y+ch>BOTTOM) open(); put();
      }
    }
    flush();
  });
  // quiz slides
  const qs=c.quiz.filter(q=>q.l===L.n);
  qs.forEach((q,i)=>{
    const sl=pres.addSlide(); foot(sl); head(sl,`Check yourself · Question ${i+1}`);
    sl.addText(q.q,{x:X,y:TOP,w:CW,h:1.2,fontSize:22,bold:true,color:INK,fontFace:"Calibri",valign:"top"});
    q.o.forEach((o,j)=>sl.addText([{text:"ABCD"[j]+"   ",options:{bold:true,color:hue}},{text:o}],{x:X,y:TOP+1.35+j*0.95,w:CW,h:0.8,fontSize:18,color:INK,fontFace:"Calibri",fill:{color:"FFFFFF"},line:{color:"D6E0DD",width:1},margin:12,valign:"middle"}));
    sl.addNotes(`Answer: ${"ABCD"[q.a]}. ${q.o[q.a]}\n${q.e}`);
  });
  if(qs.length){
    const sl=pres.addSlide(); foot(sl); head(sl,"Answer key");
    sl.addText(qs.map((q,i)=>({text:`${i+1}.  ${"ABCD"[q.a]}  ${q.o[q.a]}`,options:{breakLine:true,paraSpaceAfter:6}})),{x:X,y:TOP,w:CW,h:BOTTOM-TOP,fontSize:qs.length>5?15:18,color:INK,fontFace:"Calibri",valign:"top"});
  }
  const blob=await cleanPptx(await pres.write({outputType:"arraybuffer"}));
  return saveFile(`${c.code} L${L.n} ${safeName(L.t)}.pptx`,blob);
}

function pool(){const c=state.course;return state.filter==="all"?c.quiz:c.quiz.filter(q=>q.l===state.filter)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(){state.qs={i:0,picked:null,answers:[],set:shuffle(pool())}}
function renderQuiz(){
  const c=state.course;
  if(!state.qs) startQuiz();
  const lecs=[...new Set(c.quiz.map(q=>q.l))];
  const chips=`<div class="filters" role="group" aria-label="Choose lectures"><button class="fchip" data-f="all" aria-pressed="${state.filter==="all"}">All lectures (${c.quiz.length})</button>${lecs.map(n=>`<button class="fchip" data-f="${n}" aria-pressed="${state.filter===n}">L${n}</button>`).join("")}</div>`;
  const Q=state.qs.set, n=Q.length, qs=state.qs;
  let body;
  if(qs.i>=n){
    const score=qs.answers.filter((a,i)=>a===Q[i].a).length, pct=Math.round(score/n*100);
    if(state.filter==="all"){const b=best(c.id);if(!b||pct>b.pct)store.set("best:"+c.id,{pct,score,n})}
    const msg=pct>=85?"Excellent. You're ready for this material.":pct>=65?"Good work. Review the ones you missed below.":"Go back over the lectures, then try again.";
    body=`<div class="quiz result"><div class="score">${score}/${n}</div><p>${pct}% · ${msg}</p>
      <div class="review">${Q.map((q,i)=>`<div><span class="${qs.answers[i]===q.a?"v":"x"}">${qs.answers[i]===q.a?"✓":"✗"}</span> <span class="qlec">L${q.l}</span> ${q.q}<br><small>Answer: <b>${q.o[q.a]}</b></small></div>`).join("")}</div>
      <div class="actions"><button class="btn" id="retry">Retake</button><button class="btn ghost" id="tolec">Back to lectures</button></div></div>`;
  } else {
    const q=Q[qs.i], p=qs.picked, sc=qs.answers.filter((a,i)=>a===Q[i].a).length;
    body=`<div class="quiz"><div class="qtop"><span>Question ${qs.i+1} of ${n}</span><span>Score ${sc}</span></div>
      <div class="bar"><i style="width:${qs.i/n*100}%"></i></div>
      <span class="qlec">Lecture ${q.l}</span><p class="qtext">${q.q}</p>
      <div class="opts">${q.o.map((o,j)=>{let k="";if(p!=null){if(j===q.a)k="correct";else if(j===p)k="wrong"}return `<button class="opt ${k}" data-j="${j}" ${p!=null?"disabled":""}><span class="k">${"ABCD"[j]}</span><span>${o}</span></button>`}).join("")}</div>
      ${p!=null?`<div class="feedback ${p===q.a?"ok":"no"}"><b>${p===q.a?"Correct.":"Not quite."}</b>${q.e}</div><div class="qnav"><button class="btn" id="nx">${qs.i+1<n?"Next question":"See results"}</button></div>`:""}</div>`;
  }
  $("#pane").innerHTML=chips+body;
  document.querySelectorAll(".fchip").forEach(b=>b.onclick=()=>{state.filter=b.dataset.f==="all"?"all":+b.dataset.f;startQuiz();renderQuiz()});
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{qs.picked=+b.dataset.j;qs.answers[qs.i]=qs.picked;renderQuiz();$("#nx").focus({preventScroll:true})});
  if($("#nx"))$("#nx").onclick=()=>{qs.i++;qs.picked=null;renderQuiz()};
  if($("#retry"))$("#retry").onclick=()=>{startQuiz();renderQuiz()};
  if($("#tolec"))$("#tolec").onclick=()=>{state.tab="learn";renderCourse()};
}

function render(){state.view==="home"?renderHome():renderCourse()}
function fromHash(){const h=location.hash.slice(1);const c=COURSES.find(x=>x.id===h);if(c){state.view="course";state.course=c;state.tab="learn";state.lec=1;state.qs=null}else state.view="home";render()}
addEventListener("hashchange",fromHash);
fromHash();
</script>
