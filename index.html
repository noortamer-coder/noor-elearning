const AR = {
genetics:{
1:{t:"تركيب الـ DNA وتضاعفه",h:`
<p>الـ <b>DNA</b> عبارة عن <b>حلزون مزدوج (double helix)</b> مكوَّن من شريطين <b>متعاكسين في الاتجاه (antiparallel)</b>: واحد من <bdi>5'→3'</bdi> والتاني من <bdi>3'→5'</bdi>. الهيكل (sugar–phosphate backbone) بيكون برّه، والقواعد النيتروجينية جوّه.</p>
<ul>
<li><b>Franklin</b> بالـ X-ray أثبتت إن الهيكل برّه والقواعد جوّه وإن الشكل حلزوني من شريطين.</li>
<li><b>قواعد Chargaff</b>: <bdi>A = T</bdi> و <bdi>G = C</bdi>، يعني الـ purines تساوي الـ pyrimidines. الزوج A=T بينهم <b>رابطتين هيدروجين</b>، والزوج G≡C بينهم <b>3 روابط</b> فهو أقوى بحوالي 50%.</li>
<li><b>Watson & Crick (1953)</b>: الحلزون المزدوج والشريطين المتعاكسين، والقراءة من <bdi>5'→3'</bdi>.</li>
<li>النيوكليوتيدات بتترابط بـ <b>phosphodiester bonds</b>، والقاعدة بترتبط بالسكر بـ <b>N-glycosidic bond</b>.</li>
</ul>
<p><b>الفرق في المصطلحات:</b> Nucleobase = قاعدة بس · Nucleoside = قاعدة + سكر خماسي · Nucleotide = قاعدة + سكر + فوسفات.</p>
<p><b>أشكال الـ DNA:</b> شكل B (يميني، الأشهر في الخلية)، شكل A (يميني، في حالة الجفاف)، شكل Z (يساري ونادر).</p>
<p><b>التعبئة:</b> حوالي <b>146 bp</b> بتلف حوالين 8 هستونات (histone octamer) وده اسمه <b>nucleosome</b>، وبعدين chromatin ثم chromosome.</p>
<h4>التضاعف (Replication) نصف محافظ – semiconservative</h4>
<ol>
<li><b>Origin</b>: منطقة غنية بـ AT (واحدة في البكتيريا وكتير في الـ eukaryotes)، وبيرتبط بيها DnaA ومحتاج ATP.</li>
<li><b>Helicase</b> بيفك الشريطين، و<b>SSB proteins</b> بتمنعهم يرجعوا يلزقوا، و<b>Topoisomerase</b> بيشيل الالتواء (supercoils) قدام الـ fork.</li>
<li><b>Primase</b> بيعمل <b>RNA primer</b> قصير (حوالي 10 نيوكليوتيدات).</li>
<li><b>DNA pol III</b> بيبني الشريط الجديد من <bdi>5'→3'</bdi>. الـ <b>Leading strand</b> مستمر بـ primer واحد، والـ <b>Lagging strand</b> متقطع على شكل <b>Okazaki fragments</b>.</li>
<li><b>DNA pol I</b> بيشيل الـ primers ويملا الفراغات.</li>
<li><b>Ligase</b> بيقفل الفتحات (nicks) برابطة phosphodiester.</li>
</ol>
<div class="pearl"><strong>ترتيب الامتحان:</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase</div>`},
2:{t:"مشكلة نهاية التضاعف والنسخ (Transcription)",h:`
<p>الـ DNA polymerase بيشتغل في اتجاه <bdi>5'→3'</bdi> بس ومحتاج primer، فالطرف الأخير من الـ lagging strand مش بيتنسخ. ده اسمه <b>end replication problem</b>.</p>
<ul>
<li><b>Telomeres</b> بتحمي أطراف الكروموسومات: تكرارات <bdi>TTAGGG</bdi> مع طرف بارز <bdi>3'</bdi> طوله 12–16 نيوكليوتيد. الإنسان عنده 46 كروموسوم يعني 92 تيلومير.</li>
<li><b>Telomerase</b> = بروتين + قالب RNA خاص بيه، وبيشتغل كـ <b>reverse transcriptase</b>.</li>
<li>في الخلايا العادية التيلوميراز قليل فالتيلوميرات بتقصر مع السن. في السرطان بيكون عالي، عشان كده هو هدف للأدوية. (نوبل 2009).</li>
</ul>
<h4>النسخ: من DNA إلى RNA</h4>
<p>الإنزيم بيقرا الـ <b>template (antisense) strand</b>، والـ <b>coding (sense) strand</b> نفس تسلسل الـ mRNA بس فيه T بدل U.</p>
<ul>
<li><b>RNA pol I</b>: بيعمل rRNA (ما عدا 5S).</li>
<li><b>RNA pol II</b>: بيعمل كل الـ mRNA.</li>
<li><b>RNA pol III</b>: بيعمل tRNA و 5S rRNA.</li>
</ul>
<p><b>أجزاء الجين:</b> exons (بتتترجم)، introns (مش بتتترجم، بتبدأ بـ GT وتنتهي بـ AG)، promoter فيه <b>TATA box</b> (قبل الجين بحوالي 25 bp) و <b>CAAT box</b>، و enhancers بتزوّد معدل النسخ و silencers بتقلله.</p>
<p><b>Cis-acting</b> = تسلسلات في الـ DNA نفسه. <b>Trans-acting</b> = بروتينات بترتبط بيها.</p>
<h4>المراحل</h4>
<ul>
<li><b>Initiation</b>: TFIID بيتعرف على الـ promoter، TFIIB بيوصّل لـ RNA pol II، TFIIH بيفك الشريطين ويعمل phosphorylation للـ CTD.</li>
<li><b>Elongation</b>: الإنزيم بيفك 10–20 قاعدة كل مرة.</li>
<li><b>Termination</b>: إشارة <bdi>AAUAAA</bdi> والقطع بعدها بـ 10–35 نيوكليوتيد.</li>
</ul>`},
3:{t:"معالجة الـ RNA والترجمة (Translation)",h:`
<p><b>Chromatin remodeling:</b> لما الهستونات تكون لازقة في الـ DNA الإنزيم مش بيوصل. الـ activators بتجيب <b>HAT</b> اللي بيعمل acetylation فالـ DNA يرتخي، و<b>HDAC</b> بيعكس ده.</p>
<h4>التعديلات بعد النسخ</h4>
<ul>
<li><b>Splicing</b> بالـ spliceosome (snRNPs): بيشيل الـ introns ويوصل الـ exons.</li>
<li><b>Alternative splicing</b>: جين واحد يدي أكتر من بروتين.</li>
<li><b>5' cap</b> (7-methylguanosine): بيحمي من الـ nucleases ويساعد في الخروج من النواة وارتباط الريبوسوم.</li>
<li><b>Poly-A tail</b> عند الطرف <bdi>3'</bdi>: مش موجود في الجين، بيتضاف بعد النسخ، ومسؤول عن الثبات والترجمة.</li>
</ul>
<h4>الترجمة: من mRNA إلى بروتين</h4>
<ul>
<li><b>tRNA</b> شكله L وحوالي 80 نيوكليوتيد، شايل حمض أميني و anticodon. إنزيم <b>aminoacyl-tRNA synthetase</b> بيركّب الحمض الأميني الصح.</li>
<li><b>Wobble</b>: مرونة في التزاوج في القاعدة التالتة من الكودون بس.</li>
<li><b>الريبوسوم</b>: 40% rRNA و 60% بروتين. أماكنه: A (الـ tRNA الجديد)، P (السلسلة اللي بتكبر)، E (الخروج).</li>
<li><b>البداية</b>: الوحدة الصغيرة 40S بترتبط بالـ cap وتدور على <b>AUG</b> (Met)، وبعدين 60S تنضم.</li>
<li><b>الاستطالة</b>: التعرف على الكودون ← رابطة ببتيدية ← انتقال، وبتستهلك GTP. السلسلة بتكبر من N إلى C.</li>
<li><b>النهاية</b>: stop codon في الـ A site، مفيش tRNA بيرتبط، فالببتيد بيتحرر.</li>
<li><b>Polysome</b>: ريبوسومات كتير على نفس الـ mRNA.</li>
</ul>`},
4:{t:"التعديلات بعد الترجمة والشفرة الوراثية",h:`
<p>الـ <b>PTMs</b> هي تغييرات كيميائية بتحصل للبروتين بعد ما يتصنع. عندنا حوالي 20–25 ألف جين بس بيدّوا أكتر من مليون بروتين، بسبب الـ alternative splicing والـ PTMs.</p>
<ul>
<li><b>Phosphorylation</b>: على Ser و Thr و Tyr. الـ kinases بتضيف والـ phosphatases بتشيل. بتنشّط p53 وبتثبّط acetyl-CoA carboxylase.</li>
<li><b>Hydroxylation</b>: على Pro و Lys في الكولاجين.</li>
<li><b>Acetylation</b>: على الهستونات بتقلل الشحنة الموجبة فالـ DNA يرتخي والنسخ يزيد.</li>
<li><b>Methylation</b>: على Lys (لحد 3 مرات) أو Arg (لحد مرتين)، ممكن تنشّط أو تثبّط.</li>
<li><b>Ubiquitination</b>: بتعلّم البروتين عشان يتكسر في الـ proteasome.</li>
<li><b>Proteolysis</b>: قطع، زي شيل الـ Met الأولاني أو تنشيط الـ precursors.</li>
<li><b>Carboxylation</b>: محتاجة <b>فيتامين K</b> (عوامل التجلط).</li>
</ul>
<div class="pearl"><strong>نوبل 2019 (HIF-1α):</strong> في الأكسجين الطبيعي بيحصل له hydroxylation ← VHL يتعرف عليه ← ubiquitination ← يتكسر. في نقص الأكسجين بيتراكم ويشغّل جينات زي EPO.</div>
<h4>الشفرة الوراثية</h4>
<ul>
<li>الكودون = 3 قواعد، يعني <bdi>4×4×4 = 64</bdi> كودون: 61 بيدّوا أحماض أمينية و 3 stop codons.</li>
<li><b>AUG</b> = Met وهو كودون البداية. أكتر من كودون ممكن يدّوا نفس الحمض الأميني (redundancy).</li>
<li>مثال: <bdi>AUG-GUG-CCA-CGA-AGG-UGA = Met-Val-Pro-Arg-Arg-Stop</bdi>.</li>
</ul>`},
5:{t:"تنظيم التعبير الجيني – الجزء الأول",h:`
<p><b>Constitutive genes</b>: شغالة دايمًا بمستوى ثابت. <b>Facultative genes</b>: بتشتغل في ظروف معينة بس.</p>
<p><b>Epigenetics</b>: تغيير في التعبير الجيني من غير ما تسلسل الـ DNA يتغير، وأدواته: العناصر الـ cis/trans، الـ ncRNAs، وتعديلات الهستونات.</p>
<h4>البروتينات وعناصر الـ DNA</h4>
<ul>
<li><b>C/EBPs</b>: عيلة من 6 transcription factors.</li>
<li><b>Sp1</b> بيرتبط بالـ GC box وبيجيب TFIID و RNA pol II.</li>
<li>الـ activator ليه جزء بيرتبط بالـ DNA وجزء تنظيمي، وبيجيب HAT عند الـ enhancers.</li>
</ul>
<h4>DNA methylation</h4>
<p>إضافة مجموعة ميثيل عند <b>CpG islands</b> جنب الـ promoter بتوقف النسخ بطريقتين: (1) بتمنع Sp1 يرتبط بالـ GC box، (2) بتجيب methyl-CpG binding protein + HDAC فالكروماتين يقفل. الـ CpG غير الممثيلة = جينات شغالة.</p>
<h4>Non-coding RNAs</h4>
<ul>
<li>بتتنسخ بس مش بتتترجم: miRNA و lncRNA و circRNA.</li>
<li><b>miRNA</b>: حوالي 22 نيوكليوتيد، بيتعمل كـ hairpin ويقطعه <b>Dicer</b> ويشتغل جوه <b>RISC</b>، وبيرتبط بالـ <bdi>3'UTR</bdi> فيكسّر الـ mRNA أو يوقف ترجمته.</li>
<li>نوبل 2024: Ambros و Ruvkun لاكتشاف الـ microRNA.</li>
</ul>
<div class="pearl"><strong>منطق الحالات:</strong> زيادة miRNA-181 ← نقص التيلوميراز (لأن الـ mRNA بتاعه بيتقفل).</div>`},
6:{t:"تنظيم التعبير الجيني – الجزء الثاني",h:`
<ul>
<li><b>circRNA</b>: بيتعمل بالـ back-splicing، عمره حوالي 48 ساعة (أثبت 5 مرات من الـ mRNA العادي)، وبيشتغل كـ <b>miRNA sponge</b>.</li>
<li><b>lncRNA</b>: أطول من 200 نيوكليوتيد، بيشتغل كـ guide أو scaffold أو decoy.</li>
</ul>
<div class="pearl"><strong>منطق الحالات:</strong> لو circRNA اللي بيمسك miRNA-181 قلّ ← miRNA-181 الحر يزيد ← التيلوميراز يقل.</div>
<h4>الهستونات والكروماتين</h4>
<ul>
<li>الـ octamer = 2 من كل واحد (H2A, H2B, H3, H4). الـ <b>H1</b> هو الـ linker ويدي ألياف 30 nm.</li>
<li><b>CENP-A</b> بيحل محل H3 عند الـ centromere.</li>
<li>الـ remodeling complexes بتستخدم ATP لتحريك الـ nucleosomes.</li>
<li>Acetylation للـ Lys = كروماتين نشط، deacetylation = مقفول، methylation = حسب المكان، phosphorylation للـ Ser = نشط.</li>
<li><b>Bromodomains</b> بتقرا الـ acetylation، و<b>chromodomains</b> بتقرا الـ methylation.</li>
</ul>
<h4>أمثلة وموتيفات</h4>
<ul>
<li>تمايز الخلايا: نفس الجينوم بس بروتيوم مختلف.</li>
<li>تغيير الجلوبين من الجنين للبالغ بيغيّر الألفة للأكسجين (الأعلى في الـ embryo).</li>
<li>البروتينات بتقرا الـ <b>major groove</b>. الموتيفات: helix-turn-helix (الأشهر)، zinc finger (كل ما الصوابع زادت الارتباط أقوى)، leucine zipper.</li>
</ul>`},
7:{t:"التنوع الوراثي ومشروع الجينوم البشري",h:`
<ul>
<li><b>HGP</b> بدأ أكتوبر 1990 وخلص أبريل 2003، بـ 20 مركز في 6 دول، واستخدم Sanger sequencing.</li>
<li>مسودة يونيو 2000 غطّت حوالي 90%، ونسخة 2003 حوالي 92%. أصعب الأماكن: الـ telomeres والـ centromeres لأنها متكررة جدًا.</li>
<li><b>T2T</b> في مارس 2022: أول جينوم بشري كامل فعلًا.</li>
<li>الأثر: الفحوصات الجينية، معرفة الأصول، والـ precision medicine.</li>
<li><b>مشروع الجينوم المصري (مارس 2021)</b>: جينوم مرجعي مصري، جينات الأمراض الشائعة، جينومات المصريين القدماء، والطب الشخصي.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> البشر متطابقين بنسبة 99.9%، والـ 0.1% (زي الـ SNPs) هي اللي بتحدد الصفات وخطر الأمراض.</div>`}
},
physio:{
1:{t:"سوائل الجسم والنقل عبر الغشاء وتوازن الماء",h:`
<p><b>Physiology</b> = الوظيفة الطبيعية، و<b>Pathophysiology</b> = الخلل اللي بيحصل في المرض. التنظيم: خلية ← نسيج ← عضو ← جهاز ← كائن.</p>
<h4>أنواع النقل</h4>
<ul>
<li><b>Simple diffusion</b>: من غير طاقة ومع التدرج ومن غير بروتين (O₂ و CO₂).</li>
<li><b>Facilitated diffusion</b>: من غير طاقة بس عن طريق carrier أو channel (الجلوكوز بالـ GLUT).</li>
<li><b>Primary active</b>: بيستخدم ATP مباشرة ضد التدرج، زي <b>Na⁺/K⁺-ATPase</b> (3 صوديوم برّه و 2 بوتاسيوم جوّه).</li>
<li><b>Secondary active</b>: بيستغل تدرج الصوديوم الموجود، زي نقل Na⁺ مع الجلوكوز في الأمعاء.</li>
</ul>
<h4>توازن الماء</h4>
<p>الجفاف يرفع تركيز الدم ← الـ osmoreceptors في الـ hypothalamus ← <b>ADH</b> من الـ posterior pituitary ← الكلى ترجّع ماء.</p>
<ul>
<li><b>علامات الجفاف</b>: ضغط واطي، نبض سريع، جلد وأغشية ناشفة؛ والشديد (فقد 10–15%) خمول وهذيان. كبار السن أكتر عرضة.</li>
<li><b>Hyponatremia</b>: الماء يدخل خلايا المخ ← وذمة دماغية ← تشوش وتشنجات.</li>
<li><b>Hyperkalemia</b>: بتغيّر جهد الراحة ← اضطراب نظم خطير.</li>
<li>محلول <b>hypotonic</b>: كرات الدم تنتفخ وتنفجر؛ <b>hypertonic</b>: تنكمش.</li>
</ul>`},
2:{t:"الدم وأمراض الدم",h:`
<p>الدم = بلازما + خلايا (RBCs و WBCs و platelets). الـ pH من 7.35 لـ 7.45. بروتينات البلازما: albumin و globulins و fibrinogen.</p>
<div class="pearl"><strong>الألبومين والوذمة:</strong> الألبومين كبير ومش بيخرج من الشعيرات، وبيعمل حوالي 80% من الـ colloid osmotic pressure. لو قلّ (زي فشل الكبد) السوائل تفضل في الأنسجة فتحصل <b>وذمة (oedema)</b>.</div>
<h4>كرات الدم الحمراء</h4>
<ul>
<li>مقعرة الوجهين ومن غير نواة، والـ spectrin بيخلي الغشاء مرن. عمرها 100–120 يوم.</li>
<li>الهيموجلوبين = 2α + 2β + 4 heme (Fe²⁺) فيشيل 4 جزيئات O₂. مع CO يدي carboxyhemoglobin، والأدوية المؤكسدة تحوّل Fe²⁺ لـ Fe³⁺ فيبقى methemoglobin.</li>
<li>تكوين الدم بيزيد مع نقص الأكسجين (erythropoietin)، ومحتاج نخاع سليم وكبد وحديد و B12 وفولات.</li>
</ul>
<h4>الأنيميا</h4>
<ul>
<li><b>Microcytic</b>: مشكلة في تصنيع الهيموجلوبين، أشهرها نقص الحديد.</li>
<li><b>Macrocytic (megaloblastic)</b>: مشكلة في تصنيع الـ DNA، نقص B12 أو الفولات.</li>
<li><b>Pernicious</b>: مفيش intrinsic factor فالـ B12 مش بيتمتص.</li>
<li><b>Hemolytic</b>: الكرات بتتكسر أسرع ما بتتعمل. <b>Aplastic</b>: فشل النخاع.</li>
</ul>
<p><b>Ferritin</b> = تخزين الحديد (بيقل في نقص الحديد)، <b>Transferrin</b> = نقل (بيزيد في نقص الحديد). الحديد بيتمتص كـ Fe²⁺ في الـ duodenum، والـ B12 بيتمتص في الـ terminal ileum.</p>
<h4>أمراض وراثية</h4>
<ul>
<li><b>Sickle cell</b>: HbS، وراثة autosomal recessive.</li>
<li><b>G6PD deficiency (أنيميا الفول)</b>: مفيش NADPH، والمحفزات: الفول، السلفا، أدوية الملاريا. وراثة X-linked.</li>
<li><b>Thalassemia</b>: نقص تصنيع سلاسل الجلوبين، autosomal recessive.</li>
</ul>`},
3:{t:"الجهاز العصبي ١: الخلايا العصبية وجهد الفعل",h:`
<ul>
<li><b>Hippocampus</b>: الذاكرة والتعلم. <b>Hypothalamus</b>: الاتزان (الحرارة، الجوع، النوم، الهرمونات). <b>Medulla</b>: القلب والتنفس. <b>Cerebellum</b>: التوازن والحركة.</li>
<li>الفصوص: occipital = النظر، temporal = السمع، frontal = التفكير، parietal = الإحساس بوضع الجسم.</li>
<li>12 عصب قحفي، والـ <b>vagus (X)</b> هو العصب الباراسمبثاوي الرئيسي.</li>
</ul>
<h4>الخلية العصبية</h4>
<p>الـ dendrites بتستقبل، والـ axon بينقل، والـ axon hillock بيولّد الإشارة. الـ <b>myelin</b> بيخلي التوصيل أسرع (saltatory من node لـ node).</p>
<p><b>الخلايا الدبقية:</b> astrocytes (حاجز الدم والمخ)، ependymal (الـ CSF)، oligodendrocytes (ميالين الجهاز المركزي)، microglia (مناعة المخ)، Schwann (ميالين الطرفي والتجدد).</p>
<h4>جهود الغشاء</h4>
<ul>
<li><b>جهد الراحة</b> حوالي <bdi>−70 mV</bdi>: بسبب تسريب K⁺ لبرّه أكتر من Na⁺ لجوّه، ومضخة Na⁺/K⁺، والبروتينات السالبة جوّه.</li>
<li><b>Depolarization</b>: قنوات Na⁺ تفتح والصوديوم يدخل.</li>
<li><b>Repolarization</b>: قنوات K⁺ تفتح والبوتاسيوم يخرج.</li>
<li><b>Hyperpolarization</b>: قنوات K⁺ بتقفل ببطء.</li>
<li><b>Absolute refractory</b>: مستحيل جهد جديد. <b>Relative refractory</b>: محتاج منبّه أقوى.</li>
</ul>
<p><b>القوس الانعكاسي:</b> مستقبل ← عصب حسي ← خلية وسيطة في النخاع الشوكي ← عصب حركي ← العضو المستجيب، وبيحصل قبل ما الإشارة توصل المخ.</p>`},
4:{t:"الجهاز العصبي الذاتي والعضلات",h:`
<h4>السمبثاوي مقابل الباراسمبثاوي</h4>
<ul>
<li><b>Sympathetic</b>: الخوف والهروب (fight or flight)، أصله thoracolumbar، والناقل الأخير <b>noradrenaline</b> على α/β (ما عدا الغدد العرقية ACh).</li>
<li><b>Parasympathetic</b>: الراحة والهضم (rest and digest)، أصله craniosacral، والناقل <b>ACh</b> على مستقبلات muscarinic.</li>
<li>العين: السمبثاوي يوسّع الحدقة (mydriasis)، والباراسمبثاوي يضيّقها (miosis) ويساعد على الرؤية القريبة.</li>
<li>القلب والشعب الهوائية: السمبثاوي يسرّع القلب ويوسّع الشعب، والباراسمبثاوي يبطّأ القلب ويزوّد اللعاب.</li>
<li>كل الألياف قبل العقدة بتفرز ACh على مستقبلات nicotinic (Nn).</li>
</ul>
<h4>انقباض العضلات</h4>
<p><b>العضلات الملساء:</b> زيادة Ca²⁺ ← Ca²⁺–calmodulin ← تنشيط MLCK ← فسفرة الميوسين ← انقباض.</p>
<p><b>العضلات الهيكلية:</b> إشارة عصبية ← ACh عند الـ NMJ ← دخول Na⁺ ← الإشارة في الـ T-tubules ← الـ SR يطلق Ca²⁺ ← انزلاق actin و myosin.</p>
<h4>أمراض</h4>
<ul>
<li><b>Myasthenia gravis</b>: أجسام مضادة ضد مستقبلات nicotinic ← ضعف. العلاج: anticholinesterases ومثبطات مناعة.</li>
<li><b>Alzheimer's</b>: نقص الـ cholinergic مع excitotoxicity بالجلوتامات.</li>
<li><b>Parkinson's</b>: موت خلايا الدوبامين ← رعشة وبطء حركة.</li>
<li><b>Epilepsy</b>: نشاط عصبي زايد. <b>Stroke</b>: انقطاع الدم. <b>MS</b>: التهاب يدمّر الميالين.</li>
</ul>`},
5:{t:"القلب ١: عضلة القلب والجهود الكهربية",h:`
<ul>
<li>الصمامات بتفتح وتقفل بفرق الضغط فالدم يمشي في اتجاه واحد.</li>
<li>الشرايين التاجية: left main ← LAD و circumflex، وكمان الـ right coronary.</li>
<li>خلايا التوصيل (SAN و AVN و Purkinje) بتبدأ وتنشر الإشارة، والخلايا الانقباضية بتضخ.</li>
<li>الخواص: automaticity، excitability، conductivity، contractility.</li>
</ul>
<p><b>المعدل الذاتي:</b> SAN من 90 لـ 105 في الدقيقة (العصب الحائر يخليه حوالي 75)، AVN من 40 لـ 60، Purkinje من 15 لـ 40.</p>
<p>الأدرينالين <b>chronotropic موجب</b>، والديجيتاليس <b>سالب</b>.</p>
<h4>جهد خلايا الـ pacemaker (مفيش جهد راحة حقيقي)</h4>
<ul>
<li><b>Phase 4</b>: دخول Na⁺ البطيء (funny current) من حوالي <bdi>−60 mV</bdi>، ثم قنوات Ca²⁺ من نوع T.</li>
<li><b>Phase 0</b>: دخول Ca²⁺ من نوع L، والعتبة من <bdi>−40</bdi> لـ <bdi>−30 mV</bdi>.</li>
<li><b>Phase 3</b>: خروج K⁺.</li>
</ul>
<h4>جهد عضلة البطين (الراحة حوالي <bdi>−90 mV</bdi>)</h4>
<p>0: دخول Na⁺ السريع · 1: خروج K⁺ قصير · 2: <b>plateau</b> بدخول Ca²⁺ · 3: خروج K⁺ · 4: راحة.</p>
<div class="pearl"><strong>ليه القلب مش بيعمل tetanus؟</strong> لأن الـ absolute refractory period طويل (المراحل 0–2 ونص 3)، فلازم القلب يرتاح ويتملي قبل ما ينقبض تاني.</div>`},
6:{t:"القلب ٢: التوصيل والدورة القلبية وضغط الدم",h:`
<p><b>مسار التوصيل:</b> SAN ← الأذينين ← AVN ← bundle of His ← الفرعين ← ألياف Purkinje.</p>
<ul>
<li>الأبطأ في الـ <b>AVN</b> (0.05 m/s) عشان البطينين يتملوا.</li>
<li>الأسرع في الـ <b>Purkinje</b> (4 m/s) عشان البطينين ينقبضوا مع بعض.</li>
</ul>
<h4>الربط بين الإثارة والانقباض</h4>
<ol>
<li>الإشارة تمشي على الغشاء والـ T-tubules.</li>
<li>قنوات Ca²⁺ من نوع L (DHP) تدخّل كالسيوم قليل.</li>
<li>الكالسيوم ده يفتح الـ ryanodine receptors فيطلع كالسيوم أكتر (calcium-induced calcium release).</li>
<li>Ca²⁺ يرتبط بالـ troponin C ← انقباض.</li>
<li><b>SERCA</b> ترجّع الكالسيوم للـ SR ← ارتخاء.</li>
</ol>
<h4>المعادلات</h4>
<div class="formula">SV = EDV − ESV · CO = SV × HR · EF = SV / EDV<br>Pulse pressure = SBP − DBP = 40 mmHg · Mean ABP = DBP + ⅓ PP ≈ 93 mmHg</div>
<ul>
<li><b>Vasoconstrictors</b>: angiotensin II، adrenaline، noradrenaline. <b>Vasodilators</b>: NO، prostacyclin، histamine، bradykinin.</li>
<li>المقاومة الطرفية بتعتمد على قطر الأوعية.</li>
<li>السمبثاوي chronotropic و inotropic موجب، والباراسمبثاوي chronotropic سالب.</li>
<li>الـ <b>baroreceptors</b> بتتحكم في الضغط لحظة بلحظة، والـ chemoreceptors بتتنشط مع نقص O₂، والـ medulla بتجمع الإشارات.</li>
</ul>`}
},
analytical:{
1:{t:"مقدمة في تفاعلات الأكسدة والاختزال",h:`
<ul>
<li><b>العامل المؤكسد (oxidizing agent)</b>: نفسه بيتختزل، بياخد إلكترونات، ورقم أكسدته بيقل. أمثلة: KMnO₄، K₂Cr₂O₇، I₂، KIO₃، KBrO₃، Ce⁴⁺.</li>
<li><b>العامل المختزل (reducing agent)</b>: نفسه بيتأكسد، بيدي إلكترونات، ورقم أكسدته بيزيد. أمثلة: Na₂S₂O₃، الأوكسالات، Fe²⁺.</li>
</ul>
<h4>قواعد رقم الأكسدة</h4>
<p>العنصر الحر = صفر، H = +1 (ما عدا الهيدريدات)، O = −2 (ما عدا البيروكسيدات)، الأيون = شحنته، والمركب المتعادل مجموعه صفر. مثال: Mn في KMnO₄ = +7.</p>
<h4>الوزن المكافئ</h4>
<div class="formula">Eq. wt = Molecular weight ÷ التغير في رقم الأكسدة<br>KMnO₄ في وسط حمضي: +7 → +2 (5 e) → 158/5 = 31.6<br>KMnO₄ في وسط قلوي: +7 → +4 (3 e) → 158/3 = 52.67</div>
<h4>الموازنة بأنصاف المعادلات</h4>
<ol>
<li>قسّمي التفاعل لنص معادلة للمؤكسد ونص للمختزل.</li>
<li>وازني الذرات (O بالماء و H بـ H⁺)، وبعدين الشحنات بالإلكترونات.</li>
<li>اضربي بحيث الإلكترونات المفقودة = المكتسبة، واجمعي.</li>
</ol>
<div class="formula">MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>`},
2:{t:"جهد القطب (Electrode potential)",h:`
<ul>
<li>لو <b>solution pressure</b> أكبر: الفلز يدوب (يتأكسد)، القطب يبقى سالب ووزنه يقل. مثال: Zn⁰ → Zn²⁺.</li>
<li>لو <b>ionic pressure</b> أكبر: الأيونات تترسب (تتختزل)، القطب يبقى موجب ووزنه يزيد. مثال: Cu²⁺ → Cu⁰.</li>
</ul>
<p>الجهود القياسية بتتقاس بالنسبة لـ <b>قطب الهيدروجين القياسي</b> (E⁰ = صفر).</p>
<p>القطب بياخد نفس إشارة الـ E⁰ بتاعه، والتيار بيمشي من الأكثر سالبية للأكثر موجبية (مثلًا Mg −2.36 إلى Ag +0.80).</p>
<div class="formula">E = E⁰ + (0.059/n) log [Mⁿ⁺] → E = E⁰ لما التركيز = 1 M</div>
<div class="pearl"><strong>السلسلة الكهروكيميائية:</strong> الفلزات اللي جهدها أكثر سالبية عوامل مختزلة، وبتحل محل الفلزات اللي تحتها في المحلول.</div>`},
3:{t:"الخلايا الكهروكيميائية",h:`
<ul>
<li><b>الخلية الجلفانية (Galvanic)</b>: تفاعل تلقائي بيولّد تيار. الأكسدة عند الـ <b>anode</b> والاختزال عند الـ <b>cathode</b>.</li>
<li><b>الخلية الإلكتروليتية</b>: تيار خارجي بيجبر تفاعل غير تلقائي يحصل.</li>
<li><b>Salt bridge</b>: بيوصل نصفي الخلية، يقفل الدائرة، ويحافظ على تعادل الشحنات بحركة الأيونات.</li>
</ul>
<div class="formula">EMF = E⁰(cathode) − E⁰(anode)</div>
<div class="pearl"><strong>نصيحة:</strong> لو الـ EMF موجب يبقى التفاعل تلقائي.</div>`},
4:{t:"جهد الأكسدة والعوامل المؤثرة عليه",h:`
<div class="formula">E = E⁰ + (0.059/n) log [Ox]/[Red] → E = E⁰ لما [Ox] = [Red]</div>
<ul>
<li>كل ما الـ E⁰ يكون موجب أكتر يبقى <b>عامل مؤكسد أقوى</b>، والسالب = عامل مختزل قوي.</li>
<li>عشان التفاعل يكمل لازم الفرق بين النظامين حوالي <b>0.4 V</b>.</li>
<li>شيل الصورة المؤكسدة (ترسيب أو تكوين معقد) ← الجهد يقل. شيل الصورة المختزلة ← الجهد يزيد.</li>
</ul>
<p><b>جهود مهمة:</b> MnO₄⁻/Mn²⁺ = 1.51 · Ce⁴⁺ = 1.44 · Cl₂ = 1.36 · Cr₂O₇²⁻ = 1.36 · Fe³⁺/Fe²⁺ = 0.77 · I₂/I⁻ = 0.54. يعني البرمنجنات تقدر تأكسد Cl⁻ و Fe²⁺، بس Fe³⁺ يأكسد I⁻ بس.</p>
<h4>مسائل تطبيقية</h4>
<ul>
<li><b>معايرة FeCl₂ بالبرمنجنات</b>: الكلوريد كمان هيتأكسد، فنضيف <b>Zimmermann–Reinhardt reagent</b>: MnSO₄ (يقلل جهد البرمنجنات تحت الكلور وفوق الحديد)، H₃PO₄ (يعمل معقد عديم اللون مع Fe³⁺ ويقلل جهده)، H₂SO₄ (للحموضة).</li>
<li><b>معايرة FeCl₂ باليود</b>: اليود (0.54) أضعف من الحديد (0.77)، فنضيف HgCl₂ (يشيل I⁻ فيرفع جهد اليود) و H₃PO₄ (يقلل جهد الحديد).</li>
</ul>`},
5:{t:"الكواشف والمعايرات ومنحنى المعايرة",h:`
<h4>أنواع الكواشف</h4>
<ul>
<li><b>Self</b>: KMnO₄ (أول لون وردي ثابت) و I₂.</li>
<li><b>External</b>: K-ferricyanide كاختبار نقطة للـ Fe²⁺.</li>
<li><b>Internal</b>: diphenylamine (0.76، من عديم اللون لبنفسجي)، ferroin (1.06، من أحمر لأزرق)، N-phenylanthranilic acid (1.08).</li>
<li><b>Irreversible</b>: methyl orange و methyl red. <b>Specific</b>: النشا مع اليود و SCN⁻ مع Fe³⁺.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> الـ diphenylamine (0.76) قريب جدًا من جهد الحديد (0.77)، فلازم نضيف فوسفات أو فلوريد يقلل جهد الحديد. أما phenylanthranilic acid (1.08) فبيشتغل مباشرة لأنه بين 0.77 و 1.36.</div>
<h4>المعايرات الثلاثة</h4>
<ul>
<li><b>KMnO₄</b>: الأقوى، كاشف ذاتي، مش primary standard (يتعاير ضد sodium oxalate)، وسط حمضي.</li>
<li><b>Ce⁴⁺</b>: التاني في القوة، كاشف ذاتي ضعيف، الكاشف ferroin، يشتغل في أي وسط.</li>
<li><b>K₂Cr₂O₇</b>: التالت، <b>primary standard</b>، مش كاشف ذاتي، الكاشف ferroin أو diphenylamine.</li>
</ul>
<p>عينات الحديديك لازم تتختزل الأول لـ Fe²⁺ (بـ SnCl₂ أو الزنك).</p>
<h4>منحنى المعايرة</h4>
<div class="formula">E عند نقطة التكافؤ = (n₁E₁⁰ + n₂E₂⁰) / (n₁ + n₂)<br>مثال I⁻ مع Ce⁴⁺: (2×0.54 + 1×1.44)/3 = 0.84 V</div>
<p>الجهد بيتغير ببطء قبل نقطة النهاية وبيقفز فجأة عند نقطة التكافؤ.</p>`},
6:{t:"Iodimetry و Iodometry و KIO₃ و KBrO₃",h:`
<ul>
<li><b>Iodimetry (مباشرة)</b>: المعاير هو I₂ القياسي، وبتقدّر <b>العوامل المختزلة</b> زي الثيوسلفات وفيتامين C.</li>
<li><b>Iodometry (غير مباشرة)</b>: نضيف KI زيادة، واليود اللي يتحرر نعايره بالثيوسلفات، وبتقدّر <b>العوامل المؤكسدة</b> زي H₂O₂ و Cu²⁺.</li>
</ul>
<div class="formula">I₂ + 2S₂O₃²⁻ → 2I⁻ + S₄O₆²⁻ (tetrathionate)<br>H₂O₂ + 2H⁺ + 2I⁻ → I₂ + 2H₂O</div>
<p><b>الكاشف:</b> النشا (خاص باليود). اليود بيدوب في الكلوروفورم أو CCl₄ أكتر من الماء بحوالي 90 مرة.</p>
<h4>KIO₃ – الناتج بيعتمد على الحموضة</h4>
<ul>
<li>وسط متعادل: يتحول لـ I⁻ (6 إلكترونات).</li>
<li>وسط حمضي خفيف: يتحول لـ ½I₂ (5 إلكترونات).</li>
<li>وسط حمضي قوي: يتحول لـ I⁺ (4 إلكترونات).</li>
</ul>`},
7:{t:"مراجعة الميدترم",h:`
<p>المحاضرة السابعة مراجعة للمحاضرات من 1 لـ 6. ذاكري معاها الكويز: موازنة المعادلات، الفرق بين جهد القطب وجهد الأكسدة، العوامل المؤثرة على الجهد، كاشف Zimmermann، اختيار الكاشف، المعايرات الثلاثة، ومنحنى المعايرة.</p>
<h4>عينات مختزلة وإزاي تتعاير</h4>
<ul>
<li><b>الأوكسالات</b> ← CO₂: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>Fe²⁺</b> ← Fe³⁺: بالبرمنجنات أو Ce⁴⁺ أو الداي كرومات.</li>
<li><b>Ferrocyanide</b> ← ferricyanide: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>H₂O₂</b> ← O₂: بالبرمنجنات أو Ce⁴⁺.</li>
<li><b>As³⁺ و Sb³⁺ و SO₃²⁻ و NO₂⁻</b>: بالبرمنجنات.</li>
</ul>`}
},
dosage:{
1:{t:"الأشكال الصيدلانية السائلة وزيادة الذوبانية",h:`
<p>الـ <b>dosage form</b> هو الشكل اللي الدوا بيوصل بيه لمكان تأثيره. المحلول خليط متجانس من مذاب ومذيب. استثناء: <b>Syrup BP</b> فيه 66.7% سكروز و 33.3% ماء بس.</p>
<ul>
<li><b>مميزات المحاليل</b>: سهلة البلع للأطفال وكبار السن، امتصاص سريع، تهييج أقل للمعدة، جرعة متجانسة، وطرق إعطاء كتير.</li>
<li><b>عيوبها</b>: حجمها كبير، أقل ثباتًا (hydrolysis)، الميكروبات بتنمو فيها، الطعم واضح، والجرعة بتعتمد على قياس المريض.</li>
</ul>
<p><b>Solubilization</b> = زيادة ذوبان دوا ضعيف الذوبان في الماء. حوالي 40% من الأدوية المرشحة بتفشل بسبب ضعف الـ bioavailability.</p>
<p><b>BCS:</b> Class I ذوبان ونفاذية عالية · II ذوبان قليل ونفاذية عالية · III ذوبان عالي ونفاذية قليلة · IV الاتنين قليل.</p>
<h4>الطرق</h4>
<ul>
<li><b>تغيير الـ pH / تكوين ملح</b>: الأبسط للأدوية القابلة للتأين. بيفيد Class II وممكن يضر Class III.</li>
<li><b>تعديل كيميائي</b>: مشتق ذواب، زي hydrocortisone sodium phosphate.</li>
<li><b>Co-solvency</b>: مذيبات بتمتزج بالماء (glycerol و ethanol و propylene glycol)، زي paracetamol elixir.</li>
<li><b>Micellar solubilization</b>: surfactant فوق الـ CMC بيحبس الدوا في micelles، زي Tweens لفيتامينات A و D و E و K، والصابون في Dettol.</li>
<li><b>Hydrotropy</b>: كمية كبيرة من مذاب تاني (sodium benzoate، urea)، ومفيش CMC.</li>
<li><b>Complexation</b>: الـ cyclodextrins (α = 6، β = 7، γ = 8 وحدات جلوكوز) برّه محب للماء وجوّه كاره له.</li>
<li><b>Solid dispersion</b>: الدوا منتشر في بوليمر محب للماء (PVP، HPMC، PEG 6000).</li>
</ul>`},
2:{t:"تصغير حجم الجزيئات: Micronization و Nanocrystals و Cocrystals",h:`
<div class="formula">Noyes–Whitney: dm/dt = D·A·(Cs − C)/h<br>معدل الذوبان بيتناسب طرديًا مع المساحة السطحية A</div>
<ul>
<li><b>Micronization</b>: من 1 لـ 10 µm بالـ jet milling أو ball milling، أكثر ثباتًا. أمثلة: griseofulvin و spironolactone. ممكن ما يكفيش لو log P أكبر من 4.</li>
<li><b>Nanocrystals</b>: من 100 لـ 1000 nm. Top-down بالـ high-pressure homogenization، أو bottom-up بالترسيب. بتتكتل فمحتاجة stabilizers. أمثلة: Tricor و Rapamune و Emend.</li>
<li><b>Stabilizers</b>: steric (بوليمرات زي PVP و HPMC)، electrostatic (مشحونة زي SDS)، أو الاتنين.</li>
</ul>
<h4>Cocrystals</h4>
<p>دوا + <b>coformer</b> في بلورة واحدة مربوطين بروابط غير تساهمية. بتغيّر الخواص الفيزيائية مش الفارماكولوجي. مثال: carbamazepine–saccharin.</p>
<ul>
<li><b>ليه الذوبان بيزيد؟</b> الشبكة البلورية أضعف، والترطيب أحسن، وفيه قوة دافعة ديناميكية حرارية.</li>
<li><b>شروط الـ coformer</b>: يعمل روابط هيدروجينية، آمن (GRAS)، يحسّن الخواص، وما يتفاعلش مع الدوا.</li>
<li><b>Multidrug cocrystals</b>: زي <b>Entresto</b> (sacubitril + valsartan) لفشل القلب.</li>
<li><b>طرق التحضير</b>: الطحن الجاف، الطحن بسائل، تبخير المذيب، الموجات فوق الصوتية أو الميكروويف.</li>
</ul>`},
3:{t:"المياه الصيدلانية والمياه العطرية",h:`
<ul>
<li><b>مياه الحنفية</b>: ما تنفعش للصرف، فيها ميكروبات وأملاح.</li>
<li><b>مياه مغلية ومبردة</b>: بتقتل البكتيريا النشطة بس الجراثيم والأملاح بتفضل.</li>
<li><b>Purified Water USP</b>: خالية من الأيونات والميكروبات، لكل الأشكال ما عدا الحقن وقطرات العين.</li>
<li><b>Water for Injection</b>: خالية من الـ pyrogens ومعقمة، عبوات جرعة واحدة لحد 1 لتر، من غير مادة حافظة.</li>
<li><b>Bacteriostatic WFI</b>: فيها مادة مضادة للميكروبات، للعبوات متعددة الجرعات. لو محتاجين أكتر من 5 مل نستخدم sterile WFI.</li>
</ul>
<h4>تحضير المياه النقية</h4>
<ul>
<li><b>التقطير</b>: نرمي أول 10–20% وآخر 10–20%.</li>
<li><b>Ion exchange</b>: الـ cation resin يبدّل Ca²⁺ و Mg²⁺ بـ H⁺، والـ anion resin يبدّل Cl⁻ بـ OH⁻. رخيصة ومن غير حرارة.</li>
<li><b>Reverse osmosis</b>: ضغط بيدفع الماء عكس الأسموزية، وبيشيل الـ pyrogens و 90–99% من الأيونات.</li>
</ul>
<h4>المياه العطرية</h4>
<p>محاليل مائية شبه مشبعة بزيوت طيارة (نعناع، ورد، يانسون، كافور، كلوروفورم)، وبتستخدم كـ vehicle بطعم حلو.</p>
<ul>
<li><b>مشاكلها</b>: salting out مع الأملاح، بتعكّر مع الوقت، وحساسة للضوء والحرارة.</li>
<li><b>التحضير</b>: بالتقطير (الأفضل، والتقطير المتكرر اسمه cohobation زي ماء الورد)، أو محلول بسيط (2 جم زيت + 1000 مل ماء ونسيبه 12 ساعة ونفلتر)، أو بمادة مساعدة على الذوبان.</li>
<li><b>الاستخدامات</b>: الكافور طارد للغازات، الكلوروفورم مقشع وحافظ، النعناع واليانسون طاردين للغازات.</li>
</ul>`},
4:{t:"الإضافات في السوائل والمحاليل الفموية والشراب",h:`
<ul>
<li><b>Buffers</b>: كربونات، سترات، فوسفات. البورات للاستخدام الخارجي بس. الحقن وقطرات العين حوالي 7.4.</li>
<li><b>Isotonicity</b>: NaCl والدكستروز، والـ isotonic = 0.9% NaCl.</li>
<li><b>Viscosity enhancers</b>: povidone و carbomer لتلامس أطول.</li>
<li><b>Preservatives</b>: benzoic acid من 0.1 لـ 0.2%، parabens 0.1%، كحول أكتر من 20%. الـ parabens بتتحبس في الـ micelles وتفقد فاعليتها.</li>
<li><b>Antioxidants</b>: EDTA، وللزيوت tocopherol و BHA و BHT، وللمحاليل المائية ascorbic acid.</li>
<li><b>Sweeteners</b>: السكروز (ثابت من pH 4 لـ 8)، sorbitol، saccharin أقل من 0.2%، aspartame.</li>
<li><b>Flavours</b>: للمر: يانسون وشوكولاتة ونعناع. للمالح: مشمش وعرقسوس. للحامض: موالح وتوت.</li>
</ul>
<h4>المحاليل الفموية</h4>
<ul>
<li>الجرعات: 5 مل (معلقة صغيرة)، 10 مل، 15 مل (معلقة كبيرة).</li>
<li><b>ORS</b> لكل لتر: 45 mEq صوديوم، 20 بوتاسيوم، 35 كلوريد، 30 سترات، 25 جم دكستروز.</li>
<li>Magnesium citrate ملين ملحي، و sodium citrate–citric acid بيقلّوِن البول (حصوات، نقرس).</li>
</ul>
<h4>الشراب واللينكتس</h4>
<p>الشراب محلول سكر مركز. لمرضى السكر: <b>artificial syrup</b> = sodium CMC 1.5% + saccharin 0.6%. الشراب المشبع تقريبًا مش محتاج مادة حافظة (مفيش ماء حر). الـ <b>linctus</b> للكحة، يتشرب ببطء ومن غير تخفيف.</p>`},
5:{t:"المحاليل الخارجية المائية وغير المائية",h:`
<h4>مائية – للاستخدام الخارجي</h4>
<ul>
<li><b>Lotions</b>: قليلة اللزوجة وبتتحط من غير دعك (زي calamine).</li>
<li><b>Douches</b>: تيار للتنظيف (عين، حلق، مهبل).</li>
<li><b>Enemas</b>: للإخراج (نص لتر لـ لتر ماء)، أو للاحتفاظ لتأثير موضعي أو جهازي (hydrocortisone للقولون التقرحي) بحد أقصى 150 مل، أو تشخيصية (barium sulfate).</li>
<li><b>Nasal</b>: isotonic و pH من 5.5 لـ 6.5 لحماية الأهداب. مزيلات الاحتقان أقصى حاجة 3–5 أيام عشان rhinitis medicamentosa.</li>
<li><b>Otic</b>: الجلسرين والبروبيلين جليكول لزجين وبيمتصوا الرطوبة.</li>
</ul>
<h4>غير مائية</h4>
<ul>
<li>مناسبة للأدوية اللي ما بتدوبش في الماء أو بتتحلل فيه، وللحقن الزيتية طويلة المفعول.</li>
<li><b>الإيثانول</b>: مذيب ومادة حافظة فوق 15–20% ومبرّد للجلد. الحد الأقصى في الأدوية الفموية: 0.5% تحت 6 سنين، 5% من 6 لـ 12، و 10% فوق 12.</li>
<li>الكحول بيرسّب الـ tragacanth والـ acacia والأملاح.</li>
<li><b>Glycerin</b> (3 OH) و <b>propylene glycol</b> (2 OH): مذيبات وحافظة ولزوجة.</li>
<li><b>الزيوت الثابتة</b>: زيت اللوز، السمسم، الزيتون، الخروع، وجوز الهند.</li>
</ul>
<h4>خارجية غير مائية</h4>
<ul>
<li><b>Liniments</b>: بتتحط بالدعك، وما تتحطش على جلد مجروح.</li>
<li><b>Collodion</b>: 4% pyroxylin في كحول وإيثر، بيعمل طبقة حماية. الـ flexible collodion فيه 2% كافور و 3% زيت خروع. salicylic acid collodion 10% لإزالة الكالو.</li>
</ul>`},
6:{t:"الغرويات: الأنواع والتحضير والتنقية",h:`
<ul>
<li><b>Molecular</b>: أقل من 1 nm، بيعدّي من الغشاء شبه المنفذ، انتشاره سريع.</li>
<li><b>Colloidal</b>: من 1 لـ 500 nm، بيتشاف بالـ ultramicroscope، بيعدّي من ورق الترشيح بس مش من الغشاء، انتشاره بطيء جدًا.</li>
<li><b>Coarse</b>: أكبر من 500 nm، بيتشاف بالميكروسكوب العادي وبيتحجز في ورق الترشيح.</li>
</ul>
<p>الغرويات مساحتها السطحية ضخمة: platinum black كعامل حفاز، الكاولين بيمتص السموم، و Al(OH)₃ مضاد حموضة، و dextran بديل للبلازما.</p>
<h4>الأنواع</h4>
<ul>
<li><b>Lyophilic</b>: بوليمرات عضوية (جيلاتين، أكاسيا)، بتتكون تلقائيًا، اللزوجة بتزيد جدًا، وثابتة مع الإلكتروليتات.</li>
<li><b>Lyophobic</b>: غير عضوية (ذهب، فضة، كبريت)، محتاجة طرق خاصة، ومش ثابتة مع كمية قليلة من الإلكتروليت.</li>
<li><b>Association</b>: micelles من surfactant فوق الـ CMC.</li>
</ul>
<p><b>تحضير الـ lyophobic:</b> dispersion (من كبير لصغير: ultrasonic، electric arc، colloid mill) أو condensation (من صغير لكبير: التشبع الزائد أو تفاعلات كيميائية زي تحلل FeCl₃).</p>
<h4>التنقية</h4>
<ul>
<li><b>Dialysis</b>: غشاء بيخرّج الأيونات الصغيرة ويحجز الغرويات.</li>
<li><b>Electrodialysis</b>: مجال كهربي بيسرّع خروج الأيونات.</li>
<li><b>Ultrafiltration</b>: شفط من خلال غشاء دقيق.</li>
<li><b>الكلية الصناعية</b>: السيلوفان بيعدّي اليوريا والجلوكوز والأملاح، مش البروتينات أو الخلايا.</li>
</ul>`},
7:{t:"خواص الغرويات",h:`
<h4>الخواص الضوئية</h4>
<ul>
<li><b>Faraday–Tyndall effect</b>: الغرويات بتشتت الضوء (مخروط واضح)، والمحاليل الحقيقية لأ.</li>
<li>الـ <b>ultramicroscope</b>: الجزيئات بتبان نقط لامعة للعد. الـ <b>electron microscope</b>: الحجم والشكل الحقيقي بس العينة لازم تنشف.</li>
</ul>
<h4>الخواص الحركية</h4>
<ul>
<li><b>Brownian motion</b>: حركة عشوائية من خبط جزيئات المذيب، أسرع مع الجزيئات الأصغر واللزوجة الأقل.</li>
<li><b>Diffusion</b> (قانون Fick الأول): <bdi>dm/dt = −D·A·dC/dx</bdi>.</li>
<li><b>Sedimentation</b> (Stokes): <bdi>v = 2r²(ρ − ρ₀)g / 9η</bdi>. تحت 0.5 µm الحركة البراونية بتقاوم الترسيب، فبنستخدم ultracentrifuge.</li>
<li><b>Viscosity</b>: الجزيئات الكروية lyophobic لزوجتها قليلة، والخطية lyophilic لزوجتها عالية.</li>
</ul>`}
},
organic:{
1:{t:"الألدهيدات والكيتونات: التسمية والخواص والتحضير",h:`
<ul>
<li><b>الألدهيدات</b>: النهاية <b>-al</b> وكربون الكربونيل رقم 1 (methanal). لو CHO على حلقة: carbaldehyde.</li>
<li><b>الكيتونات</b>: النهاية <b>-one</b> وأقل رقم للـ C=O (propanone). الاسم الشائع: المجموعات أبجديًا + ketone. على حلقة بنزين: -phenone (acetophenone).</li>
</ul>
<div class="formula">الأولوية: −COOH > −COOR > −COCl > −CONH₂ > −CN > −CHO > C=O > −OH > −NH₂</div>
<p><b>الاستخدامات:</b> الفورمالدهيد (حافظ ومطهر ولقاحات)، البنزالدهيد (نكهة)، الأسيتون (مذيب)، الأسيتوفينون (لتحضير الإيبوبروفين).</p>
<p><b>الخواص:</b> قطبية، درجة غليانها أعلى من الألكانات وأقل من الكحولات، أقل من 6 كربون بيدوب في الماء، وبتعمل رابطة هيدروجين مع الماء بس مش مع بعض.</p>
<h4>طرق التحضير</h4>
<ul>
<li>أكسدة الكحولات بـ <b>PCC</b>: الأولي يدي ألدهيد ويقف، والثانوي يدي كيتون.</li>
<li>Nitrile + Grignard: كيتونات بس.</li>
<li><b>Friedel–Crafts acylation</b>: كيتونات أروماتية بس.</li>
<li>Acyl chloride + R₂Cd: كيتونات بس.</li>
<li><b>Rosenmund</b>: RCOCl + H₂/Pd–BaSO₄ يدي ألدهيدات بس (الـ BaSO₄ بيوقف الاختزال للكحول).</li>
<li><b>Reimer–Tiemann</b>: ألدهيدات فينولية (salicylaldehyde).</li>
</ul>
<div class="pearl"><strong>Keto–enol:</strong> التوازن ناحية الـ keto لأن الـ C=O أقوى بكتير من الـ C=C.</div>`},
2:{t:"الإضافة النيوكليوفيلية والفراغية والاختزال",h:`
<p><b>النشاط:</b> الألدهيدات أنشط من الكيتونات (عوائق فراغية أقل)، والأليفاتية أنشط من الأروماتية (الرنين بيقلل الإلكتروفيلية).</p>
<h4>النيوكليوفيلات</h4>
<ul>
<li><b>2 ROH مع HCl جاف</b>: hemiacetal ثم acetal (بيرجع بالماء). الـ diols بتدي acetals حلقية كمجموعات حماية.</li>
<li><b>HCN</b>: cyanohydrin ثم α-hydroxy acids (زي mandelic acid للبشرة).</li>
<li><b>Grignard</b>: كحولات.</li>
<li><b>مشتقات الأمونيا</b>: imines و oximes (ترياق للتسمم بالمبيدات الفوسفورية) و hydrazones.</li>
</ul>
<h4>الكيمياء الفراغية</h4>
<ul>
<li><b>Prochiral</b>: مش chiral بس يبقى chiral بعد تغيير واحد. الهجوم عليه من غير مركز تاني يدي <b>racemic mixture</b> 50:50 غير نشط ضوئيًا.</li>
<li>لو فيه α-carbon كيرالي بالفعل: التفاعل stereoselective. <b>قاعدة Cram و عبد الحافظ</b>: النيوكليوفيل يهاجم من ناحية المجموعة الصغيرة ← threo (الأساسي).</li>
<li><b>R/S في فيشر</b>: لو الأقل أولوية رأسي والاتجاه مع عقارب الساعة = R. لو أفقي اعكسي.</li>
<li><b>Erythro</b>: المجموعات المتشابهة في نفس الجهة، <b>threo</b>: في جهتين.</li>
<li><b>Enantiomers</b>: صورة مرآة، نفس الخواص ما عدا الدوران الضوئي. <b>Diastereomers</b>: مش صورة مرآة وخواصهم مختلفة.</li>
</ul>
<h4>الاختزال</h4>
<ul>
<li>لألكانات: <b>Clemmensen</b> (Zn(Hg)/HCl) أو <b>Wolff–Kishner</b> (N₂H₄/KOH).</li>
<li>لكحولات: NaBH₄ أو LiAlH₄: الألدهيد يدي كحول أولي والكيتون يدي ثانوي.</li>
</ul>`},
3:{t:"تفاعلات الـ α-هيدروجين والأحماض الكربوكسيلية",h:`
<p>الـ <b>α-H</b> حمضي لأن الكربونيل بيثبّت الـ carbanion بالـ −I والرنين.</p>
<ul>
<li><b>Aldol condensation</b>: محتاج α-H وقاعدة قوية. الـ enolate يهاجم كربونيل تاني ثم نزع ماء ← α,β-unsaturated carbonyl.</li>
<li><b>Cannizzaro</b>: ألدهيدات من غير α-H (HCHO والبنزالدهيد) مع قلوي ساخن: جزيء يتختزل لكحول وجزيء يتأكسد لحمض.</li>
<li><b>Haloform (iodoform)</b>: أي مجموعة CH₃CO− مع I₂/NaOH تدي CHI₃ أصفر + ملح حمض فيه كربون أقل بواحد.</li>
<li>الـ −CHO والـ −COR بيقللوا نشاط الحلقة وبيوجّهوا لـ <b>meta</b>.</li>
</ul>
<h4>الأحماض الكربوكسيلية</h4>
<ul>
<li>التسمية: النهاية <b>-oic acid</b> والكربون رقم 1 هو كربون COOH. مثال: 4-chloropentanoic acid.</li>
<li>الإسترات: اسم الألكيل + اسم الحمض بـ <b>-ate</b> (propyl hexanoate).</li>
<li>درجة الغليان عالية لأن جزيئين بيعملوا <b>dimer</b> بروابط هيدروجينية. أول 4 أحماض بتمتزج بالماء تمامًا.</li>
</ul>`},
4:{t:"الحمضية وتحضير وتفاعلات الأحماض الكربوكسيلية",h:`
<p>الحمضية بتعتمد على ثبات أيون الكربوكسيلات (الشحنة موزعة على أكسجينين).</p>
<ul>
<li>كل ما الـ s-character يزيد الحمضية تزيد: sp > sp² > sp³.</li>
<li>مجموعات الألكيل (+I) بتقلل الحمضية. مجموعات −I بتزوّدها: كل ما تكتر، وتبقى أكتر سالبية كهربية (F > Cl > Br > I)، وأقرب للـ COOH.</li>
<li>حمض البنزويك (pKa 4.2) أقوى من الأسيتيك.</li>
<li>NO₂ في para بيأثر بـ −M فأقوى من meta. OH في para بـ +M بيضعّف الحمض.</li>
<li><b>Ortho effect</b>: أي مجموعة ortho بتلف الـ COOH برّه مستوى الحلقة فيبقى الحمض أقوى، حتى لو المجموعة مانحة.</li>
</ul>
<h4>التحضير</h4>
<ul>
<li>أكسدة الكحولات الأولية أو الألدهيدات بـ KMnO₄.</li>
<li>Grignard + CO₂ يدي حمض فيه كربون زيادة.</li>
<li>تحلل الـ nitriles بالحمض.</li>
</ul>
<h4>التفاعلات</h4>
<ul>
<li><b>HVZ</b> (X₂/P): هلجنة الـ α ثم استبدال بـ OH أو NH₂.</li>
<li>مع NaOH: أملاح. <b>Diclofenac potassium</b> أذوب فمفعوله أسرع (ألم حاد)، و <b>diclofenac sodium</b> أبطأ (التهاب مفاصل مزمن).</li>
<li><b>Nucleophilic acyl substitution</b>: الـ acid chlorides هي الأنشط. مع كحول يدي إستر، ومع أمين يدي أميد.</li>
<li><b>Fischer esterification</b> عكسية، فنستخدم زيادة من الكحول أو الحمض.</li>
</ul>`},
5:{t:"الأشكال الفراغية (Conformations) والهكسان الحلقي",h:`
<p>الـ <b>Conformers</b>: نفس الجزيء بيتحول بالدوران حوالين الروابط الأحادية أو قلب الحلقة، وحاجز الطاقة صغير.</p>
<ul>
<li>عوامل الطاقة: torsional strain، steric strain، dipole–dipole، والرابطة الهيدروجينية.</li>
<li><b>ثبات البيوتان</b>: anti > gauche > partially eclipsed > fully eclipsed.</li>
<li>الإيثيلين جليكول والإيثانولامين: الـ <b>gauche</b> هو الأثبت بسبب رابطة هيدروجين داخلية.</li>
</ul>
<h4>Chair مقابل Boat</h4>
<ul>
<li><b>Chair</b>: مفيش angle strain (109.5°) ولا torsional ولا steric، فهو <b>الأثبت</b>.</li>
<li><b>Boat</b>: فيه هيدروجينات eclipsed وهيدروجينات flagpole عند C1 و C4، فهو أقل ثباتًا.</li>
</ul>
<div class="pearl"><strong>احفظي:</strong> كل كربون ليه رابطة axial ورابطة equatorial، وقلب الحلقة بيبدّلهم. المجموعات بتفضّل <b>equatorial</b> عشان تبعد عن الـ 1,3-diaxial، والمجموعة الأكبر تاخد equatorial.</div>`},
6:{t:"تسمية المركبات الحلقية غير المتجانسة",h:`
<p>الـ <b>heterocycle</b> فيه ذرة واحدة على الأقل في الحلقة مش كربون (N أو O أو S). حوالي 59% من الأدوية المعتمدة من FDA فيها حلقات نيتروجينية، والأحماض النووية كمان heterocycles.</p>
<ul>
<li><b>أسماء شائعة خماسية</b>: pyrrole، furan، thiophene، imidazole، pyrazole، oxazole، thiazole.</li>
<li><b>سداسية</b>: pyridine، pyrimidine، pyrazine، pyridazine.</li>
</ul>
<h4>نظام Hantzsch–Widman</h4>
<p>الاسم = <b>بادئة</b> (نوع الذرة: oxa > thia > aza مع الأرقام) + <b>جذر</b> (حجم الحلقة) + <b>لاحقة</b> (مشبعة ولا لأ، وفيها نيتروجين ولا لأ).</p>
<ul>
<li>ثلاثية فيها N: غير مشبعة <b>-irine</b>، مشبعة <b>-iridine</b>.</li>
<li>ثلاثية من غير N: غير مشبعة <b>-irene</b>، مشبعة <b>-irane</b>.</li>
<li>أمثلة: aziridine (مشبعة فيها N)، oxirane (فيها O)، thiirane (فيها S).</li>
</ul>`}
}

DEEP.genetics[1]={en:`
<p>This first lecture answers two questions: <b>what does DNA look like</b>, and <b>how does a cell copy it</b> before dividing? Everything later in the course (transcription, translation, gene regulation) builds on these two ideas, so it is worth understanding them properly rather than memorising lists.</p>

<h4>1. How the structure of DNA was discovered</h4>
<p>The double helix was not found by one person. Three groups each added a piece, and the exam often asks you to match the scientist to the conclusion.</p>
<h5>Rosalind Franklin: X-ray crystallography</h5>
<p>Franklin passed X-rays through aligned fibres of purified DNA. Atoms scatter X-rays in a pattern (a diffraction pattern), and from that pattern you can work out where the atoms sit. Her pictures showed three things:</p>
<ul>
<li>The <b>sugar–phosphate backbone is on the outside</b> of the molecule. This makes sense chemically: phosphate groups are charged and hydrophilic, so they face the watery surroundings.</li>
<li>The <b>nitrogenous bases are on the inside</b>. Bases are flat, relatively hydrophobic rings, so they hide from water in the core.</li>
<li>The molecule is made of <b>two strands arranged as a helix</b>.</li>
</ul>
<h5>Erwin Chargaff: base ratios</h5>
<p>Chargaff measured how much of each base was in DNA and found that <b>A always equals T</b> and <b>G always equals C</b>. It follows that the total purines (A + G) equal the total pyrimidines (T + C). The explanation is base pairing: the two strands are held together by hydrogen bonds between bases, and pairing is strict.</p>
<ul>
<li><b>A pairs only with T</b> through <b>2 hydrogen bonds</b> (A=T).</li>
<li><b>G pairs only with C</b> through <b>3 hydrogen bonds</b> (G≡C).</li>
<li>Because of the extra hydrogen bond, a G≡C pair is about <b>50% stronger</b> than an A=T pair. A DNA region rich in G and C is therefore harder to separate. Keep this in mind: it is why replication origins are <b>AT-rich</b> (easy to melt).</li>
</ul>
<div class="ex"><b>Worked example:</b> a DNA sample is 20% adenine. Then T = 20%, so A + T = 40%. The remaining 60% is G + C, split equally: G = 30% and C = 30%.</div>
<h5>Watson and Crick (1953): the model</h5>
<p>Watson and Crick combined Franklin's and Chargaff's data into one model: a <b>double helix</b> (a cylindrical spiral) of two polynucleotide chains running in <b>opposite directions</b>. One strand runs 5'→3' and its partner runs 3'→5'. This is called <b>antiparallel</b>. By convention a DNA sequence is always <b>read and written 5'→3'</b>.</p>

<h4>2. The chemistry of the chain</h4>
<p>The building block is the <b>nucleotide</b>. Learn the three levels of naming, because MCQs love to swap them:</p>
<ul>
<li><b>Nucleobase</b> = the nitrogenous base alone (A, G, C, T or U).</li>
<li><b>Nucleoside</b> = base + pentose sugar. The bond joining base to sugar is the <b>N-glycosidic bond</b>.</li>
<li><b>Nucleotide</b> = base + pentose + phosphate.</li>
</ul>
<p>Nucleotides join into a strand through <b>phosphodiester bonds</b>: a phosphate group links the <b>3'-OH</b> of one sugar to the <b>5'-OH</b> of the next sugar. That is where "5' end" and "3' end" come from. One end of every strand has a free 5'-phosphate, the other a free 3'-OH. The free 3'-OH matters a lot later, because enzymes can only add new nucleotides onto it.</p>
<p>The sugar differs between the two nucleic acids: <b>deoxyribose in DNA</b> (no OH at carbon 2') and <b>ribose in RNA</b>. DNA uses thymine; RNA uses uracil instead. DNA is double-stranded; RNA is usually single-stranded. The three main RNA types are mRNA (carries the code), tRNA (brings amino acids, has the anticodon) and rRNA (part of the ribosome).</p>

<h4>3. The three forms of DNA</h4>
<ul>
<li><b>B-DNA</b>: the common <b>right-handed</b> form found in cells, with high water content. Its base pairs lie flat, perpendicular to the helix axis, so proteins can easily reach and read them.</li>
<li><b>A-DNA</b>: also <b>right-handed</b>, but it appears under <b>dehydrating</b> conditions.</li>
<li><b>Z-DNA</b>: the rare <b>left-handed</b> form. Its helix is narrower and more elongated than A or B.</li>
</ul>
<div class="pearl"><strong>Exam trap:</strong> only Z-DNA is left-handed. A and B are both right-handed.</div>

<h4>4. Packing DNA into chromosomes</h4>
<p>Human DNA is about two metres long per cell, yet it fits inside a nucleus a few micrometres wide. It is packed in levels:</p>
<ol>
<li>About <b>146 base pairs</b> of DNA wrap around a core of <b>eight histone proteins</b> (the histone octamer). This unit is the <b>nucleosome</b>, the basic subunit of chromatin. Histones are <b>basic</b> (positively charged) proteins, which is why they grip the negatively charged phosphate backbone so tightly.</li>
<li>Strings of nucleosomes coil into a <b>chromatin fibre</b>.</li>
<li>The fibre is compacted further into a highly organised DNA–protein complex: the <b>chromosome</b>.</li>
</ol>
<p>A <b>gene</b> is a length of DNA that codes for a specific protein. DNA has two essential properties: it can <b>replicate</b> (copy itself), and it <b>codes for proteins</b> through RNA.</p>

<h4>5. Replication is semiconservative</h4>
<p>Three models were proposed for how DNA could be copied:</p>
<ul>
<li><b>Conservative</b>: the original double helix stays intact and a completely new one is made.</li>
<li><b>Semiconservative</b>: the two strands separate, each acts as a template, and every new double helix contains <b>one old strand and one new strand</b>.</li>
<li><b>Dispersive</b>: old and new DNA are mixed in fragments along both strands.</li>
</ul>
<p>The correct model is <b>semiconservative</b>. In each daughter molecule one parental strand is conserved.</p>

<h4>6. Step by step: how replication happens</h4>
<h5>Step 1: the origin of replication</h5>
<p>Replication starts at a specific nucleotide sequence called the <b>origin of replication</b>. It is a <b>consensus sequence</b>, meaning the order of nucleotides is essentially the same at every origin. It contains short <b>AT-rich</b> segments, which melt easily because A=T has only two hydrogen bonds. Prokaryotes have a <b>single origin</b>; eukaryotes, with much larger genomes, have <b>multiple origins</b> so the job finishes in time.</p>
<h5>Step 2: separating the strands (forming the replication fork)</h5>
<p>Four proteins work together here. Know each one's job:</p>
<ul>
<li><b>DnaA protein</b> binds the AT-rich sequences at the origin and starts melting them. It needs <b>ATP</b>.</li>
<li><b>DNA helicase</b> binds near the fork and moves into the double helix, unwinding it. It also needs <b>ATP</b>.</li>
<li><b>SSB proteins</b> (single-stranded DNA binding proteins) coat the exposed single strands. They keep the strands apart and protect them from nucleases.</li>
<li><b>Topoisomerases</b> solve a mechanical problem. Unwinding a twisted rope in one place makes it over-twist further along. In the same way, unwinding DNA creates <b>supercoils ahead of the fork</b>. Topoisomerases relieve these supercoils.</li>
</ul>
<h5>Step 3: making a primer</h5>
<p>DNA polymerase cannot start a strand from nothing. It can only add to an existing free 3'-OH. So the enzyme <b>primase</b> first lays down a short <b>RNA primer</b> of about <b>10 nucleotides</b>. That primer supplies the 3'-OH starting point.</p>
<h5>Step 4: the leading strand</h5>
<p><b>DNA polymerase III</b> adds deoxyribonucleotides (dNTPs) to the free 3'-OH of the primer. It reads the parent strand <b>3'→5'</b> and builds the new strand <b>5'→3'</b>. On one template this direction points toward the replication fork, so the polymerase can simply follow the fork as it opens. This is the <b>leading strand</b>: it is made <b>continuously</b> and needs only <b>one primer</b>, at its start.</p>
<h5>Step 5: the lagging strand</h5>
<p>The other template runs the opposite way. Since synthesis can only go 5'→3', the new strand on this side grows <b>away from the fork</b>. The polymerase must keep jumping back to the fork as more DNA is exposed and make short pieces. These pieces are <b>Okazaki fragments</b>, and the strand is the <b>lagging strand</b>. It is made <b>discontinuously</b>, and every fragment needs its <b>own primer</b>, so there are many primers.</p>
<h5>Step 6: removing primers</h5>
<p>DNA polymerase III keeps synthesising until it bumps into the next RNA primer. <b>DNA polymerase I</b> then removes the RNA primer with its <b>5'→3' exonuclease</b> activity and fills the gap with DNA using its <b>5'→3' polymerase</b> activity.</p>
<h5>Step 7: ligation</h5>
<p>A small break, a <b>nick</b>, remains between neighbouring fragments. <b>DNA ligase</b> seals it by making a phosphodiester bond between the 3'-OH of one fragment and the 5'-phosphate of the next. The energy comes from splitting <b>ATP into AMP + PPi</b>.</p>

<h4>7. Proofreading: why replication is so accurate</h4>
<p>As it builds, DNA polymerase III checks each nucleotide it has added. If the base is wrong, the enzyme steps back, removes it, and inserts the right one. This uses its <b>3'→5' exonuclease</b> activity, which is called <b>proofreading</b>.</p>
<div class="tblwrap"><table><tr><th>DNA polymerase III</th><th>DNA polymerase I</th></tr>
<tr><td>5'→3' polymerase: builds the new strand (main synthesis)</td><td>5'→3' exonuclease: removes RNA primers</td></tr>
<tr><td>3'→5' exonuclease: proofreading</td><td>5'→3' polymerase: fills the gaps</td></tr>
<tr><td></td><td>3'→5' exonuclease: proofreading</td></tr></table></div>
<p>Notice the direction tells you the job. <b>5'→3' exonuclease</b> chews from the front, which is how primers ahead of Pol I are removed. <b>3'→5' exonuclease</b> chews backwards from the growing end, which is how a mistake that was just added gets removed.</p>
<div class="pearl"><strong>Lecture question (order of enzymes):</strong> Helicase → Topoisomerase → Primase → DNA polymerase III → DNA polymerase I → Ligase.</div>
<div class="ex"><b>Group discussion from the lecture:</b> "DNA polymerase III functions in association with primase." This is true. Pol III cannot begin without the primer that primase makes, and on the lagging strand primase must work again and again, once for each Okazaki fragment.</div>
`,ar:`
<p>المحاضرة دي بتجاوب على سؤالين: <b>شكل الـ DNA عامل إزاي</b>، و<b>الخلية بتنسخه إزاي</b> قبل ما تنقسم؟ كل اللي جاي في الكورس (النسخ، الترجمة، تنظيم الجينات) مبني على الفكرتين دول، فمهم نفهمهم كويس مش نحفظهم بس.</p>

<h4>1. اكتشاف تركيب الـ DNA</h4>
<p>الحلزون المزدوج ما اكتشفهوش شخص واحد. تلات مجموعات كل واحدة ضافت حتة، والامتحان كتير بيسأل: مين العالم اللي وصل للاستنتاج ده؟</p>
<h5>Rosalind Franklin والأشعة السينية</h5>
<p>فرانكلين عدّت X-rays على ألياف DNA نقية ومترتبة. الذرات بتشتت الأشعة بنمط معين (diffraction pattern)، ومن النمط ده بنعرف أماكن الذرات. صورها أثبتت 3 حاجات:</p>
<ul>
<li>الـ <b>sugar–phosphate backbone برّه</b> الجزيء. ده منطقي لأن مجموعات الفوسفات مشحونة ومحبة للماء، فبتبص ناحية الوسط المائي.</li>
<li>القواعد النيتروجينية <b>جوّه</b>، لأنها حلقات مسطحة وكارهة للماء نسبيًا فبتستخبى في القلب.</li>
<li>الجزيء مكوَّن من <b>شريطين ملفوفين حلزوني</b>.</li>
</ul>
<h5>Erwin Chargaff ونسب القواعد</h5>
<p>شارجاف قاس كمية كل قاعدة ولقى إن <b>A دايمًا = T</b> و <b>G دايمًا = C</b>. وبالتالي مجموع الـ purines (A + G) = مجموع الـ pyrimidines (T + C). السبب هو التزاوج بين القواعد: الشريطين ماسكين في بعض بروابط هيدروجينية بين القواعد، والتزاوج ثابت:</p>
<ul>
<li><b>A مع T بس</b> بـ <b>رابطتين هيدروجين</b>.</li>
<li><b>G مع C بس</b> بـ <b>3 روابط هيدروجين</b>.</li>
<li>عشان الرابطة الزيادة، زوج G≡C أقوى بحوالي <b>50%</b> من A=T. فالمنطقة الغنية بـ GC أصعب في الفصل. خلي ده في دماغك: هو السبب إن أماكن بداية التضاعف بتكون <b>غنية بـ AT</b> (سهلة الفك).</li>
</ul>
<div class="ex"><b>مثال محلول:</b> عينة DNA فيها 20% أدينين. يبقى T = 20%، و A + T = 40%. الـ 60% الباقيين هما G + C بالتساوي: G = 30% و C = 30%.</div>
<h5>Watson و Crick سنة 1953</h5>
<p>جمعوا بيانات فرانكلين وشارجاف في موديل واحد: <b>حلزون مزدوج</b> (لولب أسطواني) من سلسلتين بيمشوا في <b>اتجاهين عكس بعض</b>، واحدة من 5' لـ 3' والتانية من 3' لـ 5'. ده اسمه <b>antiparallel</b>. وبالاتفاق، تسلسل الـ DNA <b>بيتقري ويتكتب دايمًا من 5' لـ 3'</b>.</p>

<h4>2. كيمياء السلسلة</h4>
<p>وحدة البناء هي الـ <b>nucleotide</b>. احفظي المستويات التلاتة للتسمية لأن أسئلة الـ MCQ بتبدّل بينهم:</p>
<ul>
<li><b>Nucleobase</b> = القاعدة النيتروجينية لوحدها (A أو G أو C أو T أو U).</li>
<li><b>Nucleoside</b> = قاعدة + سكر خماسي. الرابطة بين القاعدة والسكر اسمها <b>N-glycosidic bond</b>.</li>
<li><b>Nucleotide</b> = قاعدة + سكر + فوسفات.</li>
</ul>
<p>النيوكليوتيدات بتتوصل ببعض بـ <b>phosphodiester bonds</b>: مجموعة فوسفات بتربط الـ <b>3'-OH</b> بتاع سكر بالـ <b>5'-OH</b> بتاع السكر اللي بعده. ومن هنا جه اسم الطرف 5' والطرف 3'. كل شريط ليه طرف فيه فوسفات حر عند 5'، وطرف فيه OH حر عند 3'. الـ 3'-OH الحر ده مهم جدًا بعدين، لأن الإنزيمات ما تقدرش تضيف نيوكليوتيدات جديدة غير عليه.</p>
<p>السكر بيختلف: <b>deoxyribose في الـ DNA</b> (مفيش OH على كربون 2') و<b>ribose في الـ RNA</b>. الـ DNA فيه thymine، والـ RNA فيه uracil بداله. الـ DNA شريطين، والـ RNA غالبًا شريط واحد. أنواع الـ RNA الأساسية: mRNA (بيشيل الشفرة)، tRNA (بيجيب الأحماض الأمينية وفيه الـ anticodon)، و rRNA (جزء من الريبوسوم).</p>

<h4>3. أشكال الـ DNA التلاتة</h4>
<ul>
<li><b>B-DNA</b>: الشكل الشائع في الخلية، <b>يميني</b>، ومحتوى الماء فيه عالي. أزواج القواعد فيه أفقية (عمودية على محور الحلزون)، فالبروتينات توصلها وتقراها بسهولة.</li>
<li><b>A-DNA</b>: برضه <b>يميني</b>، بس بيظهر في ظروف <b>الجفاف</b>.</li>
<li><b>Z-DNA</b>: نادر و<b>يساري</b>، والحلزون فيه أرفع وأطول من A و B.</li>
</ul>
<div class="pearl"><strong>فخ في الامتحان:</strong> Z-DNA بس هو اليساري. A و B الاتنين يمينيين.</div>

<h4>4. تعبئة الـ DNA في الكروموسومات</h4>
<p>الـ DNA في الخلية الواحدة طوله حوالي 2 متر، ومع ذلك بيدخل في نواة قطرها كام ميكرومتر. ده بيحصل على مراحل:</p>
<ol>
<li>حوالي <b>146 زوج قاعدة</b> بيلفوا حوالين <b>8 بروتينات هستون</b> (histone octamer)، والوحدة دي اسمها <b>nucleosome</b>، وهي الوحدة الأساسية للكروماتين. الهستونات بروتينات <b>قاعدية</b> (موجبة الشحنة)، وده سبب إنها ماسكة جامد في الهيكل السالب بتاع الفوسفات.</li>
<li>سلاسل النيوكليوزومات بتلتف وتعمل <b>chromatin fibre</b>.</li>
<li>الليفة دي بتتضغط أكتر وتعمل تركيب منظم جدًا من DNA وبروتين اسمه <b>الكروموسوم</b>.</li>
</ol>
<p>الـ <b>gene</b> هو جزء من الـ DNA بيشفّر لبروتين معين. والـ DNA ليه خاصيتين أساسيتين: إنه <b>يتضاعف</b> (ينسخ نفسه)، وإنه <b>يشفّر للبروتينات</b> عن طريق الـ RNA.</p>

<h4>5. التضاعف نصف محافظ (semiconservative)</h4>
<p>كان فيه 3 نظريات لطريقة نسخ الـ DNA:</p>
<ul>
<li><b>Conservative</b>: الحلزون الأصلي يفضل زي ما هو، ويتعمل واحد جديد بالكامل.</li>
<li><b>Semiconservative</b>: الشريطين يتفصلوا، وكل واحد يبقى قالب، فكل جزيء جديد يبقى فيه <b>شريط قديم وشريط جديد</b>.</li>
<li><b>Dispersive</b>: القديم والجديد متلخبطين على شكل حتت على الشريطين.</li>
</ul>
<p>الصح هو <b>semiconservative</b>: في كل جزيء جديد، شريط واحد من الأصل بيتحفظ.</p>

<h4>6. خطوات التضاعف بالتفصيل</h4>
<h5>الخطوة 1: نقطة البداية (Origin of replication)</h5>
<p>التضاعف بيبدأ عند تسلسل معين اسمه <b>origin of replication</b>، وهو <b>consensus sequence</b> يعني ترتيب النيوكليوتيدات فيه تقريبًا ثابت في كل مكان. فيه أجزاء قصيرة <b>غنية بـ AT</b> بتتفك بسهولة لأن A=T ليها رابطتين بس. البكتيريا (prokaryotes) عندها <b>origin واحد</b>، والـ eukaryotes عندهم <b>origins كتير</b> لأن الجينوم كبير جدًا ولازم الشغل يخلص في وقته.</p>
<h5>الخطوة 2: فصل الشريطين (تكوين الـ replication fork)</h5>
<p>4 بروتينات بيشتغلوا مع بعض هنا، اعرفي شغل كل واحد:</p>
<ul>
<li><b>DnaA</b>: بيرتبط بالتسلسلات الغنية بـ AT عند الـ origin ويبدأ يفكها، ومحتاج <b>ATP</b>.</li>
<li><b>Helicase</b>: بيرتبط جنب الـ fork ويدخل في الحلزون ويفكه، ومحتاج <b>ATP</b> برضه.</li>
<li><b>SSB proteins</b>: بتغطي الشرايط المفردة المكشوفة، فتمنعهم يرجعوا يلزقوا وتحميهم من الـ nucleases.</li>
<li><b>Topoisomerase</b>: بيحل مشكلة ميكانيكية. لو فكيتي حبل ملفوف من حتة، الالتواء بيزيد في الحتة اللي قدامها. بنفس الطريقة، فك الـ DNA بيعمل <b>supercoils قدام الـ fork</b>، والـ topoisomerase بيشيلهم.</li>
</ul>
<h5>الخطوة 3: عمل الـ primer</h5>
<p>الـ DNA polymerase ما يقدرش يبدأ شريط من الصفر، لازم يضيف على 3'-OH موجود. فإنزيم <b>primase</b> بيحط الأول <b>RNA primer</b> قصير حوالي <b>10 نيوكليوتيدات</b>، وده بيدي نقطة البداية.</p>
<h5>الخطوة 4: الـ Leading strand</h5>
<p>الـ <b>DNA polymerase III</b> بيضيف dNTPs على الـ 3'-OH بتاع الـ primer. بيقرا الشريط الأصلي من <b>3' لـ 5'</b> ويبني الجديد من <b>5' لـ 3'</b>. على أحد القالبين الاتجاه ده رايح ناحية الـ fork، فالإنزيم بيمشي ورا الـ fork وهي بتتفتح. ده الـ <b>leading strand</b>: بيتعمل <b>بشكل مستمر</b> ومحتاج <b>primer واحد بس</b> في أوله.</p>
<h5>الخطوة 5: الـ Lagging strand</h5>
<p>القالب التاني اتجاهه عكس. وبما إن البناء لازم يكون من 5' لـ 3'، الشريط الجديد هنا بيكبر <b>بعيد عن الـ fork</b>. فالإنزيم لازم يرجع للـ fork كل ما جزء جديد يتكشف ويعمل حتت قصيرة اسمها <b>Okazaki fragments</b>، والشريط ده اسمه <b>lagging strand</b>. بيتعمل <b>بشكل متقطع</b>، وكل حتة محتاجة <b>primer خاص بيها</b>، فبيبقى فيه primers كتير.</p>
<h5>الخطوة 6: شيل الـ primers</h5>
<p>الـ Pol III بيفضل يبني لحد ما يخبط في الـ primer اللي بعده. وقتها <b>DNA polymerase I</b> بيشيل الـ RNA primer بنشاط الـ <b>5'→3' exonuclease</b>، ويملا الفراغ بـ DNA بنشاط الـ <b>5'→3' polymerase</b>.</p>
<h5>الخطوة 7: اللحام (Ligation)</h5>
<p>بيفضل فيه قطع صغير اسمه <b>nick</b> بين كل حتتين. إنزيم <b>DNA ligase</b> بيقفله بعمل رابطة phosphodiester بين الـ 3'-OH والـ 5'-phosphate، والطاقة بتيجي من تكسير <b>ATP لـ AMP + PPi</b>.</p>

<h4>7. التصحيح (Proofreading): ليه النسخ دقيق جدًا؟</h4>
<p>وهو بيبني، الـ Pol III بيراجع كل نيوكليوتيد ضافه. لو القاعدة غلط، بيرجع خطوة ويشيلها ويحط الصح. ده بيحصل بنشاط الـ <b>3'→5' exonuclease</b> واسمه <b>proofreading</b>.</p>
<div class="tblwrap"><table><tr><th>DNA polymerase III</th><th>DNA polymerase I</th></tr>
<tr><td>5'→3' polymerase: builds the new strand</td><td>5'→3' exonuclease: removes RNA primers</td></tr>
<tr><td>3'→5' exonuclease: proofreading</td><td>5'→3' polymerase: fills the gaps</td></tr>
<tr><td></td><td>3'→5' exonuclease: proofreading</td></tr></table></div>
<p>لاحظي إن الاتجاه بيقولك الوظيفة: الـ <b>5'→3' exonuclease</b> بياكل من قدام، وده اللي بيشيل الـ primers. الـ <b>3'→5' exonuclease</b> بياكل لورا من الطرف اللي بيكبر، وده اللي بيشيل الغلطة اللي لسه متضافة.</p>
<div class="pearl"><strong>سؤال المحاضرة (ترتيب الإنزيمات):</strong> Helicase → Topoisomerase → Primase → Pol III → Pol I → Ligase</div>
<div class="ex"><b>مناقشة من المحاضرة:</b> "الـ DNA polymerase III بيشتغل مع إنزيم primase". العبارة دي صح: الـ Pol III ما يقدرش يبدأ من غير الـ primer اللي بيعمله الـ primase، وعلى الـ lagging strand الـ primase لازم يشتغل تاني وتالت، مرة لكل Okazaki fragment.</div>

DEEP.genetics[2]={en:`
<p>Lecture 2 has two halves. The first finishes replication with a problem that only linear chromosomes have, the <b>end replication problem</b>, and the enzyme that solves it, <b>telomerase</b>. The second half starts the next step of gene expression: <b>transcription</b>, copying DNA into RNA.</p>

<h4>1. The end replication problem</h4>
<p>DNA polymerases have two limitations you already met in Lecture 1:</p>
<ol>
<li>They synthesise DNA <b>only in the 5'→3' direction</b>.</li>
<li>They <b>cannot start</b> a new chain; they need a primer with a free 3'-OH.</li>
</ol>
<p>Together these cause trouble at the very end of a <b>linear</b> chromosome, on the <b>lagging strand</b>. When the last RNA primer at the tip is removed, there is no upstream DNA with a 3'-OH that DNA polymerase I could extend to fill that gap. The extreme 3' end of the template is therefore never copied. Each round of replication loses a little DNA from the chromosome ends. If nothing stopped this, chromosomes would get shorter with every cell division until genes themselves were lost.</p>
<div class="pearl"><strong>Why bacteria don't have this problem:</strong> their chromosome is circular, so there is no "end" to lose.</div>

<h4>2. Telomeres: protective caps</h4>
<p>Linear eukaryotic chromosomes carry <b>telomeres</b> at both ends. Their functions:</p>
<ul>
<li>They act as a <b>cap</b> of DNA sequence at the chromosome tip.</li>
<li>They <b>separate chromosomes</b> from each other and stop them fusing end to end.</li>
<li>They protect the chromosome tips from <b>trimming and shortening</b>. Losing a few telomere repeats does no harm, because they don't code for anything.</li>
<li>Without telomeres, the cell suffers <b>genomic instability</b>.</li>
</ul>
<h5>Structure</h5>
<ul>
<li>Moderately repetitive <b>tandem repeats of TTAGGG</b> (TTAGGGTTAGGGTTAGGG…).</li>
<li>A single-stranded <b>3' overhang 12–16 nucleotides long</b>.</li>
<li>Humans have 46 chromosomes, each with two ends, so <b>92 telomeres</b>.</li>
</ul>

<h4>3. Telomerase: how the cell fixes it</h4>
<p>The cell adds new telomeric repeats onto the chromosome ends with the enzyme <b>telomerase</b>. Telomerase is made of <b>protein + RNA</b>. Its RNA is complementary to the telomere repeat, so it can base-pair with the last nucleotides of the 3' overhang and use itself as a template.</p>
<p>Telomerase has two special features:</p>
<ul>
<li>It carries its <b>own RNA sequence</b> (the template).</li>
<li>It works as a <b>reverse transcriptase</b>: it synthesises <b>DNA from an RNA template</b>, the reverse of normal transcription.</li>
</ul>
<p>It works in a repeating three-step cycle:</p>
<ol>
<li><b>Binding</b>: the telomerase RNA pairs with the end of the 3' overhang.</li>
<li><b>Polymerisation</b>: it copies its RNA template, adding a new TTAGGG repeat to the DNA 3' end.</li>
<li><b>Translocation</b>: it slides along to the new end and repeats.</li>
</ol>
<p>Once the overhang has been lengthened, primase and DNA polymerase can fill in the complementary strand in the normal way.</p>

<h4>4. Telomeres, ageing and cancer</h4>
<p>Most of our cells have <b>too little telomerase</b>, so telomeres shorten as cells divide: about <b>10,000 bp at birth</b> down to about <b>5,000 bp</b> late in life.</p>
<ul>
<li><b>Ageing</b>: short telomeres make cells age and can trigger apoptosis-mediated inflammation. Age-related telomerase dysregulation also causes <b>mitochondrial dysfunction</b> and more <b>oxidative stress</b>, independent of telomere length. The end result is tissue dysfunction and chronic disease with age.</li>
<li>High telomerase keeps telomeres long and <b>delays cellular ageing</b>.</li>
<li>Most normal cells divide rarely, so they don't need high telomerase.</li>
<li><b>Cancer cells</b> divide endlessly yet keep their telomeres, because they often have <b>high telomerase activity</b>. This makes telomerase a possible <b>drug target</b>. Studies are underway, including clinical trials of <b>vaccines against cells with high telomerase activity</b>.</li>
</ul>
<div class="ex"><b>Group activity logic:</b> if a diagram shows a cell line whose telomeres stay the same length over many divisions, expect <b>high telomerase</b> (for example, cancer or stem cells). If telomeres shorten each division, expect <b>low telomerase</b> (normal somatic cells).</div>
<p><b>Nobel Prize 2009</b> (Physiology or Medicine): Elizabeth Blackburn, Carol Greider and Jack Szostak, "for the discovery of how chromosomes are protected by telomeres and the enzyme telomerase."</p>

<h4>5. What transcription is</h4>
<p>"Transcription" literally means making a copy. In genetics it is <b>copying a DNA sequence into an RNA sequence</b>. The DNA is not changed by the process. For protein-coding genes, the enzyme is <b>RNA polymerase II</b> and the product is mRNA.</p>
<h5>Which strand is copied?</h5>
<ul>
<li>The <b>template (antisense) strand</b> is the one that is actually read. The RNA is <b>complementary</b> to it.</li>
<li>The <b>coding (sense) strand</b> is <b>not transcribed</b>, but its sequence is the <b>same as the mRNA</b>, just with T where the RNA has U.</li>
<li>RNA polymerase slides along the template <b>3'→5'</b> and builds RNA <b>5'→3'</b>, the same rule as DNA polymerase.</li>
<li>Which DNA strand serves as template <b>varies from gene to gene</b>.</li>
</ul>
<div class="ex"><b>Example:</b> template strand 3'-TACGGA-5'. The mRNA is 5'-AUGCCU-3', and the coding strand is 5'-ATGCCT-3'.</div>
<h5>Types of RNA transcript</h5>
<p>Over 90% of genes are <b>structural genes</b>: their transcript is <b>mRNA</b>, which is translated into a polypeptide. Transcripts from non-structural genes are not translated but still do important jobs, often as part of RNA–protein complexes such as <b>ribosomes</b>, <b>spliceosomes</b> and <b>signal recognition particles</b>.</p>
<h5>The three nuclear RNA polymerases</h5>
<div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr>
<tr><td>RNA pol I</td><td>All rRNA genes <b>except 5S rRNA</b></td></tr>
<tr><td>RNA pol II</td><td>All <b>structural genes</b> (so all mRNA) and some snRNA</td></tr>
<tr><td>RNA pol III</td><td>All <b>tRNA</b> genes and the <b>5S rRNA</b> gene</td></tr></table></div>

<h4>6. Key DNA elements for transcription</h4>
<ul>
<li><b>Promoter</b>: where RNA polymerase binds; it signals the <b>start</b>.</li>
<li><b>Terminator</b>: signals the <b>end</b>.</li>
<li><b>Regulatory sequences</b>: where regulatory proteins bind to control how much the gene is expressed.</li>
</ul>
<h5>Parts of a eukaryotic gene</h5>
<ol>
<li><b>Exons</b>: coding sequences that end up in the mRNA and join together to code the correct amino acids.</li>
<li><b>Introns</b>: non-coding sequences between exons. All introns start with <b>GT</b> at their 5' end and end with <b>AG</b> at their 3' end. These are the signals the splicing machinery recognises (Lecture 3).</li>
<li><b>Promoter</b> (upstream) with two consensus sequences:
<ul><li><b>TATA box</b>: usually about <b>15–30 bp upstream</b> of the start site. <b>Transcription factors</b> bind here and help RNA polymerase II bind.</li>
<li><b>CAAT box</b>: sets <b>how often</b> transcription starts. Mutations here cut transcription starts <b>10–20 fold</b>.</li></ul></li>
<li><b>Enhancers and silencers</b>: regulatory sequences that can be upstream or downstream, near or far from the gene. <b>Activators</b> bind enhancers and <b>increase</b> the rate; <b>repressors</b> bind silencers and <b>reduce</b> it.</li>
<li><b>Upstream</b> non-coding region (5' side): where the <b>cap</b> will be added.</li>
<li><b>Downstream</b> non-coding region (3' side): where the <b>poly-A tail</b> will be added.</li>
<li><b>Terminator</b> sequences.</li>
</ol>
<h5>Cis versus trans</h5>
<ul>
<li><b>Cis-acting elements</b> are <b>DNA sequences</b> that affect only nearby genes on the same molecule: TATA box, enhancers, silencers.</li>
<li><b>Trans-acting elements</b> are <b>proteins</b> (made from other genes) that bind those sequences.</li>
</ul>
<div class="pearl"><strong>Memory hook:</strong> cis = the "site" on the DNA; trans = the "travelling" protein that comes to it.</div>

<h4>7. The three stages of transcription</h4>
<h5>Initiation</h5>
<p>Basal transcription needs three groups of proteins: <b>RNA polymerase II</b>, five <b>general transcription factors</b> (GTFs), and a complex called <b>mediator</b>. Together with the promoter they form the <b>initiation complex</b>.</p>
<ul>
<li><b>TFIID</b> = TBP (TATA-binding protein) + TAFs (TBP-associated factors). It <b>recognises the core promoter</b>.</li>
<li><b>TFIIB</b> binds TFIID and acts as a <b>bridge</b> to bring in RNA polymerase II.</li>
<li><b>TFIIF</b> travels together with RNA polymerase II.</li>
<li><b>TFIIH</b> turns the <b>closed complex</b> into an <b>open complex</b>. Some of its subunits are <b>helicases</b> that unwind the DNA. Another subunit hydrolyses ATP and <b>phosphorylates the carboxyl-terminal domain (CTD)</b> of RNA pol II, which breaks its contact with TFIIB and frees it to move.</li>
<li><b>TFIIE</b> helps the <b>transition from initiation to elongation</b>.</li>
</ul>
<p>Most of these factors are released once the open complex forms, and RNA pol II proceeds to elongation.</p>
<h5>Elongation</h5>
<p>RNA polymerase II moves downstream, unwinding <b>10–20 bases at a time</b> so ribonucleotides can pair with the exposed template.</p>
<h5>Termination</h5>
<p>Pol II transcribes a sequence that gives the <b>poly-A signal AAUAAA</b> in the pre-mRNA. About <b>10–35 nucleotides downstream</b> of that signal, proteins cut the RNA free. Pol II keeps going for a few hundred more nucleotides and then detaches from the DNA.</p>
<div class="pearl"><strong>Exam favourite:</strong> TFIIH = helicase + phosphorylates the CTD. TFIID = recognises the promoter (TBP binds the TATA box). TFIIB = bridge to pol II.</div>

<p>المحاضرة دي نصّين. النص الأول بيكمّل التضاعف بمشكلة موجودة بس في الكروموسومات الخطية، اسمها <b>end replication problem</b>، والإنزيم اللي بيحلها: <b>telomerase</b>. والنص التاني بيبدأ الخطوة اللي بعد كده في التعبير الجيني: <b>النسخ (transcription)</b>، يعني نسخ الـ DNA لـ RNA.</p>

<h4>1. مشكلة نهاية التضاعف</h4>
<p>الـ DNA polymerase عنده عيبين شفناهم في محاضرة 1:</p>
<ol>
<li>بيبني <b>من 5' لـ 3' بس</b>.</li>
<li><b>ما يقدرش يبدأ</b> سلسلة جديدة، لازم primer فيه 3'-OH حر.</li>
</ol>
<p>العيبين دول مع بعض بيعملوا مشكلة في آخر طرف الكروموسوم <b>الخطي</b>، على الـ <b>lagging strand</b>. لما آخر RNA primer عند الطرف يتشال، مفيش DNA قبله فيه 3'-OH يقدر الـ Pol I يكمّل منه ويملا الفراغ. فآخر جزء عند الطرف 3' عمره ما بيتنسخ، وكل دورة تضاعف بنخسر حتة صغيرة من أطراف الكروموسوم. لو مفيش حاجة وقفت ده، الكروموسومات هتقصر مع كل انقسام لحد ما الجينات نفسها تضيع.</p>
<div class="pearl"><strong>ليه البكتيريا ما عندهاش المشكلة دي؟</strong> لأن الكروموسوم بتاعها دائري، فمفيش "طرف" يضيع.</div>

<h4>2. الـ Telomeres: غطا الحماية</h4>
<p>الكروموسومات الخطية في الـ eukaryotes عندها <b>تيلوميرات</b> في الطرفين. وظايفها:</p>
<ul>
<li>بتعمل <b>غطا</b> من تسلسل DNA على طرف الكروموسوم.</li>
<li>بتفصل الكروموسومات عن بعض وبتمنعها <b>تلزق في بعض</b> من الأطراف.</li>
<li>بتحمي أطراف الكروموسوم من <b>القص والقِصَر</b>. لو ضاع كام تكرار من التيلومير مش مشكلة، لأنها مش بتشفّر لحاجة.</li>
<li>من غيرها الخلية بيحصل فيها <b>genomic instability</b> (عدم استقرار الجينوم).</li>
</ul>
<h5>التركيب</h5>
<ul>
<li>تكرارات ورا بعض من <b>TTAGGG</b>.</li>
<li>طرف مفرد بارز عند <b>3' طوله 12–16 نيوكليوتيد</b>.</li>
<li>الإنسان عنده 46 كروموسوم، لكل واحد طرفين، يعني <b>92 تيلومير</b>.</li>
</ul>

<h4>3. الـ Telomerase: الخلية بتحل المشكلة إزاي</h4>
<p>الخلية بتضيف تكرارات جديدة على أطراف الكروموسوم بإنزيم <b>telomerase</b>. الإنزيم ده مكوَّن من <b>بروتين + RNA</b>. الـ RNA بتاعه مكمّل لتكرار التيلومير، فيقدر يتزاوج مع آخر نيوكليوتيدات في الطرف 3' البارز ويستخدم نفسه كقالب.</p>
<p>ليه ميزتين خاصين:</p>
<ul>
<li>شايل <b>RNA خاص بيه</b> (القالب).</li>
<li>بيشتغل كـ <b>reverse transcriptase</b>: يعني بيعمل <b>DNA من قالب RNA</b>، عكس النسخ العادي.</li>
</ul>
<p>وبيشتغل في دورة من 3 خطوات بتتكرر:</p>
<ol>
<li><b>Binding</b>: الـ RNA بتاع الإنزيم يتزاوج مع آخر الطرف البارز.</li>
<li><b>Polymerization</b>: ينسخ القالب ويضيف تكرار TTAGGG جديد على طرف 3'.</li>
<li><b>Translocation</b>: يتزحلق للطرف الجديد ويعيد تاني.</li>
</ol>
<p>بعد ما الطرف البارز يطول، الـ primase والـ DNA polymerase يقدروا يملوا الشريط المكمّل بالطريقة العادية.</p>

<h4>4. التيلوميرات والشيخوخة والسرطان</h4>
<p>معظم خلايانا فيها <b>تيلوميراز قليل</b>، فالتيلوميرات بتقصر مع الانقسام: حوالي <b>10,000 bp عند الولادة</b> لحد حوالي <b>5,000 bp</b> في آخر العمر.</p>
<ul>
<li><b>الشيخوخة</b>: التيلوميرات القصيرة بتخلي الخلايا تعجّز وممكن تعمل التهاب عن طريق الـ apoptosis. كمان اضطراب التيلوميراز مع السن بيعمل <b>خلل في الميتوكوندريا</b> و<b>oxidative stress</b> أكتر، بغض النظر عن طول التيلومير. والنتيجة خلل في الأنسجة وأمراض مزمنة مع السن.</li>
<li>التيلوميراز العالي بيحافظ على طول التيلوميرات وبيأخّر شيخوخة الخلية.</li>
<li>معظم الخلايا العادية نادرًا ما بتنقسم، فمش محتاجة تيلوميراز عالي.</li>
<li><b>الخلايا السرطانية</b> بتنقسم من غير نهاية ومع ذلك محافظة على تيلوميراتها، لأن غالبًا التيلوميراز فيها <b>عالي</b>. عشان كده التيلوميراز ممكن يبقى <b>هدف للأدوية</b>، وفيه دراسات شغالة منها تجارب إكلينيكية لـ <b>لقاحات ضد الخلايا اللي فيها تيلوميراز عالي</b>.</li>
</ul>
<div class="ex"><b>منطق النشاط الجماعي:</b> لو الرسمة بتوضح خلايا التيلوميرات فيها ثابتة الطول على انقسامات كتير، توقّعي <b>تيلوميراز عالي</b> (زي السرطان أو الخلايا الجذعية). ولو بتقصر مع كل انقسام، يبقى <b>تيلوميراز قليل</b> (خلايا جسدية عادية).</div>
<p><b>نوبل 2009</b>: Elizabeth Blackburn و Carol Greider و Jack Szostak، لاكتشاف إزاي التيلوميرات وإنزيم التيلوميراز بيحموا الكروموسومات.</p>

<h4>5. يعني إيه Transcription؟</h4>
<p>الكلمة معناها "عمل نسخة". في الجينات معناها <b>نسخ تسلسل DNA لتسلسل RNA</b>، والـ DNA نفسه ما بيتغيرش. في الجينات اللي بتشفّر لبروتين، الإنزيم هو <b>RNA polymerase II</b> والناتج mRNA.</p>
<h5>أنهي شريط بيتنسخ؟</h5>
<ul>
<li>الـ <b>template (antisense) strand</b> هو اللي بيتقري فعلًا، والـ RNA <b>مكمّل</b> ليه.</li>
<li>الـ <b>coding (sense) strand</b> <b>مش بيتنسخ</b>، بس تسلسله <b>زي الـ mRNA بالظبط</b> ما عدا إن فيه T مكان U.</li>
<li>الـ RNA polymerase بيتزحلق على القالب من <b>3' لـ 5'</b> ويبني الـ RNA من <b>5' لـ 3'</b>، نفس قاعدة الـ DNA polymerase.</li>
<li>أنهي شريط يبقى القالب ده <b>بيختلف من جين للتاني</b>.</li>
</ul>
<div class="ex"><b>مثال:</b> الـ template: <bdi>3'-TACGGA-5'</bdi>، يبقى الـ mRNA: <bdi>5'-AUGCCU-3'</bdi>، والـ coding strand: <bdi>5'-ATGCCT-3'</bdi>.</div>
<h5>أنواع الـ RNA الناتج</h5>
<p>أكتر من 90% من الجينات <b>structural genes</b>: ناتجها <b>mRNA</b> بيتترجم لسلسلة ببتيد. الجينات التانية ناتجها مش بيتترجم بس ليه وظايف مهمة، غالبًا جزء من مركّبات RNA وبروتين زي <b>الريبوسومات</b> و<b>الـ spliceosomes</b> و<b>signal recognition particles</b>.</p>
<h5>إنزيمات الـ RNA polymerase التلاتة في النواة</h5>
<div class="tblwrap"><table><tr><th>Enzyme</th><th>Transcribes</th></tr>
<tr><td>RNA pol I</td><td>All rRNA genes except 5S rRNA</td></tr>
<tr><td>RNA pol II</td><td>All structural genes (all mRNA) and some snRNA</td></tr>
<tr><td>RNA pol III</td><td>All tRNA genes and the 5S rRNA gene</td></tr></table></div>

<h4>6. عناصر الـ DNA المهمة في النسخ</h4>
<ul>
<li><b>Promoter</b>: مكان ارتباط الـ RNA polymerase، وبيدي إشارة <b>البداية</b>.</li>
<li><b>Terminator</b>: إشارة <b>النهاية</b>.</li>
<li><b>Regulatory sequences</b>: أماكن ارتباط البروتينات المنظِّمة اللي بتتحكم في كمية التعبير.</li>
</ul>
<h5>أجزاء الجين في الـ eukaryotes</h5>
<ol>
<li><b>Exons</b>: تسلسلات بتشفّر، بتوصل للـ mRNA وبتتوصل ببعض عشان تدي الأحماض الأمينية الصح.</li>
<li><b>Introns</b>: تسلسلات مش بتشفّر بين الـ exons. كل الـ introns بتبدأ بـ <b>GT</b> عند 5' وبتنتهي بـ <b>AG</b> عند 3'، ودي الإشارات اللي ماكينة الـ splicing بتتعرف عليها (محاضرة 3).</li>
<li><b>Promoter</b> (قبل الجين) وفيه تسلسلين ثابتين:
<ul><li><b>TATA box</b>: غالبًا على بعد <b>15–30 bp قبل</b> نقطة البداية. الـ <b>transcription factors</b> بترتبط هنا وبتساعد الـ RNA pol II يرتبط.</li>
<li><b>CAAT box</b>: بيحدد <b>بيبدأ النسخ قد إيه</b>. الطفرات فيه بتقلل مرات البداية <b>10–20 مرة</b>.</li></ul></li>
<li><b>Enhancers و silencers</b>: تسلسلات تنظيمية ممكن تكون قبل أو بعد الجين، قريبة أو بعيدة. الـ <b>activators</b> بترتبط بالـ enhancers و<b>بتزوّد</b> المعدل، والـ <b>repressors</b> بترتبط بالـ silencers و<b>بتقلله</b>.</li>
<li>منطقة <b>upstream</b> (ناحية 5'): مكان إضافة الـ <b>cap</b>.</li>
<li>منطقة <b>downstream</b> (ناحية 3'): مكان إضافة الـ <b>poly-A tail</b>.</li>
<li>تسلسلات الـ <b>terminator</b>.</li>
</ol>
<h5>Cis مقابل Trans</h5>
<ul>
<li><b>Cis-acting elements</b> = <b>تسلسلات DNA</b> بتأثر بس على الجينات القريبة على نفس الجزيء: TATA box و enhancers و silencers.</li>
<li><b>Trans-acting elements</b> = <b>بروتينات</b> (جاية من جينات تانية) بترتبط بالتسلسلات دي.</li>
</ul>
<div class="pearl"><strong>طريقة للحفظ:</strong> cis = "المكان" على الـ DNA، و trans = البروتين "اللي بيسافر" ويجيله.</div>

<h4>7. مراحل النسخ التلاتة</h4>
<h5>البداية (Initiation)</h5>
<p>النسخ الأساسي محتاج 3 مجموعات بروتين: <b>RNA polymerase II</b>، و5 <b>general transcription factors</b>، ومركّب اسمه <b>mediator</b>. ومع الـ promoter بيعملوا الـ <b>initiation complex</b>.</p>
<ul>
<li><b>TFIID</b> = TBP (البروتين اللي بيرتبط بالـ TATA box) + TAFs. وظيفته <b>يتعرف على الـ promoter</b>.</li>
<li><b>TFIIB</b> بيرتبط بـ TFIID وبيعمل <b>كوبري</b> يجيب الـ RNA pol II.</li>
<li><b>TFIIF</b> بيكون ماشي مع الـ RNA pol II.</li>
<li><b>TFIIH</b> بيحوّل الـ <b>closed complex</b> لـ <b>open complex</b>: بعض أجزائه <b>helicases</b> بتفك الـ DNA، وجزء تاني بيكسر ATP ويعمل <b>phosphorylation للـ CTD</b> بتاع الـ pol II، فيفك ارتباطه بـ TFIIB ويخليه حر يتحرك.</li>
<li><b>TFIIE</b> بيساعد في <b>الانتقال من البداية للاستطالة</b>.</li>
</ul>
<p>معظم العوامل دي بتتساب بعد ما الـ open complex يتكوّن، والـ pol II يكمّل للاستطالة.</p>
<h5>الاستطالة (Elongation)</h5>
<p>الـ pol II بيتحرك لقدام وبيفك <b>10–20 قاعدة كل مرة</b> عشان الـ ribonucleotides تتزاوج مع القالب المكشوف.</p>
<h5>النهاية (Termination)</h5>
<p>الـ pol II بينسخ تسلسل بيدي <b>إشارة الـ poly-A: AAUAAA</b> في الـ pre-mRNA. وبعدها بحوالي <b>10–35 نيوكليوتيد</b> بروتينات بتقطع الـ RNA وتحرره. الـ pol II بيكمّل كام مية نيوكليوتيد كمان وبعدين يسيب الـ DNA.</p>
<div class="pearl"><strong>بيتسأل كتير:</strong> TFIIH = helicase + فسفرة الـ CTD. TFIID = التعرف على الـ promoter (الـ TBP بيرتبط بالـ TATA box). TFIIB = الكوبري للـ pol II.</div>
